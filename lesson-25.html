.stamp{display:inline-block;font-family:var(--disp);font-size:clamp(16px,1.6vw,22px);color:var(--gold);border:2px solid rgba(255,200,97,.6);border-radius:12px;padding:4px 14px;letter-spacing:.04em}
.hl{color:#fff;background:linear-gradient(transparent 58%, rgba(255,200,97,.42) 58%);border-radius:3px;padding:0 2px;font-weight:800;cursor:pointer;border:0;font:inherit}
.hl.cur{background:linear-gradient(transparent 0%, rgba(255,200,97,.36) 0%);outline:2px solid var(--gold);outline-offset:1px}
.hl.seen{background:linear-gradient(transparent 58%, rgba(95,224,168,.42) 58%)}

/* ════════ SCENE ART (illustrated tableaux) ════════ */
.scene{position:relative;aspect-ratio:8/3;width:min(100%,calc(var(--sh,36vh) * 8 / 3));margin-inline:auto;border-radius:28px;overflow:hidden;container-type:inline-size;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.45);background:#0E1838}
.scene.sq{aspect-ratio:4/3;width:min(100%,calc(var(--sh,40vh) * 4 / 3))}
.scene svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* photo scenes: soft reveal, slow Ken Burns drift, one light sweep */
.scene.photo{background:#0B1430}
.scene.photo img.art{transform-origin:var(--kbo,50% 55%);animation:photoin 1.1s ease both, kb 26s 1.1s ease-in-out infinite alternate}
@keyframes photoin{from{opacity:0;filter:blur(8px) saturate(.6);transform:scale(1.03)}to{opacity:1;filter:none;transform:scale(1)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.035) translate(-.5%,-.4%)}}
.scene.photo::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,244,220,.20) 48%,transparent 62%);transform:translateX(-110%);animation:sweep 1.8s .5s ease-out both}
@keyframes sweep{to{transform:translateX(110%)}}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx .glow{position:absolute;width:var(--w,14cqw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,236,190,.55) 0,rgba(255,200,120,.22) 35%,rgba(255,180,90,0) 68%);mix-blend-mode:screen;animation:glowp var(--t,4.5s) ease-in-out var(--d,0s) infinite}
@keyframes glowp{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
.fx .sun{--w:26cqw;background:radial-gradient(circle,rgba(255,240,200,.7) 0,rgba(255,170,90,.28) 30%,rgba(255,140,80,0) 66%);--t:6s}
.fx .tw{position:absolute;width:1.6cqw;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#FFF6D8 0,rgba(255,214,140,.7) 25%,rgba(255,200,120,0) 70%);mix-blend-mode:screen;animation:tw var(--t,2.6s) ease-in-out var(--d,0s) infinite}
@keyframes tw{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.7)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}}
.fx .dust{position:absolute;bottom:-4%;width:.5cqw;aspect-ratio:1;border-radius:50%;background:#FFE7B0;box-shadow:0 0 1cqw #FFD27A;opacity:0;animation:dust var(--t,9s) linear var(--d,0s) infinite}
@keyframes dust{0%{opacity:0;transform:translate(0,0)}15%{opacity:.85}85%{opacity:.6}100%{opacity:0;transform:translate(var(--dx,3cqw),-38cqw)}}
.fx .warm{position:absolute;inset:0;background:radial-gradient(70% 90% at var(--sx,40%) 25%,rgba(255,170,90,.22),transparent 70%);mix-blend-mode:soft-light;animation:glowp2 7s ease-in-out infinite}
@keyframes glowp2{0%,100%{opacity:.6}50%{opacity:1}}
.fx .heart{position:absolute;left:50%;top:48%;font-size:22cqw;line-height:1;color:#fff;text-shadow:0 0 6cqw rgba(255,80,120,.6);transform:translate(-50%,-50%) scale(0);opacity:0;animation:heart 1.6s 1.4s cubic-bezier(.2,1.6,.4,1) both}
@keyframes heart{0%{transform:translate(-50%,-50%) scale(0);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:.95}45%{transform:translate(-50%,-50%) scale(.95)}70%{opacity:.9}100%{transform:translate(-50%,-62%) scale(1);opacity:0}}
.post .acts .lk{display:inline-block;animation:like .5s 2s cubic-bezier(.2,1.8,.4,1) both}
@keyframes like{from{transform:scale(1)}50%{transform:scale(1.5)}to{transform:scale(1);color:#FF3B5C}}
.scene .bubble.at{bottom:auto;transform:none}
.scene .bubble.at::after{left:-.65cqw;top:50%;bottom:auto;border:.7cqw solid transparent;border-right-color:#fff;border-left:0;transform:translateY(-50%)}
.scene .bubble.think.at::after{border-right-color:rgba(255,255,255,.92)}
#sky .l.title{background:#060A18}
#sky .l.title .tbg{position:absolute;inset:-3%;background-size:cover;background-position:center 35%;animation:kb 30s ease-in-out infinite alternate}
#sky .l.title::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 42%,rgba(6,10,24,.55),rgba(6,10,24,.88) 100%),linear-gradient(180deg,rgba(6,10,24,.35),rgba(6,10,24,.85))}
body[data-sky="title"] #sky .title{opacity:1}
body[data-sky="title"] #sky svg.bgart, body[data-sky="title"] #sky .beam{display:none}
#sky .l .pbg{position:absolute;inset:0;background-size:cover;background-position:center bottom}
body.photobg #sky svg.bgart, body.photobg #sky .beam, body.photobg #sky .sun, body.photobg #sky .stars{display:none}
/* photo page backgrounds: slow drift + darkening so text stays readable over them */
#sky .l .pbg{inset:-2%;animation:bgdrift 40s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.05) translate(-1%,-.6%)}}
#sky .l:has(.pbg)::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,24,var(--dt,.55)) 0%,rgba(6,10,24,var(--dm,.45)) 45%,rgba(6,10,24,var(--db,.78)) 100%)}
#sky .l.morning, #sky .l.day{--dt:.5;--dm:.42;--db:.7}
#sky .l.afternoon{--dt:.6;--dm:.5;--db:.8}
#sky .l.golden{--dt:.55;--dm:.42;--db:.8}
#sky .l.night{--dt:.35;--dm:.4;--db:.75}
#sky .l.night .pbg{background-position:center 70%}
#sky .l.golden .pbg, #sky .l.afternoon .pbg{background-position:center 62%}
body.photobg #sky .veil{background:none}
.scene .who{position:absolute;bottom:var(--gy,7%);left:var(--x);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.6cqw;animation:pop .6s cubic-bezier(.2,1.2,.4,1) both}
.scene .who .av{box-shadow:0 0 0 .45cqw var(--c), 0 1.4cqw 3cqw rgba(0,0,0,.45)}
.scene .who b{font-family:var(--disp);font-weight:800;font-size:max(11px,1.35cqw);color:#fff;background:rgba(6,10,24,.62);border:1px solid var(--c);border-radius:999px;padding:.1cqw 1cqw;white-space:nowrap}
.scene.hasfg .who{flex-direction:column-reverse}
.scene .who.dim{filter:grayscale(.6) brightness(.75)}
.scene .who.lift{transform:translateX(-50%) translateY(-1.4cqw)}
.scene .who:nth-of-type(2){animation-delay:.08s} .scene .who:nth-of-type(3){animation-delay:.16s} .scene .who:nth-of-type(4){animation-delay:.24s}
.scene .cap{position:absolute;left:2.2cqw;top:2cqw;font-size:max(12px,1.25cqw);font-weight:800;color:var(--gold2);background:rgba(6,10,24,.62);border-radius:10px;padding:.35cqw 1cqw;letter-spacing:.02em}
.scene .grade{position:absolute;inset:0;pointer-events:none}
.scene .bubble{position:absolute;transform:translateX(-50%);z-index:2;background:#fff;color:#0A1230;font-weight:800;font-size:max(11px,1.25cqw);padding:.5cqw 1.1cqw;border-radius:1.4cqw;white-space:nowrap;animation:pop .5s .5s both}
.scene .bubble::after{content:"";position:absolute;left:50%;bottom:-.7cqw;border:.7cqw solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.scene .think{background:rgba(255,255,255,.92);font-style:italic;font-weight:700}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.9)}}

/* ════════ TITLE ════════ */
.title-scr{min-height:calc(100vh - 210px);display:grid;place-items:center;text-align:center}
.ep{font-size:15px;font-weight:800;color:var(--blue2);letter-spacing:.04em}
.logo{margin:14px 0 8px}
.logo h1{font-size:clamp(50px,min(10.5vw,16vh),160px);line-height:.86;letter-spacing:-.035em;text-shadow:0 10px 60px rgba(111,182,255,.35)}
.logo h1 span{display:block}
.logo h1 .l2{color:transparent;-webkit-text-stroke:2px rgba(184,220,255,.95)}
.tag{font-size:clamp(19px,1.8vw,27px);font-weight:600;color:#E8EEFF}
.cast{display:flex;justify-content:center;gap:clamp(14px,2.6vw,40px);flex-wrap:wrap;margin:clamp(14px,3vh,28px) 0 clamp(14px,3.4vh,30px)}
.cast .one{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(110px,12vw,170px);animation:lnin .6s both}
.cast .one .av{--s:clamp(70px,min(9vw,13vh),132px)!important}
@media (max-height:820px){ .cast .one .bio{display:none} }
.cast .one b{font-family:var(--disp);font-size:18px}
.cast .one span{font-size:13px;color:var(--muted);line-height:1.3}
.cast .one:nth-child(2){animation-delay:.08s}.cast .one:nth-child(3){animation-delay:.16s}.cast .one:nth-child(4){animation-delay:.24s}
.mission-pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:8px 18px;background:rgba(255,200,97,.1);border:1px solid rgba(255,200,97,.5);color:var(--gold2);font-weight:800;font-size:clamp(14px,1.2vw,18px);letter-spacing:.03em}

/* ════════ SETUP (attendance) ════════ */
.setup{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(18px,3vw,40px);align-items:start}
@media (max-width:980px){ .setup{grid-template-columns:1fr} }
.stepper{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:20px;padding:6px;background:rgba(255,255,255,.04)}
.stepper button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.06);font-size:26px;font-weight:800}
.stepper b{font-family:var(--disp);font-size:40px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.crewc{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:18px;padding:9px 11px;background:rgba(255,255,255,.04)}
.crewc .ini{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:18px;color:#03201D;background:var(--teal2)}
.crewc input{min-width:6ch;flex:1;border:0;background:transparent;font-weight:800;font-size:18px;padding:4px}
.crewc input:focus{outline:2px solid var(--teal);border-radius:8px}
.crewc.away{opacity:.5} .crewc.away .ini{background:#555}
.crewc .x{flex:none}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.seg button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:800;font-size:15px}
.seg button.on{background:var(--blue);color:#041631}
.formula{font-family:var(--disp);font-size:clamp(18px,1.5vw,24px);color:var(--gold2)}
.mode2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode2 button{text-align:left;border:2px solid var(--line2);background:rgba(255,255,255,.04);border-radius:18px;padding:12px 14px}
.mode2 button b{display:block;font-size:17px}
.mode2 button span{font-size:13px;color:var(--muted)}
.mode2 button.on{border-color:var(--blue);background:rgba(111,182,255,.14)}

/* ════════ PHONE ════════ */
.phone{width:min(460px,100%);margin:0 auto;border-radius:40px;padding:12px;background:linear-gradient(160deg,#1C254F,#0A0F2A);border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04)}
.phone .scr{position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,#121A44,#0C1234);display:flex;flex-direction:column}
.phone .bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
.phone .bar b{font-family:var(--disp);font-size:18px}
.phone .bar small{display:block;font-size:12px;color:var(--muted)}
.phone .msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:min(300px,40vh)}
.msg{display:flex;gap:10px;align-items:flex-end;animation:msgin .4s cubic-bezier(.2,1.2,.4,1) both}
.msg .b{max-width:82%;background:#232B63;border-radius:18px 18px 18px 6px;padding:9px 14px;font-size:clamp(16px,min(1.4vw,2.6vh),22px);font-weight:600;line-height:1.35}
.msg.me{flex-direction:row-reverse}
.msg.me .b{background:linear-gradient(135deg,#8ECBFF,#5AA6F5);color:#041631;border-radius:18px 18px 6px 18px}
.rcpt{align-self:flex-end;font-size:12px;font-weight:800;color:var(--muted);margin-top:-4px}
.rcpt.read{color:var(--blue2)}
.lapse{align-self:center;font-size:13px;font-weight:800;color:var(--gold2);background:rgba(255,200,97,.1);border:1px dashed rgba(255,200,97,.45);border-radius:999px;padding:3px 12px;animation:lnin .4s both}
@keyframes msgin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.typing{display:flex;gap:5px;padding:12px 16px;background:#232B63;border-radius:18px;width:max-content}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes typ{30%{transform:translateY(-5px);opacity:1}0%,60%,100%{opacity:.4}}
.post{background:#0C1234}
.post .ph{position:relative;aspect-ratio:4/3;container-type:inline-size;overflow:hidden}
.post .ph .who b{display:none}
.post .meta{padding:10px 14px 14px;font-size:15px}
.post .meta .acts{display:flex;gap:14px;font-size:20px;margin-bottom:6px}
.post .meta b{font-weight:800}
.dialog{position:absolute;left:0;right:0;bottom:0;display:grid;place-items:end center;padding:0 0 14px;background:linear-gradient(180deg,transparent,rgba(3,5,18,.7) 40%);animation:lnin .4s both}
.dialog .box{width:88%;border-radius:18px;background:#1B2252;border:1px solid var(--line2);padding:12px 14px;text-align:center;font-weight:700;font-size:16px}
.dialog .box .r{display:flex;gap:8px;margin-top:12px}
.dialog .box .r span{flex:1;border-radius:10px;padding:8px;background:rgba(255,255,255,.06);font-size:15px}
.dialog .box .r span.red{background:rgba(255,107,127,.25);color:#FFC2CB}

/* ════════ VOTE ════════ */
.vote{display:grid;gap:clamp(8px,1.4vh,14px);max-width:1000px;margin:0 auto}
.vopt{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:2px solid var(--line2);border-radius:22px;padding:clamp(7px,1.3vh,14px) 18px;background:rgba(8,12,36,.72);overflow:hidden;text-align:left;width:100%}
.vopt .L{width:clamp(40px,6vh,52px);height:clamp(40px,6vh,52px);border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-size:24px;background:rgba(111,182,255,.16);border:1px solid rgba(111,182,255,.6);color:var(--blue2)}
.vopt .t{font-size:clamp(20px,1.8vw,29px);font-weight:800;position:relative;z-index:1}
.vopt .t small{display:block;font-size:.62em;color:var(--muted);font-weight:700}
.vopt .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(111,182,255,.28),rgba(111,182,255,.05));transition:width .6s cubic-bezier(.2,1,.3,1);z-index:0}
.vopt .n{position:relative;z-index:1;font-family:var(--disp);font-size:28px;min-width:2ch;text-align:right}
.vopt .pm{display:flex;gap:4px;position:relative;z-index:1}
.vopt.win{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,97,.15)}
.vopt.win .L{background:var(--gold);color:#2A1603;border-color:var(--gold)}
.pct{font-size:14px;font-weight:800;color:var(--muted);min-width:4ch;text-align:right;position:relative;z-index:1}

/* ════════ VOCABULARY CARDS ════════ */
.disc{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(16px,2.6vw,36px);align-items:start}
@media (max-width:980px){ .disc{grid-template-columns:1fr} }
.xcard{border-radius:30px;padding:clamp(16px,2vw,28px);background:linear-gradient(160deg,rgba(28,42,102,.92),rgba(10,16,46,.94));border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.4);animation:turnin .45s both}
.xcard .no{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.xcard .ex1{font-family:var(--disp);font-size:clamp(30px,min(3.6vw,6.4vh),58px);font-weight:800;color:var(--gold);line-height:1;margin:4px 0 10px;letter-spacing:-.02em}
.xcard .stg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.xcard .stg button{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;color:var(--muted)}
.xcard .stg button.on{background:rgba(111,182,255,.18);border-color:var(--blue);color:#fff}
.xcard .stg button.cur{background:var(--blue);border-color:var(--blue);color:#041631}
.xrow{border-radius:16px;padding:min(10px,1.3vh) 14px;margin-top:min(8px,1vh);animation:lnin .35s both}
.xrow small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:2px}
.xrow .v{font-size:clamp(17px,min(1.55vw,2.9vh),27px);font-weight:700;line-height:1.28}
.xrow.m{background:rgba(111,182,255,.12);border:1px solid rgba(111,182,255,.45)} .xrow.m small{color:var(--blue2)}
.xrow.t{background:rgba(255,200,97,.10);border:1px solid rgba(255,200,97,.45)} .xrow.t small{color:var(--gold2)}
.xrow.e{background:rgba(95,224,168,.10);border:1px solid rgba(95,224,168,.45)} .xrow.e small{color:var(--mint)} .xrow.e .v{font-style:italic}
.xrow.c{background:rgba(201,184,255,.10);border:1px solid rgba(201,184,255,.45)} .xrow.c small{color:var(--lav)}
.xrow.g{background:rgba(255,255,255,.04);border:1px dashed var(--line2);text-align:center} .xrow.g .v{font-family:var(--disp);font-size:clamp(22px,2.2vw,34px)}
.ccqa{display:inline-block;margin-left:10px;font-family:var(--disp);color:var(--ok)}
.minis{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.minis .chip.seen{border-color:rgba(95,224,168,.55);color:var(--mint)}
.minis .chip.cur{border-color:var(--gold);color:var(--gold2);background:rgba(255,200,97,.1)}

/* ════════ TURN CARD (smart task distribution) ════════ */
.tk-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.tk-head h2{flex:1;min-width:260px}
.meter{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--muted)}
.meter .tr{width:min(220px,40vw);height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:6px;transition:width .5s}
.meter b{color:#fff;font-variant-numeric:tabular-nums}
.turn{position:relative;border-radius:30px;padding:clamp(18px,2.4vw,34px);background:linear-gradient(160deg,rgba(24,36,92,.93),rgba(10,15,44,.94));border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.4);animation:turnin .45s cubic-bezier(.2,1,.3,1) both}
@keyframes turnin{from{opacity:0;transform:translateY(16px) rotate(-.4deg)}}
.turn .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.turn .who .mic{display:inline-flex;align-items:center;gap:10px;font-family:var(--disp);font-size:clamp(20px,2vw,30px);color:#03201D;background:var(--teal2);border-radius:999px;padding:6px 18px 6px 8px}
.turn .who .mic .ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#03201D;color:var(--teal2);font-size:18px}

.turn.opt{border-style:dashed;border-color:rgba(201,184,255,.5)}
.sample{margin-top:14px;border-radius:18px;padding:12px 16px;background:rgba(201,184,255,.1);border:1px solid rgba(201,184,255,.4);font-size:clamp(18px,1.5vw,24px);font-weight:700;animation:lnin .3s both}

.peer{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-radius:18px;padding:10px 14px;background:rgba(69,191,178,.12);border:1px solid rgba(69,191,178,.45);font-size:clamp(17px,1.4vw,22px);font-weight:700;animation:lnin .3s both}
.tmr{font-family:var(--disp);font-size:clamp(26px,2.6vw,40px);font-variant-numeric:tabular-nums;min-width:3.6ch}

.done-card{border-radius:30px;padding:clamp(22px,3vw,40px);text-align:center;background:linear-gradient(160deg,rgba(91,227,168,.16),rgba(69,191,178,.08));border:1px solid rgba(91,227,168,.5);animation:turnin .5s both}

.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--gold);box-shadow:0 0 0 4px rgba(255,200,97,.25)} .dots i.h{background:var(--teal)}
.wn{margin-top:14px;border-radius:20px;padding:10px 14px;background:rgba(6,10,26,.55);border:1px solid var(--line)}

.tally{display:flex;flex-wrap:wrap;gap:8px}
.tally span{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tally span b{font-variant-numeric:tabular-nums}
.tally span.cur{border-color:var(--gold);color:var(--gold2)}
.tally span.full{border-color:rgba(91,227,168,.5);color:#C5F7E2}
.tally span.nx{border-color:var(--teal2);color:var(--teal2)}
.adj{margin-top:10px;font-size:14px;color:var(--gold2);font-weight:700}
.fa2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fa2 button{border-radius:20px;padding:16px;border:2px solid var(--line2);background:rgba(255,255,255,.04);font-family:var(--disp);font-size:clamp(22px,2.2vw,32px);font-weight:800}

/* ════════ READING ════════ */
.story{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:clamp(16px,2.4vw,34px);align-items:start}
.story .phone{width:min(380px,100%)}
@media (max-width:980px){ .story{grid-template-columns:1fr} }
.part-tag{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.part-tag .pn{font-family:var(--disp);font-size:14px;color:#041631;background:var(--gold);border-radius:8px;padding:3px 10px}
.part-tag .pt{font-family:var(--disp);font-size:clamp(24px,2.6vw,40px);font-weight:800}
.ptext{margin-top:10px;border-radius:24px;padding:clamp(14px,1.6vw,24px);background:linear-gradient(165deg,rgba(14,22,60,.86),rgba(8,12,36,.88));border:1px solid var(--line);font-size:clamp(18px,min(1.45vw,2.75vh),28px);line-height:1.48;font-weight:600}
.ptext p{margin:0 0 .4em}
.ptext p:last-child{margin-bottom:0}
.ptext q{quotes:"“" "”" "‘" "’";color:#fff;font-weight:700}
.parts5{display:flex;gap:6px;margin-top:12px}
.parts5 i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.parts5 i.d{background:var(--ok)} .parts5 i.c{background:var(--gold)}
.qrow{border-radius:20px;padding:10px 16px;background:rgba(255,255,255,.045);border:1px solid var(--line2);margin-top:10px;animation:lnin .35s both}
.qrow .qq{font-size:clamp(19px,min(1.7vw,3vh),28px);font-weight:800;font-family:var(--disp);line-height:1.2}
.qrow .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qrow.done{opacity:.86;border-color:rgba(91,227,168,.4)}
.qrow.class{border-style:dashed}
.qrow .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qrow .acts .sp{flex:1}
.who-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-size:clamp(16px,1.5vw,22px);color:#03201D;background:var(--teal2);border-radius:999px;padding:3px 14px 3px 4px;font-weight:800}
.who-pill .ini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#03201D;color:var(--teal2);font-size:15px}
.who-pill.done{background:rgba(91,227,168,.22);color:#C5F7E2} .who-pill.done .ini{background:var(--ok);color:#03201D}
.who-pill.class{background:rgba(255,255,255,.08);color:var(--text)} .who-pill.class .ini{background:var(--gold);color:#2A1603}

/* ════════ SPEAKING (story decisions) ════════ */
.choices{display:grid;gap:8px;margin-top:10px}
.chc{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--line2);border-radius:18px;padding:min(10px,1.3vh) 14px;background:rgba(8,12,36,.72);font-size:clamp(17px,min(1.5vw,2.8vh),25px);font-weight:800;transition:border-color .2s, background .2s, transform .15s}
.chc .L{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--disp);font-size:22px;background:rgba(111,182,255,.16);border:1px solid rgba(111,182,255,.55);color:var(--blue2)}
.chc:hover{border-color:var(--blue)}
.chc.pick{border-color:var(--gold);background:rgba(255,200,97,.12)} .chc.pick .L{background:var(--gold);color:#2A1603;border-color:var(--gold)}
.chc.fade{opacity:.4;padding-top:3px;padding-bottom:3px;font-size:clamp(14px,1.1vw,18px)} .chc.fade .L{width:28px;height:28px;font-size:16px;border-radius:9px}
.react{margin-top:16px}
.phr{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;animation:lnin .3s both}
.phr span{border-radius:12px;padding:6px 12px;background:rgba(69,191,178,.12);border:1px solid rgba(69,191,178,.45);color:var(--teal2);font-weight:800;font-size:clamp(14px,1.15vw,18px)}
.sitbar{display:flex;gap:6px;margin-bottom:14px}
.sitbar i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)} .sitbar i.d{background:var(--ok)} .sitbar i.c{background:var(--gold)}

/* ════════ BREAKOUT ════════ */
.mission{border-radius:30px;padding:clamp(18px,2.6vw,34px);background:linear-gradient(160deg,rgba(111,182,255,.16),rgba(20,26,80,.9));border:1px solid rgba(150,205,255,.42)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:900px){ .steps3{grid-template-columns:1fr} }
.st3{border-radius:22px;padding:16px 18px;background:rgba(6,10,26,.55);border:1px solid var(--line2)}
.st3 .n{font-family:var(--disp);font-size:15px;color:var(--gold)}
.st3 b{display:block;font-family:var(--disp);font-size:clamp(20px,1.8vw,27px);margin:2px 0 6px}
.st3 p{font-size:clamp(17px,1.35vw,21px);font-weight:600;margin:0}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.rules span{border-radius:12px;padding:8px 14px;background:rgba(255,200,97,.12);border:1px solid rgba(255,200,97,.45);color:var(--gold2);font-weight:800;font-size:clamp(15px,1.25vw,19px)}
.modes{display:inline-flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.modes button{border:0;background:transparent;border-radius:12px;padding:8px 16px;font-weight:800}
.modes button.on{background:var(--teal);color:#03201D}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:14px}
.grp{border-radius:22px;padding:14px 16px;background:rgba(6,10,26,.62);border:1px solid var(--line2)}
.grp h4{margin:0 0 8px;font-family:var(--disp);font-size:20px}
.grp .m{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-weight:700}
.grp .m:first-of-type{border-top:0}
.grp .m .rl{margin-left:auto;font-size:14px;color:var(--teal2);font-weight:800;text-align:right}
.grp .ini{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:14px;color:#03201D;background:var(--teal2)}
.timerbig{font-family:var(--disp);font-size:clamp(54px,8vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.timerbig.low{color:var(--gold)} .timerbig.out{color:var(--rose)}
.example{border-radius:22px;padding:14px 18px;background:rgba(201,184,255,.1);border:1px dashed rgba(201,184,255,.55);margin-top:14px;animation:lnin .35s both}
.example p{font-size:clamp(17px,1.4vw,22px);font-weight:700;margin:6px 0}
.qc{display:flex;flex-wrap:wrap;gap:6px}
.qc .chip{cursor:pointer}
.plan{border-radius:22px;padding:14px 16px;background:linear-gradient(160deg,rgba(255,200,97,.10),rgba(14,20,60,.9));border:1px solid rgba(255,200,97,.4)}
.plan h4{margin:0 0 8px;font-family:var(--disp);font-size:18px}
.plan label{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:14px;font-weight:800;color:var(--gold2);margin-top:6px}
.plan input{border:0;border-bottom:2px dashed rgba(255,227,166,.45);background:transparent;font-size:17px;font-weight:700;padding:4px 2px;color:#fff;min-width:0}
.plan input:focus{outline:none;border-bottom-color:var(--gold)}
.pres{border-radius:28px;padding:clamp(16px,2.4vw,30px);background:linear-gradient(160deg,rgba(255,200,97,.12),rgba(20,26,80,.9));border:2px solid rgba(255,200,97,.45)}
.crewname{font-family:var(--disp);font-size:clamp(34px,4.4vw,70px);font-weight:800;color:var(--gold);line-height:1;letter-spacing:-.02em}
.crewname.empty{color:rgba(255,227,166,.4)}
.pline{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:clamp(19px,1.6vw,26px);font-weight:700}
.pline .ic{font-size:28px}
.pline .by{font-size:14px;color:var(--teal2);font-weight:800;text-align:right}
.pline .empty{color:var(--dim);font-style:italic;font-weight:600}
.awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:960px){ .awards{grid-template-columns:1fr} }
.award{border-radius:26px;padding:16px 18px;background:linear-gradient(160deg,rgba(14,22,60,.9),rgba(8,12,36,.92));border:1px solid var(--line2)}
.award .ic{font-size:40px}
.award h3{font-size:clamp(20px,1.8vw,28px);margin:4px 0 10px}
.award .opt{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-weight:800}
.award .opt.win{color:var(--gold)}
.award .opt .n{font-family:var(--disp);font-size:24px;min-width:2ch;text-align:right}

/* ════════ JOURNAL & ENDING ════════ */
.journal{position:relative;max-width:860px;margin:0 auto;border-radius:10px 22px 22px 10px;padding:1.5em 1.2em 1.5em 2.4em;color:#22243A;
  background:linear-gradient(90deg,transparent 1.9em,rgba(255,107,127,.55) 1.9em,rgba(255,107,127,.55) calc(1.9em + 2px),transparent calc(1.9em + 2px)),repeating-linear-gradient(180deg,#FBF6EA 0,#FBF6EA calc(1.5em - 1px),rgba(111,150,210,.35) calc(1.5em - 1px),rgba(111,150,210,.35) 1.5em);
  font-family:var(--hand);font-size:clamp(26px,min(2.5vw,4.3vh),44px);line-height:1.5em;box-shadow:0 40px 90px rgba(0,0,0,.55);transform:rotate(-.8deg)}
.journal h3{font-family:var(--disp);font-size:inherit;line-height:1.5em;margin:0;font-weight:800}
.journal h3 span{font-size:.42em;letter-spacing:.14em;color:#5A4E8A;vertical-align:middle}
.journal .jl{display:block}
.journal .jl:last-of-type{animation:write .9s ease both}
.journal .jl.em{color:#1F3F8F;font-weight:700}
@keyframes write{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.journal .clip{position:absolute;top:-14px;right:60px;width:46px;height:70px;border-radius:10px;border:5px solid #C8CCD8;border-bottom-color:transparent}
.complete{display:inline-flex;gap:12px;align-items:center;border-radius:20px;padding:12px 22px;background:linear-gradient(90deg,rgba(91,227,168,.18),rgba(69,191,178,.12));border:1px solid rgba(91,227,168,.55);font-family:var(--disp);font-size:clamp(22px,2.2vw,32px)}
.badge{width:clamp(120px,14vw,190px);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#FFE7A8,#FFC861 45%,#E9902F);box-shadow:0 0 0 10px rgba(255,200,97,.18),0 0 80px rgba(255,200,97,.45);font-size:clamp(54px,6vw,86px);animation:badge 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes badge{from{transform:scale(.3) rotate(-30deg);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ════════ GAME ZONE ════════ */
.gz-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.gz-tabs button{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:14px;padding:10px 16px;font-weight:800}
.gz-tabs button.on{background:var(--teal);border-color:var(--teal);color:#03201D}
.gzcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.gzc{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(160deg,rgba(18,28,72,.88),rgba(8,12,36,.9));border:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.gzc::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--g,rgba(111,182,255,.2));filter:blur(10px)}
.gzc .ic{font-size:40px;position:relative}
.gzc h3{font-size:24px;position:relative}
.kq{border-radius:18px;padding:14px 16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-top:10px}
.kq .qh{display:flex;gap:10px;align-items:baseline}
.kq .qh b{font-family:var(--disp);color:var(--gold)}
.kq ol{margin:6px 0 0;padding-left:1.4em;list-style:upper-alpha}
.kq li.c{color:var(--ok);font-weight:800}
.kq .ex{font-size:14px;color:var(--muted)}
.field{width:100%;border:1px solid var(--line2);background:rgba(5,7,25,.6);border-radius:12px;padding:10px 12px;font-size:16px}
.field:focus{outline:2px solid var(--teal);border-color:transparent}
.bank{display:grid;gap:10px}
.bank .bi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.bank .bi .n{font-family:var(--disp);color:var(--dim)}
.bank .bi .a{color:var(--ok);font-weight:800;animation:lnin .3s both}
.bank .bi.used{opacity:.55}
.kh{max-width:1100px;margin:0 auto}
.kh .q{font-family:var(--disp);font-size:clamp(28px,3.3vw,52px);font-weight:800;text-align:center;line-height:1.15;padding:clamp(14px,2vw,26px);border-radius:24px;background:rgba(255,255,255,.95);color:#1B1340;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.kh .grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:760px){ .kh .grid4{grid-template-columns:1fr} }
.kh .o{display:flex;align-items:center;gap:14px;border:0;border-radius:18px;padding:16px 18px;min-height:clamp(64px,10vh,110px);font-size:clamp(19px,1.7vw,27px);font-weight:800;color:#fff;text-align:left;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:opacity .3s, transform .2s}
.kh .o .sh{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:26px}
.kh .o.c0{background:#E21B3C} .kh .o.c1{background:#1368CE} .kh .o.c2{background:#D89E00} .kh .o.c3{background:#26890C}
.kh .o.dim{opacity:.25} .kh .o.ok{outline:5px solid #fff;transform:scale(1.02)}
.kh .bar{display:flex;align-items:center;gap:14px;margin-top:14px}
.flipg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){ .flipg{grid-template-columns:repeat(2,minmax(0,1fr))} }
.flip{perspective:900px;height:clamp(96px,15vh,180px);border:0;background:transparent;padding:0}
.flip .in{display:block;position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.9,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;padding:12px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line2)}
.flip .f{background:linear-gradient(160deg,rgba(28,42,102,.95),rgba(10,16,46,.95));font-size:clamp(15px,1.25vw,19px);font-weight:700}
.flip .bk{background:linear-gradient(160deg,#FFE7A8,#FFC861);color:#2A1603;transform:rotateY(180deg);font-family:var(--disp);font-size:clamp(22px,2vw,32px);font-weight:800}
.flip .f small{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.flip .f,.flip .bk{flex-direction:column}

/* ════════ ALIAS WORD BANK (one screen) ════════ */
#sheet{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 50% -10%,rgba(111,182,255,.16),transparent 70%),linear-gradient(180deg,#070C24,#0E1440);padding:clamp(8px,1.4vh,20px) clamp(12px,1.8vw,30px)}
#sheet .sh-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
#sheet .sh-top h2{font-size:clamp(20px,3vh,36px)}
#sheet .sh-top .sub{font-size:clamp(12px,1.6vh,17px);color:var(--muted);font-weight:700}
#sheet .sh-ctl{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#sheet .sh-ctl .on{background:var(--indigo);border-color:var(--blue)}
#sheet .sh-wrap{flex:1;min-height:0;margin-top:clamp(4px,1vh,12px);overflow:hidden}
#sheet table{width:100%;height:100%;border-collapse:separate;border-spacing:0 var(--rg,4px);table-layout:fixed;font-size:var(--tf,18px)}
#sheet col.c1{width:22%} #sheet col.c2{width:34%} #sheet col.c3{width:44%}
#sheet thead th{font-size:.7em;text-align:left;color:var(--teal2);font-weight:800;padding:0 .7em .1em;letter-spacing:.06em;text-transform:uppercase}
#sheet tbody tr{cursor:pointer}
#sheet td{padding:.26em .7em;background:rgba(255,255,255,.05);border-top:1px solid var(--line);border-bottom:1px solid var(--line);line-height:1.2;vertical-align:middle;transition:background .2s}
#sheet td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;font-family:var(--disp);font-weight:800;font-size:1.14em;color:var(--gold)}
#sheet td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
#sheet td.c2{font-weight:600}
#sheet td.c3{font-style:italic;color:#E9EEFF}
#sheet tr:hover td{background:rgba(255,255,255,.08)}
#sheet tr.sel td{background:linear-gradient(90deg,rgba(255,200,97,.30),rgba(255,200,97,.16));border-color:rgba(255,200,97,.75)}
#sheet tr.sel td:first-child{color:#fff}
#sheet td .cov{color:var(--dim);font-style:normal;font-weight:800;font-size:.85em;letter-spacing:.12em;border:1px dashed var(--line2);background:transparent;border-radius:10px;padding:.05em .8em;cursor:pointer}
#sheet td .cov:hover{color:var(--gold2);border-color:var(--gold)}
#sheet.pres .sh-ctl .hide-p{display:none}
#sheet.pres .sh-top .sub{display:none}
#sheet .pbtn{position:absolute;right:12px;top:10px;opacity:.25;transition:opacity .2s}
#sheet .pbtn:hover,#sheet .pbtn:focus-visible{opacity:1}
#sheet.alt .sh-wrap{overflow:auto}
#sheet.alt table, #sheet.alt thead, #sheet.alt tbody, #sheet.alt tr, #sheet.alt td{display:block;height:auto}
#sheet.alt thead{display:none}
#sheet.alt tr{margin-bottom:10px;border-radius:14px;overflow:hidden}
#sheet.alt td{border-radius:0!important;border:0}
#sheet .warn{flex:none;margin-top:8px;border-radius:12px;padding:6px 12px;background:rgba(255,200,97,.12);border:1px solid rgba(255,200,97,.5);color:var(--gold2);font-size:14px;font-weight:700}

/* ════════ CONTROLS, NOTES, DOCK ════════ */
#ctrl{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:8px;padding:12px clamp(10px,2vw,24px) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(4,7,20,.94) 38%);transition:right .3s}
#ctrl .info{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctrl .info b{color:#fff}
@media (max-width:860px){ #ctrl .lbl2{display:none} #ctrl .info{display:none} #ctrl{justify-content:space-between} }
body.present #ctrl{opacity:.35;transition:opacity .3s} body.present #ctrl:hover, body.present #ctrl:focus-within{opacity:1}
body.present .tonly{display:none!important}
body.present #top{opacity:.5} body.present #top:hover{opacity:1}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#18215A;border:1px solid var(--line2);border-radius:14px;padding:10px 18px;font-weight:700;font-size:15px;z-index:96;opacity:0;pointer-events:none;transition:.25s;max-width:min(92vw,620px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:85;background:rgba(3,4,16,.7);display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px)}
#modalBox{width:min(840px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#0F1748;border:1px solid var(--line2);border-radius:26px;padding:clamp(18px,2.6vw,30px);box-shadow:0 30px 90px rgba(0,0,0,.6)}
#notes{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:50;background:#0A1036;border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .3s;display:flex;flex-direction:column;font-size:15px}
#notes.on{transform:none}
#notes header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
#notes .ntabs{display:flex;gap:4px;padding:8px 14px 0}
#notes .ntabs button{flex:1;border:1px solid var(--line2);background:transparent;border-radius:10px 10px 0 0;padding:7px 4px;font-weight:800;font-size:14px;border-bottom:0}
#notes .ntabs button.on{background:rgba(69,191,178,.2);border-color:var(--teal);color:#fff}
#notesBody{overflow:auto;padding:10px 16px 40px;border-top:1px solid var(--line)}
@media (min-width:1280px){
  body.ws #notes{transform:none; z-index:20; top:var(--toph,65px)}
  body.ws #stage{padding-right:calc(440px + clamp(14px,2vw,30px))}
  body.ws #ctrl{right:440px}
  body.ws #notesX{display:none}
}
.tsec{border-bottom:1px solid var(--line);padding:11px 0}
.tsec h5{margin:0 0 6px;font-size:12px;letter-spacing:.08em;color:var(--teal2);font-weight:800}
.tsec ul{margin:4px 0;padding-left:1.1em} .tsec li{margin:3px 0}
.tsec .ua{color:var(--gold2)}
.tsec .say{border-left:3px solid var(--blue);padding-left:10px;margin:6px 0}
.tsec .say i{display:block;color:var(--gold2);font-size:14px}
.tsec .key{border-radius:12px;padding:8px 10px;background:rgba(91,227,168,.08);border:1px solid rgba(91,227,168,.35);margin:6px 0}
.tsec .key b{color:var(--ok)}
.jump{display:grid;gap:3px}
.jump button{all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;font-size:14px}
.jump button:hover{background:rgba(255,255,255,.06)} .jump button.cur{background:var(--indigo);color:#fff}
.switch{display:flex;gap:10px;align-items:center;margin:6px 0;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--teal)}
.dist{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.dist th,.dist td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:center}
.dist th:first-child,.dist td:first-child{text-align:left}
.dist td.z{color:var(--dim)} .dist td.full{color:var(--ok);font-weight:800}
.dist tr.away td{opacity:.45}
#dock{position:fixed;left:clamp(10px,2vw,24px);top:80px;z-index:40;width:min(330px,calc(100vw - 20px));max-height:calc(100vh - 200px);overflow:auto;background:rgba(10,15,52,.96);border:1px solid var(--line2);border-radius:20px;padding:12px 14px;font-size:14px;display:none}
#dock.on{display:block}
#dock.min #dockBody, #dock.min #dockCount{display:none}
#dock .names{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
#dock .names span{background:rgba(255,255,255,.07);border-radius:999px;padding:2px 8px;font-size:12px}
#dock .names span.lk{background:rgba(69,191,178,.3)}
.led{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none}
.led.on{background:var(--ok);box-shadow:0 0 8px var(--ok)} .led.bad{background:var(--bad)}
.dbar{margin:6px 0;font-size:13px}
.dbar .tr{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.dbar .tr i{display:block;height:100%;background:var(--teal2)}
.wallit{display:flex;gap:6px;align-items:flex-start;border-top:1px solid var(--line);padding:6px 0}
.wallit p{flex:1;margin:0} .wallit small{display:block;color:var(--muted)}
#reacts{position:fixed;right:24px;bottom:100px;z-index:45;pointer-events:none;width:60px;height:300px}
#reacts span{position:absolute;bottom:0;font-size:32px;animation:floatup 3s ease-out forwards}
@keyframes floatup{to{transform:translateY(-280px);opacity:0}}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.navgrid button{text-align:left;border:1px solid var(--line2);background:rgba(255,255,255,.03);border-radius:12px;padding:9px 12px;font-size:15px;font-weight:700}
.navgrid button.cur{background:var(--indigo);border-color:var(--blue)}
.navgrid button small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid var(--line2);color:var(--muted)}
.livebadge.on{color:var(--ok);border-color:rgba(91,227,168,.5)}

/* ════════ AUDIENCE WINDOW ════════ */
body.screen #ctrl, body.screen #top .tb, body.screen #top .home, body.screen #notes, body.screen #dock{display:none!important}
body.screen #view{pointer-events:none}
body.screen #rail{pointer-events:none}
body.screen #sheet .sh-ctl, body.screen #sheet .pbtn{display:none}
.screenwait{display:grid;place-items:center;min-height:60vh;text-align:center}

/* ════════ STUDENT APP ════════ */
#stu{display:none}
body.student #app, body.student #ctrl, body.student #notes, body.student #dock{display:none!important}
body.student #stu{display:block;max-width:560px;margin:0 auto;padding:14px 14px 90px}
.stu-head{display:flex;gap:10px;align-items:center;padding:6px 0 10px}
.stu-head b{font-family:var(--disp);font-size:18px}
.stu-card{background:linear-gradient(160deg,rgba(14,22,60,.92),rgba(8,12,36,.92));border:1px solid var(--line2);border-radius:24px;padding:18px;margin-top:10px}
.stu-card label{display:block;font-weight:800;font-size:14px;margin:12px 0 4px;color:var(--muted)}
.stu-card input,.stu-card textarea{width:100%;border:1px solid var(--line2);background:rgba(5,7,25,.6);border-radius:14px;padding:12px 14px;font-size:18px}
.stu-card textarea{min-height:90px;resize:vertical}
.stu-wait{text-align:center;padding:30px 10px}
.stu-wait .bigi{font-size:54px}
.stu-prog{display:flex;gap:4px;margin:4px 0 10px} .stu-prog i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)} .stu-prog i.d{background:var(--ok)} .stu-prog i.c{background:var(--gold)}
.avpick{display:flex;flex-wrap:wrap;gap:6px} .avpick button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:24px} .avpick button.on{background:var(--indigo);border-color:var(--blue)}
#stuFoot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:10px;background:rgba(4,7,20,.92);border-top:1px solid var(--line)}
#stuFoot button{width:50px;height:46px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:22px}
.verif{display:inline-block;font-size:12px;font-weight:800;color:var(--ok);margin-bottom:6px}
.myturn{border-radius:22px;padding:18px;background:linear-gradient(135deg,rgba(69,191,178,.35),rgba(111,182,255,.2));border:2px solid var(--teal2);animation:turnin .4s both}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line2);background:rgba(255,255,255,.04);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:700}
.opt .L{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--disp);background:rgba(111,182,255,.18);border:1px solid rgba(111,182,255,.6)}
.opt.pick{border-color:var(--teal2);background:rgba(69,191,178,.15)}
.opt.right{border-color:var(--ok);background:rgba(91,227,168,.13)}

/* reduced motion */
body.noanim *, body.noanim *::before, body.noanim *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important} }
@media print{ #top,#ctrl,#notes,#dock{display:none} }

/* ════════════════ LESSON 25 ADDITIONS ════════════════ */
:root{ --c-leo:#FF8A5C; --c-miaOops:#5FE0A8; --prep:#FFC861; --prep2:#FFE3A6 }
.k-leo{--c:var(--c-leo)} .nm.k-leo{color:var(--c-leo)} .k-miaOops{--c:var(--c-mia)} .nm.k-miaOops{color:var(--c-mia)}

/* group chat (bigger, with names) */
.phone.wide{width:min(560px,100%)}
.phone .bar .gav{display:flex}
.phone .bar .gav .av{margin-left:-10px;box-shadow:0 0 0 2px #121A44}
.phone .bar .gav .av:first-child{margin-left:0}
.gmsg{display:flex;gap:10px;align-items:flex-end;animation:msgin .45s cubic-bezier(.2,1.2,.4,1) both}
.gmsg .b{max-width:84%;background:#232B63;border-radius:18px 18px 18px 6px;padding:7px 14px 9px;font-size:clamp(15px,min(1.45vw,2.45vh),26px);font-weight:600;line-height:1.32}
.gmsg .b .nm{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:2px}
.gmsg .b .nm .reader{font-size:11px;padding:1px 8px}
.gmsg.me{flex-direction:row-reverse}
.gmsg.me .b{background:linear-gradient(135deg,#8ECBFF,#5AA6F5);color:#041631;border-radius:18px 18px 6px 18px}
.gmsg.me .b .nm{color:#0B2C5A}
.gmsg.dim{opacity:.55}
.sys{align-self:center;font-size:13px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.06);border-radius:999px;padding:3px 12px;animation:lnin .4s both}
.sys.warn{color:var(--gold2);background:rgba(255,200,97,.12);border:1px dashed rgba(255,200,97,.5)}
.members{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);padding:6px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.members .m{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border-radius:999px;padding:2px 9px 2px 3px;font-weight:700;color:#DDE5FF}
.members .m.miss{background:rgba(255,107,127,.12);border:1px dashed rgba(255,107,127,.6);color:#FFC2CB;animation:missp 2s ease-in-out infinite}
@keyframes missp{50%{box-shadow:0 0 0 5px rgba(255,107,127,.12)}}

/* voice message */
.vbub{display:flex;align-items:center;gap:12px;background:#232B63;border-radius:20px 20px 20px 6px;padding:10px 14px;min-width:min(330px,100%);animation:msgin .45s cubic-bezier(.2,1.2,.4,1) both}
.vbub .pb,.player .pb{flex:none;width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--lav),#8C7BFF);color:#160B3A;font-size:22px;box-shadow:0 6px 20px rgba(140,123,255,.45)}
.vbub .pb:hover,.player .pb:hover{transform:scale(1.05)}
.wave{flex:1;display:flex;align-items:center;gap:2.5px;height:40px;min-width:120px}
.wave i{flex:1;max-width:5px;border-radius:3px;background:rgba(201,184,255,.4);height:var(--h,40%);transition:background .2s}
.wave i.on{background:var(--lav)}
.wave.play i{animation:wv 1s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes wv{50%{transform:scaleY(.55)}}
.vbub .dur{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.4ch}
.aitag{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;white-space:nowrap}
.player{display:flex;align-items:center;gap:16px;border-radius:26px;padding:14px 18px;background:linear-gradient(135deg,rgba(201,184,255,.16),rgba(14,22,60,.9));border:1px solid rgba(201,184,255,.45)}
.player .pb{width:clamp(58px,6vw,76px);height:clamp(58px,6vw,76px);font-size:clamp(24px,2.4vw,32px)}
.player .wave{height:52px}
.player .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.player .meta b{font-family:var(--disp);font-size:clamp(17px,1.4vw,22px)}
.prelisten{display:inline-flex;gap:12px;align-items:center;border-radius:18px;padding:10px 18px;background:rgba(255,200,97,.1);border:1px solid rgba(255,200,97,.5);font-family:var(--disp);font-size:clamp(20px,2vw,30px);font-weight:800;color:var(--gold2);animation:lnin .4s both}
.transcript{border-radius:22px;padding:clamp(14px,1.6vw,22px);background:rgba(251,247,238,.97);color:#1B1A33;font-size:clamp(18px,min(1.5vw,2.8vh),27px);line-height:1.55;font-weight:600;animation:lnin .4s both}
.transcript span{border-radius:6px;transition:background .3s}
.transcript span.now{background:rgba(140,123,255,.22)}
.transcript mark{background:linear-gradient(transparent 50%,rgba(255,200,97,.75) 50%);color:#1B1A33;font-weight:800;border-radius:3px;padding:0 2px}
.transcript small{display:block;font-size:12px;letter-spacing:.1em;color:#6A5FA8;font-weight:800;margin-bottom:4px}

/* two ways to say it */
.ways{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,26px);max-width:1180px;margin:0 auto}
@media (max-width:900px){ .ways{grid-template-columns:1fr} }
.way{position:relative;border-radius:28px;padding:clamp(16px,2vw,26px);background:linear-gradient(160deg,rgba(24,36,92,.94),rgba(10,15,44,.94));border:2px solid var(--line2);animation:turnin .45s both}
.way .tg{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.1em;border-radius:8px;padding:3px 10px}
.way.a .tg{background:rgba(95,224,168,.16);color:var(--mint);border:1px solid rgba(95,224,168,.5)}
.way.b .tg{background:rgba(201,184,255,.14);color:var(--lav);border:1px solid rgba(201,184,255,.5)}
.way .s{font-family:var(--disp);font-size:clamp(25px,min(2.7vw,5vh),44px);font-weight:800;line-height:1.2;margin-top:12px;letter-spacing:-.01em}
.way.win{border-color:var(--mint);box-shadow:0 0 0 5px rgba(95,224,168,.12)}
.way .lbl{position:absolute;right:16px;top:14px;font-size:22px}
.prep{display:inline-block;border-radius:8px;transition:all .5s}
.showprep .prep{color:#2A1603;background:var(--prep);padding:0 .18em;box-shadow:0 0 0 3px rgba(255,200,97,.25);animation:prepin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes prepin{from{transform:scale(.6) translateY(-12px);opacity:.3}}
.rp{color:var(--lav);font-weight:800}
.showprep .rp{text-decoration:underline wavy rgba(201,184,255,.8);text-underline-offset:6px}
.qs3{display:grid;gap:8px;max-width:1180px;margin:18px auto 0}
.qs3 .q3{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:18px;padding:10px 16px;background:rgba(8,12,36,.7);border:1px solid var(--line2);font-size:clamp(18px,1.6vw,25px);font-weight:800;animation:lnin .35s both}
.qs3 .q3 .n{font-family:var(--disp);color:var(--ink);background:var(--blue2);border-radius:8px;padding:1px 9px;font-size:15px}
.qs3 .q3 .a{color:var(--ok);font-family:var(--disp)}
.verdict{max-width:1180px;margin:14px auto 0;border-radius:20px;padding:12px 18px;text-align:center;background:rgba(95,224,168,.12);border:1px solid rgba(95,224,168,.5);font-family:var(--disp);font-size:clamp(20px,2vw,30px);font-weight:800;color:#C5F7E2;animation:lnin .4s both}

/* pattern pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,26px);max-width:1220px;margin:0 auto}
@media (max-width:900px){ .pairs{grid-template-columns:1fr} }
.pairc{border-radius:28px;padding:clamp(16px,2vw,26px);background:linear-gradient(160deg,rgba(24,36,92,.94),rgba(10,15,44,.94));border:1px solid var(--line2);animation:turnin .45s both}
.pairc h3{display:flex;align-items:center;gap:10px;font-size:clamp(20px,1.8vw,28px)}
.pairc .row2{margin-top:14px;border-radius:18px;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.pairc .row2 small{display:block;font-size:12px;font-weight:800;letter-spacing:.1em;margin-bottom:2px}
.pairc .row2.n small{color:var(--mint)} .pairc .row2.f small{color:var(--lav)}
.pairc .row2 .s{font-family:var(--disp);font-size:clamp(22px,min(2.3vw,4.2vh),36px);font-weight:800;line-height:1.25}
.pairc .row2.f{animation:lnin .4s both}
.jump .prep{animation:jumpL .9s cubic-bezier(.3,1.4,.5,1) both}

/* ---------- 5 · smart turns ----------
   Mandatory individual tasks = N × R  (N = present students, R = rounds; R = 1 by default in this lesson).
   In a block that has started, the target becomes: completed mandatory turns (never erased)
   + the turns each PRESENT student still needs to reach R. The teacher sees every adjustment.
   A block that has FINISHED is closed: later attendance changes don’t reopen it
   (the teacher can reopen it on purpose, or give an optional extra turn).
   Tasks are taken from the bank in lesson order (the brief’s order), extra students get the extra bank items. */
const BLOCKS = {
  vocab: {R:()=>S.R.vocab,  bank:VOCAB,  kind:'Vocabulary', title:'VOCABULARY RECALL', instr:'Read the situation. Say the expression!', sec:20},
  listen:{R:()=>S.R.listen, bank:LISTEN, kind:'Listening',  title:'LISTENING CHECK', instr:'Answer from the voice message. You can listen again.', sec:25},
  fix:   {R:()=>S.R.fix,    bank:FIX,    kind:'Grammar',    title:'FIX THE MESSAGES', instr:'One task each — say your answer out loud.', sec:40},
  speak: {R:()=>S.R.speak,  bank:SPEAK,  kind:'Speaking',   title:'MAKE THINGS RIGHT', instr:'Answer in 2–3 sentences (15–25 seconds).', sec:30}
};
const BORDER = Object.keys(BLOCKS);
const Rof = b => BLOCKS[b].R();
const tbs = b => (S.tb[b] = S.tb[b] || {log:[], cur:null, rv:{}, closed:false});
const taskOf = (b,tid)=> BLOCKS[b].bank.find(t=>t.id===tid) || BLOCKS[b].bank[0];
const mand = b => tbs(b).log.filter(x=>!x.opt && x.res!=='skip');
const turnsIn = (b,sid)=> mand(b).filter(x=>x.sid===sid).length;
const lessonTurns = sid => BORDER.reduce((n,b)=>n+(S.tb[b]?mand(b).filter(x=>x.sid===sid).length:0),0);
function target(b){
  const R=Rof(b), P=here(), done=mand(b).length, T=tbs(b);
  const remaining=T.closed?0:P.reduce((n,s)=>n+Math.max(0,R-turnsIn(b,s.id)),0);
  const total=done+remaining, base=P.length*R;
  const away=mand(b).filter(x=>!P.some(s=>s.id===x.sid)).length;
  const over=P.reduce((n,s)=>n+Math.max(0,turnsIn(b,s.id)-R),0);
  const waiting=T.closed?P.filter(s=>turnsIn(b,s.id)<R).length:0;
  return {R, N:P.length, done, remaining, total, base, away, over, waiting, complete:remaining===0};
}
function pickStudent(b, exclude=[]){
  const R=Rof(b), P=here(), off=BORDER.indexOf(b);
  /* avoid giving two turns in a row to the same student (also across blocks) */
  const all=BORDER.flatMap(x=>S.tb[x]?S.tb[x].log:[]).sort((a,c)=>a.at-c.at), lastSid=all.length?all[all.length-1].sid:null;
  const c=P.map((s,i)=>({s, i:(i-off+P.length*4)%Math.max(1,P.length)})).filter(o=>turnsIn(b,o.s.id)<R && !exclude.includes(o.s.id));
  if(!c.length) return null;
  c.sort((x,y)=> turnsIn(b,x.s.id)-turnsIn(b,y.s.id) || (x.s.id===lastSid)-(y.s.id===lastSid) || lessonTurns(x.s.id)-lessonTurns(y.s.id) || x.i-y.i);
  return c[0].s.id;
}
function pickTask(b, sid, avoid){
  const B=BLOCKS[b], T=tbs(b), used=new Set(T.log.filter(x=>x.res!=='skip').map(x=>x.tid)); if(T.cur) used.add(T.cur.tid); if(avoid) used.add(avoid);
  const pend=B.bank.filter(t=>!used.has(t.id));
  if(pend.length) return pend[0].id;
  const mine=new Set(T.log.filter(x=>x.sid===sid).map(x=>x.tid)), cnt=t=>T.log.filter(x=>x.tid===t.id).length;
  const pool=B.bank.filter(t=>t.id!==avoid && !mine.has(t.id)); return (pool.length?pool:B.bank).slice().sort((a,c)=>cnt(a)-cnt(c))[0].id;
}
function assign(b){
  const T=tbs(b), tg=target(b); T.rv={};
  if(tg.complete){ T.cur=null; return; }
  const sid=pickStudent(b); if(!sid){ T.cur=null; return; }
  T.cur={sid, tid:pickTask(b,sid), opt:false, at:Date.now()};
  if(BLOCKS[b].sec && ROLE==='teacher') TMR.set(BLOCKS[b].sec, true);
}
function ensureCur(b){
  const T=tbs(b), tg=target(b);
  if(T.cur && T.cur.opt) return;
  if(T.cur){
    if(tg.complete){ T.cur=null; return; }
    const s=stu(T.cur.sid);
    if(!s || !s.here || s.gone || turnsIn(b,T.cur.sid)>=Rof(b)){ const n=pickStudent(b); if(n) T.cur.sid=n; else T.cur=null; }
    return;
  }
  if(!tg.complete) assign(b);
}
function markDone(b, res){
  const T=tbs(b); if(!T.cur) return;
  T.log.push({tid:T.cur.tid, sid:T.cur.sid, res, opt:!!T.cur.opt, at:Date.now(), pick:T.rv.pick??null});
  const wasOpt=T.cur.opt; T.cur=null; T.rv={};
  if(target(b).complete){ if(!wasOpt){ T.closed=true; toast('✅ All turns done — '+target(b).total+' / '+target(b).total); SND.play('done'); } }
  else assign(b);
  save(); draw();
}
function reopen(b){ const T=tbs(b); T.closed=false; ensureCur(b); save(); draw(); toast('Block reopened for the students who haven’t had a turn'); }
function swapTask(b){ const T=tbs(b); if(!T.cur) return; T.cur.tid=pickTask(b,T.cur.sid,T.cur.tid); T.rv={}; save(); draw(); }
function setTurnStudent(b,sid){ const T=tbs(b); if(!T.cur) return; T.cur.sid=sid; save(); draw(); }
function nextStudentAuto(b){ const T=tbs(b); if(!T.cur) return; const n=pickStudent(b,[T.cur.sid]); if(n){ T.cur.sid=n; save(); draw(); } else toast('Everyone else has finished their turns in this block'); }
/* Skip = the student isn’t ready: they keep their turn for later, the next student answers now (same task) */
function skipTurn(b){ const T=tbs(b); if(!T.cur) return; const was=T.cur.sid; const n=pickStudent(b,[was]);
  if(!n) return toast('Nobody else is waiting — give a hint or use “With help”');
  T.cur.sid=n; T.rv={}; save(); draw(); toast(sname(was)+' skipped for now — they keep their turn'); }
function extraTurn(b){
  const T=tbs(b), P=here(); if(!P.length) return toast('Add students in 👥 Class first');
  const sid=P.slice().sort((x,y)=>lessonTurns(x.id)-lessonTurns(y.id))[0].id;
  T.cur={sid, tid:pickTask(b,sid), opt:true, at:Date.now()}; T.rv={}; save(); draw(); }
function cancelExtra(b){ const T=tbs(b); if(T.cur&&T.cur.opt){ T.cur=null; T.rv={}; ensureCur(b); save(); draw(); } }
function undoTurn(b){ const T=tbs(b); const last=T.log.pop(); if(!last) return; T.closed=false; T.cur={sid:last.sid, tid:last.tid, opt:last.opt, at:Date.now()}; T.rv={}; if(last.pick!=null) T.rv.pick=last.pick; save(); draw(); toast('Last action undone — it is the current turn again'); }
function nextUp(b){ const T=tbs(b); return pickStudent(b, T.cur?[T.cur.sid]:[]); }

/* story reading turns (dialogue lines — shared, separate from the task quota) */
const readsOf = sid => Object.values(S.reads).filter(v=>v===sid).length;
function readerFor(key){
  if(ROLE!=='teacher') return S.reads[key] || null;
  const cur=S.reads[key], P=here(); if(!P.length) return null;
  if(cur && P.some(s=>s.id===cur)) return cur;
  const keys=Object.keys(S.reads), prev=keys.length?S.reads[keys[keys.length-1]]:null;
  const n=keys.length, c=P.map((s,i)=>({s, i:(i-n%P.length+P.length)%P.length}));
  c.sort((x,y)=>readsOf(x.s.id)-readsOf(y.s.id) || (x.s.id===prev)-(y.s.id===prev) || x.i-y.i);
  S.reads[key]=c[0].s.id; return c[0].s.id;
}
function cycleReader(key){ const P=here(); if(!P.length) return; const i=P.findIndex(s=>s.id===S.reads[key]); S.reads[key]=P[(i+1)%P.length].id; save(); draw(); }

/* ---------- timers ---------- */
const TMR = {
  left(){ const t=S.tmr; return t.run ? Math.max(0,(t.end-Date.now())/1000) : t.left; },
  run(){ return !!S.tmr.run; },
  set(sec, quiet){ S.tmr={dur:sec, left:sec, run:false, end:0}; if(!quiet){ save(); this.paint(); pubState(); } },
  start(){ const t=S.tmr; if(t.left<=0) t.left=t.dur; t.end=Date.now()+t.left*1000; t.run=true; save(); this.paint(); pubState(); },
  pause(){ const t=S.tmr; t.left=this.left(); t.run=false; save(); this.paint(); pubState(); },
  toggle(){ this.run()?this.pause():this.start(); },
  reset(){ this.set(S.tmr.dur||60); },
  add(sec){ const t=S.tmr; if(t.run) t.end+=sec*1000; else t.left+=sec; t.dur=Math.max(t.dur,t.left); save(); this.paint(); pubState(); },
  tick(){ const t=S.tmr; if(ROLE==='teacher' && t.run && Date.now()>=t.end){ t.run=false; t.left=0; save(); SND.play('buzz'); toast('⏰ Time is up — move on when you’re ready.'); pubState(); }
    this.paint(); CLOCK.paint(); },
  paint(){ const l=this.left(); $$('[data-clock]').forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=10&&l>0&&S.tmr.dur<=60 || l<=30&&l>0&&S.tmr.dur>60); e.classList.toggle('out',l<=0); });
    $$('[data-tplay]').forEach(b=>b.textContent=this.run()?'❚❚ Pause':(this.left()<S.tmr.dur&&this.left()>0?'▶ Resume':'▶ Start')); }
};
const CLOCK = {
  el(){ const c=S.clock; return c.acc + (c.run ? (Date.now()-c.start)/1000 : 0); },
  toggle(){ const c=S.clock; if(c.run){ c.acc=this.el(); c.run=false; } else { c.start=Date.now(); c.run=true; } save(); this.paint(); },
  begin(){ if(!S.clock.run && S.clock.acc===0){ S.clock.start=Date.now(); S.clock.run=true; } },
  reset(){ S.clock={run:false, acc:0, start:0}; save(); this.paint(); },
  paint(){ const b=$('#clock'); if(!b) return; const e=this.el(), left=CORE_MIN*60-e;
    b.innerHTML=`<span>${S.clock.run?'⏱':'⏸'}</span><span class="v">${left>=0?mmss(left):'+'+mmss(-left)}</span><span class="of">left of ${CORE_MIN}:00</span>`;
    b.classList.toggle('over',left<0); $$('[data-lclock]').forEach(x=>x.textContent=mmss(e)); }

/* ---------- sound (Web Audio, quiet; off by default) ---------- */
const SND = {
  ctx:null,
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur=.15, type='sine', vol=.1, delay=0, f2){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); },
  play(k){ if(!S.sound || ROLE!=='teacher') return; try{
    if(k==='msg'){ this.tone(880,.08,'sine',.08); this.tone(1320,.12,'sine',.07,.07); }
    else if(k==='reveal'){ [523,659,784].forEach((f,i)=>this.tone(f,.3,'triangle',.06,i*.04)); }
    else if(k==='done'){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.3,'triangle',.07,i*.08)); }
    else if(k==='buzz'){ this.tone(330,.4,'sawtooth',.05,0,220); }
  }catch(e){} }
};

/* ---------- 7 · voice message player ----------
   1) audio file from LESSON_CONFIG.VOICE_MESSAGE (AI-generated voice, labelled);
   2) if the file is missing or can’t play → the browser reads the same script aloud (labelled “browser voice”).
   Only the teacher’s page plays sound (share sound in Zoom); the audience window shows the same player state. */
const VM = {
  el:null, mode:null, playing:false, t:0, dur:22.2, raf:0, utt:null, ttsStart:0, ttsIdx:0, failed:false,
  init(){
    if(this.el) return; this.el=$('#vm');
    if(!CFG.VOICE_MESSAGE){ this.failed=true; return; }
    this.el.src=CFG.VOICE_MESSAGE;
    this.el.addEventListener('loadedmetadata',()=>{ if(isFinite(this.el.duration)) this.dur=this.el.duration; paintVM(); });
    this.el.addEventListener('ended',()=>{ this.playing=false; this.t=this.dur; this.done(); });
    this.el.addEventListener('error',()=>{ this.failed=true; paintVM(); });
  },
  label(){ return (this.failed||!CFG.VOICE_MESSAGE) ? 'browser voice' : (CFG.VOICE_IS_AI?'AI voice':''); },
  toggle(){ this.init(); this.playing?this.pause():this.play(); },
  play(){
    this.init(); if(ROLE!=='teacher') return;
    if(!this.failed){
      if(this.t>=this.dur-.05) { this.t=0; this.el.currentTime=0; }
      const p=this.el.play(); this.playing=true; this.mode='file';
      if(p&&p.catch) p.catch(()=>{ this.failed=true; this.playing=false; this.play(); });
      this.loop(); this.note(); return;
    }
    if(!('speechSynthesis' in window)){ toast('This browser can’t play audio here — read the message aloud yourself (transcript in 🧑‍🏫 Notes).'); return; }
    this.mode='tts'; speechSynthesis.cancel(); this.playing=true; this.ttsIdx=0; this.t=0; this.speakFrom(0); this.loop(); this.note();
  },
  speakFrom(i){
    const voices=speechSynthesis.getVoices(), pref=['Aria','Jenny','Samantha','Google UK English Female','Google US English','Zira','Karen','Moira','Serena'];
    const v=pref.map(n=>voices.find(x=>x.name.includes(n)&&/^en/i.test(x.lang))).find(Boolean) || voices.find(x=>/^en[-_]?(US|GB)/i.test(x.lang)) || null;
    const say=k=>{ if(!this.playing||this.mode!=='tts') return; if(k>=VM_LINES.length){ this.playing=false; this.t=this.dur; this.done(); return; }
      this.ttsIdx=k; this.t=VM_TIMES[k]; this.ttsStart=performance.now()-VM_TIMES[k]*1000;
      const u=new SpeechSynthesisUtterance(unmark(VM_LINES[k]).replace(/[\[\]]/g,'')); if(v) u.voice=v; u.lang='en-US'; u.rate=.95; u.pitch=1.15;
      u.onend=()=>say(k+1); u.onerror=()=>say(k+1); this.utt=u; speechSynthesis.speak(u); };
    say(i);
  },
  pause(){ if(this.mode==='file'){ this.el.pause(); this.t=this.el.currentTime; } else if('speechSynthesis' in window) speechSynthesis.cancel(); this.playing=false; cancelAnimationFrame(this.raf); paintVM(); this.note(); },
  stop(){ if(this.playing) this.pause(); this.t=0; try{ if(this.el) this.el.currentTime=0; }catch(e){} paintVM(); },
  done(){ cancelAnimationFrame(this.raf); const d=sd('listen'); d.heard=(d.heard||0)+1; save(); paintVM(); this.note(); draw(); },
  loop(){ cancelAnimationFrame(this.raf); const f=()=>{ if(!this.playing) return; this.t=this.mode==='file'?this.el.currentTime:Math.min(this.dur,(performance.now()-this.ttsStart)/1000); paintVM(); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f); },
  idx(){ let k=-1; VM_TIMES.forEach((s,i)=>{ if(this.t>=s-.05) k=i; }); return this.playing||this.t>0&&this.t<this.dur?k:-1; },
  note(){ S.vm={p:this.playing, t:Math.round(this.t*10)/10, at:Date.now()}; pushScreen(); }
};
const WAVE = Array.from({length:42},(_,i)=>Math.round(22+Math.abs(Math.sin(i*1.7)*48+Math.sin(i*.6)*26)%74));

  const lab=VM.label();

    <button class="pb" data-vmp aria-label="${VM.playing?'Pause':'Play'} the voice message">${VM.playing?'❚❚':'▶'}</button>
    ${big?`<div class="meta"><b>🎤 Sophie · voice message</b><span class="small">${lab?`<span class="aitag">${esc(lab)}</span> `:''}<span data-vmt>${mmss(VM.t)} / ${mmss(VM.dur)}</span></span></div>`:''}
    <div class="wave ${VM.playing?'play':''}" aria-hidden="true">${WAVE.map((h,i)=>`<i style="--h:${h}%;--dl:${(i%7)*.12}s" class="${i/WAVE.length<VM.t/VM.dur?'on':''}"></i>`).join('')}</div>

function taskBody(b, t, T, who){
  if(b==='vocab') return { body:`<p class="small" style="margin:4px 0 6px">Which expression fits?</p><div class="sit">${esc(t.q)}</div>`,

    hint:`<div class="hintbox">🗣 ${esc(t.hint)}</div>`, ans:`<div class="sample"><small>EXAMPLE ANSWER</small>${esc(t.a)}</div>` };
  /* fix — five task types */

  let body='';
  if(t.T==='combine') body=`<div class="combine"><span class="ck">${esc(t.parts[0])}</span><span class="plus">+</span><span class="ck">${esc(t.parts[1])}</span></div>`;
  else if(t.T==='mistake') body=`<div class="mist ${T.rv.a?'shown':''}">${esc(t.pre)}<span class="bad">${esc(t.bad)}</span>${esc(t.post)}</div>`;

  else if(t.T==='rewrite') body=`<div class="rewrite"><div class="from"><small>FORMAL</small>${esc(t.q)}</div><div class="to"><small>EVERYDAY ENGLISH</small>${T.rv.a?'':'… say it out loud'}</div></div>`;
  else if(t.T==='choose') body=`<div class="chooseAB">${t.opts.map((o,i)=>{ const pk=T.rv.pick; let st=''; if(T.rv.a) st=i===t.c?'right':(pk===i?'wrong':''); else if(pk===i) st=i===t.c?'right':'wrong';
      return `<button class="${st}" data-a="pk${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`; }).join('')}</div>`;
  const hint = t.T==='combine'?`<div class="hintbox">💡 Keep the preposition at the end. Leave out “it / her / there”.</div>`
    : t.T==='mistake'?`<div class="hintbox">💡 Look at the word after “with”.</div>`
    : t.T==='rewrite'?`<div class="hintbox">💡 Move the preposition to the end. Leave out which / whom.</div>`
    : t.T==='complete'?`<div class="hintbox">💡 c_____ o_ someone</div>`:`<div class="hintbox">💡 Where is the preposition?</div>`;
  return { pre:lab, body, hint, ans:`<div class="ans"><div class="a">${esc(t.a)}</div>${t.alt?`<div class="alt">${esc(t.alt)}</div>`:''}</div>`, why:`<div class="why2"><small>WHY?</small>${esc(t.why)}</div>` };
}
function blockStep(b, o={}){
  const B=BLOCKS[b];
  return Object.assign({
    block:b, title:B.title.charAt(0)+B.title.slice(1).toLowerCase(),
    enter(){ ensureCur(b); },
    render(d){

      const T=tbs(b), tg=target(b), cur=T.cur, t=cur?taskOf(b,cur.tid):null;
      const meter=`<div class="meter" title="Required individual tasks: ${tg.N} students × ${tg.R} round${tg.R>1?'s':''}"><span>Turns</span><div class="tr"><i style="width:${tg.total?tg.done/tg.total*100:0}%"></i></div><b>${tg.done} / ${tg.total}</b></div>`;
      let h=scn(this)+(o.pre?o.pre(d):'')+`<div class="tk-head"><div class="grow"><h2 class="h-l">${esc(B.title)}</h2><p class="instr" style="margin:8px 0 0">${esc(B.instr)}</p></div>${meter}</div>`;

        h+=`<div class="turn${cur.opt?' opt':''}">
          <div class="who"><span class="mic"><span class="ini">${esc(initial(who))}</span>${esc(who)}</span>
            <span class="ty">${esc(B.kind)}</span>
            <span class="rnd">${cur.opt?'Optional extra · does not count':`Student ${Math.min(tg.done+1,tg.total)} of ${tg.total}`}</span>
            <span class="grow"></span><span class="tmr" data-clock>${mmss(TMR.left())}</span><button class="btn xs ghost tonly" data-tplay>${TMR.run()?'❚❚ Pause':'▶ Start'}</button></div>
          ${tb.pre?`<div style="margin-bottom:4px">${tb.pre}</div>`:''}
          ${tb.body}${T.rv.h?tb.hint:''}${T.rv.a?tb.ans:''}${T.rv.w&&tb.why?tb.why:''}${peerHTML(T)}
          ${turnControls(b,{revLabel:b==='speak'?'Example answer':'Reveal answer', hasHint:true, extraBtns:
              b==='fix'?`<button class="btn sm ghost" data-a="why">${T.rv.w?'🙈 Hide why':'💬 Why?'}</button>`
            : b==='speak'&&!S.core?`<button class="btn sm ghost" data-a="fol">💬 Follow-up</button><button class="btn sm ghost" data-a="peer" ${others>1?'':'disabled'}>🙋 Peer question</button>`
            : b==='speak'?`<button class="btn sm ghost" data-a="fol">💬 Follow-up</button>`:''})}
        </div>`;
      } else {
        h+=`<div class="done-card${o.post?' sm':''}"><div class="big">✅</div><h3 class="h-m">All turns done — ${tg.done} / ${tg.total}</h3><p class="muted">Everyone present had ${tg.R>1?tg.R+' turns':'a turn'}.</p>
          ${tg.waiting?`<p class="small tonly" style="color:var(--gold2)">${tg.waiting} student${tg.waiting>1?'s':''} joined after this block finished — the block stays closed. <button class="btn xs ghost" data-a="reopen">↺ Reopen for them</button></p>`:''}
          <div class="row mt" style="justify-content:center">${o.doneBtn?o.doneBtn(d):`<button class="btn primary" data-next>Continue ▶</button>`}<button class="btn ghost tonly" data-a="extra">+ Optional extra question</button>${T.log.length?`<button class="btn ghost tonly" data-a="undo">↶ Undo last</button>`:''}</div></div>`;
      }
      const slots=[]; const ml=mand(b); for(let i=0;i<tg.total;i++) slots.push(i<ml.length?(ml[i].res==='help'?'h':'d'):(i===ml.length&&cur&&!cur.opt?'c':''));
      h+=`<div class="row mt"><div class="dots" aria-label="${tg.done} of ${tg.total} turns done">${slots.map(c=>`<i class="${c}"></i>`).join('')}</div></div>`;
      if(o.post) h+=o.post(d);
      h+=whoNext(b);
      return h;
    },

      const pk=i=>()=>{ T.rv.pick=T.rv.pick===i?null:i; save(); draw(); };
      bindTurn(v,b,{on:{ why:()=>{ T.rv.w=!T.rv.w; save(); draw(); }, fol:()=>{ T.rv.f=!T.rv.f; save(); draw(); }, reopen:()=>reopen(b), pk0:pk(0), pk1:pk(1) }});
      o.after && o.after(v,d); },
    reveal(){ const T=tbs(b); if(!T.cur) return false; if(T.rv.a && b==='fix'){ T.rv.w=1; return; } T.rv.a=1; },
    hint(){ const T=tbs(b); if(!T.cur) return false; T.rv.h=1; },
    hide(){ const T=tbs(b); T.rv.a=0; T.rv.h=0; T.rv.w=0; },
    ready(){ return target(b).complete; },
    leave(){ const T=tbs(b); if(target(b).complete && !T.cur) T.closed=true; },
    gateMsg:'Some students haven’t had their turn yet — press Next again to move on anyway',
    live(){ const T=tbs(b), tg=target(b); if(!T.cur) return {kind:'msg', e:'✅', t:'All turns done in this activity!'};

  }, o.step||{});
}

/* ── breakout helpers ── */
function teamSizes(n){ if(n<=3) return [n]; if(n===4) return [2,2]; if(n===5) return [3,2]; if(n===6) return [3,3]; if(n===7) return [4,3]; if(n===8) return [4,4]; const k=Math.ceil(n/4); const base=Math.floor(n/k), extra=n%k; return Array.from({length:k},(_,i)=>base+(i<extra?1:0)); }
function rolesFor(m){ const r={};
  if(m.length===1) r[m[0]]='solo';
  else if(m.length===2){ r[m[0]]='pairA'; r[m[1]]='pairB'; }
  else { const order=['where','what','how','intro','extra']; m.forEach((sid,j)=>r[sid]=order[j]||'extra'); }
  return r; }
function buildGroups(mode){
  const P=here(), g=[];
  if(mode==='solo') P.forEach(s=>g.push({members:[s.id]}));
  else if(mode==='pairs'){ for(let i=0;i<P.length;i+=2) g.push({members:P.slice(i,i+2).map(s=>s.id)}); if(g.length>1 && g[g.length-1].members.length===1){ const last=g.pop(); g[g.length-1].members.push(last.members[0]); } }
  else { let i=0; teamSizes(P.length).forEach(n=>{ g.push({members:P.slice(i,i+n).map(s=>s.id)}); i+=n; }); }
  g.forEach((x,i)=>{ x.id='g'+(i+1); x.name=GROUP_NAMES[i%GROUP_NAMES.length]; x.roles=rolesFor(x.members); });
  S.bo.mode=mode; S.bo.groups=g; S.bo.cur=0; save();
}
/* rebuild the teams when attendance changed since they were made (keeps the teacher’s chosen mode) */
function ensureGroups(){ const P=here().map(s=>s.id).sort().join(), G=S.bo.groups.flatMap(g=>g.members).sort().join();
  if(S.bo.groups.length && P===G) return;
  const mode = here().length===1 ? 'solo' : (S.bo.modeSet ? S.bo.mode : 'teams'); buildGroups(mode); }
function moveMember(sid){ const G=S.bo.groups; if(G.length<2) return; const i=G.findIndex(g=>g.members.includes(sid)); if(i<0) return;
  G[i].members=G[i].members.filter(x=>x!==sid); const j=(i+1)%G.length; G[j].members.push(sid);
  S.bo.groups=G.filter(g=>g.members.length); S.bo.groups.forEach(g=>g.roles=rolesFor(g.members)); save(); }
function groupsHTML(editable){ if(!S.bo.groups.length) return '';
  return `<div class="groups">${S.bo.groups.map(g=>`<div class="grp"><h4>${esc(g.name)}</h4>${g.members.map(sid=>{ const r=ROLES[g.roles[sid]]||ROLES.extra;
    return `<div class="m">${iniBubble(sname(sid))}<span>${esc(sname(sid))}</span><span class="rl">${r.e} ${esc(r.t)}</span>${editable&&S.bo.groups.length>1?`<button class="btn xs ghost tonly" data-mv="${sid}" title="Move to the next team">⇄</button>`:''}</div>`; }).join('')}</div>`).join('')}</div>`; }
function missionText(){ return `${MISSION.title}
${MISSION.sub}
${MISSION.qs.map(q=>q.n+') '+q.q).join('\n')}
${MISSION.must}
${MISSION.nowrite}
${S.bo.groups.map(g=>g.name+': '+g.members.map(sid=>sname(sid)+' ('+(ROLES[g.roles[sid]]||ROLES.extra).t+')').join(', ')).join('\n')}`; }
function planCard(g){ const c=S.bo.cards[g.id]||{};
  return `<div class="plan"><h4>${esc(g.name)} · plan card <span class="small" style="font-family:var(--body)">(optional — talking is enough)</span></h4>${CARD_F.map(([k,e,l])=>`<label>${e} ${l}<input data-card="${g.id}" data-f="${k}" value="${esc(c[k]||'')}" maxlength="60" placeholder="______" aria-label="${esc(g.name)} — ${l}"></label>`).join('')}</div>`; }
function bindCards(v){ $$('[data-card]',v).forEach(i=>{ i.oninput=()=>{ const c=S.bo.cards[i.dataset.card]=S.bo.cards[i.dataset.card]||{}; c[i.dataset.f]=i.value.slice(0,60); save(); pubState(); }; i.onkeydown=e=>{ if(e.key==='Enter') i.blur(); }; }); }

  const s=cur(), d=sd(s.id);
  if((d.p||0)>parts(s)-1) d.p=parts(s)-1;
  const entering = LAST.id!==s.id;
  CTX={entering, partChanged: entering || LAST.p!==(d.p||0)};
  if(entering && ROLE==='teacher' && s.enter) s.enter(d);

  if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  bindReaders(v);

function fitSheet(){
  const el=$('#sheet'), wrap=$('.sh-wrap',el), tb=$('table',el), w=$('#shWarn',el); if(!wrap||!tb) return;
  el.classList.remove('alt'); w.classList.add('hidden');
  const fits=f=>{ el.style.setProperty('--tf',f+'px'); el.style.setProperty('--rg',Math.max(2,Math.round(f*.2))+'px'); tb.style.height='auto'; const ok=tb.scrollHeight<=wrap.clientHeight+1 && tb.scrollWidth<=wrap.clientWidth+1; tb.style.height=''; return ok; };
  let lo=11, hi=Math.min(44, Math.max(14, innerHeight/22)), best=0;
  for(let k=0;k<14;k++){ const m=(lo+hi)/2; if(fits(m)){ best=m; lo=m; } else hi=m; }
  const MIN=15;
  if(best>=MIN){ fits(Math.floor(best*10)/10); return; }
  el.classList.add('alt'); el.style.setProperty('--tf','17px');
  w.textContent=`This screen (${innerWidth}×${innerHeight}) is too small to show all 12 rows readably at once — showing a scrollable list instead. For the one-screen table use a laptop or desktop window (1366×768 or larger).`;
  w.classList.remove('hidden');
}
