/* ---------- 12 · live room ----------
   Учитель — єдине джерело стану. Захист (як в уроках 13–23):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»: не перемикає сцени,
     не бачить відповідей до Reveal, не змінює присутність інших, не скидає урок;
   • учні надсилають тільки hello / ans / card / react; учитель перевіряє кожне (поточне завдання, межі, довжину,
     для картки команди — що учень справді в цій команді);
   • лише ім’я / нік, жодних інших даних. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const WALLQ = [], NAMES = {};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','📷'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson25-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }

        <p style="font-size:22px;font-weight:800;margin:6px 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p>
        <p style="font-size:20px;font-weight:700">${emph(T.prompt)}</p>
        ${T.hint?`<p class="small">💡 ${esc(T.hint)}</p>`:''}
        ${T.ans?`<div class="stu-card" style="background:rgba(91,227,168,.12);border-color:rgba(91,227,168,.5)"><b>${esc(T.ans)}</b></div>`:`<p class="small">${mine?'Say your answer out loud in Zoom.':'Listen — could you help if they get stuck?'}</p>`}</div>`; paintT(); return; }
    const choiceCard=(id,q,opts,chosen)=>{ const my=sent[id], dec=chosen!=null;
      return `<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt ${dec&&chosen===i?'right':my===i?'pick':''}" data-q="${esc(id)}" data-i="${i}" ${dec?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${dec?`Answer: ${LET[chosen]}. Look at the main screen.`:my!==undefined?'✓ Vote sent! You can change it.':'Tap your choice.'}</p></div>`; };
    const bindChoice=()=>$$('[data-q]',B).forEach(b=>b.onclick=()=>{ sent[b.dataset.q]=+b.dataset.i; Net.send({t:'ans', task:b.dataset.q, v:+b.dataset.i}); render(); });
    if(T.kind==='choice'){ B.innerHTML=hd+choiceCard(T.id,T.q,T.opts,T.chosen)+(T.quiz&&st.my&&st.my[nameKey(name)]!=null?`<p class="small center">⭐ Your points: <b>${st.my[nameKey(name)]}</b></p>`:''); bindChoice(); return; }
    if(T.kind==='awards'){ B.innerHTML=hd+`<p class="small">Vote for IDEAS — one vote in each category.</p>`+T.cats.map(c=>choiceCard(c.id,c.q,c.opts,null)).join(''); bindChoice(); return; }
    if(T.kind==='group'){
      const g=(T.groups||[]).find(x=>x.m.some(p=>me(p.n)));
      if(g){ const r=g.m.find(p=>me(p.n)), c=g.card||{}; B.innerHTML=hd+`<div class="stu-card myturn"><p class="small">Your team <span id="stuT"></span></p><h2 class="dsp" style="font-size:28px">${esc(g.name)}</h2>
          <p style="font-size:20px;font-weight:800;margin-top:10px">You say: ${esc(r.r)}</p><p>${esc(r.d)}</p>
          <p class="small mt">Team: ${g.m.map(p=>esc(p.n)+' ('+esc(p.r)+')').join(', ')}</p></div>
          <div class="stu-card"><b>DESIGN THE PERFECT SATURDAY 🎉</b>${T.steps.map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}
          <p class="small">Use at least TWO relative clauses with prepositions. Optional team card — your team sees it:</p>${CARD_F.map(([k,e,l])=>`<label for="cf${k}">${e} ${l}</label><input id="cf${k}" data-cf="${k}" maxlength="60" value="${esc(c[k]||'')}" placeholder="optional">`).join('')}</div>`;
        $$('[data-cf]',B).forEach(i=>{ let t=null; i.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>Net.send({t:'card', g:g.id, f:i.dataset.cf, v:i.value.slice(0,60)}),400); }; }); }
      else B.innerHTML=hd+`<div class="stu-card"><p><b>Teams</b> <span id="stuT"></span></p>${(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(p=>esc(p.n)).join(', ')}</p>`).join('')}<p class="small">Can’t find your name? Ask your teacher — use the same name as on their list.</p></div>`;
      paintT(); return; }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(S.sheet.open&&S.gz){ if(S.sheet.pres){ S.sheet.pres=false; } else S.sheet.open=false; save(); paintSheet(); pubState(); return; } if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  if(S.gz && S.sheet.open) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A' && tag!=='SUMMARY')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(!S.gz && s.block && tbs(s.block).cur && (!BLOCKS[s.block].scoped || taskOf(s.block,tbs(s.block).cur.tid).part===s.scope)) markDone(s.block,'ok'); }
  else if(k==='n') openNav(); else if(k==='c') openCrew(); else if(k==='w') toggleNotes(); else if(k==='f') present();
  else if(k==='g') S.gz?closeGZ():openGZ('home');
  else if(k==='p' && (cur().id==='dm'||cur().id==='listen')) { VM.toggle(); paintVM(); }
});
if(ROLE==='student'){ buildBackdrop(); studentApp(); }
else if(ROLE==='screen'){ buildBackdrop(); buildRail(); screenApp(); }
else {
  buildBackdrop(); applyAnim(); buildRail();
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bHint').onclick=hint;
  $('#bWs').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false); $('#bNav').onclick=openNav; $('#bCrew').onclick=openCrew;
  $$('#notes [data-nt]').forEach(b=>b.onclick=()=>{ S.nt=b.dataset.nt; save(); paintNotes(); });
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#bScreen').onclick=openScreen; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#bQuick').onclick=()=>setQuick(!S.core); $('#clock').onclick=()=>CLOCK.toggle();
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello') pushScreen(); };
  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  if(S.ws && innerWidth>=1280){ $('#notes').classList.add('on'); document.body.classList.add('ws'); $('#notes').setAttribute('aria-hidden','false'); }
  draw();
  if(S.live) startLive(true);
}


</script>
