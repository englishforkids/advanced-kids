.mission{counter-reset:m; display:grid; gap:12px; margin:16px 0 0; padding:0; list-style:none}
.mission li{display:flex; gap:14px; align-items:center; font-size:20px; font-weight:700; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.mission li::before{counter-increment:m; content:counter(m); width:34px; height:34px; flex:0 0 34px; border-radius:10px; display:grid; place-items:center; background:var(--cyan); color:#04111A; font-family:var(--mono); font-weight:700}
.wsw{font-family:var(--dsp); font-size:clamp(40px,5.6vw,76px); line-height:.95; letter-spacing:-.03em}
.wsw span{color:var(--red)}

/* options */
.opts{display:grid; gap:11px}
.opt{display:flex; align-items:center; gap:14px; text-align:left; width:100%; padding:14px 16px; border-radius:16px; background:rgba(255,255,255,.05); border:1.5px solid var(--line2); font-weight:700; font-size:19px; transition:.15s; position:relative}
.opt:hover{background:rgba(255,255,255,.09)}
.opt .L{width:36px; height:36px; flex:0 0 36px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.08); font-family:var(--mono); font-size:15px; font-weight:700}
.opt .n{margin-left:auto; font-family:var(--mono); font-size:14px; color:var(--cyan); min-width:20px; text-align:right}
.opt.pick{border-color:var(--cyan); background:rgba(57,216,246,.1)}
.opt.pick .L{background:var(--cyan); color:#04111A}
.opt.right{border-color:var(--green); background:rgba(54,224,155,.14)}
.opt.right .L{background:var(--green); color:#03140C}
.opt.right::after{content:"✓"; position:absolute; right:-10px; top:-10px; width:30px; height:30px; border-radius:50%; background:var(--green); color:#03140C; display:grid; place-items:center; font-weight:900; font-size:16px}
.opt.wrongpick{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.opt.dim{opacity:.42}
.opt.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opts.chips{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.chips .opt{justify-content:center; font-size:20px}

.explain{margin-top:16px; padding:16px 18px; border-radius:16px; background:rgba(54,224,155,.09); border:1px solid rgba(54,224,155,.4)}
.explain .k{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--green)}
.explain .a{font-family:var(--dsp); font-size:28px; margin:2px 0 4px}
.explain p{margin:0; font-size:18px}
.explain .ex{margin-top:8px; font-size:17px; color:#D6DAF0}
.explain .ex b{color:#fff}
.stamp{animation:stampIn .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stampIn{from{opacity:0; transform:scale(1.25) rotate(-2deg)} to{opacity:1; transform:none}}

.cdots{display:flex; gap:6px; flex-wrap:wrap}
.cdots button{min-width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid var(--line); font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted)}
.cdots button.done{background:rgba(54,224,155,.15); border-color:rgba(54,224,155,.5); color:var(--green)}
.cdots button.cur{background:var(--cyan); color:#04111A; border-color:var(--cyan)}
.deckbar{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap}

.sit{border-radius:22px; padding:28px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative; overflow:hidden; min-height:220px; display:flex; flex-direction:column; justify-content:center}
.sit .num{position:absolute; right:18px; top:12px; font-family:var(--dsp); font-size:84px; color:rgba(255,255,255,.05); line-height:1}
.sit .ico{font-size:52px; line-height:1; margin-bottom:12px}
.sit p{font-size:clamp(22px,2.5vw,30px); font-weight:800; line-height:1.3; margin:0}

.hintbox{margin-top:14px; padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.1); border:1px dashed rgba(255,193,77,.55); color:#FFE3A8; font-size:17px}
.hintbox b{color:#fff}

/* flash cards */
.flash{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.fc{perspective:900px; height:150px}
.fc .in{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:16px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; border:1px solid var(--line2)}
.fc .fa{background:linear-gradient(160deg,#1C2340,#121629); font-weight:800; font-size:20px}
.fc .fa small{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--faint); margin-top:8px}
.fc .fb{background:linear-gradient(160deg,rgba(57,216,246,.2),rgba(141,123,255,.18)); transform:rotateY(180deg); font-size:16.5px; font-weight:600}
.fc .fb b{display:block; font-size:15px; color:var(--cyan); margin-bottom:5px}

/* reported speech transformations */
.qbox{border-radius:20px; padding:22px 24px; background:rgba(255,255,255,.05); border:1px solid var(--line2)}
.qbox .lab{font-family:var(--mono); font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.qbox .s{font-size:clamp(22px,2.4vw,30px); font-weight:800; line-height:1.35}
.qbox.direct{border-color:rgba(255,143,199,.45)} .qbox.direct .lab{color:var(--mia)}
.qbox.rep{border-color:rgba(57,216,246,.5)} .qbox.rep .lab{color:var(--cyan)}
.swap{display:inline-block; padding:0 6px; border-radius:8px; background:rgba(57,216,246,.18); color:#fff; border:1px solid rgba(57,216,246,.5)}
.swap.fx{animation:swapIn .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes swapIn{0%{opacity:0; transform:translateY(-14px) rotateX(80deg)} 100%{opacity:1; transform:none}}
.tfgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.tf{padding:14px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid var(--line); text-align:center; font-weight:800; font-size:20px}
.tf .a{color:var(--mia)} .tf .b{color:var(--cyan)} .tf .x{display:block; color:var(--faint); font-size:15px; margin:2px 0}
.back{display:flex; align-items:center; gap:16px; justify-content:center; padding:18px; border-radius:20px; background:linear-gradient(90deg,rgba(57,216,246,.1),rgba(141,123,255,.12)); border:1px solid var(--line2)}
.back .w{font-family:var(--dsp); font-size:clamp(24px,3vw,38px)}
.back .arr{position:relative; width:160px; height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden}
.back .arr i{position:absolute; inset:0; background:linear-gradient(270deg,var(--cyan),transparent); animation:arrBack 1.6s ease-in-out infinite}
@keyframes arrBack{from{transform:translateX(100%)} to{transform:translateX(-100%)}}

/* time machine */
.tm-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.tmc{border-radius:20px; padding:16px 18px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:grid; gap:8px; transition:.3s; cursor:pointer; position:relative}
.tmc .tense{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12.5px; letter-spacing:.06em; font-weight:700; color:var(--muted)}
.tmc .tense b{color:var(--mia)} .tmc .tense em{font-style:normal; color:var(--cyan)}
.tmc .d{display:flex; gap:10px; align-items:center; font-size:19px; font-weight:700}
.tmc .r{font-size:19px; font-weight:800; color:#fff; padding:9px 12px; border-radius:12px; background:rgba(57,216,246,.1); border:1px dashed rgba(57,216,246,.45)}
.tmc .r.q{color:var(--faint); font-weight:700; background:rgba(255,255,255,.03); border-color:var(--line2)}
.tmc.on{border-color:rgba(57,216,246,.5); background:rgba(57,216,246,.06)}
.tmc .r .v{color:var(--amber)}
.tmc.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}
.dial{display:flex; align-items:center; gap:16px}
.dial .clock{width:74px; height:74px; border-radius:50%; border:3px solid var(--cyan); position:relative; box-shadow:0 0 30px -6px var(--cyan)}
.dial .clock i{position:absolute; left:50%; top:50%; width:3px; height:28px; background:var(--cyan); transform-origin:50% 0; border-radius:3px; animation:rewind 2.4s linear infinite}
.dial .clock i+i{height:18px; background:#fff; animation-duration:9s}
@keyframes rewind{from{transform:rotate(180deg)} to{transform:rotate(-180deg)}}
.think{margin-top:18px; text-align:center; font-family:var(--dsp); font-size:clamp(24px,3vw,36px)}

/* what else changes */
.ch3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.chc{border-radius:20px; padding:18px; background:rgba(255,255,255,.045); border:1px solid var(--line)}
.chc h3{font-size:19px; font-family:var(--mono); letter-spacing:.12em; margin-bottom:10px}
.chc div{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:19px; font-weight:700}
.chc div:last-child{border-bottom:0}
.chc div span:first-child{color:var(--mia)} .chc div span:last-child{color:var(--cyan); text-align:right}

/* voice message */
.voice{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:20px; background:#1B2138; border:1px solid var(--line2); max-width:460px; flex:1; min-width:220px}
.voice .play{width:52px; height:52px; flex:0 0 52px; border-radius:50%; background:var(--nora); color:#03140C; display:grid; place-items:center; font-size:20px}
.wave{flex:1; display:flex; align-items:center; gap:3px; height:42px}
.wave i{flex:1; border-radius:3px; background:rgba(255,255,255,.3); height:var(--h)}
.voice.playing .wave i{animation:wv .8s ease-in-out infinite; background:var(--nora)}
@keyframes wv{50%{transform:scaleY(.4)}}
.transcript{margin-top:12px; padding:14px 18px; border-radius:16px; background:rgba(67,229,160,.08); border:1px solid rgba(67,229,160,.35); font-size:22px; font-weight:800}
.transcript small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--nora); font-weight:700}

.gapline{font-size:clamp(22px,2.6vw,32px); font-weight:800; line-height:1.9}
.gap{display:inline-flex; min-width:150px; justify-content:center; padding:0 12px; margin:0 4px; border-radius:12px; border:2px dashed var(--line3); color:var(--faint); line-height:1.45; vertical-align:middle; transition:.2s}
.gap.f{border-style:solid; border-color:var(--cyan); color:#fff; background:rgba(57,216,246,.1)}
.gap.ok{border-color:var(--green); background:rgba(54,224,155,.14); color:#fff}
.gap.no{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.chipset{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.chipset .lab{width:100%; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted)}
.chip{padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-weight:800; font-size:18px}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{border-color:var(--cyan); background:rgba(57,216,246,.14)}
.recovered{display:flex; align-items:center; gap:16px; padding:18px 22px; border-radius:20px; background:linear-gradient(135deg,rgba(54,224,155,.18),rgba(57,216,246,.1)); border:1px solid rgba(54,224,155,.55)}
.recovered .t{font-family:var(--dsp); font-size:clamp(24px,3vw,36px)}

/* reporting verbs */
.verbs{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.vb{--c:var(--cyan); border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); border-top:4px solid var(--c); display:flex; flex-direction:column; gap:6px; text-align:left; transition:.25s}
.vb .e{font-size:30px; line-height:1}
.vb h3{font-family:var(--dsp); font-size:26px; color:var(--c)}
.vb .def{font-size:16px; font-weight:600; color:#D6DAF0; line-height:1.35}
.vb .exm{font-size:15.5px; font-weight:700; padding:9px 11px; border-radius:12px; background:rgba(255,255,255,.05); border:1px dashed var(--line2); margin-top:auto}
.vb .exm.q{color:var(--faint); font-weight:600}
.vb .exm b{color:var(--c)}
.vb.on{background:rgba(255,255,255,.07); border-color:var(--line2)}
.vb.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}

.quote{display:flex; gap:16px; align-items:flex-end}
.quote .bub{font-size:clamp(22px,2.5vw,30px); font-weight:800; padding:18px 22px; border-radius:24px 24px 24px 8px}

/* reading */
.read{display:grid; gap:16px}
.chunk{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:start; padding:18px 20px; border-radius:20px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.chunk .t{font-size:clamp(19px,1.9vw,23px); line-height:1.55; font-weight:600}
.chunk .t p{margin:0}
.chunk .ix{width:54px; height:54px; border-radius:16px; display:grid; place-items:center; font-size:26px; background:rgba(57,216,246,.12); border:1px solid rgba(57,216,246,.35)}
.chunk.fx{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3)}
.chunk .vis{grid-column:2; display:flex; gap:10px; flex-wrap:wrap; margin-top:4px}
.mini{display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:14px; background:#1B2138; border:1px solid var(--line2); font-size:15.5px; font-weight:700}
.mini.rd{border-color:rgba(255,84,112,.55); background:rgba(255,84,112,.1)}
.mini.gr{border-color:rgba(54,224,155,.55); background:rgba(54,224,155,.1)}
.mini .av{--s:26px !important}
.gl{border-bottom:2px dotted var(--amber); cursor:help}
.glbox{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.glbox span{font-size:15.5px; padding:6px 12px; border-radius:12px; background:rgba(255,193,77,.1); border:1px solid rgba(255,193,77,.4)}
.glbox b{color:var(--amber)}
.fulltext{font-size:clamp(18px,1.75vw,21px); line-height:1.75; font-weight:600}
.fulltext p{margin:0 0 .8em}
.tgt{cursor:pointer; border-radius:6px; padding:1px 2px; transition:.2s; border-bottom:2px solid transparent}
.tgt:hover{background:rgba(255,255,255,.06)}
.tgt.found{background:rgba(255,193,77,.25); border-bottom-color:var(--amber); color:#fff}
.tgt.found.fx{animation:found .7s ease}
@keyframes found{30%{background:rgba(255,193,77,.7); box-shadow:0 0 22px rgba(255,193,77,.6)}}
.notgt{animation:shake .4s}
.findlist{display:grid; gap:9px}
.findlist div{display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.04); border:1px dashed var(--line2); font-weight:700; color:var(--faint)}
.findlist div.ok{color:#fff; border-style:solid; border-color:rgba(255,193,77,.55); background:rgba(255,193,77,.1)}

/* truth board */
.board{position:relative; border-radius:28px; padding:28px; background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.04),transparent 40%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px), #0E1220; border:1px solid var(--line2); overflow:hidden}
.chain{display:grid; gap:0; justify-items:center}
.node{position:relative; display:flex; gap:14px; align-items:center; width:min(100%,var(--w)); padding:14px 18px; border-radius:18px; border:1px solid var(--line2); background:#161B2E;
  transform:rotate(var(--rot)); box-shadow:0 18px 30px -20px #000}
.node .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.node .tx{font-weight:800; font-size:var(--fs); line-height:1.25}
.node .tx small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); font-weight:700}
.node.fx{animation:nodeIn .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes nodeIn{from{opacity:0; transform:rotate(var(--rot)) translateY(-18px) scale(.9)} to{opacity:1; transform:rotate(var(--rot))}}
.node.rumour{background:linear-gradient(135deg,#3A0E1E,#25091A); border:2px solid var(--red); box-shadow:0 0 40px -6px rgba(255,84,112,.7)}
.node.rumour .tx{color:#FFE1E7; text-transform:uppercase; letter-spacing:.01em; animation:glitch 2.4s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none; transform:none}93%{text-shadow:-3px 0 var(--cyan),3px 0 var(--red); transform:translateX(2px)}96%{text-shadow:3px 0 var(--cyan),-3px 0 var(--red); transform:translateX(-2px)}}
.link{height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; letter-spacing:.14em; font-weight:700}
.link .ln{width:2px; flex:1; background:repeating-linear-gradient(180deg,var(--red) 0 6px,transparent 6px 10px)}
.link span{padding:2px 10px; border-radius:99px; background:#2A1220; border:1px solid rgba(255,84,112,.5); color:#FFB4C2; white-space:nowrap}
.strip{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px}
.strip span{font-family:var(--mono); font-weight:700; letter-spacing:.08em; padding:9px 14px; border-radius:12px; font-size:15px}
.strip i{font-style:normal; color:var(--faint)}
.strip.fx span{animation:popIn .4s both}
.strip.fx span:nth-of-type(2){animation-delay:.15s}.strip.fx span:nth-of-type(3){animation-delay:.3s}.strip.fx span:nth-of-type(4){animation-delay:.45s}

/* speaking */
.spq{border-radius:26px; padding:30px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative}
.spq .q{font-size:clamp(26px,3.1vw,40px); font-weight:800; line-height:1.22}
.fu{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.fu button{padding:9px 14px; border-radius:12px; font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.08em; border:1.5px solid var(--line2); background:rgba(255,255,255,.05)}
.fu button.on{border-color:var(--amber); color:var(--amber); background:rgba(255,193,77,.1)}
.fuq{margin-top:12px; display:grid; gap:8px}
.fuq div{padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.08); border-left:4px solid var(--amber); font-size:20px; font-weight:700}
.sample{margin-top:16px; padding:14px 18px; border-radius:16px; background:rgba(54,224,155,.08); border:1px solid rgba(54,224,155,.4); font-size:20px; font-weight:700}
.sample small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--green)}
.wall{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.wall .w{padding:10px 14px; border-radius:14px; background:rgba(57,216,246,.1); border:1px solid rgba(57,216,246,.4); font-weight:700; font-size:17px; animation:popIn .4s both}
.wall .w small{display:block; font-size:12px; color:var(--muted)}

/* rumour control unit */
.rcu{display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:20px; background:linear-gradient(90deg,rgba(255,84,112,.18),rgba(255,84,112,.04)); border:1px solid rgba(255,84,112,.5); margin-bottom:18px}
.siren{font-size:40px; animation:siren 1s steps(2) infinite}
@keyframes siren{50%{filter:hue-rotate(200deg) brightness(1.3)}}
.steps6{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:10px}
.steps6 li{display:flex; gap:14px; align-items:center; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:19px; font-weight:700}
.steps6 li::before{counter-increment:s; content:counter(s); width:36px; height:36px; flex:0 0 36px; border-radius:50%; display:grid; place-items:center; background:var(--red); color:#fff; font-family:var(--mono); font-weight:700}
.steps6 li b{color:var(--amber)}
.cf{border-radius:22px; padding:18px; background:#0E1222; border:1px solid var(--line2)}
.cf .hd{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; letter-spacing:.14em; color:var(--muted); margin-bottom:10px}
.cf .hd b{color:#fff; letter-spacing:.06em; font-size:15px}
.cf .rum{padding:10px 14px; border-radius:14px; background:rgba(255,84,112,.1); border:1px dashed rgba(255,84,112,.55); font-weight:700; font-size:16.5px; margin-bottom:12px}
.cf .rum small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:#FF9AAE}
.cf .chat{padding:0}
.cf .bub{font-size:17.5px}
.rep{display:grid; gap:8px}
.rep div{padding:10px 14px; border-radius:12px; background:rgba(57,216,246,.08); border-left:4px solid var(--cyan); font-size:18px; font-weight:700}
.rep div b{color:var(--amber)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{padding:10px 16px; border-radius:12px; border:1.5px solid var(--line2); background:rgba(255,255,255,.04); font-weight:800; font-size:16px}
.tabs button.on{border-color:var(--cyan); background:rgba(57,216,246,.14); color:#fff}
.vbank{display:flex; gap:7px; flex-wrap:wrap}
.vbank span{font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(255,193,77,.1); border:1px solid rgba(255,193,77,.4); color:var(--amber)}

/* timer ring */
.ringbox{display:flex; flex-direction:column; align-items:center; gap:10px}
.ring{position:relative; width:150px; height:150px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringG); stroke-linecap:round; transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:34px; font-weight:700}
.ring .t.end{color:var(--red)}
.ring.hurry{animation:hurry 1s ease-in-out infinite}
@keyframes hurry{50%{transform:scale(1.04); filter:drop-shadow(0 0 16px var(--red))}}

/* reports + vote */
.checklist{display:grid; gap:8px}
.checklist div{display:flex; gap:12px; align-items:center; font-size:19px; font-weight:700}
.checklist div::before{content:"✓"; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:rgba(54,224,155,.15); color:var(--green); border:1px solid rgba(54,224,155,.5); font-weight:900}
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px}
.tcard{border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.tcard.done{border-color:rgba(54,224,155,.6); background:rgba(54,224,155,.08)}
.tcard .tn{display:flex; align-items:center; gap:10px}
.tcard .tn b{font-size:19px} .tcard .tn span{font-size:24px}
.tcard .ws{font-size:15.5px; color:#D6DAF0; display:grid; gap:4px}
.tcard .ws div{padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.05)}
.awards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.award{border-radius:22px; padding:18px; background:rgba(255,255,255,.045); border:1.5px solid var(--line); text-align:center; cursor:pointer; transition:.2s}
.award .e{font-size:44px}
.award b{display:block; font-size:19px; margin-top:6px}
.award.on{border-color:var(--amber); background:rgba(255,193,77,.08); box-shadow:0 0 30px -10px var(--amber)}
.vbars{display:grid; gap:10px; margin-top:16px}
.vbar{display:grid; grid-template-columns:150px 1fr 50px; gap:12px; align-items:center}
.vbar button{text-align:left; font-weight:800; font-size:17px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:rgba(255,255,255,.04)}
.vbar .tr{height:30px; border-radius:10px; background:rgba(255,255,255,.06); overflow:hidden}
.vbar .tr i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--amber),var(--red)); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vbar .c{font-family:var(--mono); font-weight:700; font-size:18px}
.vbar.win button{border-color:var(--amber); color:var(--amber)}
.winners{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px}
.winners div{padding:12px; border-radius:16px; border:1px solid rgba(255,193,77,.5); background:rgba(255,193,77,.08); text-align:center; font-weight:800}

/* ending */
.closed{position:relative; text-align:center; padding:30px; border-radius:28px; background:radial-gradient(circle at 50% 0%,rgba(54,224,155,.22),transparent 60%),#0E1322; border:1px solid rgba(54,224,155,.5); overflow:hidden}
.closed .st{display:inline-block; white-space:nowrap; font-family:var(--dsp); font-size:clamp(34px,4.4vw,64px); color:var(--green); border:6px solid var(--green); border-radius:18px; padding:4px 26px; transform:rotate(-5deg); text-shadow:0 0 30px rgba(54,224,155,.5)}
.closed .st.fx{animation:bigStamp .7s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes bigStamp{from{opacity:0; transform:rotate(-5deg) scale(2.2)} to{opacity:1; transform:rotate(-5deg) scale(1)}}
.versions{display:flex; justify-content:center; gap:10px; margin:22px 0 10px; flex-wrap:wrap}
.versions span{font-size:18px; font-weight:800; padding:8px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.moral{font-family:var(--dsp); font-size:clamp(26px,3.2vw,42px); margin-top:12px}
.moral em{font-style:normal; color:var(--cyan)}

/* summary */
.sum{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sumc{border-radius:20px; padding:18px; background:rgba(255,255,255,.045); border:1px solid var(--line)}
.sumc h3{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin-bottom:10px}
.sumc .l{display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:18px; font-weight:700; border-bottom:1px solid var(--line)}
.sumc .l:last-child{border-bottom:0}
.sumc .l span:first-child{color:var(--mia)}
.sumc .l span:last-child{color:var(--cyan); text-align:right}
.sumc.span2{grid-column:span 2}
.vchips{display:flex; gap:8px; flex-wrap:wrap}
.vchips span{font-family:var(--dsp); font-size:22px; padding:6px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.unlock{animation:unlock .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes unlock{from{opacity:0; transform:translateY(16px) scale(.95); filter:blur(4px)} to{opacity:1; transform:none; filter:none}}

/* evidence board (modal) */
.evb{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:8px 4px 4px; position:relative}
.evc{position:relative; border-radius:16px; padding:16px 16px 14px; min-height:150px; background:#F4EEDD; color:#20180A; box-shadow:0 18px 30px -16px #000; transform:rotate(var(--rot))}
.evc .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.evc .k{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em; color:#8A6A2E}
.evc b{display:block; font-size:17px; margin:2px 0 6px}
.evc p{margin:0; font-size:15.5px; font-weight:600; line-height:1.35}
.evc .rp{margin-top:8px; font-size:14.5px; font-weight:700; color:#0E5A7A}
.evc.lock{background:transparent; color:var(--faint); border:2px dashed var(--line2); box-shadow:none; display:grid; place-items:center; text-align:center}
.evc.lock b{font-size:34px}
.evc.new{animation:evNew 1s ease}
@keyframes evNew{30%{transform:rotate(0) scale(1.06); box-shadow:0 0 40px var(--amber)}}
.evhead{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.evbar{flex:1; height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.evbar i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); border-radius:99px; transition:width .6s}

/* clue fly */
#clueFx{position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; opacity:0}
#clueFx.on{animation:clueFade 2.4s ease forwards}
#clueFx .cc{width:min(420px,86vw); border-radius:22px; padding:22px 24px; background:#F4EEDD; color:#20180A; box-shadow:0 40px 80px -20px #000, 0 0 0 4px rgba(255,193,77,.6); text-align:center}
#clueFx .cc .k{font-family:var(--mono); font-weight:700; letter-spacing:.2em; color:#1A7F55; font-size:14px}
#clueFx .cc b{display:block; font-family:var(--dsp); font-size:28px; margin:6px 0}
#clueFx .cc p{margin:0; font-weight:700}
#clueFx.on .cc{animation:clueFly 2.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes clueFade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes clueFly{0%{transform:scale(.6) rotate(-6deg)}14%{transform:scale(1.05) rotate(2deg)}22%{transform:scale(1) rotate(-1deg)}72%{transform:scale(1) rotate(-1deg) translate(0,0)}100%{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(10deg)}}

/* scene card */
#scard{position:fixed; inset:0; z-index:60; pointer-events:none; display:grid; place-items:center; opacity:0}
#scard.on{animation:scard 1.5s ease forwards}
#scard .in{text-align:center; padding:26px 46px; border-radius:26px; background:rgba(8,11,22,.88); border:1px solid var(--line2); backdrop-filter:blur(8px)}
#scard .k{font-family:var(--mono); letter-spacing:.24em; color:var(--cyan); font-size:14px}
#scard h2{font-family:var(--dsp); font-size:clamp(34px,5vw,60px); margin-top:8px}
@keyframes scard{0%{opacity:0; transform:scale(.96)}15%{opacity:1; transform:none}75%{opacity:1}100%{opacity:0}}

/* teacher panel, dock, modal, toast */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(440px,94vw); z-index:50; background:#0B0F1E; border-left:1px solid var(--line2); box-shadow:-30px 0 60px -20px #000;
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column}
#teacher.on{transform:none}
.thd{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); font-family:var(--mono); letter-spacing:.12em}
#tBody{overflow:auto; padding:14px 16px 30px; display:grid; gap:14px}
.tsec{padding:14px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid var(--line); font-size:16px}
.tsec h5{margin:0 0 8px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--cyan); text-transform:uppercase}
.tsec ul{margin:0; padding-left:18px} .tsec li{margin:4px 0}
.say{padding:10px 12px; border-radius:12px; background:rgba(57,216,246,.08); border-left:3px solid var(--cyan); font-weight:700}
.tgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sw{display:flex; align-items:center; gap:10px; justify-content:space-between; padding:6px 0; font-size:15px}
.sw button{width:46px; height:26px; border-radius:99px; background:rgba(255,255,255,.12); position:relative; transition:.2s; flex:0 0 46px}
.sw button::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s}
.sw button.on{background:var(--cyan)} .sw button.on::after{left:23px}
.stg{display:grid; gap:6px}
.stg button{display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:10px; border:1px solid var(--line); text-align:left; font-size:15px; font-weight:700}
.stg button.on{border-color:rgba(54,224,155,.55); background:rgba(54,224,155,.1)}
.tmap{display:grid; gap:4px}
.tmap .sn{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; color:var(--cyan); margin-top:10px}
.tmap button{display:flex; gap:8px; align-items:center; padding:7px 10px; border-radius:10px; text-align:left; font-size:15px; border:1px solid transparent}
.tmap button:hover{background:rgba(255,255,255,.06)}
.tmap button.cur{border-color:var(--cyan); background:rgba(57,216,246,.1)}
.tmap button.skip{opacity:.45}
.tmap button span:first-child{flex:1}
.tmap .m{font-family:var(--mono); font-size:12px; color:var(--faint)}

#dock{position:fixed; left:16px; bottom:84px; z-index:40; width:330px; max-height:52vh; display:none; flex-direction:column; border-radius:18px; background:rgba(11,15,30,.96); border:1px solid var(--line2); box-shadow:var(--shadow); overflow:hidden}
#dock.on{display:flex}
#dock.min .db{display:none}
.dh{display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--line)}
.db{overflow:auto; padding:10px 12px; display:grid; gap:7px}
.led{width:10px; height:10px; border-radius:50%; background:var(--faint); flex:0 0 10px}
.led.on{background:var(--green); box-shadow:0 0 10px var(--green)} .led.warn{background:var(--amber)} .led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:5px}
.names span{font-size:13px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.07)}
.wallit{display:flex; gap:6px; align-items:center}
.wallit p{flex:1; margin:0; font-size:14.5px} .wallit small{display:block; color:var(--muted); font-size:12px}
.okm{color:var(--green); font-weight:900} .nom{color:var(--bad); font-weight:900}
.dbar{display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; font-size:14px}
.dbar .tr{grid-column:1/-1; height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:-4px}
.dbar .tr i{display:block; height:100%; background:var(--cyan)}
.dbar .tr i.ok{background:var(--green)}

#modal{position:fixed; inset:0; z-index:80; background:rgba(3,4,10,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px}
#modal .box{width:min(980px,100%); max-height:90vh; overflow:auto; border-radius:26px; padding:26px; background:#0D1121; border:1px solid var(--line2); box-shadow:var(--shadow)}
#toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); z-index:90; padding:12px 20px; border-radius:14px; background:#1A2038; border:1px solid var(--line2); font-weight:700; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%)}
#reacts{position:fixed; right:30px; bottom:90px; z-index:45; width:100px; height:60vh; pointer-events:none}
#reacts span{position:absolute; bottom:0; font-size:38px; animation:rise 3s ease-out forwards}
@keyframes rise{to{transform:translateY(-55vh) scale(1.3); opacity:0}}
#confetti{position:fixed; inset:0; z-index:95; pointer-events:none}
#wm{position:fixed; right:18px; bottom:76px; z-index:2; opacity:.16; pointer-events:none}
#wm img{width:86px; display:block}

/* student phone app */
#student{display:none}
body.student{overflow:auto}
body.student #app, body.student #wm{display:none}
body.student #student{display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1}
.stu-top{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 16px; background:rgba(6,8,15,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
.stu-top b{font-family:var(--mono); letter-spacing:.14em; font-size:13px; color:var(--cyan)}
.connst{font-size:12px; color:var(--muted)}
.stu-body{flex:1; padding:16px; max-width:560px; width:100%; margin:0 auto}
.stu-card{padding:20px}
.stu-card label{display:block; font-weight:800; font-size:15px; margin:14px 0 6px}
.stu-card input,.stu-card textarea{width:100%; padding:13px 14px; border-radius:13px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-size:17px}
.stu-card textarea{min-height:64px; resize:vertical}
.stu-wait{text-align:center; padding:50px 10px}
.stu-wait .bigi{font-size:60px}
.stu-foot{position:sticky; bottom:0; display:flex; justify-content:center; gap:8px; padding:10px; background:rgba(6,8,15,.94); border-top:1px solid var(--line)}
.stu-foot button{width:48px; height:48px; border-radius:14px; background:rgba(255,255,255,.06); font-size:24px}
.stu-prog{display:flex; gap:4px; margin-bottom:12px}
.stu-prog i{flex:1; height:5px; border-radius:99px; background:rgba(255,255,255,.1)}
.stu-prog i.d{background:var(--green)} .stu-prog i.c{background:var(--cyan)}

/* responsive */
@media (max-width:1100px){ .prog .st:not(.cur) .lb2{display:none} .prog .st{padding:6px 9px} }
@media (max-width:1080px){
  .two,.two.wl,.two.wr,.hero{grid-template-columns:1fr}
  .verbs,.flash{grid-template-columns:repeat(2,1fr)} .tfgrid{grid-template-columns:repeat(2,1fr)}
  .ch3,.sum,.awards,.winners{grid-template-columns:1fr} .sumc.span2{grid-column:auto}
  .evb{grid-template-columns:repeat(2,1fr)} .tm-grid{grid-template-columns:1fr}
  .tools .hm .lb{display:none} .brand span{display:none}
}
@media (max-width:760px){
  body{font-size:17px} .wrap{padding:16px 16px 50px}
  .prog .ar{display:none} .prog{gap:3px} .prog .st{padding:5px 7px} .prog .st .lb2{display:none}
  .tools .lb{display:none} .navr .lb{display:none} .brand{display:none}
  .verbs,.flash,.evb,.tfgrid{grid-template-columns:1fr} .cast{grid-template-columns:1fr}
  #navInfo{font-size:12px} #dock{width:calc(100vw - 32px)} .vbar{grid-template-columns:110px 1fr 40px}
  .tb{height:40px; min-width:40px; padding:0 9px}
  .node{width:100%; transform:none} .node .tx{font-size:min(var(--fs),20px)} .board{padding:18px 12px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
</style>

<body>
<div id="app">
  <header id="top">
    <a class="tb" id="backHub" href="../../" title="Back to the course" aria-label="Back to the course">←</a>
    <div class="brand"><b>LESSON 18 · REPORTED SPEECH</b><span>Who Actually Said That?</span></div>
    <div class="tools">
      <button class="tb hidden" id="tchip" title="Breakout timer">⏱ <span id="tchipT">5:00</span></button>
      <button class="tb" id="btnEv" title="Evidence board (E)">🗂 <span class="lb">Evidence</span> <span class="badge" id="evCount">0/6</span></button>
      <button class="tb hm" id="btnMap" title="All screens (M)">🗺️ <span class="lb">Screens</span></button>
      <button class="tb hm" id="btnRoute" title="Full / Core route">🧭 <span class="lb" id="routeLbl">Full</span></button>
      <button class="tb" id="btnLive" title="Live Student Mode">📡 <span class="lb">Live</span></button>
      <button class="tb" id="btnTeacher" title="Teacher Mode (T)">🧑‍🏫 <span class="lb">Teacher</span></button>
      <button class="tb hm" id="btnFull" title="Full screen (F)" aria-label="Full screen">⛶</button>
    </div>
  </header>
  <div id="progRow"><nav class="prog" id="prog" aria-label="Story progress"></nav></div>

  <main id="stage"><div class="wrap" id="scene"></div></main>

  <footer id="nav">
    <button class="btn sm" id="btnBack" title="Back (←)">← <span class="lb">Back</span></button>
    <div id="navMid"><div id="navInfo" aria-live="polite"></div><div id="bar"><i id="barFill"></i></div></div>
    <div class="navr">
      <button class="btn sm" id="btnHint" title="Hint (H)">💡 <span class="lb">Hint</span></button>
      <button class="btn sm" id="btnShow" title="Check / reveal (A)">👁 <span class="lb">Check answer</span></button>
      <button class="btn sm amber hidden" id="btnSkip" title="Skip optional">⏭ <span class="lb">Skip optional</span></button>
      <button class="btn sm primary" id="btnNext" title="Continue (→)"><span id="nextLbl">Continue</span> →</button>
    </div>
  </footer>
</div>
<div id="wm"><img src="../../assets/watermark.png" alt="" onerror="this.parentNode.remove()"></div>

<aside id="teacher" aria-label="Teacher panel" aria-hidden="true">
  <div class="thd"><span>🧑‍🏫</span><b>TEACHER MODE</b><span class="grow"></span><button class="btn sm ghost" id="tClose" aria-label="Close teacher panel">✕</button></div>
  <div id="tBody"></div>
</aside>

<div id="dock" aria-live="polite">
  <div class="dh"><span class="led" id="dockLed"></span><b id="dockTitle">Room</b><span class="small grow" id="dockCount">0 joined</span><button class="btn sm ghost" id="dockMin" aria-label="Collapse">▾</button></div>
  <div class="db" id="dockBody"></div>
</div>
<div id="reacts"></div>
<div id="scard" aria-hidden="true"></div>
<div id="clueFx" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39D8F6"/><stop offset=".6" stop-color="#8D7BFF"/><stop offset="1" stop-color="#FF5470"/></linearGradient></defs></svg>
<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div id="toast" role="status"></div>
<canvas id="confetti"></canvas>

<!-- Student phone app: lesson-18.html?room=1234&role=student  (or lesson-18.html?join) -->
<div id="student">
  <div class="stu-top"><span class="led" id="stuLed"></span><b>RUMOUR CONTROL</b><span class="small grow" id="stuRoom"></span><span class="connst" id="stuConn"></span></div>
  <div class="stu-body" id="stuBody"></div>
  <div class="stu-foot" id="stuFoot"></div>
</div>

<script>
/* ============================================================
   LESSON 18 · REPORTED SPEECH · "Who Actually Said That?"
   Один файл, vanilla JS, без збірки. Архітектура як в уроках 15–17:
   STEPS (екрани) → draw() → Teacher Mode → Live room (Supabase Realtime).
   ============================================================ */
const CFG = window.LESSON_CONFIG || {};

/* ---------- 2 · sound (WebAudio, no files) ---------- */
const SFX = {
  ctx:null,
  tone(f,t=.12,type='sine',vol=.07,delay=0){
    if(!S.sound) return;
    try{ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; this.ctx=new C(); }
      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+delay;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+t);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+t+.02); }catch(e){}
  },
  pop(){ this.tone(660,.09,'triangle',.06); },
  ping(){ this.tone(1320,.12,'sine',.06); this.tone(1760,.16,'sine',.04,.08); },
  ok(){ this.tone(740,.1,'sine',.07); this.tone(990,.14,'sine',.07,.09); },
  no(){ this.tone(220,.18,'sawtooth',.04); },
  clue(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.16,'triangle',.06,i*.08)); },
  bell(){ [0,.35,.7].forEach(d=>{ this.tone(880,.3,'sine',.09,d); this.tone(1320,.25,'sine',.05,d); }); }
};

function av(k,size=52){
  const C=CHARS[k];
  if(!C) return `<i class="av emo" style="--s:${size}px;--c:#3A4390" aria-hidden="true">${k}</i>`;
  if(C.emo) return `<i class="av emo" style="--s:${size}px;--c:${C.c}" role="img" aria-label="${C.name}">${C.emo}</i>`;
  return `<i class="av" style="--s:${size}px;--c:${C.c}" role="img" aria-label="${C.name}">${C.name[0]}${C.photo?`<img src="${C.photo}" alt="" onerror="this.remove()">`:''}</i>`;
}
/* one chat bubble. o.me = Mia’s own phone (right side), o.tm = time, o.cls = extra class */
function msg(k, html, o={}){
  const C=CHARS[k]||{name:k,c:'#888'};
  return `<div class="msg ${o.me?'me':''} ${o.late?'late':''}" style="${o.delay?`animation-delay:${o.delay}s`:''}">${o.me?'':av(k,o.size||38)}
    <div class="bub ${o.cls||''}">${o.me?'':`<span class="who" style="color:${C.c}">${C.name}</span>`}${html}${o.tm?`<span class="tm">${o.tm}</span>`:''}</div></div>`;
}
const typing = k => `<div class="msg">${av(k,38)}<div class="bub typing" aria-label="${CHARS[k].name} is typing"><i></i><i></i><i></i></div></div>`;

function counts(id,n){ const out=Array(n).fill(0); Object.values(S.lv[id]||{}).forEach(v=>{ if(Number.isInteger(v)&&v>=0&&v<n) out[v]++; }); const t=S.taps[id]||[]; return out.map((c,i)=>c+(t[i]||0)); }
function wallHTML(id){ const w=S.wall[id]||[]; return w.length?`<div class="wall">${w.map(x=>`<div class="w">${esc(x.text)}<small>${esc(x.by)}</small></div>`).join('')}</div>`:''; }
const FX = new Set();
const fx = k => FX.has(k) ? 'fx' : '';
let LOOPS = [];
function loop(fn, ms){ LOOPS.push(setInterval(fn, ms)); }
function later(fn, ms){ LOOPS.push(setTimeout(fn, ms)); }
function burst(el, set=['✨','⭐','💥','✨']){
  if(!el || REDUCED) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.textContent=set[i%set.length];
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;z-index:96;pointer-events:none;font-size:${18+Math.random()*16}px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s`;
    document.body.appendChild(s); const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    requestAnimationFrame(()=>{ s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*180}deg)`; s.style.opacity='0'; });
    setTimeout(()=>s.remove(),950); }
}
function hintBox(d, html){ return d.hint?`<div class="hintbox pop-in">💡 ${html}</div>`:''; }
function starters(list){ return list.map(s=>`<b>${esc(s)}</b>`).join(' · '); }
const norm = s => String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();
const has = (val, ...alts) => { const n=' '+norm(val)+' '; return alts.some(a=>n.includes(' '+norm(a)+' ')); };

/* options list for decks / tasks. key = state slot, n = vote counts */
function optsHTML(key, opts, d, right, cls=''){
  const shown=(d.shown||{})[key], pick=(d.pick||{})[key], n=counts(key, opts.length);
  return `<div class="opts ${cls}">${opts.map((o,i)=>{
    let c=''; if(shown){ c = i===right ? 'right '+fx('reveal') : (pick===i ? 'wrongpick' : 'dim'); } else if(pick===i) c='pick';
    return `<button class="opt ${c}" data-pick="${key}" data-i="${i}"><span class="L">${LET[i]}</span><span>${o}</span><span class="n">${n[i]||''}</span></button>`; }).join('')}</div>`;
}
function bindPicks(root, d){
  $$('[data-pick]',root).forEach(b=>b.onclick=()=>{ const k=b.dataset.pick; if((d.shown||{})[k]) return; d.pick=d.pick||{}; d.pick[k]= d.pick[k]===+b.dataset.i ? undefined : +b.dataset.i; save(); SFX.pop(); draw(false,true); });
}
function revealBurst(root){ if(FX.has('reveal')){ const r=$('.opt.right',root); if(r) setTimeout(()=>burst(r),60); } }

/* a quick multiple-choice deck: one item per part (vocab, extra task, who said it, reading questions) */
function deckStep(c){
  const items=c.items;
  const P = d => Math.min(d.p||0, items.length-1);
  return Object.assign({
    parts:()=>items.length,
    render(d){
      const p=P(d), it=items[p], key=c.id+'-'+p, shown=(d.shown||{})[key];
      return `<div class="deckbar"><span class="kick">${c.kicker||''}</span><span class="grow"></span>
        <div class="cdots">${items.map((x,i)=>`<button data-card="${i}" class="${i===p?'cur':''} ${(d.shown||{})[c.id+'-'+i]?'done':''}" aria-label="Item ${i+1}">${i+1}</button>`).join('')}</div></div>
        <div class="two">
          <div class="${fx('part')||fx('enter')?'pop-in':''}">${c.left(it,p)}</div>
          <div><div class="mid" style="margin-bottom:12px">${c.q(it,p)}</div>
            ${optsHTML(key, it.opts.map(o=>esc(o)), d, it.a, c.chips?'chips':'')}
            ${hintBox(d, c.hintTxt?c.hintTxt(it):'Read it again. Which option fits best?')}
            ${shown?`<div class="explain stamp">${c.explain(it)}</div>`:`<div class="row mt"><button class="btn primary caps" data-act="reveal">Check answer</button><span class="small">Say your answer first.</span></div>`}
          </div></div>`;
    },
    bind(root,d){
      bindPicks(root,d); revealBurst(root);
      $$('[data-card]',root).forEach(b=>b.onclick=()=>{ d.p=+b.dataset.card; d.hint=false; FX.add('part'); save(); draw(false,true); });
    },
    hint(d){ d.hint=!d.hint; },
    reveal(d){ const p=P(d), key=c.id+'-'+p; d.shown=d.shown||{}; d.shown[key]=!d.shown[key];
      if(d.shown[key]){ const ok=(d.pick||{})[key]; (ok===undefined||ok===items[p].a)?SFX.ok():SFX.no(); c.onShow&&c.onShow(p,d); } },
    revealLbl:'Check answer',
    onPart(d){ d.hint=false; },
    nextLbl(d){ return P(d)<items.length-1 ? (c.nextWord||'Next') : null; },
    live(){ const d=sd(c.id), p=P(d), it=items[p], key=c.id+'-'+p, sh=(d.shown||{})[key];
      return {kind:'choice', id:key, q:strip(c.liveQ?c.liveQ(it):c.q(it,p)), opts:it.opts, lock:!!sh, correct:sh?it.a:null}; }
  }, c);
}

/* ---------- 7 · navigation, story progress, evidence ---------- */
const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt); };
const cur = ()=> STEPS[S.i] || STEPS[0];
const nparts = s => s.parts ? s.parts() : 1;
let CUR = null;

function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; s.onPart&&s.onPart(d); FX.add('part'); save(); draw(true,true); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length){ s.leave&&s.leave(d); go(k); } else toast('That’s the end of the lesson 🎉');
}
function back(){
  const s=cur(), d=sd(s.id);
  if((d.p||0)>0){ d.p--; s.onPart&&s.onPart(d); save(); draw(true,true); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--;
  if(k>=0) go(k);
}
function go(k){
  const prev=cur().sc; S.i=k; clockStart(); FX.add('enter');
  const ns=STEPS[k].sc;
  if(ns>prev){ for(let n=1;n<ns;n++){ if(!S.st[n]){ S.st[n]=true; FX.add('st-'+n); } } sceneCard(ns); }
  save(); draw(true); $('#stage').scrollTop=0;
}
/* short, non-blocking title card when a new story stage starts (clicks go straight through) */

  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  SFX.tone(420,.18,'sine',.05); SFX.tone(840,.22,'sine',.04,.12);
}
function paintProg(){
  const c=cur().sc;
  $('#prog').innerHTML=STAGES.map((st,i)=>`${i?'<span class="ar">→</span>':''}<button class="st ${S.st[st.n]?'done':''} ${st.n===c?'cur':''} ${FX.has('st-'+st.n)?'just':''}" data-st="${st.n}" title="${esc(st.t)}"><i>${S.st[st.n]&&st.n!==c?'✓':st.e}</i><span class="lb2">${esc(st.t)}</span></button>`).join('');
  $$('#prog [data-st]').forEach(b=>b.onclick=()=>{ const k=STEPS.findIndex((x,i)=>x.sc===+b.dataset.st && visible(i)); if(k>=0) go(k); });
}
function paintEv(){ $('#evCount').textContent=S.ev.length+'/'+CLUES.length; $('#btnEv').classList.toggle('warn', S.ev.length>0 && S.ev.length<CLUES.length); }
function addClue(id){

      return on?`<div class="evc ${NEWCLUE===c.id?'new':''}" style="--rot:${rot}deg"><span class="pin"></span><div class="k">${esc(c.k)}</div><b>${esc(c.t)}</b><p>${esc(c.q)}</p><div class="rp">📣 ${esc(c.rp)}</div></div>`

/* breakout timer: keeps running across screens and page refreshes */
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  start(){ if(this.left()<=0) S.timer.left=S.timer.total=300; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  reset(){ S.timer.total=300; S.timer.left=300; S.timer.endAt=0; save(); pubState(); },
  add(sec){ if(this.run()) S.timer.endAt+=sec*1000; else S.timer.left=this.left()+sec; S.timer.total=Math.max(S.timer.total, Math.ceil(this.left())); save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');
    const show = this.run() || (S.timer.left<S.timer.total && S.timer.left>0) || cur().id==='cases';
    chip.classList.toggle('hidden', !show || ROLE==='student');
    $('#tchipT').textContent=mmss(l); chip.classList.toggle('warn', this.run());
    const bc=$('#bigClock'), rf=$('#ringFg'), rg=$('#ring'); if(bc){ bc.textContent=mmss(l); bc.classList.toggle('end',l<=0); }
    if(rf) rf.style.strokeDashoffset=(326.73*(1-l/Math.max(1,S.timer.total))).toFixed(1); if(rg) rg.classList.toggle('hurry', this.run() && l<=30 && l>0);
    const ts=$('#tStart'); if(ts) ts.textContent=this.run()?'⏸ Pause':'▶ Start '+mmss(l>0?l:300);
    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.bell(); toast('⏰ Time’s up! Close the breakout rooms.'); pubState(); if(cur().id==='cases'){ draw(false,true); burst($('#ring'),['⏰','🔔','✨']); } }
  }
};
$('#tchip').onclick=()=>{ const k=STEPS.findIndex(s=>s.id==='cases'); if(S.i!==k) go(k); else { TIMER.run()?TIMER.pause():TIMER.start(); draw(false,true); } };

/* lesson clock for the teacher (starts on the first Continue) */
function clockStart(){ if(!S.clock.start && !S.clock.paused){ S.clock.start=Date.now(); } }
const clockNow = ()=> (S.clock.acc||0) + (S.clock.start? (Date.now()-S.clock.start)/1000 : 0);
function routeMin(core){ let m=0; STEPS.forEach(s=>{ if(core&&s.opt) return; m+=s.min; }); return Math.round(m); }

function draw(anim, keepScroll){
  const s=cur(), d=sd(s.id); CUR=s;
  const st=$('#stage'), top=st.scrollTop;

  $$('#scene .phone .chat').forEach(c=>{ c.scrollTop=c.scrollHeight; });

/* confetti (no library) */
function confetti(){
  if(REDUCED) return; const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#39D8F6','#FF5470','#FFC14D','#8D7BFF','#36E09B'];
  const P=Array.from({length:170},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:4+Math.random()*6, vx:-2+Math.random()*4, vy:2+Math.random()*4, a:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if(++t<230) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
function floatEmoji(e){ if(!/^[\p{Extended_Pictographic}‍️✅]{1,8}$/u.test(e||'')) return; const s=document.createElement('span'); s.textContent=e; s.style.left=Math.random()*60+'px'; $('#reacts').appendChild(s); setTimeout(()=>s.remove(),3100); }

/* voice message: browser text-to-speech (in Zoom turn on “Share sound”) */
function speak(text, el, gender){
  if(!('speechSynthesis' in window)){ toast('This browser cannot play the voice — read the transcript.'); return; }
  const ss=window.speechSynthesis; if(ss.speaking){ ss.cancel(); el&&el.classList.remove('playing'); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=.92; u.pitch=gender==='female'?1.15:1;
  const vs=ss.getVoices().filter(v=>/^en/i.test(v.lang));
  const pref=vs.find(v=>/female|samantha|zira|karen|serena|victoria|libby|sonia|aria|jenny|hazel|susan|moira|tessa/i.test(v.name)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs[0];
  if(pref) u.voice=pref;
  u.onstart=()=>el&&el.classList.add('playing'); u.onend=u.onerror=()=>el&&el.classList.remove('playing');
  ss.speak(u);
}

/* ---------- 9 · live room (Supabase Realtime broadcast + presence; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5, 13–17: таблиці не потрібні.
   Учитель — єдине джерело стану: екран, завдання й таймер надсилає тільки він.
   Учні можуть надіслати лише hello / ans / work / react; правильні відповіді їм не передаються,
   доки вчитель не відкриє їх на головному екрані. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,10);
const LIVE = {on:false, peers:[]};
const WALLQ = [];        // unshown text answers {id, task, sid, text, by, ok}
const NAMES = {};

const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l18sid'); }catch(e){}   // per tab, survives a refresh
    this.me={id:sid || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') try{ sessionStorage.setItem('l18sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson18-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson18-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
const Store = {
  async log(kind, task, sid, value){
    if(!(CFG.SAVE_ANSWERS && Net.sb)) return;
    try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson18-rumour', chapter:cur().id, task, kind, student_id:sid, student_name:NAMES[sid]||null, value:String(value).slice(0,500)}); }
    catch(e){ console.warn('Supabase insert failed:', e.message||e); }
  }
};

let pubT=null;

function pubState(){
  if(!LIVE.on || ROLE!=='teacher') return;
  clearTimeout(pubT); pubT=setTimeout(()=>{
    const c=cur(), st=STAGES[c.sc-1];
    Net.send({t:'state', sc:st.n, title:st.t, e:st.e, task:curTask(), timer:{left:Math.ceil(TIMER.left()), run:TIMER.run()}});

let redrawT=null;
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || !m.from || m.from.role!=='student') return;
  if(m.from.name) NAMES[id]=String(m.from.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='ans' && task && m.task===task.id){
    if(task.kind==='choice'){ const v=+m.v; if(!(v>=0 && v<task.opts.length) || task.lock) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('vote',task.id,id,v); clearTimeout(redrawT); redrawT=setTimeout(()=>draw(false,true),200); return; }
    if(task.kind==='text'){ const text=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,140); if(!text) return;
      const chk=CHECKS[task.chk];
      const k=WALLQ.findIndex(w=>w.task===task.id && w.sid===id); const item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student', ok:chk?chk(text):null};
      if(k>=0) WALLQ[k]=item; else WALLQ.unshift(item); SFX.pop(); Store.log('text',task.id,id,text); paintDock(); return; }
  }
  if(m.t==='work' && task && task.kind==='team'){
    const L=String(m.team||''), f=String(m.f||''); if(!TEAMS().some(t=>t.L===L) || !['s1','s2','s3','s4'].includes(f)) return;
    S.work[L]=Object.assign({},S.work[L],{[f]:String(m.v||'').slice(0,200), by:NAMES[id]||''}); save(); pubState(); Store.log('work','team-'+L+'-'+f,id,m.v);
    clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(['cases','reports'].includes(cur().id)) draw(false,true); else paintDock(); },400); return;
  }
}
function paintDock(){
  const d=$('#dock'); d.classList.toggle('on',LIVE.on && ROLE==='teacher'); if(!LIVE.on) return;
  const st=Net.status, stTxt={live:'● live', local:'● this browser only', reconnecting:'● reconnecting…', connecting:'● connecting…', off:'● offline'}[st]||st;
  $('#dockTitle').textContent='Room '+S.room;

    h+=`<div class="small">${tot} answered · ${esc(task.q.slice(0,80))}</div>`+task.opts.map((o,i)=>`<div class="dbar"><span>${task.lock&&task.correct===i?'✅ ':''}${esc(o)}</span><b class="mono" style="color:var(--cyan);text-align:right">${n[i]}</b><div class="tr"><i class="${task.lock&&task.correct===i?'ok':''}" style="width:${n[i]/mx*100}%"></i></div></div>`).join(''); }
  else if(task.kind==='text'){ const list=WALLQ.filter(w=>w.task===task.id); h+= list.length?`<div class="small">${list.length} answers — Show puts one on the screen</div>`+list.map(w=>`<div class="wallit"><p>${w.ok===true?'<span class="okm">✓</span> ':w.ok===false?'<span class="nom">✗</span> ':''}${esc(w.text)}<small>${esc(w.by)}</small></p><button class="btn sm" data-w="${w.id}">Show</button><button class="btn sm ghost" data-wx="${w.id}" aria-label="Hide">✕</button></div>`).join(''):`<div class="small">Waiting for answers…</div>`; }
  else if(task.kind==='team'){ h+=TEAMS().map(t=>{ const w=S.work[t.L]||{}; const n=['s1','s2','s3','s4'].filter(f=>w[f]).length; return `<div class="small">${t.e} Team ${t.n} · Case ${t.L}: ${n?`<b style="color:var(--ok)">${n}/4 sentences</b>`:'…'}</div>`; }).join(''); }
  else if(task.kind==='react3') h+=`<div class="small">Phones can send ✅ Clear · 🧠 Great verbs · 🕵️ Accurate.</div>`;
  $('#dockBody').innerHTML=h;
  $$('[data-w]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.w); if(k<0) return; const w=WALLQ.splice(k,1)[0]; (S.wall[w.task]=S.wall[w.task]||[]).push({text:w.text, by:w.by}); save(); draw(false,true); });
  $$('[data-wx]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.wx); if(k>=0) WALLQ.splice(k,1); paintDock(); });
}

      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.lock&&T.correct===i?'right':my===i?(T.lock?'wrongpick':'pick'):''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T.lock?(T.correct===null||T.correct===undefined?'✓ Voting closed.':my===T.correct?'🎉 Correct! The answer is on the main screen.':'✓ The answer is on the main screen.'):my!==undefined?'✓ Sent! You can change it.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T.kind==='text'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><input id="tx" maxlength="140" placeholder="${esc(T.ph||'')}" autocomplete="off"><button class="btn primary mt" id="sd" style="width:100%">Send ➤</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. You can send a new version.':T.chk?'Your teacher checks the answers.':'Your teacher can show your answer on the screen.'}</p></div>`;
      const go=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      $('#sd').onclick=go; $('#tx').onkeydown=e=>{ if(e.key==='Enter') go(); };
      return;
    }
    if(T.kind==='team'){
      const t=(T.teams||[]).find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">🚨 Which team are you in?</p><div class="opts">${T.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>Team ${x.n} · Case ${x.L}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l18team-'+room,myTeam); }catch(e){} render(); }); return; }
      const C=CASES[t.L], w=(T.work||{})[myTeam]||{};
      B.innerHTML=head+`<div class="card stu-card"><div class="row"><span style="font-size:32px">${t.e}</span><div class="grow"><b style="font-size:19px">Team ${t.n} · Case ${t.L}</b><div class="small mono" id="stuT"></div></div><button class="btn sm ghost" id="chg">change</button></div>
        <div class="cf mt"><div class="hd">📁 <b>${esc(C.t.toUpperCase())}</b></div><div class="rum"><small>THE RUMOUR</small>${esc(C.rumour)}</div>
          <div class="chat">${C.msgs.map(m=>msg(m[0],esc('“'+m[1]+'”'),{size:30})).join('')}</div></div>
        <p class="small mt">What really happened? Write 3–4 sentences in Reported Speech. Use at least TWO of: <b>${VERB_BANK.join(', ')}</b>. Your team sees the same text.</p>
        ${['s1','s2','s3','s4'].map((f,i)=>`<label>Sentence ${i+1}${i===3?' (optional)':''}</label><textarea data-tf="${f}" maxlength="200" placeholder="${['… said that …','… denied / claimed that …','… admitted / warned …','…'][i]}">${esc(w[f]||'')}</textarea>`).join('')}
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l18team-'+room); }catch(e){} render(); };
      $$('[data-tf]',B).forEach(ta=>{ let tm=null; ta.oninput=()=>{ $('#ok').textContent='…'; clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,200)}); $('#ok').textContent='✓ Saved — your teacher can see it.'; },700); }; });
      return;
    }
    if(T.kind==='react3'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:22px;font-weight:800">🎤 ${esc(T.q)}</p><p class="small">How was it? Tap to react.</p>
        <div class="opts">${[['✅','Clear'],['🧠','Great verbs'],['🕵️','Accurate']].map(([e,l])=>`<button class="opt" data-r="${e}"><span class="L">${e}</span><span>${l}</span></button>`).join('')}</div></div>`;
      $$('[data-r]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.r}); b.animate?.([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:250}); });
      return;
    }
  };
  (room && name) ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnRoute').onclick=toggleRoute; $('#btnLive').onclick=openLive; $('#btnEv').onclick=showEv;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='e'||k==='E') showEv();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A'||k==='r'||k==='R') doReveal();
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  Object.values(CHARS).forEach(c=>{ if(c.photo){ const im=new Image(); im.src=c.photo; } });
  if('speechSynthesis' in window) speechSynthesis.getVoices();
  draw(true);
  if(S.live) startLive(true);   // teacher refreshed the page → reopen the same room; phones stay connected
}
</script>
</body>
</html>
