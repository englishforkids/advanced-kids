.crewc input:focus{outline:2px solid var(--teal);border-radius:8px}
.crewc.away{opacity:.5} .crewc.away .ini{background:#555}
.crewc .x{flex:none}
.crewname{font-weight:800;font-size:clamp(17px,1.4vw,22px)}

/* ════════ CHAT ════════ */
.phone{width:min(700px,100%);margin:0 auto;border-radius:40px;padding:14px;background:linear-gradient(160deg,#1C1E4A,#0B0D2A);border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04)}
.phone .scr{border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#151A44,#0F1236);min-height:min(480px,62vh);display:flex;flex-direction:column}
.phone .bar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
.phone .bar .grp{display:flex}
.phone .bar .grp .av{--s:30px!important;margin-left:-8px;box-shadow:0 0 0 2px #151A44}
.phone .bar .grp .av:first-child{margin-left:0}
.phone .bar b{font-family:var(--disp);font-size:19px}
.phone .bar small{display:block;font-size:12px;color:var(--muted)}
.phone .msgs{flex:1;padding:min(16px,1.8vh) 14px;display:flex;flex-direction:column;gap:min(12px,1.3vh)}
.msg{display:flex;gap:10px;align-items:flex-end;animation:msgin .4s cubic-bezier(.2,1.2,.4,1) both}
.msg .av{--s:34px!important}
.msg .b{max-width:80%;background:#262A63;border-radius:18px 18px 18px 6px;padding:min(9px,1vh) 14px;font-size:clamp(16px,min(1.45vw,2.7vh),23px);font-weight:600;line-height:1.35}
.msg .b .who{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:800;margin-bottom:2px}
.msg .b .t{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.msg.me{flex-direction:row-reverse}
.msg.me .b{background:linear-gradient(135deg,#FF9D5C,#FF6F91);color:#1D0712;border-radius:18px 18px 6px 18px}
.msg.me .b .who,.msg.me .b .t{color:#3A0F22}
.msg .reader{margin-left:6px}
@keyframes msgin{from{opacity:0;transform:translateY(16px) scale(.96)}}
.typing{display:flex;gap:5px;padding:12px 16px;background:#262A63;border-radius:18px;width:max-content;margin-left:48px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes typ{30%{transform:translateY(-5px);opacity:1}0%,60%,100%{opacity:.4}}

/* ════════ TURN CARD (smart task distribution) ════════ */
.tk-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.tk-head h2{flex:1;min-width:260px}
.meter{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--muted)}
.meter .tr{width:min(220px,40vw);height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.meter .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:6px;transition:width .5s}
.meter b{color:#fff;font-variant-numeric:tabular-nums}
.turn{position:relative;border-radius:30px;padding:clamp(20px,2.6vw,36px);background:linear-gradient(160deg,rgba(28,26,86,.92),rgba(12,14,46,.92));border:1px solid var(--line2);box-shadow:0 30px 70px rgba(0,0,0,.4);animation:turnin .45s cubic-bezier(.2,1,.3,1) both}
@keyframes turnin{from{opacity:0;transform:translateY(16px) rotate(-.4deg)}}
.turn .who{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.turn .who .mic{display:inline-flex;align-items:center;gap:10px;font-family:var(--disp);font-size:clamp(20px,2vw,30px);color:#03201D;background:var(--teal2);border-radius:999px;padding:6px 18px 6px 8px}
.turn .who .mic .ini{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#03201D;color:var(--teal2);font-size:18px}
.turn .ty{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--lav);border:1px solid rgba(201,184,255,.4);border-radius:8px;padding:2px 9px}
.turn .rnd{font-size:14px;font-weight:700;color:var(--muted)}
.turn .q{font-size:clamp(26px,2.9vw,44px);font-weight:800;line-height:1.2;font-family:var(--disp);letter-spacing:-.01em;margin:6px 0 2px}
.turn .q .gap{display:inline-block;min-width:3.2ch;border-bottom:4px solid var(--gold);text-align:center;color:var(--gold)}
.turn .sub{font-size:clamp(17px,1.4vw,22px);color:var(--muted);font-weight:600}
.turn .hint{margin-top:14px;display:inline-flex;gap:10px;align-items:center;border-radius:14px;padding:8px 14px;background:rgba(255,200,97,.1);border:1px dashed rgba(255,200,97,.55);color:var(--gold2);font-weight:700;animation:lnin .3s both}
.turn .ans{margin-top:16px;border-radius:20px;padding:14px 18px;background:rgba(91,227,168,.1);border:1px solid rgba(91,227,168,.45);animation:lnin .35s both}
.turn .ans .a{font-family:var(--disp);font-size:clamp(24px,2.4vw,38px);font-weight:800;color:var(--ok)}
.turn .ans .why{font-size:clamp(17px,1.35vw,21px);font-weight:600;margin-top:4px}
.turn .ans .ex{font-size:clamp(17px,1.35vw,21px);font-style:italic;color:#E9E2FF;margin-top:6px}
.turn .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.turn .acts .sp{flex:1}
.turn.opt{border-style:dashed;border-color:rgba(201,184,255,.5)}
.turn .role{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.turn .role .av{--s:clamp(70px,7vw,110px)!important}
.turn .sample{margin-top:14px;border-radius:18px;padding:12px 16px;background:rgba(201,184,255,.1);border:1px solid rgba(201,184,255,.4);font-size:clamp(18px,1.5vw,24px);font-weight:700;animation:lnin .3s both}
.turn .sample small{display:block;font-size:12px;letter-spacing:.06em;color:var(--lav);font-weight:800}
.peer{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-radius:18px;padding:10px 14px;background:rgba(79,184,176,.12);border:1px solid rgba(79,184,176,.45);font-size:clamp(17px,1.4vw,22px);font-weight:700;animation:lnin .3s both}
.tmr{font-family:var(--disp);font-size:clamp(26px,2.6vw,40px);font-variant-numeric:tabular-nums;min-width:3.6ch}
.tmr.low{color:var(--gold)} .tmr.out{color:var(--rose)}
.done-card{border-radius:30px;padding:clamp(22px,3vw,40px);text-align:center;background:linear-gradient(160deg,rgba(91,227,168,.16),rgba(79,184,176,.08));border:1px solid rgba(91,227,168,.5);animation:turnin .5s both}
.done-card .big{font-size:56px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--gold);box-shadow:0 0 0 4px rgba(255,200,97,.25)} .dots i.h{background:var(--teal)}
.tally{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tally span{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tally span b{font-variant-numeric:tabular-nums}
.tally span.cur{border-color:var(--gold);color:var(--gold2)}
.adj{margin-top:10px;font-size:14px;color:var(--gold2);font-weight:700}

/* ════════ VOICE NOTE ════════ */
.vn{max-width:780px;margin:0 auto;border-radius:32px;padding:clamp(18px,2.6vw,30px);background:linear-gradient(160deg,rgba(255,138,76,.18),rgba(36,25,90,.85));border:1px solid rgba(255,170,130,.35);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.vn .top{display:flex;gap:16px;align-items:center}
.vn .top .av{--s:72px!important}
.vn .top b{font-family:var(--disp);font-size:22px}
.vn.compact{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:12px 18px;max-width:none;border-radius:24px}
.vn.compact .wave{height:44px;margin:0} .vn.compact .play{width:54px;height:54px;font-size:22px} .vn.compact .mode{grid-column:1/-1;margin-top:-4px} .vn.compact .trans{grid-column:1/-1;margin-top:4px}
@media (max-width:860px){ .vn.compact{grid-template-columns:auto auto 1fr} .vn.compact .wave{grid-column:1/-1;order:-1} }
.vn .wave{display:flex;align-items:center;gap:3px;height:64px;margin:16px 0 6px;cursor:pointer}
.vn .wave i{flex:1;border-radius:3px;background:rgba(255,255,255,.25);transition:background .2s}
.vn .wave i.p{background:linear-gradient(180deg,var(--gold),var(--sunset))}
.vn.playing .wave i.p:last-of-type{box-shadow:0 0 12px var(--gold)}
.vn .tm{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.vn .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.vn .play{width:72px;height:72px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),var(--sunset));color:#2A1203;font-size:28px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(255,138,76,.45)}
.vn .rate{display:flex;gap:4px}
.vn .mode{font-size:13px;font-weight:700;color:var(--muted)}
.vn .mode.tts{color:var(--gold2)}
.trans{margin-top:16px;border-radius:20px;padding:16px 20px;background:rgba(7,11,34,.6);border:1px solid var(--line2);font-size:clamp(18px,1.5vw,23px);line-height:1.55;animation:lnin .35s both}
.trans p{margin:0 0 10px}
.trans span{transition:background .3s, color .3s;border-radius:6px;padding:0 2px}
.trans span.on{background:rgba(255,200,97,.22);color:#fff}
.rec{position:relative;display:grid;place-items:center;width:clamp(180px,22vw,280px);aspect-ratio:1;margin:0 auto}
.rec .av{--s:72%!important;width:72%;height:72%;box-shadow:0 0 0 5px var(--c-alex), 0 0 60px rgba(255,138,76,.5)}
.rec::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,107,127,.7);animation:recpulse 1.8s ease-out infinite}
@keyframes recpulse{0%{transform:scale(.78);opacity:1}100%{transform:scale(1.05);opacity:0}}
.rec .dot{position:absolute;top:8%;right:12%;display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:800;background:#E5254F;color:#fff;border-radius:8px;padding:2px 8px}
.rec .dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

/* ════════ TABLEAUX (composed scenes) ════════ */
.tab{position:relative;border-radius:30px;overflow:hidden;height:clamp(190px,34vh,380px);container-type:size;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.45);background:linear-gradient(180deg,#1A1650,#3A2466 60%,#7A3E6E)}
.tab .sk{position:absolute;inset:0}
.tab .ledge{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#151338,#0B0A22);border-top:2px solid rgba(255,200,97,.35)}
.tab .str{position:absolute;left:-2%;width:104%;top:6%;height:30%}
.tab .ppl{position:absolute;left:0;right:0;bottom:10%;display:flex;justify-content:center;align-items:flex-end;gap:min(22px,1.6cqw);padding:0 4%}
.tab .ppl .p{display:flex;flex-direction:column;align-items:center;gap:6px;transition:filter .6s, transform .6s}
.tab .ppl .p .av{--s:min(118px,15cqw,40cqh)!important}
.tab .ppl .p b{font-family:var(--disp);font-size:clamp(11px,5cqh,16px);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.tab .ppl .p.lift{transform:translateY(-12px)}
.tab .ppl .apart{margin-left:min(180px,9cqw);filter:grayscale(.7) brightness(.8)}
.tab .ppl .apart .av{box-shadow:0 0 0 3px var(--c), 0 0 0 10px rgba(201,184,255,.08)}
.tab.sm{height:clamp(150px,27vh,330px)}
.tab .cap{position:absolute;left:16px;top:14px;font-size:14px;font-weight:800;color:var(--gold2);background:rgba(7,11,34,.6);border-radius:10px;padding:4px 10px}
.clash{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(10px,2vw,28px);padding:clamp(8px,1.6vh,26px);border-radius:30px;background:linear-gradient(110deg,rgba(255,111,145,.22) 0%,rgba(255,111,145,.08) 48%,rgba(255,138,76,.08) 52%,rgba(255,138,76,.22) 100%);border:1px solid var(--line2)}
.clash .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.clash .side .av{--s:clamp(60px,min(9vw,11vh),140px)!important}
.clash .bolt{font-size:clamp(30px,4vw,56px);filter:drop-shadow(0 0 16px rgba(255,200,97,.7))}

/* ════════ GRAMMAR ════════ */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,26px)}
@media (max-width:760px){ .pair{grid-template-columns:1fr} }
.pair .s{border-radius:24px;padding:clamp(16px,2vw,26px);border:1px solid var(--line2);background:rgba(255,255,255,.04)}
.pair .s small{display:block;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pair .s .x{font-size:clamp(24px,2.6vw,40px);font-weight:800;font-family:var(--disp);margin-top:6px}
.pair .s.emp{border-color:rgba(255,200,97,.6);background:linear-gradient(160deg,rgba(255,200,97,.14),rgba(255,138,76,.06));box-shadow:0 0 50px rgba(255,200,97,.15)}
.dq{border:1px solid var(--line);border-radius:20px;padding:14px 18px;background:rgba(255,255,255,.035);animation:lnin .35s both}
.dq .qq{font-size:clamp(20px,1.7vw,27px);font-weight:800}
.dq .aa{margin-top:8px;font-size:clamp(19px,1.6vw,25px);color:var(--ok);font-weight:800;animation:lnin .35s both}
.rule{border-radius:30px;padding:clamp(20px,2.6vw,34px);background:linear-gradient(160deg,rgba(255,200,97,.14),rgba(36,25,90,.85));border:2px solid rgba(255,200,97,.5)}
.rule .f{font-family:var(--disp);font-size:clamp(30px,4vw,60px);font-weight:800;color:var(--gold);letter-spacing:-.01em}
.rule ul{margin:10px 0 0;padding-left:1.1em;font-size:clamp(19px,1.6vw,26px);font-weight:700}
.rw{display:flex;gap:12px;align-items:center;font-size:clamp(18px,1.5vw,24px);font-weight:700;padding:8px 14px;border-radius:14px;margin-top:8px}
.rw.yes{background:rgba(91,227,168,.1);border:1px solid rgba(91,227,168,.4)}
.rw.no{background:rgba(255,107,127,.08);border:1px solid rgba(255,107,127,.35)}
.rw.no s{text-decoration-color:rgba(255,107,127,.85);text-decoration-thickness:3px}
.rw .ic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.rw.yes .ic{background:var(--ok);color:#052A1B} .rw.no .ic{background:var(--bad);color:#2A0610}

/* ════════ VOTE ════════ */
.vote{display:grid;gap:clamp(8px,1.4vh,14px);max-width:980px;margin:0 auto}
.vopt{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:2px solid var(--line2);border-radius:22px;padding:clamp(7px,1.3vh,14px) 18px;background:rgba(10,14,44,.7);overflow:hidden;text-align:left;width:100%}
.vopt .L{width:clamp(40px,6vh,52px);height:clamp(40px,6vh,52px);border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-size:24px;background:rgba(255,200,97,.18);border:1px solid rgba(255,200,97,.6);color:var(--gold)}
.vopt .t{font-size:clamp(20px,1.8vw,29px);font-weight:800;position:relative;z-index:1}
.vopt .t small{display:block;font-size:.62em;color:var(--muted);font-weight:700}
.vopt .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(79,184,176,.3),rgba(79,184,176,.06));transition:width .5s;z-index:0}
.vopt .n{position:relative;z-index:1;font-family:var(--disp);font-size:28px;min-width:2ch;text-align:right}
.vopt .pm{display:flex;gap:4px;position:relative;z-index:1}
.vopt.win{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,200,97,.15)}
.vopt.win .L{background:var(--gold);color:#2A1603}
.vopt.sug::after{content:"suggested";position:absolute;right:12px;top:6px;font-size:11px;font-weight:800;color:var(--teal2)}
.why{margin-top:14px;border-radius:18px;padding:12px 16px;background:rgba(79,184,176,.1);border:1px solid rgba(79,184,176,.4);font-size:clamp(16px,1.25vw,20px)}
.why ul{margin:6px 0 0;padding-left:1.1em}

/* ════════ BREAKOUT ════════ */
.mission{border-radius:30px;padding:clamp(18px,2.6vw,34px);background:linear-gradient(160deg,rgba(255,111,145,.16),rgba(36,25,90,.88));border:1px solid rgba(255,140,170,.4)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:900px){ .steps3{grid-template-columns:1fr} }
.st3{border-radius:22px;padding:16px 18px;background:rgba(7,11,34,.55);border:1px solid var(--line2)}
.st3 .n{font-family:var(--disp);font-size:15px;color:var(--gold)}
.st3 b{display:block;font-family:var(--disp);font-size:clamp(20px,1.8vw,27px);margin:2px 0 6px}
.st3 p{font-size:clamp(17px,1.35vw,21px);font-weight:600;margin:0}
.rules{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.rules span{border-radius:12px;padding:8px 14px;background:rgba(255,200,97,.12);border:1px solid rgba(255,200,97,.45);color:var(--gold2);font-weight:800;font-size:clamp(15px,1.25vw,19px)}
.modes{display:inline-flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.modes button{border:0;background:transparent;border-radius:12px;padding:8px 16px;font-weight:800}
.modes button.on{background:var(--teal);color:#03201D}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-top:14px}
.grp{border-radius:22px;padding:14px 16px;background:rgba(7,11,34,.62);border:1px solid var(--line2)}
.grp h4{margin:0 0 8px;font-family:var(--disp);font-size:20px}
.grp .m{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-weight:700}
.grp .m:first-of-type{border-top:0}
.grp .m .rl{margin-left:auto;font-size:14px;color:var(--teal2);font-weight:800;text-align:right}
.timerbig{font-family:var(--disp);font-size:clamp(54px,8vw,120px);line-height:1;font-variant-numeric:tabular-nums}
.timerbig.low{color:var(--gold)} .timerbig.out{color:var(--rose)}
.example{border-radius:22px;padding:14px 18px;background:rgba(201,184,255,.1);border:1px dashed rgba(201,184,255,.55);margin-top:14px;animation:lnin .35s both}
.example p{font-size:clamp(17px,1.4vw,22px);font-weight:700;margin:6px 0}
.qc{display:flex;flex-wrap:wrap;gap:6px}
.qc .chip{cursor:pointer}
.pres{border-radius:28px;padding:clamp(16px,2.4vw,30px);background:linear-gradient(160deg,rgba(255,200,97,.12),rgba(36,25,90,.88));border:2px solid rgba(255,200,97,.45)}

/* ════════ ENDINGS & PHOTO ════════ */
.endtitle{font-family:var(--disp);font-size:clamp(20px,2vw,32px);font-weight:800;color:var(--gold);text-align:center}
.polaroid{position:relative;width:min(640px,92vw,74vh);margin:0 auto;background:#FBF7EE;padding:clamp(12px,1.6vw,20px) clamp(12px,1.6vw,20px) clamp(54px,6vw,86px);border-radius:6px;box-shadow:0 40px 90px rgba(0,0,0,.6);transform:rotate(-2.2deg);animation:pol .9s cubic-bezier(.2,1,.3,1) both}
@keyframes pol{from{opacity:0;transform:translateY(40px) rotate(4deg) scale(.92)}}
.polaroid .ph{position:relative;container-type:inline-size;aspect-ratio:4/3;border-radius:2px;overflow:hidden;background:#141030}
.polaroid .ph .dev{position:absolute;inset:0;background:#2A2440;animation:develop 3.2s ease .3s both;pointer-events:none}
@keyframes develop{from{opacity:1}to{opacity:0}}

  room:rand4(), tid:uid(), live:false, ws:false, nt:'notes', bank:{} });
let S = FRESH();
if(ROLE==='teacher'){ try{ const st=JSON.parse(localStorage.getItem(KEY)||'null'); if(st){ S=Object.assign(FRESH(), st);
  ['choice','bo','sheet','vn','clock','tmr'].forEach(k=>S[k]=Object.assign(FRESH()[k], st[k]||{}));
  if(!Array.isArray(S.students)||!S.students.length) S.students=mkStudents(); } }catch(e){} }
let SAVE_HOOK = null;
function save(){ if(ROLE!=='teacher') return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} SAVE_HOOK && SAVE_HOOK(); }
const sd = id => (S.d[id] = S.d[id] || {});

const roster = ()=> S.students.filter(s=>!s.gone);
const here = ()=> S.students.filter(s=>s.here && !s.gone);
const stu = id => S.students.find(s=>s.id===id);
const sname = id => (stu(id)||{name:'—'}).name;
const initial = n => (String(n||'?').trim()[0]||'?').toUpperCase();
function addStudent(name){ const s={id:'p'+uid(), name:String(name||('Student '+(S.students.length+1))).slice(0,24), here:true, gone:false}; S.students.push(s); afterCrewChange(); return s; }
function setHere(id,v){ const s=stu(id); if(!s) return; s.here=v; afterCrewChange(); }
function removeStudent(id){ const s=stu(id); if(!s) return;
  const used = Object.values(S.tb).some(b=>b.log.some(x=>x.sid===id)) || Object.values(S.reads).includes(id);
  if(used){ s.gone=true; s.here=false; toast(s.name+' removed — their completed turns are kept in the record'); }
  else S.students=S.students.filter(x=>x.id!==id);
  afterCrewChange(); }
function renameStudent(id,name){ const s=stu(id); if(!s) return; s.name=String(name||'').slice(0,24)||s.name; save(); }
function afterCrewChange(){ Object.keys(BLOCKS).forEach(b=>{ if(S.tb[b]) ensureCur(b); }); save(); }

/* ---------- 4 · smart turns ----------
   Mandatory individual tasks = N × R  (N = present students, R = rounds).
   In a block that has started, the target becomes: completed mandatory turns (never erased)
   + the turns each PRESENT student still needs to reach R. The teacher sees the adjustment. */
const BLOCKS = {
  vocab:  {R:2, bank:VOCAB,        kind:'Vocabulary', title:'DECODE THE FRIEND GROUP', instr:'Read the situation. Say the correct expression.', sec:20},
  listen: {R:1, bank:LISTEN,       kind:'Listening',  title:'LISTEN AGAIN',            instr:'Listen again. Answer your question.', sec:25},
  grammar:{R:1, bank:GRAMMAR,      kind:'Grammar',    title:'REPAIR THE CONVERSATION', instr:'Fix it, complete it or make it stronger with DO / DOES / DID.', sec:25},
  speak:  {R:1, bank:SPEAK,        kind:'Speaking',   title:'WHAT WOULD YOU SAY?',     instr:'Imagine you are one of the friends. Answer + give one reason.', sec:30},
  reflect:{R:1, bank:REFLECT_BANK, kind:'Reflection', title:'A REAL FRIEND SHOULD…',   instr:'Finish the sentence. One short answer each.', sec:15}
};
const BORDER = Object.keys(BLOCKS);
const tbs = b => (S.tb[b] = S.tb[b] || {log:[], cur:null, rv:{}});
const taskOf = (b,tid)=> BLOCKS[b].bank.find(t=>t.id===tid) || BLOCKS[b].bank[0];
const mand = b => tbs(b).log.filter(x=>!x.opt && x.res!=='skip');
const turnsIn = (b,sid)=> mand(b).filter(x=>x.sid===sid).length;
const lessonTurns = sid => BORDER.reduce((n,b)=>n+(S.tb[b]?mand(b).filter(x=>x.sid===sid).length:0),0);
const diffSum = sid => BORDER.reduce((n,b)=>n+(S.tb[b]?mand(b).filter(x=>x.sid===sid).reduce((m,x)=>m+(taskOf(b,x.tid).d||2),0):0),0);
const kindsOf = sid => BORDER.filter(b=>S.tb[b] && mand(b).some(x=>x.sid===sid));
function target(b){
  const R=BLOCKS[b].R, P=here(), done=mand(b).length;
  const remaining=P.reduce((n,s)=>n+Math.max(0,R-turnsIn(b,s.id)),0);
  const total=done+remaining, base=P.length*R;
  const away=mand(b).filter(x=>!P.some(s=>s.id===x.sid)).length;
  const over=P.reduce((n,s)=>n+Math.max(0,turnsIn(b,s.id)-R),0);
  return {R, N:P.length, done, remaining, total, base, away, over, complete:remaining===0};
}
function pickStudent(b, exclude=[]){
  const R=BLOCKS[b].R, P=here(), off=BORDER.indexOf(b);
  const c=P.map((s,i)=>({s, i:(i-off+P.length*4)%Math.max(1,P.length)})).filter(o=>turnsIn(b,o.s.id)<R && !exclude.includes(o.s.id));
  if(!c.length) return null;
  c.sort((x,y)=> turnsIn(b,x.s.id)-turnsIn(b,y.s.id) || lessonTurns(x.s.id)-lessonTurns(y.s.id) || diffSum(x.s.id)-diffSum(y.s.id) || x.i-y.i);
  return c[0].s.id;
}
function pickTask(b, sid, avoid){
  const bank=BLOCKS[b].bank, T=tbs(b), used=new Set(T.log.map(x=>x.tid)); if(T.cur) used.add(T.cur.tid); if(avoid) used.add(avoid);
  let pend=bank.filter(t=>!used.has(t.id));
  if(!pend.length){ const cnt=t=>T.log.filter(x=>x.tid===t.id).length; pend=[...bank].filter(t=>t.id!==avoid).sort((a,c)=>cnt(a)-cnt(c)); }
  const win=pend.slice(0,3), lt=lessonTurns(sid);
  if(!lt || win.length<2) return win[0].id;
  const avgS=diffSum(sid)/lt, P=here().filter(s=>lessonTurns(s.id)>0), avgG=P.length?P.reduce((n,s)=>n+diffSum(s.id)/lessonTurns(s.id),0)/P.length:2;
  if(avgS>avgG+.15) return win.slice().sort((a,c)=>(a.d||2)-(c.d||2))[0].id;
  if(avgS<avgG-.15) return win.slice().sort((a,c)=>(c.d||2)-(a.d||2))[0].id;
  return win[0].id;
}
function assign(b){
  const T=tbs(b), tg=target(b); T.rv={};
  if(tg.complete){ T.cur=null; return; }
  const sid=pickStudent(b); if(!sid){ T.cur=null; return; }
  T.cur={sid, tid:pickTask(b,sid), opt:false, at:Date.now()};
  if(BLOCKS[b].sec && ROLE==='teacher') TMR.set(BLOCKS[b].sec, true);
}
function ensureCur(b){
  const T=tbs(b), tg=target(b);
  if(T.cur && !T.cur.opt){
    if(tg.complete){ T.cur=null; return; }
    const s=stu(T.cur.sid);
    if(!s || !s.here || s.gone || turnsIn(b,T.cur.sid)>=BLOCKS[b].R){ const n=pickStudent(b); if(n) T.cur.sid=n; else T.cur=null; }
    return;
  }
  if(!T.cur && !tg.complete) assign(b);
}
function markDone(b, res){
  const T=tbs(b); if(!T.cur) return;
  T.log.push({tid:T.cur.tid, sid:T.cur.sid, res, opt:!!T.cur.opt, at:Date.now()});
  const wasOpt=T.cur.opt; T.cur=null; T.rv={};
  if(target(b).complete){ if(!wasOpt){ toast('✅ All turns done — '+target(b).total+' / '+target(b).total); SND.play('done'); } }
  else assign(b);
  save(); draw();
}
function swapTask(b){ const T=tbs(b); if(!T.cur) return; T.cur.tid=pickTask(b,T.cur.sid,T.cur.tid); T.rv={}; save(); draw(); }
function setTurnStudent(b,sid){ const T=tbs(b); if(!T.cur) return; T.cur.sid=sid; save(); draw(); }
function nextStudentAuto(b){ const T=tbs(b); if(!T.cur) return; const n=pickStudent(b,[T.cur.sid]); if(n){ T.cur.sid=n; save(); draw(); } else toast('Everyone else has finished their turns in this block'); }
function extraTurn(b){
  const T=tbs(b), P=here(); if(!P.length) return toast('Add students in 👥 Crew first');
  const sid=P.slice().sort((x,y)=>lessonTurns(x.id)-lessonTurns(y.id))[0].id;
  T.cur={sid, tid:pickTask(b,sid), opt:true, at:Date.now()}; T.rv={}; save(); draw(); }
function cancelExtra(b){ const T=tbs(b); if(T.cur&&T.cur.opt){ T.cur=null; T.rv={}; ensureCur(b); save(); draw(); } }
function undoTurn(b){ const T=tbs(b); const last=T.log.pop(); if(!last) return; T.cur={sid:last.sid, tid:last.tid, opt:last.opt, at:Date.now()}; T.rv={}; save(); draw(); toast('Last turn undone — it is the current turn again'); }

/* story reading turns (separate from the task quota) */
const readsOf = sid => Object.values(S.reads).filter(v=>v===sid).length;
function readerFor(key){
  if(ROLE!=='teacher') return S.reads[key] || null;
  const cur=S.reads[key], P=here(); if(!P.length) return null;
  if(cur && P.some(s=>s.id===cur)) return cur;
  const n=Object.keys(S.reads).length, c=P.map((s,i)=>({s, i:(i-n%P.length+P.length)%P.length}));
  c.sort((x,y)=>readsOf(x.s.id)-readsOf(y.s.id) || x.i-y.i);
  S.reads[key]=c[0].s.id; return c[0].s.id;
}
function cycleReader(key){ const P=here(); if(!P.length) return; const i=P.findIndex(s=>s.id===S.reads[key]); S.reads[key]=P[(i+1)%P.length].id; save(); draw(); }

/* ---------- timers ---------- */
const TMR = {
  left(){ const t=S.tmr; return t.run ? Math.max(0,(t.end-Date.now())/1000) : t.left; },
  run(){ return !!S.tmr.run; },
  set(sec, quiet){ S.tmr={dur:sec, left:sec, run:false, end:0}; if(!quiet){ save(); this.paint(); pubState(); } },
  start(){ const t=S.tmr; if(t.left<=0) t.left=t.dur; t.end=Date.now()+t.left*1000; t.run=true; save(); this.paint(); pubState(); },
  pause(){ const t=S.tmr; t.left=this.left(); t.run=false; save(); this.paint(); pubState(); },
  toggle(){ this.run()?this.pause():this.start(); },
  reset(){ this.set(S.tmr.dur||60); },
  add(sec){ const t=S.tmr; if(t.run) t.end+=sec*1000; else t.left+=sec; t.dur=Math.max(t.dur,t.left); save(); this.paint(); pubState(); },
  tick(){ const t=S.tmr; if(ROLE==='teacher' && t.run && Date.now()>=t.end){ t.run=false; t.left=0; save(); SND.play('buzz'); toast('⏰ Time is up — move on when you’re ready.'); pubState(); }
    this.paint(); CLOCK.paint(); },
  paint(){ const l=this.left(); $$('[data-clock]').forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=10&&l>0&&S.tmr.dur<=60 || l<=60&&l>0&&S.tmr.dur>60); e.classList.toggle('out',l<=0); });
    $$('[data-tplay]').forEach(b=>b.textContent=this.run()?'❚❚ Pause':'▶ Start'); }
};
const CLOCK = {
  el(){ const c=S.clock; return c.acc + (c.run ? (Date.now()-c.start)/1000 : 0); },
  toggle(){ const c=S.clock; if(c.run){ c.acc=this.el(); c.run=false; } else { c.start=Date.now(); c.run=true; } save(); this.paint(); },
  begin(){ if(!S.clock.run && S.clock.acc===0){ S.clock.start=Date.now(); S.clock.run=true; } },
  reset(){ S.clock={run:false, acc:0, start:0}; save(); this.paint(); },
  paint(){ const b=$('#clock'); if(!b) return; const e=this.el(), left=CORE_MIN*60-e;
    b.innerHTML=`<span>${S.clock.run?'⏱':'⏸'}</span><span class="v">${left>=0?mmss(left):'+'+mmss(-left)}</span><span class="of">left of ${CORE_MIN}:00</span>`;
    b.classList.toggle('over',left<0); $$('[data-lclock]').forEach(x=>x.textContent=mmss(e)); }
};

/* ---------- sound (Web Audio, quiet) ---------- */
const SND = {
  ctx:null,
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur=.15, type='sine', vol=.1, delay=0, f2){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); },
  noise(dur=.25, vol=.12){ const a=this.ac(); if(!a) return; const n=a.sampleRate*dur, b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);
    for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); const s=a.createBufferSource(), g=a.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g).connect(a.destination); s.start(); },
  play(k){ if(!S.sound || ROLE!=='teacher') return; try{
    if(k==='msg'){ this.tone(880,.08,'sine',.08); this.tone(1320,.12,'sine',.07,.07); }
    else if(k==='reveal'){ [523,659,784].forEach((f,i)=>this.tone(f,.3,'triangle',.06,i*.04)); }
    else if(k==='done'){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.3,'triangle',.07,i*.08)); }
    else if(k==='shutter'){ this.noise(.12,.25); this.tone(2400,.05,'square',.03,.08); }
    else if(k==='buzz'){ this.tone(330,.4,'sawtooth',.05,0,220); }
  }catch(e){} }
};

let MINICITY=null;

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- voice note: real mp3, or the browser's voice as an honest fallback ---------- */
const WAVE = (()=>{ const r=mulberry(5); return Array.from({length:64},(_,i)=>.25+.75*Math.abs(Math.sin(i*.37)*.6+r()*.5)); })();
const VN = {
  mode:'loading', audio:null, rate:1, playing:false, prog:0, idx:-1, voice:null, t0:0, raf:0, dur0:34,
  init(){
    if(ROLE!=='teacher') { this.mode='screen'; return; }
    const src=CFG.VOICE_NOTE;
    if(src){ const a=new Audio(); a.preload='auto'; a.src=src;
      a.addEventListener('loadedmetadata',()=>{ this.mode='file'; this.audio=a; this.dur0=a.duration||34; this.paint(); });
      a.addEventListener('timeupdate',()=>{ if(this.mode!=='file') return; this.prog=a.duration?a.currentTime/a.duration:0; this.idx=this.sentAt(a.currentTime); this.paint(); });
      a.addEventListener('ended',()=>{ this.playing=false; this.prog=1; this.idx=-1; S.vn.heard=(S.vn.heard||0)+1; save(); this.paint(); });
      a.addEventListener('error',()=>{ this.fallback(); });
      setTimeout(()=>{ if(this.mode==='loading') this.fallback(); },6000);
    } else this.fallback();
  },
  fallback(){ this.mode = ('speechSynthesis' in window) ? 'tts' : 'none';
    if(this.mode==='tts'){ const pick=()=>{ const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
      const pref=['Google UK English Male','Daniel','Microsoft Ryan','Microsoft Guy','Alex','Fred','Google US English'];
      this.voice=pref.map(n=>v.find(x=>x.name.includes(n))).find(Boolean)||v[0]||null; }; pick(); speechSynthesis.onvoiceschanged=pick; }
    this.paint(); },
  sentAt(t){ const M=CFG.VOICE_MARKS||[]; let k=-1; M.forEach((m,i)=>{ if(t>=m) k=i; }); return k; },
  dur(){ return (this.mode==='file' && this.audio ? this.audio.duration : this.dur0) / this.rate; },
  time(){ return this.prog*this.dur(); },
  play(){
    if(this.mode==='file'){ const a=this.audio; a.playbackRate=this.rate; if(this.prog>=1) a.currentTime=0; a.play().catch(()=>toast('Press ▶ again — the browser blocked autoplay')); this.playing=true; this.paint(); return; }
    if(this.mode!=='tts') return toast('No audio here — read the transcript aloud instead.');
    speechSynthesis.cancel(); this.playing=true; if(this.prog>=1||this.idx<0){ this.idx=0; this.prog=0; } this.say(this.idx); },
  say(i){
    if(i>=VOICE_SENT.length){ this.playing=false; this.prog=1; this.idx=-1; S.vn.heard=(S.vn.heard||0)+1; save(); this.paint(); return; }
    this.idx=i; const u=new SpeechSynthesisUtterance(VOICE_SENT[i].replace(/\bDID\b/g,'did').replace(/\bDO\b/g,'do')); u.lang='en-GB'; if(this.voice){ u.voice=this.voice; u.lang=this.voice.lang; }
    u.rate=.92*this.rate; u.pitch=1.05;
    u.onend=()=>{ if(!this.playing) return; this.prog=(i+1)/VOICE_SENT.length; this.say(i+1); };
    u.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled'){ this.playing=false; this.paint(); toast('The browser could not speak — read the transcript aloud instead.'); } };
    speechSynthesis.speak(u); this.prog=i/VOICE_SENT.length; this.paint(); },
  pause(){ this.playing=false; if(this.mode==='file') this.audio.pause(); else if(this.mode==='tts') speechSynthesis.cancel(); this.paint(); },
  toggle(){ this.playing?this.pause():this.play(); },
  replay(){ this.pause(); this.prog=0; this.idx=0; if(this.mode==='file') this.audio.currentTime=0; this.play(); },
  seek(f){ f=Math.max(0,Math.min(1,f)); if(this.mode==='file'&&this.audio){ this.audio.currentTime=f*this.audio.duration; this.prog=f; this.paint(); }
    else if(this.mode==='tts'){ const i=Math.min(VOICE_SENT.length-1,Math.floor(f*VOICE_SENT.length)); const was=this.playing; this.pause(); this.idx=i; this.prog=i/VOICE_SENT.length; if(was) this.play(); else this.paint(); } },
  setRate(r){ this.rate=r; if(this.mode==='file'&&this.audio) this.audio.playbackRate=r; else if(this.mode==='tts'&&this.playing){ speechSynthesis.cancel(); this.say(this.idx); } this.paint(); },
  stop(){ if(this.playing) this.pause(); },
  paint(){
    const box=$('.vn'); if(box){
      box.classList.toggle('playing',this.playing);
      const n=Math.round(this.prog*WAVE.length); $$('.wave i',box).forEach((b,i)=>b.classList.toggle('p',i<n));

      $$('[data-rate]',box).forEach(b=>b.classList.toggle('on',+b.dataset.rate===this.rate));
      const md=$('[data-vmode]',box); if(md){ md.className='mode '+(this.mode==='tts'?'tts':''); md.textContent=
        this.mode==='file'?'🎧 Recording · voice note from Alex':this.mode==='tts'?'🗣 Synthesized voice (browser) — or the teacher reads the transcript':this.mode==='loading'?'Loading the recording…':this.mode==='screen'?'🎧 Audio plays on the teacher’s computer':'No audio — the teacher reads the transcript aloud'; }
    }
    $$('.trans span[data-si]').forEach(s=>s.classList.toggle('on',this.playing && +s.dataset.si===this.idx));
    $$('[data-heard]').forEach(e=>e.textContent=S.vn.heard?('Played '+S.vn.heard+'×'):'Not played yet');
  }

/* group building for the breakout */
function buildGroups(mode){
  const P=here(), g=[];
  if(mode==='solo') P.forEach(s=>g.push({members:[s.id], roles:{[s.id]:'solo'}}));
  else if(mode==='pairs'){ for(let i=0;i<P.length;i+=2) g.push({members:P.slice(i,i+2).map(s=>s.id)});
    if(g.length>1 && g[g.length-1].members.length===1){ const last=g.pop(); g[g.length-1].members.push(last.members[0]); } }
  else { const n=P.length, k=n<=3?1:Math.round(n/3.4)||1; for(let i=0;i<k;i++) g.push({members:[]}); P.forEach((s,i)=>g[i%k].members.push(s.id)); }
  g.forEach((x,i)=>{ x.id='g'+(i+1); x.name=GROUP_NAMES[i%GROUP_NAMES.length];
    if(!x.roles){ x.roles={}; const m=x.members;
      if(m.length===1) x.roles[m[0]]='solo';
      else if(m.length===2){ x.roles[m[0]]='pairA'; x.roles[m[1]]='pairB'; }
      else { const order=['peace','coach','fun','pres']; m.forEach((sid,j)=>x.roles[sid]=order[j]||'pres'); } } });
  S.bo.mode=mode; S.bo.groups=g; S.bo.cur=0; save();
}

let CTX = {entering:true};

const cur = ()=> STEPS[S.i] || STEPS[0];

function draw(){
  if(ROLE==='student') return;
  const v=$('#view');
  if(S.gz){ const entering=LAST.gz!==S.gz||LAST.id!=='__gz'; document.body.dataset.sky='night'; v.innerHTML=gzRender(); if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
    gzAfter(v); LAST={id:'__gz', p:0, gz:S.gz}; paintChrome(); paintSheet(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); save(); return; }
  const s=cur(), d=sd(s.id);
  if((d.p||0)>parts(s)-1) d.p=parts(s)-1;
  const entering = LAST.id!==s.id;
  CTX={entering};
  if(entering && ROLE==='teacher' && s.enter) s.enter(d);
  document.body.dataset.sc=s.sc; document.body.dataset.sky=s.sky||SCENES[s.sc-1].sky;
  const fid=document.activeElement && document.activeElement.id;
  v.innerHTML=s.render(d);
  if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  bindReaders(v);
  s.after && s.after(v,d);
  if(fid && !entering){ const f=document.getElementById(fid); if(f && v.contains(f)) f.focus({preventScroll:true}); }
  if(entering && !$('.vn',v)) VN.stop();
  LAST={id:s.id, p:d.p||0, gz:null};
  paintChrome(); paintSheet(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); TMR.paint(); save();
}
function next(){
  if(S.gz){ closeGZ(); return; }
  const s=cur(), d=sd(s.id), P=parts(s), p=d.p||0;
  if(s.ready && !s.ready(d)){ const g=s.id+':'+p; if(GATE!==g){ GATE=g; toast(s.gateMsg||'Not finished yet — press Next again to continue'); return; } }
  GATE=null;
  if(p<P-1){ d.p=p+1; s.onPart&&s.onPart(d); save(); draw(); return; }
  s.leave && s.leave(d);
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else toast('That’s the end of the core lesson — open the 🎮 Game Zone for Alias and Kahoot.');
}
function back(){
  if(S.gz){ closeGZ(); return; }
  const d=sd(cur().id); GATE=null;
  if((d.p||0)>0){ d.p--; save(); draw(); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--; if(k>=0) go(k);
}
function go(k){ if(!STEPS[k]) return; S.gz=null; S.i=k; GATE=null; save(); draw(); }
function goScene(n){ const k=STEPS.findIndex((x,i)=>x.sc===n && visible(i)); if(k>=0) go(k); }
function reveal(){ if(S.gz) return; const s=cur(), d=sd(s.id);
  if(s.reveal){ if(s.reveal(d)===false) return; d.hid=false; } else if(parts(s)>1){ d.p=parts(s)-1; s.onPart&&s.onPart(d); } else return;
  SND.play('reveal'); save(); draw(); }

  $('#bBack').disabled = !S.gz && S.i===0 && !(d.p>0);
  $('#bBack').innerHTML = S.gz ? '◀ <span class="lbl2">Back to lesson</span>' : '◀ <span class="lbl2">Back</span>';

/* ---------- 10 · live room ----------
   Учитель — єдине джерело стану. Захист (як в уроках 13–22):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»;
   • учні надсилають тільки hello / ans / react; учитель перевіряє кожне (поточне завдання, межі, довжину);
   • відповіді й sample answers доходять на телефони лише після Reveal; один голос на телефон; лише нік / ім’я. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const WALLQ = [], NAMES = {};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','⚡'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson23-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson23-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l23sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l23sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson23-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson23-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));
  if(TKEY.ok){ try{ const sig=await TKEY.sign(body); Net.send({t:'sig', body, sig, pk:TKEY.pub}); return; }catch(e){ console.warn(e); } }
  Net.send({t:'raw', body});
}

     <p class="small mt" style="color:#BFF7DE">🔐 Your messages are signed with a key that never leaves this browser. Phones obey only this signature.</p></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:center" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn primary" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--gold)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → only a local demo is possible.</p>'}
   ${canSign()?'':'<p class="small mt" style="color:var(--gold)">This page is not on https, so messages can’t be signed. Open it from GitHub Pages for the live room.</p>'}`);
  $('[data-close]','#modalBox').onclick=closeModal;
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); openLive(); };
  $('#lvCopy').onclick=()=>copyText(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 11 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student'); document.body.dataset.sky='dusk';
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], sent={}, taskKey='', trust=null, lastTs=0, verified=false;
  try{ name=localStorage.getItem('l23name')||''; avatar=localStorage.getItem('l23av')||avatar; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':''); $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','👏','✋','💛'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="row" style="gap:6px">${FIVE.map(k=>av(k,46)).join('')}</div>
      <h2 class="dsp mt" style="font-size:28px">Join the Friendship Crew 🌆</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Your first name — the same as on the teacher’s list</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Anna" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">First name only — no surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,24), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l23name',name); localStorage.setItem('l23av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const join=async()=>{
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🌆</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ document.body.dataset.sky=m.sky||'dusk'; const k=JSON.stringify([m.sc, m.step, m.task]); st=m; if(k!==taskKey){ taskKey=k; render(); } else paintT(); }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for the teacher…<br><span class="small">Room ${esc(room)} — are the code and teacher key right? <a href="?join" style="color:var(--teal2)">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">📸</div><h2 class="dsp mt" style="font-size:28px">MISSION COMPLETE!</h2><p class="small">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>nameKey(n)===nameKey(name);
  const head2=()=>`<div class="stu-prog">${SCENES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div>
      <div class="small" style="margin-bottom:6px;font-weight:800">Scene ${st.sc} · ${esc(st.title||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait">${av('sophie',90)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head2();
    if(!T){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Read, listen and be ready to speak!</p></div>`; return; }
    if(T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T.e||'🌆')}</div><p><b>${esc(T.t)}</b></p></div>`; return; }
    if(T.kind==='turn'){
      const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block)} · turn ${Math.min(T.done+1,T.total)} of ${T.total} <span id="stuT"></span></p>
        <p style="font-size:22px;font-weight:800;margin:6px 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p>
        <p style="font-size:20px;font-weight:700">${emph(T.prompt)}</p>
        ${T.hint?`<p class="small">💡 ${emph(T.hint)}</p>`:''}
        ${T.ans?`<div class="stu-card" style="background:rgba(91,227,168,.12);border-color:rgba(91,227,168,.5)"><b>${emph(T.ans)}</b></div>`:`<p class="small">${mine?'Say your answer out loud in Zoom.':'Listen — could you help if they get stuck?'}</p>`}</div>`; paintT(); return; }
    if(T.kind==='choice'){
      const my=sent[T.id], dec=T.chosen!=null;
      B.innerHTML=hd+`<div class="stu-card"><p style="font-size:20px;font-weight:800">${emph(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${dec&&T.chosen===i?'right':my===i?'pick':''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${dec?`The crew chose ${LET[T.chosen]}. Look at the main screen.`:my!==undefined?'✓ Vote sent! You can change it.':'Tap your choice.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.chosen!=null) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return; }
    if(T.kind==='text'){
      B.innerHTML=hd+`<div class="stu-card"><p style="font-size:20px;font-weight:800">${emph(T.q)}</p><textarea id="tx" maxlength="160" placeholder="${esc(T.ph||'')}"></textarea><button class="btn primary mt" id="sd" style="width:100%">Send</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. You can send a new version.':'You can also answer out loud in Zoom.'}</p></div>`;
      $('#sd').onclick=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      return; }
    if(T.kind==='group'){
      const g=(T.groups||[]).find(x=>x.m.some(p=>me(p.n)));
      if(g){ const r=g.m.find(p=>me(p.n)); B.innerHTML=hd+`<div class="stu-card myturn"><p class="small">Your team <span id="stuT"></span></p><h2 class="dsp" style="font-size:28px">${esc(g.name)}</h2>
          <p style="font-size:20px;font-weight:800;margin-top:10px">Your role: ${esc(r.r)}</p><p>${esc(r.d)}</p>
          <p class="small mt">Team: ${g.m.map(p=>esc(p.n)+' ('+esc(p.r)+')').join(', ')}</p></div>
          <div class="stu-card"><b>SAVE THE LAST HANGOUT!</b>${T.steps.map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}<p class="small">3+ friendship expressions · 2+ DO / DOES / DID · everyone speaks · no writing</p></div>`; }
      else B.innerHTML=hd+`<div class="stu-card"><p><b>Teams</b> <span id="stuT"></span></p>${(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(p=>esc(p.n)).join(', ')}</p>`).join('')}<p class="small">Can’t find your name? Ask your teacher — use the same name as on their list.</p></div>`;
      paintT(); return; }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(S.sheet.open&&S.gz){ S.sheet.open=false; save(); paintSheet(); pubState(); return; } if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(!S.gz && s.block && tbs(s.block).cur) markDone(s.block,'ok'); }
  else if(k==='n') openNav(); else if(k==='c') openCrew(); else if(k==='w') toggleNotes(); else if(k==='f') present();
  else if(k==='g') S.gz?closeGZ():openGZ('home');
});
if(ROLE==='student'){ buildSky(); studentApp(); }
else if(ROLE==='screen'){ buildSky(); buildRail(); VN.init(); screenApp(); }
else {
  buildSky(); applyAnim(); buildRail(); VN.init();
  const _p=VN.paint.bind(VN); VN.paint=function(){ _p(); pushScreen(); };
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bHint').onclick=hint;
  $('#bWs').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false); $('#bNav').onclick=openNav; $('#bCrew').onclick=openCrew;
  $$('#notes [data-nt]').forEach(b=>b.onclick=()=>{ S.nt=b.dataset.nt; save(); paintNotes(); });
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#bScreen').onclick=openScreen; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#bQuick').onclick=()=>setQuick(!S.core); $('#clock').onclick=()=>CLOCK.toggle();
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello') pushScreen(); };
  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  if(S.ws && innerWidth>=1280){ $('#notes').classList.add('on'); document.body.classList.add('ws'); $('#notes').setAttribute('aria-hidden','false'); }
  draw();
  if(S.live) startLive(true);
}
