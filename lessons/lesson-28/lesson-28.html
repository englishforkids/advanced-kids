/* ---------- sound (Web Audio, quiet; off by default) ---------- */
const SND = {
  ctx:null,
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur=.15, type='sine', vol=.1, delay=0, f2){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); },
  play(k){ if(!S.sound || ROLE!=='teacher') return; const V=Math.max(0,Math.min(1,S.vol??.6))*1.4; if(!V) return; const t=(f,d,ty,v,dl,f2)=>this.tone(f,d,ty,v*V,dl,f2); try{
    if(k==='msg'){ t(880,.08,'sine',.06); t(1320,.12,'sine',.05,.07); }
    else if(k==='ping'){ t(988,.12,'sine',.07); t(1319,.18,'sine',.06,.12); }
    else if(k==='open'){ t(660,.1,'triangle',.06); t(990,.16,'triangle',.05,.08); }
    else if(k==='call'){ [0,.25,.6,.85].forEach(d=>t(1180,.16,'sine',.05,d)); }
    else if(k==='intro'){ [392,494,587,784].forEach((f,i)=>t(f,.32,'triangle',.06,i*.13)); t(784,.9,'sine',.04,.55); }
    else if(k==='spot'){ t(320,.5,'sine',.05,0,960); t(1280,.35,'triangle',.04,.35); }
    else if(k==='ok'){ t(784,.12,'triangle',.06); t(1046,.18,'triangle',.05,.09); }
    else if(k==='reveal'){ [523,659,784].forEach((f,i)=>t(f,.3,'triangle',.05,i*.04)); }
    else if(k==='done'){ [523,659,784,1046].forEach((f,i)=>t(f,.3,'triangle',.06,i*.08)); }
    else if(k==='end'){ [784,659,523,659,784].forEach((f,i)=>t(f,.35,'triangle',.05,i*.16)); t(392,1.2,'sine',.04,.8); }
    else if(k==='buzz'){ t(330,.4,'sawtooth',.04,0,220); }
  }catch(e){} }
};

/* ---------- 7 · voice message players (Maya + Leo) ----------
   1) audio files from LESSON_CONFIG.VOICE_MESSAGES (AI-generated voices, labelled “AI voice”);
   2) a file is missing or can’t play → the browser reads the same script aloud (labelled “browser voice”);
   3) no speech in this browser → the teacher reads the transcript (🧑‍🏫 Notes → Script).
   Only the teacher’s page plays sound (Share sound in Zoom); the audience window mirrors the player. */
const VMS = {};
function track(k){
  const V=VOICES[k];
  return VMS[k] = VMS[k] || {
    k, el:null, mode:null, playing:false, t:0, dur:V.dur, raf:0, failed:false, ttsStart:0,
    src(){ return (CFG.VOICE_MESSAGES||{})[k]||''; },
    init(){ if(this.el||this.failed) return; const src=this.src(); if(!src){ this.failed=true; return; }
      const a=this.el=new Audio(); a.preload='auto'; a.src=src;
      a.addEventListener('loadedmetadata',()=>{ if(isFinite(a.duration)) this.dur=a.duration; paintVM(); });
      a.addEventListener('ended',()=>{ this.playing=false; this.t=this.dur; this.done(); });
      a.addEventListener('error',()=>{ this.failed=true; if(this.playing){ this.playing=false; this.play(); } paintVM(); }); },
    label(){ return (this.failed||!this.src()) ? (('speechSynthesis' in window)?'browser voice':'teacher reads') : (CFG.VOICE_IS_AI?'AI voice':''); },
    rate(){ return S.vrate||1; },
    toggle(){ this.playing?this.pause():this.play(); },
    play(){
      if(ROLE!=='teacher') return; this.init();
      Object.values(VMS).forEach(o=>{ if(o!==this && o.playing) o.pause(); });
      if(!this.failed){
        if(this.t>=this.dur-.05){ this.t=0; this.el.currentTime=0; }
        this.el.playbackRate=this.rate(); const p=this.el.play(); this.playing=true; this.mode='file';
        if(p&&p.catch) p.catch(()=>{ this.failed=true; this.playing=false; this.play(); });
        this.loop(); this.note(); paintVM(); return;
      }
      if(!('speechSynthesis' in window)){ toast('This browser can’t play the audio — please read the transcript aloud (🧑‍🏫 Notes).'); return; }
      this.mode='tts'; speechSynthesis.cancel(); this.playing=true; if(this.t>=this.dur-.05) this.t=0;
      this.speakFrom(Math.max(0,this.idx(true))); this.loop(); this.note(); paintVM();
    },
    speakFrom(i){
      const voices=speechSynthesis.getVoices(), en=voices.filter(x=>/^en/i.test(x.lang));
      const pref=V.tts.female ? ['Aria','Jenny','Samantha','Google UK English Female','Zira','Karen','Moira','Serena'] : ['Guy','Ryan','Daniel','Google UK English Male','David','Alex','Fred','Mark'];
      const v=pref.map(n=>en.find(x=>x.name.includes(n))).find(Boolean) || en[0] || null;
      const say=n=>{ if(!this.playing||this.mode!=='tts') return; if(n>=V.lines.length){ this.playing=false; this.t=this.dur; this.done(); return; }
        this.t=V.times[n]; this.ttsStart=performance.now()-V.times[n]*1000/this.rate();
        const u=new SpeechSynthesisUtterance(V.lines[n].replace(/[\[\]]/g,'')); if(v) u.voice=v; u.lang='en-US'; u.rate=.95*this.rate(); u.pitch=V.tts.pitch;
        u.onend=()=>say(n+1); u.onerror=()=>say(n+1); speechSynthesis.speak(u); };
      say(i);
    },
    pause(){ if(this.mode==='file'&&this.el){ this.el.pause(); this.t=this.el.currentTime; } else if('speechSynthesis' in window) speechSynthesis.cancel(); this.playing=false; cancelAnimationFrame(this.raf); paintVM(); this.note(); },
    stop(){ if(this.playing) this.pause(); this.t=0; try{ if(this.el) this.el.currentTime=0; }catch(e){} paintVM(); this.note(); },
    replay(){ this.stop(); this.play(); },
    done(){ cancelAnimationFrame(this.raf); const d=sd('voices'); d['heard_'+k]=(d['heard_'+k]||0)+1; save(); paintVM(); this.note(); draw(); },
    loop(){ cancelAnimationFrame(this.raf); const f=()=>{ if(!this.playing) return; this.t=this.mode==='file'?this.el.currentTime:Math.min(this.dur,(performance.now()-this.ttsStart)/1000*this.rate()); paintVM(); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f); },
    idx(any){ let n=-1; V.times.forEach((s,i)=>{ if(this.t>=s-.05) n=i; }); return any||this.playing||this.t>0&&this.t<this.dur?n:-1; },
    note(){ S.vm={k, p:this.playing, t:Math.round(this.t*10)/10, at:Date.now(), r:this.rate()}; pushScreen(); }
  };
}

const anyPlaying = ()=> Object.values(VMS).some(o=>o.playing);
function pauseAllVM(){ Object.values(VMS).forEach(o=>{ if(o.playing) o.pause(); }); }
function stopAllVM(){ Object.values(VMS).forEach(o=>o.stop()); }
function setRate(r){ S.vrate=r; Object.values(VMS).forEach(o=>{ if(o.el) o.el.playbackRate=r; if(o.playing&&o.mode==='tts'){ o.pause(); o.play(); } }); save(); paintVM(); }
const WAVE = Array.from({length:40},(_,i)=>Math.round(22+Math.abs(Math.sin(i*1.7)*48+Math.sin(i*.6)*26)%74));

}
function bindVM(v){
  $$('[data-vmp]',v).forEach(b=>b.onclick=e=>{ e.stopPropagation(); track(b.dataset.vmp).toggle(); paintVM(); });
  $$('[data-vmr]',v).forEach(b=>b.onclick=()=>track(b.dataset.vmr).replay());

}
function paintVM(){
  if(ROLE==='screen' && S.vm){ Object.values(VMS).forEach(o=>{ if(o.k===S.vm.k){ o.playing=S.vm.p; o.t=Math.min(o.dur, S.vm.t + (S.vm.p?(Date.now()-S.vm.at)/1000*(S.vm.r||1):0)); } else o.playing=false; }); }

      const opts = b==='vocab' ? t.opts : null;
      return {kind:'turn', b, id:b+':'+T.cur.tid+':'+T.cur.sid, who:stu(T.cur.sid)?stu(T.cur.sid).name:'', block:B.kind, prompt, opts, pick:T.rv.pick??null,

/* ── breakout helpers ── */
function teamSizes(n){ if(n<=3) return [n]; if(n===4) return [2,2]; if(n===5) return [2,3]; if(n===6) return [3,3]; if(n===7) return [3,4]; if(n===8) return [4,4]; const k=Math.ceil(n/4); const base=Math.floor(n/k), extra=n%k; return Array.from({length:k},(_,i)=>base+(i<extra?1:0)); }
function rolesFor(m){ const r={};
  if(m.length===1) r[m[0]]='solo'; else if(m.length===2){ r[m[0]]='hostx'; r[m[1]]='exp2x'; } else m.forEach((sid,j)=>r[sid]=['host','exp1','exp2'][j]||'exp3');
  return r; }
function buildGroups(mode){
  const P=here(), g=[];
  if(mode==='solo') P.forEach(s=>g.push({members:[s.id]}));
  else if(mode==='pairs'){ for(let i=0;i<P.length;i+=2) g.push({members:P.slice(i,i+2).map(s=>s.id)}); if(g.length>1 && g[g.length-1].members.length===1){ const last=g.pop(); g[g.length-1].members.push(last.members[0]); } }
  else { let i=0; teamSizes(P.length).forEach(n=>{ g.push({members:P.slice(i,i+n).map(s=>s.id)}); i+=n; }); }
  g.forEach((x,i)=>{ x.id='g'+(i+1); x.name=GROUP_NAMES[i%GROUP_NAMES.length]; x.roles=rolesFor(x.members); });
  S.bo.mode=mode; S.bo.groups=g; S.bo.cur=0; save();
}
function ensureGroups(){ const P=here().map(s=>s.id).sort().join(), G=S.bo.groups.flatMap(g=>g.members).sort().join();
  if(S.bo.groups.length && P===G) return;
  const mode = here().length===1 ? 'solo' : (S.bo.modeSet ? S.bo.mode : 'teams'); buildGroups(mode); }
function moveMember(sid){ const G=S.bo.groups; if(G.length<2) return; const i=G.findIndex(g=>g.members.includes(sid)); if(i<0) return;
  G[i].members=G[i].members.filter(x=>x!==sid); const j=(i+1)%G.length; G[j].members.push(sid);
  S.bo.groups=G.filter(g=>g.members.length); S.bo.groups.forEach(g=>g.roles=rolesFor(g.members)); save(); }
function swapRoles(gid){ const g=S.bo.groups.find(x=>x.id===gid); if(!g||g.members.length<2) return; g.members.push(g.members.shift()); g.roles=rolesFor(g.members); save(); }
function groupsHTML(editable){ if(!S.bo.groups.length) return '';
  return `<div class="groups">${S.bo.groups.map(g=>`<div class="grp"><h4>${esc(g.name)}${editable&&g.members.length>1?` <button class="btn xs ghost tonly" data-sw="${g.id}" title="Swap the characters inside this team">🔁 roles</button>`:''}</h4>${g.members.map(sid=>{ const r=ROLES[g.roles[sid]]||ROLES.exp3;
    return `<div class="m">${iniBubble(sname(sid))}<span>${esc(sname(sid))}</span><span class="rl">${r.e} ${esc(r.t)}</span>${editable&&S.bo.groups.length>1?`<button class="btn xs ghost tonly" data-mv="${sid}" title="Move to the next team">⇄</button>`:''}</div>`; }).join('')}</div>`).join('')}</div>`; }

/* ---------- 9 · engine ---------- */
let CTX = {entering:true};
let LAST = {id:null, p:-1, gz:null}, GATE = null;
const cur = ()=> STEPS[S.i] || STEPS[0];
const parts = s => typeof s.parts==='function' ? s.parts() : (s.parts||1);
const visible = k => !!STEPS[k] && !(S.core && STEPS[k].opt) && !(STEPS[k].block && isOff(STEPS[k].block));
const typing = ()=> !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('input,textarea,select'));
if(S.i>=STEPS.length) S.i=0;

function draw(){
  if(ROLE==='student') return;
  const v=$('#view');
  if(S.gz){ const entering=LAST.gz!==S.gz||LAST.id!=='__gz'; document.body.dataset.sky='night'; v.innerHTML=gzRender(); if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
    gzAfter(v); LAST={id:'__gz', p:0, gz:S.gz}; paintChrome(); paintSheet(); paintGref(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); save(); return; }
  const s=cur(), d=sd(s.id);
  if((d.p||0)>parts(s)-1) d.p=parts(s)-1;
  const entering = LAST.id!==s.id;
  CTX={entering, partChanged: entering || LAST.p!==(d.p||0)};
  if(entering && ROLE==='teacher' && s.enter) s.enter(d);
  document.body.dataset.sc=s.sc; document.body.dataset.sky=s.sky||SCENES[s.sc-1].sky;
  const fid=document.activeElement && document.activeElement.id;
  v.innerHTML=s.render(d);
  if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  bindReaders(v);
  s.after && s.after(v,d);
  if(fid && !entering){ const f=document.getElementById(fid); if(f && v.contains(f)) f.focus({preventScroll:true}); }
  LAST={id:s.id, p:d.p||0, gz:null};
  paintChrome(); paintSheet(); paintGref(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); TMR.paint(); save();
}
function next(){
  if(S.gz){ closeGZ(); return; }
  const s=cur(), d=sd(s.id), P=parts(s), p=d.p||0;
  if(p<P-1){ d.p=p+1; s.onPart&&s.onPart(d); GATE=null; save(); draw(); return; }
  if(s.ready && !s.ready(d)){ const g=s.id+':'+p; if(GATE!==g){ GATE=g; toast(s.gateMsg||'Not finished yet — press Next again to continue'); return; } }
  GATE=null;
  s.leave && s.leave(d);
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else openGZ('home');
}
function back(){
  if(S.gz){ closeGZ(); return; }
  const d=sd(cur().id); GATE=null;
  if((d.p||0)>0){ d.p--; save(); draw(); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--; if(k>=0) go(k);
}
function go(k){ if(!STEPS[k]) return; S.gz=null; S.i=k; GATE=null; save(); draw(); }
function goScene(n){ const k=STEPS.findIndex((x,i)=>x.sc===n && visible(i) && x.id!=='setup' && x.id!=='title'); if(k>=0) go(k); }
function reveal(){ if(S.gz) return; const s=cur(), d=sd(s.id);
  if(s.reveal){ if(s.reveal(d)===false) return; } else if(parts(s)>1){ d.p=parts(s)-1; s.onPart&&s.onPart(d); } else return;
  SND.play('reveal'); save(); draw(); }
function hint(){ const s=cur(); if(S.gz||!s.hint) return; if(s.hint(sd(s.id))===false) return; save(); draw(); }
function hideAns(){ if(S.gz) return; const s=cur(), d=sd(s.id); if(s.hide) s.hide(d); else return; save(); draw(); toast('Answer hidden'); }

function buildRail(){
  $('#rail').innerHTML=SCENES.map(sc=>`<button data-sc="${sc.n}" aria-label="Segment ${sc.n}: ${esc(sc.t)} — ${esc(sc.f)}"><span class="k">${sc.n}</span><span class="t">${esc(sc.t)}</span></button>`).join('')+`<button class="gz" data-gz aria-label="Game Zone">🎮 <span class="t">Games</span></button>`;
  $$('#rail [data-sc]').forEach(b=>b.onclick=()=>goScene(+b.dataset.sc)); $('#rail [data-gz]').onclick=()=>S.gz?closeGZ():openGZ('home');
}
function allTurns(){ let done=0,total=0; BORDER.forEach(b=>{ if(isOff(b)) return; if(!S.tb[b]) { total+=here().length*Rof(b); return; } const t=target(b); done+=t.done; total+=t.total; }); return {done,total}; }
function paintChrome(){
  const s=cur(), d=sd(s.id), P=parts(s);
  const oa=$('#onair'); if(oa) oa.classList.toggle('on',!!S.onair); const gb=$('#bGram'); if(gb){ gb.classList.toggle('on',!!S.gref); gb.setAttribute('aria-pressed',String(!!S.gref)); }
  $$('#rail [data-sc]').forEach(b=>{ const n=+b.dataset.sc, on=!S.gz&&n===s.sc; b.classList.toggle('cur',on); b.classList.toggle('done',n<s.sc); if(on) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  const gzb=$('#rail [data-gz]'); if(gzb) gzb.classList.toggle('cur',!!S.gz);
  if(ROLE!=='teacher') return;
  const sc=SCENES[s.sc-1], at=allTurns(), T=s.block?tbs(s.block):null;
  $('#info').innerHTML = S.gz ? '<b>Game Zone</b> · the lesson stays where you left it' :
    `<b>Segment ${sc.n}/${SCENES.length}</b> · ${esc(s.title)}${P>1?` (${(d.p||0)+1}/${P})`:''}${s.opt?' · optional':''} · turns ${at.done}/${at.total}${T&&T.cur?` · 🎙 ${esc(sname(T.cur.sid))}`:''} · 👥 ${here().length}`;
  $('#bBack').disabled = !S.gz && S.i===0 && !(d.p>0);
  $('#bBack').innerHTML = S.gz ? '◀ <span class="lbl2">Back to lesson</span>' : '◀ <span class="lbl2">Back</span>';
  $('#bReveal').disabled = S.gz || !(s.reveal || P>1);
  $('#bHide').disabled = S.gz || !s.hide;
  $('#bHint').disabled = S.gz || !s.hint;
  $('#bNext').innerHTML = S.gz ? 'Back to lesson ▶' : S.i===STEPS.length-1 ? 'Finish ✓' : 'Next ▶';
  $('#bLive').classList.toggle('on', LIVE.on);
  $('#bQuick').classList.toggle('on', S.core); $('#bQuick').setAttribute('aria-pressed',String(S.core));
  $('#bWs').classList.toggle('on', $('#notes').classList.contains('on'));
  const c=$('#crewCnt'); if(c) c.textContent=here().length;
  $('#bSnd').textContent=S.sound?'🔊':'🔇'; $('#bSnd').classList.toggle('off',!S.sound); $('#bSnd').title=S.sound?'Sound effects ON — click to mute':'Sound effects OFF — click to turn on';
  const tp=$('#top'); if(tp) document.documentElement.style.setProperty('--toph',tp.offsetHeight+'px');
  CLOCK.paint();
}

     <p class="small mt" style="color:#BFF7DE">🔐 Your messages are signed with a key that never leaves this browser. Student devices obey only this signature — they can’t change scenes, reveal answers or edit attendance.</p></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:center" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn primary" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--gold)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → only a local demo is possible.</p>'}
   ${canSign()?'':'<p class="small mt" style="color:var(--gold)">This page is not on https, so messages can’t be signed. Open it from GitHub Pages for the live room.</p>'}`);
  $('[data-close]','#modalBox').onclick=closeModal;
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); openLive(); };
  $('#lvCopy').onclick=()=>copyText(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 13 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student'); document.body.dataset.sky='day';
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], sent={}, taskKey='', trust=null, lastTs=0, verified=false;
  try{ name=localStorage.getItem('l27name')||''; avatar=localStorage.getItem('l27av')||avatar; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':''); $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','👏','✋','💙'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="row" style="gap:6px">${CAST.map(k=>av(k,46)).join('')}</div>
      <h2 class="dsp mt" style="font-size:28px">Join “Real Talk” 🎙</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Your first name — the same as on the teacher’s list</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Anna" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">First name only — no surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,24), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l27name',name); localStorage.setItem('l27av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const keyOf=m=>{ const T=m.task; if(T&&T.kind==='group') return JSON.stringify([m.sc,m.step,T.groups.map(g=>[g.id,g.name,g.m.map(x=>x.n+x.r)])]); return JSON.stringify([m.sc,m.step,T]); };
  const join=async()=>{
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🤝</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ document.body.dataset.sky=m.sky||'day'; const k=keyOf(m); st=m; if(k!==taskKey){ taskKey=k; render(); } else { paintT(); paintCard(); } }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for the teacher…<br><span class="small">Room ${esc(room)} — are the code and teacher key right? <a href="?join" style="color:var(--teal2)">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">🤝</div><h2 class="dsp mt" style="font-size:28px">SEE YOU NEXT TIME!</h2><p class="small">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  const paintCard=()=>{ if(!st||!st.task||st.task.kind!=='group') return; const g=(st.task.groups||[]).find(x=>x.m.some(p=>me(p.n))); if(!g) return;
    $$('[data-cf]',B).forEach(i=>{ if(document.activeElement!==i) i.value=(g.card||{})[i.dataset.cf]||''; }); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>nameKey(n)===nameKey(name);
  const head2=()=>`<div class="stu-prog">${SCENES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div>
      <div class="small" style="margin-bottom:6px;font-weight:800">Episode ${st.sc} · ${esc(st.title||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait">${av('maya',90)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head2();
    if(!T){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Read, listen and be ready to speak!</p></div>`; return; }
    if(T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T.e||'🤝')}</div><p><b>${esc(T.t)}</b></p></div>`; return; }
    if(T.kind==='turn'){
      const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block)} · turn ${Math.min(T.done+1,T.total)} of ${T.total} <span id="stuT"></span></p>
        <p style="font-size:22px;font-weight:800;margin:6px 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p>
        <p style="font-size:20px;font-weight:700">${emph(T.prompt)}</p>
        ${T.hint?`<p class="small">💡 ${esc(T.hint)}</p>`:''}
        ${T.opts?`<div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.pick===i?'pick':''}" data-tp="${i}" ${mine&&!T.ans?'':'disabled'}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:''}
        ${T.ans?`<div class="stu-card" style="background:rgba(91,227,168,.12);border-color:rgba(91,227,168,.5)"><b>${esc(T.ans)}</b></div>`:`<p class="small">${mine?(T.opts?'Tap your choice — then explain it out loud in Zoom.':'Say your answer out loud in Zoom.'):'Listen — could you help if they get stuck?'}</p>`}</div>`;
      $$('[data-tp]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'ans', task:T.id, v:+b.dataset.tp}); b.classList.add('pick'); });
      paintT(); return; }
    const choiceCard=(id,q,opts,chosen)=>{ const my=sent[id], dec=chosen!=null;
      return `<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt ${dec&&chosen===i?'right':my===i?'pick':''}" data-q="${esc(id)}" data-i="${i}" ${dec?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${dec?`Answer: ${LET[chosen]}. Look at the main screen.`:my!==undefined?'✓ Vote sent! You can change it.':'Tap your choice.'}</p></div>`; };
    const bindChoice=()=>$$('[data-q]',B).forEach(b=>b.onclick=()=>{ sent[b.dataset.q]=+b.dataset.i; Net.send({t:'ans', task:b.dataset.q, v:+b.dataset.i}); render(); });
    if(T.kind==='choice'){ B.innerHTML=hd+choiceCard(T.id,T.q,T.opts,T.chosen)+(T.quiz&&st.my&&st.my[nameKey(name)]!=null?`<p class="small center">⭐ Your points: <b>${st.my[nameKey(name)]}</b></p>`:''); bindChoice(); return; }
    if(T.kind==='awards'){ B.innerHTML=hd+`<p class="small">Vote for IDEAS — one vote in each category.</p>`+T.cats.map(c=>choiceCard(c.id,c.q,c.opts,null)).join(''); bindChoice(); return; }
    if(T.kind==='group'){
      const g=(T.groups||[]).find(x=>x.m.some(p=>me(p.n)));
      if(g){ const r=g.m.find(p=>me(p.n)), c=g.card||{}; B.innerHTML=hd+`<div class="stu-card myturn"><p class="small">Your team <span id="stuT"></span></p><h2 class="dsp" style="font-size:28px">${esc(g.name)}</h2>
          <p style="font-size:20px;font-weight:800;margin-top:10px">You say: ${esc(r.r)}</p><p>${esc(r.d)}</p>
          <p class="small mt">Team: ${g.m.map(p=>esc(p.n)+' ('+esc(p.r)+')').join(', ')}</p></div>
          <div class="stu-card"><b>THE REPAIR PLAN 🛠</b>${T.steps.map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}
          <p class="small">Use at least THREE expressions from today. Optional notes — your team sees them:</p>${CARD_F.map(([k,e,l])=>`<label for="cf${k}">${e} ${l}</label><input id="cf${k}" data-cf="${k}" maxlength="60" value="${esc(c[k]||'')}" placeholder="optional">`).join('')}</div>`;
        $$('[data-cf]',B).forEach(i=>{ let t=null; i.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>Net.send({t:'card', g:g.id, f:i.dataset.cf, v:i.value.slice(0,60)}),400); }; }); }
      else B.innerHTML=hd+`<div class="stu-card"><p><b>Teams</b> <span id="stuT"></span></p>${(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(p=>esc(p.n)).join(', ')}</p>`).join('')}<p class="small">Can’t find your name? Ask your teacher — use the same name as on their list.</p></div>`;
      paintT(); return; }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(S.gref) return toggleGref(false); if(S.sheet.open&&S.gz){ if(S.sheet.pres){ S.sheet.pres=false; } else S.sheet.open=false; save(); paintSheet(); pubState(); return; } if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  if(S.gz && S.sheet.open) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A' && tag!=='SUMMARY')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(!S.gz && s.block && tbs(s.block).cur && (!BLOCKS[s.block].scoped || taskOf(s.block,tbs(s.block).cur.tid).part===s.scope)) markDone(s.block,'ok'); }
  else if(k==='n') openNav(); else if(k==='c') openCrew(); else if(k==='w') toggleNotes(); else if(k==='f') present();
  else if(k==='g') S.gz?closeGZ():openGZ('home');
  else if(k==='q') toggleGref();
});
if(ROLE==='student'){ buildBackdrop(); studentApp(); }
else if(ROLE==='screen'){ buildBackdrop(); buildRail(); screenApp(); }
else {
  buildBackdrop(); applyAnim(); buildRail();
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bHint').onclick=hint;
  $('#bWs').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false); $('#bNav').onclick=openNav; $('#bCrew').onclick=openCrew;
  $$('#notes [data-nt]').forEach(b=>b.onclick=()=>{ S.nt=b.dataset.nt; save(); paintNotes(); });
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#bScreen').onclick=openScreen; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#bQuick').onclick=()=>setQuick(!S.core); $('#clock').onclick=()=>CLOCK.toggle();
  $('#bGram').onclick=()=>toggleGref(); $('#bSnd').onclick=()=>{ S.sound=!S.sound; save(); paintChrome(); if(S.sound) SND.play('ping'); toast(S.sound?'🔊 Sound effects on':'🔇 Sound effects off'); };
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello') pushScreen(); };
  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  if(S.ws && innerWidth>=1280){ $('#notes').classList.add('on'); document.body.classList.add('ws'); $('#notes').setAttribute('aria-hidden','false'); }
  draw();
  if(S.live) startLive(true);
}
