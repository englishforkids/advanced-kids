  if(m.from.name) NAMES[id]=String(m.from.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='ans' && task && m.task===task.id){
    if(task.kind==='choice'){ const v=+m.v; if(!(v>=0 && v<task.opts.length) || task.lock) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('vote',task.id,id,v); clearTimeout(redrawT); redrawT=setTimeout(()=>draw(false,true),200); return; }
    if(task.kind==='text'){ const text=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,140); if(!text) return;
      const chk=CHECKS[task.chk];
      const k=WALLQ.findIndex(w=>w.task===task.id && w.sid===id); const item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student', ok:chk?chk(text):null};
      if(k>=0) WALLQ[k]=item; else WALLQ.unshift(item); SFX.pop(); Store.log('text',task.id,id,text); paintDock(); return; }
  }
  if(m.t==='submit' && task && task.kind==='team'){ const L=String(m.team||''); if(!TEAMS().some(t=>t.L===L) || (S.assign[id] && S.assign[id]!==L)) return; S.sub[L]=true; save(); pubState(); SFX.ok(); toast(teamName(L)+' submitted Timeline C ✓'); if(cur().id==='rooms' && !document.activeElement.closest('input')) draw(false,true); else paintDock(); return; }
  if(m.t==='work' && task && task.kind==='team'){
    const L=String(m.team||''), f=String(m.f||''); if(!TEAMS().some(t=>t.L===L) || !FIELDS.includes(f)) return;
    if(S.assign[id] && S.assign[id]!==L) return;      // students edit only their own team
    S.work[L]=Object.assign({},S.work[L],{[f]:String(m.v||'').slice(0,200), by:NAMES[id]||''}); save(); pubState(); Store.log('work','team-'+L+'-'+f,id,m.v);
    clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(['rooms','showcase'].includes(cur().id) && !document.activeElement.closest('input')) draw(false,true); else paintDock(); },400); return;
  }
}
function paintDock(){
  const d=$('#dock'); d.classList.toggle('on',LIVE.on && ROLE==='teacher'); if(!LIVE.on) return;
  const st=Net.status, stTxt={live:'● live', local:'● this browser only', reconnecting:'● reconnecting…', connecting:'● connecting…', off:'● offline'}[st]||st;
  $('#dockTitle').textContent='Room '+S.room;
  $('#dockLed').className='led '+(st==='live'?'on':st==='off'?'bad':'warn');
  const studs=LIVE.peers.filter(p=>p&&p.role==='student');
  $('#dockCount').textContent=`${studs.length} joined · ${stTxt}`;
  const task=curTask(); let h='';
  h+= studs.length?`<div class="names">${studs.slice(0,40).map(p=>`<span>${esc(p.name||'?')}</span>`).join('')}</div>`:`<div class="small">Nobody yet — share the link or code (📡 Live).</div>`;
  if(!task) h+=`<div class="small">No phone task on this screen — phones show “Look at the main screen”.</div>`;
  else if(task.kind==='choice'){ const n=counts(task.id,task.opts.length), tot=Object.keys(S.lv[task.id]||{}).length, mx=Math.max(1,...n);
    h+=`<div class="small">${tot} answered · ${esc(task.q.slice(0,80))}</div>`+task.opts.map((o,i)=>`<div class="dbar"><span>${task.lock&&task.correct===i?'✅ ':''}${esc(o)}</span><b class="mono" style="color:var(--cyan);text-align:right">${n[i]}</b><div class="tr"><i class="${task.lock&&task.correct===i?'ok':''}" style="width:${n[i]/mx*100}%"></i></div></div>`).join(''); }
  else if(task.kind==='text'){ const list=WALLQ.filter(w=>w.task===task.id); h+= list.length?`<div class="small">${list.length} answers — Show puts one on the screen</div>`+list.map(w=>`<div class="wallit"><p>${w.ok===true?'<span class="okm">✓</span> ':w.ok===false?'<span class="nom">✗</span> ':''}${esc(w.text)}<small>${esc(w.by)}</small></p><button class="btn sm" data-w="${w.id}">Show</button><button class="btn sm ghost" data-wx="${w.id}" aria-label="Hide">✕</button></div>`).join(''):`<div class="small">Waiting for answers…</div>`; }
  else if(task.kind==='team'){ h+=TEAMS().map(t=>{ const w=S.work[t.L]||{}; const n=FIELDS.filter(f=>w[f]).length; return `<div class="small">${t.e} ${esc(teamName(t.L))}: ${n?`<b style="color:var(--ok)">${n}/6 fields</b>`:'…'}${S.sub[t.L]?' · ✅ submitted':''}</div>`; }).join(''); }
  else if(task.kind==='react3') h+=`<div class="small">Phones can send ✅ Clear · 📣 Great reporting · 💡 Great advice.</div>`;
  $('#dockBody').innerHTML=h;
  $$('[data-w]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.w); if(k<0) return; const w=WALLQ.splice(k,1)[0]; (S.wall[w.task]=S.wall[w.task]||[]).push({text:w.text, by:w.by}); save(); draw(false,true); });
  $$('[data-wx]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.wx); if(k>=0) WALLQ.splice(k,1); paintDock(); });
}
$('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
const baseURL = ()=> location.href.split('?')[0].split('#')[0];
const joinURL = ()=> baseURL()+'?room='+S.room+'&role=student';
async function startLive(silent){
  const kind=await Net.connect({room:S.room, id:S.tid, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); if(!$('#modal').classList.contains('hidden') && $('#lvStatus')) $('#lvStatus').innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); if($('#lvStatus')) $('#lvStatus').innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save();
  $('#btnLive').classList.toggle('on',LIVE.on);
  pubState(); draw(false,true);
  if(!silent) toast(kind==='supabase'?'Live room open — share the link, QR or code':kind==='local'?'Supabase is not reachable — room works in THIS browser only':'Live room could not start');
  return kind;
}
function liveStatus(){
  if(!LIVE.on) return 'not started';
  const n=LIVE.peers.filter(p=>p&&p.role==='student').length;
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● live (Supabase)</span>' : Net.status==='local' ? '<span style="color:var(--amber)">● this browser only — Supabase is not configured or not reachable</span>' : `<span style="color:var(--amber)">● ${esc(Net.status)}</span>`;
  return `${s} · ${n} joined`;
}
function openLive(){
  openModal(`<div class="row"><h2 class="dsp grow" style="font-size:36px">📡 Live Student Mode</h2><button class="btn sm ghost" onclick="closeModal()" aria-label="Close">✕</button></div>
   <p class="small">Optional. Students join from a phone with a nickname — no account. They vote, answer the vocabulary, listening and grammar questions, send short answers and write their team’s Timeline C. Correct answers reach phones only after you reveal them on the main screen. The lesson works fully without it.</p>
   <div class="two mt" style="align-items:center"><div><div class="small">Room code</div><div class="dsp" style="font-size:80px">${S.room}</div>
     <div class="small" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" style="margin-top:8px">Or open <b>${esc(baseURL())}?join</b> and type the code.</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:end" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?`<button class="btn" id="lvStop">⏹ Stop room</button>`:`<button class="btn primary" id="lvStart">▶ Start live room</button>`}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--amber)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → phones on other devices cannot connect.</p>'}`);
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ Net.send({t:'end'}); Net.stop(); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); $('#btnLive').classList.remove('on'); draw(false,true); openLive(); };
  $('#lvCopy').onclick=()=>copy(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 10 · student app (?room=1234&role=student  or  ?join) ----------
   Телефон учня нічого не керує на головному екрані: він лише голосує, відповідає й пише текст команди.
   Повідомлення «від учителя» приймаються тільки від того вчителя, від якого телефон уперше отримав стан кімнати. */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6);
  let st=null, name='', sent={}, myTeam='', taskKey='', teacherId=null;
  try{ name=localStorage.getItem('l19name')||''; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':'warn');
    $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','🔥','✋','⏳'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="card stu-card"><div class="row" style="gap:10px">${av('leo',50)}${av('mia',50)}${av('app',50)}</div>
      <h2 class="dsp mt" style="font-size:32px">Join the Timeline Editors ✂️</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      <label for="nm">Your nickname</label><input id="nm" maxlength="20" value="${esc(name)}" placeholder="e.g. Time Fox 🦊" autocomplete="off">
      <p class="small mt" style="margin-top:8px">Use a nickname or first name only. No surname, no personal data.</p>
      <button class="btn sun mt" id="jn" style="width:100%">Join →</button></div>`;
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,20); if(r.length<4) return $('#rc').focus(); if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l19name',name); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  const join=async()=>{
    $('#stuRoom').textContent='room '+room;
    try{ myTeam=localStorage.getItem('l19team-'+room)||''; }catch(e){}
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🌀</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, onStatus:setConn, onEvent:m=>{
      if(!m.from || m.from.role!=='teacher') return;
      if(teacherId && m.from.id!==teacherId) return;          // ignore anyone pretending to be the teacher
      if(m.t==='state'){ teacherId=m.from.id; const k=JSON.stringify([m.sc, m.mission, (m.assign||{})[Net.me&&Net.me.id], m.task && Object.assign({},m.task,{work:undefined, sub:undefined, assign:undefined, teams:(m.task.teams||[]).map(t=>t.L)})]); const changed=k!==taskKey; st=m; if(changed){ taskKey=k; render(); } else { paintT(); syncTeam(); } }
      if(m.t==='end' && teacherId) ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for your teacher…<br><span class="small">Room ${esc(room)} — is the code right? <a href="?join" style="color:var(--cyan)">Change</a></span>`; },6000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">✅⏳</div><h2 class="dsp" style="font-size:32px">Timeline saved!</h2><p class="small">Thanks, ${esc(name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer){ t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); } };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const syncTeam=()=>{ if(!st||!st.task||st.task.kind!=='team'||!myTeam) return; const w=(st.task.work||{})[myTeam]||{};
    $$('[data-tf]',B).forEach(ta=>{ if(document.activeElement!==ta && typeof w[ta.dataset.tf]==='string' && ta.value!==w[ta.dataset.tf]) ta.value=w[ta.dataset.tf]; }); };
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait"><div class="bigi">👀</div><p>Hi ${esc(name)}! Waiting for your teacher…</p></div>`; return; }
    const T=st.task, head=`<div class="stu-prog">${STAGES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div><div class="small mono" style="letter-spacing:.12em;margin-bottom:10px">${st.e||''} SCENE ${st.sc} OF ${STAGES.length} · ${esc(st.title||'')}</div>`;
    if(!T){ B.innerHTML=head+`<div class="stu-wait card stu-card" style="padding-top:26px"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p>
      ${st.mission?`<p class="mis" style="display:block;text-align:left;font-size:17px"><span class="kick">CURRENT MISSION</span><br>${esc(st.mission)}</p>`:''}<p class="small">Your teacher will send a task soon. You can tap an emoji below.</p></div>`; return; }
    if(T.kind==='choice'){
      const my=sent[T.id];
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.lock&&T.correct===i?'right':my===i?(T.lock&&T.correct!=null?'wrongpick':'pick'):''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T.lock?(T.correct===null||T.correct===undefined?'✓ Voting closed.':my===T.correct?'🎉 Correct! The answer is on the main screen.':'✓ The answer is on the main screen.'):my!==undefined?'✓ Sent! You can change it.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T.kind==='text'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><input id="tx" maxlength="140" placeholder="${esc(T.ph||'')}" autocomplete="off"><button class="btn primary mt" id="sd" style="width:100%">Send ➤</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. You can send a new version.':T.chk?'Your teacher checks the answers.':'Your teacher can show your answer on the screen.'}</p></div>`;
      const go=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      $('#sd').onclick=go; $('#tx').onkeydown=e=>{ if(e.key==='Enter') go(); };
      return;
    }
    if(T.kind==='team'){
      const forced=(st.assign||{})[Net.me&&Net.me.id];
      if(forced && forced!==myTeam){ myTeam=forced; try{ localStorage.setItem('l19team-'+room,myTeam); }catch(e){} }
      const t=(T.teams||[]).find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">🧩 Which team are you in?</p><p class="small">Your teacher tells you your team.</p><div class="opts">${T.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>${esc(x.name||('Team '+x.n))}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l19team-'+room,myTeam); }catch(e){} render(); }); return; }
      const w=(T.work||{})[myTeam]||{}, sub=(T.sub||{})[myTeam];
      B.innerHTML=head+`<div class="card stu-card"><div class="row"><span style="font-size:32px">${t.e}</span><div class="grow"><b style="font-size:19px">${esc(t.name||('Team '+t.n))}</b><div class="small mono" id="stuT"></div></div>${forced?'<span class="tag">assigned</span>':'<button class="btn sm ghost" id="chg">change</button>'}</div>
        <p class="small mt"><b>MISSION 07 — CREATE TIMELINE C.</b> Three parts of the day + two Reported Speech sentences. Use at least two expressions from today’s lesson. Your team sees the same text.</p>
        ${FORM.map(f=>`<label for="tf-${f[0]}">${f[3]} ${f[1]}</label><textarea id="tf-${f[0]}" data-tf="${f[0]}" maxlength="${f[0]==='name'?60:200}" placeholder="${esc(f[2])}" ${f[0]==='name'?'style="min-height:46px"':''}>${esc(w[f[0]]||'')}</textarea>`).join('')}
        <div class="chk7 small mt" id="schk">${teamChecks(w,'').map(c=>`<div>${c.ok?'✅':'⬜'} ${c.t}</div>`).slice(0,3).join('')}</div>
        <div class="row mt"><button class="btn sm ghost" id="svd">💾 Save draft</button><button class="btn green" id="sbm" style="flex:1">${sub?'✓ Submitted — you can still edit':'📤 Submit project'}</button></div>
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      const chg=$('#chg'); if(chg) chg.onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l19team-'+room); }catch(e){} render(); };
      const sendAll=()=>$$('[data-tf]',B).forEach(ta=>Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,200)}));
      $('#svd').onclick=()=>{ sendAll(); $('#ok').textContent='✓ Draft saved — your teacher can see it.'; };
      $('#sbm').onclick=()=>{ sendAll(); setTimeout(()=>Net.send({t:'submit', team:myTeam}),300); $('#sbm').textContent='✓ Submitted — you can still edit'; };
      $$('[data-tf]',B).forEach(ta=>{ let tm=null; ta.oninput=()=>{ $('#ok').textContent='…'; const cur={}; $$('[data-tf]',B).forEach(x=>cur[x.dataset.tf]=x.value); $('#schk').innerHTML=teamChecks(cur,'').map(c=>`<div>${c.ok?'✅':'⬜'} ${c.t}</div>`).slice(0,3).join('');
        clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,200)}); $('#ok').textContent='✓ Saved — your teacher can see it.'; },700); }; });
      return;
    }
    if(T.kind==='react3'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:22px;font-weight:800">🎤 ${esc(T.q)}</p><p class="small">How was it? Tap to react.</p>
        <div class="opts">${[['✅','Clear'],['📣','Great reporting'],['💡','Great advice']].map(([e,l])=>`<button class="opt" data-r="${e}"><span class="L">${e}</span><span>${l}</span></button>`).join('')}</div></div>`;
      $$('[data-r]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.r}); b.animate?.([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:250}); });
      return;
    }
  };
  (room && name) ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnRoute').onclick=toggleRoute; $('#btnLive').onclick=openLive; $('#btnTl').onclick=showTl; $('#btnPres').onclick=presentMode;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='l'||k==='L') showTl();
    else if(k==='p'||k==='P') presentMode();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A'||k==='r'||k==='R') doReveal();
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  Object.values(CHARS).forEach(c=>{ if(c.photo){ const im=new Image(); im.src=c.photo; } });
  Object.values(SCENE_IMG).forEach(src=>{ const im=new Image(); im.src=src; });
  draw(true);
  if(S.live) startLive(true);   // teacher refreshed the page → reopen the same room; phones stay connected
}
