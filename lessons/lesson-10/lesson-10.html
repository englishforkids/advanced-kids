.posterArt .lbl{position:absolute; top:16px; left:30px; right:30px; display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:rgba(255,255,255,.6)}
.posterArt .lbl b{color:var(--red)}
.sprockets{position:absolute; top:0; bottom:0; width:16px; background:repeating-linear-gradient(180deg,transparent 0 10px,rgba(255,255,255,.14) 10px 20px); opacity:.6}
.teambar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:18px; padding:12px 14px; border-radius:16px; border:1px dashed var(--line2); background:rgba(255,255,255,.02)}

/* ═════════════ BOOT / ARCHIVE OS ═════════════ */
.os{border-radius:22px; border:1px solid var(--line2); background:linear-gradient(180deg,rgba(9,13,30,.94),rgba(6,8,18,.96)); overflow:hidden; box-shadow:var(--shadow); position:relative}
.os .bar{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted)}
.os .bar i{width:11px; height:11px; border-radius:50%; background:#2A2F4A} .os .bar i:nth-child(1){background:#FF5F7E} .os .bar i:nth-child(2){background:#FFC66E} .os .bar i:nth-child(3){background:#3EE6A2}
.os .bar span{margin-left:10px}
.os::after{content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.term{font-family:var(--mono); font-size:16px; line-height:1.7; padding:14px 20px; color:#BFD3FF; min-height:150px}
.term .ok{color:var(--green)} .term .warn{color:var(--gold)} .term .dim{color:var(--faint)}
.fgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px 14px; padding:18px 20px 18px}
.folder{position:relative; aspect-ratio:2.6; border-radius:6px 14px 14px 14px; padding:12px 14px; display:flex; flex-direction:column; justify-content:flex-end;
  background:linear-gradient(180deg,#1C2550,#11173A); border:1px solid rgba(120,150,255,.25)}
.folder::before{content:""; position:absolute; left:-1px; top:-10px; width:44%; height:11px; border-radius:7px 10px 0 0; background:#1C2550; border:1px solid rgba(120,150,255,.25); border-bottom:0}
.folder b{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--muted)}
.folder span{font-weight:800; font-size:16px}
.folder .pad{position:absolute; top:12px; right:12px; font-size:24px; filter:drop-shadow(0 0 8px rgba(255,198,110,.4))}
.folder.open{background:linear-gradient(180deg,#14423A,#0B2A25); border-color:rgba(62,230,162,.4)}
.folder.open::before{background:#14423A; border-color:rgba(62,230,162,.4)}
.fin .folder{opacity:0; animation:popIn .5s cubic-bezier(.2,.9,.25,1.15) forwards}
.notif{position:absolute; right:22px; top:58px; width:min(420px,80%); border-radius:18px; padding:14px 16px; background:linear-gradient(135deg,rgba(61,123,255,.95),rgba(106,75,255,.95)); box-shadow:0 30px 60px -20px rgba(61,123,255,.8); display:flex; gap:12px; align-items:center; z-index:2;
  animation:notif .7s cubic-bezier(.2,.9,.25,1.2) both; text-align:left}
.notif small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.2em; opacity:.85}
.notif b{font-size:19px}
@keyframes notif{from{opacity:0; transform:translateY(-24px) scale(.95)}to{opacity:1; transform:none}}
.ring-dot{width:12px; height:12px; border-radius:50%; background:var(--red); box-shadow:0 0 0 0 rgba(255,96,126,.6); animation:ringdot 1.4s infinite}
@keyframes ringdot{70%{box-shadow:0 0 0 12px rgba(255,96,126,0)}}

/* transmission */
.tx{border-radius:24px; border:1px solid rgba(98,228,255,.35); background:linear-gradient(180deg,rgba(10,22,48,.95),rgba(8,10,24,.95)); box-shadow:0 0 0 1px rgba(98,228,255,.08),0 40px 90px -40px rgba(98,228,255,.45); overflow:hidden}
.tx .hd{display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--line); background:rgba(98,228,255,.06)}
.tx .hd .t{font-family:var(--mono); font-size:13px; letter-spacing:.24em; color:var(--cyan)}
.tx .hd .f{font-family:var(--dsp); font-size:30px; text-transform:uppercase; letter-spacing:.04em}
.tx .bd{padding:16px 24px; font-size:23px; line-height:1.45; font-weight:600}
.tx .bd p{margin:0 0 .45em}
.tx .sig{font-family:var(--serif); font-style:italic; color:var(--j); font-size:28px}
.mission{border-radius:20px; padding:18px 22px; border:1px solid rgba(255,198,110,.45); background:linear-gradient(135deg,rgba(255,198,110,.12),rgba(255,198,110,.02)); position:relative}
.mission .k{font-family:var(--mono); font-size:13px; letter-spacing:.24em; color:var(--gold)}
.mission .m{font-family:var(--dsp); font-weight:900; text-transform:uppercase; font-size:34px; line-height:.95; margin-top:6px; letter-spacing:.02em}
.wave{display:flex; gap:3px; align-items:center; height:26px}
.wave i{width:4px; border-radius:2px; background:var(--cyan); animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:-.3s} .wave i:nth-child(3n){animation-delay:-.6s}
@keyframes wave{0%,100%{height:6px}50%{height:24px}}

/* scan / identity check */
.gatebox{display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center}
.scanner{width:200px; height:200px; border-radius:28px; position:relative; border:1px solid rgba(98,228,255,.35); background:radial-gradient(circle,rgba(98,228,255,.14),transparent 70%); display:grid; place-items:center; font-size:84px; overflow:hidden}
.scanner::after{content:""; position:absolute; left:0; right:0; height:3px; background:var(--cyan); box-shadow:0 0 18px var(--cyan); animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{top:8%}50%{top:90%}}

/* ═════════════ QUIZ ═════════════ */
.flow{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px}
.flow span{font-family:var(--mono); font-size:11px; letter-spacing:.14em; padding:4px 9px; border-radius:6px; background:rgba(255,255,255,.04); color:var(--faint); border:1px solid transparent}
.flow span.on{color:var(--cyan); border-color:rgba(98,228,255,.45); background:rgba(98,228,255,.09)}
.flow span.done{color:var(--green)}
.deckbar{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.cdots{display:flex; gap:6px}
.cdots{align-items:center} .cdots button{width:38px; height:38px; padding:0; border-radius:10px; border:1px solid var(--line2); font-weight:800; font-size:15px; background:rgba(255,255,255,.03)}
.cdots button.cur{border-color:var(--cyan); color:var(--cyan); background:rgba(98,228,255,.1)}
.cdots button.done{background:rgba(62,230,162,.15); border-color:rgba(62,230,162,.5); color:var(--green)}
.cdots button.xo{border-style:dashed}
.qz{display:grid; grid-template-columns:.92fr 1.08fr; gap:28px; align-items:start}
.qz>*{min-width:0}
.qq{font-size:28px; font-weight:800; line-height:1.25; margin:0 0 14px}
.qq .gap{display:inline-block; min-width:150px; border-bottom:3px dashed var(--cyan); text-align:center; color:var(--cyan); padding:0 6px}
.qq .gap.fill{border-bottom-style:solid; color:var(--green)}
.opts{display:grid; gap:10px}
.opt{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; text-align:left; padding:11px 16px; border-radius:16px; min-height:58px;
  background:rgba(255,255,255,.045); border:1.5px solid var(--line2); font-size:22px; font-weight:700; transition:.15s}
.opt:hover{background:rgba(98,228,255,.08); border-color:rgba(98,228,255,.45)}
.opt .L{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-family:var(--mono); font-size:16px; background:rgba(255,255,255,.08)}
.opt .n{font-family:var(--mono); font-size:15px; color:var(--cyan)}
.opt.right{background:linear-gradient(90deg,rgba(62,230,162,.22),rgba(62,230,162,.06)); border-color:var(--green); color:#E8FFF5}
.opt.right .L{background:var(--green); color:#04291A}
.opt.right.fx{animation:stamp .45s cubic-bezier(.2,.9,.25,1.3)}
.opt.tried{opacity:.55; border-color:rgba(255,96,126,.5); text-decoration:line-through; text-decoration-color:rgba(255,96,126,.7)}
.opt.dim{opacity:.4}
.opt[aria-disabled=true]{cursor:default}
.fb{margin-top:14px; border-radius:16px; padding:14px 18px}
.fb.no{background:rgba(255,96,126,.1); border:1px solid rgba(255,96,126,.4); font-weight:700}
.fb.ok{background:rgba(62,230,162,.09); border:1px solid rgba(62,230,162,.45)}
.fb .k{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--green); margin-bottom:6px}
.fb .say{font-size:22px; font-weight:800}
.why{margin-top:12px; border-radius:16px; padding:14px 18px; background:rgba(98,228,255,.07); border:1px solid rgba(98,228,255,.35)}
.why .k{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--cyan); margin-bottom:6px}
.why .full{font-size:22px; font-weight:800; margin-bottom:6px}
.why .full b{color:var(--green)}
.ccq{margin-top:12px; border-radius:16px; padding:14px 18px; background:rgba(255,198,110,.07); border:1px solid rgba(255,198,110,.35)}
.ccq .k{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--gold); margin-bottom:6px}
.ccq .q{font-size:22px; font-weight:800}
.ccq .a{margin-top:8px; font-size:20px; color:#FFE3B5; font-weight:700}
.ctrls{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.ctrls .btn{min-height:46px; font-size:16px}
.qhelp{font-size:16px; color:var(--muted); margin-top:12px}
.clue{border-radius:20px; padding:22px; background:linear-gradient(180deg,rgba(23,28,56,.92),rgba(12,15,32,.92)); border:1px solid var(--line2); position:relative; overflow:hidden}
.clue .k{font-family:var(--mono); font-size:12px; letter-spacing:.22em; color:var(--gold)}
.clue .msgtxt{font-family:var(--serif); font-size:29px; line-height:1.3; margin-top:12px; font-weight:500}
.clue .msgtxt::before{content:"“"; color:var(--gold)} .clue .msgtxt::after{content:"”"; color:var(--gold)}
.clue .ico{position:absolute; right:-10px; bottom:-24px; font-size:130px; opacity:.09}

/* quick check (CCQ group) */
.qc{margin-top:18px; border-radius:18px; border:1px solid rgba(255,198,110,.3); background:rgba(255,198,110,.04)}
.qc>summary{list-style:none; cursor:pointer; padding:12px 16px; display:flex; gap:10px; align-items:center; font-weight:800; font-size:17px; color:#FFE3B5}
.qc>summary::-webkit-details-marker{display:none}
.qc>summary .c{font-family:var(--mono); font-size:11px; letter-spacing:.18em; background:var(--gold); color:#2A1700; padding:3px 8px; border-radius:999px}
.qc>summary::after{content:"▾"; margin-left:auto; transition:.2s}
.qc[open]>summary::after{transform:rotate(180deg)}
.qc .it{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:10px 16px; border-top:1px solid rgba(255,198,110,.15)}
.qc .it .q{font-size:20px; font-weight:700}
.qc .it .a{grid-column:1/-1; color:#FFE3B5; font-weight:800; font-size:19px}

/* speaking card */
.spq{border-radius:22px; padding:22px 24px; border:1px solid rgba(179,109,255,.4); background:linear-gradient(180deg,rgba(179,109,255,.12),rgba(15,19,40,.85))}
.spq .q{font-size:29px; font-weight:800; line-height:1.28; margin-top:8px}
.sample{margin-top:14px; border-radius:16px; padding:14px 18px; background:rgba(62,230,162,.08); border:1px solid rgba(62,230,162,.4); font-size:20px; font-weight:600}
.sample small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--green); margin-bottom:4px}
.fuq{margin-top:12px; font-size:20px; font-weight:700; color:#E3D1FF; padding:10px 14px; border-left:3px solid var(--violet); background:rgba(179,109,255,.06); border-radius:0 12px 12px 0}
.prompts{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.prompts span{padding:6px 12px; border-radius:999px; font-size:15px; font-weight:700; background:rgba(255,255,255,.05); border:1px solid var(--line2)}

/* ═════════════ FILE 03 · DIARY ═════════════ */
.diarywrap{display:grid; grid-template-columns:1.12fr .88fr; gap:28px; align-items:start}
.diarywrap>*{min-width:0}
.diary{position:relative; border-radius:6px 6px 22px 22px; padding:22px 32px 18px; color:#1E1A26;
  background:linear-gradient(180deg,#F7EEDF,#EFE3CF); box-shadow:0 40px 80px -36px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.2); font-family:var(--serif); transform:rotate(-.4deg)}
.diary::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(60,80,140,.12) 35px 36px); background-position:0 18px}
.diary .tape{position:absolute; top:-14px; left:50%; width:130px; height:30px; transform:translateX(-50%) rotate(-3deg); background:rgba(255,230,160,.6); box-shadow:0 2px 6px rgba(0,0,0,.2)}
.diary .dh{display:flex; justify-content:space-between; align-items:baseline; font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:#7A6A55; margin-bottom:10px}
.diary h3{font-family:var(--dsp); font-weight:900; text-transform:uppercase; letter-spacing:.02em; font-size:38px; color:#20183A; margin-bottom:8px}
.diary p{font-size:24px; line-height:1.5; margin:0 0 .45em; position:relative}
.diary p b{background:linear-gradient(transparent 60%,rgba(255,198,110,.6) 60%); font-weight:700}
.diary .by{font-style:italic; font-size:25px; color:#3B4DA6; text-align:right; margin-top:4px}
.dpages{display:flex; gap:8px; margin-bottom:12px}
.dpages button{flex:1; padding:6px 12px; border-radius:12px; border:1px solid var(--line2); text-align:left; font-size:14px; font-weight:800; background:rgba(255,255,255,.03)}
.dpages button small{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.18em; color:var(--faint)}
.dpages button.cur{border-color:var(--gold); background:rgba(255,198,110,.1)}
.dpages button.cur small{color:var(--gold)}
.dpages button.done small{color:var(--green)}
.dpages button.lock{opacity:.45}
.rq{border-radius:22px; padding:20px 22px; border:1px solid rgba(98,228,255,.35); background:var(--panel)}
.rq .q{font-size:27px; font-weight:800; line-height:1.28; margin:6px 0 12px}
.rq .exp{margin-top:12px; border-radius:14px; padding:12px 16px; background:rgba(62,230,162,.08); border:1px solid rgba(62,230,162,.4); font-size:21px; font-weight:700}
.rq .exp small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--green); margin-bottom:4px}
.clues{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.cluecard{border-radius:18px; padding:18px; position:relative; overflow:hidden; border:1px solid rgba(255,198,110,.45);
  background:linear-gradient(160deg,rgba(255,198,110,.16),rgba(255,198,110,.03) 60%); box-shadow:0 0 30px -10px rgba(255,198,110,.4)}
.cluecard .k{font-family:var(--mono); font-size:12px; letter-spacing:.22em; color:var(--gold)}
.cluecard b{display:block; font-size:24px; line-height:1.25; margin-top:8px}
.cluecard .e{position:absolute; right:12px; top:10px; font-size:30px}
.mismatch{margin-top:20px; display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center; padding:18px 22px; border-radius:20px; border:1px solid rgba(255,96,126,.45); background:linear-gradient(90deg,rgba(255,96,126,.12),rgba(255,96,126,.02))}
.mismatch .big{font-size:30px}
.glitchT{position:relative; font-family:var(--dsp); font-weight:900; text-transform:uppercase; font-size:40px; letter-spacing:.02em}
.glitchT::before,.glitchT::after{content:attr(data-t); position:absolute; left:0; top:0; opacity:.6}
.glitchT::before{color:var(--red); transform:translate(2px,0); animation:gl1 2.4s infinite steps(2)}
.glitchT::after{color:var(--cyan); transform:translate(-2px,0); animation:gl2 3.1s infinite steps(2)}
@keyframes gl1{0%,90%{clip-path:inset(0 0 100% 0)}92%{clip-path:inset(20% 0 50% 0)}96%{clip-path:inset(60% 0 10% 0)}}
@keyframes gl2{0%,88%{clip-path:inset(0 0 100% 0)}90%{clip-path:inset(40% 0 30% 0)}95%{clip-path:inset(10% 0 70% 0)}}

/* silhouettes (classmates / anonymous friends) */
.sil{position:relative; display:inline-flex; flex-direction:column; align-items:center; gap:6px}
.sil svg{width:86px; height:auto}
.sil .lb{font-family:var(--mono); font-size:11px; letter-spacing:.14em; padding:3px 8px; border-radius:6px; background:rgba(255,96,126,.15); border:1px solid rgba(255,96,126,.4); color:#FFC2CF; transform:rotate(-4deg)}
.sil .lb.q{background:rgba(255,255,255,.06); border-color:var(--line2); color:var(--muted)}
.sil.anon svg{filter:blur(1.5px)}
.sil.anon .lb{background:rgba(98,228,255,.1); border-color:rgba(98,228,255,.4); color:var(--cyan); transform:none}

/* ═════════════ FILE 04 · TIMELINE ═════════════ */
.tl{position:relative; border-radius:22px; padding:14px 18px 14px; border:1px solid var(--line2); background:linear-gradient(180deg,rgba(14,18,40,.92),rgba(8,10,22,.94)); overflow:hidden}
.tl .axis{position:absolute; left:40px; right:40px; top:58px; height:4px; border-radius:4px; background:linear-gradient(90deg,rgba(98,228,255,.15),rgba(98,228,255,.5),rgba(179,109,255,.6))}
.tl .now{position:absolute; right:18px; top:12px; font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--violet)}
.tl .ev{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; position:relative}
.tev{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px}
.tev .yr{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--faint); height:16px}
.tev .dot{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:18px; background:#1A2048; border:2px solid rgba(98,228,255,.3); position:relative; z-index:1; margin-top:2px}
.tev .tx2{font-size:16px; font-weight:800; line-height:1.22; padding:7px 9px; border-radius:12px; background:rgba(255,255,255,.04); border:1px dashed var(--line2); min-height:52px; display:grid; place-items:center; width:100%}
.tev.scr .tx2{filter:blur(4px); opacity:.55}
.tev.scr .dot{border-style:dashed; opacity:.6}
.tev.fixed .dot{border-color:var(--green); background:rgba(62,230,162,.2); box-shadow:0 0 18px rgba(62,230,162,.5)}
.tev.fixed .tx2{border-style:solid; border-color:rgba(62,230,162,.45); background:rgba(62,230,162,.07)}
.tev.fixed.fx .tx2{animation:stamp .5s cubic-bezier(.2,.9,.25,1.3)}
.tev.hot .tx2{border-color:var(--cyan); background:rgba(98,228,255,.1); filter:none; opacity:1}
.tev.hot .dot{border-color:var(--cyan); opacity:1}
.gh{margin-top:10px; border-radius:16px; border:1px solid var(--line2); background:rgba(255,255,255,.025)}
.gh>summary{list-style:none; cursor:pointer; padding:9px 16px; font-weight:800; font-size:17px; color:var(--cyan); display:flex; gap:10px}
.gh>summary::-webkit-details-marker{display:none}
.gh>summary::after{content:"▾"; margin-left:auto}
.gh[open]>summary::after{content:"▴"}
.gh .gg{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:0 14px 14px}
.gh .gg>div{border-radius:14px; padding:12px 14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.gh .gg h4{font-size:17px; color:var(--gold); margin-bottom:6px}
.gh .gg p{font-size:16px; margin:0 0 6px}
.gh .gg .f{font-family:var(--mono); font-size:14px; color:var(--cyan)}
.gh .ml{padding:0 16px 14px; display:grid; gap:6px}
.gh .ml p{margin:0; font-size:17px}
.gh .ml b{color:var(--gold)}

/* ═════════════ FILE 05 · DRAFT ═════════════ */
.draft{border-radius:22px; overflow:hidden; border:1px solid var(--line2); background:#0C1024; box-shadow:var(--shadow)}
.draft .hd{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.03)}
.draft .hd .to{font-size:15px; color:var(--muted)}
.unsent{font-family:var(--mono); font-size:12px; letter-spacing:.2em; padding:4px 10px; border-radius:6px; background:rgba(255,96,126,.15); border:1px solid rgba(255,96,126,.5); color:#FFB3C2}
.draft .bd{padding:18px 22px}
.dl{font-size:24px; line-height:1.45; font-weight:600; padding:8px 12px; margin:4px 0; border-radius:12px; border:1px solid transparent; transition:.3s}
.dl.em{border-color:rgba(255,198,110,.5); background:rgba(255,198,110,.08); color:#FFE9C4; font-weight:800}
.dl.em.fx{animation:stamp .55s cubic-bezier(.2,.9,.25,1.3)}
.dl .old{display:block; font-size:16px; color:var(--faint); text-decoration:line-through; font-weight:500}

.arrowdown{font-size:30px; color:var(--gold); text-align:center; line-height:1}

/* ═════════════ FILE 06 · EVIDENCE BOARD ═════════════ */
.board{position:relative; border-radius:22px; padding:22px; overflow:hidden; border:1px solid rgba(255,190,120,.25);
  background:radial-gradient(120% 90% at 50% 0%,rgba(255,190,120,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 6px,transparent 6px 12px),linear-gradient(180deg,#1B1520,#100C16)}
.evid{position:relative; background:#F3ECDD; color:#221C2A; border-radius:6px; padding:20px 20px 18px; box-shadow:0 20px 40px -20px rgba(0,0,0,.9); transform:rotate(-1.2deg)}

.string{position:absolute; inset:0; pointer-events:none}

/* ═════════════ FILE 07 · SPEAKERS ═════════════ */
.jmsg{display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center}
.jmsg .jfig{width:190px}
.qdeck{display:grid; grid-template-columns:repeat(5,1fr); gap:12px}
.qcard{position:relative; border-radius:18px; padding:14px 14px 16px; min-height:150px; text-align:left; border:1.5px solid var(--line2); background:linear-gradient(180deg,rgba(23,28,56,.92),rgba(12,15,32,.92)); transition:.25s; display:flex; flex-direction:column; gap:8px}
.qcard .n{font-family:var(--dsp); font-size:40px; font-weight:900; color:var(--violet); line-height:.9}

.qcard.used::after{content:"✓ SPOKEN"; position:absolute; top:12px; right:12px; font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--green)}
.qcard.cur{border-color:var(--violet); box-shadow:0 0 0 1px rgba(179,109,255,.4),0 20px 40px -20px rgba(179,109,255,.8); transform:translateY(-4px)}

/* encrypted folder */
.encwrap{min-height:calc(100vh - 240px); display:grid; place-items:center; text-align:center}
.encf{position:relative; width:290px; height:210px; margin:0 auto}
.encf .back{position:absolute; inset:0; border-radius:10px 22px 22px 22px; background:linear-gradient(180deg,#2B1650,#150A2B); border:1px solid rgba(179,109,255,.5); box-shadow:0 0 80px -10px rgba(179,109,255,.6)}

/* ═════════════ FILE 08 · FINAL CUT ═════════════ */
.recap{border-radius:22px; border:1px solid var(--line2); background:var(--panel); padding:14px 18px}
.recap .hd{font-family:var(--dsp); font-weight:900; text-transform:uppercase; letter-spacing:.04em; font-size:26px; color:var(--cyan)}
.recap .hd small{font-family:var(--mono); font-size:11px; letter-spacing:.2em; color:var(--muted); display:block}
.rsteps{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; position:relative}

.rs{border-radius:16px; padding:12px 14px; background:rgba(255,255,255,.035); border:1px solid var(--line); position:relative}

.rs .n i{font-style:normal; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--gold); color:#2A1700; font-size:12px}
.rs p{margin:6px 0 0; font-size:16.5px; line-height:1.4; font-weight:600}
.frame{position:relative; border-radius:10px; padding:26px 54px; margin-top:16px; background:#0A0A0F; border:1px solid rgba(255,255,255,.18); box-shadow:0 30px 70px -30px rgba(0,0,0,1)}
.frame::before,.frame::after{content:""; position:absolute; top:0; bottom:0; width:30px; background:repeating-linear-gradient(180deg,transparent 0 8px,rgba(255,255,255,.75) 8px 20px,transparent 20px 28px); background-size:12px 28px; background-repeat:repeat-y; background-position:center; opacity:.55}
.frame::before{left:8px} .frame::after{right:8px}
.frame .k{font-family:var(--mono); font-size:12px; letter-spacing:.24em; color:var(--red); display:flex; gap:10px; align-items:center}
.frame .k .ring-dot{width:10px; height:10px}
.frame .s{font-family:var(--serif); font-style:italic; font-size:31px; line-height:1.4; margin-top:10px; color:#F3EEE6}
.frame .s .cur{display:inline-block; width:3px; height:1em; background:var(--gold); vertical-align:-.15em; animation:blink 1s steps(2) infinite}
.frame .next{font-family:var(--dsp); font-weight:900; text-transform:uppercase; font-size:34px; letter-spacing:.03em; margin-top:14px; color:var(--gold)}
.tmis{display:grid; gap:8px; counter-reset:t; margin:12px 0 0; padding:0; list-style:none}
.tmis li{counter-increment:t; display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; font-size:20px; font-weight:700; padding:9px 12px; border-radius:12px; background:rgba(255,255,255,.035); border:1px solid var(--line)}
.tmis li::before{content:counter(t); width:32px; height:32px; border-radius:10px; display:grid; place-items:center; font-family:var(--mono); font-size:15px; background:rgba(98,228,255,.15); color:var(--cyan)}
.nowrite{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:14px; padding:12px 16px; border-radius:16px; font-family:var(--dsp); font-weight:900; font-size:32px; letter-spacing:.04em; text-transform:uppercase;
  background:linear-gradient(90deg,rgba(255,96,126,.18),rgba(255,198,110,.18)); border:1px solid rgba(255,198,110,.5); color:#FFE3B5}
.help{margin-top:14px; border-radius:16px; border:1px solid rgba(98,228,255,.3); background:rgba(98,228,255,.04)}
.help>summary{list-style:none; cursor:pointer; padding:12px 16px; font-weight:800; font-size:17px; color:var(--cyan); display:flex; gap:10px}
.help>summary::-webkit-details-marker{display:none}
.help>summary::after{content:"▾"; margin-left:auto}
.help[open]>summary::after{content:"▴"}
.phr{display:flex; gap:8px; flex-wrap:wrap; padding:0 14px 14px}
.phr span{padding:7px 12px; border-radius:12px; font-size:17px; font-weight:700; background:rgba(255,255,255,.05); border:1px solid var(--line2)}
.exend{border-radius:18px; padding:16px 18px; margin-top:14px; border:1px solid rgba(62,230,162,.4); background:rgba(62,230,162,.06)}
.exend h4{font-family:var(--dsp); font-size:28px; text-transform:uppercase; letter-spacing:.03em; color:var(--green)}
.exend p{margin:8px 0 0; font-size:19px}
.exend p b{color:var(--muted); font-family:var(--mono); font-size:12px; letter-spacing:.14em; margin-right:8px}
.icqs{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.icq{border-radius:18px; padding:16px 18px; border:1px solid var(--line2); background:var(--panel)}
.icq .k{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--gold)}

.icq .btn{margin-top:10px}
.teams{display:grid; grid-template-columns:1fr 1fr; gap:14px}

.team.a h4{color:var(--cyan)} .team.b h4{color:var(--gold)}
.mem{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.mem button{display:inline-flex; gap:8px; align-items:center; padding:7px 12px 7px 7px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid var(--line2); font-weight:800; font-size:16px}
.mem button .av{--s:32px; font-size:14px}
.ringwrap{display:grid; place-items:center; position:relative}

.todo div{display:flex; gap:12px; align-items:center; font-size:22px; font-weight:800; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}

.react{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.react span{padding:10px 12px; border-radius:14px; font-size:17px; font-weight:700; background:rgba(255,255,255,.04); border:1px solid var(--line2)}
.vote3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}

/* ═════════════ FINALE ═════════════ */
.unl{text-align:center; padding:10px 0}
.burstfold{position:relative; height:260px; display:grid; place-items:center}
.burstfold .fo{position:absolute; width:86px; height:62px; border-radius:6px 12px 12px 12px; background:linear-gradient(180deg,#14423A,#0B2A25); border:1px solid rgba(62,230,162,.5); display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--green);

.bigT{font-family:var(--dsp); font-weight:900; text-transform:uppercase; font-size:clamp(52px,7vw,96px); line-height:.9; letter-spacing:.01em}
.bigT.gold{background:linear-gradient(90deg,#FFE3B5,var(--gold),#FF9E6E); -webkit-background-clip:text; background-clip:text; color:transparent}
.truth{max-width:980px; margin:0 auto}
.truth p{font-family:var(--serif); font-size:38px; line-height:1.3; margin:0 0 18px; font-weight:500}

.everyone{display:flex; justify-content:center; align-items:flex-end; gap:8px; margin:12px 0 22px}

.letter{font-family:var(--serif); font-size:26px; line-height:1.5}
.letter p{margin:0 0 .5em}
.letter .sig{font-style:italic; color:var(--gold); font-size:30px}
.choice2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.choice2 button{border-radius:22px; padding:20px 22px; text-align:left; border:1.5px solid var(--line2); background:var(--panel); font-weight:800; font-size:24px; line-height:1.2; transition:.2s}

.badge{display:inline-grid; place-items:center; width:200px; height:200px; border-radius:50%; position:relative; margin:0 auto;
  background:radial-gradient(circle at 50% 35%,#FFE7B8,#E8A33A 55%,#7A4A0E); box-shadow:0 0 0 8px rgba(255,198,110,.15),0 0 60px rgba(255,198,110,.5)}

.tmap{display:flex; flex-direction:column; gap:3px; max-height:320px; overflow:auto}

#modal{position:fixed; inset:0; z-index:80; background:rgba(3,4,10,.78); display:grid; place-items:center; padding:20px; backdrop-filter:blur(6px)}
#modal .box{width:min(980px,100%); max-height:calc(100vh - 40px); overflow:auto; border-radius:26px; padding:26px 28px; background:#0D1128; border:1px solid var(--line2); box-shadow:var(--shadow)}

#toast{position:fixed; left:50%; bottom:86px; transform:translate(-50%,20px); z-index:95; padding:12px 20px; border-radius:14px; background:#141A3A; border:1px solid var(--line2); font-weight:700; font-size:16px; opacity:0; pointer-events:none; transition:.25s; box-shadow:var(--shadow); max-width:90vw; text-align:center}

#reward{position:fixed; right:22px; bottom:84px; transform:translateY(-10px) scale(.9); z-index:94; pointer-events:none; opacity:0; text-align:center; transition:.35s cubic-bezier(.2,.9,.25,1.2)}
#reward.on{opacity:1; transform:none}
#reward .in{padding:18px 30px; border-radius:20px; background:linear-gradient(135deg,rgba(18,60,48,.96),rgba(10,30,26,.96)); border:1px solid rgba(62,230,162,.6); box-shadow:0 0 60px rgba(62,230,162,.4)}
#reward small{display:block; font-family:var(--mono); font-size:12px; letter-spacing:.3em; color:var(--green)}

@keyframes unlock{0%{transform:none}40%{transform:translateY(-6px) rotate(-12deg)}100%{transform:none}}
@keyframes scard{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#confetti{position:fixed; inset:0; z-index:93; pointer-events:none}
#wm{position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:2; opacity:.22; pointer-events:none}

#dock{position:fixed; right:14px; bottom:76px; z-index:50; width:300px; border-radius:18px; background:rgba(10,13,30,.97); border:1px solid var(--line2); box-shadow:var(--shadow); display:none; font-size:14px}

.dh{display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line)}
.db{padding:10px 12px; max-height:44vh; overflow:auto; display:grid; gap:6px}

.names{display:flex; flex-wrap:wrap; gap:4px}
.names span{padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.06); font-size:12.5px}

@keyframes floatup{to{transform:translateY(-280px); opacity:0}}
body.clean #top .tools .hm, body.clean #rail, body.clean .cue .roles{display:none}

.cc .pic .jfig{position:absolute; left:50%; top:6px; width:92px; transform:translateX(-50%)}

function burst(el, set=['✨','⭐','✨','💫']){
  if(!el || REDUCED) return; const r=el.getBoundingClientRect();

    requestAnimationFrame(()=>{ s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*180}deg)`; s.style.opacity='0'; });

}

    t += Math.ceil(txt.length/2)*speed + 260; });

}

/* ---------- 6d · QUIZ: click to answer · wrong → try again · right → explain → WHY? → SHOW CCQ ---------- */
function quizStep(c){
  const vis = ()=> c.items.filter(it=>!it.opt || !S.core || isSolved(sd(c.id),it));
  const isSolved = (d,it)=> !!((d.ok||{})[it.id] || (d.sh||{})[it.id] || (d.mk||{})[it.id]);
  const P = d => { const v=vis(); let p=v.findIndex(x=>x.id===d.cid); if(p<0) p=Math.min(d.p||0, v.length-1); return Math.max(0,p); };
  const nSolved = d => vis().filter(it=>isSolved(d,it)).length;
  return Object.assign({
    parts:()=>vis().length,
    sync(d){ d.p=P(d); d.cid=vis()[d.p].id; },
    onPart(d){ const v=vis(); d.p=Math.min(d.p||0,v.length-1); d.cid=v[d.p].id; },
    render(d){
      const v=vis(), p=P(d), it=v[p], ok=(d.ok||{})[it.id], sh=(d.sh||{})[it.id], mk=(d.mk||{})[it.id], sv=ok||sh||mk, tried=(d.tr||{})[it.id]||[], n=v.length;
      const why=(d.why||{})[it.id], cq=(d.cq||{})[it.id]||0, cnt=counts(c.id+'-'+it.id, (it.opts||[]).length);
      const phase = !sv ? (tried.length?'CHOOSE':'THINK') : !why ? 'EXPLAIN' : (it.ccq&&cq<2&&!S.noccq) ? 'CHECK' : 'CONTINUE';
      let right='';
      if(it.open){
        right=`<p class="qq">${esc(it.q)}</p>
          ${sv?`<div class="why stamp"><div class="k">${sh?'👁 ANSWER':'✓ ANSWERED'}</div><div class="full">${esc(it.exp)}</div><p style="margin:0">${it.why}</p></div>`:`<p class="qhelp">Say your answer aloud. Then check.</p>`}
          <div class="ctrls">${sv?'':`<button class="btn sm" data-qact="show">👁 Show answer</button><button class="btn sm green" data-qact="mark">✓ Answered</button>`}</div>`;
      } else {
        const opts=it.opts.map((o,i)=>{ let cl=''; if(sv && i===it.a) cl='right '+(FX.has('okq')||FX.has('reveal')?'fx':''); else if(tried.includes(i)) cl='tried '+(FX.has('no'+i)?'shake':''); else if(sv) cl='dim';
          return `<button class="opt ${cl}" data-q="${i}" ${sv?'aria-disabled="true"':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span><span class="n">${cnt[i]||''}</span></button>`; }).join('');
        const qtxt = c.qHTML ? c.qHTML(it,sv) : esc(it.q).replace('___',`<span class="gap ${sv?'fill':''}">${sv?esc(it.opts[it.a]):'?'}</span>`);
        let fb='';
        if(ok) fb=`<div class="fb ok stamp"><div class="k">✅ CORRECT${tried.length?' · ON TRY '+(tried.length+1):''}</div><div class="say">${fillCue(it.say||'{E}, explain your choice. Why is it right?')}</div></div>`;
        else if(sh) fb=`<div class="fb ok stamp"><div class="k">👁 ANSWER · ${LET[it.a]}</div><div class="say">${fillCue('{E}, why is this the right answer?')}</div></div>`;
        else if(tried.length) fb=`<div class="fb no pop-in">✗ Not quite — try again! ${fillCue('{X}, do you agree?')}</div>`;
        right=`<p class="qq">${qtxt}</p><div class="opts">${opts}</div>${fb}
          ${why&&sv?`<div class="why pop-in"><div class="k">💡 WHY?</div>${it.full?`<div class="full">${it.full}</div>`:''}<p style="margin:0">${it.why}</p></div>`:''}
          ${cq&&sv&&it.ccq?`<div class="ccq pop-in"><div class="k">✔ QUICK CHECK · ${fillCue('{C}')}</div><div class="q">${esc(it.ccq[0])}</div>${cq>1?`<div class="a">→ ${esc(it.ccq[1])}</div>`:''}</div>`:''}
          ${sv?`<div class="ctrls"><button class="btn sm ${why?'on':''}" data-qact="why">💡 Why?</button>${it.ccq&&!S.noccq?`<button class="btn sm ${cq?'on':''}" data-qact="ccq">✔ ${cq===0?'Show CCQ':cq===1?'CCQ answer':'Hide CCQ'}</button>`:''}</div>`
              :`<p class="qhelp">${fillCue('{D}: choose and say why.')} Wrong? Try again! ${S.live?'Devices can vote too.':''}</p>`}`;
      }
      const last=p===n-1, all=nSolved(d)===n;
      return `${c.top?c.top(d):''}<div class="deckbar">${flow(phase)}<span class="grow"></span><span class="kick">${c.kicker||'CHALLENGE'} ${p+1} / ${n}${it.tag?' · '+esc(it.tag):''}</span>${it.opt?'<span class="tag ext">Extended</span>':''}
          <span class="tag green">SOLVED ${nSolved(d)}/${n}</span>
          <div class="cdots">${v.map((x,i)=>`<button data-card="${i}" class="${i===p?'cur':''} ${isSolved(d,x)?'done':''} ${x.opt?'xo':''}" aria-label="Challenge ${i+1}">${i+1}</button>`).join('')}</div></div>
        <div class="qz"><div class="${fresh()?'pop-in':''}">${c.left(it,p,sv,d)}</div>
          <div>${right}
            ${sv?`<div class="row mt">${!last?`<button class="btn primary" data-act="next">Next challenge →</button>`:all?`<button class="btn gold caps pulse" data-act="next">${esc(c.doneLbl||'Continue')} →</button>`:`<span class="small">${n-nSolved(d)} left — tap the numbers above.</span>`}</div>`:''}
          </div></div>${c.after?c.after(d,all):''}`;
    },
    bind(root,d){
      const v=vis(), p=P(d), it=v[p];
      $$('[data-q]',root).forEach(b=>b.onclick=()=>{
        if(isSolved(d,it)) return; const i=+b.dataset.q;
        if(i===it.a){ (d.ok=d.ok||{})[it.id]=true; SFX.ok(); FX.add('okq'); save(); c.onSolve&&c.onSolve(it,d); draw(false,true); burst($('.opt.right',root)||$('.opt.right')); }
        else { d.tr=d.tr||{}; const t=d.tr[it.id]=d.tr[it.id]||[]; if(!t.includes(i)) t.push(i); SFX.no(); FX.add('no'+i); save(); draw(false,true); }
      });
      $$('[data-qact]',root).forEach(b=>b.onclick=()=>{ const a=b.dataset.qact;
        if(a==='why'){ d.why=d.why||{}; d.why[it.id]=!d.why[it.id]; }
        if(a==='ccq'){ d.cq=d.cq||{}; d.cq[it.id]=((d.cq[it.id]||0)+1)%3; }
        if(a==='show'){ (d.sh=d.sh||{})[it.id]=true; c.onSolve&&c.onSolve(it,d); }
        if(a==='mark'){ (d.mk=d.mk||{})[it.id]=true; c.onSolve&&c.onSolve(it,d); SFX.ok(); }
        SFX.pop(); save(); draw(false,true); });
      $$('[data-card]',root).forEach(b=>b.onclick=()=>{ d.p=+b.dataset.card; d.cid=v[d.p].id; FX.add('part'); save(); draw(false,true); });
      if(FX.has('reveal')) setTimeout(()=>burst($('.opt.right',root)),60);
      c.bind2 && c.bind2(root,d);
    },
    reveal(d){ const it=vis()[P(d)]; d.sh=d.sh||{}; if(isSolved(d,it)){ d.why=d.why||{}; d.why[it.id]=!d.why[it.id]; return; } d.sh[it.id]=true; d.why=d.why||{}; d.why[it.id]=true; SFX.ok(); c.onSolve&&c.onSolve(it,d); },
    revealLbl:d=>{ const it=vis()[P(d)]; return isSolved(d,it) ? ((d.why||{})[it.id]?'Hide why':'Why?') : 'Show answer'; },
    hint(d){ const it=vis()[P(d)]; if(!it.ccq) return; d.cq=d.cq||{}; d.cq[it.id]=((d.cq[it.id]||0)+1)%3; }, hintLbl:'CCQ',
    nextLbl(d){ return P(d)<vis().length-1 ? 'Next challenge' : null; },
    gate(d){ const v=vis(), p=P(d); if(!isSolved(d,v[p])) return 'This challenge isn’t solved yet'; if(p===v.length-1 && nSolved(d)<v.length) return `${v.length-nSolved(d)} challenge(s) still unsolved`; return null; },
    get ans(){ return c.items.map((x,i)=>`${i+1}${x.opt?' (Extended)':''}. ${x.open?x.sent+' → '+x.exp:LET[x.a]+' — '+x.opts[x.a]} · ${strip(x.why)}${x.ccq?` · CCQ: ${x.ccq[0]} → ${x.ccq[1]}`:''}`); },
    live(){ const d=sd(c.id), it=vis()[P(d)]; if(it.open) return null; const sv=isSolved(d,it);
      return {kind:'choice', id:c.id+'-'+it.id, q:strip(c.liveQ?c.liveQ(it):it.q).replace('___','_____'), opts:it.opts, lock:sv, correct:sv?it.a:null}; },
    solvedIds:d=> c.items.filter(it=>isSolved(d,it)).map(it=>it.id)
  }, c);
}

const MT = { id:'', total:0, left:0, run:false, t:null,
  start(id,sec){ if(this.id!==id || this.left<=0){ this.id=id; this.total=sec; this.left=sec; } this.run=true; clearInterval(this.t);
    this.t=setInterval(()=>{ this.left--; this.paint(); if(this.left<=0){ this.stop(); SFX.bell(); toast('⏰ Time! Finish your sentence — nothing moves on automatically.'); } },1000); this.paint(); SFX.pop(); },
  stop(){ this.run=false; clearInterval(this.t); this.paint(); },
  reset(id,sec){ this.stop(); this.id=id; this.total=sec; this.left=sec; this.paint(); },
  toggle(id,sec){ (this.run && this.id===id) ? this.stop() : this.start(id,sec); },
  paint(){ $$('[data-mt]').forEach(el=>{ if(el.dataset.mt!==this.id){ el.textContent=mmss(+el.dataset.sec); el.classList.remove('run','end'); return; }
    el.textContent=(this.run?'⏸ ':'▶ ')+mmss(this.left); el.classList.toggle('run',this.run); el.classList.toggle('end',this.left<=0); }); }
};

  try{ const r=new RegExp('('+esc(base).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'); if(r.test(esc(x))) return esc(x).replace(r,'<b>$1</b>');
    return esc(x).replace(new RegExp('(\\b'+first+'[\\w’\\-]*(\\s(up|out|it|in|together|myself|yourself|his|her|my))?)','i'),'<b>$1</b>'); }catch(e){ return esc(x); } }

function spinNext(root,d){

    if(d.k===n-1) complete(7); MT.stop(); FX.add('spk'); save(); SFX.ping(); draw(false,true); };
  if(REDUCED){ land(); return; }
  let t=0; const cards=$$('.qcard',root); const tick=()=>{ cards.forEach(c=>c.classList.remove('cur','spin')); const c=cards[free[t%free.length]]; if(c){ c.classList.add('cur','spin'); } SFX.key(); t++; if(t<10) later(tick,70+t*12); else land(); }; tick();
}

const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt); };

const GATE = {id:null, t:0};
function gateOK(s,d){
  const g = s.gate && s.gate(d); if(!g) return true;
  const key=s.id+':'+(d.p||0);
  if(GATE.id===key){ GATE.id=null; return true; }
  GATE.id=key; clearTimeout(GATE.t); GATE.t=setTimeout(()=>{ GATE.id=null; },7000);
  SFX.no(); toast('🔒 '+g+' — press Next again to continue anyway (teacher)'); return false;
}
function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if(!gateOK(s,d)) return;
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; s.onPart&&s.onPart(d); FX.add('part'); save(); draw(true,true); $('#stage').scrollTop=0; return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else toast('That’s the end of the lesson 🎉');
}
function back(){
  const s=cur(), d=sd(s.id);
  if((d.p||0)>0){ d.p--; s.onPart&&s.onPart(d); save(); draw(true,true); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--;
  if(k>=0) go(k);
}
function go(k){
  const prevF=cur().f; S.i=k; clockStart(); FX.add('enter'); GATE.id=null; MT.stop();
  const s=STEPS[k], d=sd(s.id);
  if(!TIMER.run() && S.timer.for!==s.id && (s.tsec || !TIMER.dirty())) TIMER.set(s.tsec||Math.round(s.min*60), s.id);
  if(s.completes) complete(s.completes, !!s.quietDone);

}

/* activity timer: suggested duration of each screen; never moves on by itself */
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  dirty: ()=> S.timer.left>0 && S.timer.left<S.timer.total,
  set(sec,label){ S.timer={total:sec, left:sec, endAt:0, for:label||''}; save(); pubState(); },
  start(){ if(this.left()<=0) S.timer.left=S.timer.total; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  add(sec){ if(this.run()) S.timer.endAt+=sec*1000; else S.timer.left=this.left()+sec; S.timer.total=Math.max(S.timer.total, Math.ceil(this.left())); save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');
    const show = this.run() || this.dirty() || ['rooms','alias'].includes(cur().id);
    chip.classList.toggle('hidden', !show); $('#tchipT').textContent=mmss(l); chip.classList.toggle('warn', this.run());
    const bc=$('#bigClock'), rf=$('#ringFg'), rg=$('#ring'); if(bc){ bc.textContent=mmss(l); bc.classList.toggle('end',l<=0); }
    if(rf) rf.style.strokeDashoffset=(326.73*(1-l/Math.max(1,S.timer.total))).toFixed(1); if(rg) rg.classList.toggle('hurry', this.run() && l<=30 && l>0);
    const tt=$('#tTimer'); if(tt) tt.textContent=mmss(l);
    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.bell(); toast('⏰ Time’s up! Nothing moves on automatically — continue when you’re ready.'); pubState(); if(cur().id==='rooms') draw(false,true); }
  }
};
function clockStart(){ if(!S.clock.start && !S.clock.paused){ S.clock.start=Date.now(); save(); } }
const clockNow = ()=> (S.clock.acc||0) + (S.clock.start? (Date.now()-S.clock.start)/1000 : 0);
function clockToggle(){ if(S.clock.start){ S.clock.acc=clockNow(); S.clock.start=0; S.clock.paused=true; } else { S.clock.start=Date.now(); S.clock.paused=false; } save(); paintClock(); }
function paintClock(){ const g=$('#gclock'); g.textContent='⏲ '+mmss(clockNow()); g.classList.toggle('run',!!S.clock.start); }
function routeMin(core){ let m=0; STEPS.forEach(s=>{ if(core&&s.opt) return; m+=(core&&s.minCore)||s.min; }); return Math.round(m); }

/* ---------- 10 · student devices (optional): Supabase Realtime broadcast + presence; BroadcastChannel fallback ----------
   The teacher page is the only source of truth. Protection:
   • every teacher message is SIGNED (ECDSA P-256, WebCrypto). The private key never leaves the teacher’s browser;
   • the student link / QR carries the public-key fingerprint (manual join: room code + 6-character teacher key).
     Devices accept state and tasks ONLY with a valid signature — a student can’t take over the lesson;
   • devices can only send hello / ans (a vote index) / react. No text is ever sent by students;
   • correct answers reach devices only after the teacher has revealed them on the main screen;
   • nothing is stored: votes live in the teacher tab’s memory only; devices keep a temporary tile + nickname. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const NAMES = {};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','⚡'];
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson10-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson10-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l10sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l10sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson10-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson10-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));
  if(TKEY.ok){ try{ const sig=await TKEY.sign(body); Net.send({t:'sig', body, sig, pk:TKEY.pub}); return; }catch(e){ console.warn(e); } }
  Net.send({t:'raw', body});
}

function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || m.from.role!=='student') return;
  if(m.from.name) NAMES[id]=(AVATARS.includes(m.from.av)?m.from.av+' ':'')+String(m.from.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); paintDock(); return; }

  if(m.t==='ans' && task && m.task===task.id && (task.kind==='choice'||task.kind==='vote')){
    const v=+m.v; if(!(Number.isInteger(v) && v>=0 && v<task.opts.length) || task.lock) return;
    (VOTES[task.id]=VOTES[task.id]||{})[id]=v; clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(!document.activeElement.closest('input,textarea')) draw(false,true); else paintDock(); },200);
  }
}

    onStatus:()=>{ paintDock(); if($('#lvStatus')) $('#lvStatus').innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save();
  $('#btnLive').classList.toggle('on',LIVE.on);
  pubState(); draw(false,true);
  if(!silent) toast(!signed?'Room open — but this browser cannot sign messages (needs https)':kind==='supabase'?'Student room open — share the link, QR or code':kind==='local'?'Supabase is not reachable — the room works in THIS browser only':'The room could not start');
  return kind;
}
function stopLive(){ sendSigned({t:'end'}); setTimeout(()=>Net.stop(),300); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); $('#btnLive').classList.remove('on'); paintDock(); }
function liveStatus(){
  if(!LIVE.on) return 'not started — <b>Teacher-led mode</b> (no devices)';
  const n=LIVE.peers.filter(p=>p&&p.role==='student').length;
  const s = Net.status==='live' ? '<span style="color:var(--green)">● live (Supabase Realtime)</span>' : Net.status==='local' ? '<span style="color:var(--gold)">● this browser only — student synchronisation is unavailable (Supabase not configured or not reachable)</span>' : `<span style="color:var(--gold)">● ${esc(Net.status)}</span>`;
  return `${s} · ${n} joined`;
}
async function openLive(){
  await TKEY.init();
  openModal(`<div class="row"><h2 class="dsp grow" style="font-size:46px">📡 Student devices</h2><button class="btn sm ghost" onclick="closeModal()" aria-label="Close">✕</button></div>
   <p class="small">Optional. Students open the link or scan the QR, tap a numbered tile (a nickname is optional) — no accounts, no typing of answers. They see the current file, tap answers and votes, read the diary entries and see the breakout mission. You see their votes here in real time. Without a room, the lesson works exactly the same on your shared screen.</p>
   <div class="two mt" style="align-items:center"><div><div class="small">Room code</div><div class="dsp" style="font-size:84px">${S.room}</div>
     <div class="small">Teacher key <b class="mono" style="font-size:22px;color:var(--cyan);letter-spacing:.12em">${shortKey()||'—'}</b> (only needed if a student types the code)</div>
     <div class="small mt" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div>
     <p class="small mt" style="color:#BFF7DE">🔐 Your messages are signed with a key that never leaves this browser. Devices obey only this signature. Votes are kept in this tab’s memory only.</p></div>
     <img alt="QR code for the student link" width="220" height="220" style="border-radius:18px;background:#fff;justify-self:end" src="https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?`<button class="btn" id="lvStop">⏹ Stop room</button>`:`<button class="btn primary" id="lvStart">▶ Start student room</button>`}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--gold)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → student synchronisation is unavailable until configured.</p>'}
   ${canSign()?'':'<p class="small mt" style="color:var(--gold)">This page is not on https, so messages cannot be signed. Open it from GitHub Pages for the student room.</p>'}`);
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); draw(false,true); openLive(); };
  $('#lvCopy').onclick=()=>copy(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 11 · student device app (?room=1234&k=…&role=student  or  ?join) — taps only, no answer typing ---------- */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, tile=0, nick='', avatar=AVATARS[0], sent={}, taskKey='', trust=null, lastTs=0, verified=false;
  try{ tile=+(localStorage.getItem('l10tile')||0); nick=localStorage.getItem('l10nick')||''; avatar=localStorage.getItem('l10av')||avatar; }catch(e){}
  const myName=()=> nick.trim() || (tile?'Student '+tile:'');
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':'warn');
    $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😮','😂','🔥','✋','🎬'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="card stu-card"><div class="row" style="gap:10px">${jAv(50)}${miaAv(50)}${av('team',50)}</div>
      <h2 class="dsp mt" style="font-size:40px">Join the investigation 🕵️</h2>
      ${room?`<p class="small">Room <b>${esc(room)}</b></p>`:`<label for="rc">Room code (from the main screen)</label><input id="rc" inputmode="numeric" maxlength="6" placeholder="1234" autocomplete="off">`}
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the main screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label>Tap your tile</label><div class="tiles">${[1,2,3,4,5,6].map(n=>`<button type="button" data-tile="${n}" class="${tile===n?'on':''}">Student ${n}</button>`).join('')}</div>
      <label>Avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <label for="nm">Nickname (optional)</label><input id="nm" maxlength="16" value="${esc(nick)}" placeholder="first name or nickname" autocomplete="off">
      <p class="small" style="margin-top:8px">No surname, no personal data. Nothing is saved.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join →</button></div>`;
    $$('[data-tile]',B).forEach(b=>b.onclick=()=>{ tile=+b.dataset.tile; $$('[data-tile]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const rc=$('#rc'), tk=$('#tk');
      if(rc){ const r=rc.value.replace(/\D/g,''); if(r.length<4) return rc.focus(); room=r; }
      if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; }
      nick=$('#nm').value.trim().slice(0,16); if(!tile && !nick){ toast('Tap your tile first'); return; }
      try{ localStorage.setItem('l10tile',String(tile)); localStorage.setItem('l10nick',nick); localStorage.setItem('l10av',avatar); }catch(e){} join(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const join=async()=>{
    $('#stuRoom').textContent='room '+room;
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🗂️</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name:myName(), av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ const k=JSON.stringify([m.f, m.done, m.clues, m.task]); st=m; if(k!==taskKey){ taskKey=k; render(); } else paintT(); }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(myName())}! Waiting for your teacher…<br><span class="small">Room ${esc(room)} — right code and teacher key? <a href="?join">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">🔓🎉</div><h2 class="dsp" style="font-size:40px">Case closed!</h2><p class="small">Thanks, ${esc(avatar+' '+myName())}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer){ t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); } };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait"><div class="bigi">👀</div><p>Hi ${esc(avatar+' '+myName())}! Waiting for your teacher…</p></div>`; return; }
    const T=st.task, head=`<div class="stu-prog">${FILES.map(x=>`<i class="${x.n<st.f?'d':x.n===st.f?'c':''}"></i>`).join('')}</div>
      <div class="row" style="margin-bottom:10px"><span class="small mono grow" style="letter-spacing:.1em">${st.e||''} ${st.f>=1&&st.f<=8?fileLabel(st.f)+' · ':''}${esc(st.title||'')}</span><span class="mono small" style="color:var(--gold)">🗂️ ${st.done||0}/8</span></div>
      ${verified?'<div class="verif">✓ verified teacher</div>':''}`;
    const notes = (st.clues||[]).length ? `<details class="help mt"><summary>🔎 Case notes · ${st.clues.length}</summary><div class="stu-clues" style="padding:0 12px 12px">${st.clues.map(c=>`<div>${esc(c)}</div>`).join('')}</div></details>` : '';
    if(!T){ B.innerHTML=head+`<div class="card stu-card center"><div class="bigi" style="font-size:56px">👀</div><p><b>Look at the main screen.</b></p>${st.mission?`<p class="small">${esc(st.mission)}</p>`:''}<p class="small">Listen, speak, and tap the emoji below.</p></div>`+notes; return; }
    if(T.kind==='choice'||T.kind==='vote'){
      const my=sent[T.id];
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:21px;font-weight:800">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.lock&&T.correct===i?'right':my===i?'pick':''}" data-i="${i}"><span class="L">${T.kind==='vote'?'•':LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T.lock?(my===T.correct?'🎉 Correct! Now explain it aloud.':'✓ The answer is on the main screen.'):my!==undefined?'✓ Sent! You can change it.':T.kind==='vote'?'Tap your choice.':'Tap your answer — then say why!'}</p></div>`+notes;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T.kind==='read'){ B.innerHTML=head+`<div class="stu-read"><h3>${esc(T.title)}</h3>${(T.paras||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div><p class="small mt">Read along. Speak your answers aloud on Zoom.</p>`+notes; return; }
    if(T.kind==='clues'){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:21px;font-weight:800">🔎 Case notes</p><div class="stu-clues">${(st.clues||[]).map(c=>`<div>${esc(c)}</div>`).join('')||'<div>No clues yet.</div>'}</div></div>`; return; }
    if(T.kind==='mission'){ B.innerHTML=head+`<div class="small mono" id="stuT"></div>${missionBody(true)}`; bindMission(B); paintT(); return; }
  };
  (room && key.length>=6 && (tile||nick)) ? join() : ask();
}

/* ---------- 12 · read-only breakout mission view (?mission) ---------- */
function missionBody(compact){
  return `${recapHTML(compact)}${sceneFrameHTML()}<div class="mt">${taskHTML()}</div>${helpHTML(true)}
    <div class="row mt"><button class="btn sm" data-mex>👁 Show an example</button><span class="small">Try your own idea first!</span></div><div data-mexbox></div>`;
}
function bindMission(root){ const b=$('[data-mex]',root); if(b) b.onclick=()=>{ const x=$('[data-mexbox]',root); const on=!x.innerHTML; x.innerHTML=on?exampleHTML():''; b.textContent=on?'Hide the example':'👁 Show an example'; }; }
function missionView(){
  document.body.classList.add('mview');
  const M=$('#mview');
  M.innerHTML=`<div class="mv"><div class="top">${jAv(56)}<div class="grow"><div class="kick">THE IDENTITY FILES · LESSON 10 · BREAKOUT MISSION</div><h1 class="dsp" style="font-size:clamp(40px,7vw,64px)">The Final Cut — finish J’s film</h1></div>
      <span class="ro">READ-ONLY · THIS PAGE DOESN’T CONTROL THE LESSON</span></div>
    ${recapHTML()}<div class="two wl mt" style="align-items:start"><div style="margin-top:-16px">${sceneFrameHTML()}</div><div>${taskHTML()}${helpHTML(true)}
      <div class="row mt"><button class="btn sm" data-mex>👁 Show an example</button><span class="small">Try your own idea first!</span></div><div data-mexbox></div>
      <div class="row mt"><button class="btn sm ghost" id="mvPng">🖼 Save as image</button><button class="btn sm ghost" onclick="window.print()">🖨 Print</button></div></div></div></div>`;
  bindMission(M); $('#mvPng').onclick=missionPNG;
}

/* ---------- 13 · boot ---------- */
setInterval(()=>{ if(ROLE==='teacher'){ TIMER.tick(); paintClock(); const tc=$('#tClock'); if(tc) tc.textContent=mmss(clockNow()); } },500);
setInterval(()=>{ if(LIVE.on) pubState(); },6000);
if(ROLE==='mission'){ missionView(); }
else if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnVocab').onclick=()=>openVocab(); $('#btnTeam').onclick=openTeam; $('#btnRoute').onclick=toggleRoute; $('#btnLive').onclick=openLive; $('#btnPres').onclick=presentMode; $('#btnSize').onclick=sizeMenu;
  $('#tchip').onclick=()=>{ TIMER.run()?TIMER.pause():TIMER.start(); TIMER.tick(); if($('#teacher').classList.contains('on')) paintTeacher(); };
  $('#gclock').onclick=clockToggle;
  $('#meter').onclick=showMap; $('#meter').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); showMap(); } };
  $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('pres'); });
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#vocab').classList.contains('hidden')){ if(e.key==='Escape'||e.key==='w'||e.key==='W') closeVocab();
      else if(VS.mode==='focus' && (e.key==='ArrowRight'||e.key==='ArrowLeft')){ const l=vFiltered(), k=l.findIndex(x=>x.i===VS.cur)+(e.key==='ArrowRight'?1:-1); if(l[k]){ VS.cur=l[k].i; paintVocab(); } }
      return; }
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button,a,[role=button],summary'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='w'||k==='W') openVocab();
    else if(k==='p'||k==='P') presentMode();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='c'||k==='C') document.body.classList.toggle('clean');
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A') doReveal();
    else if(k==='+'||k==='=') setZoom(.1);
    else if(k==='-'||k==='_') setZoom(-.1);
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  [MIA_PHOTO,'img/scenes/premiere.webp'].forEach(src=>{ const im=new Image(); im.src=src; });
  draw(true);
  if(S.live) startLive(true);
}
</script>
