.cast .cc span{z-index:2}
.cast .cc:nth-child(2){transform:translateY(26px)} .cast .cc:nth-child(4){transform:translateY(26px)}

/* ── options / quiz ── */
.qcard{max-width:900px; margin:0 auto}
.q{font-family:var(--disp); font-weight:700; font-size:clamp(26px,2.8vw,40px); line-height:1.12; letter-spacing:-.015em}
.opts{display:grid; gap:12px; margin-top:20px}
.opts.cols3{grid-template-columns:repeat(3,minmax(0,1fr))} @media (max-width:800px){ .opts.cols3{grid-template-columns:1fr} }
.opts.cols4{grid-template-columns:repeat(4,minmax(0,1fr))} @media (max-width:800px){ .opts.cols4{grid-template-columns:repeat(2,minmax(0,1fr))} }
.opt{position:relative; display:flex; align-items:center; gap:14px; text-align:left; width:100%; min-height:64px; padding:14px 18px; border-radius:18px; border:2px solid var(--line2); background:rgba(255,255,255,.04); font-size:1.02em; font-weight:700; transition:background .2s, border-color .2s, transform .12s}
.opt:hover{background:rgba(255,255,255,.08)}
.opt .L{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.1); font-family:var(--disp); font-weight:800}
.opt .mk{margin-left:auto; flex:none; font-size:22px}
.opt.pick{border-color:var(--volt); background:rgba(61,123,255,.18)}
.opt.right{border-color:var(--mint); background:rgba(88,224,176,.16)}
.opt.right .L{background:var(--mint); color:#05261A}
.opt.wrong{border-color:var(--rose); background:rgba(255,107,139,.12); animation:shake .35s}
.opt.wrong .L{background:var(--rose); color:#2A0610}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)} 75%{transform:translateX(6px)}}
.opt .bar{position:absolute; left:0; top:0; bottom:0; border-radius:16px; background:rgba(255,255,255,.07); z-index:-1; transition:width .6s ease}
.opt{z-index:0; overflow:hidden}
.opt .pct{flex:none; font-family:var(--disp); font-weight:800; color:var(--muted)}
.fb{margin-top:16px; padding:14px 18px; border-radius:16px; background:rgba(88,224,176,.12); border:1px solid rgba(88,224,176,.4); font-weight:600}
.fb.no{background:rgba(255,107,139,.1); border-color:rgba(255,107,139,.4)}
.fb.neutral{background:rgba(255,255,255,.06); border-color:var(--line2)}
.qnav{display:flex; gap:8px; margin-bottom:14px}
.qnav i{width:34px; height:6px; border-radius:6px; background:var(--line2)} .qnav i.c{background:var(--blush)} .qnav i.d{background:var(--mint)}
.livecount{display:inline-flex; gap:8px; align-items:center; font-size:14px; color:var(--muted); background:rgba(255,255,255,.06); border-radius:999px; padding:4px 12px}

/* ── profiles ── */
.profiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
@media (max-width:1000px){ .profiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .profiles{grid-template-columns:1fr} }
.pc{--c:var(--blush); position:relative; text-align:left; border-radius:24px; border:1px solid var(--line); background:rgba(23,30,74,.7); padding:0; overflow:hidden; transition:transform .25s, border-color .25s, box-shadow .25s; display:flex; flex-direction:column}
.pc:hover{transform:translateY(-3px)}
.pc.open{border-color:var(--c); box-shadow:0 0 0 1px var(--c), 0 20px 40px rgba(0,0,0,.35)}
.pc .ph{position:relative; aspect-ratio:5/4; overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.pc .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(10,12,34,.92))}
.pc .ph .nmx{position:absolute; left:16px; bottom:10px; z-index:2}
.pc .ph .nmx b{display:block; font-family:var(--disp); font-size:30px; line-height:1}
.pc .ph .nmx span{font-size:14px; color:#D7DBF7}
.pc .body{padding:14px 16px 18px; font-size:.9em}
.pc .pers{color:var(--muted); font-size:.92em}
.pc .quote{margin-top:10px; font-weight:700; line-height:1.35}
.pc .xpl{margin-top:10px; padding:10px 12px; border-radius:14px; background:rgba(255,255,255,.06); font-size:.88em}
.pc.locked{pointer-events:none}
.pc.locked .ph img{filter:blur(14px) brightness(.5)}
.pc.locked .ph::before{content:"🔒"; position:absolute; inset:0; display:grid; place-items:center; font-size:40px; z-index:3}
.pc .tap{font-size:13px; color:var(--dim); margin-top:8px}
.fact{display:flex; gap:12px; align-items:center; margin-top:16px; padding:12px 16px; border-radius:16px; background:rgba(255,255,255,.06); animation:popin .3s ease}

/* ── chat ── */
.chatwin{max-width:760px; margin:0 auto; border-radius:28px; overflow:hidden; background:rgba(12,15,36,.88); border:1px solid var(--line); box-shadow:0 30px 70px rgba(0,0,0,.45)}
.chathead{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.03)}
.chathead b{font-size:17px} .chathead small{display:block; color:var(--muted); font-size:13px}
.chatbody{padding:20px 18px 22px; display:flex; flex-direction:column; gap:14px; min-height:260px}
.msg{display:flex; gap:10px; align-items:flex-end; max-width:86%; animation:msgin .35s ease both}
@keyframes msgin{from{opacity:0; transform:translateY(12px) scale(.98)}}
.msg .bub{padding:12px 16px; border-radius:20px 20px 20px 6px; background:#232A5C; font-size:1.02em; line-height:1.45}
.msg .bub .nm{display:block; font-size:13px; font-weight:800; margin-bottom:2px}
.msg.me{align-self:flex-end; flex-direction:row-reverse}
.msg.me .bub{background:#3A4BC8; border-radius:20px 20px 6px 20px}
.msg.sys{align-self:center; max-width:100%}
.msg.sys .bub{background:transparent; color:var(--muted); font-size:14px; border:1px dashed var(--line2); border-radius:999px; padding:6px 14px}
.typing{display:inline-flex; gap:5px; padding:14px 16px; border-radius:20px 20px 20px 6px; background:#232A5C}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.3; transform:none} 30%{opacity:1; transform:translateY(-3px)}}
.readhint{font-size:13px; color:var(--dim); text-align:center; margin-top:10px}
.comments .cmt{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); animation:msgin .35s ease both}
.comments .anon{width:46px;height:46px;border-radius:50%;background:#2A3068;display:grid;place-items:center;font-size:22px;flex:none}
.gossip{margin-top:14px; padding:12px 16px; border-radius:16px; border:1px dashed var(--amber); color:#FFE6C4; font-size:.92em}

/* decision */
.dec-h{font-family:var(--disp); font-weight:800; font-size:clamp(34px,4.6vw,66px); letter-spacing:-.03em; line-height:.95}
.dec-opts{display:grid; gap:14px; margin-top:22px}
.dopt{position:relative; overflow:hidden; text-align:left; display:flex; gap:16px; align-items:center; padding:18px 20px; border-radius:22px; border:2px solid var(--line2); background:rgba(255,255,255,.04); font-size:1.08em; font-weight:700; min-height:76px; z-index:0}
.dopt:hover{background:rgba(255,255,255,.08)}
.dopt .L{flex:none; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-family:var(--disp); font-size:22px; font-weight:800; background:rgba(255,255,255,.1)}
.dopt.chosen{border-color:var(--blush); background:rgba(255,143,184,.16)}
.dopt.chosen .L{background:var(--blush); color:#2A0F1E}
.dopt.faded{opacity:.4}
.dopt .bar{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.07); z-index:-1; transition:width .6s ease}
.dopt .pct{margin-left:auto; flex:none; font-family:var(--disp); font-weight:800; color:var(--muted)}
.react{margin-top:22px; display:flex; flex-direction:column; gap:12px}

/* voice */
.voice{max-width:720px; margin:0 auto; border-radius:32px; padding:clamp(20px,3vw,34px); background:linear-gradient(160deg, rgba(255,143,184,.16), rgba(106,69,232,.18)); border:1px solid rgba(255,143,184,.3); box-shadow:0 30px 80px rgba(0,0,0,.45)}
.vrow{display:flex; align-items:center; gap:18px}
.vplay{width:78px; height:78px; border-radius:50%; border:0; background:var(--blush); color:#2A0F1E; font-size:30px; display:grid; place-items:center; flex:none; box-shadow:0 10px 30px rgba(255,143,184,.4)}
.vplay:hover{transform:scale(1.04)}
.wave{flex:1; display:flex; align-items:center; gap:3px; height:64px; cursor:pointer}
.wave i{flex:1; border-radius:3px; background:rgba(255,255,255,.25); transition:background .2s}
.wave i.on{background:var(--blush)}
.wave.play i.on:last-of-type{}
.vtime{font-family:var(--disp); font-weight:700; font-size:20px; min-width:110px; text-align:right}
.vctl{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center}
.vctl .on{background:var(--blush); color:#2A0F1E; border-color:var(--blush)}
.synth{display:inline-flex; gap:6px; align-items:center; font-size:13px; color:#FFE3EE; background:rgba(255,143,184,.15); border:1px solid rgba(255,143,184,.35); border-radius:999px; padding:3px 10px}
.transcript{margin-top:18px; padding:18px 20px; border-radius:20px; background:rgba(8,10,28,.6); line-height:1.65; font-size:1.02em}
.transcript .s{transition:background .2s, color .2s; border-radius:6px}
.transcript .s.on{background:rgba(255,143,184,.22); color:#fff}

/* real talk */
.inbox{display:grid; grid-template-columns:300px minmax(0,1fr); gap:22px}
@media (max-width:900px){ .inbox{grid-template-columns:1fr} }
.thread{display:flex; flex-direction:column; gap:10px}
.th{display:flex; gap:12px; align-items:center; text-align:left; padding:12px 14px; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,.03)}
.th.cur{background:rgba(255,255,255,.1); border-color:var(--line2)}
.th.skip{opacity:.5}
.th small{display:block; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px}
.advice{border-radius:28px; padding:clamp(20px,2.6vw,34px); background:rgba(23,30,74,.7); border:1px solid var(--line)}
.advice .said{font-family:var(--disp); font-weight:700; font-size:clamp(24px,2.5vw,36px); line-height:1.15; letter-spacing:-.01em}
.advice .ask{margin-top:18px; padding:16px 18px; border-radius:18px; background:rgba(61,123,255,.14); border:1px solid rgba(61,123,255,.4); font-weight:700; font-size:1.1em}
.helpbox{margin-top:12px; padding:12px 16px; border-radius:16px; background:rgba(255,255,255,.06); animation:popin .25s}
.helpbox b{color:var(--amber)}
.wall{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
.wall .w{background:rgba(255,255,255,.08); border-radius:16px; padding:10px 14px; font-weight:600}
.wall .w small{display:block; color:var(--muted); font-weight:500; font-size:12px}

/* mission */
.mission-h{font-family:var(--disp); font-weight:800; font-size:clamp(40px,5.4vw,80px); letter-spacing:-.035em; line-height:.92}
.steps4{display:grid; gap:10px; margin-top:16px; counter-reset:s}
.steps4 li{list-style:none; display:flex; gap:12px; align-items:center; padding:8px 14px; font-size:.92em; border-radius:16px; background:rgba(255,255,255,.05); font-weight:700}
.problems{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:20px}
@media (max-width:950px){ .problems{grid-template-columns:1fr} }
.prob{border-radius:22px; padding:18px; background:rgba(16,21,58,.85); border:1px solid var(--line2); display:flex; flex-direction:column; gap:8px}
.prob .pn{font-family:var(--disp); font-weight:800; font-size:15px; color:var(--noah)}
.prob .pt{font-family:var(--disp); font-weight:700; font-size:1.25em; line-height:1.15}
.prob .pq{color:#D7DBF7}
.prob .pe{font-size:.88em; color:var(--muted); border-left:3px solid var(--noah); padding-left:10px}
.prob textarea{width:100%; min-height:96px; resize:vertical; border-radius:14px; border:1px solid var(--line2); background:rgba(0,0,0,.25); padding:12px; font-size:.98em; line-height:1.4}
.prob textarea:focus{outline:2px solid var(--noah); outline-offset:1px}
.prob.off{opacity:.35}
.teams-tabs{display:flex; gap:8px; flex-wrap:wrap}
.teams-tabs button{border:1px solid var(--line2); background:rgba(255,255,255,.04); border-radius:14px; padding:8px 14px; font-weight:800}
.teams-tabs button.on{background:var(--volt); border-color:var(--volt)}
.teams-tabs button .ok{color:var(--mint)}
.clock{font-family:var(--disp); font-weight:800; font-size:clamp(44px,5vw,72px); letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums}
.clock.low{color:var(--amber)} .clock.out{color:var(--rose)}
.vchips{display:flex; flex-wrap:wrap; gap:6px}
.vchips .v{font-size:.85em}
.used{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px}
.used span{background:rgba(88,224,176,.16); color:#BFF7DE; border-radius:999px; padding:2px 10px; font-weight:700}
.rulebig{display:grid; gap:14px; margin-top:16px}
.rulebig .rb{display:flex; gap:16px; align-items:flex-start; padding:18px 20px; border-radius:20px; background:rgba(255,255,255,.06); font-size:1.15em; font-weight:700}
.rulebig .rb .n{flex:none; width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--noah); color:#06233A; font-family:var(--disp); font-weight:800}

/* final */
.warmpost .screen{background:#FFF8F2}
.ending{font-family:var(--disp); font-weight:700; font-size:1.05em; color:#8A3B12; background:#FFE9D2; border-radius:12px; padding:8px 12px; margin-top:8px; display:block}
.codecard{border-radius:24px; padding:20px; background:rgba(255,194,122,.1); border:1px solid rgba(255,194,122,.35)}
.codecard li{margin:6px 0}
.starters{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
.starters span{padding:10px 16px; border-radius:999px; background:rgba(255,255,255,.08); font-weight:700}
.fin{min-height:calc(100vh - 230px); display:grid; place-items:center; text-align:center}
.fin .big{font-family:var(--disp); font-weight:800; font-size:clamp(48px,8vw,128px); letter-spacing:-.01em; line-height:.9; font-variation-settings:"wdth" 84}
.fin .tag2{font-family:var(--disp); font-weight:700; font-size:clamp(22px,2.4vw,34px); margin-top:18px}
.medal{width:130px; height:130px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; font-size:58px; background:radial-gradient(circle at 35% 30%, #FFE3B8, #FFC27A 45%, #D9893D); box-shadow:0 0 0 8px rgba(255,194,122,.25), 0 20px 50px rgba(255,170,90,.4); animation:medal 1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes medal{from{transform:scale(.3) rotate(-30deg); opacity:0}}
.ach{position:fixed; inset:0; z-index:70; display:grid; place-items:center; background:rgba(6,8,24,.7); backdrop-filter:blur(6px); animation:fade .25s both; cursor:pointer}
@keyframes fade{from{opacity:0}}
.ach .box{text-align:center; animation:medal .7s cubic-bezier(.2,1.5,.4,1) both}
.ach h2{font-size:clamp(44px,6vw,90px)}
.hearts{position:fixed; inset:0; pointer-events:none; z-index:71; overflow:hidden}
.hearts span{position:absolute; bottom:-40px; font-size:26px; animation:rise 2.6s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg); opacity:0}}

/* teacher notes */
#notes{position:fixed; top:0; right:0; bottom:0; z-index:40; width:min(470px,100vw); background:#0E1338; border-left:1px solid var(--line2); transform:translateX(102%); transition:transform .3s ease; display:flex; flex-direction:column; font-size:16px}
#notes.on{transform:none; box-shadow:-30px 0 60px rgba(0,0,0,.45)}
#notes header{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
#notes header b{font-family:var(--disp); font-size:20px; flex:1}
#notesBody{overflow:auto; padding:14px 16px 40px}
.tsec{padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.04); margin-bottom:10px}
.tsec h5{margin:0 0 6px; font-size:14px; color:var(--amber); font-weight:800}
.tsec .ua{color:#FFE6C4}
.tsec ul{margin:4px 0; padding-left:20px}
.tsec .say{border-left:3px solid var(--volt); padding-left:10px; margin:6px 0}
.tsec .say i{display:block; color:var(--muted); font-size:14px}
.opttag{display:inline-block; font-size:12px; font-weight:800; color:#2B1606; background:var(--amber); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle}
.ttimer{display:flex; align-items:center; gap:10px}
.ttimer .clk{font-family:var(--disp); font-size:30px; font-weight:800; font-variant-numeric:tabular-nums}
.jump{display:grid; grid-template-columns:1fr; gap:4px; max-height:280px; overflow:auto}
.jump button{text-align:left; border:0; background:transparent; padding:6px 8px; border-radius:8px; font-size:14px; color:var(--muted)}
.jump button.cur{background:rgba(255,255,255,.08); color:var(--text)}
.jump button:hover{background:rgba(255,255,255,.06)}
.switch{display:flex; align-items:center; gap:10px; font-size:15px; padding:4px 0}
.switch input{width:20px; height:20px; accent-color:var(--blush)}

/* modal */
#modal{position:fixed; inset:0; z-index:50; background:rgba(4,6,18,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:16px}
#modalBox{width:min(980px,100%); max-height:calc(100vh - 32px); overflow:auto; background:#121848; border:1px solid var(--line2); border-radius:28px; padding:clamp(18px,2.4vw,32px); font-size:17px}
.vb-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:12px; margin-top:16px}
.vbi{border-radius:18px; padding:14px 16px; background:rgba(255,255,255,.05); border:1px solid var(--line)}
.vbi .t{font-family:var(--disp); font-size:22px; font-weight:800; line-height:1.05; color:#FFE3EE}
.vbi .u{color:var(--amber); font-weight:700; font-size:15px}
.vbi .e{font-size:15px; color:var(--muted); font-style:italic; margin-top:6px}
.vbi.seen{border-color:rgba(255,143,184,.4)}
.vsearch{width:100%; height:52px; border-radius:16px; border:1px solid var(--line2); background:rgba(0,0,0,.25); padding:0 16px; font-size:17px}
.flash{perspective:1200px; max-width:560px; margin:20px auto 0}
.flash .card3{position:relative; height:300px; transform-style:preserve-3d; transition:transform .5s; cursor:pointer}
.flash .card3.flip{transform:rotateY(180deg)}
.flash .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:26px; display:grid; place-items:center; text-align:center; padding:24px; background:linear-gradient(150deg,#2A2F7A,#3E2A7A); border:1px solid var(--line2)}
.flash .face.back{transform:rotateY(180deg); background:linear-gradient(150deg,#3A1F4E,#2A2F7A)}
.flash .face .t{font-family:var(--disp); font-size:clamp(34px,4vw,52px); font-weight:800; line-height:1}
.tabs{display:flex; gap:6px; background:rgba(255,255,255,.05); border-radius:14px; padding:4px; width:max-content}
.tabs button{border:0; background:transparent; padding:8px 14px; border-radius:10px; font-weight:800; font-size:15px}
.tabs button.on{background:var(--volt)}

/* toast + dock */
#toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); z-index:80; background:#fff; color:#121426; font-weight:700; border-radius:14px; padding:10px 18px; box-shadow:0 14px 40px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:all .25s; max-width:calc(100vw - 24px); text-align:center; font-size:16px}
#toast.on{opacity:1; transform:translateX(-50%)}
#dock{position:fixed; left:14px; bottom:86px; z-index:24; width:min(330px,calc(100vw - 28px)); background:rgba(14,19,56,.95); border:1px solid var(--line2); border-radius:18px; padding:12px 14px; font-size:14px; display:none; max-height:50vh; overflow:auto}
#dock.on{display:block}
#dock.min #dockBody{display:none}
.led{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--amber)} .led.on{background:var(--mint); box-shadow:0 0 8px var(--mint)} .led.bad{background:var(--rose)}
.names{display:flex; flex-wrap:wrap; gap:4px; margin:6px 0} .names span{background:rgba(255,255,255,.08); border-radius:999px; padding:1px 8px; font-size:13px}
.dbar{display:grid; grid-template-columns:1fr auto; gap:2px 8px; font-size:13px; margin-top:6px}
.dbar .tr{grid-column:1/3; height:6px; border-radius:6px; background:rgba(255,255,255,.08)} .dbar .tr i{display:block; height:100%; border-radius:6px; background:var(--volt)}
.wallit{display:flex; gap:6px; align-items:center; margin-top:6px} .wallit p{flex:1; margin:0} .wallit small{display:block; color:var(--muted)}

/* small effects */
function burst(el){ if(!anim()||!el) return; const r=el.getBoundingClientRect(); for(let i=0;i<8;i++){ const s=document.createElement('span'); s.textContent=['✨','💖','⭐'][i%3]; Object.assign(s.style,{position:'fixed',left:(r.left+r.width*Math.random())+'px',top:(r.top+r.height/2)+'px',zIndex:90,pointerEvents:'none',fontSize:'20px',transition:'all .8s ease-out'}); document.body.appendChild(s); requestAnimationFrame(()=>{ s.style.transform=`translate(${(Math.random()-.5)*120}px,${-40-Math.random()*70}px)`; s.style.opacity='0'; }); setTimeout(()=>s.remove(),900); } }

/* ---------- voice note: real mp3 if present, otherwise the browser’s speech voice ---------- */
const VN = {
  mode:'tts', audio:null, rate:1, playing:false, idx:0, prog:0, heard:false, t0:0, raf:0, voice:null,
  sent: VOICE_SCRIPT.match(/[^.?!]+[.?!]+/g).map(s=>s.trim()),
  init(){
    if(CFG.VOICE_NOTE){ const a=new Audio(); a.preload='metadata'; a.src=CFG.VOICE_NOTE;
      a.addEventListener('loadedmetadata',()=>{ this.mode='file'; this.audio=a; this.paint(); });
      a.addEventListener('timeupdate',()=>{ if(this.mode==='file'){ this.prog=a.duration?a.currentTime/a.duration:0; this.paint(); } });
      a.addEventListener('ended',()=>{ this.playing=false; this.heard=true; this.prog=1; this.paint(); this.onEnd&&this.onEnd(); });
      a.addEventListener('error',()=>{ this.mode='tts'; this.paint(); }); }
    if('speechSynthesis' in window){ const pick=()=>{ const v=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
        const pref=['Samantha','Google UK English Female','Microsoft Aria','Microsoft Jenny','Microsoft Libby','Microsoft Sonia','Karen','Moira','Tessa','Serena','Google US English','Microsoft Zira'];
        this.voice = pref.map(n=>v.find(x=>x.name.includes(n))).find(Boolean) || v.find(x=>/female/i.test(x.name)) || v[0] || null; };
      pick(); speechSynthesis.onvoiceschanged=pick; }
  },
  can(){ return this.mode==='file' || ('speechSynthesis' in window); },
  weights(){ const L=this.sent.map(s=>s.length), T=L.reduce((a,b)=>a+b,0); return {L,T}; },
  dur(){ if(this.mode==='file'&&this.audio&&this.audio.duration) return this.audio.duration/this.rate; const {T}=this.weights(); return T/(11*this.rate) + this.sent.length*0.6/this.rate; },
  play(){ if(this.mode==='file'){ this.audio.playbackRate=this.rate; if(this.prog>=1) this.audio.currentTime=0; this.audio.play(); this.playing=true; this.paint(); return; }
    if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); this.playing=true; if(this.prog>=1){ this.idx=0; this.prog=0; } this.say(this.idx); },
  say(i){
    if(!this.playing) return; if(i>=this.sent.length){ this.playing=false; this.heard=true; this.prog=1; this.idx=0; this.paint(); this.onEnd&&this.onEnd(); return; }
    this.idx=i; const u=new SpeechSynthesisUtterance(this.sent[i]); u.lang='en-GB'; if(this.voice){ u.voice=this.voice; u.lang=this.voice.lang; }
    u.rate=0.8*this.rate; u.pitch=1.08; const {L,T}=this.weights(), before=L.slice(0,i).reduce((a,b)=>a+b,0);
    const est=L[i]/(11*this.rate)*1000; this.t0=performance.now();
    u.onboundary=e=>{ if(typeof e.charIndex==='number'){ this.prog=(before+Math.min(e.charIndex,L[i]))/T; this.paint(); } };
    cancelAnimationFrame(this.raf); const tick=()=>{ if(!this.playing||this.idx!==i) return; const f=Math.min(1,(performance.now()-this.t0)/est); this.prog=Math.max(this.prog,(before+L[i]*f*.98)/T); this.paint(); this.raf=requestAnimationFrame(tick); }; this.raf=requestAnimationFrame(tick);
    u.onend=()=>{ if(!this.playing||this.idx!==i) return; this.prog=(before+L[i])/T; setTimeout(()=>this.say(i+1), 600/this.rate); };
    u.onerror=e=>{ if(e.error!=='interrupted'&&e.error!=='canceled'){ this.playing=false; this.paint(); toast('The browser could not play the voice — read the transcript aloud instead.'); } };
    speechSynthesis.speak(u); this.paint();
  },
  pause(){ this.playing=false; if(this.mode==='file') this.audio.pause(); else { cancelAnimationFrame(this.raf); speechSynthesis.cancel(); } this.paint(); },
  toggle(){ this.playing?this.pause():this.play(); },
  replay(){ this.pause(); this.idx=0; this.prog=0; if(this.mode==='file') this.audio.currentTime=0; this.play(); },
  seek(f){ const was=this.playing; this.pause(); if(this.mode==='file'){ this.audio.currentTime=f*this.audio.duration; this.prog=f; }
    else { const {L,T}=this.weights(); let acc=0, i=0; while(i<L.length-1 && (acc+L[i])/T<f){ acc+=L[i]; i++; } this.idx=i; this.prog=acc/T; } this.paint(); if(was) this.play(); },
  setRate(r){ this.rate=r; if(this.mode==='file'&&this.audio) this.audio.playbackRate=r; else if(this.playing){ this.pause(); this.play(); } this.paint(); },
  stop(){ if(this.playing) this.pause(); },
  paint(){
    const w=$('#vwave'); if(!w) return; const bars=$$('i',w), on=Math.round(this.prog*bars.length); bars.forEach((b,i)=>b.classList.toggle('on',i<on));
    const d=this.dur(); $('#vtime').textContent=`${mmss(this.prog*d)} / ${mmss(d)}`;
    const p=$('#vplay'); p.textContent=this.playing?'❚❚':'▶'; p.setAttribute('aria-label',this.playing?'Pause':'Play');
    const tag=$('#vmode'); if(tag) tag.innerHTML = this.mode==='file' ? '🎙️ Voice recording' : ('speechSynthesis' in window ? '🔊 Synthesized voice (browser text-to-speech)' : '⚠️ No speech voice in this browser — read the transcript aloud');
    $$('[data-rate]').forEach(b=>b.classList.toggle('on', +b.dataset.rate===this.rate));
    const tr=$('#vtr'); if(tr){ const {L,T}=this.weights(); let acc=0, cur=-1; for(let i=0;i<L.length;i++){ if(this.playing && this.prog*T>=acc-1 && this.prog*T<acc+L[i]) cur=i; acc+=L[i]; } if(this.mode==='tts'&&this.playing) cur=this.idx; $$('.s',tr).forEach((s,i)=>s.classList.toggle('on',i===cur)); }
    if(this.heard){ const d2=sd('voice'); if(!d2.heard){ d2.heard=true; save(); const b=$('#vtrBtn'); if(b) b.disabled=false; } }
  }
};
const WAVE = Array.from({length:56},(_,i)=> 18 + Math.round(Math.abs(Math.sin(i*1.7)*0.6 + Math.sin(i*0.47)*0.4) * 78));
function voiceHTML(d, compact){
  return `<div class="voice">

function markScript(s){ return s.replace(/\bsquad\b/,'[[squad|squad]]').replace('third wheel','[[third|third wheel]]').replace('fall out','[[fallout|fall out]]').replace('show up for me','[[showup|show up for me]]'); }
function bindVoice(root){
  VN.onEnd=()=>{ if(cur().id==='voice') draw(); };
  $('#vplay',root).onclick=()=>VN.toggle(); $('#vreplay',root).onclick=()=>VN.replay();
  $$('[data-rate]',root).forEach(b=>b.onclick=()=>VN.setRate(+b.dataset.rate));
  const w=$('#vwave',root); w.onclick=e=>{ const r=w.getBoundingClientRect(); VN.seek(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))); };
  w.onkeydown=e=>{ if(e.key==='ArrowRight'){ e.stopPropagation(); VN.seek(Math.min(1,VN.prog+.1)); } if(e.key==='ArrowLeft'){ e.stopPropagation(); VN.seek(Math.max(0,VN.prog-.1)); } };
  const tb=$('#vtrBtn',root); if(tb) tb.onclick=()=>{ const d=sd('voice'); d.tr=!d.tr; save(); draw(); };
  VN.paint();
}

    $('#tgo',r).onclick=()=>{ TMR.run()?TMR.pause():TMR.start(); draw(); }; $('#tplus',r).onclick=()=>{ TMR.add(60); }; $('#treset',r).onclick=()=>{ TMR.set(240); draw(); };
  },
  ready:()=>TEAMS().some(t=>ruleCount(t)>0), gateMsg:'No team rules yet — press Next again to go to presentations anyway',
  live:()=>({id:'team', kind:'team', teams:TEAMS().map(t=>({L:t, e:TEAM_E[t], name:teamName(t)})), probs:activeProbs().map(p=>({f:p.f, t:p.t, q:p.q})), work:S.work, sub:S.sub, names:S.tnames}),
  n:{t:'4 хв (+ розведення)', ua:'Робота в Zoom breakout rooms. Сайт кімнати не створює — розведіть учнів самі. У Live-режимі команди пишуть правила з телефонів (кожне поле окремо, автозбереження); у Teacher-led ви вписуєте їхні правила, коли команди повернуться.', do:['Таймер 4:00 лише підказка — нічого не перемикається автоматично.','Вкладки команд угорі; лічильник показує, скільки нових виразів використано (мета — 3+).','Submit → коротка анімація MISSION COMPLETE.','Час закінчується → поверніть учнів і натисніть Next (презентації).']}
});
function ruleHTML(text){ let h=esc(String(text).replace(/’/g,"'")); usedV(text).forEach(k=>{ h=h.replace(new RegExp(VRX[k].source.replace(/'/g,"(?:'|&#39;)"),'i'), m=>`<mark style="background:rgba(255,143,184,.3);color:inherit;border-radius:4px;padding:0 3px">${m}</mark>`); }); return h; }
step({id:'present', sc:6, title:'Team presentations',
  render:d=>{ const L=TEAMS().includes(S.ptm)?S.ptm:'A', w=S.work[L]||{}, used=usedV(teamText(L));
    return `${sceneTag(cur())}<div class="row"><h2 class="h-m grow">Team presentations · 30–45 seconds each</h2>
      <div class="teams-tabs tonly">${TEAMS().map(t=>`<button class="${t===L?'on':''}" data-pt="${t}">${TEAM_E[t]} ${esc(teamName(t))}${S.sub[t]?' ✓':''}</button>`).join('')}</div></div>
    <div class="glass pad mt"><div class="row"><span style="font-size:42px">${TEAM_E[L]}</span><div class="grow"><div class="h-m">${esc(teamName(L))}</div><div class="small">The Real Squad Code</div></div>
      <div class="used">${used.length?used.map(k=>`<span>${esc(VOCAB[k].t)}</span>`).join(''):''}<b style="margin-left:6px">${used.length>=3?'✓ 3+ new expressions':`${used.length}/3 expressions`}</b></div></div>
      <div class="rulebig">${activeProbs().map((P,i)=>`<div class="rb"><span class="n">${i+1}</span><div><div class="small" style="font-weight:600">${esc(P.t)}</div>${(w[P.f]||'').trim()?ruleHTML(w[P.f]):'<span class="muted">—</span>'}</div></div>`).join('')}</div></div>

});
step({id:'dec3', sc:6, title:'Decision 3 · What matters most?',
  render:d=>{ const ch=S.dec.dec3; return `${sceneTag(cur())}<div class="qcard" style="max-width:980px"><div class="dec-h center">WHAT MATTERS MOST IN A REAL FRIENDSHIP?</div><p class="lead center" style="margin:12px auto 0">There is no wrong answer. The class chooses one rule for the squad.</p>
    ${decHTML(DEC3,d)}
    ${ch!=null?`<div class="fb center mt2" style="font-size:1.1em">${DEC3.opts[ch].e} Class rule saved: <b>${esc(DEC3.opts[ch].t)}</b> — you’ll see it in the final post.</div>
      <div class="center mt2"><div class="mission-h" style="font-size:clamp(34px,4vw,56px)">MISSION COMPLETE!</div><p class="lead" style="margin:8px auto 0">YOU HELPED THE SQUAD!</p></div>`:''}</div>`; },
  after:(r,d)=>{ const was=S.dec.dec3; bindDec(r,DEC3,d); $$('[data-dec]',r).forEach(b=>{ const f=b.onclick; b.onclick=()=>{ f(); if(was==null&&S.dec.dec3!=null) achieve('MISSION COMPLETE!','YOU HELPED THE SQUAD!','🛡️'); }; }); },
  ready:()=>S.dec.dec3!=null, gateMsg:'The class rule isn’t chosen yet — the final post needs it. Press Next again to continue anyway',
  reveal:d=>{ d.res=true; },
  live:()=>Object.assign(decTask(DEC3),{q:'What matters most in a real friendship?'}),
  n:{t:'1 хв', ua:'Третє рішення: найважливіше правило дружби. Немає правильної відповіді. Результат змінює фінальний пост у сцені 7.', ans:['Honesty → “From now on, we’ll talk honestly instead of pretending everything is fine.”','Support → “From now on, we’ll show up for each other when it really matters.”','Including everyone → “From now on, we’ll make sure nobody feels left out.”']}
});

step({id:'endchat', sc:7, title:'The honest talk', parts:4,
  render:d=>`${sceneTag(cur())}<div class="chatwin" style="background:rgba(40,20,40,.85)"><div class="chathead"><div class="stack">${['mia','leo','sophie','noah'].map(k=>av(k,30)).join('')}</div><div class="grow"><b>The Perfect Squad 💫</b><small>group chat · 4 members</small></div></div>

      <div class="ig-top"><div class="stack">${['mia','sophie'].map(k=>av(k,28)).join('')}</div><div class="grow"><b>ThePerfectSquad</b><br><span style="font-size:12px;color:#777">just now</span></div><b>⋯</b></div>

        ${ch!=null?`<span class="ending">${DEC3.opts[ch].e} ${esc(DEC3.opts[ch].end)}</span>`:''}</div></div></div>

    <div><h2 class="h-l">No filters this time.</h2><p class="lead mt">The squad posts something new — not a perfect photo, but an honest one.</p>
      ${ch==null?`<div class="glass pad mt tonly"><b>The class rule (Decision 3) isn’t chosen yet.</b><div class="row mt">${DEC3.opts.map((o,i)=>`<button class="btn sm" data-d3="${i}">${o.e} ${esc(o.t)}</button>`).join('')}</div></div>`:''}
      ${rules.length?`<div class="codecard mt2"><div class="row"><b class="grow">🛡️ Our class friendship code</b><button class="btn sm ghost tonly" id="code">${S.code?'Hide':'Show'}</button></div>
        ${S.code?`<ul style="margin:10px 0 0;padding-left:20px">${rules.map(t=>activeProbs().map(P=>(S.work[t]||{})[P.f]).filter(x=>(x||'').trim()).map(x=>`<li>${esc(x)} <span class="small">— ${esc(teamName(t))}</span></li>`).join('')).join('')}</ul>`:''}</div>`:''}</div></div>`; },

  n:{t:'1 хв', ua:'Фінальний пост. Останнє речення залежить від рішення 3. Праворуч — правила команд як «класний кодекс дружби».', do:['Учень читає підпис уголос.','Запитайте: “How is this post different from the first one?”'], say:[['How is this post different from the first one?','Чим цей пост відрізняється від першого?']]}
});

    <div class="starters">${STARTERS.map(s=>`<span>${T(s.replace('has your back','[[back|has your back]]').replace('is there for you','[[there|is there for you]]').replace('shows up','[[showup|shows up]]').replace('two-faced','[[twofaced|two-faced]]'))}</span>`).join('')}</div>

  render:()=>`<div class="fin"><div><div class="medal">🏅</div><div class="big">REAL ONES <span style="white-space:nowrap">ONLY <span class="h">❤️</span></span></div>
    <div class="tag2">Perfect photos don’t make perfect friends.</div>
    <p class="lead" style="margin:12px auto 0">Real friendship is about honesty, trust and showing up when it matters.</p>
    <div class="mt2"><div class="dsp" style="font-size:clamp(28px,3vw,44px);color:var(--amber)">MISSION COMPLETE!</div><div class="lessonno mt">LESSON 21 COMPLETED</div></div>
    <div class="row mt2" style="justify-content:center"><button class="btn" id="fWords">📚 Review the 15 expressions</button><a class="btn primary tonly" href="../../#words?lesson=21">Practise on the platform</a><a class="btn ghost tonly" href="../../">← Back to the course</a></div></div></div>`,
  after:r=>{ $('#fWords',r).onclick=()=>openBank(); if(CTX.entering) setTimeout(()=>hearts(30),300); },
  n:{t:'0.5 хв', ua:'Фінальний екран. Домашнє завдання — практика виразів на платформі (кнопка Practise).'}
});
</script>
<script>
/* ---------- 5 · engine ---------- */
let CTX = {entering:true, prevP:-1, decPrev:{}};
let LAST = {id:null, p:-1}, LASTDEC = {}, GATE = null;
const cur = ()=> STEPS[S.i] || STEPS[0];
const parts = s => typeof s.parts==='function' ? s.parts() : (s.parts||1);
const visible = k => !!STEPS[k] && !(S.core && STEPS[k].opt);
const typing = ()=> !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('input,textarea'));
if(S.i>=STEPS.length) S.i=0;

function draw(){
  const s=cur(), d=sd(s.id);
  if(VN.playing && !['voice','listenq'].includes(s.id)) VN.stop();
  const entering = LAST.id!==s.id;
  CTX = {entering, prevP: entering?-1:LAST.p, decPrev:LASTDEC};
  document.body.dataset.sc = s.atm || s.sc;
  const v=$('#view'), fid=document.activeElement && document.activeElement.id;
  v.innerHTML = s.render(d);
  if(entering){ v.classList.remove('view'); void v.offsetWidth; v.classList.add('view'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  $$('.v[data-v]',v).forEach(b=>{ const k=b.dataset.v; if(!k.startsWith('@')) S.seen[k]=1; });
  s.after && s.after(v,d);
  if(fid && !entering){ const f=document.getElementById(fid); if(f && v.contains(f)) f.focus({preventScroll:true}); }
  LAST={id:s.id, p:d.p||0}; LASTDEC=Object.assign({},S.dec);
  paintChrome(); pubState(); if($('#notes').classList.contains('on')) paintNotes(); TMR.paint(); save();
}
function next(){
  const s=cur(), d=sd(s.id), P=parts(s), p=d.p||0;
  if(s.ready && !s.ready(d)){ const g=s.id+':'+p; if(GATE!==g){ GATE=g; toast(s.gateMsg||'Not answered yet — press Next again to continue'); return; } }
  GATE=null;
  if(p<P-1){ d.p=p+1; s.onPart&&s.onPart(d); save(); draw(); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else toast('That’s the end of Lesson 21 ❤️');
}
function back(){
  const d=sd(cur().id); GATE=null;
  if((d.p||0)>0){ d.p--; save(); draw(); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--; if(k>=0) go(k);
}
function go(k){ if(!STEPS[k]) return; S.i=k; GATE=null; save(); draw(); }
function goId(id){ const k=STEPS.findIndex(x=>x.id===id); if(k<0) return; if(!visible(k)) S.core=false; go(k); }
function goScene(n){ const k=STEPS.findIndex((x,i)=>x.sc===n && visible(i)); if(k>=0) go(k); }
function reveal(){ const s=cur(), d=sd(s.id); if(s.reveal) s.reveal(d); else if(parts(s)>1) d.p=parts(s)-1; else return; s.onPart&&s.onPart(d); save(); draw(); }
function nextNonOpt(from){ let k=from; while(k<STEPS.length && STEPS[k].opt) k++; return k; }
function skipTarget(){ const s=cur(); if(s.opt) return nextNonOpt(S.i); let k=S.i+1; while(k<STEPS.length && !visible(k)) k++; return STEPS[k]&&STEPS[k].opt ? nextNonOpt(k) : -1; }
function skipOpt(){ const k=skipTarget(); if(k>=0 && k<STEPS.length){ go(k); toast('Optional activity skipped'); } }

function buildRail(){ $('#rail').innerHTML=SCENES.map(sc=>`<button data-sc="${sc.n}" aria-label="Scene ${sc.n}: ${sc.t}"><i></i><span>${sc.t}</span></button>`).join(''); $$('#rail button').forEach(b=>b.onclick=()=>goScene(+b.dataset.sc)); }
function paintChrome(){
  const s=cur(), d=sd(s.id), P=parts(s);
  $$('#rail button').forEach(b=>{ const n=+b.dataset.sc; b.classList.toggle('cur',n===s.sc); b.classList.toggle('done',n<s.sc); if(n===s.sc) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  const sc=SCENES[s.sc-1];
  $('#info').innerHTML=`${sc.e} <b>${sc.t}</b> · ${esc(s.title)}${P>1?` (${(d.p||0)+1}/${P})`:''}${s.opt?' · optional':''}`;
  $('#bBack').disabled = S.i===0 && !(d.p>0);
  $('#bReveal').disabled = !(s.reveal || P>1);
  const sk=skipTarget(); $('#bSkip').disabled = !(sk>=0 && sk<STEPS.length);
  const last = S.i===STEPS.length-1; $('#bNext').innerHTML = last?'Finish ❤️':'Next ▶';
  $('#wCnt').textContent = VORDER.filter(k=>S.seen[k]).length+'/15';
  $('#bLive').classList.toggle('on', LIVE.on);
}

/* ---------- timer (advisory only — never changes the screen by itself) ---------- */
const TMR = {
  left(){ const t=S.tmr; return t.run ? Math.max(0,(t.end-Date.now())/1000) : t.left; },
  run(){ return !!S.tmr.run; },
  set(sec){ S.tmr={dur:sec, left:sec, run:false, end:0}; save(); this.paint(); pubState(); },
  start(){ const t=S.tmr; if(t.left<=0) t.left=t.dur; t.end=Date.now()+t.left*1000; t.run=true; save(); this.paint(); pubState(); },
  pause(){ const t=S.tmr; t.left=this.left(); t.run=false; save(); this.paint(); pubState(); },
  add(sec){ const t=S.tmr; if(t.run) t.end+=sec*1000; else t.left+=sec; t.dur=Math.max(t.dur,t.left); save(); this.paint(); pubState(); },
  tick(){ const t=S.tmr; if(t.run && Date.now()>=t.end){ t.run=false; t.left=0; save(); toast('⏰ Time is up — continue when you’re ready.'); pubState(); if(cur().id==='work' && !typing()) draw(); } this.paint(); },
  paint(){ const l=this.left(); $$('[data-clock]').forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=60&&l>0); e.classList.toggle('out',l<=0); }); }
};
if(ROLE==='teacher') setInterval(()=>TMR.tick(),500);

/* ---------- 6 · vocabulary popover + bank ---------- */
function speak(text){ if(!('speechSynthesis' in window)) return toast('No speech voice in this browser'); speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; if(VN.voice){ u.voice=VN.voice; u.lang=VN.voice.lang; } u.rate=.85; speechSynthesis.speak(u); }
const vItem = key => key.startsWith('@') ? Object.assign({old:true},REV[key.slice(1)]) : VOCAB[key];
function showPop(key, el){
  const V=vItem(key); if(!V) return; closePop();
  if(!key.startsWith('@')) S.seen[key]=1;
  const p=document.createElement('div'); p.id='pop'; p.setAttribute('role','dialog'); p.setAttribute('aria-label',V.t);
  p.innerHTML=`<button class="btn sm ghost x" aria-label="Close">✕</button><div>${V.old?'<span class="oldtag">learned before</span>':'<span class="newtag">new · Lesson 21</span>'}</div>
    <div class="ex mt">${esc(V.t)}</div><p class="mt" style="margin-bottom:4px">${esc(V.en)}</p><div class="ua">🇺🇦 ${esc(V.ua)}</div><div class="eg">${esc(V.ex)}</div>
    <div class="row mt"><button class="btn sm" data-say>🔊 Listen</button>${V.old?'':'<button class="btn sm ghost" data-bank>📚 Vocabulary Bank</button>'}</div>`;
  document.body.appendChild(p);
  const r=el.getBoundingClientRect(), pw=p.offsetWidth, ph=p.offsetHeight;
  let left=Math.min(Math.max(12, r.left + r.width/2 - pw/2), innerWidth-pw-12), top=r.bottom+10; if(top+ph>innerHeight-12) top=Math.max(12, r.top-ph-10);
  p.style.left=left+'px'; p.style.top=top+'px';
  $('.x',p).onclick=closePop; $('[data-say]',p).onclick=()=>speak(V.t.replace(/[()]/g,'')+'. '+V.ex);
  const bk=$('[data-bank]',p); if(bk) bk.onclick=()=>{ closePop(); openBank(); };
  $('.x',p).focus({preventScroll:true}); POPFROM=el; save(); if(ROLE==='teacher') paintChrome();
}
let POPFROM=null;
function closePop(){ const p=$('#pop'); if(p){ p.remove(); if(POPFROM&&document.body.contains(POPFROM)) POPFROM.focus({preventScroll:true}); POPFROM=null; } }
document.addEventListener('click',e=>{ const v=e.target.closest('.v[data-v]'); if(v){ e.preventDefault(); e.stopPropagation(); showPop(v.dataset.v, v); return; } if($('#pop') && !e.target.closest('#pop')) closePop(); }, true);

let BANK={tab:'list', q:'', fi:0, flip:false, order:VORDER.slice()};
function openBank(){ BANK.flip=false; openModal(bankHTML(),'wide'); bindBank(); }
function bankRows(){ const q=BANK.q.trim().toLowerCase();
  const list=VORDER.filter(k=>{ const V=VOCAB[k]; return !q || [V.t,V.en,V.ua,V.ex].join(' ').toLowerCase().includes(q); });
  return list.length ? list.map(k=>{ const V=VOCAB[k]; return `<div class="vbi ${S.seen[k]?'seen':''}"><div class="row" style="align-items:flex-start;gap:8px"><div class="t grow">${esc(V.t)}</div><button class="btn sm ghost" data-say="${k}" aria-label="Listen to ${esc(V.t)}">🔊</button></div>
    <div style="font-size:15px;margin-top:4px">${esc(V.en)}</div><div class="u">🇺🇦 ${esc(V.ua)}</div><div class="e">“${esc(V.ex)}”</div>${S.seen[k]?'':'<div class="small" style="margin-top:4px">not met in the story yet</div>'}</div>`; }).join('')
    : `<p class="muted">No expression matches “${esc(BANK.q)}”. Try English or Ukrainian words, e.g. “friend” or “друг”.</p>`; }
function bankHTML(){
  const head=`<div class="row"><h2 class="h-m grow">📚 Vocabulary Bank</h2><button class="btn sm ghost" data-close aria-label="Close">✕</button></div>
   <div class="row mt"><div class="tabs" role="tablist">${[['list','15 new expressions'],['flash','Flashcards'],['old','Learned before']].map(t=>`<button role="tab" class="${BANK.tab===t[0]?'on':''}" data-tab="${t[0]}" aria-selected="${BANK.tab===t[0]}">${t[1]}</button>`).join('')}</div>
   <span class="small">${VORDER.filter(k=>S.seen[k]).length}/15 met in the story</span></div>`;
  if(BANK.tab==='list') return head+`<input class="vsearch mt" id="bq" type="search" placeholder="Search in English or Ukrainian…" value="${esc(BANK.q)}" aria-label="Search expressions"><div class="vb-list" id="brows">${bankRows()}</div>${support3HTML()}`;
  if(BANK.tab==='flash'){ const k=BANK.order[BANK.fi], V=VOCAB[k];
    return head+`<div class="flash"><div class="card3 ${BANK.flip?'flip':''}" id="fc" tabindex="0" role="button" aria-label="Flip the card"><div class="face"><div><div class="t">${esc(V.t)}</div><p class="muted mt">Tap to see the meaning</p></div></div>

/* ---------- 7 · live room ----------
   Учитель — єдине джерело стану. Захист керування:
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток (fingerprint) публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан і завдання ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»;
   • учні надсилають тільки hello / ans / work / submit / react; правильні відповіді доходять на телефони лише після Reveal;
   • один голос на телефон (id у sessionStorage), без акаунтів — лише нік. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();

function studentsN(){ return (LIVE.peers||[]).filter(p=>p&&p.role==='student').length; }
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson21-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson21-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }

const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l21sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l21sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');

      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson21-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson21-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }

async function sendSigned(p){

     <div class="small">Teacher key <b style="font-size:22px;color:var(--noah);letter-spacing:.12em">${shortKey()||'—'}</b> (only for students who type the code)</div>
     <div class="small mt" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div>
     <p class="small mt" style="color:#BFF7DE">🔐 Your messages are signed with a private key that never leaves this browser. Phones obey only this signature — a student can’t take control by opening the teacher page.</p></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:center" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn primary" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--amber)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → phones on other devices can’t connect.</p>'}
   ${canSign()?'':'<p class="small mt" style="color:var(--amber)">This page is not on https, so messages can’t be signed. Open it from GitHub Pages for the live room.</p>'}`);
  $('[data-close]','#modalBox').onclick=closeModal;
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); openLive(); };
  $('#lvCopy').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(joinURL()):Promise.reject()).then(()=>toast('Link copied — paste it into the Zoom chat')).catch(()=>toast(joinURL())); };
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 8 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student'); document.body.dataset.sc='2';
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], sent={}, myTeam='', taskKey='', trust=null, lastTs=0, verified=false;
  try{ name=localStorage.getItem('l21name')||''; avatar=localStorage.getItem('l21av')||avatar; }catch(e){}
  $('#stuWords').onclick=()=>openBank();
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':''); $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','❤️','✋','🔥'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="stack">${['mia','leo','sophie','noah'].map(k=>av(k,44)).join('')}</div>
      <h2 class="dsp mt" style="font-size:30px">Join The Perfect Squad story ❤️</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Your nickname</label><input id="nm" maxlength="20" value="${esc(name)}" placeholder="e.g. Pixel Fox" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">Use a nickname or first name only — no surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,20), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l21name',name); localStorage.setItem('l21av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const join=async()=>{
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    try{ myTeam=localStorage.getItem('l21team-'+room)||''; }catch(e){}
    B.innerHTML=`<div class="stu-wait"><div class="bigi">💫</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ document.body.dataset.sc=String(m.sc||2);
        const T2=m.task, k=JSON.stringify([m.sc, m.step, T2 && Object.assign({},T2,{work:undefined, sub:undefined, names:undefined})]); st=m;
        if(k!==taskKey){ taskKey=k; render(); } else { paintT(); syncTeam(); } }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for your teacher…<br><span class="small">Room ${esc(room)} — are the code and teacher key right? <a href="?join" style="color:var(--noah)">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">❤️</div><h2 class="dsp" style="font-size:32px">Real ones only!</h2><p class="small">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const syncTeam=()=>{ if(!st||!st.task||st.task.kind!=='team'||!myTeam) return; const w=(st.task.work||{})[myTeam]||{};
    $$('[data-tf]',B).forEach(ta=>{ if(document.activeElement!==ta && typeof w[ta.dataset.tf]==='string' && ta.value!==w[ta.dataset.tf]) ta.value=w[ta.dataset.tf]; });
    const sb=$('#sbm',B); if(sb && (st.task.sub||{})[myTeam]) sb.textContent='✓ Submitted — you can still edit'; };
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait"><div class="bigi">👀</div><p>Hi ${esc(avatar+' '+name)}! Waiting for your teacher…</p></div>`; return; }
    const T2=st.task, head=`<div class="stu-prog">${SCENES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div>
      <div class="small" style="margin-bottom:10px;font-weight:700">${st.e||''} Scene ${st.sc} · ${esc(st.title||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
    if(!T2){ B.innerHTML=head+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">${esc(st.step||'')}</p><p class="small">Your teacher will send a question soon. Tap 📚 for the 15 new expressions.</p></div>`; return; }
    if(T2.kind==='choice'){
      const my=sent[T2.id], dec=T2.chosen!=null;
      B.innerHTML=head+`<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(T2.q)}</p><div class="opts">${T2.opts.map((o,i)=>`<button class="opt ${dec&&T2.chosen===i?'right':T2.lock&&T2.correct===i?'right':my===i?(T2.lock&&T2.correct!=null?'wrong':'pick'):''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${dec?`The class chose ${LET[T2.chosen]}. Look at the main screen.`:T2.lock?(T2.correct==null?'✓ Voting closed.':my===T2.correct?'🎉 Correct!':'✓ The answer is on the main screen.'):my!==undefined?'✓ Sent! You can change your answer.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T2.lock) return; sent[T2.id]=+b.dataset.i; Net.send({t:'ans', task:T2.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T2.kind==='text'){
      B.innerHTML=head+`<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(T2.q)}</p><textarea id="tx" maxlength="140" placeholder="${esc(T2.ph||'')}"></textarea><button class="btn primary mt" id="sd" style="width:100%">Send</button>
        <p class="small mt">${sent[T2.id]?'✓ Sent: “'+esc(sent[T2.id])+'”. You can send a new version.':'You can also answer out loud in Zoom. Your teacher may show your answer on the screen.'}</p></div>`;
      const go2=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T2.id]=v; Net.send({t:'ans', task:T2.id, v}); render(); };
      $('#sd').onclick=go2;
      return;
    }
    if(T2.kind==='team'){
      const t=(T2.teams||[]).find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="stu-card"><p style="font-size:20px;font-weight:800">🛡️ Which team are you in?</p><p class="small">Your teacher tells you your team.</p><div class="opts">${T2.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>${esc(x.name)}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l21team-'+room,myTeam); }catch(e){} render(); }); return; }
      const w=(T2.work||{})[myTeam]||{}, sub=(T2.sub||{})[myTeam];
      B.innerHTML=head+`<div class="stu-card"><div class="row"><span style="font-size:30px">${t.e}</span><div class="grow"><b style="font-size:19px">${esc(t.name)}</b><div class="small" id="stuT"></div></div><button class="btn sm ghost" id="chg">change team</button></div>
        <p class="small mt"><b>THE REAL SQUAD CODE 🛡️</b> Write one short rule for each problem. Use at least three new expressions. Your team sees the same text.</p>
        ${T2.probs.map((p,i)=>`<label for="tf-${p.f}">Problem ${i+1}: ${esc(p.t)}<br><span class="small">${esc(p.q)}</span></label><textarea id="tf-${p.f}" data-tf="${p.f}" maxlength="200" placeholder="Rule ${i+1}…">${esc(w[p.f]||'')}</textarea>`).join('')}
        <div class="small mt" id="used"></div>
        <div class="row mt"><button class="btn sm ghost" id="vh">📚 Words</button><button class="btn primary" id="sbm" style="flex:1">${sub?'✓ Submitted — you can still edit':'📤 Submit our rules'}</button></div>
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      const showUsed=()=>{ const all=$$('[data-tf]',B).map(x=>x.value).join(' '), u=usedV(all); $('#used',B).textContent=u.length?`New expressions used: ${u.length} (${u.map(k=>VOCAB[k].t).join(', ')})${u.length>=3?' ✓':''}`:'New expressions used: 0 — aim for 3'; }; showUsed();
      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l21team-'+room); }catch(e){} render(); };
      $('#vh').onclick=()=>openBank();
      const sendAll=()=>$$('[data-tf]',B).forEach(ta=>Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,200)}));
      $('#sbm').onclick=()=>{ sendAll(); setTimeout(()=>Net.send({t:'submit', team:myTeam}),300); $('#sbm').textContent='✓ Submitted — you can still edit'; };
      $$('[data-tf]',B).forEach(ta=>{ let tm=null; ta.oninput=()=>{ $('#ok').textContent='…'; showUsed(); clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,200)}); $('#ok').textContent='✓ Saved — your team and teacher can see it.'; },600); }; });
      return;
    }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if($('#pop')) return closePop(); if(!$('#modal').classList.contains('hidden')) return closeModal(); if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  const tag=document.activeElement && document.activeElement.tagName;
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(e.key==='r'||e.key==='R') reveal();
  else if(e.key==='v'||e.key==='V') openBank();
  else if(e.key==='t'||e.key==='T') toggleNotes();
  else if(e.key==='p'||e.key==='P') present();
});
if(ROLE==='student'){ VN.init(); studentApp(); }
else {
  applyAnim(); VN.init(); buildRail();
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bSkip').onclick=skipOpt; $('#bRestart').onclick=askRestart;
  $('#bWords').onclick=openBank; $('#bNotes').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false);
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  draw();
  if(S.live) startLive(true);
}
