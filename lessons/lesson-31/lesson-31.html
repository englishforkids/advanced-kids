.optl{font-size:.68rem;font-weight:800;letter-spacing:.08em;border:1px dashed var(--line2);border-radius:999px;padding:.1rem .5rem;color:var(--vio2)}

/* question / answer */
.qcard{padding:1.4rem 1.6rem}
.qtext{font-size:1.85rem;line-height:1.2;font-family:var(--fd);font-weight:700}
.ans{margin-top:1rem;border:1px solid rgba(62,224,165,.45);background:rgba(62,224,165,.1);border-radius:16px;padding:.8rem 1rem;font-size:1.1rem;font-weight:600}
.ans b{color:var(--ok)}
.hint{margin-top:.8rem;border:1px solid rgba(255,200,92,.4);background:rgba(255,200,92,.09);border-radius:14px;padding:.6rem .9rem;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.3rem .75rem;font-weight:700;font-size:.88rem}
.chip.hit{border-color:var(--ok);background:rgba(62,224,165,.18);color:#fff;box-shadow:0 0 0 3px rgba(62,224,165,.2)}
.chip.dim{opacity:.4}

/* vocab cards */
.vsrc{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
.vsrc .tag{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr);gap:.4rem;border:1px solid var(--line);border-radius:18px;padding:.75rem .95rem;background:rgba(255,255,255,.035)}
.vrow .ex{font-family:var(--fd);font-size:1.4rem;font-weight:800}
.vrow .acts{display:flex;gap:.35rem;flex-wrap:wrap}
.vrow .out{font-size:1.05rem;font-weight:600}
.vrow .out .lb{font-size:.68rem;letter-spacing:.12em;font-weight:800;color:var(--tx2);margin-right:.4rem}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.guess{border:1px dashed rgba(255,200,92,.55);background:rgba(255,200,92,.08);border-radius:16px;padding:.6rem .9rem;font-weight:700}

/* feed */
.feed{display:flex;flex-direction:column;gap:.4rem}
.cm{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:.45rem .8rem;background:rgba(255,255,255,.045)}
.cm .ua2{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:#0B1020}
.cm .u{font-size:.75rem;font-weight:800;color:var(--tx2)}
.cm .t{font-size:1.1rem;font-weight:600;line-height:1.3}
.cm .lk{font-size:.72rem;color:var(--tx2);margin-top:.15rem}
.cm .lab{margin-left:auto;align-self:center;font-size:.72rem;font-weight:800;border-radius:999px;padding:.15rem .55rem;white-space:nowrap}
.lab.pos{background:rgba(62,224,165,.16);color:#B8F5DD;border:1px solid rgba(62,224,165,.4)}
.lab.neg{background:rgba(255,138,120,.14);color:#FFD2CA;border:1px solid rgba(255,138,120,.45)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.stat{border-radius:22px;padding:1rem 1.2rem;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat .v{font-family:var(--fd);font-size:2.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:.85rem;color:var(--tx2);font-weight:700;margin-top:.3rem;letter-spacing:.06em;text-transform:uppercase}
.bigtitle{font-family:var(--fd);font-weight:800;font-size:clamp(2.6rem,7vw,5.4rem);letter-spacing:.02em;text-align:center;text-shadow:0 10px 40px rgba(0,0,0,.6)}

/* video */
.vid{position:relative;aspect-ratio:9/16;height:100%;max-height:100%;border-radius:26px;overflow:hidden;background:#0B0F22;border:1px solid var(--line2);box-shadow:0 30px 70px -25px rgba(0,0,0,.8);margin:0 auto}
.vid video,.vid .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .vc{position:absolute;left:.6rem;right:.6rem;bottom:.6rem;display:flex;gap:.35rem;align-items:center;background:rgba(9,13,29,.72);backdrop-filter:blur(8px);border-radius:14px;padding:.35rem}
.vid .vc .btn{min-height:2rem}
.vid .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.15)}
.vid .prog i{display:block;height:100%;width:0;background:var(--coral)}
.vid .cc{position:absolute;left:8%;right:8%;bottom:4.2rem;text-align:center;font-weight:800;font-size:1rem;pointer-events:none}
.vid .cc span{background:rgba(0,0,0,.72);border-radius:8px;padding:.2rem .5rem;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.6}
.vid .miss{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem;background:linear-gradient(0deg,rgba(9,13,29,.92),rgba(9,13,29,.2) 60%)}
.vid .big{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:4.6rem;height:4.6rem;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:1.7rem;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.vwrap{display:flex;justify-content:center;min-height:0;height:100%}

/* votes */
.vote{display:flex;flex-direction:column;gap:.6rem}
.vopt{position:relative;display:flex;align-items:center;gap:.8rem;border:1px solid var(--line);border-radius:18px;padding:.75rem 1rem;background:rgba(255,255,255,.045);text-align:left;overflow:hidden;width:100%}
.vopt .L{display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:12px;background:rgba(139,92,246,.3);font-family:var(--fd);font-weight:800;font-size:1.15rem;flex:none}
.vopt .tx{font-size:1.18rem;font-weight:700;position:relative;z-index:1}
.vopt .fillbar{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(139,92,246,.3),rgba(92,200,255,.18));transition:width .5s}
.vopt .n{margin-left:auto;font-family:var(--fd);font-weight:800;font-size:1.3rem;position:relative;z-index:1}
.vopt.win{border-color:var(--ok);box-shadow:0 0 0 2px rgba(62,224,165,.35)}
.vopt .tally{display:flex;gap:.25rem;position:relative;z-index:1;margin-left:.4rem}
.vopt.sel{border-color:var(--vio2);box-shadow:0 0 0 2px rgba(185,162,255,.35)}

/* speaking cards */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.8rem}
.dcard{aspect-ratio:3/4;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(150deg,#3B2A86,#1A2250 60%,#3A2032);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;font-family:var(--fd);font-weight:800;font-size:2rem;transition:transform .15s}
.dcard:hover{transform:translateY(-4px) rotate(-1deg)}
.dcard small{font-family:var(--fb);font-size:.72rem;letter-spacing:.14em;color:var(--tx2)}
.dcard.used{opacity:.3;pointer-events:none}
.scard{border-radius:26px;padding:1.4rem 1.6rem;background:linear-gradient(150deg,rgba(139,92,246,.35),rgba(30,38,90,.8) 55%,rgba(255,138,120,.18));border:1px solid var(--line2)}
.follow{margin-top:1rem;border-top:1px dashed var(--line2);padding-top:.8rem;font-size:1.2rem;font-weight:700}
.peer{display:flex;gap:.4rem;flex-wrap:wrap}
.peer .chip{font-size:.85rem}

/* mission & breakout */
.els{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.el{border:1px solid var(--line);border-radius:20px;padding:.9rem 1rem;background:rgba(255,255,255,.045)}
.el .no{font-family:var(--fd);font-size:.8rem;font-weight:800;color:var(--coral);letter-spacing:.14em}
.el .h{font-family:var(--fd);font-size:1.4rem;font-weight:800;margin:.1rem 0}
.el .q{font-size:1.05rem;color:#DDE2FF;font-weight:600}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.8rem}
.grp{border:1px solid var(--line2);border-radius:20px;padding:.8rem .9rem;background:rgba(255,255,255,.05)}
.grp .gh{font-family:var(--fd);font-weight:800;font-size:1.15rem;margin-bottom:.45rem}
.mem{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem;margin:.15rem;font-weight:700;background:rgba(255,255,255,.06)}
button.mem:hover{border-color:var(--vio2)}
.timer{font-family:var(--fd);font-weight:800;font-size:3.4rem;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--amb)}
.timer.out{color:var(--coral)}
.prompts{display:flex;flex-direction:column;gap:.6rem}
.prompts div{font-size:1.35rem;font-weight:700;border-left:4px solid var(--vio);padding:.35rem .8rem;background:rgba(255,255,255,.04);border-radius:0 14px 14px 0}

/* responses wall */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem}
.rsp{border:1px solid var(--line);border-radius:16px;padding:.6rem .8rem;background:rgba(255,255,255,.06);font-weight:600}
.rsp .who{font-size:.72rem;color:var(--tx2);font-weight:800}

/* ending */
.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.sparkles i{position:absolute;bottom:-10px;width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.0;animation:rise var(--d) ease-in var(--dl) infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-95vh) scale(1.1)}}
body.noanim .sparkles{display:none}

/* game zone */
.gtabs{display:flex;gap:.4rem;flex-wrap:wrap}
.vt{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem}
.vt th{position:sticky;top:0;background:#1A2150;text-align:left;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);padding:.5rem .7rem}
.vt td{padding:.48rem .7rem;border-top:1px solid var(--line);vertical-align:top;line-height:1.25}
.vt td:first-child{font-family:var(--fd);font-weight:800;font-size:1.08rem;white-space:nowrap}
.vt tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.vt.compact{font-size:.82rem}
.vt.compact td{padding:.28rem .55rem}
.vt.compact td:first-child{font-size:.95rem}
.vtbox{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:18px;background:rgba(10,14,32,.75)}
.vtbox.fs{position:fixed;inset:0;z-index:80;border-radius:0;padding:1rem 1.4rem;background:#0A0E20}
.vtbox.fs .vt{font-size:1.15rem}
.vtbox.fs .vt td:first-child{font-size:1.3rem}
.kq{border:1px solid var(--line);border-radius:16px;padding:.7rem .9rem;background:rgba(255,255,255,.04);margin-bottom:.6rem}
.kq .o{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin-top:.4rem}
.kq .o div{border:1px solid var(--line);border-radius:10px;padding:.3rem .55rem;font-size:.9rem}
.kq .o div.ok{border-color:var(--ok);background:rgba(62,224,165,.14)}
.secret{border:1px dashed var(--amb);border-radius:16px;padding:.6rem .8rem;background:rgba(255,200,92,.08)}

/* overlays */
#modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(4,6,16,.72);backdrop-filter:blur(6px);padding:1rem}
#modalBox{width:min(46rem,100%);max-height:92vh;overflow:auto;background:#121937;border:1px solid var(--line2);border-radius:24px;padding:1.3rem 1.4rem}
#toast{position:fixed;left:50%;bottom:5rem;transform:translate(-50%,20px);opacity:0;background:#1E2756;border:1px solid var(--line2);border-radius:14px;padding:.6rem 1rem;font-weight:700;z-index:95;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#reacts{position:fixed;right:1.5rem;bottom:5rem;z-index:60;pointer-events:none;width:3rem;height:60vh}
#reacts span{position:absolute;bottom:0;font-size:2rem;animation:flt 3s ease-out forwards}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-50vh);opacity:0}}

/* welcome / lobby */
#lobby{position:fixed;inset:0;z-index:70;overflow:auto;background:#090D1D}
#lobby .lbg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.55}
#lobby .lbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,13,29,.35),rgba(9,13,29,.92) 70%)}
#lobby .lin{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:2rem clamp(1rem,4vw,3.5rem) 2.2rem;gap:1.2rem;max-width:80rem;margin:0 auto}
.cast{display:flex;gap:1rem;flex-wrap:wrap}
.castc{display:flex;gap:.8rem;align-items:center;border:1px solid var(--line);border-radius:20px;padding:.6rem .9rem .6rem .6rem;background:rgba(13,18,40,.7);backdrop-filter:blur(10px);max-width:24rem}
.castc .bio{font-size:.82rem;color:var(--tx2)}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}

/* live dock */
#dock{position:fixed;left:calc(var(--rail) + .8rem);bottom:calc(var(--fh) + .8rem);width:19rem;max-height:46vh;overflow:auto;z-index:40;background:rgba(14,19,44,.96);border:1px solid var(--line2);border-radius:18px;padding:.7rem .8rem;font-size:.8rem;display:none}
#dock.on{display:block}
#dock.min #dockBody{display:none}
body.focus #dock, body.screen #dock{display:none}
.led{width:.6rem;height:.6rem;border-radius:50%;background:var(--amb);display:inline-block}
.led.on{background:var(--ok)}
.led.bad{background:var(--coral)}
.dbar{margin:.25rem 0}
.dbar .tr{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.dbar .tr i{display:block;height:100%;background:var(--vio2)}

/* student phone app */
#stu{display:none}
body.student #app, body.student #lobby{display:none!important}
body.student{overflow:auto;height:auto;min-height:100dvh;background:radial-gradient(600px 400px at 80% 0,rgba(91,108,255,.3),transparent 60%),var(--bg)}
body.student #stu{display:block;max-width:34rem;margin:0 auto;padding:1rem 1rem 6rem}
.stu-head{display:flex;align-items:center;gap:.5rem;padding:.4rem 0 .8rem}
.stu-card{border:1px solid var(--line);border-radius:22px;padding:1.1rem;background:rgba(18,24,52,.85);margin-top:.8rem}
.stu-card label{display:block;font-size:.8rem;font-weight:800;color:var(--tx2);margin:.8rem 0 .3rem}
.stu-card input,.stu-card textarea{width:100%;font-size:1.1rem;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:12px;padding:.7rem .8rem}
.stu-card .btn{min-height:3rem;font-size:1.05rem}
.stu-big{font-family:var(--fd);font-size:1.5rem;font-weight:800;line-height:1.2}
.avpick{display:flex;flex-wrap:wrap;gap:.35rem}
.avpick button{font-size:1.5rem;width:2.8rem;height:2.8rem;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.avpick button.on{border-color:var(--vio2);background:rgba(139,92,246,.3)}
#stuFoot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:.4rem;padding:.6rem;background:rgba(9,13,29,.92);border-top:1px solid var(--line)}
#stuFoot button{font-size:1.5rem;width:3rem;height:3rem;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.myturn{border-color:var(--cy)!important;box-shadow:0 0 0 3px rgba(92,200,255,.25)}
.verif{font-size:.72rem;color:var(--ok);font-weight:800}

/* role visibility: .ctl = in-content controls (hidden on the audience screen), .tonly = teacher-only (hidden in Focus + audience) */
body.screen .ctl, body.screen .tonly, body.focus .tonly{display:none!important}
#bg.hero::after{background:radial-gradient(ellipse at center,rgba(9,13,29,.5) 0%,rgba(9,13,29,.85) 75%)}

/* responsiveness */
@media (max-width:1100px){ :root{--rail:0px} #rail{display:none} #dock{left:.8rem} }
@media (max-width:820px){
  body:not(.student){overflow:auto}
  .duo,.duo.even,.duo.wide{grid-template-columns:1fr}
  .duo>.side{display:none}
  .els,.stats{grid-template-columns:1fr}
  .vgrid{grid-template-columns:1fr}
  #eps .ep:not(.cur){display:none}
  .lbl{display:none}
}
@media (max-height:640px){ .story{font-size:1.25rem} .qtext{font-size:1.5rem} .h-l{font-size:1.7rem} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
body.noanim *{transition:none!important}
</style>

<script>
/* ============================================================
   Lesson 31 · My Hobby Went Viral! 📱 · Unit 4 · My Weird Obsession
   Advanced Kids 2.0 — student-led, story-driven, practice-first.
   Vanilla JS, один файл, без збірки.
   1 · helpers   2 · lesson content   3 · state & class   4 · smart turns   5 · timers
   6 · ui helpers   7 · steps   8 · engine   9 · lobby   10 · teacher dashboard
   11 · audience window   12 · live room   13 · student app   14 · boot
   ============================================================ */
const CFG = window.LESSON_CONFIG || {};
const R0 = r => typeof r==='string' ? (document.querySelector(r)||document) : (r||document);
const $  = (s,r=document)=>R0(r).querySelector(s);
const $$ = (s,r=document)=>[...R0(r).querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs = new URLSearchParams(location.search);
const ROLE = (qs.get('role')==='student' || qs.has('join')) ? 'student' : (qs.get('view')==='screen' ? 'screen' : 'teacher');
const TEACH = ROLE==='teacher';
const uid = ()=> Math.random().toString(36).slice(2,10);
const rand4 = ()=> String(1000+Math.floor(Math.random()*9000));

/* ---------- 4 · smart turns ----------
   Блок (block) — практичне завдання з N × R ходами (N — присутні учні, R — ходів на учня).
   • Ходи розподіляються рівномірно: спершу той, у кого найменше ходів у цьому блоці, потім — загалом, потім по колу.
   • Виконані ходи (✓) ніколи не стираються. Якщо змінилася кількість учнів — перерозподіляються лише невиконані.
   • Учень, якого немає (відсутній), автоматично замінюється на іншого. */
const tbGet = id => (S.tb[id] = S.tb[id] || {i:0, a:[], opt:0});
function pickFor(id, j, exclude=[]){
  const A=avail(); if(!A.length) return null;
  const T=tbGet(id), cntB={};
  T.a.forEach((x,k)=>{ if(x && k!==j) cntB[x.sid]=(cntB[x.sid]||0)+1; });
  const prev = j>0 && T.a[j-1] ? T.a[j-1].sid : null, n=S.students.length;
  let pool=A.filter(s=>!exclude.includes(s.id)); if(!pool.length) pool=A;
  let best=null, bv=1e12;
  pool.forEach(s=>{ const idx=S.students.indexOf(s), rot=(idx-(S.rot||0)+n)%n;
    const v=(cntB[s.id]||0)*1e6 + (s.id===prev && pool.length>1 ? 5e5 : 0) + (S.part[s.id]||0)*100 + rot;
    if(v<bv){ bv=v; best=s; } });
  S.rot=(S.students.indexOf(best)+1)%n; return best.id;
}
/* total — скільки ходів у блоці зараз; повертає блок із призначеними учнями */
function tbEnsure(id, total){
  const T=tbGet(id); if(!TEACH) return T;
  for(let j=0;j<total;j++){ const a=T.a[j];
    if(!a || (!a.done && !avail().some(s=>s.id===a.sid))) T.a[j]={sid:pickFor(id,j), done:false}; }
  return T;
}
const doneCount = id => (tbGet(id).a||[]).filter(x=>x&&x.done).length;
function tbDone(id, j){ const T=tbGet(id), a=T.a[j]; if(a && !a.done && a.sid){ a.done=true; S.part[a.sid]=(S.part[a.sid]||0)+1; } }
function tbToggle(id, j){ const T=tbGet(id), a=T.a[j]; if(!a) return; if(a.done){ a.done=false; S.part[a.sid]=Math.max(0,(S.part[a.sid]||0)-1); } else tbDone(id,j); }
function tbPass(id, j){ const T=tbGet(id), a=T.a[j]; if(!a || a.done) return; const sid=pickFor(id,j,[a.sid]); if(sid && sid!==a.sid) a.sid=sid; else toast('Nobody else is available'); }
function tbCycle(id, j){ const T=tbGet(id), a=T.a[j], A=avail(); if(!a||!A.length) return; const i=A.findIndex(s=>s.id===a.sid); a.sid=A[(i+1)%A.length].id; }
/* required turns: N × R, but never fewer than turns already done, never more than available items */
const reqN = (R, items, min=1) => Math.min(items, Math.max(min, NS()*R));
function resetTurns(){ S.part={}; S.tb={}; S.rot=0; S.picks={}; }

/* ---------- 5 · timers ---------- */
const now = ()=>Date.now();
const el = t => t.at ? t.acc + (now()-t.at)/1000 : t.acc;
const cd = t => t.at ? Math.max(0, t.left-(now()-t.at)/1000) : t.left;
const TM = {
  lesson(){ return el(S.tm.lesson); }, ep(){ return el(S.tm.ep); }, run(){ return !!S.tm.lesson.at; },
  toggle(){ const L=S.tm.lesson, E=S.tm.ep; if(L.at){ L.acc=el(L); L.at=0; E.acc=el(E); E.at=0; } else { L.at=now(); E.at=now(); } save(); paintTimers(); },
  start(){ if(!S.tm.lesson.at) TM.toggle(); },
  reset(){ S.tm.lesson={acc:0,at:0}; S.tm.ep={acc:0,at:0,n:epOf(S.i)}; save(); paintTimers(); },
  newEp(n){ if(S.tm.ep.n===n) return; S.tm.ep={acc:0, at:S.tm.lesson.at?now():0, n}; },
  /* countdowns: 'bo' (breakout), 'gz' (Guess the Obsession) — never move the lesson on automatically */
  left(k){ return cd(S.tm[k]); }, on(k){ return !!S.tm[k].at && cd(S.tm[k])>0; },
  go(k){ const b=S.tm[k]; if(!b.at){ if(b.left<=0) b.left=b.dur; b.at=now(); } save(); paintTimers(); pub(); },
  pause(k){ const b=S.tm[k]; if(b.at){ b.left=cd(b); b.at=0; } save(); paintTimers(); pub(); },
  flip(k){ TM.on(k)?TM.pause(k):TM.go(k); },
  rst(k,d){ const b=S.tm[k]; if(d) b.dur=d; b.left=b.dur; b.at=0; save(); paintTimers(); pub(); },
  add(k,s){ const b=S.tm[k], l=cd(b); b.left=Math.max(0,l+s); if(b.at) b.at=now(); save(); paintTimers(); pub(); }
};
const rang = {};
function paintTimers(){
  const c=$('#clock'); if(c){ const t=TM.lesson(); c.textContent=(TM.run()?'⏱ ':'⏸ ')+mmss(t)+' / '+CORE_MIN; c.classList.toggle('run',TM.run()); c.classList.toggle('over',t>CORE_MIN*60); }
  ['bo','gz'].forEach(k=>{ const l=TM.left(k), run=TM.on(k);
    $$(`[data-tmr="${k}"]`).forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=30&&l>0); e.classList.toggle('out',l<=0); });
    $$(`[data-tmb="${k}"]`).forEach(e=>{ e.textContent=run?'⏸ Pause':'▶ Start'; });
    if(S.tm[k].at && l<=0 && !rang[k]){ rang[k]=1; if(TEACH) toast('⏰ Time is up!'); } if(l>0) rang[k]=0; });
  $$('[data-tmr="lesson"]').forEach(e=>e.textContent=mmss(TM.lesson()));
  $$('[data-tmr="ep"]').forEach(e=>e.textContent=mmss(TM.ep()));
}

}
/* block helper for steps: total = required + optional extra turns */
function blk(id, req, max){ const T=tbGet(id); req=Math.min(req,max); const total=Math.min(max, Math.max(req+(T.opt||0), doneCount(id), T.i+1)); tbEnsure(id,total); if(T.i>=total) T.i=total-1; return {T, total, req, max}; }
function blkAdv(id, b){ const T=tbGet(id); tbDone(id,T.i); if(T.i<b.total-1){ T.i++; return true; } return false; }
function blkRet(id){ const T=tbGet(id); if(T.i>0){ T.i--; return true; } return false; }

/* votes: hands counted by the teacher + phone votes */
function vcount(id,n){ const c=Array.from({length:n},(_,i)=>(S.votes[id]||[])[i]||0); Object.values(S.lv[id]||{}).forEach(v=>{ if(v>=0&&v<n) c[v]++; }); return c; }

    if(a==='done') tbToggle(id,T.i); if(a==='pass') tbPass(id,T.i); if(a==='more'){ T.opt=(T.opt||0)+1; }

/* ---------- video (one persistent player, so re-drawing never interrupts playback) ---------- */
const VID = { wrap:null, v:null, missing:false, screenAt:0,
  build(){
    if(this.wrap) return this.wrap;
    const w=document.createElement('div'); w.className='vid'; w.id='vidbox';
    w.innerHTML=`${VCFG.poster?`<img class="poster" src="${esc(VCFG.poster)}" alt="Leo’s miniature city — video cover" onerror="this.remove()">`:''}
      <video playsinline preload="metadata" ${VCFG.poster?`poster="${esc(VCFG.poster)}"`:''} aria-label="Leo and Mia’s 10-second video"><source src="${esc(VCFG.src||'')}" type="video/mp4"></video>
      <div class="cc" aria-live="polite"></div>
      <button class="big ctl" aria-label="Play video">▶</button>
      <div class="vc ctl"><button class="btn sm" data-v="play">▶ Play</button><button class="btn sm ghost" data-v="replay" title="Replay">↺</button><button class="btn sm ghost" data-v="mute" title="Sound on / off">🔊</button><button class="btn sm ghost" data-v="cc" title="Captions on / off">CC</button><span class="small grow" style="text-align:right" data-v="time">0:00 / 0:10</span></div>
      <div class="prog"><i></i></div><div class="miss hidden"></div>`;
    const v=$('video',w); this.wrap=w; this.v=v;
    const src=$('source',w);
    const fail=()=>{ this.missing=true; this.paint(); };
    src.addEventListener('error',fail); v.addEventListener('error',fail);
    if(!VCFG.src) this.missing=true;
    setTimeout(()=>{ if(v.networkState===3) fail(); },2500);
    v.addEventListener('loadedmetadata',()=>{ this.missing=false; this.paint(); });
    ['play','pause','ended','timeupdate','volumechange'].forEach(e=>v.addEventListener(e,()=>this.paint()));
    $$('[data-v]',w).forEach(b=>{ if(b.tagName==='BUTTON') b.onclick=()=>this.cmd(b.dataset.v); });
    $('.big',w).onclick=()=>this.cmd('play');
    this.paint(); return w;
  },
  cmd(a, fromTeacher){
    const v=this.v; if(!v) return;
    if(a==='cc'){ if(TEACH){ S.cc=!S.cc; save(); } this.paint(); return; }
    if(a==='mute'){ v.muted=!v.muted; this.paint(); return; }
    if(this.missing){ if(TEACH) toast('The video file is missing'); return; }
    /* audience window = picture only (always muted); the sound comes from the teacher’s page —
       in Zoom use “Share sound”. So there is never an echo and no autoplay block. */
    if(ROLE==='screen') v.muted=true;
    if(TEACH) postScreen({t:'vid', a});
    if(a==='play'){ if(v.paused){ if(v.ended) v.currentTime=0; v.play().catch(()=>{}); } else v.pause(); }
    if(a==='replay'){ v.currentTime=0; v.play().catch(()=>{}); }
    if(a==='pause') v.pause();
  },
  paint(){
    const w=this.wrap, v=this.v; if(!w) return;
    const miss=$('.miss',w); miss.classList.toggle('hidden',!this.missing);
    if(this.missing) miss.innerHTML = TEACH
      ? `<div class="dsp" style="font-size:1.2rem">🎬 Video file not found</div><p class="small mt">Add the students’ video as <b>lessons/lesson-31/${esc(VCFG.src||'media/leo-mia-viral-video.mp4')}</b> (or change <b>VIDEO.src</b> at the top of this file). The lesson works without it — describe the video and move on.</p>`
      : `<div class="dsp" style="font-size:1.2rem">🎬 Leo’s video</div><p class="small mt">The video isn’t available right now — imagine it: the tiny city, Leo, Mia… and the lights!</p>`;
    $('.big',w).classList.toggle('hidden', !v.paused || this.missing);
    $('.vc',w).classList.toggle('hidden', this.missing);
    const p=$('[data-v="play"]',w); if(p) p.textContent=v.paused?'▶ Play':'⏸ Pause';
    const m=$('[data-v="mute"]',w); if(m) m.textContent=v.muted?'🔇':'🔊';
    const c=$('[data-v="cc"]',w); if(c) c.classList.toggle('on',!!S.cc);
    const d=v.duration||10, t=v.currentTime||0;
    $('.prog i',w).style.width=(t/d*100)+'%';
    const tm=$('[data-v="time"]',w); if(tm) tm.textContent=mmss(t)+' / '+mmss(d);
    const cap=(VCFG.captions||[]).find(x=>t>=x.from&&t<x.to);
    $('.cc',w).innerHTML = S.cc && cap && (t>0) ? `<span>${esc(cap.t)}</span>` : '';
    const po=$('.poster',w); if(po) po.style.display = (t>0||!v.paused) ? 'none' : '';
  }
};

{ id:'yours', ep:3, title:'Speaking cards', k:'Your Obsession', scene:'yours', dim:true,

    const pick=S.picks[j], deckN=clamp(Math.max(5,NS()),5,CARDS.length), used=new Set(Object.entries(S.picks).filter(([k])=>+k!==j).map(([,v])=>v));

    let body;

        <div class="deck mt2">${Array.from({length:deckN},(_,c)=>`<button class="dcard ${used.has(c)?'used':''}" data-pick="${c}" ${TEACH?'':'disabled'}><small>CARD</small>${c+1}<small>${used.has(c)?'taken':'✦'}</small></button>`).join('')}</div>

      body=`<div class="duo wide mt" style="flex:1"><div class="scard fill new" style="justify-content:center;display:flex;flex-direction:column">
        ${tbar('cards',b.total,b.req,b.max,'🗣')}

    const r=$('[data-rand]',v); if(r) r.onclick=()=>{ const j=tbGet('cards').i, deckN=clamp(Math.max(5,NS()),5,CARDS.length), used=new Set(Object.values(S.picks)); const free=[...Array(deckN).keys()].filter(c=>!used.has(c)); const pool=free.length?free:[...Array(deckN).keys()]; S.picks[j]=pool[Math.floor(Math.random()*pool.length)]; commit(); };

function defaultGroups(mode){
  const ids=avail().map(s=>s.id), n=ids.length;
  if(mode==='solo') return ids.map(i=>[i]);
  if(mode==='pairs'){ const g=[]; for(let i=0;i<n;i+=2) g.push(ids.slice(i,i+2)); if(g.length>1 && g[g.length-1].length===1) g[g.length-2].push(g.pop()[0]); return g; }
  const k = n<=3 ? 1 : n<=8 ? 2 : 3, g=Array.from({length:k},()=>[]);
  const sizes=Array.from({length:k},(_,i)=>Math.floor(n/k)+(i>=k-(n%k)?1:0));   /* smaller groups first: 5 → 2 + 3 */
  let p=0; sizes.forEach((sz,i)=>{ g[i]=ids.slice(p,p+sz); p+=sz; }); return g;
}

/* ---------- 12 · live room (optional) ----------
   Учитель — єдине джерело стану. Захист (як у попередніх уроках):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом: учень не може перемикати сцени, бачити відповіді до Reveal тощо;
   • учні надсилають тільки hello / vote / resp / react; учитель перевіряє кожне (поточне завдання, межі, довжину);
   • лише нікнейм, жодних акаунтів і особистих даних; лише Realtime broadcast + presence (без таблиць);
   • без Supabase — чесний режим LOCAL DEMO (лише вкладки цього браузера) або звичайний показ екрана. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','📷'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson31-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson31-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l31sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l31sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {auth:{persistSession:false}});
        this.ch = this.sb.channel('lesson31-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson31-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const n=Date.now(); let ch=false; for(const k in this.peers) if(n-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));
  if(TKEY.ok){ try{ const sig=await TKEY.sign(body); Net.send({t:'sig', body, sig, pk:TKEY.pub}); return; }catch(e){ console.warn(e); } }
  Net.send({t:'raw', body});
}
function curTask(){ if(LOBBY || !S.started) return {kind:'msg', e:'📱', t:'The lesson is about to start…'}; try{ const s=cur(); return s.live?s.live():null; }catch(e){ return null; } }
let pubT=null;
function pub(){
  if(TEACH) pushScreen();
  if(!LIVE.on || !TEACH) return;
  clearTimeout(pubT); pubT=setTimeout(()=>{ const s=cur(), E=EPISODES[s.ep];
    sendSigned({t:'state', ep:s.ep, epn:E.short+' · '+E.name, step:s.title, task:curTask(), timer:{left:Math.ceil(TM.left('bo')), run:TM.on('bo')}}); paintDock(); },120);
}
setInterval(()=>{ if(LIVE.on && TEACH) pub(); },6000);
let redrawT=null;
function softRedraw(){ clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(!typing()) draw(); else paintDock(); },250); }
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || m.from.role!=='student') return;
  const task=curTask();
  if(m.t==='hello'){ pub(); paintDock(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='vote' && task && task.kind==='vote' && m.id===task.id){ const v=+m.v; if(!(Number.isInteger(v) && v>=0 && v<task.opts.length)) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); softRedraw(); return; }
  if(m.t==='resp' && task){ const rid = task.kind==='resp' ? task.id : task.kind==='group' ? task.resp : null; if(!rid || m.id!==rid) return;
    const t=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,120); if(!t) return;
    (S.resp[rid]=S.resp[rid]||{})[id]={n:(AVATARS.includes(m.from.av)?m.from.av+' ':'')+String(m.from.name||'?').slice(0,24), t}; save(); softRedraw(); return; }
}
function floatEmoji(e){ if(!/^[\p{Extended_Pictographic}‍️]{1,8}$/u.test(e||'')) return; const s=document.createElement('span'); s.textContent=e; s.style.left=Math.random()*40+'px'; $('#reacts').appendChild(s); setTimeout(()=>s.remove(),3100); }
function paintDock(){
  const d=$('#dock'); if(!d) return; d.classList.toggle('on',LIVE.on && TEACH); if(!LIVE.on || !TEACH) return;
  const st=Net.status, stTxt={live:'● live (Supabase)', local:'● LOCAL DEMO — this browser only', reconnecting:'● reconnecting…', connecting:'● connecting…', off:'● offline'}[st]||st;
  $('#dockTitle').textContent='Room '+S.room; $('#dockLed').className='led '+(st==='live'?'on':st==='off'?'bad':'');
  const L=studs(); $('#dockCount').textContent=`${L.length} connected · ${stTxt}`;
  const task=curTask(); let h='';
  h+= L.length?`<div class="chips mt">${L.slice(0,40).map(p=>`<span class="chip" style="font-size:.72rem;padding:.1rem .5rem">${esc((AVATARS.includes(p.av)?p.av+' ':'')+(p.name||'?'))}</span>`).join('')}</div>`:`<div class="small mt">Nobody yet — share the link, QR or code (📡 Live).</div>`;
  if(!task) h+=`<div class="small mt">Phones show “look at the main screen”.</div>`;
  else if(task.kind==='vote'){ const n=vcount(task.id,task.opts.length), mx=Math.max(1,...n); h+=`<div class="small mt">${Object.keys(S.lv[task.id]||{}).length} phone votes (+ hands you counted)</div>`+task.opts.map((o,i)=>`<div class="dbar"><span>${esc(o)}</span> <b>${n[i]}</b><div class="tr"><i style="width:${n[i]/mx*100}%"></i></div></div>`).join(''); }
  else if(task.kind==='resp' || task.kind==='group'){ const rid=task.kind==='resp'?task.id:task.resp, R=Object.values(S.resp[rid]||{}); h+=`<div class="small mt"><b>${R.length}</b> answers</div>`+R.slice(-6).map(r=>`<div class="small">• <b>${esc(r.n)}</b>: ${esc(r.t)}</div>`).join(''); }
  else if(task.kind==='turn'){ h+=`<div class="small mt">Phones show: <b>${esc(task.who)}</b>’s turn.</div>`; }
  else h+=`<div class="small mt">Phones show: “${esc(task.t||'')}”</div>`;
  $('#dockBody').innerHTML=h;
}
const baseURL = ()=> location.href.split('?')[0].split('#')[0];
const joinURL = ()=> baseURL()+'?room='+S.room+(TKEY.fp?'&k='+TKEY.fp:'')+'&role=student';
async function startLive(silent){
  const signed=await TKEY.init();
  const kind=await Net.connect({room:S.room, id:S.tid, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save(); pub(); if(!LOBBY) draw();
  if(!silent) toast(!signed?'Live room open — but this page can’t sign messages (needs https)':kind==='supabase'?'Live room open — share the link, QR or code':kind==='local'?'Supabase not reachable — LOCAL DEMO: only tabs in THIS browser can join':'The live room could not start');
  return kind;
}
function stopLive(){ sendSigned({t:'end'}); setTimeout(()=>Net.stop(),300); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); paintDock(); if(!LOBBY) draw(); }
function liveStatus(){
  if(!LIVE.on) return 'not started — the lesson works fully without phones';
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● live (Supabase Realtime)</span>' : Net.status==='local' ? '<span style="color:var(--amb)">● LOCAL DEMO — not real students: only tabs in THIS browser can join (Supabase not configured or not reachable)</span>' : `<span style="color:var(--amb)">● ${esc(Net.status)}</span>`;
  return `${s} · ${studs().length} joined`;
}
async function openLive(){
  await TKEY.init();
  openModal(`<div class="row"><h2 class="h-m grow">📡 Live classroom</h2><button class="btn sm ghost" data-close aria-label="Close">✕</button></div>
   <p class="small mt">Optional. Students join on their own phone with a nickname — no accounts. Phones show the current task, let students vote, send short answers and react. Answers reach phones only after you reveal them. Without a live room the whole lesson runs on your shared screen.</p>
   <div class="row mt2" style="align-items:center;gap:1.4rem"><div class="grow"><div class="small">Room code</div><div class="dsp" style="font-size:4rem;line-height:1">${S.room}</div>
     <div class="small mt">Teacher key <b style="font-size:1.3rem;color:var(--cy);letter-spacing:.12em">${shortKey()||'—'}</b> (only for students who type the code)</div>
     <div class="small mt" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div>
     <p class="small mt" style="color:#BFF7DE">🔐 Your messages are signed with a key that never leaves this browser. Phones obey only this signature.</p></div>
     <img alt="QR code for the student link" width="190" height="190" style="border-radius:18px;background:#fff" src="https://api.qrserver.com/v1/create-qr-code/?size=380x380&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn pri" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--amb)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → only a LOCAL DEMO is possible (tabs in this browser).</p>'}
   ${canSign()?'':'<p class="small mt" style="color:var(--amb)">This page is not on https, so messages can’t be signed. Open it from GitHub Pages for the live room.</p>'}`);
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); openLive(); };
  $('#lvCopy').onclick=()=>copyText(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 13 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], taskKey='', trust=null, lastTs=0, verified=false, sent={};
  try{ name=localStorage.getItem('l31name')||''; avatar=localStorage.getItem('l31av')||avatar; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':''); $('#stuConn').textContent={live:'connected', local:'LOCAL DEMO', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','👏','🔥','💙'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="row" style="gap:6px">${CAST.map(k=>av(k,46)).join('')}</div>
      <h2 class="dsp mt" style="font-size:1.6rem">Join “My Hobby Went Viral!” 📱</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the teacher’s screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Nickname — your first name is best</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Anna" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">No account. No surname. No personal data.</p>
      <button class="btn pri mt" id="jn" style="width:100%">Join</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,24), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l31name',name); localStorage.setItem('l31av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const join=async()=>{
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    B.innerHTML=`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">📱</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ const k=JSON.stringify([m.ep,m.step,m.task]); st=m; if(k!==taskKey){ taskKey=k; render(); } else paintT(); }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn pri mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    if(kind==='local') toast('LOCAL DEMO — this only works inside one browser');
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st){ const w=$('.stu-wait',B); if(w) w.innerHTML=`<p>Hi ${esc(name)}! Waiting for the teacher…</p><p class="small mt">Room ${esc(room)} — are the code and teacher key right? <a href="?join">Change</a></p>`; } },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">✨</div><h2 class="dsp mt" style="font-size:1.6rem">YOUR PASSION MAKES YOU ONE-OF-A-KIND.</h2><p class="small mt">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>nameKey(n)===nameKey(name);
  const head=()=>`<div class="small" style="font-weight:800">${esc(st.epn||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-card stu-wait" style="text-align:center">${av('leo',80)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head();
    if(!T){ B.innerHTML=hd+`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">👀</div><p class="stu-big">Look at the main screen.</p><p class="small mt">Read, listen and be ready to speak!</p></div>`; return; }
    if(T.kind==='look'||T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">${esc(T.e||'👀')}</div><p class="stu-big mt">${esc(T.t)}</p></div>`; return; }
    if(T.kind==='turn'){ const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block||'')}</p>
        <p class="stu-big" style="margin:.4rem 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who||'…')+' is speaking'}</p>
        <p style="font-size:1.2rem;font-weight:700">${esc(T.prompt||'')}</p>${T.fu?`<p class="mt">❓ Follow-up: ${esc(T.fu)}</p>`:''}
        ${T.ans?`<div class="ans mt">✅ ${esc(T.ans)}</div>`:''}</div>`; return; }
    if(T.kind==='vote'){ const my=sent['v:'+T.id];
      B.innerHTML=hd+`<div class="stu-card"><p class="stu-big">${esc(T.q)}</p><div class="col mt">${T.opts.map((o,i)=>`<button class="btn ${my===i?'pri':''}" data-v="${i}" style="justify-content:flex-start;text-align:left;min-height:3.2rem">${esc(o)}</button>`).join('')}</div>
        <p class="small mt">${my!=null?'✓ Vote sent — you can change it.':'Tap to vote.'}</p></div>`;
      $$('[data-v]',B).forEach(b=>b.onclick=()=>{ const v=+b.dataset.v; sent['v:'+T.id]=v; Net.send({t:'vote', id:T.id, v}); render(); }); return; }
    if(T.kind==='resp'||T.kind==='group'){ const rid=T.kind==='resp'?T.id:T.resp, my=sent['r:'+rid];
      let grp=''; if(T.kind==='group'){ const g=(T.groups||[]).find(x=>x.m.some(me)); grp=`<p class="small">${g?'Your team':'Teams'} <span id="stuT"></span></p>${g?`<p class="stu-big">${esc(g.name)}</p><p>${g.m.map(esc).join(' · ')}</p>`:(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(esc).join(', ')}</p>`).join('')}
        <p class="mt"><b>1</b> The hobby · <b>2</b> The hook (first 5 seconds) · <b>3</b> The pitch — use 2+ expressions!</p>`; }
      B.innerHTML=hd+`<div class="stu-card">${grp}<label for="ra">${esc(T.q)}</label><textarea id="ra" maxlength="120" rows="3" placeholder="Max 120 characters">${esc(my||'')}</textarea>
        <button class="btn pri mt" id="rs" style="width:100%">${my?'Update answer':'Send'}</button>${my?'<p class="small mt">✓ Sent to the teacher.</p>':''}</div>`;
      $('#rs').onclick=()=>{ const v=$('#ra').value.trim().slice(0,120); if(!v) return; sent['r:'+rid]=v; Net.send({t:'resp', id:rid, v}); render(); }; paintT(); return; }
    B.innerHTML=hd+`<div class="stu-card"><p>Look at the main screen.</p></div>`;
  };
  if(room && (key.length>=6) && name) join(); else ask();
}

/* ---------- 14 · boot ---------- */
(function boot(){
  if(ROLE==='student'){ studentApp(); return; }
  $('#bBack').onclick=back; $('#bNext').onclick=next;
  $('#bReveal').onclick=()=>act('reveal'); $('#bHide').onclick=()=>act('hide'); $('#bHint').onclick=()=>act('hint');
  $('#retBtn').onclick=()=>go(S.max);
  $('#bFocus').onclick=toggleFocus; $('#bFull').onclick=toggleFull;
  $('#bDash').onclick=toggleDash; $('#dashX').onclick=()=>{ S.dash=false; save(); draw(); };
  $('#bClass').onclick=()=>{ S.dtab='class'; S.dash=true; S.focus=false; save(); draw(); };
  $('#bGame').onclick=()=>goId('gz'); $('#bLive').onclick=openLive; $('#bScreen').onclick=openScreen; $('#bHome').onclick=showLobby;
  $('#clock').onclick=()=>TM.toggle();
  $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  if(ROLE==='screen'){ screenApp(); return; }
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello'){ VID.screenAt=now(); pushScreen(); } };
  setInterval(paintTimers,500);
  draw();
  if(!S.started) showLobby();
  if(S.live) startLive(true);
  window.addEventListener('beforeunload',()=>save());
})();
