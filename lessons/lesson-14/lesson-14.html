/* ─── frame ─── */

.opts{display:grid; gap:12px}

.opt .fill{position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(255,79,163,.22)); transition:width .7s cubic-bezier(.2,.8,.2,1); z-index:0}

@keyframes bump{50%{transform:scale(1.5); color:var(--cyan)}}

body.reveal [data-ok]{box-shadow:0 0 0 3px var(--amber), 0 0 26px rgba(255,200,87,.45)!important}

.bars{display:grid; gap:10px}

.barrow b{text-align:right; font-variant-numeric:tabular-nums}

/* ─── bubbles / chat ─── */
.phone{position:relative; width:min(430px,100%); margin:0 auto; border-radius:46px; padding:12px; background:linear-gradient(160deg,#2A2F6B,#12153F);
  box-shadow:0 30px 80px -24px rgba(0,0,0,.8), inset 0 0 0 1.5px rgba(255,255,255,.15)}
.phone .screen{border-radius:36px; overflow:hidden; background:#0C0F31; min-height:520px; position:relative}

.chat{display:flex; flex-direction:column; border-radius:var(--r-l); overflow:hidden}
.chat-top{display:flex; align-items:center; gap:12px; padding:14px 18px; background:rgba(255,255,255,.05); border-bottom:1px solid var(--edge)}

.msg{display:flex; gap:10px; align-items:flex-end; max-width:86%; animation:pop .38s cubic-bezier(.2,1.2,.3,1) both}

.msg.me{align-self:flex-end; flex-direction:row-reverse}
.msg.me .nm{text-align:right; margin:0 4px 3px 0}
.msg.me .bb{border-radius:20px 20px 6px 20px; background:linear-gradient(135deg,#3C6DF0,#6B4DF2)}
@keyframes pop{from{opacity:0; transform:translateY(10px) scale(.96)}to{opacity:1; transform:none}}
.typing{display:inline-flex; gap:5px; padding:14px 16px; border-radius:20px 20px 20px 6px; background:rgba(255,255,255,.09)}
.typing i{width:8px; height:8px; border-radius:50%; background:var(--muted); animation:dots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,60%,100%{transform:none; opacity:.4}30%{transform:translateY(-5px); opacity:1}}
.ph{display:inline; font-weight:800; color:#FFE3F2; background:linear-gradient(transparent 58%, rgba(255,79,163,.45) 58%); border-radius:3px; padding:0 2px; cursor:pointer; transition:background .2s}
.ph:hover,.ph:focus-visible{background:linear-gradient(transparent 0%, rgba(255,79,163,.45) 0%)}
.ph.seen{color:#D6FFF0; background:linear-gradient(transparent 58%, rgba(67,229,160,.45) 58%)}
.ph.pulse{animation:phpulse 1.8s ease-in-out 2}
@keyframes phpulse{50%{box-shadow:0 0 0 6px rgba(255,79,163,.25)}}
.divider{display:flex; align-items:center; gap:12px; color:var(--faint); font-size:12.5px; font-weight:800; letter-spacing:.04em}
.divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--edge)}

/* ─── viral post ─── */
.post{border-radius:24px; overflow:hidden; background:#0E1238; border:1px solid var(--edge)}
.post-h{display:flex; align-items:center; gap:10px; padding:12px 14px}

@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}}
.floaty{position:absolute; bottom:10%; font-size:24px; pointer-events:none; animation:floaty 2.6s ease-out forwards}

.chip{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:99px; background:var(--glass2); border:1.5px solid var(--edge2); font-weight:800; font-size:16px; transition:.15s; touch-action:none; user-select:none}

.slot{min-height:48px; min-width:180px; display:flex; align-items:center; justify-content:center; gap:8px; padding:6px 12px; border-radius:14px;
  border:2px dashed var(--edge2); color:var(--faint); font-weight:800; transition:.15s; text-align:center}

.slot.wrong{border-color:var(--bad); background:rgba(255,107,129,.13)}
.mrow{display:grid; grid-template-columns:36px 1fr minmax(200px,260px); gap:14px; align-items:center; padding:12px 14px; border-radius:16px; background:var(--glass)}
.mrow .num{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:rgba(139,92,246,.25); font-weight:800}

.note{display:flex; gap:12px; padding:14px 16px; border-radius:16px; font-size:16px; line-height:1.5}

.note.bad{background:rgba(255,107,129,.10); border:1px solid rgba(255,107,129,.35)}

  background:rgba(22,20,40,.96); border:1px solid rgba(255,200,87,.45); border-radius:22px; box-shadow:0 30px 80px -20px #000; transform:translateX(120%); transition:transform .35s cubic-bezier(.2,.8,.2,1)}

.sticky:nth-child(4n){background:linear-gradient(150deg,rgba(255,200,87,.18),rgba(255,200,87,.05))}
.sticky .by{display:block; margin-top:8px; font-size:12.5px; color:var(--muted); font-weight:800}
.sticky .kill{position:absolute; right:8px; top:8px; width:28px; height:28px; border-radius:9px; background:rgba(0,0,0,.35); font-size:13px}
.sticky.off{opacity:.35; border-style:dashed}

/* ─── complete ─── */
.done-hero{text-align:center; padding-top:2vh}
.badge14{width:150px; height:150px; margin:0 auto 10px; animation:spinin 1.1s cubic-bezier(.2,1.3,.3,1) both}
@keyframes spinin{from{transform:scale(.2) rotate(-200deg); opacity:0}to{transform:none; opacity:1}}
.quote{font-size:clamp(26px,3.6vw,44px); font-weight:800; line-height:1.2; margin:26px auto; max-width:22ch}
.quote span{display:block; color:var(--rose)}
.skills{display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
.skill{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:99px; background:rgba(67,229,160,.1); border:1px solid rgba(67,229,160,.4); font-weight:800; animation:pop .4s both}
.skill::before{content:"✓"; color:var(--ok)}

/* ─── map ─── */
.map{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px}
.mapi{text-align:left; padding:14px; border-radius:16px; background:var(--glass); border:1.5px solid var(--edge); display:flex; flex-direction:column; gap:4px}
.mapi .k{font-size:12.5px; color:var(--muted); font-weight:800}
.mapi b{font-size:16px}
.mapi.cur{border-color:var(--pink)}
.mapi.done .k::after{content:" · done ✓"; color:var(--ok)}
.mapi.skip .k::after{content:" · skipped"; color:var(--amber)}
.mapi[disabled]{opacity:.35; cursor:not-allowed}
</style>
</head>

<script>
/* ============================================================
   LESSON 14 · LIKES DON'T EQUAL LOVE · "The Viral Post"
   Vanilla JS, one file, no build. Sections:
   1 utils & state · 2 sound & voice · 3 characters & art
   4 content · 5 scenes · 6 navigation · 7 teacher mode
   8 live room · 9 student app · 10 boot
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r=>setTimeout(r,ms));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }

/* ---------- 1 · state (autosaved to localStorage) ---------- */
const KEY = 'lesson14-likes-v1';
const FRESH = ()=>({
  i:0, max:0, short:false, mode:'present', sound:true,
  done:{}, skipped:{},
  votes:{},                 // taskId -> [counts]  (clicks in the room)
  sd:{},                    // per-scene sub-state
  teams:{A:{},B:{},C:{},D:{}},
  rate:{A:[0,0,0],B:[0,0,0],C:[0,0,0],D:[0,0,0]},
  wall:[],                  // {id,text,name,on}
  room: String(1000+Math.floor(Math.random()*9000)),
  showNames:false
});
let S = FRESH();
try{ const raw=localStorage.getItem(KEY); if(raw) S = Object.assign(FRESH(), JSON.parse(raw)); }catch(e){}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} },120); }
const sd = id => (S.sd[id] = S.sd[id] || {});
function vote(task, idx, n){ const v=(S.votes[task]=S.votes[task]||[]); while(v.length<=idx) v.push(0); v[idx]=Math.max(0,(v[idx]||0)+(n??1)); save(); }

/* ---------- 2 · sound effects (WebAudio, no files) ---------- */
const SFX = {
  ctx:null,
  c(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C(); } return this.ctx; },
  tone(f, t=.12, type='sine', vol=.08, delay=0){
    if(!S.sound) return; const c=this.c(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+t);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+t+.02);
  },
  pop(){ this.tone(880,.09,'sine',.06); this.tone(1320,.08,'sine',.04,.05); },
  ok(){ this.tone(660,.12,'triangle',.08); this.tone(990,.18,'triangle',.07,.09); },
  bad(){ this.tone(220,.16,'sawtooth',.035); this.tone(180,.2,'sawtooth',.03,.08); },
  unlock(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.07,i*.09)); },
  chime(){ [880,660,880,660,1047].forEach((f,i)=>this.tone(f,.35,'sine',.12,i*.28)); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.3,'triangle',.08,i*.1)); }
};

/* ---------- 2b · browser voice (TTS) ---------- */
const Voice = {
  list:[], pick:null,
  load(){
    if(!('speechSynthesis' in window)) return;
    this.list = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const saved = localStorage.getItem('l14voice');
    const byName = n => this.list.find(v=>v.name===n);
    /* prefer modern neural voices; a younger male voice suits Leo */
    const pref = [/Andrew.*Natural/i,/Brian.*Natural/i,/Guy.*Natural/i,/Christopher.*Natural/i,/Eric.*Natural/i,/Ryan.*Natural/i,/Natural/i,
                  /Google US English/i,/Google UK English Male/i,/Daniel/i,/Alex/i,/Aaron/i,/Samantha/i];
    this.pick = (saved && byName(saved)) || pref.map(r=>this.list.find(v=>r.test(v.name))).find(Boolean) || this.list[0] || null;
  },
  natural(){ return this.pick && /Natural|Neural|Online|Google/i.test(this.pick.name); },
  say(text, o={}){
    if(!('speechSynthesis' in window)) { toast('This browser has no speech voice'); return null; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(this.pick) u.voice=this.pick; u.lang=(this.pick&&this.pick.lang)||'en-US';
    u.rate = o.rate||0.95; u.pitch = o.pitch ?? (this.natural()?1.08:1.15); u.volume = o.volume ?? 1;
    if(o.onend) u.onend=o.onend; if(o.onstart) u.onstart=o.onstart;
    speechSynthesis.speak(u); return u;
  }
};
if('speechSynthesis' in window){ Voice.load(); speechSynthesis.onvoiceschanged=()=>Voice.load(); }

/* ---------- 3 · characters (drawn in code, no image files) ---------- */
const CHARS = {
  mia :{name:'Mia',  c:'#FF8FC7', role:'The girl in the viral video'},
  leo :{name:'Leo',  c:'#4D8BFF', role:'Posted the video. Dreams of being a creator'},

};
let avN=0;
const MIA_PHOTO='img/mia.webp';
const NOAH_PHOTO='img/noah.webp';
const LEO_PHOTO='img/leo.webp';
function avatar(k, size=56, mood='neutral'){
  const PH={mia:[MIA_PHOTO,'#6B2F7E'], noah:[NOAH_PHOTO,'#0D5A6A'], leo:[LEO_PHOTO,'#23479C']}[k];
  if(PH){ const cid='mp'+(++avN); return `<svg class="av" viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="${CHARS[k].name}"><clipPath id="${cid}"><rect width="120" height="120" rx="36"/></clipPath><rect width="120" height="120" rx="36" fill="${PH[1]}"/><image href="${PH[0]}" width="120" height="120" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/></svg>`; }
  if(k==='rc') return `<svg class="av" viewBox="0 0 120 120" width="${size}" height="${size}" aria-hidden="true"><defs><linearGradient id="rcg${++avN}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient></defs><rect width="120" height="120" rx="36" fill="url(#rcg${avN})"/><circle cx="54" cy="54" r="22" fill="none" stroke="#fff" stroke-width="8"/><path d="M70 70l18 18" stroke="#fff" stroke-width="10" stroke-linecap="round"/><path d="M45 54l6 6 12-13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const id='a'+(++avN);
  const P = {
    mia :{bg:['#6B2F7E','#1B1644'], skin:'#EDC09E', sh:'#D9A27F', hair:'#3A211E', cloth:'#FF8FC7', eye:'#4A2B20'},
    leo :{bg:['#23479C','#151A4C'], skin:'#F2C9A5', sh:'#DCAA84', hair:'#6E4526', cloth:'#4D8BFF', eye:'#3B5B7A'},
    noah:{bg:['#0D5A6A','#131A44'], skin:'#9C6444', sh:'#85523A', hair:'#1C1512', cloth:'#1FB8D6', eye:'#24160F'}
  }[k];
  const brow = mood==='worried'||mood==='sad'
    ? `<path d="M44 45q6-4 11-1M65 44q5-3 11 1" transform="rotate(0)" fill="none" stroke="${P.hair}" stroke-width="3" stroke-linecap="round"/>`
    : `<path d="M44 44q6-3 11-1M65 43q5-2 11 1" fill="none" stroke="${P.hair}" stroke-width="3" stroke-linecap="round"/>`;
  const mouth = {
    neutral:`<path d="M53 73q7 3 14 0" fill="none" stroke="#7A3B33" stroke-width="2.6" stroke-linecap="round"/>`,
    smile  :`<path d="M51 70q9 11 18 0z" fill="#8E3A3A"/><path d="M53 71q7 3 14 0" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/>`,
    sad    :`<path d="M53 76q7-6 14 0" fill="none" stroke="#7A3B33" stroke-width="2.6" stroke-linecap="round"/>`,
    worried:`<path d="M53 75q3.5-3 7 0t7 0" fill="none" stroke="#7A3B33" stroke-width="2.6" stroke-linecap="round"/>`,
    grin   :`<path d="M50 69q10 12 20 0z" fill="#8E3A3A"/><path d="M52 70h16" stroke="#fff" stroke-width="3"/>`
  }[mood] || '';
  const back = k==='mia' ? `<path d="M33 60q-4-38 27-38t27 38l5 44q-12-3-15-20H43q-3 17-15 20z" fill="${P.hair}"/>` : '';
  const hair = {
    mia :`<path d="M35 55q2-29 27-29 22 1 24 27-9-15-27-15-12 6-24 17z" fill="${P.hair}"/><path d="M58 30q16-2 26 14" stroke="#5A3530" stroke-width="2" fill="none" opacity=".6"/><circle cx="36.5" cy="67" r="3.2" fill="none" stroke="#FFD27A" stroke-width="1.8"/><circle cx="83.5" cy="67" r="3.2" fill="none" stroke="#FFD27A" stroke-width="1.8"/>`,
    leo :`<path d="M35 53q-3-29 25-29 28 0 25 29l-4-9-3 7-5-11-5 9-6-11-5 10-6-10-4 9-5-8z" fill="${P.hair}"/><path d="M44 33q8-6 20-4" stroke="#8E5E38" stroke-width="2" fill="none" opacity=".7"/>`,
    noah:`<path d="M36 50q0-25 24-25t24 25q-6-7-12-7H48q-6 0-12 7z" fill="${P.hair}"/>`+
         [40,47,54,61,68,75,81].map((x,i)=>`<circle cx="${x}" cy="${31+(i%2)*3}" r="5" fill="${P.hair}"/>`).join('')
  }[k];
  const cloth = {
    mia :`<path d="M14 120q2-30 46-32 44 2 46 32z" fill="${P.cloth}"/><path d="M48 89l12 18 12-18" fill="#FFF2F8"/><path d="M60 107v13" stroke="#E0679F" stroke-width="2"/>`,
    leo :`<path d="M14 120q2-30 46-32 44 2 46 32z" fill="${P.cloth}"/><path d="M40 92q20 14 40 0" fill="none" stroke="#2F63CF" stroke-width="7" stroke-linecap="round"/><path d="M53 99v14M67 99v14" stroke="#E8F0FF" stroke-width="2" stroke-linecap="round"/>`,
    noah:`<path d="M14 120q2-30 46-32 44 2 46 32z" fill="${P.cloth}"/><path d="M50 89h20l-4 31H54z" fill="#F4F6FF"/><path d="M40 92a24 16 0 0 0 40 0" fill="none" stroke="#1D2246" stroke-width="5"/><rect x="34" y="86" width="10" height="14" rx="5" fill="#1D2246"/><rect x="76" y="86" width="10" height="14" rx="5" fill="#1D2246"/>`
  }[k];
  return `<svg class="av" viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="${CHARS[k].name}">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${P.bg[0]}"/><stop offset="1" stop-color="${P.bg[1]}"/></linearGradient>
  <radialGradient id="${id}s" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="${P.skin}"/><stop offset="1" stop-color="${P.sh}"/></radialGradient></defs>
  <rect width="120" height="120" rx="36" fill="url(#${id})"/>
  <clipPath id="${id}c"><rect width="120" height="120" rx="36"/></clipPath><g clip-path="url(#${id}c)"><g transform="translate(-8 -2) scale(1.13)">
  ${back}${cloth}
  <path d="M51 78h18v14q-9 5-18 0z" fill="${P.sh}"/>
  <ellipse cx="37" cy="60" rx="4.5" ry="6.5" fill="${P.sh}"/><ellipse cx="83" cy="60" rx="4.5" ry="6.5" fill="${P.sh}"/>
  <ellipse cx="60" cy="57" rx="23.5" ry="27.5" fill="url(#${id}s)"/>
  ${hair}${brow}
  <g><ellipse cx="50.5" cy="57" rx="4.6" ry="3.8" fill="#fff"/><ellipse cx="69.5" cy="57" rx="4.6" ry="3.8" fill="#fff"/>
  <circle cx="51" cy="57.3" r="2.7" fill="${P.eye}"/><circle cx="70" cy="57.3" r="2.7" fill="${P.eye}"/>
  <circle cx="51.9" cy="56.3" r=".9" fill="#fff"/><circle cx="70.9" cy="56.3" r=".9" fill="#fff"/></g>
  <path d="M59 60q-2 6 1 7" fill="none" stroke="${P.sh}" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="46" cy="67" rx="4" ry="2.4" fill="#FF7A9A" opacity=".22"/><ellipse cx="74" cy="67" rx="4" ry="2.4" fill="#FF7A9A" opacity=".22"/>
  ${mouth}
  </g></g></svg>`;
}

/* the viral video frame — Mia caught mid-slip at the school party */
const VIRAL_PHOTO='img/viral-post.webp';
function viralArt(){
  return `<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A video frame: Mia dancing awkwardly at the school Spring Party">
  <image href="${VIRAL_PHOTO}" x="0" y="0" width="400" height="500" preserveAspectRatio="xMidYMid slice"/>
  <circle cx="28.7" cy="27" r="8" fill="none" stroke="#FF3B5C" stroke-width="3"><animate attributeName="r" values="8;17" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.4s" repeatCount="indefinite"/></circle>
  <circle cx="28.7" cy="27" r="7.6" fill="#FF3B5C"><animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/></circle>

}
function postCard(opts={}){
  const likes = opts.likes ?? 5000;
  return `<div class="post" id="${opts.id||'post'}">
    <div class="post-h">${avatar('leo',38)}<div><b>leo.makes.videos</b><br><span>Westbridge School · 2 h</span></div><span style="margin-left:auto; font-size:20px">⋯</span></div>
    <div class="post-media">${viralArt()}</div>
    <div class="post-f">
      <div class="likes"><span class="heart ${opts.beat?'beat':''}">❤️</span><span class="lk" data-to="${likes}">${likes.toLocaleString('en-US')}</span> likes <span style="margin-left:auto; color:var(--muted); font-weight:700; font-size:14px">💬 312 · ↗ 87</span></div>
      ${opts.comments===false?'':`<div class="cm"><b>jake_22</b>LOL 😂😂 send this to everyone</div>

      <div class="cm rude"><b>rt.fan</b>this is so embarrassing for her</div>`}

}
function countUp(el, to, ms=1600){
  if(!el) return; const t0=performance.now(), from=0;
  (function f(t){ const k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US'); if(k<1) requestAnimationFrame(f); })(t0);
}
function floatHearts(box, n=8){
  if(REDUCED||!box) return;
  for(let i=0;i<n;i++) setTimeout(()=>{ const h=document.createElement('span'); h.className='floaty'; h.textContent=['❤️','💖','👍','😂','🔥'][i%5]; h.style.left=(10+Math.random()*80)+'%'; box.appendChild(h); setTimeout(()=>h.remove(),2700); }, i*220);
}

  <path d="M80 6l18 12 22-2 8 20 18 12-6 21 6 21-18 12-8 20-22-2-18 12-18-12-22 2-8-20-18-12 6-21-6-21 18-12 8-20 22 2z" fill="url(#bdg)"/>
  <circle cx="80" cy="80" r="46" fill="#10133A"/><text x="80" y="74" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="15" fill="#C4B5FD" letter-spacing="1.5">MISSION</text>
  <text x="80" y="110" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="40" fill="#fff">14</text></svg>`;
}

/* ---------- 4 · content ---------- */
const VOCAB = {
  take :{p:'take it down', def:'Remove something from the Internet.', ua:'Видалити щось з інтернету.', ex:'Please take the photo down. I didn’t agree to post it.', ic:'🗑️',
         tip:'Роздільне дієслово: take the video down / take it down. Займенник — лише всередині: take it down, не take down it.',
         rx:/\btak(e|es|ing|en)\s+(it|them|this|that|the\s+\w+|her\s+\w+|his\s+\w+)?\s*down\b|\btook\s+(it|them|this|that|the\s+\w+)?\s*down\b/i},
  blow :{p:'blow it out of proportion', def:'Make a problem seem much bigger than it really is.', ua:'Перебільшувати проблему; робити з чогось занадто велику проблему.', ex:'It was only a small mistake. Don’t blow it out of proportion.', ic:'🎈',

function tally(task, n){
  const out = Array.from({length:n},(_,i)=> (S.votes[task]||[])[i]||0);
  const m = LV[task]||{}; for(const k in m) if(m[k]<n) out[m[k]]++;
  return out;
}
const pct = (a,t)=> t? Math.round(a/t*100) : 0;
function voteOpts(task, opts){
  const t=tally(task,opts.length), tot=t.reduce((a,b)=>a+b,0);
  return `<div class="opts" data-task="${task}" data-n="${opts.length}">`+opts.map((o,i)=>`
    <button class="opt" data-i="${i}"><span class="fill" style="width:${pct(t[i],tot)}%"></span><span class="em">${o[0]}</span><span>${esc(o[1])}</span><span class="n">${t[i]} · ${pct(t[i],tot)}%</span></button>`).join('')+`</div>`;
}
function updateVotes(task){
  $$(`.opts[data-task="${task}"]`).forEach(box=>{
    const n=+box.dataset.n, t=tally(task,n), tot=t.reduce((a,b)=>a+b,0);
    $$('.opt',box).forEach((b,i)=>{ b.querySelector('.fill').style.width=pct(t[i],tot)+'%'; b.querySelector('.n').textContent=`${t[i]} · ${pct(t[i],tot)}%`; });
  });
  $$(`[data-duel="${task}"]`).forEach(box=>{
    const t=tally(task,2), tot=t.reduce((a,b)=>a+b,0);
    $$('.duelcard',box).forEach((c,i)=>{ c.querySelector('.lvl').style.height=pct(t[i],tot)+'%'; c.querySelector('.pc').textContent=pct(t[i],tot)+'%'; c.querySelector('.cnt').textContent=t[i]+(t[i]===1?' vote':' votes'); });
  });
  $$(`[data-dec="${task}"]`).forEach(box=>{
    const t=tally(task,4), tot=t.reduce((a,b)=>a+b,0);
    $$('.dopt',box).forEach((c,i)=>{ c.querySelector('.lvl').style.height=pct(t[i],tot)+'%'; c.querySelector('.n').textContent=t[i]+' · '+pct(t[i],tot)+'%'; });
  });
}

/* generic pointer drag: works with mouse, touch and pen; a short press counts as a tap */
function dragger(el, {onTap, onDrop, targets}){
  el.addEventListener('pointerdown', e=>{
    if(e.button>0) return;
    const sx=e.clientX, sy=e.clientY; let ghost=null, over=null;
    const move = ev=>{
      if(!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8){
        ghost = el.cloneNode(true); ghost.classList.add('ghost-drag'); document.body.appendChild(ghost); el.style.opacity='.35';
      }
      if(ghost){
        ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
        const t = document.elementFromPoint(ev.clientX, ev.clientY); const tg = t && t.closest(targets);
        if(over && over!==tg) over.classList.remove('hot','over');
        over = tg; if(over && over!==el) over.classList.add(over.classList.contains('ocard')?'over':'hot');
      }
    };
    const up = ev=>{
      removeEventListener('pointermove',move); removeEventListener('pointerup',up); removeEventListener('pointercancel',up);
      if(ghost){ ghost.remove(); el.style.opacity=''; if(over){ over.classList.remove('hot','over'); if(over!==el) onDrop(over); } }
      else if(ev.type==='pointerup') onTap();
    };
    addEventListener('pointermove',move); addEventListener('pointerup',up); addEventListener('pointercancel',up);
  });
  el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onTap(); } });
}

{ id:'chat', name:'Vocabulary Discovery: The Group Chat', title:'The group chat', mins:[7,5], kind:'core',

  answer:`Sample answer (Part 1): “I agree with Mia because Leo posted the video without her permission.”

10 phrases: take it down · blow it out of proportion · be into · be all about · check out · live up to the hype · get over it · back off · go for it · look up to`,
  hint(){ $$('.ph:not(.seen)').forEach(p=>{ p.classList.remove('pulse'); void p.offsetWidth; p.classList.add('pulse'); }); toast('Tap the glowing phrases'); },
  extra(p){
    if(p===0) return `<div class="glass pad" style="border-radius:22px; animation:pop .5s both"><p class="q" style="font-size:21px; margin-bottom:12px">Who do you agree with: Mia or Leo? Why?</p>
      ${voteOpts('chat1',[['💗','Mia'],['📱','Leo'],['🤷','I’m not sure']])}${sampleBox()}<div class="row mt-s">${resetVotesBtn('chat1')}</div></div>`;
    if(p===1) return `<div class="note info" style="animation:pop .5s both"><span class="ic">⚖️</span><div class="cmp">
      <div><b>be into something</b><span>= you personally like it</span></div>
      <div><b>be all about something</b><span>= it is your main interest or focus</span></div>
      <div><b>check something out</b><span>= look at it or try it</span></div></div></div>`;
    if(p===2) return `<div class="note warn" style="animation:pop .5s both"><span class="ic">⚠️</span><div>Saying <b>‘Get over it!’</b> directly can sound rude because it ignores the person’s feelings.</div></div>`;
    return '';
  },
  msgHTML(m, seen, anim){
    const [k,t,mood]=m, me=k==='leo';
    return `<div class="msg ${me?'me':''}" style="${anim?'':'animation:none'}">${avatar(k,44,mood)}<div><div class="nm" style="color:${CHARS[k].c}">${CHARS[k].name}</div><div class="bb">${mark(t,seen)}</div></div></div>`;
  },
  render(el){
    const st=sd('chat'); st.parts=st.parts||0; st.seen=st.seen||{};
    el.innerHTML = head(this) + `<div class="case">
      <div class="glass chat">
        <div class="chat-top"><div class="stack">${avatar('mia',36,'sad')}${avatar('leo',36)}${avatar('noah',36)}</div><div><b>Mia, Leo &amp; Noah</b><div class="small">group chat · Monday</div></div></div>
        <div class="chat-body" id="chatBody"></div>
      </div>
      <div style="position:sticky; top:0; display:grid; gap:14px">
        <div class="glass pad"><div class="row" style="justify-content:space-between"><b>Expressions discovered</b><span class="counter" id="cnt">0/10</span></div>
          <div class="found mt-s" id="found"></div><p class="small mt-s" style="margin:0">Tap each highlighted phrase in the chat.</p></div>
        <button class="btn primary big" id="more">Next messages</button>
        <button class="btn cyan big hidden" id="unlockPhone">🔓 Unlock Leo’s Phone</button>
      </div></div>`;
    const body=$('#chatBody',el);
    const staticParts=()=>{ let h=''; for(let p=0;p<st.parts;p++){ h+=`<div class="divider">PART ${p+1}</div>`+CHAT[p].map(m=>this.msgHTML(m,st.seen,false)).join('')+this.extra(p); } body.innerHTML = h || `<div class="small center" style="padding:30px 0">The chat is quiet… press <b>Next messages</b>.</div>`; };
    staticParts();
    const side=()=>{
      const n=Object.keys(st.seen).length;
      $('#cnt',el).textContent=n+'/10';
      $('#found',el).innerHTML=VORDER.map(k=>`<div class="f ${st.seen[k]?'on':''}" ${st.seen[k]?`data-k="${k}" title="${VOCAB[k].p}" role="button" tabindex="0"`:''}>${st.seen[k]?VOCAB[k].ic:'?'}</div>`).join('');
      $$('#found [data-k]',el).forEach(f=> f.onclick=()=>openVocab(f.dataset.k));
      $('#more',el).classList.toggle('hidden', st.parts>=4);
      const all = n===10 && st.parts>=4;
      $('#unlockPhone',el).classList.toggle('hidden', !(all || S.done.chat));
      if(all && !S.done.chat){ markDone('chat'); unlockBurst('🔎','10/10 expressions discovered'); }
    };
    const wire=()=>{
      $$('.ph',body).forEach(p=>{ const f=()=>{ const k=p.dataset.v; if(!st.seen[k]){ st.seen[k]=1; save(); SFX.ok(); } $$(`.ph[data-v="${k}"]`).forEach(x=>x.classList.add('seen')); openVocab(k); side(); };
        p.onclick=f; p.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); f(); } }; });
      wireVotes(body); wireReset(body); updateVotes('chat1');
    };
    wire(); side();
    let busy=false;
    $('#more',el).onclick=async()=>{
      if(busy||st.parts>=4) return; busy=true; const p=st.parts;
      if(p===0) body.innerHTML='';
      body.insertAdjacentHTML('beforeend',`<div class="divider">PART ${p+1}</div>`);
      for(const m of CHAT[p]){
        const tp=document.createElement('div'); tp.className='msg'+(m[0]==='leo'?' me':''); tp.innerHTML=`${avatar(m[0],44)}<div class="typing"><i></i><i></i><i></i></div>`;
        body.appendChild(tp); tp.scrollIntoView({behavior:'smooth',block:'end'});
        await wait(REDUCED?50:1000); tp.remove();
        body.insertAdjacentHTML('beforeend', this.msgHTML(m, st.seen, true)); SFX.pop();
        await wait(REDUCED?50:350);
      }
      body.insertAdjacentHTML('beforeend', this.extra(p));
      st.parts=p+1; save(); wire(); side(); busy=false; pubState();
      body.lastElementChild && body.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
    $('#unlockPhone',el).onclick=()=>next();
  }},

/* ─────────────────────────── 4 · UNLOCK THE PHONE (matching) ─────────────────────────── */
{ id:'match', name:'Unlock the Phone', title:'Unlock Leo’s phone', mins:[3,2], kind:'opt',
  notes:['Коротка практика. На комп’ютері — перетягуйте фрази; на планшеті/телефоні — натисніть фразу, потім рядок.',
         'Натиснута заповнена клітинка повертає фразу в банк.',
         'Short Lesson Mode — лише 4 визначення. Можна пропустити: Skip Activity.'],
  items(){ return S.short ? MATCH_SHORT : MATCH.map((_,i)=>i); },
  answer(){ return this.items().map((i,n)=>`${n+1}. ${MATCH[i].d} → ${VOCAB[MATCH[i].a].p}`).join('\n'); },
  hint(){ const st=sd('match'); st.hint=1; save(); this.paint(); },
  show(){ const st=sd('match'); st.snap={place:{...(st.place||{})},checked:st.checked}; st.place={}; this.items().forEach((i,n)=>st.place[n]=MATCH[i].a); st.checked=1; save(); this.paint(); },
  hide(){ const st=sd('match'); if(st.snap){ st.place=st.snap.place; st.checked=st.snap.checked; delete st.snap; save(); this.paint(); } },
  render(el){
    el.innerHTML = head(this) + `<div class="grid" style="grid-template-columns:1fr; gap:18px">
      <div class="glass pad"><div class="row" style="gap:14px">${avatar('leo',54)}<div><b style="font-size:19px">Leo’s phone is locked 🔒</b><div class="small">Match each meaning with the right expression to unlock it.</div></div></div>
        <div class="row mt" id="bank" aria-label="Expressions"></div></div>
      <div class="grid" style="gap:10px" id="rows"></div>
      <div class="row"><button class="btn primary" id="mCheck">Check Answers</button><button class="btn" id="mRetry">Try Again</button><button class="btn ghost" id="mHint">💡 Show Hint</button></div>
      <div id="mRes"></div></div>`;
    this.el=el; this.paint();
    $('#mCheck',el).onclick=()=>{ const st=sd('match'); st.checked=1; save(); this.paint(true); };
    $('#mRetry',el).onclick=()=>{ const st=sd('match'), it=this.items(); for(const n in (st.place||{})) if(st.place[n]!==MATCH[it[n]].a) delete st.place[n]; st.checked=0; save(); this.paint(); };
    $('#mHint',el).onclick=()=>this.hint();
  },
  paint(fromCheck){
    const el=this.el; if(!el||!el.isConnected) return;
    const st=sd('match'); st.place=st.place||{}; const it=this.items();
    const used=Object.values(st.place), bankKeys=MATCH_BANK.filter(k=>it.some(i=>MATCH[i].a===k));
    $('#bank',el).innerHTML = bankKeys.map(k=>`<button class="chip ${used.includes(k)?'used':''} ${st.sel===k?'sel':''}" data-k="${k}">${VOCAB[k].p}</button>`).join('');
    let right=0;
    $('#rows',el).innerHTML = it.map((i,n)=>{
      const v=st.place[n], ok=v===MATCH[i].a; if(ok) right++;
      const cls = v ? 'filled'+(st.checked?(ok?' good':' wrong'):'') : '';
      return `<div class="mrow"><span class="num">${n+1}</span><span style="font-size:18px; font-weight:700">${MATCH[i].d}</span>
        <button class="slot ${cls}" data-n="${n}">${v?VOCAB[v].p+(st.checked?(ok?' ✓':' ✗'):''):'drop here'}</button>
        ${st.checked&&ok?`<span class="ex">✔ ${MATCH[i].why}</span>`:''}
        ${st.checked&&v&&!ok?`<span class="ex" style="color:#FFB3C1">Not this one. “${VOCAB[v].p}” means: ${VOCAB[v].def.toLowerCase()}</span>`:''}
        ${st.hint&&!ok?`<span class="ex" style="color:var(--amber)">💡 It starts with “${VOCAB[MATCH[i].a].p.split(' ')[0]} …”</span>`:''}</div>`;
    }).join('');
    $$('#bank .chip',el).forEach(c=> dragger(c,{targets:'.slot',
      onTap:()=>{ st.sel = st.sel===c.dataset.k?null:c.dataset.k; this.paint(); },
      onDrop:t=>{ this.put(+t.dataset.n, c.dataset.k); }}));
    $$('#rows .slot',el).forEach(s=> s.onclick=()=>{ const n=+s.dataset.n;
      if(st.sel){ this.put(n, st.sel); } else if(st.place[n]){ delete st.place[n]; st.checked=0; save(); this.paint(); } });
    const all = right===it.length;
    $('#mRes',el).innerHTML = st.checked ? (all
      ? `<div class="note ok"><span class="ic">🔓</span><div><b>All correct!</b> Leo’s phone is unlocked — there is a voice message inside.</div></div><button class="btn primary big mt" id="toAudio">🎧 Listen to the message</button>`
      : `<div class="note bad"><span class="ic">🔁</span><div><b>${right} of ${it.length} correct.</b> Press <b>Try Again</b> — the right answers stay in place.</div></div>`) : '';
    if(fromCheck){ all ? (SFX.ok()) : SFX.bad(); }
    if(st.checked && all && !S.done.match){ markDone('match'); setTimeout(()=>unlockBurst('🎧','Audio message unlocked'),250); }
    const ta=$('#toAudio',el); if(ta) ta.onclick=()=>next();
  },
  put(n,k){ const st=sd('match'); for(const x in st.place) if(st.place[x]===k) delete st.place[x]; st.place[n]=k; st.sel=null; st.checked=0; save(); SFX.pop(); this.paint(); }
},

function usedPhrases(team){
  const d=S.teams[team]||{}, txt=['sit','a1','a2','a3','msg'].map(f=>d[f]||'').join(' \n ');
  return VORDER.filter(k=>VOCAB[k].rx.test(txt));
}
function worksheet(team, big){
  const d=S.teams[team]||{}, T=TEAMS[team], used=usedPhrases(team);
  const f=(id,ph,cls='')=>`<textarea class="tinput ${cls}" rows="${big?2:1}" data-team="${team}" data-f="${id}" placeholder="${ph}">${esc(d[id]||'')}</textarea>`;
  return `<div class="ws">
    <label>Our situation:</label>${f('sit','In one sentence…',big?'big':'')}
    <label>The person should:</label>
    ${f('a1','1. …',big?'big':'')}${f('a2','2. …',big?'big':'')}${f('a3','3. …',big?'big':'')}
    <label>Our final message:</label>${f('msg','Likes don’t equal love because…',big?'big':'')}
    <div class="row mt-s" style="gap:8px"><span class="small">New phrases used: <b class="pcount" data-team="${team}">${used.length}</b> / 3 minimum</span></div></div>`;
}
function wireWorksheet(root){
  $$('textarea[data-team]',root).forEach(t=> t.addEventListener('input', ()=>{
    const tm=t.dataset.team; S.teams[tm]=S.teams[tm]||{}; S.teams[tm][t.dataset.f]=t.value; save();
    $$(`textarea[data-team="${tm}"][data-f="${t.dataset.f}"]`).forEach(x=>{ if(x!==t) x.value=t.value; });
    refreshPhr(tm); pubStateSoon();
  }));
}
function refreshPhr(tm){
  const used=usedPhrases(tm);
  $$(`.pcount[data-team="${tm}"]`).forEach(x=>{ x.textContent=used.length; x.style.color=used.length>=3?'var(--ok)':''; });
  $$(`.phr[data-team="${tm}"] span`).forEach(s=> s.classList.toggle('used', used.includes(s.dataset.k)));
}
const TIMER = {dur:360, left:360, run:false, end:0, fired:false};
function timerSet(sec){ TIMER.dur=sec; TIMER.left=sec; TIMER.run=false; TIMER.fired=false; paintTimer(); pubState(); }
function timerToggle(){ if(TIMER.run){ TIMER.left=Math.max(0,(TIMER.end-Date.now())/1000); TIMER.run=false; } else { if(TIMER.left<=0) TIMER.left=TIMER.dur; TIMER.end=Date.now()+TIMER.left*1000; TIMER.run=true; TIMER.fired=false; SFX.pop(); } paintTimer(); pubState(); }
function timerAdd(sec){ if(TIMER.run) TIMER.end+=sec*1000; else TIMER.left+=sec; TIMER.dur=Math.max(TIMER.dur, Math.ceil(TIMER.run?(TIMER.end-Date.now())/1000:TIMER.left)); paintTimer(); pubState(); }
const fmt = s=>{ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function timerLeft(){ return TIMER.run ? Math.max(0,(TIMER.end-Date.now())/1000) : TIMER.left; }
function paintTimer(){
  const l=timerLeft();
  $$('.tt').forEach(x=>x.textContent=fmt(l));
  $$('.tplay').forEach(x=>x.textContent=TIMER.run?'⏸ Pause':'▶ Start');
  $$('.timerbig').forEach(x=>x.classList.toggle('urgent', TIMER.run && l<=30));
  $$('.ring circle.p').forEach(c=>{ const L=2*Math.PI*26; c.style.strokeDasharray=L; c.style.strokeDashoffset=L*(1-l/Math.max(1,TIMER.dur)); });
}
setInterval(()=>{
  if(!TIMER.run) return;
  const l=timerLeft(); paintTimer();
  if(l<=0 && !TIMER.fired){ TIMER.fired=true; TIMER.run=false; TIMER.left=0; SFX.chime(); toast('⏰ Time’s up — back to the main room!'); pubState(); }
}, 250);
function timerHTML(){
  return `<div class="timerbig"><svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/><circle class="p" cx="32" cy="32" r="26" fill="none" stroke="#3EE8FF" stroke-width="6" stroke-linecap="round" transform="rotate(-90 32 32)"/></svg>
    <span class="tt">6:00</span>
    <div class="row" style="gap:8px"><button class="btn sm primary tplay" data-tm="toggle">▶ Start</button><button class="btn sm" data-tm="add">+1 minute</button><button class="btn sm ghost" data-tm="reset">↺ Reset</button></div></div>`;
}
function wireTimer(root){
  $$('[data-tm]',root).forEach(b=> b.onclick=()=>{ const a=b.dataset.tm; if(a==='toggle') timerToggle(); if(a==='add') timerAdd(60); if(a==='reset') timerSet(TIMER.dur>0?TIMER.dur:360); if(/^\d+$/.test(a)) timerSet(+a); });
  paintTimer();
}

function rateTally(L){ const r=[...(S.rate[L]||[0,0,0])]; const m=LRATE[L]||{}; for(const k in m) r[m[k]]++; return r; }

/* ---------- 5b · audio player: real file if configured, otherwise the browser voice ---------- */
const CFG = Object.assign({SUPABASE_URL:'',SUPABASE_KEY:'',SAVE_ANSWERS:false,AUDIO_FILE:''}, window.LESSON_CONFIG||{});
const Player = {
  idx:0, playing:false, rate:1, vol:1, t0:0, token:0, audio:null,
  lines: SCRIPT.map(plain),
  dur(i){ return (this.lines[i].split(/\s+/).length*60/158 + .45)/this.rate; },
  total(){ if(this.audio && isFinite(this.audio.duration)) return this.audio.duration; return this.lines.reduce((a,_,i)=>a+this.dur(i),0); },
  now(){
    if(this.audio) return this.audio.currentTime||0;
    let s=0; for(let i=0;i<this.idx;i++) s+=this.dur(i);
    if(this.playing) s+=Math.min(this.dur(this.idx), (performance.now()-this.t0)/1000);
    return s;
  },
  init(){
    if(CFG.AUDIO_FILE && !this.audio){
      this.audio=new Audio(CFG.AUDIO_FILE); this.audio.preload='metadata';
      this.audio.onended=()=>{ this.playing=false; this.paint(); };
      this.audio.onerror=()=>{ console.warn('AUDIO_FILE not found — using the browser voice'); this.audio=null; };
      this.audio.onloadedmetadata=()=>this.paint();
    }
  },
  mount(){
    this.init();
    const w=$('#wave'); if(!w) return;
    w.innerHTML = Array.from({length:56},(_,i)=>{ const h=18+Math.abs(Math.sin(i*1.7)*46+Math.sin(i*.37)*24)%62; return `<i style="height:${Math.round(h)}%; animation-delay:${(i%7)*.09}s"></i>`; }).join('');
    w.onclick=e=>{ const r=w.getBoundingClientRect(); this.seek((e.clientX-r.left)/r.width); };
    $('#pPlay').onclick=()=>this.toggle();
    $('#pReplay').onclick=()=>this.replay();
    $$('.speed button').forEach(b=> b.onclick=()=>{ this.rate=+b.dataset.r; if(this.audio) this.audio.playbackRate=this.rate; else if(this.playing) this.speak(); this.paint(); });
    const v=$('#pVol'); v.value=this.vol; v.oninput=()=>{ this.vol=+v.value; if(this.audio) this.audio.volume=this.vol; };
    $('#voiceName').textContent = this.audio ? '🎙 recorded audio' : (Voice.pick ? '🔊 '+Voice.pick.name.replace(/Microsoft |Online |\(Natural\)| - English.*$/g,'').trim() : '');
    this.paint();
  },
  speak(){
    const my=++this.token; this.t0=performance.now();
    Voice.say(this.lines[this.idx], {rate:.96*this.rate, volume:this.vol, onend:()=>{
      if(my!==this.token || !this.playing) return;
      if(this.idx < this.lines.length-1){ this.idx++; this.speak(); } else { this.playing=false; this.idx=0; this.paint(); }
    }});
    this.paint();
  },
  play(){ this.playing=true; SFX.c(); if(this.audio){ this.audio.playbackRate=this.rate; this.audio.volume=this.vol; this.audio.play().catch(()=>{}); this.paint(); } else this.speak(); },
  pause(){ this.playing=false; this.token++; if(this.audio) this.audio.pause(); else if('speechSynthesis' in window) speechSynthesis.cancel(); this.paint(); },
  toggle(){ this.playing ? this.pause() : this.play(); },
  replay(){ this.pause(); this.idx=0; if(this.audio) this.audio.currentTime=0; this.play(); },
  seek(f){
    f=Math.max(0,Math.min(1,f));
    if(this.audio){ if(isFinite(this.audio.duration)) this.audio.currentTime=f*this.audio.duration; this.paint(); return; }
    let target=f*this.total(), s=0, i=0; while(i<this.lines.length-1 && s+this.dur(i)<target){ s+=this.dur(i); i++; }
    this.idx=i; if(this.playing) this.speak(); else this.paint();
  },
  hl(){ $$('#tr .ln').forEach(l=> l.classList.toggle('now', this.playing && !this.audio && +l.dataset.ln===this.idx)); },
  paint(){
    const p=$('#player'); if(!p) return;
    p.classList.toggle('playing', this.playing && !REDUCED);
    $('#pPlay').textContent=this.playing?'❚❚':'▶'; $('#pPlay').setAttribute('aria-label',this.playing?'Pause':'Play');
    const tot=this.total(), now=Math.min(tot,this.now());
    $('#pTime').textContent = fmt(now)+' / '+fmt(tot);
    const bars=$$('#wave i'), k=Math.round(now/tot*bars.length);
    bars.forEach((b,i)=>b.classList.toggle('p', i<k));
    $$('.speed button').forEach(b=>b.classList.toggle('on', +b.dataset.r===this.rate));
    this.hl();
  }
};

const SIDX = Object.fromEntries(SCENES.map((s,i)=>[s.id,i]));
const cur = ()=> SCENES[S.i];
function isOff(sc){ return S.short && sc.shortSkip; }
function markDone(id){ if(!S.done[id]){ S.done[id]=true; save(); } paintNav(); paintTeacher(); }
function setShort(v){
  S.short=!!v; SCENES.forEach(sc=>{ if(sc.shortSkip){ if(S.short) S.skipped[sc.id]=true; else delete S.skipped[sc.id]; } });
  save(); $('#lenLbl').textContent = S.short?'Short · 30':'Full · 40'; $('#btnLen').classList.toggle('on',S.short);
  toast(S.short?'Short Lesson Mode: 30 minutes':'Full Lesson Mode: 40 minutes');
  paintNav(); paintTeacher();
  if(cur().id!=='start') renderScene(0);
}
function go(i, dir=1){
  i=Math.max(0,Math.min(SCENES.length-1,i));
  if(Player.playing && SCENES[i].id!=='listen') Player.pause();
  S.i=i; S.max=Math.max(S.max,i); save();
  document.body.classList.remove('reveal');
  renderScene(dir);
  if(LIVE.on){ LIVE.open=false; LIVE.showRes=false; LIVE.ti=0; }
  pubState();
}
function next(){ let j=S.i+1; while(j<SCENES.length-1 && isOff(SCENES[j])){ S.skipped[SCENES[j].id]=true; j++; } go(j,1); }
function back(){ let j=S.i-1; while(j>0 && isOff(SCENES[j])) j--; go(j,-1); }
function tryNext(){
  const sc=cur();
  if(sc.nogate || S.done[sc.id] || S.skipped[sc.id]) return next();
  toast('Finish this activity first — or Teacher Mode → Unlock next scene');
  SFX.bad();
}
function renderScene(dir){
  const sc=cur(), el=$('#scene');
  el.classList.remove('enter','back'); void el.offsetWidth;
  if(dir){ el.classList.add('enter'); if(dir<0) el.classList.add('back'); }
  sc.render(el);
  if(sc.nogate) S.done[sc.id]=true;
  $('#stage').scrollTop=0;
  paintNav(); paintTeacher();
}
function minsLeft(){
  let m=0; for(let j=S.i;j<SCENES.length;j++){ const sc=SCENES[j]; if(isOff(sc)||S.skipped[sc.id]) continue; if(j===S.i && S.done[sc.id] && !sc.nogate) continue; m+=S.short?sc.mins[1]:sc.mins[0]; }
  return Math.round(m);
}

function confetti(){
  if(REDUCED) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#8B5CF6','#FF4FA3','#3EE8FF','#FFC857','#43E5A0','#fff'];
  const P=Array.from({length:170},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.6, vx:(Math.random()-.5)*3, vy:2+Math.random()*3.5, r:4+Math.random()*6, a:Math.random()*6, va:(Math.random()-.5)*.25, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.035; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(t-t0<4200) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
}

/* ---------- 8 · live room (Supabase Realtime broadcast; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5 і 13: таблиці не потрібні, повідомлення летять
   через канал кімнати. SAVE_ANSWERS:true додатково пише відповіді в lesson_answers. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,9);
const qs = new URLSearchParams(location.search);
const ROLE = qs.get('role')==='student' ? 'student' : 'teacher';
if(qs.get('room')) S.room = qs.get('room');

const Net = {
  kind:null, ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  async connect(o){
    this.me={id: (o.role==='student' && localStorage.getItem('l14sid')) || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') localStorage.setItem('l14sid', this.me.id);
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson14-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>list.push(v[0])); this.onPeers(list); });
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),8000);
          this.ch.subscribe(async st=>{ this.onStatus(st);
            if(st==='SUBSCRIBED'){ clearTimeout(to); await this.ch.track(this.me); res(); }
            if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ clearTimeout(to); rej(new Error(st)); } }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson14-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; return this.kind;
    }catch(e){ this.kind='none'; return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.ch.unsubscribe(); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; }
};
const Store = {
  async log(kind, task, id, value){
    if(!(CFG.SAVE_ANSWERS && Net.sb)) return;
    try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson14-likes', chapter:cur().id, task, kind, student_id:id, student_name:NAMES[id]||null, value:String(value)}); }
    catch(e){ console.warn('Supabase insert failed:', e.message||e); }
  }
};

  const remember=()=>{ try{ localStorage.setItem(SK,JSON.stringify(sent)); }catch(e){} };
  const B=$('#stuBody'); $('#stuRoom').textContent='room '+S.room;
  const status=(c,t)=>{ $('#stuLed').className='led '+c; $('#stuLed').title=t; };
  function ask(){
    B.innerHTML=`<div class="glass stu-card"><h2 class="dsp" style="font-size:34px">Join Mission 14</h2><p class="small">Room ${S.room}. Type your name or a nickname.</p>
      <input class="tinput mt-s" id="sn" maxlength="24" placeholder="Your name" value="${esc(name)}"><button class="btn primary mt" id="sj" style="width:100%">Join the team</button>
      <p class="small mt-s" style="margin:0">Your phone is only for voting and short answers. The story stays on your teacher’s screen.</p></div>`;
    $('#sj').onclick=()=>{ const v=$('#sn').value.trim(); if(!v){ $('#sn').focus(); return; } name=v; localStorage.setItem('l14name',v); join(); };
    $('#sn').onkeydown=e=>{ if(e.key==='Enter') $('#sj').click(); };
  }
  async function join(){
    B.innerHTML=`<div class="glass stu-card stu-wait"><div class="big">🔌</div><p>Connecting to room ${S.room}…</p></div>`;
    const kind=await Net.connect({room:S.room, role:'student', name, onEvent:m=>{ if(m.t==='state'){ st=m; st.at=Date.now(); render(); } if(m.t==='end'){ ended(); } },
      onStatus:s=>{ if(s==='SUBSCRIBED') status('on','connected'); else if(/ERROR|TIMED_OUT|CLOSED/.test(s)) status('warn','reconnecting…'); }});
    status(kind==='supabase'?'on':kind==='local'?'warn':'', kind);
    if(kind==='none'){ B.innerHTML=`<div class="glass stu-card stu-wait"><div class="big">📶</div><p><b>Could not join room ${S.room}.</b></p><p class="small">Check your internet and open your teacher’s link again.</p><button class="btn primary mt" id="rt" style="width:100%">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); clearInterval(window._hb); window._hb=setInterval(()=>Net.send({t:'hello'}),20000);
    if(myTeam) Net.send({t:'team', team:myTeam});
    render();
  }
  function ended(){ Net.stop(); clearInterval(window._hb); localStorage.removeItem(SK); B.innerHTML=`<div class="glass stu-card stu-wait"><div class="big">🏁</div><p><b>Mission complete!</b></p><p class="small">The lesson has ended. Thanks for your ideas — you can close this page.</p></div>`; }
  let editT={};
  function render(){
    if(!st){ B.innerHTML=`<div class="glass stu-card stu-wait"><div class="big">🕵️</div><p><b>You’re in, ${esc(name)}.</b></p><p class="small">Wait for your teacher to open something.</p></div>`; return; }
    const t=st.task, tm=st.timer||{};
    const tl = tm.run ? Math.max(0, tm.left-(Date.now()-st.at)/1000) : tm.left;
    const timer = (tm.run || (tm.left>0 && tm.left<tm.dur)) ? `<div class="note info" style="margin-bottom:12px"><span class="ic">⏱</span><div><b id="stT">${fmt(tl)}</b> left</div></div>` : '';
    if(!t){ B.innerHTML=timer+`<div class="glass stu-card stu-wait"><div class="big">👀</div><p><b>${esc(st.scene)}</b></p><p class="small">Nothing to tap right now — listen, watch and be ready to speak.</p></div>`; return; }
    let h=timer+`<div class="glass stu-card"><div class="small">${esc(st.scene)}</div><h2 style="font-size:22px; margin:6px 0 16px">${esc(t.title)}</h2>`;
    if(t.kind==='choice'){
      h+=`<div class="opts">`+t.options.map((o,i)=>{ const tot=(st.res||[]).reduce((a,b)=>a+b,0), p=st.res?pct(st.res[i],tot):0;
        return `<button class="opt ${sent[t.id]===i?'sel':''}" data-c="${i}"><span class="fill" style="width:${p}%"></span><span>${esc(o)}</span>${st.res?`<span class="n">${p}%</span>`:''}</button>`; }).join('')+`</div>`;
      if(sent[t.id]!==undefined) h+=`<p class="small mt-s" style="margin:10px 0 0">Vote sent ✓ You can change it.</p>`;
    }
    if(t.kind==='text'){
      h+=`<textarea class="tinput" id="sx" rows="3" maxlength="140" placeholder="${esc(t.hint||'')}"></textarea><button class="btn primary mt" id="ss" style="width:100%">Send to teacher</button><p class="small mt-s" id="sn2" style="margin:10px 0 0">${sent[t.id]?'Sent ✓ Your teacher will show it on the wall.':''}</p>`;
    }
    if(t.kind==='team'){
      if(!myTeam){ h+=`<p class="small">Choose your team:</p><div class="opts">`+Object.entries(t.teams).map(([L,T])=>`<button class="opt" data-tm="${L}"><span class="em">${T.ic}</span><span><b>Team ${L}</b> · ${esc(T.name)}</span></button>`).join('')+`</div>`; }
      else { const T=t.teams[myTeam], d=(st.docs||{})[myTeam]||{};
        const f=(id,ph)=>`<textarea class="tinput" rows="2" data-f="${id}" maxlength="400" placeholder="${ph}">${esc(d[id]||'')}</textarea>`;
        h+=`<div class="row" style="justify-content:space-between"><b>Team ${myTeam} · ${esc(T.name)}</b><button class="btn sm ghost" id="chg">change</button></div>
          <p style="margin:10px 0">${esc(T.s)}</p><div class="phr">${T.ph.map(p=>`<span>${esc(p)}</span>`).join('')}</div>
          <div class="ws"><label>Our situation:</label>${f('sit','In one sentence…')}<label>The person should:</label>${f('a1','1. …')}${f('a2','2. …')}${f('a3','3. …')}<label>Our final message:</label>${f('msg','Likes don’t equal love because…')}</div>
          <p class="small mt-s" style="margin:10px 0 0">Everyone in your team edits the same card. Use at least three new phrases.</p>`; }
    }
    if(t.kind==='rate'){
      h+=Object.entries(t.teams).map(([L,T])=>`<div style="margin-bottom:14px"><b>Team ${L}</b> <span class="small">${esc(T.name)}</span><div class="opts mt-s" style="grid-template-columns:repeat(3,1fr); gap:6px">${RATE.map((r,i)=>`<button class="opt ${sent['rate'+L]===i?'sel':''}" data-rt="${L}" data-i="${i}" style="flex-direction:column; padding:10px 6px; font-size:13px; text-align:center; gap:4px"><span style="font-size:22px">${r[0]}</span>${r[1]}</button>`).join('')}</div></div>`).join('');
    }
    h+=`</div>`;
    const focus=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:null, caret=focus?document.activeElement.selectionStart:0;
    if(t.kind==='team' && myTeam && $('#stuBody [data-f]')){ /* live doc update: don't rebuild while typing */
      const d=(st.docs||{})[myTeam]||{}; $$('#stuBody [data-f]').forEach(x=>{ if(x!==document.activeElement) x.value=d[x.dataset.f]||''; }); return; }
    B.innerHTML=h;
    $$('[data-c]',B).forEach(b=> b.onclick=()=>{ sent[t.id]=+b.dataset.c; remember(); Net.send({t:'vote',task:t.id,choice:+b.dataset.c}); render(); });
    const ss=$('#ss',B); if(ss){ if(typeof sent[t.id]==='string') $('#sx').value=sent[t.id]; ss.onclick=()=>{ const v=$('#sx').value.trim(); if(!v) return; sent[t.id]=v; remember(); Net.send({t:'text',task:t.id,text:v}); $('#sn2').textContent='Sent ✓ Your teacher will show it on the wall.'; }; }
    $$('[data-tm]',B).forEach(b=> b.onclick=()=>{ myTeam=b.dataset.tm; localStorage.setItem('l14team-'+S.room,myTeam); Net.send({t:'team',team:myTeam}); render(); });
    const chg=$('#chg',B); if(chg) chg.onclick=()=>{ myTeam=''; localStorage.removeItem('l14team-'+S.room); B.innerHTML=''; render(); };
    $$('[data-f]',B).forEach(x=> x.oninput=()=>{ clearTimeout(editT[x.dataset.f]); editT[x.dataset.f]=setTimeout(()=>Net.send({t:'team-edit',team:myTeam,f:x.dataset.f,v:x.value}),300); });
    if(focus){ const x=$(`[data-f="${focus}"]`,B); if(x){ x.focus(); try{ x.setSelectionRange(caret,caret); }catch(e){} } }
    $$('[data-rt]',B).forEach(b=> b.onclick=()=>{ const L=b.dataset.rt, i=+b.dataset.i; sent['rate'+L]=i; remember(); Net.send({t:'rate',team:L,r:i}); render(); });
  }
  setInterval(()=>{ const x=$('#stT'); if(x&&st&&st.timer&&st.timer.run) x.textContent=fmt(Math.max(0,st.timer.left-(Date.now()-st.at)/1000)); },500);
  $('#handBtn').onclick=()=>{ Net.send({t:'hand'}); $('#handBtn').textContent='🙋 Hand raised'; setTimeout(()=>$('#handBtn').textContent='🙋 Raise hand',2500); };
  name ? join() : ask();
}

/* ---------- 10 · boot ---------- */
(function boot(){
  if(ROLE==='student'){ studentApp(); return; }
  S.i=Math.min(S.i,SCENES.length-1);
  $('#btnBack').onclick=back; $('#btnNext').onclick=tryNext;
  $('#btnHome').onclick=openMap; $('#btnMap').onclick=openMap;
  $('#btnLen').onclick=()=>setShort(!S.short);
  $('#btnLive').onclick=openLive;
  $('#btnTeacher').onclick=()=>setTeacher(!isTeacher()); $('#tClose').onclick=()=>setTeacher(false);
  $('#btnSound').onclick=()=>setSound(!S.sound);
  $('#btnReset').onclick=askReset;
  $('#btnFull').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast('Full screen is blocked in this browser')); };
  $('#backHub').addEventListener('click', e=>{ if(LIVE.on && !confirm('Live-кімната ще працює. Вийти на платформу і завершити заняття?')) e.preventDefault(); });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && !$('#modal').classList.contains('hidden')){ closeModal(); return; }
    if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')) return;
    if(e.key==='ArrowRight') tryNext(); else if(e.key==='ArrowLeft' && S.i>0) back();
    else if(e.key==='t'||e.key==='T') setTeacher(!isTeacher());
    else if(e.key==='f'||e.key==='F') $('#btnFull').click();
  });
  $('#lenLbl').textContent=S.short?'Short · 30':'Full · 40'; $('#btnLen').classList.toggle('on',S.short);
  $('#btnSound').textContent=S.sound?'🔊':'🔇';
  timerSet(360);
  renderScene(1);
})();
</script>
