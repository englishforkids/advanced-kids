<style>
:root{
  --bg:#090B22; --bg2:#12153D; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --edge:rgba(196,181,253,.20); --text:#F4F2FF; --muted:#AEB1DC; --dim:#7D80AE;
  --vio:#8B5CF6; --vio2:#B39DFF; --pink:#FF4FA3; --pink2:#FF9BCB; --cyan:#3EE8FF;
  --ok:#34D399; --bad:#FB7185; --gold:#FBBF24; --r:22px;
  --grad:linear-gradient(100deg,#8B5CF6,#FF4FA3);
}
*{box-sizing:border-box}
html{font-size:18px; -webkit-text-size-adjust:100%}
@media (max-width:700px){html{font-size:16px}}
body{margin:0; background:var(--bg); color:var(--text); font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.45; min-height:100vh; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(900px 600px at 8% -12%,rgba(139,92,246,.30),transparent 60%),
             radial-gradient(800px 600px at 108% 112%,rgba(255,79,163,.18),transparent 60%),
             radial-gradient(600px 420px at 82% -5%,rgba(62,232,255,.10),transparent 60%)}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px; border-radius:12px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
h1,h2,h3{margin:0; line-height:1.1}
.disp{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif; font-weight:400; letter-spacing:.01em; text-transform:uppercase}
.grad{background:linear-gradient(90deg,#B39DFF,#FF4FA3 55%,#3EE8FF); -webkit-background-clip:text; background-clip:text; color:transparent}
.muted{color:var(--muted)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:12px}
.mt{margin-top:16px} .mt-s{margin-top:8px} .mt-l{margin-top:26px}
.glass{background:var(--card); border:1px solid var(--edge); border-radius:var(--r); box-shadow:0 18px 50px rgba(0,0,0,.28); backdrop-filter:blur(10px)}
.pad{padding:22px 24px}
.lbl{font-size:.72rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--vio2)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 20px; border-radius:14px;
  border:1px solid var(--edge); background:var(--card2); color:var(--text); font-weight:800; font-size:.95rem; transition:transform .15s, background .2s, border-color .2s, opacity .2s; text-decoration:none}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad); border-color:transparent; box-shadow:0 10px 30px rgba(255,79,163,.28)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:rgba(52,211,153,.18); border-color:rgba(52,211,153,.55)}
.btn.big{min-height:60px; padding:0 30px; font-size:1.1rem; border-radius:18px}
.btn.sm{min-height:38px; padding:0 13px; font-size:.82rem; border-radius:11px}
.btn[disabled]{opacity:.4; pointer-events:none}
.btn.on{background:rgba(139,92,246,.35); border-color:var(--vio2)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:99px; border:1px solid var(--edge); background:rgba(255,255,255,.06); font-weight:700; font-size:.85rem}
button.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{background:rgba(139,92,246,.38); border-color:var(--vio2)}
.chip.used{background:rgba(52,211,153,.2); border-color:rgba(52,211,153,.6)}
.chip.ph{background:rgba(255,79,163,.14); border-color:rgba(255,79,163,.45); color:#FFE1F0}
.seg{display:inline-flex; padding:3px; gap:3px; border-radius:13px; background:rgba(0,0,0,.25); border:1px solid var(--edge)}
.seg button{border:0; background:none; padding:6px 11px; border-radius:10px; font-weight:800; font-size:.78rem; color:var(--muted); min-height:34px}
.seg button.on{background:var(--grad); color:#fff}

/* avatars */
.av{display:inline-block; flex:none; border-radius:30%; object-fit:cover; background:#2A2460; box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.av.round{border-radius:50%}
.av.emo{display:inline-grid; place-items:center}

/* top bar */
#top{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:10px 18px; background:rgba(9,11,34,.86); backdrop-filter:blur(14px); border-bottom:1px solid var(--edge)}
#top .home{width:44px; height:44px; padding:0; border-radius:12px; flex:none; font-size:1.3rem}
.brand{line-height:1.05; flex:none}
.brand b{font-family:Anton,Impact,sans-serif; font-weight:400; font-size:1.1rem; letter-spacing:.04em}
.brand span{display:block; font-size:.7rem; font-weight:800; color:var(--vio2)}
.track{display:flex; align-items:center; gap:4px; flex:1; justify-content:center; min-width:0}
.track button{border:1px solid var(--edge); background:rgba(255,255,255,.05); color:var(--muted); border-radius:99px; min-width:36px; height:32px; padding:0 9px; font-weight:800; font-size:.78rem}
.track button.done{background:rgba(52,211,153,.22); border-color:rgba(52,211,153,.6); color:#D1FAE5}
.track button.now{background:var(--grad); border-color:transparent; color:#fff}
.track i{width:14px; height:2px; background:var(--edge); flex:none}
.tools{display:flex; gap:6px; align-items:center; flex:none}
.tools .btn{min-height:40px; padding:0 12px; font-size:.82rem}
@media (max-width:1100px){.tools .lb{display:none} .brand span{display:none}}
@media (max-width:820px){.track i{display:none} .track button{min-width:30px; padding:0 6px} #modeSeg{display:none}}
@media (max-width:560px){.brand{display:none} .track{justify-content:flex-start; overflow:auto} #btnFs{display:none}}

main{position:relative; z-index:1; flex:1}
#app{min-height:100vh; display:flex; flex-direction:column}
.wrap{width:min(1240px,100% - 36px); margin:0 auto}

/* workspace */
.ws{padding:26px 0 60px}
.hero{display:grid; grid-template-columns:1.3fr .7fr; gap:22px; align-items:stretch}
.hero h1{font-size:clamp(2.6rem,5.4vw,4.4rem); margin:6px 0 10px}
.hero .sub{font-size:1.15rem; color:var(--muted); margin:0 0 6px}
.cast{display:grid; gap:12px}
.cast .p{display:flex; gap:14px; align-items:center}
.cast .p b{display:block} .cast .p span{font-size:.8rem; color:var(--muted)}
.tabs{display:flex; gap:8px; margin:26px 0 16px}
.tabs button{border:1px solid var(--edge); background:var(--card); border-radius:14px; padding:12px 20px; font-weight:800; font-size:1rem; color:var(--muted)}
.tabs button.on{color:#fff; background:rgba(139,92,246,.30); border-color:var(--vio2)}
.wsgrid{display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start}
@media (max-width:980px){.hero,.wsgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.ep{grid-template-columns:48px minmax(0,1fr); gap:12px} .ep .num{width:48px!important; height:48px!important; font-size:1.25rem} .ep .st{grid-column:2; justify-self:start}}
.eplist{display:grid; gap:12px}
.ep{display:grid; grid-template-columns:62px minmax(0,1fr) auto; gap:16px; align-items:center; padding:16px 18px; border-radius:20px; border:1px solid var(--edge); background:var(--card); text-align:left; width:100%; transition:transform .15s, border-color .2s}
.ep:hover{transform:translateY(-2px); border-color:var(--vio2)}
.ep .num{width:62px; height:62px; border-radius:18px; display:grid; place-items:center; font-family:Anton,Impact,sans-serif; font-size:1.6rem; background:rgba(139,92,246,.22)}
.ep.done .num{background:rgba(52,211,153,.22)} .ep.now{border-color:var(--pink); box-shadow:0 0 0 1px var(--pink) inset}
.ep.lock{opacity:.55}
.ep h3{font-size:1.12rem} .ep .meta{font-size:.8rem; color:var(--muted); margin-top:4px}
.ep .st{font-size:.78rem; font-weight:800; padding:6px 11px; border-radius:99px; background:rgba(255,255,255,.07); white-space:nowrap}
.ep.done .st{background:rgba(52,211,153,.2); color:#BBF7D0}
.setup h3{font-size:1.05rem}
.cnt{display:flex; align-items:center; gap:10px}
.cnt b{font-size:2rem; min-width:40px; text-align:center; font-family:Anton,Impact,sans-serif}
.cnt button{width:46px; height:46px; border-radius:14px; border:1px solid var(--edge); background:var(--card2); font-size:1.3rem; font-weight:800}
.names{display:grid; gap:8px; margin-top:12px}
.names .n{display:flex; gap:8px; align-items:center}
.names input{flex:1; min-width:0; min-height:42px; border-radius:12px; border:1px solid var(--edge); background:rgba(0,0,0,.25); padding:0 12px}
.names .n.away input{opacity:.45; text-decoration:line-through}
.turns{display:grid; gap:8px; margin-top:10px}
.turns .t{display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center; font-size:.85rem}
.bar{height:9px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.bar i{display:block; height:100%; background:var(--grad); border-radius:inherit; transition:width .7s cubic-bezier(.2,.8,.2,1)}
.games{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px}
.game{padding:22px; border-radius:22px; border:1px solid var(--edge); background:var(--card); text-align:left; transition:transform .15s, border-color .2s}
.game:hover{transform:translateY(-3px); border-color:var(--cyan)}
.game .e{font-size:2.2rem} .game h3{margin:10px 0 6px; font-size:1.15rem} .game p{margin:0; font-size:.85rem; color:var(--muted)}
.game.played{border-color:rgba(52,211,153,.6)}

/* focus mode */
.fx{padding:18px 0 120px}
.fxhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.fxhead .eptag{font-weight:800; font-size:.95rem}
.fxhead .modetag{font-size:.75rem; font-weight:800; color:var(--cyan); border:1px solid rgba(62,232,255,.4); border-radius:99px; padding:4px 10px}
.dots{display:flex; gap:6px; margin-left:auto}
.dots i{width:28px; height:6px; border-radius:99px; background:rgba(255,255,255,.12)}
.dots i.d{background:var(--ok)} .dots i.c{background:var(--pink)}
.enter{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.q{font-size:clamp(1.6rem,3vw,2.4rem); font-weight:800; line-height:1.15; margin:0}
.qd{font-family:Anton,Impact,sans-serif; font-weight:400; font-size:clamp(2rem,4vw,3.2rem); text-transform:uppercase; line-height:1.02; margin:0}
.instr{font-size:1.15rem; color:var(--muted); margin:8px 0 0}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px; align-items:start}
.side{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:22px; align-items:start}
@media (max-width:900px){.two,.side{grid-template-columns:1fr}}
.fxnav{position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; align-items:center; gap:12px; padding:12px 18px; background:rgba(9,11,34,.9); backdrop-filter:blur(14px); border-top:1px solid var(--edge)}
.fxnav .info{flex:1; text-align:center; font-size:.85rem; color:var(--muted)}

/* intro */
.intro{text-align:center; padding:1vh 0 0}
.intro .l14{font-weight:800; letter-spacing:.3em; color:var(--vio2); font-size:1rem}
.intro h1{font-size:clamp(2.8rem,min(7vw,10vh),6rem); margin:4px 0 8px}
.intro .sub{font-size:clamp(1.1rem,2vw,1.4rem); font-weight:700; margin:0 0 16px}
.mission{max-width:720px; margin:0 auto 20px; font-size:1.15rem; padding:14px 22px}
.castrow{display:flex; justify-content:center; gap:28px; margin:0 0 18px; flex-wrap:wrap}
.castrow .p{display:flex; flex-direction:column; align-items:center; gap:8px; width:150px}
.castrow b{font-size:1rem} .castrow span{font-size:.75rem; color:var(--muted); text-align:center}

/* post */
.phone{width:min(380px,100%); margin:0 auto; border-radius:34px; padding:10px; background:#141846; border:2px solid rgba(196,181,253,.3); box-shadow:0 30px 80px rgba(0,0,0,.5); position:relative}
.post{border-radius:26px; overflow:hidden; background:#0E1236}
.post .ph{display:flex; gap:10px; align-items:center; padding:11px 14px}
.post .ph b{display:block; font-size:.92rem} .post .ph span{font-size:.72rem; color:var(--muted)}
.post .media{position:relative; aspect-ratio:4/5; background:#1A1F55; overflow:hidden}
.post .media img{display:block; width:100%; height:100%; object-fit:cover}
.post .likes{display:flex; justify-content:space-between; align-items:center; padding:10px 14px 4px; font-weight:800}
.post .likes .h{display:inline-block; animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}}
.cms{padding:4px 14px 14px; display:grid; gap:6px; min-height:12px}
.cm{font-size:.86rem; animation:enter .4s both} .cm b{margin-right:6px}
.floaty{position:absolute; bottom:12%; font-size:24px; pointer-events:none; animation:floaty 2.8s ease-out forwards}
@keyframes floaty{0%{opacity:0; transform:translateY(0) scale(.6)}15%{opacity:1}100%{opacity:0; transform:translateY(-220px) scale(1.15)}}
.notif{display:flex; gap:14px; align-items:flex-start; padding:18px 20px; border-radius:22px; background:linear-gradient(135deg,rgba(255,79,163,.18),rgba(139,92,246,.18)); border:1px solid rgba(255,155,203,.5); animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.notif .t{font-size:.72rem; font-weight:800; letter-spacing:.14em; color:var(--pink2)}
.notif p{margin:6px 0 0; font-size:1.25rem; font-weight:700}
@keyframes pop{from{opacity:0; transform:scale(.85) translateY(10px)}to{opacity:1; transform:none}}

/* polls */
.voters{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:14px 0 12px}
.voters .chip.v::after{content:" ✓"; color:var(--ok)}
.opts{display:grid; gap:10px}
.opt{position:relative; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 18px; border-radius:18px; border:1px solid var(--edge); background:var(--card); text-align:left; overflow:hidden; min-height:64px; transition:border-color .2s}
.opt:hover{border-color:var(--vio2)}
.opt .fill{position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(255,79,163,.25)); transition:width .8s cubic-bezier(.2,.8,.2,1); z-index:0}
.opt > *:not(.fill){position:relative; z-index:1}
.opt .e{font-size:1.5rem} .opt .t{font-weight:800; font-size:1.05rem}
.opt .n{font-weight:800; color:var(--muted); font-size:.9rem; white-space:nowrap; text-align:right}
.opt .who{display:block; font-size:.7rem; color:var(--pink2); font-weight:700}
.opt.win{border-color:var(--gold)}
.cards6{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media (max-width:700px){.cards6{grid-template-columns:repeat(2,1fr)}}
.rc{position:relative; padding:20px 14px; border-radius:20px; border:1px solid var(--edge); background:var(--card); text-align:center; overflow:hidden; min-height:130px}
.rc .e{font-size:2rem} .rc .t{display:block; font-weight:800; font-size:1.1rem; margin-top:6px} .rc .who{display:block; font-size:.72rem; color:var(--pink2); margin-top:6px; min-height:1em}
.rc .n{position:absolute; top:10px; right:12px; font-size:.8rem; font-weight:800; color:var(--muted)}
.rc:hover{border-color:var(--vio2)}

/* turn queue */
.queue{display:grid; gap:7px}
.qi{display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:9px 12px; border-radius:13px; border:1px solid var(--edge); background:rgba(255,255,255,.04); text-align:left; font-size:.82rem}
.qi .k{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; font-weight:800; background:rgba(255,255,255,.08); font-size:.78rem}
.qi.cur{border-color:var(--pink); background:rgba(255,79,163,.12)}
.qi.done .k{background:rgba(52,211,153,.3)} .qi.done{opacity:.75}
.qi.opt{opacity:.6; border-style:dashed}
.qi .s{font-weight:800; color:var(--vio2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px}
.meter{display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--muted); margin-bottom:10px}
.meter .bar{flex:1}
.turn{padding:30px 30px 26px}
.who{font-weight:800}
.turnwho{display:inline-flex; align-items:center; gap:10px; font-weight:800; font-size:1.05rem; padding:8px 16px 8px 8px; border-radius:99px; background:rgba(139,92,246,.22); border:1px solid rgba(179,157,255,.5)}
.turnwho i{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-style:normal; background:var(--grad); font-size:.9rem}
.badge-opt{font-size:.7rem; font-weight:800; letter-spacing:.1em; color:var(--gold); border:1px solid rgba(251,191,36,.5); border-radius:99px; padding:3px 9px}
.reveal{margin-top:14px; padding:14px 18px; border-radius:16px; background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.4); animation:enter .35s both}
.reveal.h{background:rgba(251,191,36,.1); border-color:rgba(251,191,36,.45)}
.reveal.v{background:rgba(139,92,246,.14); border-color:rgba(179,157,255,.5)}

/* vocab card */
.vcard{padding:22px 26px}
.vgrid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:24px; align-items:start}
.vgrid .reveal:first-child{margin-top:0}
@media (max-width:900px){.vgrid{grid-template-columns:1fr}}
.speaker{display:flex; gap:12px; align-items:center}
.speaker b{font-size:1rem} .speaker span{font-size:.75rem; color:var(--muted); display:block}
.bub{margin:12px 0 0; display:inline-block; padding:12px 16px; border-radius:20px 20px 20px 6px; background:rgba(255,255,255,.1); font-size:1.2rem; font-weight:600}
mark.p{background:rgba(255,79,163,.25); color:#fff; border-radius:7px; padding:0 5px; box-shadow:0 0 0 1px rgba(255,79,163,.6) inset}
.mopts{display:grid; gap:10px; margin-top:16px}
.mo{display:flex; gap:14px; align-items:center; padding:14px 18px; border-radius:16px; border:1px solid var(--edge); background:var(--card); text-align:left; font-weight:700; font-size:1.08rem}
.mo .l{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.1); font-weight:800; flex:none}
.mo.sel{border-color:var(--vio2); background:rgba(139,92,246,.22)}
.mo.right{border-color:var(--ok); background:rgba(52,211,153,.18)} .mo.right .l{background:var(--ok); color:#06281C}
.mo.wrong{border-color:var(--bad); background:rgba(251,113,133,.14); animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cdots{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.cdots button{min-width:44px; height:40px; border-radius:12px; border:1px solid var(--edge); background:rgba(255,255,255,.05); font-weight:800; font-size:.78rem; padding:0 6px; line-height:1.05}
.cdots button small{display:block; font-size:.62rem; color:var(--muted); font-weight:700; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cdots button.cur{border-color:var(--pink); background:rgba(255,79,163,.18)}
.cdots button.done{background:rgba(52,211,153,.22); border-color:rgba(52,211,153,.5)}
.cdots button.opt{border-style:dashed; opacity:.65}

/* listening */
.player{padding:26px}
.duo{display:flex; justify-content:center; gap:60px; margin:6px 0 18px}

/* ---------- smart task distribution: required turns = N × R ----------
   N = present students, R = rounds = floor(pool / N) (at least 1).
   Pool = the plan's tasks; if N is bigger than the plan, equivalent extras are added.
   Done tasks keep their student forever; only open tasks are re-balanced. Leftovers = Optional. */
const BLOCKS={hook:{bank:HOOK, base:5}, vocab:{bank:CARDS, base:10}, listen:{bank:LQ, base:5}, speak:{bank:FEED, base:5}};
function plan(b){
  const P=here(), N=Math.max(1,P.length), B=BLOCKS[b], all=B.bank;
  const pool=all.slice(0, Math.min(all.length, Math.max(B.base, N)));
  const R=Math.max(1, Math.floor(pool.length/N)), req=Math.min(pool.length, N*R);
  const load={}; P.forEach(p=>load[p.id]=0);
  all.forEach(t=>{ const d=S.done[t.id]; if(d && load[d.sid]!=null) load[d.sid]++; });
  const items=pool.map((t,i)=>{ const d=S.done[t.id]; return {t, i, req:i<req, done:!!d, sid:d&&d.sid, sname:d&&d.name}; });
  items.forEach(o=>{ if(o.done||!o.req||!P.length) return;
    let pick=P[o.i % P.length];
    if(load[pick.id]>=R) pick=[...P].sort((a,c)=>load[a.id]-load[c.id])[0];
    o.sid=pick.id; o.sname=pick.name; load[pick.id]++; });
  all.slice(pool.length).forEach((t,k)=>{ const d=S.done[t.id]; if(d) items.push({t, i:pool.length+k, req:false, done:true, sid:d.sid, sname:d.name}); });
  const vis=items.filter(o=>o.req||o.done||!S.skipOpt);
  return {items:vis, N, R, req, doneReq:items.filter(o=>o.req&&o.done).length};
}
function curTask(b){
  const p=plan(b), c=p.items.find(o=>o.t.id===S.cur[b]);
  return c || p.items.find(o=>o.req&&!o.done) || p.items.find(o=>!o.done) || p.items[p.items.length-1];
}
const blockDone=b=>{ const p=plan(b); return p.doneReq>=p.req; };
function finishTask(b, id){
  const p=plan(b), o=p.items.find(x=>x.t.id===id); if(!o) return;
  let sid=o.sid, name=o.sname;
  if(!sid){ const P=here(); const L={}; P.forEach(s=>L[s.id]=0); Object.values(S.done).forEach(d=>{ if(L[d.sid]!=null) L[d.sid]++; });
    const pk=[...P].sort((a,c)=>L[a.id]-L[c.id])[0]; sid=pk?pk.id:'-'; name=pk?pk.name:'Class'; }
  S.done[id]={sid, name}; delete S.cur[b];
  const nx=plan(b).items.find(x=>x.req&&!x.done); if(nx) S.cur[b]=nx.t.id;
  sfx('ok'); save();
}
function undoTask(b,id){ delete S.done[id]; S.cur[b]=id; save(); }
function queueHTML(b, label){

/* ---------- one shared timer (controlled from the screen or the teacher panel) ---------- */
const T={total:60, left:60, run:false, id:null};
function tmSet(sec){ tmPause(); T.total=T.left=sec; tmPaint(); }
function tmStart(){ if(T.run) return; if(T.left<=0) T.left=T.total; T.run=true; T.end=Date.now()+T.left*1000;
  T.id=setInterval(()=>{ T.left=Math.max(0,Math.round((T.end-Date.now())/1000)); if(T.left<=0){ tmPause(); sfx('end'); toast('⏰ Time is up!'); } tmPaint(); },250); tmPaint(); }
function tmPause(){ T.run=false; clearInterval(T.id); tmPaint(); }
function tmReset(){ tmPause(); T.left=T.total; tmPaint(); }
function tmAdd(s){ T.left+=s; T.total=Math.max(T.total,T.left); if(T.run) T.end+=s*1000; tmPaint(); }
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function tmPaint(){ $$('.tmr').forEach(el=>{ el.classList.toggle('run',T.run); el.classList.toggle('end',!T.run&&T.left===0); const d=$('.d',el); if(d) d.textContent=fmt(T.left); const b=$('[data-act="tmToggle"]',el); if(b) b.textContent=T.run?'⏸ Pause':'▶ Start'; }); }
const timerHTML=(big,add=30)=>`<div class="tmr ${big?'big':''}" role="timer" aria-label="Timer"><span class="d">${fmt(T.left)}</span>
  <button class="btn sm" data-act="tmToggle">${T.run?'⏸ Pause':'▶ Start'}</button><button class="btn sm" data-act="tmAdd" data-s="${add}">+${add}s</button><button class="btn sm" data-act="tmReset" aria-label="Reset timer">↺</button></div>`;

/* ---------- listening player: recorded mp3 or two browser voices ---------- */
const PL={i:0, playing:false, u:null, audio:null, vs:null};
function pickVoices(){
  const all=(window.speechSynthesis&&speechSynthesis.getVoices()||[]).filter(v=>/^en[-_]/i.test(v.lang));
  const score=v=>(/natural|neural|online/i.test(v.name)?4:0)+(/google|microsoft/i.test(v.name)?2:0)+(/en[-_](US|GB)/i.test(v.lang)?1:0);
  const male=/guy|andrew|brian|christopher|eric|davis|roger|steffan|ryan|thomas|daniel|alex|male|fred|mark|david|george|aaron/i;
  const sorted=[...all].sort((a,b)=>score(b)-score(a));
  const m=sorted.filter(v=>male.test(v.name));
  const leo=m[0]||sorted[0]||null, noah=m.find(v=>v!==leo)||sorted.find(v=>v!==leo)||leo;
  PL.vs={leo,noah}; return PL.vs;
}
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=()=>{ PL.vs=null; };
function plSpeak(){
  if(!PL.playing) return;
  if(PL.i>=SCRIPT.length){ PL.playing=false; PL.i=SCRIPT.length; S.f.heard=true; save(); plPaint(); render(); return; }
  const L=SCRIPT[PL.i], vs=PL.vs||pickVoices(), u=new SpeechSynthesisUtterance(L.t);
  const v=vs[L.s]; if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
  const same=vs.leo===vs.noah; u.pitch= L.s==='leo' ? (same?1.25:1.08) : (same?.8:.95);
  u.rate=(L.s==='leo'?1.02:.95)*S.rate; u.volume=1;
  u.onend=()=>{ if(PL.u!==u||!PL.playing) return; PL.i++; setTimeout(plSpeak,380); };
  u.onerror=u.onend; PL.u=u; speechSynthesis.speak(u); plPaint();
}
function plPlay(){
  const F=window.LESSON_CONFIG.AUDIO_FILE;
  if(F){ if(!PL.audio){ PL.audio=new Audio(F); PL.audio.onended=()=>{ PL.playing=false; S.f.heard=true; save(); plPaint(); render(); };
      PL.audio.onerror=()=>{ toast('Audio file not found — using browser voices'); window.LESSON_CONFIG.AUDIO_FILE=''; PL.audio=null; plPlay(); }; }
    PL.audio.playbackRate=S.rate; PL.audio.play(); PL.playing=true; plPaint(); return; }
  if(!window.speechSynthesis){ toast('This browser cannot read aloud — open the transcript instead'); return; }
  if(PL.i>=SCRIPT.length) PL.i=0;
  speechSynthesis.cancel(); PL.playing=true; setTimeout(plSpeak,60);
}
function plPause(){ PL.playing=false; if(PL.audio) PL.audio.pause(); if(window.speechSynthesis) speechSynthesis.cancel(); plPaint(); }
function plReplay(){ plPause(); PL.i=0; if(PL.audio) PL.audio.currentTime=0; setTimeout(plPlay,120); }
function plStop(){ if(PL.playing) plPause(); }
function hlPhr(t){ let h=esc(t); HL.forEach(p=>{ h=h.replace(new RegExp(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark class="p">${m}</mark>`); }); return h; }
function plPaint(){
  const box=$('#player'); if(!box) return;
  const L=SCRIPT[Math.min(PL.i,SCRIPT.length-1)], file=!!window.LESSON_CONFIG.AUDIO_FILE;
  $$('.duo .sp',box).forEach(el=>el.classList.toggle('on', PL.playing && !file && el.dataset.s===L.s));
  $('.wave',box).classList.toggle('go',PL.playing);
  const pb=$('[data-act="plToggle"]',box); pb.textContent=PL.playing?'⏸ Pause':(PL.i>0&&PL.i<SCRIPT.length?'▶ Continue':'▶ Play');
  $('#plPos',box).textContent= file ? (PL.playing?'Playing…':'') : `Line ${Math.min(PL.i+1,SCRIPT.length)} / ${SCRIPT.length}`;
  $('#plBar',box).style.width=(file?0:Math.min(PL.i,SCRIPT.length)/SCRIPT.length*100)+'%';
  const cap=$('#cap',box); if(cap) cap.innerHTML= S.f.cc && !file && (PL.playing||PL.i>0) ? `<span class="s">${CHAR[L.s].name}:</span>${esc(L.t)}` : '';
  $$('.tl',box).forEach((el,k)=>el.classList.toggle('cur', PL.playing && k===PL.i));
}

/* ---------- confetti (only at Mission Complete) ---------- */
function confetti(){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const C=['#8B5CF6','#FF4FA3','#3EE8FF','#FBBF24','#34D399'];
  for(let i=0;i<70;i++){ const d=document.createElement('i'); d.className='conf'; d.style.left=Math.random()*100+'vw';
    d.style.background=C[i%5]; d.style.animationDuration=(2.4+Math.random()*2)+'s'; d.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),5200); } }
function floatHearts(el,n=3){ if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const E=['❤️','💖','👍','😂','🔥','💀'];
  for(let i=0;i<n;i++) setTimeout(()=>{ if(!el.isConnected) return; const s=document.createElement('span'); s.className='floaty';
    s.textContent=E[Math.floor(Math.random()*E.length)]; s.style.left=(15+Math.random()*70)+'%'; el.appendChild(s); setTimeout(()=>s.remove(),2900); }, i*380); }

/* avatars */
function av(k,size=44,round=false){
  if(CHAR[k]) return `<img class="av ${round?'round':''}" src="${CHAR[k].img}" alt="${CHAR[k].name}" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
  const h=HANDLE[k]||['👤','#64748B'];
  return `<span class="av emo ${round?'round':''}" aria-hidden="true" style="width:${size}px;height:${size}px;background:${h[1]}55;font-size:${Math.round(size*.5)}px">${h[0]}</span>`;
}
const handleOf=k=> CHAR[k] ? CHAR[k].name : k;
/* ============================================================
   FOCUS SCREENS — one screen, one focus
   Each screen: html(), done(), and optional hooks for the teacher panel:
   answer(on), hint(), reset(), complete(), enter()
   ============================================================ */
const rv=k=>!!S.rv[k];
const cardOf=id=>S.card[id]||(S.card[id]={});

function groups(){
  let P=[...here()];
  if(S.seed){ let x=S.seed; P=P.map(p=>({p,k:(x=(x*9301+49297)%233280)})).sort((a,b)=>a.k-b.k).map(o=>o.p); }
  const N=P.length, m=S.mode; let sizes;
  if(!N) return [];
  if(m==='solo') sizes=Array(N).fill(1);
  else if(m==='pairs'){ sizes=[]; let r=N; while(r>0){ if(r===3){ sizes.push(3); r=0; } else { sizes.push(Math.min(2,r)); r-=2; } } }
  else if(m==='teams') sizes= N<=3?[N] : N===4?[2,2] : N===5?[2,3] : N===6?[3,3] : N===7?[3,4] : [4,4];
  else sizes=[N];
  const out=[]; let k=0;
  sizes.forEach((sz,g)=>{ const set=sz<=5?ROLESETS[sz]:[...ROLESETS[5],...['Adviser 2','Follower 2','Presenter 2'].slice(0,sz-5)];
    out.push({id:String.fromCharCode(65+g), members:P.slice(k,k+sz).map((s,i)=>({s, role:set[i]}))}); k+=sz; });
  return out;
}

  const where= inFx ? `${E.n==='Final'?'Final':'Episode '+E.n} · ${esc(E.title)} · step ${S.step+1}/${E.steps.length}${stepDone(k)?' ✓':''}` : S.view==='game'?'Game Zone':'Workspace';
  const ic=ICQ[E.id], note=NOTES[E.id];
  return `<div class="th"><b>🧑‍🏫 Teacher controls</b><button class="btn sm" data-act="tp" aria-label="Collapse the teacher panel">✕</button></div>
  <div class="tb">
    <div class="cur">${where}</div>
    <div><h4>THIS TASK</h4><div class="g">
      <button class="btn" data-act="tAnswer" ${inFx?'':'disabled'}>👁 Reveal Answer</button>
      <button class="btn" data-act="tHide" ${inFx?'':'disabled'}>🙈 Hide Answer</button>
      <button class="btn" data-act="tHint" ${inFx?'':'disabled'}>💡 Show Hint</button>
      <button class="btn ${S.f.note?'on':''}" data-act="tNote">📝 ${S.f.note?'Hide':'Show'} Teacher Note</button>
      <button class="btn" data-act="tReset" ${inFx?'':'disabled'}>↺ Reset Task</button>
      <button class="btn" data-act="tComplete" ${inFx?'':'disabled'}>✓ Mark as Complete</button>
      <button class="btn ${S.skipOpt?'on':''}" data-act="tSkip">⏭ Skip Optional${S.skipOpt?': ON':''}</button>
      <button class="btn" data-act="tUnlock" ${inFx||S.view==='ws'?'':'disabled'}>🔓 Unlock next</button>
      <button class="btn" data-act="prev" ${inFx?'':'disabled'}>← Previous</button>
      <button class="btn" data-act="next" ${inFx?'':'disabled'}>Next →</button></div></div>
    ${S.f.note?`<div class="note"><b>${esc(note)}</b>${ic?`<div class="mt-s">ICQ: <i>“${esc(ic[0])}”</i> → <b>${esc(ic[1])}</b></div>`:''}</div>`:''}
    <div><h4>TIMER</h4>${timerHTML(false,30)}
      <div class="row mt-s">${[30,60,120,180].map(s=>`<button class="btn sm" data-act="tmSet" data-s="${s}">${fmt(s)}</button>`).join('')}</div></div>
    <div><h4>SETTINGS</h4><div class="row">
      <button class="btn sm ${S.sound?'on':''}" data-act="sound">${S.sound?'🔊 Sounds on':'🔇 Sounds off'}</button>
      <button class="btn sm" data-act="openWs">👥 Students</button>
      <button class="btn sm" data-act="resetAll" style="border-color:rgba(251,113,133,.5)">⟲ RESET LESSON</button></div>
      <p class="tiny muted mt-s">Keys: ← → navigate · T panel · F full screen</p></div>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const top=$('#top'); top.innerHTML=topHTML();
  const m=$('#main'); const key=S.view==='fx'?curKey():S.view==='game'?'g:'+S.game:'ws:'+S.tab;
  m.innerHTML= S.view==='fx'?fxHTML() : S.view==='game'?gameHTML() : wsHTML();
  $('#tp').innerHTML=tpHTML(); $('#tp').classList.toggle('open',!!S.tp);
  if(key!==LASTSCREEN){ window.scrollTo(0,0); const sc=S.view==='fx'&&SCR[curKey()].enter; LASTSCREEN=key; if(sc) SCR[curKey()].enter(); }
  if(S.view==='fx'&&curKey()==='listen') plPaint();
  animateBars(); tmPaint(); save();
}

/* ---------- navigation ---------- */
function goEp(i,step=0){ plStop(); if(S.ep!==i) S.mode=EPS[i].def; S.ep=i; S.step=step; S.view='fx'; render(); }
let NAG=null;
function next(){
  if(S.view!=='fx') return;
  const k=curKey(), E=EPS[S.ep];
  if(!stepDone(k) && NAG!==k){ NAG=k; setTimeout(()=>{ if(NAG===k) NAG=null; },5000); toast('This step isn’t finished yet — press Next again to continue anyway'); return; }
  NAG=null; plStop();
  if(S.step<E.steps.length-1){ S.step++; render(); }
  else if(S.ep<EPS.length-1){ S.f['U:'+(S.ep+1)]=true; goEp(S.ep+1); }
  else { S.view='ws'; render(); }
}
function prev(){ if(S.view!=='fx') return; plStop();
  if(S.step>0){ S.step--; render(); } else if(S.ep>0){ goEp(S.ep-1, EPS[S.ep-1].steps.length-1); } else { S.view='ws'; render(); } }

function copyText(t){ (navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Copied ✓'),fb)) || fb();
  function fb(){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); toast('Copied ✓'); }catch(e){ toast('Copy failed'); } a.remove(); } }

/* ---------- actions ---------- */
const ACT={
  hub(el,e){ /* normal link */ },
  ws(){ plStop(); S.view='ws'; render(); },
  openWs(){ plStop(); S.view='ws'; S.tab='core'; render(); setTimeout(()=>{ const s=$('#setup'); s&&s.scrollIntoView({behavior:'smooth',block:'center'}); },60); },
  tab(el){ S.tab=el.dataset.t; render(); },
  openGames(){ S.view='ws'; S.tab='game'; render(); },
  openEp(el){ const i=+el.dataset.i;
    if(epLocked(i)){ modal(`<h3>🔒 Episode ${EPS[i].n} is locked</h3><p class="muted">The story opens step by step. Finish Episode ${EPS[i-1].n} first — or open it anyway as the teacher.</p>
      <div class="row mt"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="forceOpen" data-i="${i}">Open anyway</button></div>`); return; }
    const E=EPS[i]; let st=E.steps.findIndex(s=>!stepDone(s)); if(st<0) st=0; if(S.view==='fx'&&S.ep===i) st=S.step; goEp(i,st); },
  forceOpen(el){ const i=+el.dataset.i; S.f['U:'+i]=true; closeModal(); goEp(i); },
  mclose(){ closeModal(); },
  next(){ next(); }, prev(){ prev(); },
  mode(el){ S.mode=el.dataset.m; render(); },
  tp(){ S.tp=!S.tp; render(); },
  fs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{}); },
  cnt(el){ setCount(here().length+ +el.dataset.d); render(); },
  here(el){ const s=stu(el.dataset.sid); if(!s.here && here().length>=MAXS) return toast(MAXS+' students maximum');
    if(s.here && here().length<=1) return toast('At least one student'); s.here=!s.here; render(); },
  startInv(){ S.f.intro=true; S.step=1; render(); },
  postNext(){ S.f.post=(S.f.post||0)+1; sfx(S.f.post>=4?'ok':'tap'); render(); },
  voter(el){ S.act[el.dataset.poll]=el.dataset.sid; render(); },
  vote(el){ castVote(el.dataset.poll,+el.dataset.i); render(); },
  pollReset(el){ const id=el.dataset.poll; delete S.vote[id]; delete S.anon[id]; delete S.act[id]; render(); },
  pickTask(el){ S.cur[el.dataset.b]=el.dataset.id; render(); },
  done(el){ finishTask(el.dataset.b,el.dataset.id); if(el.dataset.b==='speak') tmReset(); render(); },
  undo(el){ undoTask(el.dataset.b,el.dataset.id); render(); },
  rv(el){ const k=el.dataset.k; S.rv[k]=!S.rv[k]; render(); },
  cpick(el){ const s=cardOf(el.dataset.id); s.p=+el.dataset.i; s.c=0; render(); },
  ccheck(el){ const s=cardOf(el.dataset.id); s.c=1; sfx(s.p===0?'ok':'bad'); render(); },
  chint(el){ cardOf(el.dataset.id).h=1; render(); },
  cflag(el){ const s=cardOf(el.dataset.id); s[el.dataset.k]=s[el.dataset.k]?0:1; render(); },
  plToggle(){ PL.playing?plPause():plPlay(); },
  plReplay(){ plReplay(); },
  rate(el){ S.rate=+el.dataset.r; if(PL.audio) PL.audio.playbackRate=S.rate; render(); },
  cc(){ S.f.cc=!S.f.cc; render(); },
  tr(){ S.f.tr=!S.f.tr; render(); },
  crit(el){ const a=S.crit[el.dataset.id]=S.crit[el.dataset.id]||[]; a[+el.dataset.i]=!a[+el.dataset.i]; render(); },
  fchip(el){ const a=S.used[el.dataset.id]=S.used[el.dataset.id]||[], c=el.dataset.c; const i=a.indexOf(c); i<0?a.push(c):a.splice(i,1);
    const cr=S.crit[el.dataset.id]=S.crit[el.dataset.id]||[]; cr[2]=a.length>0; render(); },
  fans(el){ const id=el.dataset.id; (S.fst[id]=S.fst[id]||{}).a=1; const cr=S.crit[id]=S.crit[id]||[]; cr[0]=cr[1]=true; tmReset(); render(); },
  team(el){ S.team=+el.dataset.i; render(); },
  shuffle(){ S.seed=Math.floor(Math.random()*1e5)+1; S.team=0; render(); },
  copyTeams(){ const G=groups(); copyText('BREAKOUT MISSION — SAVE THE FRIENDSHIP\nCreate a Three-Step Rescue Plan for Leo:\n1) What should Leo do with the video?\n2) What should he say to Mia?\n3) What should he tell his followers?\nUse 3+ phrases · 30–45 seconds · everyone speaks.\n\n'
    +G.map(g=>'Team '+g.id+': '+g.members.map(m=>m.s.name+' ('+m.role+')').join(', ')).join('\n')+'\n\nPhrases: '+BANK.join(' · ')); },
  bchip(el){ const t='team'+el.dataset.team, a=S.used[t]=S.used[t]||[], c=el.dataset.c, i=a.indexOf(c); i<0?a.push(c):a.splice(i,1); sfx('tap'); render(); },
  pres(el){ const t=el.dataset.t; S.pres[t]=!S.pres[t]; render(); },
  react(el){ const R=S.react[el.dataset.t]=S.react[el.dataset.t]||{}; R[el.dataset.k]=(R[el.dataset.k]||0)+1; sfx('tap'); render(); },
  closeVote(){ S.f.closed=true; sfx('ok'); render(); setTimeout(()=>{ const c=$('.cons'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); },80); },
  reopenVote(){ S.f.closed=false; S.f.ending=false; render(); },
  ending(){ S.f.ending=true; sfx('ok'); render(); setTimeout(()=>{ const c=$('.ending'); c&&c.scrollIntoView({behavior:'smooth',block:'center'}); },80); },
  tmToggle(){ T.run?tmPause():tmStart(); }, tmReset(){ tmReset(); }, tmAdd(el){ tmAdd(+el.dataset.s); }, tmSet(el){ tmSet(+el.dataset.s); },
  /* teacher panel */
  tAnswer(){ const s=SCR[curKey()]; if(s.answer) s.answer(true); else toast('No hidden answer on this screen'); render(); },
  tHide(){ const s=SCR[curKey()]; if(s.answer) s.answer(false); Object.keys(S.rv).forEach(k=>{ if(!/^bicq/.test(k)||curKey()==='brief') S.rv[k]=false; }); render(); },
  tHint(){ const s=SCR[curKey()]; if(s.hint){ s.hint(); render(); } else toast('No hint for this screen'); },
  tNote(){ S.f.note=!S.f.note; render(); },
  tReset(){ const s=SCR[curKey()]; if(s.reset) s.reset(); delete S.f['F:'+curKey()]; render(); toast('Task reset'); },
  tComplete(){ const k=curKey(), s=SCR[k]; if(s.complete) s.complete(); else S.f['F:'+k]=true; render(); },
  tSkip(){ S.skipOpt=!S.skipOpt; render(); toast(S.skipOpt?'Optional tasks hidden':'Optional tasks shown'); },
  tUnlock(){ const i=S.view==='fx'?S.ep+1:EPS.findIndex((e,j)=>epLocked(j)); if(i>0&&i<EPS.length){ S.f['U:'+i]=true; render(); toast('Episode '+EPS[i].n+' unlocked'); } else toast('Nothing locked'); },
  sound(){ S.sound=!S.sound; render(); },
  resetAll(){ modal(`<h3>Reset the whole lesson?</h3><p class="muted">All progress, votes, reactions, turns and notes will be cleared. Student names and settings stay.</p>
    <div class="row mt"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="resetYes">⟲ Yes, reset</button></div>`); },
  resetYes(){ const keep={students:S.students, names:S.names, sound:S.sound, rate:S.rate, tp:S.tp}; plStop(); tmSet(60);
    S=Object.assign(FRESH(),keep); LASTW={}; closeModal(); render(); toast('Lesson reset'); },
  /* game zone */
  openGame(el){ plStop(); S.game=el.dataset.g; S.view='game'; render(); },
  gt(el){ S.g[el.dataset.k]=!S.g[el.dataset.k]; if(el.dataset.k==='hm'||el.dataset.k==='he') S.g.peek={}; render(); },
  copyKahoot(){ copyText(KAHOOT.map(([q,o],i)=>`${i+1}. ${q}\n${o.map((x,j)=>'ABCD'[j]+'. '+x).join('\n')}\nCorrect: A`).join('\n\n')); },
  peek(el){ (S.g.peek=S.g.peek||{})[el.dataset.k]=1; render(); },
  aliasRand(){ const left=ALIAS.map((_,i)=>i).filter(i=>!(S.g.ax||[]).includes(i)&&i!==S.g.ahl); const pool=left.length?left:ALIAS.map((_,i)=>i);
    S.g.ahl=pool[Math.floor(Math.random()*pool.length)]; sfx('tap'); render(); },
  aliasX(el){ const a=S.g.ax=S.g.ax||[], i=+el.dataset.i, k=a.indexOf(i); k<0?a.push(i):a.splice(k,1); if(a.length===10) S.g.aliasPlayed=true; render(); },
  aliasReset(){ S.g.ax=[]; S.g.ahl=null; S.g.peek={}; S.g.hm=false; S.g.he=false; render(); },
  who(el){ const i=S.g.wi||0; (S.g.wp=S.g.wp||{})[i]=el.dataset.k; sfx(el.dataset.k===WHO[i][1]?'ok':'bad'); if(Object.keys(S.g.wp).length>=WHO.length) S.g.whoPlayed=true; render(); },
  gstep(el){ const k=el.dataset.k; S.g[k]=Math.max(0,(S.g[k]||0)+ +el.dataset.d); render(); },
  fixReady(){ (S.g.fr=S.g.fr||{})[S.g.fi||0]=1; render(); },
  fixShow(){ (S.g.fs=S.g.fs||{})[S.g.fi||0]=1; if(Object.keys(S.g.fs).length>=FIX.length) S.g.fixPlayed=true; render(); },
  hot(el){ const i=S.g.hi||0, C=(S.g.hc=S.g.hc||{})[i]=(S.g.hc[i]||[0,0,0]); C[+el.dataset.i]++; if(Object.keys(S.g.hc).length>=HOT.length) S.g.hotPlayed=true; sfx('tap'); render(); },
  hotReset(){ if(S.g.hc) delete S.g.hc[S.g.hi||0]; render(); }
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='hub'){ if(S.view!=='ws'||Object.keys(S.done).length){ save(); } return; }
  if(el.tagName==='A') e.preventDefault();
  const f=ACT[el.dataset.act]; if(f){ f(el,e); }
});
document.addEventListener('contextmenu',e=>{ const el=e.target.closest('[data-act="react"]'); if(!el) return; e.preventDefault();
  const R=S.react[el.dataset.t]||{}; if(R[el.dataset.k]>0){ R[el.dataset.k]--; render(); } });
document.addEventListener('input',e=>{ const el=e.target, k=el.dataset.in; if(!k) return;
  if(k==='name'){ const s=stu(el.dataset.sid); if(s) s.name=el.value.slice(0,24)||s.name; }
  else if(k==='names'){ S.names=el.checked; }
  else if(k==='plan'){ (S.plan[el.dataset.team]=S.plan[el.dataset.team]||{})[el.dataset.k]=el.value; }
  else if(k==='own'){ S.own[el.dataset.sid]=el.value.slice(0,80); }
  save(); });
document.addEventListener('change',e=>{ if(e.target.dataset.in==='name'||e.target.dataset.in==='names') render(); });
document.addEventListener('dragstart',e=>{ const el=e.target.closest&&e.target.closest('.bank .chip'); if(el){ e.dataTransfer.setData('text/plain',el.dataset.c); e.dataTransfer.effectAllowed='copy'; } });
document.addEventListener('dragover',e=>{ const t=e.target.closest&&e.target.closest('input[data-in="plan"]'); if(t){ e.preventDefault(); t.classList.add('drop'); } });
document.addEventListener('dragleave',e=>{ const t=e.target.closest&&e.target.closest('input[data-in="plan"]'); if(t) t.classList.remove('drop'); });
document.addEventListener('drop',e=>{ const t=e.target.closest&&e.target.closest('input[data-in="plan"]'); if(!t) return; e.preventDefault();
  const c=e.dataTransfer.getData('text/plain'); if(!c) return; t.value=(t.value?t.value.replace(/\s*$/,' '):'')+c+' '; t.classList.remove('drop');
  const team=t.dataset.team; (S.plan[team]=S.plan[team]||{})[t.dataset.k]=t.value;
  const a=S.used['team'+team]=S.used['team'+team]||[]; if(!a.includes(c)) a.push(c); render(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#modal').classList.contains('on')) closeModal(); else if(S.tp){ S.tp=false; render(); } return; }
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowRight'&&S.view==='fx'){ next(); e.preventDefault(); }
  else if(e.key==='ArrowLeft'&&S.view==='fx'){ prev(); e.preventDefault(); }
  else if(e.key==='t'||e.key==='T'){ S.tp=!S.tp; render(); }
  else if(e.key==='f'||e.key==='F'){ ACT.fs(); }
});
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

load(); render();
</script>
</body>
</html>
