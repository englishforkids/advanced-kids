mark.key{background:linear-gradient(transparent 52%,rgba(255,179,71,.55) 52%);color:inherit;padding:0 2px;border-radius:3px;animation:mk .6s both}
@keyframes mk{from{background-size:0 100%}}
.sidesum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ss{display:flex;align-items:center;gap:10px;border-radius:18px;padding:10px 12px;background:rgba(10,8,26,.6);border:1px solid var(--line2);opacity:.6;transition:opacity .3s}
.ss.on{opacity:1;border-color:var(--c)}
.ss span{display:block;font-size:14px;color:var(--muted);font-weight:700}
.dq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:clamp(17px,1.4vw,22px);font-weight:700}
.dq:first-of-type{border-top:0} .dq>span{flex:1;min-width:240px}
.minimsg{display:flex;gap:10px;margin-top:12px;border-radius:16px;padding:10px 14px;background:rgba(247,243,236,.08);border:1px dashed var(--line2);font-size:clamp(15px,1.15vw,18px)}
.minimsg p{margin:2px 0 0;color:#E4E0F5}

/* vocabulary situation card */
.sitcard{border-radius:20px;padding:14px 18px;background:#F7F3EC;color:#1C1730;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.sitcard .sk{font-size:12px;font-weight:800;letter-spacing:.14em;color:#7A4CC7}
.sitcard p{margin:4px 0 0;font-family:var(--disp);font-size:clamp(22px,2.3vw,34px);font-weight:700;line-height:1.22}
.fb{font-family:var(--disp)} .fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}

/* spotlight grammar */
.tooltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tt{font-size:13px;font-weight:800;letter-spacing:.06em;border-radius:999px;padding:5px 12px;border:1px solid var(--line2);color:var(--dim)}
.tt.on{color:#1A0B05;background:var(--amber);border-color:var(--amber)} .tt.done{color:var(--ok);border-color:rgba(91,227,168,.5)}
.spotstage{position:relative;overflow:hidden;border-radius:30px;padding:clamp(18px,2.6vw,36px) clamp(16px,2vw,30px);text-align:center;background:radial-gradient(90% 120% at 50% -10%,rgba(80,60,150,.55),rgba(8,6,20,.95) 60%);border:1px solid var(--line2)}
.spotstage .beam{position:absolute;left:50%;top:-30%;width:62%;height:160%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 160deg,rgba(255,226,170,.16) 172deg,rgba(255,226,170,.22) 180deg,rgba(255,226,170,.16) 188deg,transparent 200deg);opacity:.35;transition:opacity .8s;pointer-events:none}
.spotstage.lit .beam{opacity:1}
.spsent{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:.25em .3em;margin:10px 0;font-family:var(--disp);font-size:clamp(28px,3.6vw,58px);font-weight:800;line-height:1.15}
.tok{font:inherit;color:#EDE8FF;background:transparent;border:0;border-radius:12px;padding:.04em .18em;transition:all .35s;cursor:pointer}
.tok:hover{background:rgba(255,255,255,.07)}
.tok.miss{animation:shake .45s both;color:var(--coral)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tok.f.lit,.spotw{color:#1A0B05;background:linear-gradient(135deg,#FFE9BE,var(--amber));box-shadow:0 0 0 3px rgba(255,179,71,.35),0 0 50px rgba(255,190,110,.75),0 0 120px rgba(255,170,80,.35);animation:spotpop .6s cubic-bezier(.2,1.4,.4,1) both}
.spotw{border-radius:10px;padding:0 .2em;font-weight:800}
.spotw.big{font-family:var(--disp)}
@keyframes spotpop{from{transform:scale(.85);box-shadow:none}}
.pattern{margin-top:14px;border-radius:24px;padding:14px 16px;background:rgba(10,8,26,.7);border:1px solid var(--line2);text-align:center}
.frow{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px;margin-top:6px}
.fc{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;padding:8px 12px;background:rgba(255,255,255,.06);border:1px solid var(--line2)}
.fc .w{font-family:var(--disp);font-size:clamp(19px,1.9vw,30px);font-weight:800}
.fc .l{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fc.f{background:linear-gradient(135deg,rgba(255,226,170,.25),rgba(255,179,71,.18));border-color:var(--amber)} .fc.f .l{color:var(--amber)}
.fc.v{border-color:rgba(98,207,224,.6)} .fc.v .l{color:var(--cyan)}
.fc.r{border-color:rgba(180,140,255,.7)} .fc.r .l{color:var(--lav)}
.frow .plus{align-self:center;color:var(--dim);font-weight:800}
.fline{margin-top:10px;font-family:var(--disp);font-size:clamp(17px,1.5vw,23px);color:var(--gold2)}
.rule{border-radius:22px;padding:14px 18px;background:rgba(10,8,26,.66);border:1px solid var(--line2)}
.rule .ex1{font-size:clamp(18px,1.55vw,24px);font-weight:700;margin:4px 0 6px}
.rule ul{margin:0;padding-left:1.2em;font-size:clamp(17px,1.4vw,22px);font-weight:600}
.rule.alt .spsent{font-size:clamp(22px,2.4vw,36px);justify-content:flex-start}
.ccq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:20px;padding:12px 16px;background:rgba(98,207,224,.1);border:1px solid rgba(98,207,224,.5);font-size:clamp(18px,1.55vw,24px)}
.ccq .ck{font-size:12px;font-weight:800;letter-spacing:.14em;color:#06222A;background:var(--cyan);border-radius:6px;padding:2px 8px}
.ccq b{flex:1;min-width:240px}
.ccq .ca{font-family:var(--disp);font-weight:800;color:var(--ok);animation:lnin .35s both}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){ .cmp2{grid-template-columns:1fr} }
.cs{border-radius:24px;padding:16px 20px;border:1px solid var(--line2);background:rgba(10,8,26,.66)}
.cs small{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.cs p{margin:6px 0 0;font-family:var(--disp);font-size:clamp(24px,2.7vw,42px);font-weight:800;line-height:1.2}
.cs.emph{border-color:rgba(255,179,71,.6);background:radial-gradient(90% 140% at 50% 0%,rgba(255,179,71,.14),rgba(10,8,26,.7) 70%)}
.cs.emph small{color:var(--amber)}
.cs .gap{color:var(--dim)}
.ctag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;border-radius:8px;padding:3px 9px;background:rgba(255,255,255,.1);color:#fff}
.ctag.k-it{background:rgba(255,179,71,.2);color:var(--amber)} .ctag.k-what{background:rgba(98,207,224,.18);color:var(--cyan)} .ctag.k-all{background:rgba(180,140,255,.2);color:var(--lav)}
.cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){ .cmp3{grid-template-columns:1fr} }
.c3{text-align:left;border-radius:24px;padding:16px 18px;background:rgba(10,8,26,.7);border:1px solid var(--line2);display:flex;flex-direction:column;gap:8px;transition:all .3s}
.c3 p{margin:0;font-family:var(--disp);font-size:clamp(20px,2vw,30px);font-weight:800;line-height:1.2}
.c3.on{border-color:var(--amber);box-shadow:0 0 30px rgba(255,179,71,.25)}
.c3 .tagp{color:var(--ok);font-family:var(--disp);font-size:clamp(17px,1.4vw,21px);animation:lnin .35s both}

/* script (grammar practice) */
.script{border-radius:24px;overflow:hidden;background:#F7F3EC;color:#1C1730;box-shadow:0 18px 46px rgba(0,0,0,.4);
  background-image:repeating-linear-gradient(180deg,transparent 0 38px,rgba(90,70,160,.08) 38px 39px)}
.script.tilt{transform:rotate(-1.2deg)}
.script .shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#2A1F5A;color:#fff;font-weight:800;font-size:14px;letter-spacing:.06em}
.srow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;padding:12px 18px}
.srow .lab{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7A6E9A;min-width:9ch}
.srow .st{font-family:var(--disp);font-size:clamp(24px,2.6vw,40px);font-weight:800;line-height:1.2}
.srow.em .lab{color:#B76A00}
.srow.bad .st{color:#5A2030}
.srow.fix{background:rgba(91,227,168,.14)} .srow.fix .st{font-size:clamp(19px,1.9vw,29px)}
.srow .st.blur{filter:blur(3px);font-size:clamp(17px,1.4vw,22px)}
.sarrow{padding:0 18px;font-size:14px;font-weight:800;color:#7A4CC7}
.script .gap{display:inline-block;min-width:5ch;border-bottom:4px solid #B76A00;color:#B76A00;text-align:center}
.script .spotw{box-shadow:0 0 0 3px rgba(255,179,71,.35),0 0 30px rgba(255,190,110,.6)}
span.del{text-decoration:line-through;text-decoration-thickness:3px;color:#C2364A;background:rgba(194,54,74,.1);border-radius:4px;padding:0 3px}
span.ins{color:#0E7A4E;background:rgba(14,122,78,.14);border-radius:4px;padding:0 3px}

/* advice hotline */
.call{border-radius:28px;padding:clamp(16px,2vw,26px);background:linear-gradient(160deg,rgba(40,24,80,.9),rgba(14,10,32,.95));border:1px solid var(--line2)}
.call.ring{display:flex;align-items:center;gap:clamp(14px,2vw,28px);flex-wrap:wrap}
.cring{position:relative;width:96px;height:96px;flex:none;display:grid;place-items:center}
.cring span{position:relative;z-index:1;font-size:46px;animation:wig 1.2s ease-in-out infinite}
.cring i{position:absolute;inset:0;border-radius:50%;border:3px solid var(--amber);opacity:0;animation:cring 1.8s ease-out infinite}
.cring i:nth-child(2){animation-delay:.6s}.cring i:nth-child(3){animation-delay:1.2s}
@keyframes cring{from{opacity:.9;transform:scale(.55)}to{opacity:0;transform:scale(1.35)}}
.cinfo{flex:1;min-width:220px} .cinfo small{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--amber)}
.cinfo b{display:block;font-family:var(--disp);font-size:clamp(28px,3vw,46px);line-height:1.05;margin:4px 0} .cinfo span{color:var(--muted);font-weight:700}
.call.open{animation:lnin .45s both}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chead b{font-family:var(--disp);font-size:clamp(24px,2.4vw,36px)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.14em;color:#fff;background:rgba(200,20,45,.5);border:1px solid #FF5A6A;border-radius:8px;padding:3px 9px}
.live i{width:8px;height:8px;border-radius:50%;background:#FF4D5E;animation:recp 1.6s infinite}
.cbub{display:flex;gap:12px;align-items:flex-start}
.cbub .cav{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:rgba(255,179,71,.18);border:1px solid rgba(255,179,71,.5)}
.cbub p{margin:0;border-radius:6px 22px 22px 22px;padding:12px 18px;background:#F7F3EC;color:#1C1730;font-size:clamp(19px,1.7vw,27px);font-weight:700;line-height:1.35;flex:1}
.mainq{margin-top:14px;border-radius:20px;padding:12px 18px;background:radial-gradient(120% 160% at 0% 0%,rgba(255,179,71,.22),rgba(255,179,71,.05) 70%);border:2px solid var(--amber);font-family:var(--disp);font-size:clamp(22px,2.4vw,36px);font-weight:800;box-shadow:0 0 34px rgba(255,179,71,.22);animation:spotpop .6s both}
.mainq small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;color:var(--amber)}

/* breakout + presentation */
.mq.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){ .mq.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
.rlist{display:flex;flex-direction:column;gap:6px} .rlist div{border-radius:14px;padding:8px 12px;background:rgba(10,8,26,.55);border:1px solid var(--line2)}
.rlist b{display:block} .rlist span{font-size:15px;color:var(--muted);font-weight:600}
.sampleep{border-radius:22px;padding:14px 18px;background:#F7F3EC;color:#1C1730;animation:lnin .4s both}
.sampleep p{margin:6px 0;font-size:clamp(17px,1.4vw,22px);font-weight:600} .sampleep .kicker{color:#7A4CC7}
.clc{display:inline-flex;align-items:center;gap:4px}
.clc .chip b{margin-left:4px;font-family:var(--disp)}

/* episode cover */
.cover28{position:relative;flex:none;width:clamp(150px,14vw,210px);aspect-ratio:1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  background:radial-gradient(80% 70% at 70% 20%,rgba(255,179,71,.55),transparent 60%),radial-gradient(90% 90% at 10% 100%,rgba(155,107,255,.7),transparent 70%),linear-gradient(160deg,#2A1650,#120C2C);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.5)}

.cover28 .ct b{font-size:11px;letter-spacing:.2em;color:var(--gold2)} .cover28.big .ct b{font-size:clamp(14px,1.3vw,18px)}
.cover28 .ct .t{font-family:var(--disp);font-size:clamp(12px,1vw,15px);font-weight:800;color:#fff} .cover28.big .ct .t{font-size:clamp(20px,2.2vw,32px)}
.cover28 .hosts{position:absolute;left:14px;top:14px;display:flex} .cover28 .hosts .av+.av{margin-left:-12px}
.cover28.big .hosts{left:clamp(18px,2.4vw,30px);top:clamp(18px,2.4vw,30px)}
.cover28 .rings{position:absolute;right:-20%;top:-20%;width:90%;aspect-ratio:1}
.cover28 .rings i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,220,170,.35);animation:waves 4.5s ease-out infinite}
.cover28 .rings i:nth-child(2){animation-delay:1.5s}.cover28 .rings i:nth-child(3){animation-delay:3s}
@keyframes waves{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.4)}}
.coverwrap{display:flex;justify-content:center;animation:coverin 1.2s cubic-bezier(.2,1,.3,1) both}
@keyframes coverin{from{opacity:0;transform:translateY(30px) scale(.9) rotate(-2deg)}}
.capt{font-family:var(--hand);font-size:clamp(26px,2.6vw,40px);color:var(--gold2)}

   Lesson 29 · The Message at Midnight · Revision 27–28 (friendship expressions + cleft sentences)

const CFG = window.LESSON_CONFIG || {};

const GCARDS = [
  {k:'it',   name:'IT-CLEFT',   icon:'🎯', f:'It + is/was + important information + who/that + clause', ex:'{It was} [Leo] {who} posted the video.', note:'who → people · that → things, events, situations'},
  {k:'what', name:'WHAT-CLEFT', icon:'💡', f:'What + clause + is/was + important information',           ex:'{What upset Maya was} [that Leo ignored her request].', note:'The important information comes after is / was.'},
  {k:'all',  name:'ALL-CLEFT',  icon:'☝️', f:'All + clause + is/was + important information',            ex:'{All Maya wanted was} [some space].', note:'The ONE thing somebody wanted, needed or did.'}
];
/* N students → N tasks: 1–5 exactly from the plan, 6–10 equivalent extras */
const GRAM = [
  {id:'G1', k:'it',   orig:'Leo posted the video, not Ethan.',               instr:'Emphasise Leo. Start with: It was…',            a:'{It was} [Leo] {who} posted the video.', why:'Leo is a person → who.'},
  {id:'G2', k:'it',   orig:'Maya asked for space, not Sofia.',               instr:'Emphasise Maya.',                               a:'{It was} [Maya] {who} asked for space.', why:'Past story → It was. A person → who.'},
  {id:'G3', k:'what', orig:'Leo ignored Maya’s request. That upset her.',    instr:'Start with: What upset Maya was…',              a:'{What upset Maya was} [that Leo ignored her request].', why:'The important information comes after was.'},
  {id:'G4', k:'what', orig:'Leo needs to respect Maya’s boundaries.',        instr:'Start with: What Leo needs to do is…',          a:'{What Leo needs to do is} [respect Maya’s boundaries].', why:'After “What … needs to do is” we use the base verb: respect.'},
  {id:'G5', k:'all',  orig:'Maya only wanted some time.',                    instr:'Start with: All Maya wanted was…',              a:'{All Maya wanted was} [some time].', why:'All = the one thing she wanted. “only” is not needed any more.'},
  {id:'G6', k:'it',   orig:'Maya finally replied at midnight, not in the evening.', instr:'Emphasise the time. Start with: It was at…', a:'{It was} [at midnight] {that} Maya finally replied.', why:'A time, not a person → that.'},
  {id:'G7', k:'it',   orig:'Sofia wanted to hear both sides, not Ethan.',    instr:'Emphasise Sofia.',                              a:'{It was} [Sofia] {who} wanted to hear both sides.', why:'Sofia is a person → who.'},
  {id:'G8', k:'what', orig:'Maya needs time to calm down.',                  instr:'Start with: What Maya needs is…',               a:'{What Maya needs is} [time to calm down].', why:'What + clause + is + the important information.'},

  {id:'G10',k:'all',  orig:'Leo only wanted to fix the problem.',            instr:'Start with: All Leo wanted was…',               a:'{All Leo wanted was} [to fix the problem].', why:'All = the one thing. want + to → was TO fix.'}
];

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* a standing/sitting silhouette — x = centre, y = feet, s = scale */
function person(x,y,s,fill,o={}){
  const P=(dx,dy)=>f1(x+dx*s)+' '+f1(y+dy*s);
  let h=`<g opacity="${o.op??1}">`;
  if(o.bag) h+=`<rect x="${f1(x+(o.bag>0?18:-44)*s)}" y="${f1(y-96*s)}" width="${f1(26*s)}" height="${f1(48*s)}" rx="${f1(8*s)}" fill="${o.bagc||'#0B1430'}"/>`;
  h+=`<path d="M${P(-34,0)} L${P(-31,-78)} Q${P(-29,-101)} ${P(-10,-104)} L${P(10,-104)} Q${P(29,-101)} ${P(31,-78)} L${P(34,0)} Z" fill="${fill}"/>`;
  h+=`<rect x="${f1(x-6*s)}" y="${f1(y-114*s)}" width="${f1(12*s)}" height="${f1(14*s)}" fill="${fill}"/>`;
  h+=`<circle cx="${f1(x)}" cy="${f1(y-128*s)}" r="${f1(19*s)}" fill="${fill}"/>`;
  if(o.rim) h+=`<path d="M${P(-31,-78)} Q${P(-29,-101)} ${P(-10,-104)}" stroke="${o.rim}" stroke-width="${f1(3*s)}" fill="none" opacity=".7"/><path d="M${P(-17,-134)} A ${f1(19*s)} ${f1(19*s)} 0 0 1 ${P(-6,-146)}" stroke="${o.rim}" stroke-width="${f1(3*s)}" fill="none" opacity=".7"/>`;
  if(o.phone) h+=`<rect x="${f1(x+8*s)}" y="${f1(y-82*s)}" width="${f1(10*s)}" height="${f1(16*s)}" rx="${f1(2*s)}" fill="#BFE3FF"/><circle cx="${f1(x+13*s)}" cy="${f1(y-74*s)}" r="${f1(22*s)}" fill="#8FC9FF" opacity=".18"/>`;
  return h+'</g>';
}

/* page backdrop silhouettes per time of day */
function buildBackdrop(){
  const r=mulberry(9); let lock='', ramps='', city='', school='';
  for(let x=0;x<1600;x+=76){ lock+=`<rect x="${x+2}" y="96" width="72" height="264" rx="4" fill="${(x/76)%2?'#0F1E45':'#11224D'}"/>`; for(let v=0;v<3;v++) lock+=`<rect x="${x+20}" y="${112+v*9}" width="36" height="3" rx="1.5" fill="#06102A"/>`; lock+=`<rect x="${x+58}" y="200" width="6" height="22" rx="3" fill="#2D4E86"/>`; }
  ramps=`<path d="M0 360 L0 250 Q160 250 260 150 L300 150 L300 360Z M1600 360 L1600 230 Q1420 230 1320 130 L1280 130 L1280 360Z" fill="#1C1238"/><rect x="0" y="300" width="1600" height="60" fill="#160F30"/>`;
  for(let x=300;x<1280;x+=22) ramps+=`<line x1="${x}" y1="210" x2="${x}" y2="300" stroke="#2A1D4E" stroke-width="2"/>`; ramps+=`<line x1="300" y1="210" x2="1280" y2="210" stroke="#2A1D4E" stroke-width="4"/>`;
  for(let x=-20;x<1640;){ const w=40+r()*110, h=80+r()*240, top=360-h; city+=`<rect x="${f1(x)}" y="${f1(top)}" width="${f1(w)}" height="${f1(h)}" fill="#070C26"/>`; for(let wy=top+12; wy<352; wy+=20) for(let wx=x+8; wx<x+w-10; wx+=16) if(r()>.62) city+=`<rect x="${f1(wx)}" y="${f1(wy)}" width="7" height="10" fill="#FFC861" opacity="${f1(.25+r()*.6)}"/>`; x+=w+3+r()*8; }
  school=`<polygon points="420,360 420,170 800,110 1180,170 1180,360" fill="#2A1530"/><rect x="760" y="70" width="80" height="60" fill="#2A1530"/>`;
  for(let x=-40;x<1680;x+=80){ if(x>380&&x<1220) continue; const h=90+r()*90; school+=`<circle cx="${x}" cy="${330-h*.5}" r="${f1(h*.6)}" fill="#24122A"/>`; }
  school+=`<rect x="0" y="330" width="1600" height="30" fill="#24122A"/>`;
  if(CFG.TITLE_BG){ const T=$('#sky .l.title'); if(T) T.innerHTML=`<div class="tbg" style="background-image:url('${esc(CFG.TITLE_BG)}')"></div>`; }
  const BG=CFG.BACKGROUNDS||{}; let any=false; ['morning','day','afternoon','night','golden'].forEach(ph=>{ const L=$('#sky .l.'+ph); if(L&&BG[ph]){ any=true; L.innerHTML=`<div class="pbg" style="background-image:url('${esc(BG[ph])}')"></div>`; } }); if(any) document.body.classList.add('photobg');
  $('#bgArt').innerHTML=`<g class="g-lockers" opacity="0">${lock}</g><g class="g-ramps">${ramps}</g><g class="g-city">${city}</g><g class="g-school">${school}</g>`;
}

/* pseudo-random lit windows inside a box (x1..x2, y1..y2 in %) */
function tws(x1,x2,y1,y2,n){ const r=mulberry(x1*7+y1); return Array.from({length:n},()=>[+(x1+r()*(x2-x1)).toFixed(1), +(y1+r()*(y2-y1)).toFixed(1)]); }
function fxHTML(F){ let h=''; const r=mulberry(F.dust||3);
  if(F.warm) h+=`<i class="warm" style="--sx:${F.sx||'50%'}"></i>`;
  (F.lamps||[]).forEach(([x,y,w,c],i)=>h+=`<i class="glow${c?' '+c:''}" style="left:${x}%;top:${y}%;--w:${w||'14cqw'};--d:${(i*.9).toFixed(1)}s"></i>`);
  if(F.sun) h+=`<i class="glow sun" style="left:${F.sun[0]}%;top:${F.sun[1]}%"></i>`;
  (F.twinkle||[]).forEach(([x,y],i)=>h+=`<i class="tw" style="left:${x}%;top:${y}%;--d:${(i*.37%2.6).toFixed(2)}s;--t:${(2.2+(i*7%9)/10).toFixed(1)}s"></i>`);
  { const r2=mulberry(41); for(let i=0;i<(F.leaves||0);i++) h+=`<i class="leaf" style="left:${(4+r2()*92).toFixed(1)}%;--d:${(r2()*12).toFixed(1)}s;--t:${(9+r2()*6).toFixed(1)}s;--dx:${(-8+r2()*16).toFixed(1)}cqw;--s:${(.7+r2()*.6).toFixed(2)};--h:${Math.round(r2()*40)}deg"></i>`; }
  for(let i=0;i<(F.dust||0);i++) h+=`<i class="dust" style="left:${(8+r()*84).toFixed(1)}%;--d:${(r()*9).toFixed(1)}s;--t:${(8+r()*6).toFixed(1)}s;--dx:${(-4+r()*8).toFixed(1)}cqw"></i>`;
  return h?`<div class="fx" aria-hidden="true">${h}</div>`:''; }
function scene(kind, o={}){
  const imgTag=(src,cls='art',pos)=>`<img class="${cls}" src="${esc(src)}" alt="" ${pos?`style="object-position:${pos}"`:''} onerror="this.remove()">`;
  const F=PHOTO_FX[o.id]||{};
  if(o.id && SCENE_PH[o.id]){ const P=typeof SCENE_PH[o.id]==='string'?{src:SCENE_PH[o.id]}:SCENE_PH[o.id];
    const cv=P.cover&&o.cap?`<span class="covercap" style="left:${P.cover[0]}%;top:${P.cover[1]}%;min-width:${P.cover[2]}%;height:${P.cover[3]}%">${esc(o.cap)}</span>`:'';
    return `<div class="scene photo${o.sq?' sq':''}${typeof CTX!=='undefined'&&CTX&&!CTX.entering?' noin':''}" style="${o.sh?'--sh:'+o.sh+';':''}${F.kbo?'--kbo:'+F.kbo+';':''}${o.style||''}">${(ART[kind]||ART.skatepark)(o)}${imgTag(P.src)}${fxHTML(F)}${cv}${P.cap&&o.cap&&!P.cover?`<span class="cap">${esc(o.cap)}</span>`:''}${o.extra||''}</div>`; }
  const bg=(ART[kind]||ART.skatepark)(o)+(SCENE_IMG[kind]?imgTag(SCENE_IMG[kind],'art',o.pos||'50% 70%'):'');
  const gy=o.gy ?? ({golden:'14%', courtyard:'12%', club:'18%'}[kind] || '7%');
  const size=o.size||13;
  const ppl=(o.who||[]).map(([k,x,opt])=>{ opt=opt||{}; const sz=(opt.sz||1)*size;
    return `<div class="who k-${k}${opt.dim?' dim':''}${opt.lift?' lift':''}" style="--x:${x}%;--gy:${opt.gy||gy}">${av(k,'calc('+sz+'cqw)')}${o.names===false?'':`<b>${esc(CH[k].name)}</b>`}</div>`; }).join('');
  const bub = o.bubble ? (()=>{ const w=(o.who||[]).find(x=>x[0]===o.bubble[0]); if(!w) return ''; const sz=((w[2]||{}).sz||1)*size; return `<div class="bubble${o.think?' think':''}" style="left:${w[1]}%;bottom:calc(${(w[2]||{}).gy||gy} + ${f1(sz+4.2)}cqw)">${esc(o.bubble[1])}</div>`; })() : '';
  return `<div class="scene${o.sq?' sq':''}" style="${o.sh?'--sh:'+o.sh+';':''}${o.style||''}">${bg}${o.grade?`<div class="grade" style="background:${o.grade}"></div>`:''}${fxHTML(F)}${ppl}${bub}${o.cap?`<span class="cap">${esc(o.cap)}</span>`:''}${o.extra||''}</div>`;
}

/* ---------- 5 · smart turns ----------
   Mandatory individual tasks = N × R  (N = present students, R = rounds; R = 1 by default in this lesson).
   In a block that has started, the target becomes: completed mandatory turns (never erased)
   + the turns each PRESENT student still needs to reach R. The teacher sees every adjustment.
   A block that has FINISHED is closed: later attendance changes don’t reopen it
   (the teacher can reopen it on purpose, or give an optional extra turn).
   Tasks are taken from the bank in lesson order (the brief’s order), extra students get the extra bank items. */
const BLOCKS = {
  listen:{R:()=>S.R.listen, bank:LISTEN, kind:'Listening',  title:'LISTENING QUESTIONS',     instr:'Answer from memory. Then check.', sec:30},
  gram:  {R:()=>S.R.gram,   bank:GRAM,   kind:'Grammar',    title:'PUT THE SPOTLIGHT ON THE TRUTH', instr:'Say the same idea — but make the most important part stand out!', sec:40},
  speak: {R:()=>S.R.speak,  bank:SPEAK,  kind:'Speaking',   title:'WHAT HAPPENS NEXT?',      instr:'You know both sides. Now it’s your turn to speak!', sec:45}
};
const isOff = b => false;
const BORDER = Object.keys(BLOCKS);

const Rof = b => BLOCKS[b].R();
const tbs = b => (S.tb[b] = S.tb[b] || {log:[], cur:null, rv:{}, closed:false});
const taskOf = (b,tid)=> BLOCKS[b].bank.find(t=>t.id===tid) || BLOCKS[b].bank[0];
const mand = b => tbs(b).log.filter(x=>!x.opt && x.res!=='skip');
const turnsIn = (b,sid)=> mand(b).filter(x=>x.sid===sid).length;
const lessonTurns = sid => BORDER.reduce((n,b)=>n+(S.tb[b]?mand(b).filter(x=>x.sid===sid).length:0),0);
function target(b){
  const R=Rof(b), P=here(), done=mand(b).length, T=tbs(b);
  const remaining=T.closed?0:P.reduce((n,s)=>n+Math.max(0,R-turnsIn(b,s.id)),0);
  const total=done+remaining, base=P.length*R;
  const away=mand(b).filter(x=>!P.some(s=>s.id===x.sid)).length;
  const over=P.reduce((n,s)=>n+Math.max(0,turnsIn(b,s.id)-R),0);
  const waiting=T.closed?P.filter(s=>turnsIn(b,s.id)<R).length:0;
  return {R, N:P.length, done, remaining, total, base, away, over, waiting, complete:remaining===0};
}
function pickStudent(b, exclude=[]){
  const R=Rof(b), P=here(), off=BORDER.indexOf(b);
  /* avoid giving two turns in a row to the same student (also across blocks) */
  const all=BORDER.flatMap(x=>S.tb[x]?S.tb[x].log:[]).sort((a,c)=>a.at-c.at), lastSid=all.length?all[all.length-1].sid:null;
  const c=P.map((s,i)=>({s, i:(i-off+P.length*4)%Math.max(1,P.length)})).filter(o=>turnsIn(b,o.s.id)<R && !exclude.includes(o.s.id));
  if(!c.length) return null;
  c.sort((x,y)=> turnsIn(b,x.s.id)-turnsIn(b,y.s.id) || (x.s.id===lastSid)-(y.s.id===lastSid) || lessonTurns(x.s.id)-lessonTurns(y.s.id) || x.i-y.i);
  return c[0].s.id;
}
function pickTask(b, sid, avoid){
  const B=BLOCKS[b], T=tbs(b), used=new Set(T.log.filter(x=>x.res!=='skip').map(x=>x.tid)); if(T.cur) used.add(T.cur.tid); if(avoid) used.add(avoid);
  const pend=B.bank.filter(t=>!used.has(t.id));
  if(pend.length) return pend[0].id;
  const mine=new Set(T.log.filter(x=>x.sid===sid).map(x=>x.tid)), cnt=t=>T.log.filter(x=>x.tid===t.id).length;
  const pool=B.bank.filter(t=>t.id!==avoid && !mine.has(t.id)); return (pool.length?pool:B.bank).slice().sort((a,c)=>cnt(a)-cnt(c))[0].id;
}
function assign(b){
  const T=tbs(b), tg=target(b); T.rv={};
  if(tg.complete){ T.cur=null; return; }
  const sid=pickStudent(b); if(!sid){ T.cur=null; return; }
  T.cur={sid, tid:pickTask(b,sid), opt:false, at:Date.now()};
  if(BLOCKS[b].sec && ROLE==='teacher') TMR.set(BLOCKS[b].sec, true);
}
function ensureCur(b){
  const T=tbs(b), tg=target(b);
  if(T.cur && T.cur.opt) return;
  if(T.cur){
    if(tg.complete){ T.cur=null; return; }
    const s=stu(T.cur.sid);
    if(!s || !s.here || s.gone || turnsIn(b,T.cur.sid)>=Rof(b)){ const n=pickStudent(b); if(n) T.cur.sid=n; else T.cur=null; }
    return;
  }
  if(!tg.complete) assign(b);
}
function markDone(b, res){
  const T=tbs(b); if(!T.cur) return;
  T.log.push({tid:T.cur.tid, sid:T.cur.sid, res, opt:!!T.cur.opt, at:Date.now(), pick:T.rv.pick??null});
  const wasOpt=T.cur.opt; T.cur=null; T.rv={};
  if(target(b).complete){ if(!wasOpt){ T.closed=true; toast('✅ All turns done — '+target(b).total+' / '+target(b).total); SND.play('done'); } }
  else assign(b);
  save(); draw();
}
function reopen(b){ const T=tbs(b); T.closed=false; ensureCur(b); save(); draw(); toast('Block reopened for the students who haven’t had a turn'); }
function swapTask(b){ const T=tbs(b); if(!T.cur) return; T.cur.tid=pickTask(b,T.cur.sid,T.cur.tid); T.rv={}; save(); draw(); }
function setTurnStudent(b,sid){ const T=tbs(b); if(!T.cur) return; T.cur.sid=sid; save(); draw(); }
function nextStudentAuto(b){ const T=tbs(b); if(!T.cur) return; const n=pickStudent(b,[T.cur.sid]); if(n){ T.cur.sid=n; save(); draw(); } else toast('Everyone else has finished their turns in this block'); }
/* Skip = the student isn’t ready: they keep their turn for later, the next student answers now (same task) */
function skipTurn(b){ const T=tbs(b); if(!T.cur) return; const was=T.cur.sid; const n=pickStudent(b,[was]);
  if(!n) return toast('Nobody else is waiting — give a hint or use “With help”');
  T.cur.sid=n; T.rv={}; save(); draw(); toast(sname(was)+' skipped for now — they keep their turn'); }
function extraTurn(b){
  const T=tbs(b), P=here(); if(!P.length) return toast('Add students in 👥 Class first');
  const sid=P.slice().sort((x,y)=>lessonTurns(x.id)-lessonTurns(y.id))[0].id;
  T.cur={sid, tid:pickTask(b,sid), opt:true, at:Date.now()}; T.rv={}; save(); draw(); }
function cancelExtra(b){ const T=tbs(b); if(T.cur&&T.cur.opt){ T.cur=null; T.rv={}; ensureCur(b); save(); draw(); } }
function undoTurn(b){ const T=tbs(b); const last=T.log.pop(); if(!last) return; T.closed=false; T.cur={sid:last.sid, tid:last.tid, opt:last.opt, at:Date.now()}; T.rv={}; if(last.pick!=null) T.rv.pick=last.pick; save(); draw(); toast('Last action undone — it is the current turn again'); }
function nextUp(b){ const T=tbs(b); return pickStudent(b, T.cur?[T.cur.sid]:[]); }

/* story reading turns (dialogue lines — shared, separate from the task quota) */
const readsOf = sid => Object.values(S.reads).filter(v=>v===sid).length;
function readerFor(key){
  if(ROLE!=='teacher') return S.reads[key] || null;
  const cur=S.reads[key], P=here(); if(!P.length) return null;
  if(cur && P.some(s=>s.id===cur)) return cur;
  const keys=Object.keys(S.reads), prev=keys.length?S.reads[keys[keys.length-1]]:null;
  const n=keys.length, c=P.map((s,i)=>({s, i:(i-n%P.length+P.length)%P.length}));
  c.sort((x,y)=>readsOf(x.s.id)-readsOf(y.s.id) || (x.s.id===prev)-(y.s.id===prev) || x.i-y.i);
  S.reads[key]=c[0].s.id; return c[0].s.id;
}
function cycleReader(key){ const P=here(); if(!P.length) return; const i=P.findIndex(s=>s.id===S.reads[key]); S.reads[key]=P[(i+1)%P.length].id; save(); draw(); }

/* ---------- timers ---------- */
const TMR = {
  left(){ const t=S.tmr; return t.run ? Math.max(0,(t.end-Date.now())/1000) : t.left; },
  run(){ return !!S.tmr.run; },
  set(sec, quiet){ S.tmr={dur:sec, left:sec, run:false, end:0}; if(!quiet){ save(); this.paint(); pubState(); } },
  start(){ const t=S.tmr; if(t.left<=0) t.left=t.dur; t.end=Date.now()+t.left*1000; t.run=true; save(); this.paint(); pubState(); },
  pause(){ const t=S.tmr; t.left=this.left(); t.run=false; save(); this.paint(); pubState(); },
  toggle(){ this.run()?this.pause():this.start(); },
  reset(){ this.set(S.tmr.dur||60); },
  add(sec){ const t=S.tmr; if(t.run) t.end+=sec*1000; else t.left+=sec; t.dur=Math.max(t.dur,t.left); save(); this.paint(); pubState(); },
  tick(){ const t=S.tmr; if(ROLE==='teacher' && t.run && Date.now()>=t.end){ t.run=false; t.left=0; save(); SND.play('buzz'); toast('⏰ Time is up — move on when you’re ready.'); pubState(); }
    this.paint(); CLOCK.paint(); },
  paint(){ const l=this.left(); $$('[data-clock]').forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=10&&l>0&&S.tmr.dur<=60 || l<=30&&l>0&&S.tmr.dur>60); e.classList.toggle('out',l<=0); });
    $$('[data-tplay]').forEach(b=>b.textContent=this.run()?'❚❚ Pause':(this.left()<S.tmr.dur&&this.left()>0?'▶ Resume':'▶ Start')); }
};
const CLOCK = {
  el(){ const c=S.clock; return c.acc + (c.run ? (Date.now()-c.start)/1000 : 0); },
  toggle(){ const c=S.clock; if(c.run){ c.acc=this.el(); c.run=false; } else { c.start=Date.now(); c.run=true; } save(); this.paint(); },
  begin(){ if(!S.clock.run && S.clock.acc===0){ S.clock.start=Date.now(); S.clock.run=true; } },
  reset(){ S.clock={run:false, acc:0, start:0}; save(); this.paint(); },
  paint(){ const b=$('#clock'); if(!b) return; const e=this.el(), left=CORE_MIN*60-e;
    b.innerHTML=`<span>${S.clock.run?'⏱':'⏸'}</span><span class="v">${left>=0?mmss(left):'+'+mmss(-left)}</span><span class="of">left of ${CORE_MIN}:00</span>`;
    b.classList.toggle('over',left<0); $$('[data-lclock]').forEach(x=>x.textContent=mmss(e)); }
};

/* ---------- sound (Web Audio, quiet; off by default) ---------- */
const SND = {
  ctx:null,
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur=.15, type='sine', vol=.1, delay=0, f2){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); },
  play(k){ if(!S.sound || ROLE!=='teacher') return; const V=Math.max(0,Math.min(1,S.vol??.6))*1.4; if(!V) return; const t=(f,d,ty,v,dl,f2)=>this.tone(f,d,ty,v*V,dl,f2); try{
    if(k==='msg'){ t(880,.08,'sine',.06); t(1320,.12,'sine',.05,.07); }
    else if(k==='ping'){ t(988,.12,'sine',.07); t(1319,.18,'sine',.06,.12); }
    else if(k==='open'){ t(660,.1,'triangle',.06); t(990,.16,'triangle',.05,.08); }
    else if(k==='call'){ [0,.25,.6,.85].forEach(d=>t(1180,.16,'sine',.05,d)); }
    else if(k==='intro'){ [392,494,587,784].forEach((f,i)=>t(f,.32,'triangle',.06,i*.13)); t(784,.9,'sine',.04,.55); }
    else if(k==='spot'){ t(320,.5,'sine',.05,0,960); t(1280,.35,'triangle',.04,.35); }
    else if(k==='ok'){ t(784,.12,'triangle',.06); t(1046,.18,'triangle',.05,.09); }
    else if(k==='reveal'){ [523,659,784].forEach((f,i)=>t(f,.3,'triangle',.05,i*.04)); }
    else if(k==='done'){ [523,659,784,1046].forEach((f,i)=>t(f,.3,'triangle',.06,i*.08)); }
    else if(k==='end'){ [784,659,523,659,784].forEach((f,i)=>t(f,.35,'triangle',.05,i*.16)); t(392,1.2,'sine',.04,.8); }
    else if(k==='buzz'){ t(330,.4,'sawtooth',.04,0,220); }
  }catch(e){} }
};


/* ---------- 6 · ui helpers ---------- */
const SIL = c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#1A2550"/><circle cx="50" cy="40" r="19" fill="${c}" opacity=".85"/><path d="M14 104 Q16 66 50 64 Q84 66 86 104Z" fill="${c}" opacity=".85"/><text x="50" y="47" font-family="Bricolage Grotesque,sans-serif" font-size="22" font-weight="800" fill="#1A2550" text-anchor="middle">?</text></svg>`;
function av(k, s=56){
  if(k==='both') return `<span class="av2">${av('maya',s)}${av('leo',s)}</span>`;
  const c=CH[k]||{name:'?'}; const src = c.img ? c.img() : '';
  const col = getComputedStyle(document.documentElement).getPropertyValue('--c-'+(k==='miaOops'?'mia':k)).trim() || '#FFC861';

/* ---------- 7 · listening player — Sofia · Leo · Maya ----------
   1) the audio file from LESSON_CONFIG.LISTENING_AUDIO (labelled “AI voice” when LISTENING_IS_AI);
   2) no file, or it can’t play → the browser reads the same script, a different voice per character (labelled “browser voice”);
   3) no speech in this browser → the teacher reads the transcript (🧑‍🏫 Notes).
   Only the teacher’s page plays sound (Share sound in Zoom); the audience window mirrors the player. */
const VMS = {};
const VOICES = { both: DIALOGUE };
function ttsVoices(){
  const all=('speechSynthesis' in window)?speechSynthesis.getVoices():[], en=all.filter(x=>/^en/i.test(x.lang));
  const fem=['Aria','Jenny','Samantha','Google UK English Female','Zira','Karen','Moira','Serena','Tessa','Victoria','Libby','Sonia'], mal=['Guy','Ryan','Daniel','Google UK English Male','David','Alex','Fred','Mark','Aaron','Thomas'];
  const find=list=>list.map(n=>en.find(x=>x.name.includes(n))).filter(Boolean);
  const F=find(fem), M=find(mal), any=en[0]||null;
  return { sofia:F[0]||any, maya:F[1]||F[0]||any, leo:M[0]||any };
}
function track(k){
  const V=VOICES[k];
  return VMS[k] = VMS[k] || {
    k, el:null, mode:null, playing:false, t:0, dur:V.dur, raf:0, failed:false, ttsStart:0,
    src(){ return (CFG.LISTENING_AUDIO||'').trim(); },
    init(){ if(this.el||this.failed) return; const src=this.src(); if(!src){ this.failed=true; return; }
      const a=this.el=new Audio(); a.preload='auto'; a.src=src; a.volume=S.lvol??1;
      a.addEventListener('loadedmetadata',()=>{ if(isFinite(a.duration)) this.dur=a.duration; paintVM(); });
      a.addEventListener('ended',()=>{ this.playing=false; this.t=this.dur; this.done(); });
      a.addEventListener('error',()=>{ this.failed=true; if(this.playing){ this.playing=false; this.play(); } paintVM(); }); },
    label(){ return (this.failed||!this.src()) ? (('speechSynthesis' in window)?'browser voice':'teacher reads') : (CFG.LISTENING_IS_AI?'AI voice':'audio file'); },
    rate(){ return S.vrate||1; },
    toggle(){ this.playing?this.pause():this.play(); },
    play(){
      if(ROLE!=='teacher') return; this.init();
      Object.values(VMS).forEach(o=>{ if(o!==this && o.playing) o.pause(); });
      if(!this.failed){
        if(this.t>=this.dur-.05){ this.t=0; }
        try{ this.el.currentTime=this.t; }catch(e){}
        this.el.playbackRate=this.rate(); this.el.volume=S.lvol??1; const p=this.el.play(); this.playing=true; this.mode='file';
        if(p&&p.catch) p.catch(()=>{ this.failed=true; this.playing=false; this.play(); });
        this.loop(); this.note(); paintVM(); return;
      }
      if(!('speechSynthesis' in window)){ toast('This browser can’t play the audio — please read the transcript aloud (🧑‍🏫 Notes).'); return; }
      this.mode='tts'; speechSynthesis.cancel(); this.playing=true; if(this.t>=this.dur-.05) this.t=0;
      this.speakFrom(Math.max(0,this.idx(true))); this.loop(); this.note(); paintVM();
    },
    speakFrom(i){
      const vs=ttsVoices();
      const say=n=>{ if(!this.playing||this.mode!=='tts') return; if(n>=V.lines.length){ this.playing=false; this.t=this.dur; this.done(); return; }
        const [who,txt]=V.lines[n], c=V.tts[who]||{pitch:1,rate:1};
        this.t=V.times[n]; this.ttsStart=performance.now()-V.times[n]*1000/this.rate();
        const u=new SpeechSynthesisUtterance(txt); if(vs[who]) u.voice=vs[who]; u.lang='en-US'; u.rate=.95*this.rate()*(c.rate||1); u.pitch=c.pitch||1; u.volume=S.lvol??1;
        u.onend=()=>say(n+1); u.onerror=()=>say(n+1); speechSynthesis.speak(u); };
      say(i);
    },
    pause(){ if(this.mode==='file'&&this.el){ this.el.pause(); this.t=this.el.currentTime; } else if('speechSynthesis' in window) speechSynthesis.cancel(); this.playing=false; cancelAnimationFrame(this.raf); paintVM(); this.note(); },
    stop(){ if(this.playing) this.pause(); this.t=0; try{ if(this.el) this.el.currentTime=0; }catch(e){} paintVM(); this.note(); },
    replay(){ this.stop(); this.play(); },
    seek(sec){ if(ROLE!=='teacher') return; sec=Math.max(0,Math.min(this.dur-.1,sec)); this.t=sec;
      if(this.mode==='file'&&this.el){ try{ this.el.currentTime=sec; }catch(e){} }
      else if(this.playing&&this.mode==='tts'){ speechSynthesis.cancel(); const n=Math.max(0,this.idx(true)); this.t=V.times[n]; this.speakFrom(n); }
      paintVM(); this.note(); },
    playLine(n){ this.seek(V.times[n]||0); if(!this.playing) this.play(); },
    done(){ cancelAnimationFrame(this.raf); const d=sd('listening'); d.heard=(d.heard||0)+1; save(); paintVM(); this.note(); draw(); },
    loop(){ cancelAnimationFrame(this.raf); const f=()=>{ if(!this.playing) return; this.t=this.mode==='file'?this.el.currentTime:Math.min(this.dur,(performance.now()-this.ttsStart)/1000*this.rate()); paintVM(); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f); },
    idx(any){ let n=-1; V.times.forEach((s,i)=>{ if(this.t>=s-.05) n=i; }); return any||this.playing||this.t>0&&this.t<this.dur?n:-1; },
    note(){ S.vm={k, p:this.playing, t:Math.round(this.t*10)/10, at:Date.now(), r:this.rate()}; pushScreen(); }
  };
}

/* ── breakout helpers ── */
function teamSizes(n){ if(n<=3) return [n]; if(n===4) return [2,2]; if(n===5) return [2,3]; if(n===6) return [3,3]; if(n===7) return [3,4]; if(n===8) return [4,4]; const k=Math.ceil(n/4); const base=Math.floor(n/k), extra=n%k; return Array.from({length:k},(_,i)=>base+(i<extra?1:0)); }
function rolesFor(m){ const r={}, n=m.length;
  const plan = n===1?['solo'] : n===2?['p1','p2'] : n===3?['pnow','later','next'] : n===4?['intro','now','later','next'] : ['intro','now','later','next','final'];
  m.forEach((sid,j)=>r[sid]=plan[j]||'final'); return r; }
function buildGroups(mode){
  const P=here(), g=[];
  if(mode==='solo') P.forEach(s=>g.push({members:[s.id]}));
  else if(mode==='pairs'){ for(let i=0;i<P.length;i+=2) g.push({members:P.slice(i,i+2).map(s=>s.id)}); if(g.length>1 && g[g.length-1].members.length===1){ const last=g.pop(); g[g.length-1].members.push(last.members[0]); } }
  else { let i=0; teamSizes(P.length).forEach(n=>{ g.push({members:P.slice(i,i+n).map(s=>s.id)}); i+=n; }); }
  g.forEach((x,i)=>{ x.id='g'+(i+1); x.name=GROUP_NAMES[i%GROUP_NAMES.length]; x.roles=rolesFor(x.members); });
  S.bo.mode=mode; S.bo.groups=g; S.bo.cur=0; save();
}
function ensureGroups(){ const P=here().map(s=>s.id).sort().join(), G=S.bo.groups.flatMap(g=>g.members).sort().join();
  if(S.bo.groups.length && P===G) return;
  const mode = here().length===1 ? 'solo' : (S.bo.modeSet ? S.bo.mode : 'teams'); buildGroups(mode); }
function moveMember(sid){ const G=S.bo.groups; if(G.length<2) return; const i=G.findIndex(g=>g.members.includes(sid)); if(i<0) return;
  G[i].members=G[i].members.filter(x=>x!==sid); const j=(i+1)%G.length; G[j].members.push(sid);
  S.bo.groups=G.filter(g=>g.members.length); S.bo.groups.forEach(g=>g.roles=rolesFor(g.members)); save(); }
function swapRoles(gid){ const g=S.bo.groups.find(x=>x.id===gid); if(!g||g.members.length<2) return; g.members.push(g.members.shift()); g.roles=rolesFor(g.members); save(); }
function groupsHTML(editable){ if(!S.bo.groups.length) return '';
  return `<div class="groups">${S.bo.groups.map(g=>`<div class="grp"><h4>${esc(g.name)} <span class="small">· ${g.members.length}</span>${editable&&g.members.length>1?` <button class="btn xs ghost tonly" data-sw="${g.id}" title="Swap the speaking parts inside this team">🔁 parts</button>`:''}</h4>${g.members.map(sid=>{ const r=ROLES[g.roles[sid]]||ROLES.final;
    return `<div class="m">${iniBubble(sname(sid))}<span>${esc(sname(sid))}</span><span class="rl">${r.e} ${esc(r.t)}</span>${editable&&S.bo.groups.length>1?`<button class="btn xs ghost tonly" data-mv="${sid}" title="Move to the next team">⇄</button>`:''}</div>`; }).join('')}</div>`).join('')}</div>`; }

function planCard(g){ const c=S.bo.cards[g.id]||{};

{ id:'rooms', sc:5, title:'Breakout rooms', sky:'afternoon',

    return scn(this)+`<div class="split wl" style="align-items:start"><div>
      <div class="row tonly"><div class="modes" role="group" aria-label="Breakout mode">${[['solo','Solo'],['pairs','Pairs'],['teams','Teams']].map(([k,t])=>`<button data-mode="${k}" class="${S.bo.mode===k?'on':''}">${t}</button>`).join('')}</div><button class="btn xs ghost" id="bShuffle">🔀 Shuffle</button><button class="btn xs ghost" id="bCopy2">📋 Copy for Zoom</button></div>
      <h2 class="h-m mt">${S.bo.mode==='solo'?'Solo · everyone makes a 3-step plan':S.bo.mode==='pairs'?'Pairs · two speakers, one plan':N<=3?'One team · one plan':'Teams · everyone has a speaking part'}</h2>

      <div class="row mt" style="justify-content:center"><button class="btn primary" data-tplay>${TMR.run()?'❚❚ Pause':'▶ Start'}</button><button class="btn sm ghost" id="tReset">⟲ Reset</button><button class="btn sm ghost" id="t30">+30 s</button></div>

  after(v){ $$('[data-mode]',v).forEach(b=>b.onclick=()=>{ S.bo.modeSet=true; buildGroups(b.dataset.mode); draw(); });

    const cp=$('#bCopy2',v); if(cp) cp.onclick=()=>copyText(missionText(),'Copied — paste it into the Zoom chat');
    $$('[data-tplay]',v).forEach(b=>b.onclick=()=>TMR.toggle()); $('#tReset',v).onclick=()=>TMR.set(240); $('#t30',v).onclick=()=>TMR.add(30);

  n:{t:'4 хв', obj:'Breakout: кожна команда готує план із 3 кроків усно. Частини розподілені автоматично — говорить кожен.', do:['Send students to Zoom breakout rooms. They should discuss orally and prepare a short shared plan.','Solo / Pairs / Teams. 5 учнів → Team A (2) + Team B (3). Кімнати в Zoom відкриваєте самі; 📋 — текст для чату.','Таймер 4:00: Start / Pause / Reset / +30 s. Урок сам не перемикається.'],
    ua:'Частини: 2 учні — «проблема + крок 1» і «кроки 2 + 3»; 3 учні — «проблема + крок 1», «крок 2», «крок 3»; 4 — проблема, кроки 1, 2, 3; 5 — + підсумок одним cleft-реченням.'} },

    <div><p class="small" style="margin:0 0 6px">👂 Everyone else: listen and count!</p>
      <div class="exgrid">${EXPR_COUNT.map(([k,t])=>`<span class="clc"><button class="chip ${cl[k]?'on':''}" data-cl="${k}">${t} <b>${cl[k]||0}</b></button>${cl[k]?`<button class="btn xs ghost tonly" data-clm="${k}" aria-label="Minus one">−</button>`:''}</span>`).join('')}</div>
      <p class="small mt" style="margin:10px 0 6px">✅ Mission checklist</p>

      ${all?`<div class="center mt2"><button class="btn big gold" data-next>🗳 Final class decision ▶</button></div>`:''}</div></div>`; },
  after(v,d){ const G=S.bo.groups, i=Math.min(S.bo.cur||0,G.length-1), g=G[i]; if(!g) return; const P=S.bo.pres[g.id]=S.bo.pres[g.id]||{};
    $$('[data-g]',v).forEach(b=>b.onclick=()=>{ S.bo.cur=+b.dataset.g; TMR.set(45,true); save(); draw(); });
    $$('[data-gn]',v).forEach(b=>b.onclick=()=>{ P.done=true; S.bo.cur=+b.dataset.gn; TMR.set(45,true); save(); draw(); });

    $$('[data-clm]',v).forEach(b=>b.onclick=()=>{ const c=P.cl=P.cl||{}; c[b.dataset.clm]=Math.max(0,(c[b.dataset.clm]||0)-1); save(); draw(); });

    $$('[data-tplay]',v).forEach(b=>b.onclick=()=>TMR.toggle()); const r=$('#pReset',v); if(r) r.onclick=()=>TMR.set(45); },

  live(){ const G=S.bo.groups, g=G[Math.min(S.bo.cur||0,G.length-1)]; return g?{kind:'msg', e:'🎤', t:g.name+' is presenting! Everyone else: count the friendship expressions and cleft sentences.'}:null; },
  n:{t:'3 хв (≈45 с на команду)', obj:'Кожна команда презентує план 30–45 с. Позначайте, хто говорив (кожен має говорити). Клас рахує вирази й cleft-речення.', do:['Клік по імені — учень говорив ✓. Чекліст — для короткого фідбеку, не для оцінки.','Mark presentation complete → Next team. Таймер 0:45 на команду.'],

let CTX = {entering:true};
let LAST = {id:null, p:-1, gz:null}, GATE = null;
const cur = ()=> STEPS[S.i] || STEPS[0];
const parts = s => typeof s.parts==='function' ? s.parts() : (s.parts||1);
const visible = k => !!STEPS[k] && !(S.core && STEPS[k].opt) && !(STEPS[k].block && isOff(STEPS[k].block));

function draw(){
  if(ROLE==='student') return;
  const v=$('#view');
  if(S.gz){ const entering=LAST.gz!==S.gz||LAST.id!=='__gz'; document.body.dataset.sky='night'; v.innerHTML=gzRender(); if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
    gzAfter(v); LAST={id:'__gz', p:0, gz:S.gz}; paintChrome(); paintSheet(); paintGref(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); save(); return; }
  const s=cur(), d=sd(s.id);
  if((d.p||0)>parts(s)-1) d.p=parts(s)-1;
  const entering = LAST.id!==s.id;
  CTX={entering, partChanged: entering || LAST.p!==(d.p||0)};
  if(entering && ROLE==='teacher' && s.enter) s.enter(d);
  document.body.dataset.sc=s.sc; document.body.dataset.sky=s.sky||SCENES[s.sc-1].sky;
  const fid=document.activeElement && document.activeElement.id;
  v.innerHTML=s.render(d);
  if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  bindReaders(v);
  s.after && s.after(v,d);
  if(fid && !entering){ const f=document.getElementById(fid); if(f && v.contains(f)) f.focus({preventScroll:true}); }
  LAST={id:s.id, p:d.p||0, gz:null};
  paintChrome(); paintSheet(); paintGref(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); TMR.paint(); save();
}
function next(){
  if(S.gz){ closeGZ(); return; }
  const s=cur(), d=sd(s.id), P=parts(s), p=d.p||0;
  if(p<P-1){ d.p=p+1; s.onPart&&s.onPart(d); GATE=null; save(); draw(); return; }
  if(s.ready && !s.ready(d)){ const g=s.id+':'+p; if(GATE!==g){ GATE=g; toast(s.gateMsg||'Not finished yet — press Next again to continue'); return; } }
  GATE=null;
  s.leave && s.leave(d);
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else openGZ('home');
}
function back(){
  if(S.gz){ closeGZ(); return; }
  const d=sd(cur().id); GATE=null;
  if((d.p||0)>0){ d.p--; save(); draw(); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--; if(k>=0) go(k);
}
function go(k){ if(!STEPS[k]) return; S.gz=null; S.i=k; GATE=null; save(); draw(); }
function goScene(n){ const k=STEPS.findIndex((x,i)=>x.sc===n && visible(i) && x.id!=='setup' && x.id!=='title'); if(k>=0) go(k); }
function reveal(){ if(S.gz) return; const s=cur(), d=sd(s.id);
  if(s.reveal){ if(s.reveal(d)===false) return; } else if(parts(s)>1){ d.p=parts(s)-1; s.onPart&&s.onPart(d); } else return;
  SND.play('reveal'); save(); draw(); }
function hint(){ const s=cur(); if(S.gz||!s.hint) return; if(s.hint(sd(s.id))===false) return; save(); draw(); }

  let lo=11, hi=Math.min(44, Math.max(14, innerHeight/22)), best=0;

   Учитель — єдине джерело стану. Захист (як в уроках 13–23):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»: не перемикає сцени,
     не бачить відповідей до Reveal, не змінює присутність інших, не скидає урок;
   • учні надсилають тільки hello / ans / card / react; учитель перевіряє кожне (поточне завдання, межі, довжину,
     для картки команди — що учень справді в цій команді);
   • лише ім’я / нік, жодних інших даних. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();

const WALLQ = [], NAMES = {};

const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson29-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }

const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){

    const c=S.bo.cards[g.id]=S.bo.cards[g.id]||{}; c[f]=String(m.v||'').replace(/\s+/g,' ').slice(0,60); save(); pubState(); softRedraw(); return; }

    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for the teacher…<br><span class="small">Room ${esc(room)} — are the code and teacher key right? <a href="?join" style="color:var(--teal2)">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">🤝</div><h2 class="dsp mt" style="font-size:28px">SEE YOU NEXT TIME!</h2><p class="small">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  const paintCard=()=>{ if(!st||!st.task||st.task.kind!=='group') return; const g=(st.task.groups||[]).find(x=>x.m.some(p=>me(p.n))); if(!g) return;
    $$('[data-cf]',B).forEach(i=>{ if(document.activeElement!==i) i.value=(g.card||{})[i.dataset.cf]||''; }); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>nameKey(n)===nameKey(name);
  const head2=()=>`<div class="stu-prog">${SCENES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div>
      <div class="small" style="margin-bottom:6px;font-weight:800">Scene ${st.sc} · ${esc(st.title||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait">${av('leo',90)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head2();
    if(!T){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Read, listen and be ready to speak!</p></div>`; return; }
    if(T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T.e||'🤝')}</div><p><b>${esc(T.t)}</b></p></div>`; return; }
    if(T.kind==='turn'){
      const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block)} · turn ${Math.min(T.done+1,T.total)} of ${T.total} <span id="stuT"></span></p>
        <p style="font-size:22px;font-weight:800;margin:6px 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p>
        <p style="font-size:20px;font-weight:700">${emph(T.prompt)}</p>
        ${T.hint?`<p class="small">💡 ${esc(T.hint)}</p>`:''}
        ${T.opts?`<div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.pick===i?'pick':''}" data-tp="${i}" ${mine&&!T.ans?'':'disabled'}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`:''}
        ${T.ans?`<div class="stu-card" style="background:rgba(91,227,168,.12);border-color:rgba(91,227,168,.5)"><b>${esc(T.ans)}</b></div>`:`<p class="small">${mine?(T.opts?'Tap your choice — then explain it out loud in Zoom.':'Say your answer out loud in Zoom.'):'Listen — could you help if they get stuck?'}</p>`}</div>`;
      $$('[data-tp]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'ans', task:T.id, v:+b.dataset.tp}); b.classList.add('pick'); });
      paintT(); return; }
    const choiceCard=(id,q,opts,chosen)=>{ const my=sent[id], dec=chosen!=null;
      return `<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt ${dec&&chosen===i?'right':my===i?'pick':''}" data-q="${esc(id)}" data-i="${i}" ${dec?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${dec?`Answer: ${LET[chosen]}. Look at the main screen.`:my!==undefined?'✓ Vote sent! You can change it.':'Tap your choice.'}</p></div>`; };
    const bindChoice=()=>$$('[data-q]',B).forEach(b=>b.onclick=()=>{ sent[b.dataset.q]=+b.dataset.i; Net.send({t:'ans', task:b.dataset.q, v:+b.dataset.i}); render(); });
    if(T.kind==='choice'){ B.innerHTML=hd+choiceCard(T.id,T.q,T.opts,T.chosen)+(''); bindChoice(); return; }
    if(T.kind==='awards'){ B.innerHTML=hd+`<p class="small">Vote for IDEAS — one vote in each category.</p>`+T.cats.map(c=>choiceCard(c.id,c.q,c.opts,null)).join(''); bindChoice(); return; }
    if(T.kind==='group'){
      const g=(T.groups||[]).find(x=>x.m.some(p=>me(p.n)));
      if(g){ const r=g.m.find(p=>me(p.n)), c=g.card||{}; B.innerHTML=hd+`<div class="stu-card myturn"><p class="small">Your team <span id="stuT"></span></p><h2 class="dsp" style="font-size:28px">${esc(g.name)}</h2>
          <p style="font-size:20px;font-weight:800;margin-top:10px">You say: ${esc(r.r)}</p><p>${esc(r.d)}</p>
          <p class="small mt">Team: ${g.m.map(p=>esc(p.n)+' ('+esc(p.r)+')').join(', ')}</p></div>
          <div class="stu-card"><b>FRIENDSHIP REPAIR PLAN 💌</b>${T.steps.map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}
          <p class="small">Use at least TWO friendship expressions and ONE cleft sentence. Everyone speaks! Optional notes — your team sees them:</p>${CARD_F.map(([k,e,l])=>`<label for="cf${k}">${e} ${l}</label><input id="cf${k}" data-cf="${k}" maxlength="60" value="${esc(c[k]||'')}" placeholder="optional">`).join('')}</div>`;
        $$('[data-cf]',B).forEach(i=>{ let t=null; i.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>Net.send({t:'card', g:g.id, f:i.dataset.cf, v:i.value.slice(0,60)}),400); }; }); }
      else B.innerHTML=hd+`<div class="stu-card"><p><b>Teams</b> <span id="stuT"></span></p>${(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(p=>esc(p.n)).join(', ')}</p>`).join('')}<p class="small">Can’t find your name? Ask your teacher — use the same name as on their list.</p></div>`;
      paintT(); return; }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(S.gref) return toggleGref(false); if(S.sheet.open&&S.gz){ if(S.sheet.pres){ S.sheet.pres=false; } else S.sheet.open=false; save(); paintSheet(); pubState(); return; } if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  if(S.gz && S.sheet.open) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A' && tag!=='SUMMARY')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(!S.gz && s.block && tbs(s.block).cur && (!BLOCKS[s.block].scoped || taskOf(s.block,tbs(s.block).cur.tid).part===s.scope)) markDone(s.block,'ok'); }
  else if(k==='n') openNav(); else if(k==='c') openCrew(); else if(k==='w') toggleNotes(); else if(k==='f') present();
  else if(k==='g') S.gz?closeGZ():openGZ('home');
  else if(k==='q') toggleGref();
});
if(ROLE==='student'){ buildBackdrop(); studentApp(); }
else if(ROLE==='screen'){ buildBackdrop(); buildRail(); screenApp(); }
else {
  buildBackdrop(); applyAnim(); buildRail();
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bHint').onclick=hint;
  $('#bWs').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false); $('#bNav').onclick=openNav; $('#bCrew').onclick=openCrew;
  $$('#notes [data-nt]').forEach(b=>b.onclick=()=>{ S.nt=b.dataset.nt; save(); paintNotes(); });
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#bScreen').onclick=openScreen; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#bQuick').onclick=()=>setQuick(!S.core); $('#clock').onclick=()=>CLOCK.toggle();
  $('#bGram').onclick=()=>toggleGref(); $('#bSnd').onclick=()=>{ S.sound=!S.sound; save(); paintChrome(); if(S.sound) SND.play('ping'); toast(S.sound?'🔊 Sound effects on':'🔇 Sound effects off'); };
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello') pushScreen(); };
  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  if(S.ws && innerWidth>=1280){ $('#notes').classList.add('on'); document.body.classList.add('ws'); $('#notes').setAttribute('aria-hidden','false'); }
  draw();
  if(S.live) startLive(true);
}

</script>
