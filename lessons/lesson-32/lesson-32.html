.msg.host .bub{background:linear-gradient(135deg,rgba(246,188,73,.26),rgba(130,85,181,.25));border-color:var(--line2)}
.new{animation:up .45s ease both}
body.noanim .new{animation:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.more{font-size:.8rem;color:var(--tx2);text-align:center;padding:.3rem;border:1px dashed var(--line);border-radius:12px}
.hl{font-weight:800;color:#fff;background:linear-gradient(transparent 58%,rgba(130,85,181,.6) 58%);padding:0 .1em;border-bottom:2px solid var(--vio2);border-radius:2px}
.hl.b{background:linear-gradient(transparent 58%,rgba(246,188,73,.45) 58%);border-color:var(--gold)}
.nz{font-weight:800;color:var(--gold2);border-bottom:2px dotted var(--gold)}

/* turns */
.turn{display:inline-flex;align-items:center;gap:.45rem;border:1px solid rgba(246,188,73,.5);background:rgba(246,188,73,.13);border-radius:999px;padding:.25rem .75rem .25rem .3rem;font-weight:800;font-size:.85rem;color:#FFF2D6}
.turn .ini{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--gold);color:#2A1A05;font-size:.75rem}
.turn.done{border-color:rgba(62,224,165,.5);background:rgba(62,224,165,.12)}
.turn.done .ini{background:var(--ok)}
.turn.sm{font-size:.72rem;padding:.15rem .55rem .15rem .2rem}
.turn.sm .ini{width:1.25rem;height:1.25rem;font-size:.62rem}
button.turn:hover{filter:brightness(1.15)}
.tbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.dots{display:flex;gap:.3rem;align-items:center}
.dots i{width:.7rem;height:.7rem;border-radius:50%;background:rgba(255,255,255,.16);display:block}
.dots i.d{background:var(--ok)}
.dots i.c{background:var(--gold);box-shadow:0 0 0 3px rgba(246,188,73,.25)}
.dots i.o{background:transparent;border:2px dashed rgba(255,255,255,.3)}
.optl{font-size:.68rem;font-weight:800;letter-spacing:.08em;border:1px dashed var(--line2);border-radius:999px;padding:.1rem .5rem;color:var(--vio2)}

/* question / answer */
.qcard{padding:1.4rem 1.6rem}
.qtext{font-size:1.8rem;line-height:1.2;font-family:var(--fd);font-weight:700}
.ans{margin-top:1rem;border:1px solid rgba(62,224,165,.45);background:rgba(62,224,165,.1);border-radius:16px;padding:.8rem 1rem;font-size:1.1rem;font-weight:600}
.ans b{color:var(--ok)}
.hint{margin-top:.8rem;border:1px solid rgba(246,188,73,.42);background:rgba(246,188,73,.09);border-radius:14px;padding:.6rem .9rem;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.3rem .75rem;font-weight:700;font-size:.88rem}
button.chip:hover{border-color:var(--line2)}
.chip.hit{border-color:var(--ok);background:rgba(62,224,165,.18);color:#fff;box-shadow:0 0 0 3px rgba(62,224,165,.2)}
.chip.sel{border-color:var(--gold);background:rgba(246,188,73,.22)}
.chip.dim{opacity:.4}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.18rem .6rem;border:1px solid var(--line2);color:var(--gold)}
.badge.live{color:#FFD1D8;border-color:rgba(255,77,109,.6);background:rgba(255,77,109,.15)}
.badge.ok{color:#BFF7DE;border-color:rgba(62,224,165,.5);background:rgba(62,224,165,.12)}

/* social post (scene 01) */
.post{border-radius:26px;border:1px solid var(--line2);background:rgba(17,12,28,.86);backdrop-filter:blur(16px);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.post .ph{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.post .media{position:relative;aspect-ratio:16/8;background:#1d1430 center/cover;overflow:hidden}
.post .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .media .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3.6rem;height:3.6rem;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:grid;place-items:center;font-size:1.3rem}
.post .ttl{font-family:var(--fd);font-weight:800;font-size:1.3rem;padding:.7rem 1rem .2rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;padding:.5rem 1rem .8rem}
.stat{border-radius:16px;padding:.55rem .8rem;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.stat .v{font-family:var(--fd);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:.72rem;color:var(--tx2);font-weight:700;margin-top:.2rem;letter-spacing:.06em;text-transform:uppercase}
.feed{display:flex;flex-direction:column;gap:.45rem}
.cm{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:.5rem .8rem;background:rgba(255,255,255,.045)}
.cm .ua2{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;color:#1A1020}
.cm .u{font-size:.75rem;font-weight:800;color:var(--tx2)}
.cm .t{font-size:1.12rem;font-weight:600;line-height:1.3}

/* poster */
.poster{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--gold);background:radial-gradient(circle at 50% 0%,rgba(246,188,73,.35),transparent 55%),linear-gradient(170deg,#3A1F63,#20152E 55%,#110D1B);padding:1.6rem 1.6rem 1.4rem;text-align:center;box-shadow:0 0 0 6px rgba(246,188,73,.1),0 40px 80px -30px rgba(0,0,0,.8)}
.poster .bulbs{position:absolute;inset:.5rem;border-radius:16px;pointer-events:none;background:radial-gradient(circle,#FFE7A3 2px,transparent 3px) 0 0/22px 22px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:6px;opacity:.85}
.poster .pt{font-family:var(--fd);font-weight:800;font-size:2.4rem;line-height:.95;letter-spacing:.02em;background:linear-gradient(180deg,#FFF1C9,#F6BC49 60%,#C98A22);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 30px rgba(246,188,73,.25)}
.poster p{font-size:1.12rem;font-weight:600;margin-top:.55rem}
.poster .big{font-family:var(--fd);font-size:1.7rem;font-weight:800;color:#fff;margin-top:.7rem}
.poster .open{display:inline-block;margin-top:.9rem;background:#FF4D6D;color:#fff;font-weight:800;letter-spacing:.14em;border-radius:999px;padding:.35rem 1rem;font-size:.85rem}
.poster.reveal{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7) rotate(-3deg)}to{opacity:1;transform:none}}
body.noanim .poster.reveal{animation:none}

/* application form */
.form{display:grid;grid-template-columns:auto 1fr;gap:.55rem 1rem;align-items:center;font-size:1.1rem}
.form label{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2)}
.form .fv{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:.5rem .8rem;font-weight:700}
.sendfx{position:relative;height:5rem;overflow:hidden}
.sendfx .env{position:absolute;left:10%;top:1.2rem;font-size:2.6rem;animation:fly 1.4s ease-in forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}60%{transform:translate(55vw,-10px) rotate(8deg)}100%{transform:translate(80vw,-60px) rotate(20deg) scale(.4);opacity:0}}
.accepted{font-family:var(--fd);font-weight:800;font-size:2.4rem;line-height:1.05;color:var(--gold2);text-shadow:0 8px 30px rgba(246,188,73,.35)}

/* access pass */
.pass{width:min(26rem,90%);aspect-ratio:5/7.4;margin:0 auto;perspective:1200px}
.pass .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.2,.4,1)}
.pass.flip .in{transform:rotateY(180deg)}
.pass.anim .in{animation:pflip 1.4s .35s cubic-bezier(.3,1.2,.4,1) both}
@keyframes pflip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
body.noanim .pass.anim .in{animation:none;transform:rotateY(180deg)}
.pass .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;overflow:hidden;padding:1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;border:2px solid var(--gold);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 50px -10px rgba(246,188,73,.5)}
.pass .front{background:linear-gradient(160deg,#4A2A7A,#20152E 55%,#110D1B)}
.pass .back{transform:rotateY(180deg);background:linear-gradient(160deg,#F6BC49,#C98A22 40%,#5E3A8C)}
.pass .hole{width:3.2rem;height:.7rem;border-radius:999px;background:#0b0812;box-shadow:inset 0 2px 4px #000}
.pass .role{font-family:var(--fd);font-weight:800;font-size:2.6rem;letter-spacing:.04em;line-height:.95}
.pass .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);transform:translateX(-120%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
body.noanim .pass .shine{display:none}
.pass .strip{width:100%;height:2.2rem;background:repeating-linear-gradient(90deg,#0b0812 0 3px,transparent 3px 6px,#0b0812 6px 7px,transparent 7px 11px);opacity:.75;border-radius:6px}

/* contestant card */
.ccard{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:1.1rem;flex:1;min-height:0}
.cpic{position:relative;border-radius:26px;overflow:hidden;border:2px solid var(--line2);background:radial-gradient(circle at 50% 30%,rgba(246,188,73,.35),transparent 60%),linear-gradient(170deg,#3B2560,#130D1F);min-height:0;display:flex;align-items:center;justify-content:center}
.cpic.sm .ph{width:min(42%,9rem)}
.cpic.sm .no{font-size:2.2rem}
.cpic.sm .stg b{font-size:1rem}
.cpic .ph{width:min(70%,18rem);aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 10px rgba(246,188,73,.12),0 30px 60px -20px rgba(0,0,0,.8);position:relative;background:#2a1d3d}
.cpic .ph img{width:100%;height:100%;object-fit:cover}
.cpic .no{position:absolute;top:.8rem;left:.9rem;font-family:var(--fd);font-weight:800;font-size:3.4rem;line-height:1;color:transparent;-webkit-text-stroke:2px var(--gold);opacity:.9}
.cpic .stg{position:absolute;left:.8rem;right:.8rem;bottom:.8rem;text-align:center;background:rgba(17,13,27,.74);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:16px;padding:.5rem .7rem}
.cpic .stg b{font-family:var(--fd);font-size:1.25rem;color:var(--gold2)}
.cpic .spot{position:absolute;inset:-20% 20% auto 20%;height:80%;background:radial-gradient(ellipse at 50% 0,rgba(255,240,200,.45),transparent 70%);filter:blur(6px);pointer-events:none}
.ccard.enter .cpic{animation:cin .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes cin{from{opacity:0;transform:translateX(-30px) scale(.96)}to{opacity:1;transform:none}}
body.noanim .ccard.enter .cpic{animation:none}
.cnav{display:flex;gap:.35rem;align-items:center}
.cnav button,.cnav span{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:.18rem .55rem .18rem .2rem;font-weight:800;font-size:.75rem;color:var(--tx2)}
.cnav .cur{border-color:var(--gold);color:var(--tx);background:rgba(246,188,73,.16)}
.cnav .dn{color:var(--ok)}
.phase{display:flex;gap:.25rem}
.phase span{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.15rem .55rem;border:1px solid var(--line);color:var(--tx2)}
.phase span.on{border-color:var(--gold);color:#2A1A05;background:var(--gold)}
.vx{border:1px solid var(--line);border-radius:18px;padding:.7rem .9rem;background:rgba(255,255,255,.035)}
.vx .ex{font-family:var(--fd);font-size:1.35rem;font-weight:800}

/* performance visuals */
.perf{flex:1 1 auto;min-height:14rem;position:relative;border-radius:26px;overflow:hidden;border:2px solid var(--line2);background:radial-gradient(ellipse at 50% 0%,rgba(255,236,190,.35),transparent 60%),linear-gradient(180deg,#2A1B40,#110D1B);min-height:0;display:flex;align-items:center;justify-content:center}
.perf>img,.perf>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.perf .pcap{position:absolute;left:.8rem;right:.8rem;bottom:.8rem;background:rgba(17,13,27,.78);backdrop-filter:blur(8px);border-radius:16px;padding:.55rem .8rem;font-weight:700;font-size:1rem}
.perf .floor{position:absolute;left:-10%;right:-10%;bottom:-30%;height:55%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(246,188,73,.35),rgba(43,28,63,.9) 60%,transparent 70%)}
.eq{display:flex;gap:6px;align-items:flex-end;height:6rem}
.eq i{width:12px;border-radius:6px;background:linear-gradient(0deg,var(--vio),var(--gold));animation:eq 1s ease-in-out infinite}
@keyframes eq{0%,100%{height:15%}50%{height:100%}}
.bubbleS{position:absolute;font-family:var(--fd);font-weight:800;background:#fff;color:#20152E;border-radius:22px;padding:.5rem .9rem;font-size:1.25rem;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:bpop 3.6s ease-in-out infinite;opacity:0}
.bubbleS::after{content:'';position:absolute;bottom:-10px;left:22px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bpop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1)}70%{opacity:1}85%,100%{opacity:0;transform:scale(.95) translateY(-10px)}}
.case{position:relative;width:min(70%,22rem);aspect-ratio:1.1;border:3px solid rgba(255,255,255,.5);border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04) 40%,rgba(255,255,255,.12));box-shadow:inset 0 0 40px rgba(255,255,255,.15),0 0 60px rgba(246,188,73,.35);display:grid;place-items:center}
.case .lbl{position:absolute;bottom:-2.2rem;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--cream);color:#2A1A05;font-weight:800;font-size:.8rem;border-radius:6px;padding:.2rem .6rem}
.tshirts{display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.tshirts i{display:block;width:9rem;height:1.1rem;border-radius:5px;animation:fold 2.6s ease-in-out infinite both}
@keyframes fold{0%{transform:translateX(-160%) rotate(-25deg);opacity:0}30%,100%{transform:none;opacity:1}}
.digi{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:3.4rem;color:#FF4D6D;background:#0b0812;border:3px solid #333;border-radius:12px;padding:.1rem .8rem;letter-spacing:.06em;text-shadow:0 0 18px rgba(255,77,109,.7)}
body.noanim .eq i,body.noanim .bubbleS,body.noanim .tshirts i{animation:none;opacity:1}

/* star voting */
.vpanel{display:flex;flex-direction:column;gap:.7rem}
.crit{display:grid;grid-template-columns:minmax(8rem,.9fr) auto;align-items:center;gap:.4rem 1rem;border:1px solid var(--line);border-radius:18px;padding:.55rem .9rem;background:rgba(255,255,255,.04)}
.crit .cn{font-family:var(--fd);font-weight:800;font-size:1.18rem}
.crit .cq{font-size:.8rem;color:var(--tx2)}
.stars{display:flex;gap:.15rem}
.stars button{border:0;background:transparent;font-size:2.15rem;line-height:1;color:rgba(255,255,255,.2);padding:.05rem .1rem;transition:transform .12s,color .12s;text-shadow:0 0 0 transparent}
.stars button.on{color:var(--gold);text-shadow:0 0 16px rgba(246,188,73,.6)}
.stars button:hover{transform:scale(1.15)}
.stars.ro button{cursor:default}
.stars.ro button:hover{transform:none}
.jurors{display:flex;flex-wrap:wrap;gap:.35rem}
.jur{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:.2rem .7rem .2rem .25rem;font-weight:800;font-size:.8rem}
.jur .ini{display:grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:50%;background:rgba(255,255,255,.15);font-size:.68rem}
.jur.voted{border-color:rgba(62,224,165,.55);background:rgba(62,224,165,.12)}
.jur.voted .ini{background:var(--ok);color:#06231a}
.jur.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(246,188,73,.35)}
.jur.no{opacity:.4;text-decoration:line-through}
.vsub{font-family:var(--fd);font-weight:800;font-size:1.25rem;color:var(--ok);animation:pop .5s ease both}
.res{display:grid;grid-template-columns:auto 1fr auto;gap:.35rem .7rem;align-items:center}
.res .tr2{height:.7rem;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.res .tr2 i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--vio),var(--gold));transition:width .8s cubic-bezier(.2,1,.3,1)}
.total{font-family:var(--fd);font-weight:800;font-size:2.4rem;color:var(--gold2);line-height:1}

/* leaderboard */
.lb{display:flex;flex-direction:column;gap:.45rem}
.lbr{display:grid;grid-template-columns:2.6rem 3.2rem minmax(0,1.4fr) repeat(3,minmax(3.2rem,.5fr)) minmax(6rem,1fr) 3.4rem;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:18px;padding:.45rem .8rem;background:rgba(255,255,255,.045)}
.lbr.head{background:transparent;border:0;padding:.1rem .8rem;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
.lbr .pl{font-family:var(--fd);font-weight:800;font-size:1.5rem;text-align:center}
.lbr.p1{border-color:var(--gold);background:linear-gradient(90deg,rgba(246,188,73,.22),rgba(255,255,255,.04));box-shadow:0 0 30px -10px rgba(246,188,73,.6)}
.lbr .nm b{font-family:var(--fd);font-size:1.12rem}
.lbr .nm div{font-size:.75rem;color:var(--tx2)}
.lbr .sc{font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.lbr .tt{display:flex;flex-direction:column;gap:.2rem}
.lbr .tt b{font-family:var(--fd);font-size:1.25rem;color:var(--gold2)}
.lbr .tt .tr2{height:.45rem;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.lbr .tt .tr2 i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--gold));transition:width 1s cubic-bezier(.2,1,.3,1)}
.lbr.hid{opacity:.6;background:repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 14px,rgba(255,255,255,.07) 14px 28px)}
.lbr.hid .nm b{letter-spacing:.3em;color:var(--tx2)}
.lbr.nr{opacity:.6}
.lbr.in{animation:up .6s ease both}

/* golden buzzer */
.gbz{position:relative;display:inline-grid;place-items:center;width:7.2rem;height:7.2rem;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#FFF6D6,#F6BC49 38%,#B9791B 75%);box-shadow:0 .7rem 0 #7A5314,0 1.1rem 2rem rgba(0,0,0,.55),0 0 40px rgba(246,188,73,.55),inset 0 -6px 12px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;color:#3A2405;font-family:var(--fd);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-align:center;line-height:1.1}
.gbz:active,.gbz.pressed{transform:translateY(.55rem);box-shadow:0 .15rem 0 #7A5314,0 .4rem 1rem rgba(0,0,0,.55),0 0 60px rgba(246,188,73,.9),inset 0 -3px 8px rgba(0,0,0,.25)}
.gbz.sm{width:4.6rem;height:4.6rem;font-size:.6rem;box-shadow:0 .45rem 0 #7A5314,0 .8rem 1.4rem rgba(0,0,0,.5),0 0 26px rgba(246,188,73,.5)}
.gbz[disabled]{filter:grayscale(.85);opacity:.5;cursor:not-allowed}
.gbz::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:3px solid rgba(246,188,73,.35)}
#gbo{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(246,188,73,.42),rgba(17,13,27,.97) 60%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:1rem;overflow:auto}
#gbo .box{text-align:center;max-width:56rem}
#gbo .t1{font-family:var(--fd);font-weight:800;font-size:clamp(2.4rem,6vw,5rem);line-height:.95;background:linear-gradient(180deg,#FFF6D6,#F6BC49 55%,#C98A22);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#gbo .t2{font-family:var(--fd);font-weight:800;font-size:clamp(1.3rem,3vw,2.2rem);color:#fff;margin-top:.5rem}

/* timers */
.timer{font-family:var(--fd);font-weight:800;font-size:3.4rem;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--amb)}
.timer.out{color:var(--coral)}
.timesup{font-family:var(--fd);font-weight:800;font-size:1.6rem;color:var(--coral);animation:pop .6s ease both}

/* breakout & teams */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.7rem}
.grp{border:1px solid var(--line2);border-radius:20px;padding:.75rem .85rem;background:rgba(255,255,255,.05)}
.grp.cur{border-color:var(--gold);box-shadow:0 0 0 2px rgba(246,188,73,.3)}
.grp .gh{font-family:var(--fd);font-weight:800;font-size:1.15rem;margin-bottom:.4rem}
.mem{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem;margin:.15rem;font-weight:700;background:rgba(255,255,255,.06)}
button.mem:hover{border-color:var(--gold)}
.mem.on{border-color:var(--gold);background:rgba(246,188,73,.2)}
.tcard{position:relative;border-radius:22px;border:2px solid var(--gold);background:linear-gradient(150deg,rgba(130,85,181,.55),rgba(32,21,46,.9) 60%,rgba(246,188,73,.2));padding:1.1rem 1.2rem;min-height:8.5rem}
.tcard .em{font-size:3rem;line-height:1}
.tcard .tn{font-family:var(--fd);font-weight:800;font-size:1.6rem;margin-top:.3rem}
.tcard .td{font-size:1.05rem;font-weight:600;color:#F1E6FA;margin-top:.2rem}
.tcard.spin{animation:flipc .55s ease both}
@keyframes flipc{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
body.noanim .tcard.spin{animation:none}
.builder{display:flex;flex-direction:column;gap:.4rem}
.bstep{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;border:1px solid var(--line);border-radius:14px;padding:.4rem .7rem;background:rgba(255,255,255,.04)}
.bstep .q{font-weight:800;font-size:.8rem;color:var(--tx2)}
.bstep .s{font-weight:700;font-size:1.02rem}
.bstep.dn{border-color:rgba(62,224,165,.45);background:rgba(62,224,165,.08)}
.prompts{display:flex;flex-direction:column;gap:.5rem}
.prompts div{font-size:1.22rem;font-weight:700;border-left:4px solid var(--gold);padding:.3rem .8rem;background:rgba(255,255,255,.04);border-radius:0 14px 14px 0}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem}
.tbl td,.tbl th{padding:.42rem .65rem;border-top:1px solid var(--line);vertical-align:top;text-align:left}
.tbl th{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);border-top:0}
.tbl td:first-child{font-weight:800;color:var(--gold2)}

/* grammar */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.pcard{border-radius:20px;padding:1rem 1.2rem;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.pcard.pro{border-color:var(--gold);background:linear-gradient(160deg,rgba(246,188,73,.16),rgba(130,85,181,.15))}
.pcard h4{margin:0 0 .5rem;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2)}
.pcard p{font-size:1.32rem;font-weight:700;margin:.35rem 0;line-height:1.3}
.wv{background:linear-gradient(transparent 55%,rgba(130,85,181,.6) 55%);border-bottom:2px solid var(--vio2);font-weight:800}
.wn{background:linear-gradient(transparent 55%,rgba(246,188,73,.5) 55%);border-bottom:2px solid var(--gold);font-weight:800}
.morph{display:flex;flex-direction:column;gap:.55rem}
.mrow{display:flex;align-items:center;gap:.8rem;font-family:var(--fd);font-weight:800;font-size:1.6rem}
.mrow .a{color:var(--vio2)}
.mrow .ar{color:var(--gold);font-size:1.3rem}
.mrow .b{color:var(--gold2)}
.mrow .b .suf{color:#fff;background:rgba(246,188,73,.35);border-radius:6px;padding:0 .12em}
.mrow.go .b{animation:morph .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes morph{0%{opacity:0;letter-spacing:.4em;filter:blur(6px)}100%{opacity:1;letter-spacing:normal;filter:none}}
body.noanim .mrow.go .b{animation:none}
.rule{border:2px solid var(--gold);border-radius:24px;padding:1rem 1.3rem;background:linear-gradient(150deg,rgba(246,188,73,.16),rgba(32,21,46,.85) 55%);box-shadow:0 0 50px -15px rgba(246,188,73,.5)}
.rule .rt{font-family:var(--fd);font-weight:800;font-size:2.3rem;letter-spacing:.06em;color:var(--gold2)}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.gcol{border:1px solid var(--line);border-radius:16px;padding:.6rem .9rem;background:rgba(255,255,255,.04)}
.gcol h5{margin:0 0 .3rem;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.gcol div{font-family:var(--fd);font-weight:700;font-size:1.18rem;margin:.18rem 0}
.tabs2{display:flex;gap:.3rem;flex-wrap:wrap}
.task{display:flex;flex-direction:column;gap:.6rem}
.ttype{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:.2rem .7rem;background:rgba(130,85,181,.35);border:1px solid rgba(201,167,242,.5)}
.orig{font-size:1.05rem;color:var(--tx2);font-weight:600}
.orig b{color:var(--tx)}
.gap{display:inline-block;min-width:6.5rem;border-bottom:3px dashed var(--gold);text-align:center;color:var(--gold2)}
.opt{border:2px solid var(--line2);background:rgba(255,255,255,.05);border-radius:14px;padding:.4rem 1rem;font-family:var(--fd);font-weight:800;font-size:1.3rem}
.opt.ok{border-color:var(--ok);background:rgba(62,224,165,.18)}
.opt.bad{border-color:var(--coral);background:rgba(255,122,138,.15)}
.opt.pick{border-color:var(--gold);background:rgba(246,188,73,.2)}

/* speaking helper / cheat sheets */
.help{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.help span{border:1px solid var(--line);border-radius:12px;padding:.3rem .6rem;font-weight:700;font-size:.92rem;background:rgba(255,255,255,.04)}
#sheet{position:fixed;inset:0;z-index:75;background:rgba(10,7,16,.9);backdrop-filter:blur(8px);display:flex;flex-direction:column;padding:1rem 1.4rem}
#sheet .sbox{flex:1;min-height:0;display:flex;flex-direction:column;background:#1B1229;border:1px solid var(--line2);border-radius:24px;padding:1rem 1.2rem;max-width:84rem;width:100%;margin:0 auto}
.vt{width:100%;border-collapse:separate;border-spacing:0;font-size:.95rem}
.vt th{position:sticky;top:0;background:#2A1C40;text-align:left;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);padding:.5rem .7rem;z-index:1}
.vt td{padding:.45rem .7rem;border-top:1px solid var(--line);vertical-align:top;line-height:1.25}
.vt td:first-child{font-family:var(--fd);font-weight:800;font-size:1.08rem;white-space:nowrap;color:var(--gold2)}
.vt tr.g td:first-child{color:#D9C2FF}
.vt tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.vt tr.pickd td{background:rgba(246,188,73,.2)!important;box-shadow:inset 0 0 0 1px var(--gold)}
.vtbox{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:18px;background:rgba(10,7,16,.6)}

/* listening player */
.player{border-radius:24px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(130,85,181,.35),rgba(17,13,27,.9));padding:1rem 1.1rem}
.player .pbtns{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.player .seek{position:relative;height:.7rem;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer;margin-top:.8rem}
.player .seek i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--vio),var(--gold))}
.player .wave{display:flex;gap:3px;align-items:center;height:3.2rem;margin-top:.6rem}
.player .wave i{flex:1;border-radius:3px;background:rgba(255,255,255,.18)}
.player .wave i.pl{background:var(--gold)}
.player.playing .wave i.pl{animation:eq 1.1s ease-in-out infinite}
.trans{border:1px dashed var(--line2);border-radius:16px;padding:.7rem .9rem;background:rgba(255,255,255,.04);font-size:1.02rem;line-height:1.5}
.trans p{margin:.2rem 0}
.trans p.now{color:var(--gold2);font-weight:700}
select.sp{background:#24183A;border:1px solid var(--line);border-radius:10px;padding:.3rem .4rem}
input[type=range]{accent-color:var(--gold)}

/* role switch */
#rsw{position:fixed;inset:0;z-index:84;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(130,85,181,.55),rgba(17,13,27,.97) 70%)}
#rsw .t{font-family:var(--fd);font-weight:800;font-size:clamp(2.4rem,6vw,5.2rem);text-align:center;line-height:.95}
#rsw .s{font-family:var(--fd);font-weight:800;font-size:clamp(1.2rem,2.8vw,2rem);color:var(--gold2);text-align:center;margin-top:1rem}

/* curtain / transitions */
#curtain{position:fixed;inset:0;z-index:86;pointer-events:none;display:none}
#curtain.on{display:block}
#curtain .l,#curtain .r{position:absolute;top:0;bottom:0;width:51%;background:repeating-linear-gradient(90deg,#3B1F5C 0 3.2rem,#5E3590 3.2rem 4.6rem,#2A1544 4.6rem 6.4rem);box-shadow:0 0 60px rgba(0,0,0,.8)}
#curtain .l{left:0;animation:cl 2.4s ease-in-out both}
#curtain .r{right:0;animation:cr 2.4s ease-in-out both}
#curtain .tt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--fd);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.8rem);color:var(--gold2);text-shadow:0 6px 30px #000;animation:ctt 2.4s ease both;padding:1rem}
@keyframes cl{0%{transform:translateX(-100%)}30%,62%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes cr{0%{transform:translateX(100%)}30%,62%{transform:translateX(0)}100%{transform:translateX(100%)}}
@keyframes ctt{0%,25%{opacity:0;transform:scale(.9)}38%,60%{opacity:1;transform:none}75%,100%{opacity:0}}
.lower3{position:absolute;left:1.4rem;bottom:1.2rem;z-index:5;display:flex;align-items:center;gap:.7rem;background:linear-gradient(90deg,rgba(246,188,73,.95),rgba(201,138,34,.9));color:#2A1A05;border-radius:14px;padding:.5rem 1rem;font-family:var(--fd);font-weight:800;font-size:1.05rem;box-shadow:0 20px 40px -10px rgba(0,0,0,.6);animation:l3 3.6s ease both;pointer-events:none}
@keyframes l3{0%{opacity:0;transform:translateX(-40px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-20px)}}
#fx{position:fixed;inset:0;z-index:96;pointer-events:none;width:100%;height:100%}

/* awards */
.envw{display:flex;flex-direction:column;align-items:center;gap:1rem}
.envl{position:relative;width:min(30rem,90%);aspect-ratio:1.55;perspective:1000px}
.envl .bk{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#FFE7A3,#F6BC49 45%,#C98A22);box-shadow:0 30px 60px -20px rgba(0,0,0,.8),0 0 60px rgba(246,188,73,.4)}
.envl .lt{position:absolute;left:7%;right:7%;bottom:8%;height:80%;border-radius:10px;background:var(--cream);color:#20152E;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.6rem;transition:transform .9s cubic-bezier(.3,1.3,.4,1) .35s;z-index:1}
.envl .fl{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:50% 0;transition:transform .6s ease;z-index:3;background:linear-gradient(170deg,#FFD877,#E3A63A);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.envl .fr{position:absolute;inset:0;z-index:2;border-radius:14px;background:linear-gradient(160deg,#F6BC49,#D9962A);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.envl .seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:3.4rem;height:3.4rem;border-radius:50%;background:#9B1B3A;display:grid;place-items:center;font-size:1.4rem;transition:opacity .3s}
.envl.open .fl{transform:rotateX(180deg);z-index:0}
.envl.open .seal{opacity:0}
.envl.open .lt{transform:translateY(-34%);z-index:3}
.envl .aw{font-family:var(--fd);font-weight:800;font-size:1.05rem;color:#7A5314;letter-spacing:.06em;text-transform:uppercase}
.envl .wn2{font-family:var(--fd);font-weight:800;font-size:1.9rem;line-height:1.05;margin-top:.3rem}
.envl .ws{font-size:.85rem;font-weight:700;color:#5E3A8C}
body.noanim .envl *{transition:none!important}
.awlist{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center}

/* game zone */
.gcards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;flex:1;min-height:0;align-content:center}
.gcard{border-radius:26px;border:2px solid var(--line2);padding:1.3rem 1.3rem 1.1rem;background:linear-gradient(160deg,rgba(130,85,181,.5),rgba(17,13,27,.85) 65%);display:flex;flex-direction:column;gap:.5rem;text-align:left;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-4px);border-color:var(--gold)}
.gcard .gi{font-size:3rem}
.gcard h3{font-size:1.5rem}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.qo{display:flex;align-items:center;gap:.7rem;border:2px solid var(--line);border-radius:18px;padding:.8rem 1rem;font-weight:800;font-size:1.25rem;text-align:left;background:rgba(255,255,255,.05)}
.qo .sh{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:10px;font-size:1.1rem;flex:none;color:#fff}
.qo.pk{border-color:var(--gold);background:rgba(246,188,73,.16)}
.qo.ok{border-color:var(--ok);background:rgba(62,224,165,.2)}
.qo.no{border-color:var(--coral);background:rgba(255,122,138,.12);opacity:.75}
.wheelw{position:relative;aspect-ratio:1;height:100%;max-height:100%;max-width:100%;margin:0 auto}
.wheelw canvas{width:100%;height:100%;display:block}
.wheelw .ptr{position:absolute;left:50%;top:-.4rem;transform:translateX(-50%);width:0;height:0;border-left:1.1rem solid transparent;border-right:1.1rem solid transparent;border-top:2.2rem solid var(--gold);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));z-index:2}
.wres{font-family:var(--fd);font-weight:800;font-size:3rem;color:var(--gold2);line-height:1}

/* overlays */
#modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(6,4,12,.74);backdrop-filter:blur(6px);padding:1rem}
#modalBox{width:min(48rem,100%);max-height:92vh;overflow:auto;background:#1B1229;border:1px solid var(--line2);border-radius:24px;padding:1.3rem 1.4rem}
#toast{position:fixed;left:50%;bottom:5rem;transform:translate(-50%,20px);opacity:0;background:#2A1C40;border:1px solid var(--line2);border-radius:14px;padding:.6rem 1rem;font-weight:700;z-index:97;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#reacts{position:fixed;right:1.5rem;bottom:5rem;z-index:60;pointer-events:none;width:3rem;height:60vh}
#reacts span{position:absolute;bottom:0;font-size:2rem;animation:flt 3s ease-out forwards}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-50vh);opacity:0}}

/* welcome / lobby (Scene 00) */
#lobby{position:fixed;inset:0;z-index:70;overflow:auto;background:#110D1B}
#lobby .lbg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.75}
#lobby .lbg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(17,13,27,.2),rgba(17,13,27,.9) 72%)}
#lobby .lin{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem clamp(1rem,4vw,3.5rem) 2rem;gap:1rem;max-width:84rem;margin:0 auto;text-align:center}
.showtitle{font-family:var(--fd);font-weight:800;font-size:clamp(2.6rem,6.6vw,6rem);line-height:.9;letter-spacing:.01em;background:linear-gradient(180deg,#FFF6D6 0%,#F6BC49 55%,#C98A22 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 40px rgba(246,188,73,.3))}
.showtitle.in{animation:tin 1.2s cubic-bezier(.2,1.2,.4,1) both}
@keyframes tin{from{opacity:0;transform:scale(.85);letter-spacing:.2em}to{opacity:1;transform:none}}
body.noanim .showtitle.in{animation:none}
.tagline{font-family:var(--fd);font-weight:800;font-size:1.6rem;color:#fff}
.cast{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.castc{display:flex;flex-direction:column;align-items:center;gap:.3rem;font-size:.75rem;font-weight:800;color:var(--tx2)}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem;width:100%;text-align:left}
.lnav{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}

/* live dock */
#dock{position:fixed;left:calc(var(--rail) + .8rem);bottom:calc(var(--fh) + .8rem);width:19rem;max-height:46vh;overflow:auto;z-index:40;background:rgba(27,18,41,.97);border:1px solid var(--line2);border-radius:18px;padding:.7rem .8rem;font-size:.8rem;display:none}
#dock.on{display:block}
#dock.min #dockBody{display:none}
body.focus #dock, body.screen #dock{display:none}
.led{width:.6rem;height:.6rem;border-radius:50%;background:var(--amb);display:inline-block}
.led.on{background:var(--ok)}
.led.bad{background:var(--coral)}
.dbar{margin:.25rem 0}
.dbar .tr3{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.dbar .tr3 i{display:block;height:100%;background:var(--gold)}

/* student phone app */
#stu{display:none}
body.student #app, body.student #lobby{display:none!important}
body.student{overflow:auto;height:auto;min-height:100dvh;background:radial-gradient(600px 400px at 80% 0,rgba(130,85,181,.45),transparent 60%),var(--bg)}
body.student #stu{display:block;max-width:34rem;margin:0 auto;padding:1rem 1rem 6rem}
.stu-head{display:flex;align-items:center;gap:.5rem;padding:.4rem 0 .8rem}
.stu-card{border:1px solid var(--line);border-radius:22px;padding:1.1rem;background:rgba(32,21,46,.9);margin-top:.8rem}
.stu-card label{display:block;font-size:.8rem;font-weight:800;color:var(--tx2);margin:.8rem 0 .3rem}
.stu-card input,.stu-card textarea{width:100%;font-size:1.1rem;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:12px;padding:.7rem .8rem}
.stu-card .btn{min-height:3rem;font-size:1.05rem}
.stu-big{font-family:var(--fd);font-size:1.5rem;font-weight:800;line-height:1.2}
.avpick{display:flex;flex-wrap:wrap;gap:.35rem}
.avpick button{font-size:1.5rem;width:2.8rem;height:2.8rem;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.avpick button.on{border-color:var(--gold);background:rgba(246,188,73,.25)}
#stuFoot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:.4rem;padding:.6rem;background:rgba(17,13,27,.94);border-top:1px solid var(--line)}
#stuFoot button{font-size:1.5rem;width:3rem;height:3rem;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.myturn{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(246,188,73,.25)}
.verif{font-size:.72rem;color:var(--ok);font-weight:800}


/* scene ambience — animated details on top of the background photos (positions in % of the 16:9 picture) */
#bg .ly{container-type:size}
.fxbox{position:absolute;left:50%;top:50%;width:max(100cqw, calc(100cqh * 1.7768));aspect-ratio:1672/941;transform:translate(-50%,-50%);pointer-events:none;overflow:hidden}
.fxbox>*{position:absolute;transform:translate(-50%,-50%)}
.fx-glow{width:var(--w,8%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--c,rgba(255,226,160,.85)) 0%,transparent 68%);mix-blend-mode:screen;animation:fxpulse var(--d,3s) ease-in-out var(--dl,0s) infinite}
.fx-glow.wide{aspect-ratio:var(--ar,3)}
@keyframes fxpulse{0%,100%{opacity:var(--lo,.25)}50%{opacity:var(--hi,.9)}}
.fx-tw{width:var(--w,.9%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FFF8E0 0%,rgba(255,214,120,.8) 35%,transparent 70%);mix-blend-mode:screen;animation:fxtw var(--d,1.6s) ease-in-out var(--dl,0s) infinite}
@keyframes fxtw{0%,100%{opacity:.15;transform:translate(-50%,-50%) scale(.7)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}}
.fx-conf{width:.7%;height:.35%;border-radius:1px;top:-4%!important;animation:fxfall var(--d,7s) linear var(--dl,0s) infinite}
@keyframes fxfall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,20px),110cqh) rotate(720deg)}}
.fx-dust{width:.45%;aspect-ratio:1;border-radius:50%;background:#FFE7A3;box-shadow:0 0 6px 2px rgba(246,188,73,.7);animation:fxrise var(--d,6s) ease-in var(--dl,0s) infinite;opacity:0}
@keyframes fxrise{0%{opacity:0;transform:translate(-50%,-50%)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,10px)),-900%)}}

/* ---------- 4 · smart turns ----------
   Блок — практичне завдання з N × R ходами (N — присутні учні, R = 1 у кожному основному блоці).
   • Спершу той, у кого найменше ходів у цьому блоці, потім — загалом, потім по колу.
   • Виконані ходи (✓) ніколи не стираються. Якщо змінилася кількість учнів — перерозподіляються лише невиконані. */
const tbGet = id => (S.tb[id] = S.tb[id] || {i:0, a:[], opt:0});
function pickFor(id, j, exclude=[]){
  const A=avail(); if(!A.length) return null;
  const T=tbGet(id), cntB={};
  T.a.forEach((x,k)=>{ if(x && k!==j) cntB[x.sid]=(cntB[x.sid]||0)+1; });
  const prev = j>0 && T.a[j-1] ? T.a[j-1].sid : null, n=S.students.length;
  let pool=A.filter(s=>!exclude.includes(s.id)); if(!pool.length) pool=A;
  let best=null, bv=1e12;
  pool.forEach(s=>{ const idx=S.students.indexOf(s), rot=(idx-(S.rot||0)+n)%n;
    const v=(cntB[s.id]||0)*1e6 + (s.id===prev && pool.length>1 ? 5e5 : 0) + (S.part[s.id]||0)*100 + rot;
    if(v<bv){ bv=v; best=s; } });
  S.rot=(S.students.indexOf(best)+1)%n; return best.id;
}
function tbEnsure(id, total){
  const T=tbGet(id); if(!TEACH) return T;
  for(let j=0;j<total;j++){ const a=T.a[j];
    if(!a || (!a.done && !avail().some(s=>s.id===a.sid))) T.a[j]={sid:pickFor(id,j), done:false}; }
  return T;
}
const doneCount = id => (tbGet(id).a||[]).filter(x=>x&&x.done).length;
function tbDone(id, j){ const T=tbGet(id), a=T.a[j]; if(a && !a.done && a.sid){ a.done=true; S.part[a.sid]=(S.part[a.sid]||0)+1; } }
function tbToggle(id, j){ const T=tbGet(id), a=T.a[j]; if(!a) return; if(a.done){ a.done=false; S.part[a.sid]=Math.max(0,(S.part[a.sid]||0)-1); } else tbDone(id,j); }
function tbPass(id, j){ const T=tbGet(id), a=T.a[j]; if(!a || a.done) return; const sid=pickFor(id,j,[a.sid]); if(sid && sid!==a.sid) a.sid=sid; else toast('Nobody else is available'); }
function tbCycle(id, j){ const T=tbGet(id), a=T.a[j], A=avail(); if(!a||!A.length) return; const i=A.findIndex(s=>s.id===a.sid); a.sid=A[(i+1)%A.length].id; }
const reqN = (R, items, min=1) => Math.min(items, Math.max(min, NS()*R));
function resetTurns(){ S.part={}; S.tb={}; S.rot=0; S.vas=[]; S.vasSig=''; }

/* Vocabulary plan — all 10 expressions stay on the five contestant cards; who explains them depends on N.
   5 → 2/2/2/2/2 · 4 → 3/3/2/2 · 3 → 4/3/3 · 2 → 5/5 · 1 → 10 (compact) · 6 → 2/2/2/2/1/1 (+ peer question for the last two).
   Done slots keep their student; only open slots are re-planned. */
const VPLAN = {1:[10],2:[5,5],3:[4,3,3],4:[3,3,2,2],5:[2,2,2,2,2],6:[2,2,2,2,1,1]};
const VSLOTS = CONTESTANTS.flatMap((c,ci)=>c.words.map((w,wi)=>({ci, w, k:c.id+':'+w})));
function vocabAssign(){
  if(!TEACH) return S.vas;
  const A=avail(), n=clamp(A.length,1,6), plan=VPLAN[n]||VPLAN[5];
  const sig=A.map(s=>s.id).join(',');
  const done = S.vas.filter(x=>x&&x.done);
  if(S.vasSig===sig && S.vas.length===10 && S.vas.every(x=>x && (x.done || A.some(s=>s.id===x.sid)))) return S.vas;
  const quota={}; A.forEach((s,i)=>{ quota[s.id]=plan[i]||0; });
  done.forEach(x=>{ if(quota[x.sid]!=null) quota[x.sid]--; });
  const order=A.map(s=>s.id);
  let p=0;
  for(let j=0;j<10;j++){
    const cur=S.vas[j];
    if(cur && cur.done) continue;
    while(p<order.length && (quota[order[p]]||0)<=0) p++;
    let sid = p<order.length ? order[p] : null;
    if(!sid){ /* compensation: give the open slot to the student with the fewest turns overall */
      sid = A.slice().sort((a,b)=>(S.part[a.id]||0)-(S.part[b.id]||0))[0]?.id || null; }
    else quota[sid]--;
    S.vas[j]={sid, done:false};
  }
  S.vasSig=sig; return S.vas;
}

function vasDone(j){ const a=S.vas[j]; if(a && !a.done && a.sid){ a.done=true; S.part[a.sid]=(S.part[a.sid]||0)+1; } }
function vasToggle(j){ const a=S.vas[j]; if(!a) return; if(a.done){ a.done=false; S.part[a.sid]=Math.max(0,(S.part[a.sid]||0)-1); } else vasDone(j); }

/* ---------- 5 · timers ---------- */
const now = ()=>Date.now();
const el = t => t.at ? t.acc + (now()-t.at)/1000 : t.acc;
const cd = t => t.at ? Math.max(0, t.left-(now()-t.at)/1000) : t.left;
const TM = {
  lesson(){ return el(S.tm.lesson); }, ep(){ return el(S.tm.ep); }, run(){ return !!S.tm.lesson.at; },
  toggle(){ const L=S.tm.lesson, E=S.tm.ep; if(L.at){ L.acc=el(L); L.at=0; E.acc=el(E); E.at=0; } else { L.at=now(); E.at=now(); } save(); paintTimers(); },
  start(){ if(!S.tm.lesson.at) TM.toggle(); },
  reset(){ S.tm.lesson={acc:0,at:0}; S.tm.ep={acc:0,at:0,n:epOf(S.i)}; save(); paintTimers(); },
  newEp(n){ if(S.tm.ep.n===n) return; S.tm.ep={acc:0, at:S.tm.lesson.at?now():0, n}; },
  /* countdowns: bo (breakout prep), perf (performance), quiz — never move the lesson on automatically */
  left(k){ return cd(S.tm[k]); }, on(k){ return !!S.tm[k].at && cd(S.tm[k])>0; },
  go(k){ const b=S.tm[k]; if(!b.at){ if(b.left<=0) b.left=b.dur; b.at=now(); } save(); paintTimers(); pub(); },
  pause(k){ const b=S.tm[k]; if(b.at){ b.left=cd(b); b.at=0; } save(); paintTimers(); pub(); },
  flip(k){ TM.on(k)?TM.pause(k):TM.go(k); },
  rst(k,d){ const b=S.tm[k]; if(d) b.dur=d; b.left=b.dur; b.at=0; save(); paintTimers(); pub(); },
  add(k,s){ const b=S.tm[k], l=cd(b); b.left=Math.max(0,l+s); if(b.at) b.at=now(); save(); paintTimers(); pub(); },
  end(k){ const b=S.tm[k]; b.left=0; b.at=0; save(); paintTimers(); pub(); }
};
const rang = {}, ticked = {};
function paintTimers(){
  const c=$('#clock'); if(c){ const t=TM.lesson(); c.textContent=(TM.run()?'⏱ ':'⏸ ')+mmss(t)+' / '+CORE_MIN; c.classList.toggle('run',TM.run()); c.classList.toggle('over',t>CORE_MIN*60); }
  ['bo','perf','quiz'].forEach(k=>{ const l=TM.left(k), run=TM.on(k), b=S.tm[k];
    $$(`[data-tmr="${k}"]`).forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=30&&l>0); e.classList.toggle('out',l<=0); });
    $$(`[data-tmb="${k}"]`).forEach(e=>{ e.textContent = run ? '⏸ Pause' : (l>0 && l<b.dur ? '▶ Resume' : '▶ Start'); });
    $$(`[data-tup="${k}"]`).forEach(e=>e.classList.toggle('hidden', !(l<=0)));
    const sec=Math.ceil(l);
    if(run && sec<=5 && sec>0 && ticked[k]!==sec){ ticked[k]=sec; if(k!=='quiz') SFX.play('tick'); }
    if(b.at && l<=0 && !rang[k]){ rang[k]=1; if(TEACH){ toast('⏰ Time is up!'); SFX.play('ding'); } b.at=0; b.left=0; save(); $$(`[data-tup="${k}"]`).forEach(e=>e.classList.remove('hidden')); pub(); }
    if(l>0) rang[k]=0; });
  $$('[data-tmr="lesson"]').forEach(e=>e.textContent=mmss(TM.lesson()));
  $$('[data-tmr="ep"]').forEach(e=>e.textContent=mmss(TM.ep()));
}

/* ---------- 6 · sound & effects ----------
   Усі звуки синтезуються (WebAudio), без файлів. Грають лише у вікні вчителя й лише після дії користувача.
   У Zoom: Share screen → ✔ Share sound. Перемикач 🔊 вгорі. */
const SFX = {
  ctx:null,
  ac(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  ok(){ return TEACH && S.sound; },
  noise(dur){ const a=this.ctx, b=a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; const s=a.createBufferSource(); s.buffer=b; return s; },
  tone(f, t0, dur, type='sine', vol=.18){ const a=this.ctx, o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(.0008,t0+dur); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+.05); },
  play(kind){
    if(!this.ok()) return; const a=this.ac(); if(!a) return; const t=a.currentTime;
    try{
    if(kind==='applause'){ const dur=2.8, s=this.noise(dur), bp=a.createBiquadFilter(), g=a.createGain(); bp.type='bandpass'; bp.frequency.value=2200; bp.Q.value=.7;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.35,t+.25); g.gain.setValueAtTime(.35,t+1.9); g.gain.linearRampToValueAtTime(0,t+dur);
      const am=a.createGain(), lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=13; lg.gain.value=.5; am.gain.value=.55; lfo.connect(lg).connect(am.gain);
      s.connect(bp).connect(am).connect(g).connect(a.destination); s.start(t); lfo.start(t); s.stop(t+dur); lfo.stop(t+dur); }
    if(kind==='ding'){ this.tone(880,t,.5,'sine',.2); this.tone(1320,t+.12,.7,'sine',.16); }
    if(kind==='notify'){ this.tone(660,t,.25,'triangle',.15); this.tone(990,t+.1,.35,'triangle',.12); }
    if(kind==='tick'){ this.tone(1200,t,.06,'square',.06); }
    if(kind==='whoosh'){ const dur=1.1, s=this.noise(dur), f=a.createBiquadFilter(), g=a.createGain(); f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(3500,t+.7); f.frequency.exponentialRampToValueAtTime(800,t+dur);
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25,t+.35); g.gain.linearRampToValueAtTime(0,t+dur); s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur);
      [523,659,784,1047].forEach((f2,i)=>this.tone(f2,t+.35+i*.07,.5,'triangle',.08)); }
    if(kind==='buzzer'){ [261.6,329.6,392,523.3].forEach(f2=>this.tone(f2,t,1.4,'sawtooth',.05)); [523.3,659.3,784,1046.5,1318.5,1568].forEach((f2,i)=>this.tone(f2,t+.15+i*.08,.9,'triangle',.11)); setTimeout(()=>this.play('applause'),500); }
    if(kind==='fanfare'){ [[392,0],[523.3,.16],[659.3,.32],[784,.48],[659.3,.7],[784,.86]].forEach(([f2,d])=>{ this.tone(f2,t+d,.45,'sawtooth',.06); this.tone(f2*2,t+d,.4,'triangle',.05); }); setTimeout(()=>this.play('applause'),900); }
    if(kind==='spin'){ for(let i=0;i<22;i++) this.tone(700+((i*137)%400), t+i*(.05+i*.008), .04, 'square', .04); }
    }catch(e){}
  }
};

const FX = {
  raf:0, parts:[],
  confetti(n=160, gold){
    if(S.noanim || REDUCED_OS) return;
    const c=$('#fx'); if(!c) return; const W=c.width=innerWidth, H=c.height=innerHeight, x=c.getContext('2d');
    const cols = gold ? ['#F6BC49','#FFE2A0','#FFF6D6','#C98A22','#FFFFFF'] : ['#F6BC49','#FFE2A0','#8255B5','#C9A7F2','#FFFFFF','#FF9EB0'];
    if(this.parts.length>420) this.parts.splice(0,this.parts.length-260);
    for(let i=0;i<n;i++) this.parts.push({x:W/2+(Math.random()-.5)*W*.5, y:H*.35+(Math.random()-.5)*80, vx:(Math.random()-.5)*16, vy:-Math.random()*16-4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*8, h:4+Math.random()*6, c:cols[i%cols.length], life:0});
    const step=()=>{ x.clearRect(0,0,W,H); this.parts.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
      this.parts=this.parts.filter(p=>p.y<H+40 && p.life<260); if(this.parts.length) this.raf=requestAnimationFrame(step); else { x.clearRect(0,0,W,H); this.raf=0; } };
    if(!this.raf) this.raf=requestAnimationFrame(step);
  }
};
/* shared effects (teacher → audience window): S.fx = {kind, at} */
let FXSEEN = 0;
function fire(kind){ S.fx={kind, at:now()}; FXSEEN=S.fx.at; runFx(kind); }
function runFx(kind){
  if(kind==='confetti') FX.confetti(170);
  if(kind==='gold'){ FX.confetti(240,true); }
  if(kind==='award'){ FX.confetti(200); }
  if(TEACH){ if(kind==='gold') SFX.play('buzzer'); else if(kind==='award') SFX.play('fanfare'); else if(kind==='confetti') SFX.play('applause'); else if(kind==='applause') SFX.play('applause'); else if(kind==='whoosh') SFX.play('whoosh'); }
}
function checkFx(){ if(S.fx && S.fx.at && S.fx.at!==FXSEEN){ const fresh=now()-S.fx.at<5000; FXSEEN=S.fx.at; if(fresh && !TEACH) runFx(S.fx.kind); } }
function curtain(text){ S.curt={t:text, at:now()}; runCurtain(); }
let CURSEEN=0;
function runCurtain(){ const C=S.curt; if(!C || !C.at || C.at===CURSEEN) return; CURSEEN=C.at; if(now()-C.at>2600 || S.noanim || REDUCED_OS) return;
  const el2=$('#curtain'); $('.tt',el2).textContent=C.t; el2.classList.remove('on'); void el2.offsetWidth; el2.classList.add('on'); clearTimeout(el2._t); el2._t=setTimeout(()=>el2.classList.remove('on'),2450); }


/* ---------- teams (Scene 07–09) ---------- */
function defaultGroups(mode){
  const ids=avail().map(s=>s.id), n=ids.length; let g=[];
  if(mode==='solo') g=ids.map(i=>[i]);
  else if(mode==='mixed' && n===3) g=[[ids[0]],[ids[1],ids[2]]];
  else if(mode==='pairs'){ for(let i=0;i<n;i+=2) g.push(ids.slice(i,i+2)); if(g.length>1 && g[g.length-1].length===1) g[g.length-2].push(g.pop()[0]); }
  else if(mode==='teams'){ const k=Math.max(1,Math.round(n/3)); const sizes=Array.from({length:k},(_,i)=>Math.floor(n/k)+(i>=k-(n%k)?1:0)); let p=0; sizes.forEach(sz=>{ g.push(ids.slice(p,p+sz)); p+=sz; }); }
  else { /* auto: 1 solo · 2 pair · 3 team · 4 two pairs · 5 pair + three · 6 two threes */
    const P={1:[1],2:[2],3:[3],4:[2,2],5:[2,3],6:[3,3]}[n] || [n]; let p=0; P.forEach(sz=>{ g.push(ids.slice(p,p+sz)); p+=sz; }); }
  return g.filter(x=>x.length).map((m,i)=>({id:'T'+(i+1), m}));
}
function groups(){
  const sig=avail().map(s=>s.id).sort().join(',');
  let G=S.bo.groups;
  if(G && G.length && S.bo.lock){
    if(S.bo.sig!==sig){ const here=new Set(avail().map(s=>s.id)); G.forEach(g=>g.m=g.m.filter(x=>here.has(x)));
      const inG=new Set(G.flatMap(g=>g.m)); avail().forEach(s=>{ if(!inG.has(s.id)){ const t=G.filter(g=>g.m.length).sort((a,b)=>a.m.length-b.m.length)[0]||G[0]; t.m.push(s.id); } });
      S.bo.sig=sig; }
    return G.filter(g=>g.m.length);
  }
  if(!G || S.bo.sig!==sig || !G.length){ S.bo.groups=defaultGroups(S.bo.mode); S.bo.sig=sig; }
  return S.bo.groups;
}
const teamOf = sid => groups().find(g=>g.m.includes(sid));
const tinfo = id => (S.bo.teams[id] = S.bo.teams[id] || {name:'', stage:'', talent:null, custom:'', ready:false, gen:null, done:{}});
const tname = g => { const t=tinfo(g.id); if(t.name) return t.name; const i=groups().findIndex(x=>x.id===g.id); return TEAM_NAMES[i<0?0:i]||('Team '+g.id); };
const ttal  = g => { const t=tinfo(g.id); return t.custom ? {e:'✨', n:t.custom, d:'Our own invented talent'} : (t.talent!=null ? TALENTS[t.talent] : null); };

/* ---------- 7 · voting · leaderboard · golden buzzer ----------
   Бюлетень: S.ballots[cid][jk] = {c,e,p,n,src}.  cid: 'c:leo' (конкурсант) або 't:T1' (команда учнів).
   jk — член журі: id учня, 'group' (спільна оцінка групи) або 'p:…' (телефон, якого не вдалося зіставити з іменем).
   Середні рахуються лише з повних бюлетенів; без голосів → Not Rated. Один бюлетень на члена журі (повторне — це зміна голосу). */
const isTeam = cid => String(cid).startsWith('t:');
const gOf = cid => groups().find(g=>'t:'+g.id===cid);
function itemInfo(cid){
  if(isTeam(cid)){ const g=gOf(cid); if(!g) return {name:'(team)', sub:'', emoji:'🎭'}; const t=ttal(g), ti=tinfo(g.id);
    return {name:tname(g), sub:ti.stage || (t?t.n:''), emoji:t?t.e:'🎭', members:g.m.map(sname), g}; }
  const c=CB[cid.slice(2)]||{}; return {name:c.name, sub:c.stage, emoji:c.emoji, photo:PH[c.id], c};
}
const BAL = cid => (S.ballots[cid] = S.ballots[cid] || {});
const full = b => b && [b.c,b.e,b.p].every(v=>Number.isInteger(v)&&v>=1&&v<=5);
function stats(cid){
  const B=Object.values(S.ballots[cid]||{}).filter(full); if(!B.length) return null;
  const n=B.length, s=k=>B.reduce((a,b)=>a+b[k],0)/n;
  return {n, c:s('c'), e:s('e'), p:s('p'), tot:B.reduce((a,b)=>a+b.c+b.e+b.p,0)/n};
}
function jurors(cid){
  const g=isTeam(cid)?gOf(cid):null;
  return avail().map(s=>({jk:s.id, name:s.name, own: !!(g && g.m.includes(s.id))}));
}
function voteCount(cid){ return Object.values(S.ballots[cid]||{}).filter(full).length; }
function poolIds(pool){ return pool==='orig' ? CONTESTANTS.map(c=>'c:'+c.id) : groups().map(g=>'t:'+g.id); }
function ranked(pool){
  const rows=poolIds(pool).map(cid=>({cid, st:stats(cid), info:itemInfo(cid)}));
  rows.sort((a,b)=> (b.st?b.st.tot:-1)-(a.st?a.st.tot:-1));
  rows.forEach(r=>{ r.place = r.st ? 1+rows.filter(x=>x.st && r2(x.st.tot)>r2(r.st.tot)).length : null; });
  return rows;
}
function winners(pool, aw){
  if(aw.gb) return [...new Set(Object.values(S.gb).map(x=>x.target).filter(t=>poolIds(pool).includes(t)))];
  if(aw.manual) return (S.aw.pick[pool+':'+aw.k]||[]).filter(t=>poolIds(pool).includes(t));
  const R=poolIds(pool).map(cid=>({cid, st:stats(cid)})).filter(r=>r.st); if(!R.length) return [];
  const v=r=>r2(r.st[aw.crit]); const mx=Math.max(...R.map(v)); return R.filter(r=>v(r)===mx).map(r=>r.cid);
}
function submitBallot(cid, jk, b, src, nm){
  if(!full(b)) return false;
  const g=isTeam(cid)?gOf(cid):null; if(g && g.m.includes(jk)) { toast('Students can’t vote for their own team'); return false; }
  BAL(cid)[jk]={c:b.c, e:b.e, p:b.p, n:nm||(jk==='group'?'Group':sname(jk)), src:src||'t'};
  S.vlast[cid]={n:BAL(cid)[jk].n, at:now()}; return true;
}
function nextJuror(cid){
  const J=jurors(cid).filter(j=>!j.own && !full((S.ballots[cid]||{})[j.jk]));
  return J.length ? J[0].jk : null;
}
function openVote(cid){ S.vopen[cid]=true; if(!S.jsel[cid]) S.jsel[cid]=nextJuror(cid); }

/* ---------- 9 · listening player — audio file → browser TTS → teacher script ---------- */
const AUD = {
  wrap:null, el:null, mode:'?', playing:false, idx:0, t:0, rate:1, vol:1, cum:[], dur:0, voice:null, tick:null, t0:0, upl:null, remote:null,
  est(){ const words=SCRIPT.map(s=>s.split(/\s+/).length); let c=0; this.cum=[0]; words.forEach(w=>{ c+=w/2.45+.55; this.cum.push(c); }); this.durTTS=c; },
  pickVoice(){ if(!('speechSynthesis' in window)) return null; const V=speechSynthesis.getVoices()||[]; if(!V.length) return null;
    const by=f=>V.find(f); return by(v=>/en-GB/i.test(v.lang)&&/male|daniel|arthur|george|ryan/i.test(v.name)) || by(v=>/en-GB/i.test(v.lang)) || by(v=>/en-US/i.test(v.lang)&&/google|guy|davis|male/i.test(v.name)) || by(v=>/^en/i.test(v.lang)) || null; },
  init(){
    if(this.mode!=='?') return; this.est();
    if(!TEACH){ this.mode='mirror'; return; }
    const a=new Audio(); a.preload='metadata'; this.el=a; this.mode='loading';
    a.addEventListener('loadedmetadata',()=>{ this.mode='file'; this.dur=a.duration||0; this.paint(); });
    a.addEventListener('timeupdate',()=>{ this.t=a.currentTime; this.paint(); });
    a.addEventListener('ended',()=>{ this.playing=false; this.paint(); });
    a.addEventListener('error',()=>{ if(this.mode==='loading'){ this.toTTS(); } });
    if(CFG.AUDIO) a.src=CFG.AUDIO; else this.toTTS();
    setTimeout(()=>{ if(this.mode==='loading') this.toTTS(); },3000);
  },
  toTTS(){
    if('speechSynthesis' in window){ this.mode='tts'; this.voice=this.pickVoice(); this.dur=this.durTTS;
      if(!this.voice) speechSynthesis.onvoiceschanged=()=>{ this.voice=this.pickVoice(); this.paint(); };
      setTimeout(()=>{ if(!this.voice){ this.voice=this.pickVoice(); if(!this.voice && !(speechSynthesis.getVoices()||[]).length) this.mode='none'; } this.paint(); },1500);
    } else this.mode='none';
    this.paint();
  },
  speak(i){
    if(i>=SCRIPT.length){ this.playing=false; this.idx=SCRIPT.length; this.t=this.dur; this.stopTick(); this.paint(); return; }
    this.idx=i; const u=new SpeechSynthesisUtterance(SCRIPT[i].replace('…',', ')); u.lang='en-GB'; if(this.voice) u.voice=this.voice;
    u.rate=Math.min(1.6, 1.02*this.rate); u.pitch=1.08; u.volume=this.vol;
    u.onend=()=>{ if(!this.playing || this.idx!==i) return; setTimeout(()=>{ if(this.playing && this.idx===i) this.speak(i+1); }, 320/this.rate); };
    u.onerror=()=>{};
    this.t0=performance.now(); speechSynthesis.cancel(); speechSynthesis.speak(u); this.startTick();
  },
  startTick(){ this.stopTick(); this.tick=setInterval(()=>{ const base=this.cum[this.idx]||0, nx=this.cum[this.idx+1]||this.dur; this.t=Math.min(nx, base+(performance.now()-this.t0)/1000*this.rate); this.paint(); },200); },
  stopTick(){ clearInterval(this.tick); this.tick=null; },
  cmd(a, arg){
    if(a==='speed'){ this.rate=+arg; if(this.el && this.mode==='file') this.el.playbackRate=this.rate; if(this.mode==='tts' && this.playing){ this.speak(this.idx); } this.paint(); return; }
    if(a==='vol'){ this.vol=+arg; if(this.el) this.el.volume=this.vol; this.paint(); return; }
    if(this.mode==='file'){ const e=this.el;
      if(a==='play'){ if(e.paused){ if(e.ended) e.currentTime=0; e.play().then(()=>{ this.playing=true; this.paint(); }).catch(()=>toast('Press Play again')); } else { e.pause(); this.playing=false; } }
      if(a==='replay'){ e.currentTime=0; e.play().catch(()=>{}); this.playing=true; }
      if(a==='seek'){ e.currentTime=(arg||0)*(e.duration||0); }
      this.paint(); return; }
    if(this.mode==='tts'){
      if(a==='play'){ if(this.playing){ this.playing=false; speechSynthesis.cancel(); this.stopTick(); this.t=this.cum[this.idx]||0; } else { this.playing=true; this.speak(this.idx>=SCRIPT.length?0:this.idx); } }
      if(a==='replay'){ this.playing=true; this.speak(0); }
      if(a==='seek'){ const tt=(arg||0)*this.dur; let i=this.cum.findIndex((c,k)=>k<SCRIPT.length && tt<this.cum[k+1]); if(i<0) i=0; this.idx=i; this.t=this.cum[i]; if(this.playing) this.speak(i); }
      this.paint(); return; }
    if(a==='play') toast('No audio file and no browser voice — open the Teacher Script and read it aloud.');
  },
  upload(f){ if(!f) return; if(this.mode==='tts'){ speechSynthesis.cancel(); this.stopTick(); } this.playing=false; this.upl=URL.createObjectURL(f); this.mode='loading'; this.el.src=this.upl; this.el.load(); toast('Audio file loaded: '+f.name); },
  frac(){ const d=this.mode==='mirror'?(this.remote?this.remote.d:1):(this.dur||1); const t=this.mode==='mirror'?(this.remote?this.remote.t:0):this.t; return clamp(t/(d||1),0,1); },
  curIdx(){ if(this.mode==='file'){ const f=this.frac(); return Math.min(SCRIPT.length-1, Math.floor(f*SCRIPT.length)); } if(this.mode==='mirror') return this.remote?this.remote.i:0; return Math.min(this.idx, SCRIPT.length-1); },
  build(){
    if(this.wrap) return this.wrap; this.init();
    const w=document.createElement('div'); w.className='player'; this.wrap=w;
    w.innerHTML=`<div class="row"><span style="font-size:1.6rem">🎙️</span><div class="grow"><b class="dsp" style="font-size:1.15rem">The host’s message</b><div class="small" data-a="src"></div></div><span class="badge" data-a="state">READY</span></div>
      <div class="wave" aria-hidden="true">${Array.from({length:48},(_,i)=>`<i style="height:${18+Math.round(Math.abs(Math.sin(i*1.7)+Math.sin(i*.6))*38)}%;animation-delay:${(i*.07)%1}s"></i>`).join('')}</div>
      <div class="seek" data-a="seek" role="slider" aria-label="Progress" tabindex="0"><i></i></div>
      <div class="row small mt" style="justify-content:space-between"><span data-a="cur">0:00</span><span data-a="dur">0:00</span></div>
      <div class="pbtns mt ctl"><button class="btn pri" data-a="play">▶ Play</button><button class="btn sm ghost" data-a="replay" title="Replay from the start">↺ Replay</button>
        <label class="small row" style="gap:.3rem">🔊 <input type="range" min="0" max="1" step=".05" value="1" data-a="vol" aria-label="Volume" style="width:5.5rem"></label>
        <label class="small row" style="gap:.3rem">Speed <select class="sp" data-a="speed" aria-label="Playback speed"><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label>
        <span class="grow"></span><button class="btn sm ghost tonly" data-a="upl" title="Use your own recording">⬆ Audio file</button><input type="file" accept="audio/*" class="hidden" data-a="file"></div>
      <div class="small mt tonly" data-a="note"></div>`;
    $$('[data-a]',w).forEach(b=>{ const a=b.dataset.a;
      if(a==='play'||a==='replay') b.onclick=()=>this.cmd(a);
      if(a==='vol') b.oninput=()=>this.cmd('vol',b.value);
      if(a==='speed') b.onchange=()=>this.cmd('speed',b.value);
      if(a==='upl') b.onclick=()=>$('[data-a="file"]',w).click();
      if(a==='file') b.onchange=()=>this.upload(b.files[0]);
      if(a==='seek'){ b.onclick=e=>{ if(!TEACH) return; const r=b.getBoundingClientRect(); this.cmd('seek',(e.clientX-r.left)/r.width); };
        b.onkeydown=e=>{ if(!TEACH) return; if(e.key==='ArrowRight'){ e.stopPropagation(); this.cmd('seek',this.frac()+.1); } if(e.key==='ArrowLeft'){ e.stopPropagation(); this.cmd('seek',this.frac()-.1); } }; }
    });
    this.paint(); return w;
  },
  paint(){
    const w=this.wrap; if(!w) return;
    const playing = this.mode==='mirror' ? !!(this.remote&&this.remote.p) : this.playing;
    w.classList.toggle('playing', playing);
    const f=this.frac(), d=this.mode==='mirror'?(this.remote?this.remote.d:0):this.dur;
    $('.seek i',w).style.width=(f*100)+'%';
    const bars=$$('.wave i',w); bars.forEach((b,i)=>b.classList.toggle('pl', i/bars.length<=f && f>0));
    $('[data-a="cur"]',w).textContent=mmss(f*d); $('[data-a="dur"]',w).textContent=mmss(d);
    const p=$('[data-a="play"]',w); if(p) p.textContent=playing?'⏸ Pause':(f>0&&f<1?'▶ Resume':'▶ Play');
    $('[data-a="state"]',w).textContent = playing?'● ON AIR':(f>=1?'FINISHED':'READY');
    const src={file:'🎧 Audio file', tts:'🗣 Browser voice (Text-to-Speech)'+(this.voice?' · '+this.voice.name:''), none:'⚠ No audio available', loading:'Loading…', mirror:'Listen carefully!', '?':''}[this.mode]||'';
    $('[data-a="src"]',w).textContent=src;
    const note=$('[data-a="note"]',w); if(note) note.innerHTML = this.mode==='tts' ? `No file at <b>${esc(CFG.AUDIO||'audio/…')}</b> — the browser reads the script. For a real host voice add the MP3 (same name) or click ⬆ Audio file. Zoom: Share sound.` : this.mode==='none' ? `This browser has no English voice. <button class="btn xs" data-sheetscript>📜 Open Teacher Script</button> and read it aloud, or ⬆ upload an audio file.` : this.mode==='file' ? 'Zoom: tick “Share sound”. The audience window shows the player without sound.' : '';
    const ss=$('[data-sheetscript]',w); if(ss) ss.onclick=()=>{ S.rv.trans=true; commit(); };
    const tp=$('#transBox'); if(tp){ const ci=this.curIdx(); $$('p',tp).forEach((x,i)=>x.classList.toggle('now', playing && i===ci)); }
    if(TEACH){ const nowT=performance.now(); if(!this._pt || nowT-this._pt>400){ this._pt=nowT; postScreen({t:'aud', s:{t:f*d, d, p:playing, i:this.curIdx()}}); } }
  }
};

/* ---------- 10 · cheat sheets (synced to the audience window) ---------- */
const VROWS = [...VOCAB.map(v=>({k:'v', w:v.w, en:v.en, ua:v.ua, ex:v.ex, id:v.id})), ...GRAM.map(g=>({k:'g', w:g.n, from:g.w, en:g.en, ua:g.ua, ex:g.ex}))];
function openSheet(kind){ S.sheet = S.sheet===kind ? null : kind; if(kind==='vocab') S.so.pick=-1; commit(); }
function sheetRows(){ const o=S.so, q=nameKey(o.q);
  return VROWS.map((r,i)=>({r,i})).filter(({r})=> (o.f==='all' || (o.f==='v'&&r.k==='v') || (o.f==='g'&&r.k==='g')) && (!q || nameKey(r.w+' '+(r.from||'')+' '+r.en+' '+r.ua+' '+r.ex).includes(q))); }
function vtBody(){ const o=S.so;
  const rows=sheetRows();
  return `<table class="vt"><thead><tr><th>Word / Expression</th>${o.def?'<th>Simple English Definition</th>':''}${o.ua?'<th>Ukrainian</th>':''}${o.ex?'<th>Example</th>':''}</tr></thead><tbody>${rows.map(({r,i})=>`<tr class="${r.k==='g'?'g':''} ${o.pick===i?'pickd':''}" data-row="${i}"><td>${esc(r.w)}${r.from?`<div class="small">← ${esc(r.from)}</div>`:''}</td>${o.def?`<td>${esc(r.en)}</td>`:''}${o.ua?`<td class="ua">${esc(r.ua)}</td>`:''}${o.ex?`<td><i>${r.k==='v'?hl(r.ex,[r.id]):nzHL(r.ex)}</i></td>`:''}</tr>`).join('') || `<tr><td colspan="4" class="small">No matches.</td></tr>`}</tbody></table>`;
}
function gramSheetBody(){ const t=S.so.gt;
  const tabs=[['vn','Verb → Noun'],['an','Adjective → Noun'],['end','Common Endings'],['all','Full word bank']];
  let b='';
  if(t==='vn') b=`<div class="gcols">${GRAM.concat(GRAM_X).filter(g=>g.t==='verb').map(g=>`<div class="gcol"><div>${esc(g.w)} <span class="gold">→</span> ${esc(g.n)}</div><div class="small">${esc(g.ua)}</div></div>`).join('')}</div>`;
  if(t==='an') b=`<div class="gcols">${GRAM.concat(GRAM_X).filter(g=>g.t==='adj').map(g=>`<div class="gcol"><div>${esc(g.w)} <span class="gold">→</span> ${esc(g.n)}</div><div class="small">${esc(g.ua)}</div></div>`).join('')}</div>`;
  if(t==='end') b=`<table class="tbl">${ENDINGS.map(([e,x])=>`<tr><td>${esc(e)}</td><td>${esc(x)}</td></tr>`).join('')}</table><div class="hint">⚠️ These endings help us recognise nouns, but they are not rules that work for every word. Sometimes the spelling changes: decide → deci<b>sion</b>, recognise → recogni<b>tion</b>, achieve → achieve<b>ment</b>.</div>`;
  if(t==='all') b=`<table class="tbl"><tr><th>Original word</th><th>Noun</th><th>Ukrainian</th><th>Example</th></tr>${GRAM.map(g=>`<tr><td>${esc(g.w)}</td><td><b>${esc(g.n)}</b></td><td class="ua">${esc(g.ua)}</td><td><i>${nzHL(g.ex)}</i></td></tr>`).join('')}${GRAM_X.map(g=>`<tr><td>${esc(g.w)}</td><td><b>${esc(g.n)}</b></td><td class="ua">${esc(g.ua)}</td><td></td></tr>`).join('')}</table>`;
  return `<div class="rule"><div class="rt">NOMINALISATION</div><div class="lead mt" style="font-size:1.15rem">We turn a <b>verb</b> or an <b>adjective</b> into a <b>noun</b>. It helps us talk about actions, qualities and ideas as nouns.</div><div class="tr">Номіналізація — перетворення дієслова або прикметника на іменник, щоб говорити про дії та якості як про ідеї.</div>
    <div class="small mt">Used in presentations, articles, reports and professional comments. In everyday chat, verbs and adjectives often sound simpler and more natural: “He decided to join” is fine!</div></div>

}

{ id:'talents', ep:1, title:'Meet the contestants', k:'Profiles · performance · vote', scene:'stage', dim:true,
  render(){ vocabAssign(); const ci=clamp(S.ci,0,4), c=CONTESTANTS[ci], ph=cph(ci), cid='c:'+c.id, nw=fresh('ci',ci*10+ph+1);
    const nav=`<div class="cnav">${CONTESTANTS.map((x,i)=>`<${TEACH?'button':'span'} class="${i===ci?'cur':''} ${voteCount('c:'+x.id)?'dn':''}" ${TEACH?`data-ci="${i}"`:''}>${av(x.id,24)}${esc(x.name)}${voteCount('c:'+x.id)?' ✓':''}</${TEACH?'button':'span'}>`).join('')}</div>`;

      <button class="btn sm ghost tonly" data-cdone>${c.words.every(w=>(S.vas[vslot(ci,w)]||{}).done)?'↺ Undo completed':'✓ Mark as Completed'}</button><span class="grow"></span>

            ${S.rv['h:'+k]?`<div class="hint new">💡 Example: <i>${hl(V.ex,[w])}</i></div>`:''}

    if(ph===1) right=`<div class="col fill"><div class="row"><span class="kick">🎭 The performance</span><span class="grow"></span>${phase}</div>${perfVisual(c)}

    if(ph===2) right=`<div class="glass card fill scroll"><div class="row"><b class="dsp" style="font-size:1.3rem">${esc(c.emoji)} ${esc(c.stage)}</b><span class="grow"></span>${phase}</div><div class="mt">${voteBox(cid)}</div>${btns}</div>`;
    return `${epHead(this, nav)}<div class="ccard ${nw?'enter':''}">${cpic(c)}${right}</div>`; },
  after(v){
    $$('[data-ci]',v).forEach(b=>b.onclick=()=>{ S.ci=+b.dataset.ci; commit(); });
    $$('[data-ph]',v).forEach(b=>b.onclick=()=>this.setPh(+b.dataset.ph));
    $$('[data-cn]',v).forEach(b=>b.onclick=()=>{ const d=+b.dataset.cn; if(d>0 && S.vopen['c:'+ccur().id]) closeVote('c:'+ccur().id); S.ci=clamp(S.ci+d,0,4); if(d>0) SFX.play('whoosh'); commit(); });
    const cd2=$('[data-cdone]',v); if(cd2) cd2.onclick=()=>{ const ci=S.ci, c=CONTESTANTS[ci], all=c.words.every(w=>(S.vas[vslot(ci,w)]||{}).done); c.words.forEach(w=>{ const j=vslot(ci,w); if(all) vasToggle(j); else vasDone(j); }); commit(); };
    $$('[data-vas]',v).forEach(b=>{ b.onclick=()=>{ const j=+b.dataset.vas, a=S.vas[j], A=avail(); if(!a||!A.length) return; const i=A.findIndex(s=>s.id===a.sid); a.sid=A[(i+1)%A.length].id; commit(); }; b.ondblclick=()=>{ vasToggle(+b.dataset.vas); commit(); }; });
    const rt=$('[data-rubyt]',v); if(rt && !S.noanim){ let t=0; const iv=setInterval(()=>{ if(!document.body.contains(rt)) return clearInterval(iv); t=Math.min(47,t+1); rt.textContent='00:'+String(t).padStart(2,'0'); if(t>=47) clearInterval(iv); },90); } else if(rt) rt.textContent='00:47';

    return {kind:'rate', id:cid, name:c.name, sub:c.stage, open:!!S.vopen[cid], gbUsed:Object.values(S.gb).map(x=>nameKey(x.n))}; },

    how:['① Profile: the 🎙 student(s) read the profile and explain the two highlighted expressions in their own words → 👁 Reveal Answer (R reveals the next one).','② Performance (Next ▶): picture / animation / optional video + short description.','③ Vote (Next ▶ opens voting): EVERY student rates 1–5 ★ for Creativity, Entertainment, Pointlessness.','Screen Share Mode: click a judge’s name, set the stars (they say them or send them privately in the Zoom chat) → Submit My Scores. The audience window never shows the stars being entered.','Live Mode: phones vote by themselves; Open/Close Voting controls them.','Next ▶ closes voting and brings the next contestant. 🟡 Golden Buzzer — once per judge for the whole show.'],
    key: CONTESTANTS.flatMap(c=>c.words.map(w=>`${c.name}: ${VB[w].short} — ${c.ans[w][0]} (${c.ans[w][1]})`)),

    diff:'Students may say a score instead of explaining. Insist on the explanation first, voting comes after the performance. Results stay hidden until you reveal them.',

    ua:'5 конкурсантів: профіль (учень пояснює 2 вирази) → виступ → голосування всіх. У режимі показу екрана оцінки вводить учитель: клік по імені → зірки → Submit.'}

{ id:'rule', ep:2, title:'Reveal the grammar', k:'Nominalisation', scene:'production', dim:true,
  render(){ const open=!!S.rv.rule, tab=S.rv.rtab||'vn';
    if(!open) return `${epHead(this)}<div class="solo" style="align-items:center;text-align:center"><div style="font-size:3.5rem">🔐</div><h2 class="h-l mt">What do we call this?</h2><button class="btn pri big mt2 ctl" data-rv="rule">🔓 Reveal Grammar</button></div>`;

      <div class="col fill scroll"><div class="rule new"><div class="rt">NOMINALISATION</div><div class="lead mt">We turn a <b>verb</b> or an <b>adjective</b> into a <b>noun</b>.</div><div class="small mt">It helps us talk about actions, qualities and ideas as nouns.</div><div class="tr">Номіналізація: дієслово або прикметник стає іменником.</div></div>
        <div class="gcols"><div class="gcol"><h5>Verb → Noun</h5>${['decide','improve','perform'].map(w=>{ const g=GRAM.find(x=>x.w===w); return `<div>${g.w} <span class="gold">→</span> ${g.n}</div>`; }).join('')}</div>
          <div class="gcol"><h5>Adjective → Noun</h5>${['creative','confident','popular'].map(w=>{ const g=GRAM.find(x=>x.w===w); return `<div>${g.w} <span class="gold">→</span> ${g.n}</div>`; }).join('')}</div></div>
        <div class="glass card" style="padding:.7rem 1rem"><div class="kick">Why do we use it?</div><ul style="margin:.3rem 0 0;padding-left:1.1rem;font-weight:600">${WHY.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><div class="small mt">⚠️ Not always better! In everyday chat, verbs and adjectives often sound simpler and more natural.</div><div class="tr">${esc(WHY_UA)} Але в звичайній розмові дієслова й прикметники часто звучать природніше.</div></div></div>
      <div class="col fill scroll"><div class="glass card" style="padding:.8rem 1rem"><div class="tabs2">${[['vn','Verb → Noun'],['an','Adjective → Noun'],['end','Common Endings']].map(([k,l])=>`<button class="btn xs ${tab===k?'on':''}" data-rtab="${k}">${l}</button>`).join('')}</div>
          <div class="mt">${tab==='end'?`<table class="tbl">${ENDINGS.map(([e,x])=>`<tr><td>${esc(e)}</td><td>${esc(x)}</td></tr>`).join('')}</table><div class="small mt">These endings help us recognise nouns, but they are not rules that work for every word. Sometimes the spelling changes.</div>`
            : `<div class="chips">${GRAM.concat(GRAM_X).filter(g=>g.t===(tab==='vn'?'verb':'adj')).map(g=>`<span class="chip">${esc(g.w)} → <b class="gold">${esc(g.n)}</b></span>`).join('')}</div>`}</div></div>
        <div class="glass card" style="padding:.8rem 1rem"><div class="kick">Quick CCQs</div>${CCQS.map((c,i)=>`<div class="mt"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="grow" style="font-weight:700">${esc(c.q)}</span>${S.rv['cc'+i]?'':`<button class="btn xs ctl" data-rv="cc${i}">👁</button>`}</div>${S.rv['cc'+i]?`<div class="new" style="color:var(--ok);font-weight:800">→ ${esc(c.a)}</div>`:''}</div>`).join('')}</div>
        ${S.rv.prodEnd?msgHTML({who:'prod', t:PROD_END},{nw:true}):`<div class="row ctl"><button class="btn sm" data-rv="prodEnd">🎬 Producer: next line</button></div>`}</div></div>`; },
  after(v){ $$('[data-rtab]',v).forEach(b=>b.onclick=()=>{ S.rv.rtab=b.dataset.rtab; commit(); }); },
  adv(){ if(!S.rv.rule){ S.rv.rule=1; SFX.play('notify'); return true; } for(let i=0;i<CCQS.length;i++) if(!S.rv['cc'+i]){ S.rv['cc'+i]=1; return true; } if(!S.rv.prodEnd){ S.rv.prodEnd=1; return true; } return false; },

  hide(){ for(let i=0;i<CCQS.length;i++) S.rv['cc'+i]=0; return true; },
  live(){ return {kind:'msg', e:'🔤', t:'NOMINALISATION — we turn a verb or an adjective into a noun: decide → decision, creative → creativity.'}; },

    ccq: CCQS.map(c=>[c.q, c.a]), diff:'Students may think every word takes -tion. Show the Common Endings tab: endings help, but they are not rules.',
    cut:'Skip the tabs; ask 2 CCQs.', ua:'Коротке правило, приклади, CCQ (Next ▶ відкриває відповіді). Наголос: номіналізація не завжди потрібна.'}
},

/* ═════ SCENE 04 — UPGRADE THE TALENT PROFILES ═════ */
{ id:'edit', ep:3, title:'Profile Editor', k:'Grammar practice', scene:'production', dim:true, blockId:'gp',
  render(){ const b=blk('gp', reqN(1,GTASKS.length), GTASKS.length), j=b.T.i, t=GTASKS[j], c=CB[t.who], shown=!!S.rv['gp'+j], pick=S.rv['gk'+j];

    const req=GTASKS.slice(0,b.req), allDone=b.T.a.slice(0,b.req).every(x=>x&&x.done);
    return `${epHead(this, `<span class="chip">✏️ Task ${j+1} of ${b.total}${j>=b.req?' · reserve':''}</span>`)}<div class="duo">
      <div class="glass qcard fill scroll"><div class="task" style="margin:auto 0">${tbar('gp',b.total,b.req,b.max)}
        <div class="row"><span class="ttype">${esc(t.type)}</span><span class="grow"></span><span class="row small" style="gap:.4rem">${av(t.who,30)}<span>for <b style="color:var(--tx)">${esc(c.name)}’s</b> profile</span></span></div>
        ${body}${t.wrong?'':(t.type==='Transform the Sentence'?'<div class="instr mt">🗣 Say the new sentence aloud.</div>':'')}${opts}
        ${S.rv['gh'+j]&&!shown?`<div class="hint new">💡 ${esc(t.hint)}</div>`:''}
        ${shown?`<div class="ans new">✅ ${nzHL(t.full)}<div class="small mt" style="color:#D8FFF0">${esc(t.ex)}</div>${t.alt?`<div class="small mt">Also correct: ${t.alt.map(esc).join(' · ')}</div>`:''}</div>`:''}
        <div class="row mt ctl"><button class="btn xs ghost" data-rv="gh${j}">💡 Hint</button><button class="btn xs ${shown?'on':''}" data-rv="gp${j}">👁 ${shown?'Hide':'Reveal'} Answer</button><span class="small">Answer aloud — no typing needed.</span></div>
        ${allDone?`<div class="mt new">${msgHTML({who:'prod', t:PROD_END2})}</div>`:''}</div></div>
      <div class="col fill">${cpic(c,true)}<div class="glass card" style="padding:.7rem 1rem"><div class="kick">🎩 Professional profile</div><p class="mt" style="font-weight:700;font-size:1.05rem">${shown?nzHL(t.full):'<span class="small">Waiting for your upgrade…</span>'}</p>${shown?'<span class="badge ok new">✓ Profile updated</span>':''}</div></div></div>`; },
  after(v){ $$('[data-gk]',v).forEach(b=>b.onclick=()=>{ const [j,o]=b.dataset.gk.split('|'); S.rv['gk'+j]= S.rv['gk'+j]===o ? null : o; commit(); });
    $$('[data-gm]',v).forEach(b=>b.onclick=()=>{ const j=b.dataset.gm; S.rv['gm'+j]=!S.rv['gm'+j]; commit(); }); },
  adv(){ return blkAdv('gp', blk('gp', reqN(1,GTASKS.length), GTASKS.length)); }, ret(){ return blkRet('gp'); },
  reveal(){ const j=tbGet('gp').i; if(S.rv['gp'+j]) return false; S.rv['gp'+j]=1; return true; },
  hide(){ const j=tbGet('gp').i; S.rv['gp'+j]=0; return true; },
  hint(){ const j=tbGet('gp').i; S.rv['gh'+j]=!S.rv['gh'+j]; return true; },
  live(){ const T=tbGet('gp'), a=T.a[T.i], t=GTASKS[T.i]; return {kind:'turn', who:a?sname(a.sid):'', prompt:t.type+': '+(t.wrong||t.task.replace('___','……'))+(t.base?' ('+t.base+')':''), block:'Profile Editor', ans:S.rv['gp'+T.i]?t.full:null}; },

    how:['The student reads the task and answers ALOUD. You may click an option on the screen (optional). 👁 Reveal (R) shows the answer + explanation.','Accept any grammatically correct alternative for Transform (see “Also correct”).'],

    cut:'Required = number of students; never force reserve tasks.', ua:'Кожен учень — одне завдання (5 типів). Відповідь усно, відповідь відкриває вчитель. Завдання 6–10 — резерв.'}
