/* wheel geometry: segment k covers canvas angles [r−π/2 + k·seg, … + seg); the pointer is at the top (−π/2).

function confirmRestartScene(){

    <div class="row mt2"><button class="btn coral" id="rcYes">↺ Restart this scene</button><button class="btn ghost" data-close>Cancel</button></div>`);

    if(e===0){ S.applied=0; S.statsDone=false; ['rd:cmt','rd:d1','rd:d2','warm'].forEach(k=>delete S.tb[k]); }
    if(e===1){ S.pass=false; S.ci=0; S.cph={}; delete S.tb['rd:host']; }
    if(e===2){ ['dhl','morph','rule','prodEnd','rtab'].forEach(k=>delete S.rv[k]); ['rd:prod','gd'].forEach(k=>delete S.tb[k]); }
    if(e===3){ delete S.tb.gp; } if(e===4){ delete S.tb.spk; } if(e===5){ ['pred','lq','rd:after'].forEach(k=>delete S.tb[k]); }
    if(e===6){ TM.rst('bo',180); } if(e===7){ S.show={ti:0, ph:0, perf:0}; TM.rst('perf',60); }

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!TEACH || typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
  if(S.sheet && e.key==='Escape'){ S.sheet=null; commit(); return; }
  if(S.gbShow && e.key==='Escape'){ S.gbShow=null; commit(); return; }
  if(LOBBY) return;
  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r'||k==='R') act('reveal');
  else if(k==='h'||k==='H') act('hide');
  else if(k==='i'||k==='I') act('hint');
  else if(k==='d'||k==='D'){ const s=cur(); if(s.id==='talents'){ const ci=S.ci; CONTESTANTS[ci].words.forEach(w=>vasToggle(vslot(ci,w))); commit(); } else if(s.blockId){ tbToggle(s.blockId,tbGet(s.blockId).i); commit(); } }
  else if(k==='u'||k==='U'){ S.tr=!S.tr; commit(); }
  else if(k==='v'||k==='V') openSheet('vocab');
  else if(k==='n'||k==='N') openSheet('grammar');
  else if(k==='l'||k==='L') showBoard();
  else if(k==='m'||k==='M') toggleSound();
  else if(k==='f'||k==='F') toggleFocus();
  else if(k==='t'||k==='T') toggleDash();
  else if(k==='c'||k==='C'){ S.dtab='class'; S.dash=true; S.focus=false; save(); draw(); }
  else if(k==='g'||k==='G') goId('gz');
  else if(k==='Escape'){ if(S.dash){ S.dash=false; save(); draw(); } }
});

/* ---------- 16 · live room (optional) ----------
   Учитель — єдине джерело стану. Захист (як у попередніх уроках):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом: короткого коду кімнати недостатньо, щоб керувати уроком;
   • учні надсилають тільки hello / rate / gb / ready / resp / react; учитель перевіряє кожне
     (поточне завдання, відкрите голосування, межі 1–5, своя команда, один Golden Buzzer, довжина тексту);
   • лише нікнейм, жодних акаунтів і особистих даних; лише Realtime broadcast + presence (без таблиць, без service-role ключа);
   • повторне підключення: телефон пам’ятає свій id (sessionStorage), учитель щосекунди-шість повторно надсилає стан;
   • без Supabase — чесний статус «Live Mode Setup Required» (локальна демо лише у вкладках цього браузера) або Screen Share Mode. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','🤹'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson32-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson32-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l32sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l32sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {auth:{persistSession:false}});
        this.ch = this.sb.channel('lesson32-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson32-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const n=Date.now(); let ch=false; for(const k in this.peers) if(n-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
const STATUS_TXT = {live:'Live Mode Connected', local:'Live Mode Setup Required — local demo (this browser only)', reconnecting:'Reconnecting…', connecting:'Connecting…', off:'Offline'};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));
  if(TKEY.ok){ try{ const sig=await TKEY.sign(body); Net.send({t:'sig', body, sig, pk:TKEY.pub}); return; }catch(e){ console.warn(e); } }
  Net.send({t:'raw', body});
}
function curTask(){ if(LOBBY || !S.started) return {kind:'msg', e:'🤹', t:'The Most Pointless Talent Show is about to start…'}; try{ const s=cur(); return s.live?s.live():null; }catch(e){ return null; } }
let pubT=null;
function pub(){
  if(TEACH) pushScreen();
  if(!LIVE.on || !TEACH) return;
  clearTimeout(pubT); pubT=setTimeout(()=>{ const s=cur(), E=EPISODES[s.ep];
    sendSigned({t:'state', ep:s.ep, epn:(E.extra?'':'Scene '+E.no+' · ')+E.name, step:s.title, task:curTask(), timer:{left:Math.ceil(TM.left('bo')), run:TM.on('bo')}}); paintDock(); },120);
}
setInterval(()=>{ if(LIVE.on && TEACH) pub(); },6000);
let redrawT=null;
function softRedraw(){ clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(!typing()) draw(); else paintDock(); },250); }
/* phone → student: match by nickname; if no match, the phone is its own judge ('p:…') */
function phoneJuror(from){ const s=S.students.find(x=>nameKey(x.name)===nameKey(from.name)); return s ? {jk:s.id, n:s.name} : {jk:'p:'+String(from.id).slice(0,16), n:String(from.name||'?').slice(0,24)}; }
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || m.from.role!=='student') return;
  const task=curTask();
  if(m.t==='hello'){ pub(); paintDock(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='rate' && task && task.kind==='rate' && m.id===task.id){
    if(!S.vopen[task.id]) return;
    const b={c:+m.c, e:+m.e, p:+m.p}; if(!full(b)) return;
    const J=phoneJuror(m.from); if(isTeam(task.id) && (task.own||[]).some(n=>nameKey(n)===nameKey(J.n))) return;
    if(submitBallot(task.id, J.jk, b, 'p', J.n)){ save(); softRedraw(); } return; }
  if(m.t==='gb' && task && task.kind==='rate' && m.id===task.id){
    const J=phoneJuror(m.from); if(S.gb[J.jk]) return; if(isTeam(task.id) && (task.own||[]).some(n=>nameKey(n)===nameKey(J.n))) return;
    gbPress(J.jk, task.id, J.n); return; }
  if(m.t==='ready' && task && task.kind==='group'){ const g=groups().find(x=>x.id===m.team); if(!g) return; if(!g.m.some(sid=>nameKey(sname(sid))===nameKey(m.from.name))) return; tinfo(g.id).ready=!!m.v; save(); softRedraw(); return; }
  if(m.t==='resp' && task){ const rid = task.kind==='resp' ? task.id : task.kind==='group' ? task.resp : null; if(!rid || m.id!==rid) return;
    const t=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,120); if(!t) return;
    (S.resp[rid]=S.resp[rid]||{})[id]={n:(AVATARS.includes(m.from.av)?m.from.av+' ':'')+String(m.from.name||'?').slice(0,24), t}; save(); softRedraw(); return; }
}
function floatEmoji(e){ if(!/^[\p{Extended_Pictographic}‍️]{1,8}$/u.test(e||'')) return; const s=document.createElement('span'); s.textContent=e; s.style.left=Math.random()*40+'px'; $('#reacts').appendChild(s); setTimeout(()=>s.remove(),3100); }
function paintDock(){
  const d=$('#dock'); if(!d) return; d.classList.toggle('on',LIVE.on && TEACH); if(!LIVE.on || !TEACH) return;
  const st=Net.status;
  $('#dockTitle').textContent='Room '+S.room; $('#dockLed').className='led '+(st==='live'?'on':st==='off'?'bad':'');

  if(!task) h+=`<div class="small mt">Phones show “look at the main screen”.</div>`;
  else if(task.kind==='rate'){ const B=Object.values(S.ballots[task.id]||{}).filter(full); h+=`<div class="small mt">⭐ ${esc(task.name)} · voting ${S.vopen[task.id]?'<b style="color:var(--ok)">OPEN</b>':'closed'} · <b>${B.length}</b> ballots (${B.filter(b=>b.src==='p').length} from phones)</div>`; }
  else if(task.kind==='group'){ h+=`<div class="small mt">Teams ready: ${groups().filter(g=>tinfo(g.id).ready).length} / ${groups().length}</div>`; }
  else if(task.kind==='resp'){ const R=Object.values(S.resp[task.id]||{}); h+=`<div class="small mt"><b>${R.length}</b> answers</div>`+R.slice(-6).map(r=>`<div class="small">• <b>${esc(r.n)}</b>: ${esc(r.t)}</div>`).join(''); }
  else if(task.kind==='turn'){ h+=`<div class="small mt">Phones show: <b>${esc(task.who)}</b>’s turn.</div>`; }
  else h+=`<div class="small mt">Phones show: “${esc(task.t||'')}”</div>`;

}
const baseURL = ()=> location.href.split('?')[0].split('#')[0];
const joinURL = ()=> baseURL()+'?room='+S.room+(TKEY.fp?'&k='+TKEY.fp:'')+'&role=student';
async function startLive(silent){
  const signed=await TKEY.init();
  const kind=await Net.connect({room:S.room, id:S.tid, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save(); pub(); if(!LOBBY) draw();
  if(!silent) toast(!signed?'Live room open — but this page can’t sign messages (needs https)':kind==='supabase'?'Live Mode Connected — share the link, QR or code':kind==='local'?'Live Mode Setup Required: Supabase not reachable — local demo only':'Offline — the live room could not start');
  return kind;
}
function stopLive(){ sendSigned({t:'end'}); setTimeout(()=>Net.stop(),300); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); paintDock(); if(!LOBBY) draw(); }
function liveStatus(){
  if(!LIVE.on) return '<b>Local Mode</b> — the whole lesson works on your shared screen, no phones needed';
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● Live Mode Connected (Supabase Realtime)</span>' : Net.status==='local' ? '<span style="color:var(--amb)">● Live Mode Setup Required — only tabs in THIS browser can join (Supabase not configured or not reachable)</span>' : `<span style="color:var(--amb)">● ${esc(STATUS_TXT[Net.status]||Net.status)}</span>`;

}
async function openLive(){

   <p class="small mt">Optional. Students join on their own phone with a nickname — no accounts. Phones show the current task, let students rate talents (⭐ 1–5), use their one Golden Buzzer, mark their team ready, send short answers and react. Phones never see Teacher Notes or hidden answers. Tip: ask students to use the SAME names as in your class list, so phone votes replace your manual entries instead of adding a second ballot.</p>
   <div class="row mt2" style="align-items:center;gap:1.4rem"><div class="grow"><div class="small">Room code</div><div class="dsp" style="font-size:4rem;line-height:1">${S.room}</div>
     <div class="small mt">Teacher key <b style="font-size:1.3rem;color:var(--gold);letter-spacing:.12em">${shortKey()||'—'}</b> (only for students who type the code)</div>

   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn pri" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--amb)">Live Mode Setup Required: SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → only a local demo (tabs in this browser).</p>'}

/* ---------- 17 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], taskKey='', trust=null, lastTs=0, verified=false, sent={}, draft={}, gbUsed=false;
  try{ name=localStorage.getItem('l32name')||''; avatar=localStorage.getItem('l32av')||avatar;  }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':''); $('#stuConn').textContent={live:'connected', local:'local demo', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👏','😂','😮','🔥','⭐','💛'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="row" style="gap:6px">${['leo','max','sophie','noah','ruby'].map(k=>av(k,40)).join('')}</div>
      <h2 class="dsp mt" style="font-size:1.6rem">Join “The Most Pointless Talent Show” 🤹</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the teacher’s screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Nickname — use the name your teacher uses</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Anna" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">No account. No surname. No personal data.</p>
      <button class="btn pri mt" id="jn" style="width:100%">Join the show</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,24), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l32name',name); localStorage.setItem('l32av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const join=async()=>{
    try{ gbUsed=localStorage.getItem('l32gb:'+room)==='1'; }catch(e){}
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    B.innerHTML=`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">📱</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:s=>{ setConn(s); if(s==='live' && st) Net.send({t:'hello'}); }, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ const k=JSON.stringify([m.ep,m.step,m.task]); st=m; if(k!==taskKey){ taskKey=k; render(); } else paintT(); }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn pri mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    if(kind==='local') toast('Local demo — this only works inside one browser');
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st){ const w=$('.stu-wait',B); if(w) w.innerHTML=`<p>Hi ${esc(name)}! Waiting for the teacher…</p><p class="small mt">Room ${esc(room)} — are the code and teacher key right? <a href="?join">Change</a></p>`; } },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">⭐</div><h2 class="dsp mt" style="font-size:1.6rem">NOT EVERY TALENT NEEDS A PURPOSE.</h2><p class="small mt">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>String(n||'').split(' & ').some(x=>nameKey(x)===nameKey(name));
  const head=()=>`<div class="small" style="font-weight:800">${esc(st.epn||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-card stu-wait" style="text-align:center">${av('host',80)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head();
    if(!T){ B.innerHTML=hd+`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">👀</div><p class="stu-big">Look at the main screen.</p></div>`; return; }
    if(T.kind==='look'||T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">${esc(T.e||'👀')}</div><p class="stu-big mt">${esc(T.t)}</p></div>`; return; }
    if(T.kind==='turn'){ const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block||'')}</p>
        <p class="stu-big" style="margin:.4rem 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who||'…')+' is speaking'}</p>
        <p style="font-size:1.2rem;font-weight:700">${esc(T.prompt||'')}</p>${T.fu?`<p class="mt">❓ Follow-up: ${esc(T.fu)}</p>`:''}${T.ans?`<div class="ans mt">✅ ${esc(T.ans)}</div>`:''}</div>`; return; }
    if(T.kind==='rate'){ const own=(T.own||[]).some(n=>nameKey(n)===nameKey(name)), done=sent['r:'+T.id], d=draft[T.id]=draft[T.id]||(done?Object.assign({},done):{});
      const used = gbUsed || (T.gbUsed||[]).includes(nameKey(name));
      if(own){ B.innerHTML=hd+`<div class="stu-card" style="text-align:center"><div style="font-size:3rem">🎭</div><p class="stu-big">That’s YOUR team!</p><p class="small mt">You can’t vote for your own team. Enjoy the applause! 👏</p></div>`; return; }
      B.innerHTML=hd+`<div class="stu-card"><p class="small">⭐ Rate this talent</p><p class="stu-big">${esc(T.name)}</p><p class="small">${esc(T.sub||'')}</p>
        ${T.open?CRIT.map(c=>`<label>${c.e} ${c.name} <span class="small">· ${esc(c.q)}</span></label><div class="stars">${[1,2,3,4,5].map(n=>`<button type="button" class="${(d[c.k]||0)>=n?'on':''}" data-s="${c.k}|${n}" aria-label="${c.name} ${n}">★</button>`).join('')}</div>`).join('')
          +`<button class="btn pri mt" id="vs" style="width:100%" ${full(d)?'':'disabled'}>${done?'✏️ Change My Scores':'✅ Submit My Scores'}</button>${done?'<p class="small mt">✓ Vote submitted — you can change it until voting closes.</p>':''}`
          : `<p class="mt">${done?'✓ Your vote was counted.':'⏳ Voting is not open right now.'}</p>`}
        <div class="row mt2" style="justify-content:center">${used?'<span class="small">🟡 You have used your Golden Buzzer.</span>':`<button class="gbz sm" id="gbb">GOLDEN<br>BUZZER</button><span class="small" style="max-width:12rem">Once per show! Tap twice to use it for ${esc(T.name)}.</span>`}</div></div>`;
      $$('[data-s]',B).forEach(b=>b.onclick=()=>{ const [k,n]=b.dataset.s.split('|'); d[k]=+n; render(); });

      const gb=$('#gbb'); if(gb) gb.onclick=()=>{ if(!gb.classList.contains('pressed')){ gb.classList.add('pressed'); gb.innerHTML='TAP<br>AGAIN!'; setTimeout(()=>{ if(document.body.contains(gb)){ gb.classList.remove('pressed'); gb.innerHTML='GOLDEN<br>BUZZER'; } },3000); return; }
        Net.send({t:'gb', id:T.id}); gbUsed=true; try{ localStorage.setItem('l32gb:'+room,'1'); }catch(e){} render(); };
      return; }
    if(T.kind==='resp'||T.kind==='group'){ const rid=T.kind==='resp'?T.id:T.resp, my=sent['t:'+rid];

          <p class="mt small">1 Talent · 2 Stage name · 3 Development · 4 Achievement · 5 Why you should win — 2 L31 expressions + 3 nominalisations!</p>
          <button class="btn ${g.ready?'':'pri'} mt" id="rdy" style="width:100%">${g.ready?'✓ READY — tap to undo':'🙋 We’re Ready'}</button>`:(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(esc).join(', ')}</p>`).join('')}`;
        if(g) setTimeout(()=>{ const r=$('#rdy'); if(r) r.onclick=()=>{ Net.send({t:'ready', team:g.id, v:!g.ready}); g.ready=!g.ready; render(); }; },0); }

      $('#rs').onclick=()=>{ const v=$('#ra').value.trim().slice(0,120); if(!v) return; sent['t:'+rid]=v; Net.send({t:'resp', id:rid, v}); render(); }; paintT(); return; }
    B.innerHTML=hd+`<div class="stu-card"><p>Look at the main screen.</p></div>`;
  };
  if(room && (key.length>=6) && name) join(); else ask();
}
