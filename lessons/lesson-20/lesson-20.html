.casefile{position:relative; border-radius:24px; padding:26px; background:linear-gradient(160deg,#1A1F36,#0E1222); border:1px solid var(--line2); box-shadow:var(--shadow); overflow:hidden}
.casefile::after{content:"CONFIDENTIAL"; position:absolute; right:-36px; top:26px; transform:rotate(30deg); background:var(--red); color:#fff; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.2em; padding:5px 46px}
.scan{position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,transparent 0,rgba(57,216,246,.12) 50%,transparent 100%); background-size:100% 40%; background-repeat:no-repeat; animation:scan 3.6s linear infinite}
@keyframes scan{from{background-position:0 -40%} to{background-position:0 140%}}

/* mission card */
.mission{counter-reset:m; display:grid; gap:12px; margin:16px 0 0; padding:0; list-style:none}
.mission li{display:flex; gap:14px; align-items:center; font-size:20px; font-weight:700; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.mission li::before{counter-increment:m; content:counter(m); width:34px; height:34px; flex:0 0 34px; border-radius:10px; display:grid; place-items:center; background:var(--cyan); color:#04111A; font-family:var(--mono); font-weight:700}
.wsw{font-family:var(--dsp); font-size:clamp(40px,5.6vw,76px); line-height:.95; letter-spacing:-.03em}
.wsw span{color:var(--red)}

/* options */
.opts{display:grid; gap:11px}
.opt{display:flex; align-items:center; gap:14px; text-align:left; width:100%; padding:14px 16px; border-radius:16px; background:rgba(255,255,255,.05); border:1.5px solid var(--line2); font-weight:700; font-size:19px; transition:.15s; position:relative}
.opt:hover{background:rgba(255,255,255,.09)}
.opt .L{width:36px; height:36px; flex:0 0 36px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.08); font-family:var(--mono); font-size:15px; font-weight:700}
.opt .n{margin-left:auto; font-family:var(--mono); font-size:14px; color:var(--cyan); min-width:20px; text-align:right}
.opt.pick{border-color:var(--cyan); background:rgba(57,216,246,.1)}
.opt.pick .L{background:var(--cyan); color:#04111A}
.opt.right{border-color:var(--green); background:rgba(54,224,155,.14)}
.opt.right .L{background:var(--green); color:#03140C}
.opt.right::after{content:"✓"; position:absolute; right:-10px; top:-10px; width:30px; height:30px; border-radius:50%; background:var(--green); color:#03140C; display:grid; place-items:center; font-weight:900; font-size:16px}
.opt.wrongpick{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.opt.dim{opacity:.42}
.opt.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opts.chips{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.chips .opt{justify-content:center; font-size:20px}

.explain{margin-top:16px; padding:16px 18px; border-radius:16px; background:rgba(54,224,155,.09); border:1px solid rgba(54,224,155,.4)}
.explain .k{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--green)}
.explain .a{font-family:var(--dsp); font-size:28px; margin:2px 0 4px}
.explain p{margin:0; font-size:18px}
.explain .ex{margin-top:8px; font-size:17px; color:#D6DAF0}
.explain .ex b{color:#fff}
.stamp{animation:stampIn .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stampIn{from{opacity:0; transform:scale(1.25) rotate(-2deg)} to{opacity:1; transform:none}}

.cdots{display:flex; gap:6px; flex-wrap:wrap}
.cdots button{min-width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid var(--line); font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted)}
.cdots button.done{background:rgba(54,224,155,.15); border-color:rgba(54,224,155,.5); color:var(--green)}
.cdots button.cur{background:var(--cyan); color:#04111A; border-color:var(--cyan)}
.deckbar{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap}

.sit{border-radius:22px; padding:28px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative; overflow:hidden; min-height:220px; display:flex; flex-direction:column; justify-content:center}
.sit .num{position:absolute; right:18px; top:12px; font-family:var(--dsp); font-size:84px; color:rgba(255,255,255,.05); line-height:1}
.sit .ico{font-size:52px; line-height:1; margin-bottom:12px}
.sit p{font-size:clamp(22px,2.5vw,30px); font-weight:800; line-height:1.3; margin:0}

.hintbox{margin-top:14px; padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.1); border:1px dashed rgba(255,193,77,.55); color:#FFE3A8; font-size:17px}
.hintbox b{color:#fff}

/* flash cards */
.flash{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.fc{perspective:900px; height:150px}
.fc .in{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:16px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; border:1px solid var(--line2)}
.fc .fa{background:linear-gradient(160deg,#1C2340,#121629); font-weight:800; font-size:20px}
.fc .fa small{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--faint); margin-top:8px}
.fc .fb{background:linear-gradient(160deg,rgba(57,216,246,.2),rgba(141,123,255,.18)); transform:rotateY(180deg); font-size:16.5px; font-weight:600}
.fc .fb b{display:block; font-size:15px; color:var(--cyan); margin-bottom:5px}

/* reported speech transformations */
.qbox{border-radius:20px; padding:22px 24px; background:rgba(255,255,255,.05); border:1px solid var(--line2)}
.qbox .lab{font-family:var(--mono); font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.qbox .s{font-size:clamp(22px,2.4vw,30px); font-weight:800; line-height:1.35}
.qbox.direct{border-color:rgba(255,143,199,.45)} .qbox.direct .lab{color:var(--mia)}
.qbox.rep{border-color:rgba(57,216,246,.5)} .qbox.rep .lab{color:var(--cyan)}
.swap{display:inline-block; padding:0 6px; border-radius:8px; background:rgba(57,216,246,.18); color:#fff; border:1px solid rgba(57,216,246,.5)}
.swap.fx{animation:swapIn .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes swapIn{0%{opacity:0; transform:translateY(-14px) rotateX(80deg)} 100%{opacity:1; transform:none}}
.tfgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.tf{padding:14px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid var(--line); text-align:center; font-weight:800; font-size:20px}
.tf .a{color:var(--mia)} .tf .b{color:var(--cyan)} .tf .x{display:block; color:var(--faint); font-size:15px; margin:2px 0}
.back{display:flex; align-items:center; gap:16px; justify-content:center; padding:18px; border-radius:20px; background:linear-gradient(90deg,rgba(57,216,246,.1),rgba(141,123,255,.12)); border:1px solid var(--line2)}
.back .w{font-family:var(--dsp); font-size:clamp(24px,3vw,38px)}
.back .arr{position:relative; width:160px; height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden}
.back .arr i{position:absolute; inset:0; background:linear-gradient(270deg,var(--cyan),transparent); animation:arrBack 1.6s ease-in-out infinite}
@keyframes arrBack{from{transform:translateX(100%)} to{transform:translateX(-100%)}}

/* time machine */
.tm-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.tmc{border-radius:20px; padding:16px 18px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:grid; gap:8px; transition:.3s; cursor:pointer; position:relative}
.tmc .tense{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12.5px; letter-spacing:.06em; font-weight:700; color:var(--muted)}
.tmc .tense b{color:var(--mia)} .tmc .tense em{font-style:normal; color:var(--cyan)}
.tmc .d{display:flex; gap:10px; align-items:center; font-size:19px; font-weight:700}
.tmc .r{font-size:19px; font-weight:800; color:#fff; padding:9px 12px; border-radius:12px; background:rgba(57,216,246,.1); border:1px dashed rgba(57,216,246,.45)}
.tmc .r.q{color:var(--faint); font-weight:700; background:rgba(255,255,255,.03); border-color:var(--line2)}
.tmc.on{border-color:rgba(57,216,246,.5); background:rgba(57,216,246,.06)}
.tmc .r .v{color:var(--amber)}
.tmc.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}
.dial{display:flex; align-items:center; gap:16px}
.dial .clock{width:74px; height:74px; border-radius:50%; border:3px solid var(--cyan); position:relative; box-shadow:0 0 30px -6px var(--cyan)}
.dial .clock i{position:absolute; left:50%; top:50%; width:3px; height:28px; background:var(--cyan); transform-origin:50% 0; border-radius:3px; animation:rewind 2.4s linear infinite}
.dial .clock i+i{height:18px; background:#fff; animation-duration:9s}
@keyframes rewind{from{transform:rotate(180deg)} to{transform:rotate(-180deg)}}
.think{margin-top:18px; text-align:center; font-family:var(--dsp); font-size:clamp(24px,3vw,36px)}

/* what else changes */
.ch3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.chc{border-radius:20px; padding:18px; background:rgba(255,255,255,.045); border:1px solid var(--line)}
.chc h3{font-size:19px; font-family:var(--mono); letter-spacing:.12em; margin-bottom:10px}
.chc div{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:19px; font-weight:700}
.chc div:last-child{border-bottom:0}
.chc div span:first-child{color:var(--mia)} .chc div span:last-child{color:var(--cyan); text-align:right}

/* voice message */
.voice{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:20px; background:#1B2138; border:1px solid var(--line2); max-width:460px; flex:1; min-width:220px}
.voice .play{width:52px; height:52px; flex:0 0 52px; border-radius:50%; background:var(--nora); color:#03140C; display:grid; place-items:center; font-size:20px}
.wave{flex:1; display:flex; align-items:center; gap:3px; height:42px}
.wave i{flex:1; border-radius:3px; background:rgba(255,255,255,.3); height:var(--h)}
.voice.playing .wave i{animation:wv .8s ease-in-out infinite; background:var(--nora)}
@keyframes wv{50%{transform:scaleY(.4)}}
.transcript{margin-top:12px; padding:14px 18px; border-radius:16px; background:rgba(67,229,160,.08); border:1px solid rgba(67,229,160,.35); font-size:22px; font-weight:800}
.transcript small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--nora); font-weight:700}

.gapline{font-size:clamp(22px,2.6vw,32px); font-weight:800; line-height:1.9}
.gap{display:inline-flex; min-width:150px; justify-content:center; padding:0 12px; margin:0 4px; border-radius:12px; border:2px dashed var(--line3); color:var(--faint); line-height:1.45; vertical-align:middle; transition:.2s}
.gap.f{border-style:solid; border-color:var(--cyan); color:#fff; background:rgba(57,216,246,.1)}
.gap.ok{border-color:var(--green); background:rgba(54,224,155,.14); color:#fff}
.gap.no{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.chipset{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.chipset .lab{width:100%; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted)}
.chip{padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-weight:800; font-size:18px}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{border-color:var(--cyan); background:rgba(57,216,246,.14)}
.recovered{display:flex; align-items:center; gap:16px; padding:18px 22px; border-radius:20px; background:linear-gradient(135deg,rgba(54,224,155,.18),rgba(57,216,246,.1)); border:1px solid rgba(54,224,155,.55)}
.recovered .t{font-family:var(--dsp); font-size:clamp(24px,3vw,36px)}

/* reporting verbs */
.verbs{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.vb{--c:var(--cyan); border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); border-top:4px solid var(--c); display:flex; flex-direction:column; gap:6px; text-align:left; transition:.25s}
.vb .e{font-size:30px; line-height:1}
.vb h3{font-family:var(--dsp); font-size:26px; color:var(--c)}
.vb .def{font-size:16px; font-weight:600; color:#D6DAF0; line-height:1.35}
.vb .exm{font-size:15.5px; font-weight:700; padding:9px 11px; border-radius:12px; background:rgba(255,255,255,.05); border:1px dashed var(--line2); margin-top:auto}
.vb .exm.q{color:var(--faint); font-weight:600}
.vb .exm b{color:var(--c)}
.vb.on{background:rgba(255,255,255,.07); border-color:var(--line2)}
.vb.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}

.quote{display:flex; gap:16px; align-items:flex-end}
.quote .bub{font-size:clamp(22px,2.5vw,30px); font-weight:800; padding:18px 22px; border-radius:24px 24px 24px 8px}

/* reading */
.read{display:grid; gap:16px}
.chunk{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:start; padding:18px 20px; border-radius:20px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.chunk .t{font-size:clamp(19px,1.9vw,23px); line-height:1.55; font-weight:600}
.chunk .t p{margin:0}
.chunk .ix{width:54px; height:54px; border-radius:16px; display:grid; place-items:center; font-size:26px; background:rgba(57,216,246,.12); border:1px solid rgba(57,216,246,.35)}
.chunk.fx{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3)}
.chunk .vis{grid-column:2; display:flex; gap:10px; flex-wrap:wrap; margin-top:4px}
.mini{display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:14px; background:#1B2138; border:1px solid var(--line2); font-size:15.5px; font-weight:700}
.mini.rd{border-color:rgba(255,84,112,.55); background:rgba(255,84,112,.1)}
.mini.gr{border-color:rgba(54,224,155,.55); background:rgba(54,224,155,.1)}
.mini .av{--s:26px !important}
.gl{border-bottom:2px dotted var(--amber); cursor:help}
.glbox{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.glbox span{font-size:15.5px; padding:6px 12px; border-radius:12px; background:rgba(255,193,77,.1); border:1px solid rgba(255,193,77,.4)}
.glbox b{color:var(--amber)}
.fulltext{font-size:clamp(18px,1.75vw,21px); line-height:1.75; font-weight:600}
.fulltext p{margin:0 0 .8em}
.tgt{cursor:pointer; border-radius:6px; padding:1px 2px; transition:.2s; border-bottom:2px solid transparent}
.tgt:hover{background:rgba(255,255,255,.06)}
.tgt.found{background:rgba(255,193,77,.25); border-bottom-color:var(--amber); color:#fff}
.tgt.found.fx{animation:found .7s ease}
@keyframes found{30%{background:rgba(255,193,77,.7); box-shadow:0 0 22px rgba(255,193,77,.6)}}
.notgt{animation:shake .4s}
.findlist{display:grid; gap:9px}
.findlist div{display:flex; gap:10px; align-items:center; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.04); border:1px dashed var(--line2); font-weight:700; color:var(--faint)}
.findlist div.ok{color:#fff; border-style:solid; border-color:rgba(255,193,77,.55); background:rgba(255,193,77,.1)}

/* truth board */
.board{position:relative; border-radius:28px; padding:28px; background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.04),transparent 40%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px), #0E1220; border:1px solid var(--line2); overflow:hidden}
.chain{display:grid; gap:0; justify-items:center}
.node{position:relative; display:flex; gap:14px; align-items:center; width:min(100%,var(--w)); padding:14px 18px; border-radius:18px; border:1px solid var(--line2); background:#161B2E;
  transform:rotate(var(--rot)); box-shadow:0 18px 30px -20px #000}
.node .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.node .tx{font-weight:800; font-size:var(--fs); line-height:1.25}
.node .tx small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); font-weight:700}
.node.fx{animation:nodeIn .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes nodeIn{from{opacity:0; transform:rotate(var(--rot)) translateY(-18px) scale(.9)} to{opacity:1; transform:rotate(var(--rot))}}
.node.rumour{background:linear-gradient(135deg,#3A0E1E,#25091A); border:2px solid var(--red); box-shadow:0 0 40px -6px rgba(255,84,112,.7)}
.node.rumour .tx{color:#FFE1E7; text-transform:uppercase; letter-spacing:.01em; animation:glitch 2.4s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none; transform:none}93%{text-shadow:-3px 0 var(--cyan),3px 0 var(--red); transform:translateX(2px)}96%{text-shadow:3px 0 var(--cyan),-3px 0 var(--red); transform:translateX(-2px)}}
.link{height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; letter-spacing:.14em; font-weight:700}
.link .ln{width:2px; flex:1; background:repeating-linear-gradient(180deg,var(--red) 0 6px,transparent 6px 10px)}
.link span{padding:2px 10px; border-radius:99px; background:#2A1220; border:1px solid rgba(255,84,112,.5); color:#FFB4C2; white-space:nowrap}
.strip{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px}
.strip span{font-family:var(--mono); font-weight:700; letter-spacing:.08em; padding:9px 14px; border-radius:12px; font-size:15px}
.strip i{font-style:normal; color:var(--faint)}
.strip.fx span{animation:popIn .4s both}
.strip.fx span:nth-of-type(2){animation-delay:.15s}.strip.fx span:nth-of-type(3){animation-delay:.3s}.strip.fx span:nth-of-type(4){animation-delay:.45s}

/* speaking */
.spq{border-radius:26px; padding:30px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative}
.spq .q{font-size:clamp(26px,3.1vw,40px); font-weight:800; line-height:1.22}
.fu{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.fu button{padding:9px 14px; border-radius:12px; font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.08em; border:1.5px solid var(--line2); background:rgba(255,255,255,.05)}
.fu button.on{border-color:var(--amber); color:var(--amber); background:rgba(255,193,77,.1)}
.fuq{margin-top:12px; display:grid; gap:8px}
.fuq div{padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.08); border-left:4px solid var(--amber); font-size:20px; font-weight:700}
.sample{margin-top:16px; padding:14px 18px; border-radius:16px; background:rgba(54,224,155,.08); border:1px solid rgba(54,224,155,.4); font-size:20px; font-weight:700}
.sample small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--green)}
.wall{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.wall .w{padding:10px 14px; border-radius:14px; background:rgba(57,216,246,.1); border:1px solid rgba(57,216,246,.4); font-weight:700; font-size:17px; animation:popIn .4s both}
.wall .w small{display:block; font-size:12px; color:var(--muted)}

/* rumour control unit */
.rcu{display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:20px; background:linear-gradient(90deg,rgba(255,84,112,.18),rgba(255,84,112,.04)); border:1px solid rgba(255,84,112,.5); margin-bottom:18px}
.siren{font-size:40px; animation:siren 1s steps(2) infinite}
@keyframes siren{50%{filter:hue-rotate(200deg) brightness(1.3)}}
.steps6{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:10px}
.steps6 li{display:flex; gap:14px; align-items:center; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:19px; font-weight:700}
.steps6 li::before{counter-increment:s; content:counter(s); width:36px; height:36px; flex:0 0 36px; border-radius:50%; display:grid; place-items:center; background:var(--red); color:#fff; font-family:var(--mono); font-weight:700}
.steps6 li b{color:var(--amber)}
.cf{border-radius:22px; padding:18px; background:#0E1222; border:1px solid var(--line2)}
.cf .hd{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; letter-spacing:.14em; color:var(--muted); margin-bottom:10px}
.cf .hd b{color:#fff; letter-spacing:.06em; font-size:15px}
.cf .rum{padding:10px 14px; border-radius:14px; background:rgba(255,84,112,.1); border:1px dashed rgba(255,84,112,.55); font-weight:700; font-size:16.5px; margin-bottom:12px}
.cf .rum small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:#FF9AAE}
.cf .chat{padding:0}
.cf .bub{font-size:17.5px}
.rep{display:grid; gap:8px}
.rep div{padding:10px 14px; border-radius:12px; background:rgba(57,216,246,.08); border-left:4px solid var(--cyan); font-size:18px; font-weight:700}
.rep div b{color:var(--amber)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{padding:10px 16px; border-radius:12px; border:1.5px solid var(--line2); background:rgba(255,255,255,.04); font-weight:800; font-size:16px}
.tabs button.on{border-color:var(--cyan); background:rgba(57,216,246,.14); color:#fff}
.vbank{display:flex; gap:7px; flex-wrap:wrap}
.vbank span{font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(255,193,77,.1); border:1px solid rgba(255,193,77,.4); color:var(--amber)}

/* timer ring */
.ringbox{display:flex; flex-direction:column; align-items:center; gap:10px}
.ring{position:relative; width:150px; height:150px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringG); stroke-linecap:round; transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:34px; font-weight:700}
.ring .t.end{color:var(--red)}
.ring.hurry{animation:hurry 1s ease-in-out infinite}
@keyframes hurry{50%{transform:scale(1.04); filter:drop-shadow(0 0 16px var(--red))}}

/* reports + vote */
.checklist{display:grid; gap:8px}
.checklist div{display:flex; gap:12px; align-items:center; font-size:19px; font-weight:700}
.checklist div::before{content:"✓"; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:rgba(54,224,155,.15); color:var(--green); border:1px solid rgba(54,224,155,.5); font-weight:900}
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px}
.tcard{border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.tcard.done{border-color:rgba(54,224,155,.6); background:rgba(54,224,155,.08)}
.tcard .tn{display:flex; align-items:center; gap:10px}
.tcard .tn b{font-size:19px} .tcard .tn span{font-size:24px}
.tcard .ws{font-size:15.5px; color:#D6DAF0; display:grid; gap:4px}
.tcard .ws div{padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.05)}
.awards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.award{border-radius:22px; padding:18px; background:rgba(255,255,255,.045); border:1.5px solid var(--line); text-align:center; cursor:pointer; transition:.2s}
.award .e{font-size:44px}
.award b{display:block; font-size:19px; margin-top:6px}
.award.on{border-color:var(--amber); background:rgba(255,193,77,.08); box-shadow:0 0 30px -10px var(--amber)}
.vbars{display:grid; gap:10px; margin-top:16px}
.vbar{display:grid; grid-template-columns:150px 1fr 50px; gap:12px; align-items:center}
.vbar button{text-align:left; font-weight:800; font-size:17px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:rgba(255,255,255,.04)}
.vbar .tr{height:30px; border-radius:10px; background:rgba(255,255,255,.06); overflow:hidden}
.vbar .tr i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--amber),var(--red)); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vbar .c{font-family:var(--mono); font-weight:700; font-size:18px}
.vbar.win button{border-color:var(--amber); color:var(--amber)}
.winners{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px}
.winners div{padding:12px; border-radius:16px; border:1px solid rgba(255,193,77,.5); background:rgba(255,193,77,.08); text-align:center; font-weight:800}

/* ending */
.closed{position:relative; text-align:center; padding:30px; border-radius:28px; background:radial-gradient(circle at 50% 0%,rgba(54,224,155,.22),transparent 60%),#0E1322; border:1px solid rgba(54,224,155,.5); overflow:hidden}
.closed .st{display:inline-block; white-space:nowrap; font-family:var(--dsp); font-size:clamp(34px,4.4vw,64px); color:var(--green); border:6px solid var(--green); border-radius:18px; padding:4px 26px; transform:rotate(-5deg); text-shadow:0 0 30px rgba(54,224,155,.5)}
.closed .st.fx{animation:bigStamp .7s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes bigStamp{from{opacity:0; transform:rotate(-5deg) scale(2.2)} to{opacity:1; transform:rotate(-5deg) scale(1)}}
.versions{display:flex; justify-content:center; gap:10px; margin:22px 0 10px; flex-wrap:wrap}
.versions span{font-size:18px; font-weight:800; padding:8px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.moral{font-family:var(--dsp); font-size:clamp(26px,3.2vw,42px); margin-top:12px}
.moral em{font-style:normal; color:var(--cyan)}

/* summary */
.sum{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sumc{border-radius:20px; padding:18px; background:rgba(255,255,255,.045); border:1px solid var(--line)}
.sumc h3{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin-bottom:10px}
.sumc .l{display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:18px; font-weight:700; border-bottom:1px solid var(--line)}
.sumc .l:last-child{border-bottom:0}
.sumc .l span:first-child{color:var(--mia)}
.sumc .l span:last-child{color:var(--cyan); text-align:right}
.sumc.span2{grid-column:span 2}
.vchips{display:flex; gap:8px; flex-wrap:wrap}
.vchips span{font-family:var(--dsp); font-size:22px; padding:6px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.unlock{animation:unlock .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes unlock{from{opacity:0; transform:translateY(16px) scale(.95); filter:blur(4px)} to{opacity:1; transform:none; filter:none}}

/* evidence board (modal) */
.evb{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:8px 4px 4px; position:relative}
.evc{position:relative; border-radius:16px; padding:16px 16px 14px; min-height:150px; background:#F4EEDD; color:#20180A; box-shadow:0 18px 30px -16px #000; transform:rotate(var(--rot))}
.evc .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.evc .k{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em; color:#8A6A2E}
.evc b{display:block; font-size:17px; margin:2px 0 6px}
.evc p{margin:0; font-size:15.5px; font-weight:600; line-height:1.35}
.evc .rp{margin-top:8px; font-size:14.5px; font-weight:700; color:#0E5A7A}
.evc.lock{background:transparent; color:var(--faint); border:2px dashed var(--line2); box-shadow:none; display:grid; place-items:center; text-align:center}
.evc.lock b{font-size:34px}
.evc.new{animation:evNew 1s ease}
@keyframes evNew{30%{transform:rotate(0) scale(1.06); box-shadow:0 0 40px var(--amber)}}
.evhead{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.evbar{flex:1; height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.evbar i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); border-radius:99px; transition:width .6s}

/* clue fly */
#clueFx{position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; opacity:0}
#clueFx.on{animation:clueFade 2.4s ease forwards}
#clueFx .cc{width:min(420px,86vw); border-radius:22px; padding:22px 24px; background:#F4EEDD; color:#20180A; box-shadow:0 40px 80px -20px #000, 0 0 0 4px rgba(255,193,77,.6); text-align:center}
#clueFx .cc .k{font-family:var(--mono); font-weight:700; letter-spacing:.2em; color:#1A7F55; font-size:14px}
#clueFx .cc b{display:block; font-family:var(--dsp); font-size:28px; margin:6px 0}
#clueFx .cc p{margin:0; font-weight:700}
#clueFx.on .cc{animation:clueFly 2.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes clueFade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes clueFly{0%{transform:scale(.6) rotate(-6deg)}14%{transform:scale(1.05) rotate(2deg)}22%{transform:scale(1) rotate(-1deg)}72%{transform:scale(1) rotate(-1deg) translate(0,0)}100%{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(10deg)}}

/* scene card */
#scard{position:fixed; inset:0; z-index:60; pointer-events:none; display:grid; place-items:center; opacity:0}
#scard.on{animation:scard 1.5s ease forwards}
#scard .in{text-align:center; padding:26px 46px; border-radius:26px; background:rgba(8,11,22,.88); border:1px solid var(--line2); backdrop-filter:blur(8px)}
#scard .k{font-family:var(--mono); letter-spacing:.24em; color:var(--cyan); font-size:14px}
#scard h2{font-family:var(--dsp); font-size:clamp(34px,5vw,60px); margin-top:8px}
@keyframes scard{0%{opacity:0; transform:scale(.96)}15%{opacity:1; transform:none}75%{opacity:1}100%{opacity:0}}

/* teacher panel, dock, modal, toast */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(440px,94vw); z-index:50; background:#0B0F1E; border-left:1px solid var(--line2); box-shadow:-30px 0 60px -20px #000;
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column}
#teacher.on{transform:none}
.thd{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); font-family:var(--mono); letter-spacing:.12em}
#tBody{overflow:auto; padding:14px 16px 30px; display:grid; gap:14px}
.tsec{padding:14px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid var(--line); font-size:16px}
.tsec h5{margin:0 0 8px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--cyan); text-transform:uppercase}
.tsec ul{margin:0; padding-left:18px} .tsec li{margin:4px 0}
.say{padding:10px 12px; border-radius:12px; background:rgba(57,216,246,.08); border-left:3px solid var(--cyan); font-weight:700}
.tgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sw{display:flex; align-items:center; gap:10px; justify-content:space-between; padding:6px 0; font-size:15px}
.sw button{width:46px; height:26px; border-radius:99px; background:rgba(255,255,255,.12); position:relative; transition:.2s; flex:0 0 46px}
.sw button::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s}
.sw button.on{background:var(--cyan)} .sw button.on::after{left:23px}
.stg{display:grid; gap:6px}
.stg button{display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:10px; border:1px solid var(--line); text-align:left; font-size:15px; font-weight:700}
.stg button.on{border-color:rgba(54,224,155,.55); background:rgba(54,224,155,.1)}
.tmap{display:grid; gap:4px}
.tmap .sn{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; color:var(--cyan); margin-top:10px}
.tmap button{display:flex; gap:8px; align-items:center; padding:7px 10px; border-radius:10px; text-align:left; font-size:15px; border:1px solid transparent}
.tmap button:hover{background:rgba(255,255,255,.06)}
.tmap button.cur{border-color:var(--cyan); background:rgba(57,216,246,.1)}
.tmap button.skip{opacity:.45}
.tmap button span:first-child{flex:1}
.tmap .m{font-family:var(--mono); font-size:12px; color:var(--faint)}

#dock{position:fixed; left:16px; bottom:84px; z-index:40; width:330px; max-height:52vh; display:none; flex-direction:column; border-radius:18px; background:rgba(11,15,30,.96); border:1px solid var(--line2); box-shadow:var(--shadow); overflow:hidden}
#dock.on{display:flex}
#dock.min .db{display:none}
.dh{display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--line)}
.db{overflow:auto; padding:10px 12px; display:grid; gap:7px}
.led{width:10px; height:10px; border-radius:50%; background:var(--faint); flex:0 0 10px}
.led.on{background:var(--green); box-shadow:0 0 10px var(--green)} .led.warn{background:var(--amber)} .led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:5px}
.names span{font-size:13px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.07)}
.wallit{display:flex; gap:6px; align-items:center}
.wallit p{flex:1; margin:0; font-size:14.5px} .wallit small{display:block; color:var(--muted); font-size:12px}
.okm{color:var(--green); font-weight:900} .nom{color:var(--bad); font-weight:900}
.dbar{display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; font-size:14px}
.dbar .tr{grid-column:1/-1; height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:-4px}
.dbar .tr i{display:block; height:100%; background:var(--cyan)}
.dbar .tr i.ok{background:var(--green)}

#modal{position:fixed; inset:0; z-index:80; background:rgba(3,4,10,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px}
#modal .box{width:min(980px,100%); max-height:90vh; overflow:auto; border-radius:26px; padding:26px; background:#0D1121; border:1px solid var(--line2); box-shadow:var(--shadow)}
#toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); z-index:90; padding:12px 20px; border-radius:14px; background:#1A2038; border:1px solid var(--line2); font-weight:700; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%)}
#reacts{position:fixed; right:30px; bottom:90px; z-index:45; width:100px; height:60vh; pointer-events:none}
#reacts span{position:absolute; bottom:0; font-size:38px; animation:rise 3s ease-out forwards}
@keyframes rise{to{transform:translateY(-55vh) scale(1.3); opacity:0}}
#confetti{position:fixed; inset:0; z-index:95; pointer-events:none}
#wm{position:fixed; right:18px; bottom:76px; z-index:2; opacity:.16; pointer-events:none}
#wm img{width:86px; display:block}

/* student phone app */
#student{display:none}
body.student{overflow:auto}
body.student #app, body.student #wm{display:none}
body.student #student{display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1}
.stu-top{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 16px; background:rgba(6,8,15,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
.stu-top b{font-family:var(--mono); letter-spacing:.14em; font-size:13px; color:var(--cyan)}
.connst{font-size:12px; color:var(--muted)}
.stu-body{flex:1; padding:16px; max-width:560px; width:100%; margin:0 auto}
.stu-card{padding:20px}
.stu-card label{display:block; font-weight:800; font-size:15px; margin:14px 0 6px}
.stu-card input,.stu-card textarea{width:100%; padding:13px 14px; border-radius:13px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-size:17px}
.stu-card textarea{min-height:64px; resize:vertical}
.stu-wait{text-align:center; padding:50px 10px}
.stu-wait .bigi{font-size:60px}
.stu-foot{position:sticky; bottom:0; display:flex; justify-content:center; gap:8px; padding:10px; background:rgba(6,8,15,.94); border-top:1px solid var(--line)}
.stu-foot button{width:48px; height:48px; border-radius:14px; background:rgba(255,255,255,.06); font-size:24px}
.stu-prog{display:flex; gap:4px; margin-bottom:12px}
.stu-prog i{flex:1; height:5px; border-radius:99px; background:rgba(255,255,255,.1)}
.stu-prog i.d{background:var(--green)} .stu-prog i.c{background:var(--cyan)}

/* responsive */
@media (max-width:1100px){ .prog .st:not(.cur) .lb2{display:none} .prog .st{padding:6px 9px} }
@media (max-width:1080px){
  .two,.two.wl,.two.wr,.hero{grid-template-columns:1fr}
  .verbs,.flash{grid-template-columns:repeat(2,1fr)} .tfgrid{grid-template-columns:repeat(2,1fr)}
  .ch3,.sum,.awards,.winners{grid-template-columns:1fr} .sumc.span2{grid-column:auto}
  .evb{grid-template-columns:repeat(2,1fr)} .tm-grid{grid-template-columns:1fr}
  .tools .hm .lb{display:none} .brand span{display:none}
}
@media (max-width:760px){
  body{font-size:17px} .wrap{padding:16px 16px 50px}
  .prog .ar{display:none} .prog{gap:3px} .prog .st{padding:5px 7px} .prog .st .lb2{display:none}
  .tools .lb{display:none} .navr .lb{display:none} .brand{display:none}
  .verbs,.flash,.evb,.tfgrid{grid-template-columns:1fr} .cast{grid-template-columns:1fr}
  #navInfo{font-size:12px} #dock{width:calc(100vw - 32px)} .vbar{grid-template-columns:110px 1fr 40px}
  .tb{height:40px; min-width:40px; padding:0 9px}
  .node{width:100%; transform:none} .node .tx{font-size:min(var(--fs),20px)} .board{padding:18px 12px}
}

/* ── shared with Lesson 19: replay card, rings, breakout form, projects ── */
.replay{position:relative; border-radius:30px; padding:30px; text-align:center; overflow:hidden;
  background:radial-gradient(circle at 50% -10%,rgba(155,107,255,.35),transparent 60%),radial-gradient(circle at 50% 120%,rgba(63,217,245,.18),transparent 55%),#0A0E28; border:1px solid rgba(155,107,255,.55); box-shadow:0 0 60px -20px rgba(155,107,255,.8), var(--shadow)}
.rings{position:relative; width:clamp(110px,14vw,170px); aspect-ratio:1; margin:0 auto}
.rings i{position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:var(--cyan); border-right-color:var(--violet); animation:spin 3s linear infinite}
.rings i:nth-child(2){inset:14%; border-top-color:var(--sun); border-left-color:var(--violet); animation-duration:2.2s; animation-direction:reverse}
.rings i:nth-child(3){inset:28%; border-bottom-color:var(--cyan); border-right-color:var(--sun); animation-duration:4s}
.rings b{position:absolute; inset:36%; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle,#fff,var(--cyan) 40%,var(--violet)); box-shadow:0 0 40px var(--violet); font-size:clamp(18px,2.4vw,28px); color:#0A0E28}
@keyframes spin{to{transform:rotate(360deg)}}
.replay .app{font-family:var(--mono); letter-spacing:.34em; color:var(--app); font-size:15px; margin-top:16px}
.replay h2{font-family:var(--dsp); font-size:clamp(32px,4.4vw,60px); margin-top:8px; letter-spacing:-.02em}
.replay h2 span{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--sun)); -webkit-background-clip:text; background-clip:text; color:transparent}
.phone.glowing{box-shadow:0 0 0 2px rgba(155,107,255,.6), 0 0 80px -10px rgba(155,107,255,.9), 0 40px 80px -36px #000; animation:phGlow 2.4s ease-in-out infinite}
@keyframes phGlow{50%{box-shadow:0 0 0 2px rgba(63,217,245,.7), 0 0 110px -6px rgba(63,217,245,.8), 0 40px 80px -36px #000}}

.s7{display:grid; gap:9px}
.s7 div{display:grid; grid-template-columns:78px 1fr; gap:12px; align-items:center; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:17.5px; font-weight:600}
.s7 b{font-family:var(--mono); font-size:12.5px; letter-spacing:.12em; color:var(--sun); text-align:center; padding:6px 0; border-radius:10px; background:rgba(255,181,71,.1)}
.exc{border-radius:20px; padding:16px 18px; background:#0E1330; border:1px solid rgba(255,181,71,.4); display:grid; gap:8px}
.exc div{font-size:17px; font-weight:700} .exc small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; color:var(--muted)}
details.ideas{border-radius:16px; padding:10px 14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
details.ideas summary{cursor:pointer; font-weight:800}
.form7 label{display:block; font-weight:800; font-size:14.5px; margin:10px 0 4px; color:#D6DAF0}
.form7 input{width:100%; padding:11px 13px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-size:17px; font-weight:600}
.form7 input:focus{outline:none; border-color:var(--sun); box-shadow:0 0 0 3px rgba(255,181,71,.18)}
.chk7{display:grid; gap:6px; font-weight:700}
.chk7 div.ok{color:#C9F8E2}
.roster{display:grid; gap:6px}

/* ═════════════ LESSON 20 · ESCAPE THE ALGORITHM ═════════════ */
:root{
  --bg:#040714; --bg2:#081028; --panel:#0E1736; --panel2:#142046;
  --cyan:#3BE8FF; --cyan2:#12A8D0; --blue:#3D7BFF; --violet:#8B5CFF; --red:#FF3D6E; --red2:#C81E50; --amber:#FFC24F; --green:#3DF0A0;
  --algo:#D14BFF; --algo2:#FF3D6E; --app:#C9A6FF; --sun:#FFC24F; --sun2:#FFD86B;
  --mia:#FF8FC7; --leo:#5AA9FF; --user:#9FB4D9;
  --ok:#3DF0A0; --bad:#FF3D6E;
  --line:rgba(120,170,255,.12); --line2:rgba(120,170,255,.24); --line3:rgba(120,170,255,.38);
}
body::before{background:
   radial-gradient(900px 600px at -5% -10%, rgba(61,123,255,.20), transparent 62%),
   radial-gradient(800px 600px at 105% 108%, rgba(209,75,255,.16), transparent 60%),
   radial-gradient(700px 500px at 60% -20%, rgba(59,232,255,.12), transparent 60%),
   linear-gradient(180deg,#060B22,#040714 70%)}
body::after{background-image:linear-gradient(rgba(59,232,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(59,232,255,.05) 1px,transparent 1px)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue) 55%,var(--violet)); color:#030716}
.btn.violet{background:linear-gradient(135deg,var(--violet),#5B3BFF); color:#fff; border-color:transparent; box-shadow:0 10px 30px -12px rgba(139,92,255,.9)}
.btn.algo{background:linear-gradient(135deg,var(--algo),var(--algo2)); color:#fff; border-color:transparent; box-shadow:0 10px 30px -10px rgba(209,75,255,.9)}
.btn.neon{background:transparent; border-color:var(--cyan); color:#CFF8FF; box-shadow:0 0 0 1px rgba(59,232,255,.4) inset, 0 0 24px -8px var(--cyan)}
.btn.neon:hover{background:rgba(59,232,255,.12)}
.card.vi{border-color:rgba(139,92,255,.55); box-shadow:0 0 0 1px rgba(139,92,255,.18) inset, var(--shadow)}
.card.al{border-color:rgba(209,75,255,.55); box-shadow:0 0 0 1px rgba(209,75,255,.18) inset, 0 0 60px -30px var(--algo), var(--shadow)}
.tag.vi{background:rgba(139,92,255,.15); border-color:rgba(139,92,255,.55); color:#DCCBFF}
.tag.al{background:rgba(209,75,255,.14); border-color:rgba(209,75,255,.55); color:#F2C9FF}
.glass{background:linear-gradient(160deg,rgba(20,34,80,.72),rgba(8,14,40,.82)); border:1px solid rgba(59,232,255,.28); border-radius:24px; box-shadow:0 0 0 1px rgba(59,232,255,.06) inset, 0 30px 60px -36px #000, 0 0 50px -30px rgba(59,232,255,.6); backdrop-filter:blur(8px)}
.holo{position:relative; overflow:hidden}
.holo::after{content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px); mix-blend-mode:overlay}
.neonT{color:#fff; text-shadow:0 0 18px rgba(59,232,255,.7), 0 0 40px rgba(61,123,255,.5)}

/* ─── progress row: missions + escape meter ─── */
#progRow{display:flex; align-items:center; gap:14px}
#progRow .prog{margin:0; flex:1; justify-content:flex-start}
.prog .st.lock{opacity:.55; border-style:dashed}
.prog .st.lock i{filter:grayscale(1)}
.prog .st.avail{color:#CFE7FF; border-color:rgba(59,232,255,.35)}
.prog .st.avail i{filter:none; opacity:.9}
.prog .st .stt{font-family:var(--mono); font-size:10px; letter-spacing:.12em; padding:1px 6px; border-radius:99px; background:rgba(255,255,255,.08)}
.prog .st.done .stt{background:rgba(61,240,160,.18); color:var(--green)}
.prog .st.cur .stt{background:rgba(59,232,255,.2); color:var(--cyan)}
#esc{display:flex; align-items:center; gap:10px; flex:0 0 auto; padding:5px 12px; border-radius:99px; border:1px solid rgba(59,232,255,.35); background:rgba(6,14,40,.7); cursor:pointer}
#esc small{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--cyan); white-space:nowrap}
#esc .eb{width:120px; height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; position:relative}
#esc .eb i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--green)); box-shadow:0 0 12px var(--cyan); transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
#esc b{font-family:var(--mono); font-size:15px; min-width:42px; text-align:right}
#esc.bump{animation:escBump 1.4s ease}
@keyframes escBump{20%{box-shadow:0 0 0 3px rgba(61,240,160,.4),0 0 40px var(--green); transform:scale(1.06)}}
#esc .keys{display:flex; gap:3px}
#esc .keys i{width:8px; height:8px; border-radius:2px; background:rgba(255,255,255,.14); transform:rotate(45deg)}
#esc .keys i.on{background:var(--green); box-shadow:0 0 8px var(--green)}

/* ─── ALGORITHM.exe core ─── */
.algo{--s:240px; position:relative; width:var(--s); aspect-ratio:1; flex:0 0 auto; isolation:isolate}
.algo>i{position:absolute; border-radius:50%; inset:0}
.algo .r1{background:conic-gradient(from 0deg,transparent 0 12%,var(--algo) 18%,transparent 26% 46%,var(--algo2) 54%,transparent 62% 80%,var(--violet) 88%,transparent 94%);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 67%,transparent 68%); mask:radial-gradient(circle,transparent 62%,#000 63% 67%,transparent 68%); animation:spin 7s linear infinite}
.algo .r2{inset:9%; border:2px dashed rgba(209,75,255,.55); animation:spin 14s linear infinite reverse}
.algo .r3{inset:4%; background:conic-gradient(from 90deg,rgba(255,61,110,.0),rgba(255,61,110,.55),rgba(255,61,110,0) 30%); -webkit-mask:radial-gradient(circle,transparent 66%,#000 67% 69%,transparent 70%); mask:radial-gradient(circle,transparent 66%,#000 67% 69%,transparent 70%); animation:spin 3.4s linear infinite}
.algo::before{content:""; position:absolute; inset:-14%; border-radius:50%; background:radial-gradient(circle,rgba(209,75,255,.45),rgba(255,61,110,.12) 45%,transparent 68%); z-index:-1; animation:pulseG 3s ease-in-out infinite}
@keyframes pulseG{50%{transform:scale(1.08); opacity:.75}}
.algo .eye{position:absolute; inset:24% 14%; border-radius:50%/50%; background:radial-gradient(ellipse at 50% 50%,#2A0A3A,#0A0418 70%); border:2px solid rgba(209,75,255,.8); box-shadow:0 0 30px rgba(209,75,255,.6), inset 0 0 30px rgba(255,61,110,.35); overflow:hidden; display:grid; place-items:center; animation:blinkE 6s infinite}
@keyframes blinkE{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
.algo .iris{width:42%; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 40% 40%,#FFB4D0,var(--algo2) 30%,#7A0B3C 62%,#2A0418 70%); box-shadow:0 0 30px var(--algo2); display:grid; place-items:center; animation:look 7s ease-in-out infinite}
.algo .iris b{width:36%; aspect-ratio:1; border-radius:50%; background:#05010A; box-shadow:0 0 0 3px rgba(255,255,255,.08)}
@keyframes look{0%,100%{transform:translateX(0)}20%{transform:translateX(-38%)}40%{transform:translateX(34%)}60%{transform:translate(0,-12%)}80%{transform:translateX(20%)}}
.algo .scan{position:absolute; left:8%; right:8%; height:2px; top:50%; background:linear-gradient(90deg,transparent,var(--algo2),transparent); box-shadow:0 0 12px var(--algo2); animation:scanY 2.6s ease-in-out infinite}
@keyframes scanY{0%,100%{top:22%; opacity:0}10%{opacity:1}50%{top:78%}90%{opacity:1}}
.algo.glitchy{animation:algoG 4s infinite}
@keyframes algoG{0%,90%,100%{transform:none; filter:none}91%{transform:translate(4px,-2px) skewX(6deg); filter:hue-rotate(60deg)}93%{transform:translate(-5px,2px); filter:hue-rotate(-40deg) saturate(2)}95%{transform:none}}
.algo.sm{--s:120px} .algo.xs{--s:70px} .algo.lose{animation:algoLose 1.2s ease-in-out infinite}
@keyframes algoLose{0%,100%{filter:none; opacity:1}25%{filter:hue-rotate(90deg) blur(1px); opacity:.6; transform:translateX(-6px) skewX(-8deg)}50%{opacity:.9; transform:translateX(5px)}75%{filter:grayscale(.8); opacity:.4}}
.av.algo-av{background:radial-gradient(circle at 50% 50%,#FF3D6E 0 18%,#5A0A3A 20% 32%,#1A0628 34%); --c:var(--algo)}
.av.algo-av::after{content:""; position:absolute; inset:16%; border-radius:50%; border:2px solid rgba(209,75,255,.8); border-top-color:transparent; animation:spin 2.4s linear infinite}
.av.user-av{background:linear-gradient(160deg,#2A3554,#151C33); --c:var(--user); color:#BFD0F2}

/* algorithm speech */
.algomsg{position:relative; padding:14px 18px; border-radius:6px 20px 20px 20px; background:linear-gradient(135deg,rgba(80,10,70,.85),rgba(40,8,60,.85)); border:1px solid rgba(209,75,255,.55); box-shadow:0 0 30px -12px var(--algo);
  font-family:var(--mono); font-size:clamp(17px,1.9vw,23px); font-weight:700; color:#FBE3FF; letter-spacing:.01em; line-height:1.45}
.algomsg small{display:block; font-size:11px; letter-spacing:.24em; color:#FF8FB4; margin-bottom:2px}
.algomsg.red{border-color:rgba(255,61,110,.7); background:linear-gradient(135deg,rgba(90,8,40,.88),rgba(50,6,40,.88))}
.tw.twc::after{content:"▌"; color:var(--algo2); animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.algoLines{display:grid; gap:10px}
.line{display:flex; gap:12px; align-items:flex-start}
.line .bub{font-size:clamp(18px,2vw,24px); font-weight:800; padding:12px 18px}
.line .bub .who{font-size:13px}
.line.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}

/* ─── portal ─── */
.portal{position:relative; width:100%; aspect-ratio:1; max-width:520px; margin:0 auto; isolation:isolate}
.portal>i{position:absolute; border-radius:50%}
.portal .p1{inset:0; background:conic-gradient(from 0deg,var(--cyan),var(--blue),var(--violet),var(--algo),var(--cyan)); -webkit-mask:radial-gradient(circle,transparent 60%,#000 61% 66%,transparent 67%); mask:radial-gradient(circle,transparent 60%,#000 61% 66%,transparent 67%); animation:spin 9s linear infinite; filter:drop-shadow(0 0 20px var(--cyan))}
.portal .p2{inset:8%; background:conic-gradient(from 180deg,transparent,rgba(59,232,255,.9),transparent 30%,rgba(139,92,255,.9) 60%,transparent 75%); -webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 65%,transparent 66%); mask:radial-gradient(circle,transparent 62%,#000 63% 65%,transparent 66%); animation:spin 4.5s linear infinite reverse}
.portal .p3{inset:14%; border:2px dashed rgba(59,232,255,.35); animation:spin 20s linear infinite}
.portal .core{position:absolute; inset:20%; border-radius:50%; background:radial-gradient(circle,#fff 0,#BFF6FF 12%,rgba(59,232,255,.85) 30%,rgba(61,123,255,.6) 50%,rgba(139,92,255,.35) 68%,transparent 72%); animation:coreP 3.2s ease-in-out infinite; box-shadow:0 0 120px 20px rgba(59,232,255,.35)}
@keyframes coreP{50%{transform:scale(1.05); filter:brightness(1.2)}}
.portal .grid{position:absolute; inset:20%; border-radius:50%; background:radial-gradient(circle,transparent 30%,rgba(4,7,20,.0) 31%),repeating-radial-gradient(circle,transparent 0 14px,rgba(255,255,255,.12) 15px 16px); mix-blend-mode:overlay; animation:spin 30s linear infinite}
.portal .sp{position:absolute; width:5px; height:5px; border-radius:50%; background:#fff; box-shadow:0 0 10px var(--cyan); animation:spark 3s linear infinite}
@keyframes spark{from{transform:rotate(var(--a)) translateX(0) scale(1); opacity:1} to{transform:rotate(var(--a)) translateX(260px) scale(.2); opacity:0}}
.portal.closed .core{background:radial-gradient(circle,rgba(255,61,110,.35),rgba(80,10,60,.6) 50%,transparent 72%); box-shadow:0 0 80px rgba(255,61,110,.3); animation:none}
.portal.closed .p1{filter:grayscale(.6) drop-shadow(0 0 10px var(--red)); animation-duration:30s}
.portal.open .core{animation:coreOpen 2.4s ease-out both, coreP 3.2s 2.4s ease-in-out infinite}
@keyframes coreOpen{from{transform:scale(.2); filter:brightness(3)} to{transform:scale(1)}}

/* hero */
.hero20{display:grid; grid-template-columns:1.05fr .95fr; gap:30px; align-items:center}
.hero20 h1{font-family:var(--dsp); font-size:clamp(46px,6.2vw,96px); line-height:.92; letter-spacing:-.035em}
.hero20 h1 .g{display:block; background:linear-gradient(90deg,var(--cyan),var(--blue) 40%,var(--violet) 70%,var(--algo)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 22px rgba(59,232,255,.35))}
.hero20 .sub{font-family:var(--mono); letter-spacing:.14em; color:#CFE7FF; font-size:clamp(14px,1.3vw,17px); margin-top:16px}
.meta4{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.meta4 span{font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.08em; padding:6px 12px; border-radius:10px; background:rgba(59,232,255,.08); border:1px solid rgba(59,232,255,.3); color:#CFF8FF}
.stagePortal{position:relative; max-width:560px; margin:0 auto; width:100%}
.stagePortal .hc{position:absolute; bottom:4%; z-index:3; display:flex; flex-direction:column; align-items:center; gap:6px}
.stagePortal .hc.m{left:2%} .stagePortal .hc.l{right:2%}
.hcf{width:clamp(96px,11vw,150px); aspect-ratio:3/4; border-radius:22px; overflow:hidden; position:relative; border:2px solid var(--c); box-shadow:0 0 0 4px rgba(4,7,20,.8), 0 0 40px -6px var(--c), 0 30px 40px -20px #000; background:#0B1230}
.hcf img{width:100%; height:100%; object-fit:cover; display:block}
.hcf::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 60%,rgba(4,7,20,.75)),repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px)}
.hc .nm{font-family:var(--dsp); font-size:20px; padding:3px 14px; border-radius:99px; background:rgba(4,7,20,.85); border:1px solid var(--c); color:#fff}
.hc{animation:hcFloat 5s ease-in-out infinite} .hc.l{animation-delay:-2.5s}
@keyframes hcFloat{50%{transform:translateY(-8px)}}
.hcf.locked{filter:grayscale(.6) brightness(.8)}
.hcf .lk{position:absolute; inset:auto 0 8px 0; z-index:2; text-align:center; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em; color:#FFC4D3}
.hcf.locked{animation:idG 2.6s infinite}
@keyframes idG{0%,90%,100%{transform:none}92%{transform:translateX(3px); filter:grayscale(.6) hue-rotate(90deg)}95%{transform:translateX(-3px)}}

/* ─── The Perfect Feed (fictional app) ─── */
.feedwrap{display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:30px; align-items:center}
.pf .scr{background:linear-gradient(180deg,#0B0E1E,#0A0C18)}
.pfh{display:flex; align-items:center; gap:8px; padding:6px 16px 10px; border-bottom:1px solid var(--line)}
.pfh b{font-family:var(--dsp); font-size:21px; background:linear-gradient(90deg,#FF8FC7,#FFC24F,#3BE8FF); -webkit-background-clip:text; background-clip:text; color:transparent}
.pfh span{margin-left:auto; display:flex; gap:12px; font-size:19px}
.pfh .dot{position:relative} .pfh .dot::after{content:"99+"; position:absolute; right:-14px; top:-8px; font-family:var(--mono); font-size:9px; font-weight:700; padding:1px 4px; border-radius:99px; background:var(--red); color:#fff}
.pfscroll{overflow:hidden; position:relative; flex:1}
.pfscroll .roll{display:grid; gap:12px; padding:12px; animation:feedRoll 26s linear infinite}
.pfscroll:hover .roll{animation-play-state:paused}
@keyframes feedRoll{from{transform:translateY(0)} to{transform:translateY(-50%)}}
.stories{display:flex; gap:10px}
.stories div{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; color:#C9CFE8}
.stories i{width:50px; height:50px; border-radius:50%; padding:2px; background:conic-gradient(#FF8FC7,#FFC24F,#3BE8FF,#8B5CFF,#FF8FC7); display:block; font-style:normal}
.stories i span{display:grid; place-items:center; width:100%; height:100%; border-radius:50%; background:#141A33; overflow:hidden; font-size:22px; border:2px solid #0A0C18}
.stories i img{width:100%; height:100%; object-fit:cover}
.post{border-radius:16px; background:#121733; border:1px solid var(--line); overflow:hidden}
.post .ph{display:flex; gap:8px; align-items:center; padding:8px 10px; font-size:13px; font-weight:800}
.post .ph small{color:var(--muted); font-weight:600}
.post .ph .tr{margin-left:auto; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; padding:2px 6px; border-radius:99px; background:rgba(255,61,110,.18); color:#FF9BB5}
.post img{display:block; width:100%; aspect-ratio:16/10; object-fit:cover}
.post .pa{display:flex; gap:12px; align-items:center; padding:8px 10px; font-size:13px; font-weight:800}
.post .pa .lk{color:#FF6B8F} .post .pa .sp{margin-left:auto; color:var(--muted); font-weight:600; font-size:12px}
.post p{margin:0; padding:0 10px 10px; font-size:13px; color:#D5DAF0}
.reco{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.reco div{border-radius:14px; overflow:hidden; background:#151B3A; border:1px solid rgba(139,92,255,.35); font-size:11.5px; font-weight:800}
.reco div img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover}
.reco div span{display:block; padding:6px 8px}
.reco div small{display:block; color:#B9A6FF; font-family:var(--mono); font-size:9px; letter-spacing:.1em}
.ntf{display:flex; gap:8px; align-items:center; padding:8px 10px; border-radius:14px; background:rgba(40,46,90,.85); border:1px solid var(--line2); font-size:12.5px; font-weight:800}
.ntf i{font-style:normal; font-size:18px}
.pfpop{position:absolute; left:10px; right:10px; top:50px; z-index:4}
.pfpop .ntf{animation:drop .7s cubic-bezier(.2,.9,.3,1.25) both; margin-bottom:6px; box-shadow:0 10px 24px -10px #000}
.promises{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px}
.promises span{display:inline-flex; gap:7px; align-items:center; padding:7px 12px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid var(--line2); font-weight:800; font-size:15.5px}
.promises span::before{content:"✓"; color:var(--green); font-weight:900}
.enter{font-family:var(--dsp); font-size:clamp(18px,2vw,24px)!important; letter-spacing:.06em; padding:18px 30px!important}
.feedwrap.glitching .pf{animation:pfG .8s steps(4) both}
@keyframes pfG{20%{transform:translateX(-6px) skewX(4deg); filter:hue-rotate(90deg)}40%{transform:translateX(6px); filter:invert(.2)}60%{filter:brightness(.4)}100%{filter:brightness(.2)}}

/* intro */
.intro{display:grid; grid-template-columns:auto 1fr; gap:34px; align-items:center}
.idcards{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:14px}
.idc{display:flex; gap:14px; align-items:center; padding:14px; border-radius:20px; background:rgba(255,61,110,.08); border:1px solid rgba(255,61,110,.45)}
.idc .hcf{width:84px; border-radius:16px}
.idc b{display:block; font-size:20px} .idc span{font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:#FF9BB5}
.missions4{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:14px}
.missions4 div{text-align:center; padding:12px 8px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid var(--line2); font-weight:800; font-size:14.5px; line-height:1.25}
.missions4 div span{display:block; font-size:28px; margin-bottom:4px}
.missions4 div small{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--faint); margin-top:4px}
.rescue{display:inline-flex; gap:12px; align-items:center; margin-top:16px; padding:12px 18px; border-radius:16px; background:linear-gradient(90deg,rgba(59,232,255,.16),rgba(61,240,160,.1)); border:1px solid rgba(59,232,255,.55); font-family:var(--dsp); font-size:clamp(20px,2.4vw,30px)}

/* warm-up */
.wq{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.wqc{border-radius:24px; padding:22px 24px; background:linear-gradient(160deg,#12204A,#0A1230); border:1px solid var(--line2)}
.wqc .n{font-family:var(--mono); font-size:12.5px; letter-spacing:.18em; color:var(--cyan)}
.wqc .q{font-size:clamp(23px,2.6vw,33px); font-weight:800; line-height:1.25; margin:6px 0 12px}
.vbars2{display:grid; gap:6px; margin:8px 0}
.vbars2 div{display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; font-size:15px; font-weight:700}
.vbars2 .tr{grid-column:1/-1; height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:-3px}
.vbars2 .tr i{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--violet)); transition:width .5s}

/* ─── Memory vault ─── */
.vault{position:relative; border-radius:28px; padding:22px; overflow:hidden; border:1px solid rgba(59,232,255,.35);
  background:radial-gradient(circle at 50% 120%,rgba(61,123,255,.3),transparent 55%),radial-gradient(circle,rgba(59,232,255,.12) 1.4px,transparent 2px) 0 0/26px 26px,#050B24}
.vault::before{content:""; position:absolute; left:50%; top:-40%; width:140%; height:80%; transform:translateX(-50%); background:radial-gradient(ellipse,rgba(59,232,255,.18),transparent 60%); pointer-events:none}
.vhead{display:flex; gap:16px; align-items:center; margin-bottom:16px; position:relative; z-index:1}
.vgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; position:relative; z-index:1}
.vc{perspective:900px; height:118px; animation:hover 5s ease-in-out infinite}
.vc:nth-child(3n+2){animation-delay:-1.6s} .vc:nth-child(3n){animation-delay:-3.1s}
@keyframes hover{50%{transform:translateY(-7px)}}
.vc .in{position:relative; width:100%; height:100%; transition:transform .6s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.vc.on .in{transform:rotateY(180deg)}
.vc .fa,.vc .fb{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:10px}
.vc .fa{background:linear-gradient(160deg,rgba(30,52,120,.9),rgba(12,20,56,.95)); border:1px solid rgba(59,232,255,.45); box-shadow:0 0 30px -14px var(--cyan), inset 0 0 20px rgba(59,232,255,.08); font-weight:800; font-size:19px}
.vc .fa .e{font-size:26px; line-height:1; margin-bottom:6px}
.vc .fa small{font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:#7FA8E8; margin-top:5px}
.vc .fb{background:linear-gradient(160deg,rgba(61,240,160,.2),rgba(59,232,255,.16)); border:1px solid rgba(61,240,160,.55); transform:rotateY(180deg); font-size:15.5px; font-weight:700; line-height:1.3}
.vc .fb b{display:block; color:var(--green); font-size:14px; margin-bottom:4px}
.vc.seen .fa{border-color:rgba(61,240,160,.55)}
.memc{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:14px; letter-spacing:.1em}
.memc .bar{width:160px; height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.memc .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--green)); transition:width .5s}

/* ─── quiz (immediate feedback + retry) ─── */
.qz{display:grid; grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr); gap:26px; align-items:start}
.qz .qq{font-size:clamp(22px,2.4vw,30px); font-weight:800; line-height:1.3; margin:0 0 14px}
.qz .qq .gp{display:inline-block; min-width:110px; padding:0 10px; border-bottom:3px dashed var(--line3); color:var(--faint); text-align:center}
.qz .qq .gp.ok{border-bottom:3px solid var(--green); color:#fff; background:rgba(61,240,160,.14); border-radius:8px 8px 0 0}
.qz .opt.tried{border-color:var(--bad); background:rgba(255,61,110,.1); opacity:.7}
.qz .opt.tried .L{background:var(--bad); color:#fff}
.qz .opt.tried::after{content:"✗"; position:absolute; right:-10px; top:-10px; width:28px; height:28px; border-radius:50%; background:var(--bad); color:#fff; display:grid; place-items:center; font-weight:900; font-size:14px}
.qz .opt.shake{animation:shake .45s}
.qfb{margin-top:14px; padding:12px 16px; border-radius:14px; font-size:18px; font-weight:700}
.qfb.no{background:rgba(255,61,110,.1); border:1px solid rgba(255,61,110,.45); color:#FFD0DB}
.qscore{display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.1em; color:var(--muted)}
.qscore b{font-family:var(--dsp); font-size:30px; color:var(--green); letter-spacing:0}
.ctxc{border-radius:24px; padding:22px; min-height:220px; position:relative; overflow:hidden; background:linear-gradient(160deg,#12204A,#0A1230); border:1px solid var(--line2)}
.ctxc .k{font-family:var(--mono); font-size:12px; letter-spacing:.2em; color:var(--cyan); margin-bottom:8px}
.ctxc .big2{font-size:clamp(21px,2.3vw,28px); font-weight:800; line-height:1.35}
.ctxc .ico{font-size:52px; line-height:1; margin-bottom:10px}

/* corrupted record */
.rec2{border-radius:22px; padding:20px; background:#0A0F2A; border:1.5px dashed rgba(255,61,110,.6); position:relative; overflow:hidden; font-family:var(--mono)}
.rec2.fixed{border:1.5px solid rgba(61,240,160,.65); background:#081C26}
.rec2 .rk{display:flex; gap:10px; align-items:center; font-size:12.5px; letter-spacing:.16em; color:#FF8FA8}
.rec2.fixed .rk{color:var(--green)}
.rec2 .rk i{width:10px; height:10px; border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red); animation:blink 1s steps(2) infinite}
.rec2.fixed .rk i{background:var(--green); box-shadow:0 0 10px var(--green); animation:none}
.rec2 .rl{margin-top:12px; font-family:"Manrope",sans-serif; font-size:clamp(20px,2.2vw,27px); font-weight:800; line-height:1.35}
.rec2 .rl .x{color:#FF6B8F; letter-spacing:.06em; font-family:var(--mono)}
.rec2 .rl .y{color:var(--green); text-shadow:0 0 18px rgba(61,240,160,.5)}
.rec2 .meta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap}
.rec2 .meta span{font-size:12px; padding:3px 8px; border-radius:8px; background:rgba(255,255,255,.06); color:#9FB0D8}
.rec2::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(255,61,110,.05) 0 2px,transparent 2px 6px); pointer-events:none}
.rec2.fixed::after{display:none}

/* ─── control room ─── */
.ctrl{border-radius:28px; padding:20px; border:1px solid rgba(255,61,110,.35); background:radial-gradient(circle at 50% 0%,rgba(255,61,110,.14),transparent 60%),linear-gradient(180deg,#0A0E28,#060918)}
.mons{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.mon{border-radius:14px; padding:12px; background:#071022; border:1px solid rgba(59,232,255,.25); font-family:var(--mono); font-size:13px; position:relative; overflow:hidden; min-height:96px}
.mon::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent,rgba(59,232,255,.07) 50%,transparent); background-size:100% 30%; background-repeat:no-repeat; animation:scan 3s linear infinite}
.mon .u{display:flex; gap:8px; align-items:center; font-weight:700; color:#CFE7FF; font-size:13px}
.mon .u span{font-size:20px}
.mon .lg{margin-top:6px; color:#FF8FA8; font-size:12.5px; line-height:1.4}
.mon .lg b{color:#fff}
.mon.err{border-color:rgba(255,61,110,.6); box-shadow:0 0 22px -10px var(--red)}
.mon .st{position:absolute; right:8px; top:8px; font-size:9.5px; letter-spacing:.14em; padding:2px 6px; border-radius:6px; background:rgba(255,61,110,.2); color:#FF9BB5; animation:blink 1.4s steps(2) infinite}
.mon.ok .st{background:rgba(61,240,160,.2); color:var(--green); animation:none}
.gcards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.gc{--c:var(--cyan); border-radius:22px; padding:18px; background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); border:1px solid var(--line2); border-top:4px solid var(--c); display:flex; flex-direction:column; gap:8px}
.gc .n{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--c)}
.gc h3{font-family:var(--dsp); font-size:clamp(19px,1.8vw,24px); line-height:1.1}
.gc .f{font-family:var(--mono); font-size:13.5px; font-weight:700; padding:8px 10px; border-radius:10px; background:rgba(0,0,0,.3); border:1px solid var(--line2); color:#E5ECFF}
.gc .f b{color:var(--c)}
.gc .m{font-size:15.5px; font-weight:600; color:#D6DDF5; line-height:1.35}
.gc .ex{margin-top:auto; font-size:17px; font-weight:800; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.05); border:1px dashed var(--line3)}
.gc .ex b{color:var(--c)}
.gc.fx{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.gc .e{font-size:30px; line-height:1}

/* ─── lost chat ─── */
.lost{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px; align-items:start}
.enc{border-radius:28px; overflow:hidden; border:1px solid rgba(59,232,255,.35); background:#060B1E; box-shadow:0 0 60px -30px var(--cyan), var(--shadow)}
.enc .eh{display:flex; gap:12px; align-items:center; padding:14px 18px; background:linear-gradient(90deg,rgba(59,232,255,.12),rgba(139,92,255,.1)); border-bottom:1px solid var(--line2)}
.enc .eh b{display:block; font-family:var(--dsp); font-size:22px} .enc .eh small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--cyan)}
.enc .eh .lockic{margin-left:auto; font-family:var(--mono); font-size:11px; letter-spacing:.14em; padding:4px 10px; border-radius:99px; border:1px solid rgba(61,240,160,.5); color:var(--green)}
.enc .chat{padding:16px; gap:10px; min-height:360px}
.enc .bub{font-size:clamp(17px,1.8vw,21px); background:#121A38; border-color:rgba(159,180,217,.25)}
.enc .msg.dec .bub{animation:decGlow 1.2s ease}
@keyframes decGlow{0%{box-shadow:0 0 0 2px var(--cyan), 0 0 30px var(--cyan)}100%{box-shadow:none}}
.enc .pending{align-self:center; font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--faint); padding:6px 12px; border-radius:99px; border:1px dashed var(--line2)}
.scr2{font-family:var(--mono); color:var(--cyan)}

/* ─── reported speech ─── */
.bsg{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.bs{border-radius:18px; padding:14px 16px; background:rgba(255,255,255,.045); border:1px solid var(--line2)}
.bs .t{display:flex; align-items:center; gap:8px; font-weight:800; font-size:18px; flex-wrap:wrap}
.bs .t .a{color:var(--mia)} .bs .t .b{color:var(--cyan)} .bs .t .ar{color:var(--faint)}
.bs .d{margin-top:8px; font-size:15.5px; font-weight:600; color:#C9D2EE; line-height:1.4}
.bs .d b{color:#fff}
.bs.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}
.note20{margin-top:14px; padding:12px 16px; border-radius:14px; background:rgba(255,194,79,.08); border:1px dashed rgba(255,194,79,.5); font-size:16.5px; font-weight:700; color:#FFE7B4}
.rvg{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.rv{--c:var(--cyan); border-radius:18px; padding:14px; background:rgba(255,255,255,.045); border:1px solid var(--line2); border-top:4px solid var(--c); display:flex; flex-direction:column; gap:6px}
.rv h3{font-family:var(--dsp); font-size:24px; color:var(--c); display:flex; gap:8px; align-items:center}
.rv .m{font-size:15px; font-weight:600; color:#D6DDF5; line-height:1.3}
.rv .p{font-family:var(--mono); font-size:12.5px; font-weight:700; color:#E8EEFF; padding:6px 8px; border-radius:8px; background:rgba(0,0,0,.3)}
.rv .x{font-size:15px; font-weight:700; margin-top:auto; padding-top:4px}
.rv .x b{color:var(--c)}
.rv.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}
.qsrc{display:flex; gap:12px; align-items:flex-end; margin-bottom:12px}
.qsrc .bub{font-size:clamp(19px,2vw,24px); font-weight:800}

/* ─── timeline lab ─── */
.tlab{border-radius:28px; padding:22px; border:1px solid rgba(139,92,255,.45); background:radial-gradient(circle at 50% 0%,rgba(139,92,255,.22),transparent 60%),#070A22}
.tcs{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.tcd{--c:var(--cyan); border-radius:24px; padding:20px; background:rgba(255,255,255,.04); border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent); box-shadow:0 0 40px -24px var(--c)}
.tcd .k{font-family:var(--mono); font-size:12.5px; letter-spacing:.18em; color:var(--c)}
.tcd h3{font-family:var(--dsp); font-size:clamp(22px,2.4vw,32px); margin:4px 0 10px}
.track{position:relative; height:96px; margin:8px 4px 14px}
.track .ln{position:absolute; left:6%; right:6%; top:44px; height:4px; border-radius:4px; background:rgba(255,255,255,.12)}
.track .fl{position:absolute; top:42px; height:8px; border-radius:8px; left:12%; right:12%; background:linear-gradient(90deg,var(--c1),var(--c2)); box-shadow:0 0 16px var(--c)}
.track .fl::after{content:""; position:absolute; top:-7px; width:0; height:0; border:11px solid transparent}
.track.ab .fl{--c1:rgba(59,232,255,.2); --c2:var(--cyan)} .track.ab .fl::after{right:-14px; border-left-color:var(--cyan)}
.track.ba .fl{--c1:var(--violet); --c2:rgba(139,92,255,.2)} .track.ba .fl::after{left:-14px; border-right-color:var(--violet)}
.track .fl{animation:flow 2.4s ease-in-out infinite}
@keyframes flow{50%{filter:brightness(1.5)}}
.track .nd{position:absolute; top:24px; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:#0C1235; border:3px solid var(--line3); font-size:20px; transform:translateX(-50%)}
.track .nd.p{left:12%} .track .nd.n{left:88%}
.track .nd.cond{border-color:var(--c); box-shadow:0 0 18px var(--c)}
.track .lb{position:absolute; top:74px; transform:translateX(-50%); font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; white-space:nowrap}
.track .lb.p{left:12%} .track .lb.n{left:88%}
.track .lb small{display:block; color:var(--c); font-size:10.5px}
.tcd .f{font-family:var(--mono); font-size:15px; font-weight:700; padding:10px 12px; border-radius:12px; background:rgba(0,0,0,.3); border:1px solid var(--line2)}
.tcd .f b{color:var(--c)}
.tcd .ex{margin-top:10px; font-size:clamp(18px,1.9vw,23px); font-weight:800; line-height:1.35}
.tcd .ex .c1{color:var(--amber)} .tcd .ex .c2{color:var(--green)}
.tcd .mn{margin-top:8px; font-size:16px; font-weight:600; color:#C9D2EE}
.tcd.fx{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.tw2{font-weight:900; color:var(--amber); border-bottom:2px solid var(--amber)}

/* ─── mission complete ─── */
.mdone{position:relative; text-align:center; border-radius:30px; padding:30px 24px; overflow:hidden; border:1px solid rgba(61,240,160,.5);
  background:radial-gradient(circle at 50% 0%,rgba(61,240,160,.22),transparent 60%),radial-gradient(circle,rgba(59,232,255,.08) 1.4px,transparent 2px) 0 0/24px 24px,#061226}
.mdone .stp{display:inline-block; font-family:var(--dsp); font-size:clamp(30px,4.6vw,62px); line-height:1; color:var(--green); border:5px solid var(--green); border-radius:18px; padding:8px 24px; transform:rotate(-3deg); text-shadow:0 0 30px rgba(61,240,160,.6); box-shadow:0 0 40px -10px var(--green)}
.mdone .stp.fx{animation:bigStamp .7s cubic-bezier(.2,.9,.3,1.4) both}
.lockbreak{font-size:64px; display:inline-block; margin-bottom:8px}
.lockbreak.fx{animation:lockB 1s ease both}
@keyframes lockB{0%{transform:scale(.4) rotate(-20deg); opacity:0}40%{transform:scale(1.3) rotate(10deg); opacity:1}100%{transform:none}}
.mdone .lines{display:grid; gap:10px; max-width:860px; margin:22px auto 0; text-align:left}
.bigesc{max-width:620px; margin:20px auto 0}
.bigesc .bb{height:16px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line2)}
.bigesc .bb i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--violet),var(--green)); box-shadow:0 0 18px var(--cyan); transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bigesc .t{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin-bottom:6px}
.keyrow{display:flex; justify-content:center; gap:12px; margin-top:14px}
.keyrow span{width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:24px; background:rgba(255,255,255,.04); border:1px dashed var(--line3); filter:grayscale(1); opacity:.5}
.keyrow span.on{filter:none; opacity:1; border:1px solid rgba(61,240,160,.6); background:rgba(61,240,160,.1); box-shadow:0 0 20px -6px var(--green)}
.keyrow span.new{animation:keyIn 1.2s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes keyIn{0%{transform:scale(2.4) rotate(-90deg); opacity:0}60%{transform:scale(.9) rotate(10deg); opacity:1}100%{transform:none}}

/* memory key */
.mkey{width:min(320px,70%); margin:6px auto 0; filter:drop-shadow(0 0 30px rgba(59,232,255,.8))}
.mkey svg{width:100%; height:auto; display:block}
.mkey.fx{animation:mkeyIn 1.6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes mkeyIn{0%{transform:scale(.2) rotate(-180deg); opacity:0}70%{transform:scale(1.08) rotate(8deg); opacity:1}100%{transform:none}}
.mkey .shine{animation:shineK 2.6s linear infinite}
@keyframes shineK{from{transform:translateX(-260px)} to{transform:translateX(320px)}}

/* ─── Alias ─── */
.alias{display:grid; grid-template-columns:1.05fr .95fr; gap:24px; align-items:start}
.launch{display:flex; align-items:center; justify-content:center; gap:14px; width:100%; padding:24px; border-radius:24px; font-family:var(--dsp); font-size:clamp(24px,3vw,38px); letter-spacing:.02em; text-decoration:none; color:#030716;
  background:linear-gradient(135deg,var(--cyan),var(--blue) 50%,var(--violet)); box-shadow:0 0 0 2px rgba(255,255,255,.12) inset, 0 20px 50px -18px var(--cyan); animation:btnPulse 2.2s ease-in-out infinite; transition:transform .15s}
.launch:hover{transform:translateY(-2px) scale(1.01)}
.launch small{display:block; font-family:var(--mono); font-size:12px; letter-spacing:.16em; opacity:.75}
.steps5{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:9px}
.steps5 li{display:flex; gap:12px; align-items:center; padding:11px 14px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:clamp(17px,1.8vw,21px); font-weight:800}
.steps5 li::before{counter-increment:s; content:counter(s); width:34px; height:34px; flex:0 0 34px; border-radius:10px; display:grid; place-items:center; background:var(--cyan); color:#04111A; font-family:var(--mono)}
.tctl{border-radius:20px; padding:16px; background:rgba(255,194,79,.06); border:1px dashed rgba(255,194,79,.5)}
.tctl .k{font-family:var(--mono); font-size:11.5px; letter-spacing:.18em; color:var(--amber); margin-bottom:10px}
.tctl .g{display:grid; grid-template-columns:1fr 1fr; gap:8px}

/* ─── Memory Archive ─── */

.atog{display:flex; gap:6px}

/* summary */
.sum20{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sumc h3{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin-bottom:10px}

/* grammar recap modal */
.grec{display:grid; grid-template-columns:1fr 1fr; gap:14px}

/* how to play */

/* mission map */

.mm.cur{border-color:var(--cyan); background:rgba(59,232,255,.08)} .mm.cur .s{color:var(--cyan)}

.mm .btn{margin-top:auto}

/* teacher-only styling */
#teacher{border-left:2px solid rgba(255,194,79,.6)}

.tonly{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; padding:2px 8px; border-radius:99px; background:var(--amber); color:#1A1200; font-weight:700}
.uat{padding:10px 14px; border-radius:12px; background:rgba(255,216,107,.08); border:1px dashed rgba(255,216,107,.45); font-weight:700; margin-bottom:8px}

/* student app */
.avpick{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.avpick button{width:46px; height:46px; border-radius:14px; font-size:24px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2)}
.avpick button.on{border-color:var(--cyan); background:rgba(59,232,255,.16); box-shadow:0 0 0 2px rgba(59,232,255,.3)}
.verif{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--green)}

html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important; transition:none!important}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
@media (max-width:1100px){ #esc .eb{width:70px} #esc .keys{display:none} }

  .hero20,.feedwrap,.intro,.qz,.lost,.alias,.escape{grid-template-columns:1fr}

  #esc small{display:none} #esc .eb{width:50px} .atbl td.ex,.atbl th.ex{display:none} .atbl td.en{white-space:normal}
  .atbl td.xp,.atbl th.xp{display:none} .tctl .g{grid-template-columns:1fr} .algo{--s:170px}
