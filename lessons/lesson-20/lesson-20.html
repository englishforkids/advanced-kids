}
/* ── round 2 fixes ── */
a.btn{color:var(--text)}

.hero20 h1{font-size:clamp(44px,5.6vw,86px)}

.tr7{margin:0; padding:14px 18px 16px 40px; display:grid; gap:7px; font-size:17px; font-weight:600; line-height:1.4}

.track .fl::after{display:none}

/* ── transition slides ── */
.trslide{position:relative; height:max(420px,calc(100vh - 200px)); border-radius:30px; overflow:hidden; cursor:pointer; isolation:isolate;
  background:radial-gradient(circle at 70% 40%,rgba(61,123,255,.35),transparent 55%),radial-gradient(circle at 20% 80%,rgba(209,75,255,.25),transparent 50%),#050A20;
  border:1px solid rgba(59,232,255,.35); box-shadow:0 0 80px -30px var(--cyan), var(--shadow)}
.trslide .trimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; transform-origin:60% 40%}
.trslide.go .trimg{animation:kenB 14s ease-out both}
@keyframes kenB{from{transform:scale(1.14)} to{transform:scale(1)}}
.trslide .trfb{display:none}
.trslide.nofile .trfb{display:grid; place-items:center; position:absolute; inset:0 0 0 38%; z-index:0}
.trslide.nofile .trfb .algo{--s:min(440px,52vh)} .trslide.nofile .trfb .portal{max-width:min(520px,60vh)} .trslide.nofile .trfb .stagePortal{max-width:min(560px,62vh)}
.trshade{position:absolute; inset:0; z-index:1; background:linear-gradient(90deg,rgba(4,7,20,.92) 0%,rgba(4,7,20,.55) 42%,rgba(4,7,20,0) 70%),linear-gradient(0deg,rgba(4,7,20,.85),transparent 45%)}
.trscan{position:absolute; inset:0; z-index:2; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 5px)}
.trslide.go .trscan::after{content:""; position:absolute; left:0; right:0; height:3px; top:0; background:linear-gradient(90deg,transparent,var(--cyan),transparent); box-shadow:0 0 18px var(--cyan); animation:trLine 1.6s ease-out both}
@keyframes trLine{from{top:0; opacity:1} to{top:100%; opacity:0}}
.trtext{position:absolute; left:5%; bottom:9%; right:40%; z-index:3}
.trkick{font-family:var(--mono); font-size:clamp(13px,1.3vw,18px); letter-spacing:.3em; color:var(--cyan); text-shadow:0 0 14px rgba(59,232,255,.6)}
.trtext h2{font-family:var(--dsp); font-size:clamp(44px,7vw,112px); line-height:.92; letter-spacing:-.035em; margin-top:10px; color:#fff; text-shadow:0 4px 40px rgba(0,0,0,.6), 0 0 30px rgba(59,232,255,.35)}
.trtext p{margin:16px 0 0; font-size:clamp(19px,2vw,28px); font-weight:700; color:#DCE7FF; max-width:760px}
.trslide.go .trkick{animation:trIn .7s .15s cubic-bezier(.2,.8,.2,1) both}
.trslide.go h2{animation:trIn .8s .3s cubic-bezier(.2,.8,.2,1) both, glitch2 3.4s 1.4s infinite}
.trslide.go .trtext p{animation:trIn .8s .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes trIn{from{opacity:0; transform:translateY(26px); filter:blur(6px)} to{opacity:1; transform:none; filter:none}}
.trhint{position:absolute; right:3%; bottom:5%; z-index:3; font-family:var(--mono); font-size:13px; letter-spacing:.16em; padding:8px 14px; border-radius:99px; border:1px solid rgba(59,232,255,.45); color:#CFF8FF; background:rgba(4,7,20,.6)}
.trslide.go .trhint{animation:fadeIn .6s 1.2s both}
@media (max-width:760px){ .trtext{right:5%} .trslide.nofile .trfb{inset:0 0 30% 0} }
@keyframes glitch2{0%,88%,100%{text-shadow:0 4px 40px rgba(0,0,0,.6),0 0 30px rgba(59,232,255,.35); transform:none; clip-path:none}
  90%{text-shadow:-4px 0 var(--cyan),4px 0 var(--algo2); transform:translateX(3px); clip-path:inset(10% 0 30% 0)}
  93%{text-shadow:4px 0 var(--violet),-4px 0 var(--cyan); transform:translateX(-3px); clip-path:inset(40% 0 5% 0)}
  96%{transform:none; clip-path:none}}
.wrap.wide{max-width:none; padding:12px 16px 16px}
.wrap.wide .trslide{height:max(420px,calc(100vh - 160px))}
.trslide.nofile .trfb{inset:0 0 0 46%}
.trslide.top .trshade{background:linear-gradient(180deg,rgba(4,7,20,.9) 0%,rgba(4,7,20,.45) 34%,rgba(4,7,20,0) 58%),linear-gradient(0deg,rgba(4,7,20,.5),transparent 30%)}
.trslide.top .trtext{left:5%; right:5%; top:7%; bottom:auto; text-align:center}
.trslide.top .trtext p{margin-inline:auto}
/* square / portrait slide images: whole picture on the right + blurred fill */
.trslide .trblur{position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; z-index:0; filter:blur(34px) brightness(.42) saturate(1.3)}
.trslide .trimg.side{inset:auto; right:4%; top:50%; width:auto; height:86%; aspect-ratio:1; max-width:52%; object-fit:cover; transform:translateY(-50%); border-radius:28px;
  border:1px solid rgba(59,232,255,.45); box-shadow:0 0 0 6px rgba(4,7,20,.5), 0 0 80px -10px rgba(59,232,255,.55), 0 40px 80px -30px #000}
.trslide.go .trimg.side{animation:sideIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sideIn{from{opacity:0; transform:translateY(-50%) translateX(40px) scale(.94)} to{opacity:1; transform:translateY(-50%)}}
.trslide.sidefit .trshade{background:linear-gradient(90deg,rgba(4,7,20,.85) 0%,rgba(4,7,20,.4) 45%,rgba(4,7,20,0) 60%)}
.trslide.sidefit .trtext{right:52%; bottom:auto; top:50%; transform:translateY(-50%)}
.trslide.sidefit .trhint{z-index:4}
@media (max-width:760px){ .trslide .trimg.side{height:auto; width:84%; max-width:none; right:8%; top:6%; transform:none} .trslide.go .trimg.side{animation:fadeIn .8s both} .trslide.sidefit .trtext{right:5%; top:auto; bottom:6%; transform:none} }
</style>

/* ============================================================
   LESSON 20 · UNIT 2 REVISION · "ESCAPE THE ALGORITHM"

   Нове: місії з прогресом втечі (0–100%), Memory Archive (36 виразів),
   Alias, підписані повідомлення вчителя в Live-режимі.
   ============================================================ */
const CFG = window.LESSON_CONFIG || {};
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

  i:0, sd:{}, core:false, sound:true, noanim:false,
  done:{},                     // missions completed: 1–5 -> true

function applyAnim(){ REDUCED = REDUCED_OS || !!S.noanim; document.documentElement.classList.toggle('noanim', !!S.noanim); }

const SFX = {
  ctx:null,
  tone(f,t=.12,type='sine',vol=.07,delay=0){
    if(!S.sound) return;
    try{ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; this.ctx=new C(); }
      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+delay;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+t);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+t+.02); }catch(e){}
  },
  pop(){ this.tone(660,.09,'triangle',.06); },
  ping(){ this.tone(1320,.12,'sine',.06); this.tone(1760,.16,'sine',.04,.08); },
  ok(){ this.tone(740,.1,'sine',.07); this.tone(990,.14,'sine',.07,.09); },
  no(){ this.tone(220,.18,'sawtooth',.04); },
  glitch(){ [180,900,240,1400,120].forEach((f,i)=>this.tone(f,.06,'square',.03,i*.05)); },
  unlock(){ [523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.18,'triangle',.06,i*.08)); },
  bell(){ [0,.35,.7].forEach(d=>{ this.tone(880,.3,'sine',.09,d); this.tone(1320,.25,'sine',.05,d); }); }
};

  const C=CHARS[k]; const sz = size ? `--s:${size}px;` : '';

  if(k==='user') return `<i class="av user-av" style="${sz}" role="img" aria-label="Unknown User">?</i>`;
  if(C.emo) return `<i class="av emo" style="${sz}--c:${C.c}" role="img" aria-label="${C.name}">${C.emo}</i>`;
  return `<i class="av" style="${sz}--c:${C.c}" role="img" aria-label="${C.name}">${C.name[0]}${C.photo?`<img src="${C.photo}" alt="" onerror="this.remove()">`:''}</i>`;
}

}

  return `<div class="line ${o.fx?'fx':''}" style="${o.delay?`animation-delay:${o.delay}s`:''}">${av(k,o.size||46)}<div class="bub"><span class="who" style="color:${C.c}">${C.name}</span>${esc(text)}</div></div>`;
}

function burst(el, set=['✨','⭐','💥','✨']){
  if(!el || REDUCED) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.textContent=set[i%set.length];
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;z-index:96;pointer-events:none;font-size:${18+Math.random()*16}px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s`;
    document.body.appendChild(s); const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    requestAnimationFrame(()=>{ s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*180}deg)`; s.style.opacity='0'; });

}

    later(()=>{ const l=e.closest('.line'); if(l){ l.style.visibility=''; l.classList.add('fx'); } e.classList.add('twc'); let k=0;
      const step=()=>{ k+=2; e.textContent=txt.slice(0,k); if(k<txt.length) LOOPS.push(setTimeout(step,speed)); else e.classList.remove('twc'); }; step(); if(i===0) SFX.tone(300,.05,'square',.02); }, t);
    t += Math.ceil(txt.length/2)*speed + 380; });
}

/* ---------- 5c · quiz: immediate feedback, retry, teacher reveal, phone votes ---------- */
function quizStep(c){
  const items=c.items, n=items.length, K=p=>c.id+'-'+p;
  const P = d => Math.min(d.p||0, n-1);
  const solved = (d,p)=> !!((d.ok||{})[K(p)] || (d.sh||{})[K(p)]);
  const nSolved = d => items.filter((x,i)=>solved(d,i)).length;
  return Object.assign({
    parts:()=>n,
    render(d){
      const p=P(d), it=items[p], key=K(p), ok=(d.ok||{})[key], sh=(d.sh||{})[key], sv=ok||sh, tried=(d.tr||{})[key]||[], cnt=counts(key,it.opts.length);
      const opts=it.opts.map((o,i)=>{ let cl=''; if(sv && i===it.a) cl='right '+(FX.has('okq')||FX.has('reveal')?'fx':''); else if(tried.includes(i)) cl='tried '+(FX.has('no'+i)?'shake':''); else if(sv) cl='dim';
        return `<button class="opt ${cl}" data-q="${i}" ${sv?'aria-disabled="true"':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span><span class="n">${cnt[i]||''}</span></button>`; }).join('');
      const qtxt = c.qHTML ? c.qHTML(it,sv) : esc(it.q);
      let fb='';
      if(ok) fb=`<div class="explain stamp"><div class="k">✅ CORRECT${tried.length?' · SOLVED ON TRY '+(tried.length+1):''}</div><p>${it.why}</p></div>`;
      else if(sh) fb=`<div class="explain stamp"><div class="k">👁 ANSWER</div><div class="a">${LET[it.a]} · ${esc(it.opts[it.a])}</div><p>${it.why}</p></div>`;
      else if(tried.length) fb=`<div class="qfb no pop-in">✗ Not quite — try again! ${c.retry?c.retry(it):''}</div>`;
      const last=p===n-1, all=nSolved(d)===n;
      return `${c.top?c.top(d):''}<div class="deckbar"><span class="kick">${c.kicker||''} · ${p+1}/${n}</span><span class="grow"></span>
          <div class="qscore">${c.unit||'SOLVED'} <b>${nSolved(d)}/${n}</b></div>
          <div class="cdots">${items.map((x,i)=>`<button data-card="${i}" class="${i===p?'cur':''} ${solved(d,i)?'done':''}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div></div>
        <div class="qz"><div class="${fx('part')||fx('enter')?'pop-in':''}">${c.left(it,p,sv,d)}</div>
          <div><p class="qq">${qtxt}</p><div class="opts">${opts}</div>
            ${hintBox(d, c.hintTxt?c.hintTxt(it):'Read it again slowly. Which option sounds right?')}${fb}
            ${sv?`<div class="row mt">${!last?`<button class="btn primary caps" data-act="next">Next ${c.word||'question'} →</button>`:all?`<button class="btn primary caps pulse" data-act="next">${esc(c.doneLbl||'Continue')} →</button>`:`<span class="small">${n-nSolved(d)} left — tap the numbers above.</span>`}</div>`
              :`<p class="small mt">Say your answer first, then tap it. Wrong? Try again! ${S.live?'Phones can vote too.':''}</p>`}
          </div></div>`;
    },
    bind(root,d){
      const p=P(d), it=items[p], key=K(p);

      $$('[data-q]',root).forEach(b=>b.onclick=()=>{
        if(solved(d,p)) return; const i=+b.dataset.q;
        if(i===it.a){ (d.ok=d.ok||{})[key]=true; SFX.ok(); FX.add('okq'); save(); draw(false,true); burst($('.opt.right',root)); c.onSolve&&c.onSolve(p,d); }
        else { d.tr=d.tr||{}; const t=d.tr[key]=d.tr[key]||[]; if(!t.includes(i)) t.push(i); SFX.no(); FX.add('no'+i); save(); draw(false,true); }
      });
      $$('[data-card]',root).forEach(b=>b.onclick=()=>{ d.p=+b.dataset.card; d.hint=false; FX.add('part'); save(); draw(false,true); });
      if(FX.has('reveal')) setTimeout(()=>burst($('.opt.right',root)),60);
      c.bind2 && c.bind2(root,d);
    },
    hint(d){ d.hint=!d.hint; },
    reveal(d){ const key=K(P(d)); d.sh=d.sh||{}; d.sh[key]=!d.sh[key]; if(d.sh[key]) SFX.ok(); },
    revealLbl:d=> (d.sh||{})[K(P(d))] ? 'Hide answer' : 'Reveal answer',
    onPart(d){ d.hint=false; },
    nextLbl(d){ return P(d)<n-1 ? 'Next question' : null; },
    gate(d){ const p=P(d); if(!solved(d,p)) return 'This question isn’t solved yet'; if(p===n-1 && nSolved(d)<n) return `${n-nSolved(d)} question(s) still unsolved`; return null; },
    get ans(){ return items.map((x,i)=>`${i+1}. ${LET[x.a]} — ${x.opts[x.a]} · ${strip(x.why)}`); },
    get ua(){ return items.map((x,i)=>`${i+1}. ${x.ua||''}`); },
    live(){ const d=sd(c.id), p=P(d), it=items[p], key=K(p), sv=solved(d,p);
      return {kind:'choice', id:key, q:strip(c.liveQ?c.liveQ(it):it.q), opts:it.opts, lock:sv, correct:sv?it.a:null}; }
  }, c);
}

/* ---------- 5e · THE MEMORY ARCHIVE (screen + overlay, search EN/UA) ---------- */
const OPEN = new Set();
const normA = s => String(s||'').toLowerCase().replace(/[’‘`´ʼ']/g,"'").replace(/\s+/g,' ').trim();
function hlA(text, q){ const t=esc(text); if(!q) return t; const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'|&#39;/g,"(?:&#39;|’|ʼ|')");
  try{ return t.replace(new RegExp('('+qe+')','gi'),'<mark>$1</mark>'); }catch(e){ return t; } }
function boldExpr(ex, w){ const first=w.split(/[\s-]/)[0].slice(0,4); const t=esc(ex);
  try{ const r=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i'); if(r.test(t)) return t.replace(r,'<b>$1</b>');
    return t.replace(new RegExp('(\\b'+first+'\\w*)','i'),'<b>$1</b>'); }catch(e){ return t; } }
function archiveHTML(mode){
  const A=S.arc;
  return `<div class="arch ${A.ex?'':'noex'} ${A.ua?'':'noua'}" data-arch>
    <div class="ah"><div class="row" style="align-items:flex-start"><div class="grow"><div class="kick">📚 UNIT 2 · LESSONS 11–19</div><h2 class="neonT">THE MEMORY ARCHIVE</h2><p>36 expressions. One digital survival guide.</p></div>
      ${mode==='modal'?`<button class="btn neon" data-arcclose>↩ Return to mission</button>`:''}</div></div>
    <div class="atools"><label class="asearch">🔍<input data-arcq type="search" placeholder="Search in English or Ukrainian…" value="${esc(A.q)}" aria-label="Search the archive" autocomplete="off" spellcheck="false"><button type="button" data-arcclear aria-label="Clear search" title="Clear search">✕</button></label>
      <div class="acats">${[['all','All']].concat(Object.entries(CATS)).map(([k,v])=>`<button data-cat="${k}" class="${A.cat===k?'on':''}">${esc(v)}</button>`).join('')}</div>
      <div class="atog"><button data-tog="ex" class="${A.ex?'on':''}" aria-pressed="${!!A.ex}">Examples</button><button data-tog="ua" class="${A.ua?'on':''}" aria-pressed="${!!A.ua}">УКР</button></div></div>
    <div class="acount" data-arccount></div>
    <table class="atbl"><thead><tr><th>ENGLISH EXPRESSION</th><th class="ua">УКРАЇНСЬКОЮ</th><th class="xp">SIMPLE ENGLISH EXPLANATION</th><th class="ex">EXAMPLE</th></tr></thead><tbody data-arcbody></tbody></table></div>`;
}
function arcRowsHTML(){
  const A=S.arc, q=normA(A.q);
  const rows=ARCHIVE.map((a,i)=>({a,i})).filter(({a})=>(A.cat==='all'||a[4]===A.cat) && (!q || a.slice(0,4).some(x=>normA(x).includes(q))));
  const html = rows.length ? rows.map(({a,i})=>{ const o=OPEN.has(i);
    return `<tr class="r ${o?'open':''}" data-row="${i}" tabindex="0" aria-expanded="${o}"><td class="en"><span class="chev">▸</span>${hlA(a[0],A.q)}</td><td class="ua">${hlA(a[1],A.q)}</td><td class="xp">${hlA(a[2],A.q)}</td><td class="ex">${hlA(a[3],A.q)}</td></tr>`
     + (o?`<tr class="det"><td colspan="4"><div class="adet"><span class="w">${esc(a[0])}</span><span class="tg">${esc(CATS[a[4]])}</span><span class="tg">Lesson ${a[5]}</span>
        <p>💡 ${esc(a[2])}</p><p class="e">💬 ${boldExpr(a[3],a[0])}</p><p class="small ua" style="font-size:16px">🇺🇦 ${esc(a[1])}</p></div></td></tr>`:''); }).join('')
    : `<tr><td colspan="4" class="aempty">No expressions found for “${esc(A.q)}”. Try another word — or clear the search.</td></tr>`;
  return {html, n:rows.length};
}
function paintArc(root){ const b=$('[data-arcbody]',root); if(!b) return; const r=arcRowsHTML(); b.innerHTML=r.html;
  $('[data-arccount]',root).textContent=`Showing ${r.n} of ${ARCHIVE.length} expressions${S.arc.q?` for “${S.arc.q}”`:''}${S.arc.cat!=='all'?` · ${CATS[S.arc.cat]}`:''} · tap a row for details`;
  $$('[data-row]',b).forEach(tr=>{ const tg=()=>{ const i=+tr.dataset.row; OPEN.has(i)?OPEN.delete(i):OPEN.add(i); SFX.pop(); paintArc(root); const n=$(`[data-row="${i}"]`,root); if(n) n.focus({preventScroll:true}); };
    tr.onclick=tg; tr.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tg(); } }; }); }
function bindArchive(root){
  const inp=$('[data-arcq]',root), arch=$('[data-arch]',root);
  inp.oninput=()=>{ S.arc.q=inp.value.slice(0,40); save(); paintArc(root); };
  inp.onkeydown=e=>{ if(e.key==='Escape' && inp.value){ e.stopPropagation(); inp.value=''; S.arc.q=''; save(); paintArc(root); } };
  $('[data-arcclear]',root).onclick=()=>{ inp.value=''; S.arc.q=''; save(); paintArc(root); inp.focus(); };
  $$('[data-cat]',root).forEach(b=>b.onclick=()=>{ S.arc.cat=b.dataset.cat; save(); $$('[data-cat]',root).forEach(x=>x.classList.toggle('on',x===b)); SFX.pop(); paintArc(root); });
  $$('[data-tog]',root).forEach(b=>b.onclick=()=>{ const k=b.dataset.tog; S.arc[k]=!S.arc[k]; save(); b.classList.toggle('on',S.arc[k]); b.setAttribute('aria-pressed',String(S.arc[k])); arch.classList.toggle(k==='ex'?'noex':'noua',!S.arc[k]); });
  const cl=$('[data-arcclose]',root); if(cl) cl.onclick=closeModal;
  paintArc(root);
}

const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt) && !(S.notr && s.tr); };

const GATE = {id:null, t:0};
/* “Do not let students accidentally skip ahead”: an unfinished task warns once; a second Continue (teacher) goes on */
function gateOK(s,d){
  const g = s.gate && s.gate(d); if(!g) return true;
  const key=s.id+':'+(d.p||0);
  if(GATE.id===key) { GATE.id=null; return true; }

function checkComplete(s,d){ if(s.completes && (d.p||0)>=(s.completeAt||0)) complete(s.completes); }
function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if(!gateOK(s,d)) return;
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; s.onPart&&s.onPart(d); FX.add('part'); checkComplete(s,d); save(); draw(true,true); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length){ s.leave&&s.leave(d); go(k); } else toast('That’s the end of the lesson 🎉 — Finish Lesson is on this screen');

function back(){
  const s=cur(), d=sd(s.id);

  let k=S.i-1; while(k>=0 && !visible(k)) k--;

function go(k){

  if(!TIMER.run() && S.timer.for!==s.id && (s.tsec || !TIMER.dirty())) TIMER.set(s.tsec||Math.round(s.min*60), s.id);
  checkComplete(s,d);

  save(); draw(true); $('#stage').scrollTop=0;
}
/* jump to a stage from the progress row / mission map. Locked missions ask first (teacher override). */

/* activity timer: suggested duration of each screen; never moves on by itself */
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  dirty: ()=> S.timer.left>0 && S.timer.left<S.timer.total,
  set(sec,label){ S.timer={total:sec, left:sec, endAt:0, for:label||''}; save(); pubState(); },
  start(){ if(this.left()<=0) S.timer.left=S.timer.total; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  add(sec){ if(this.run()) S.timer.endAt+=sec*1000; else S.timer.left=this.left()+sec; S.timer.total=Math.max(S.timer.total, Math.ceil(this.left())); save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');

    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.tone(660,.25,'sine',.04); SFX.tone(880,.3,'sine',.03,.2); toast('⏰ Time’s up! Nothing moves on automatically — continue when you’re ready.'); pubState(); if(['rooms','alias'].includes(cur().id)){ draw(false,true); burst($('#ring')||$('#aliasT'),['⏰','🔔','✨']); } }
  }

/* ---------- 9 · live classroom (optional): Supabase Realtime broadcast + presence; BroadcastChannel fallback ----------
   Учитель — єдине джерело стану. Захист керування:
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto). Приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток (fingerprint) публічного ключа, а при ручному вході учень вводить
     код кімнати + 6-символьний ключ вчителя з екрана. Телефон приймає стан і завдання ЛИШЕ з правильним підписом;
   • учні можуть надсилати тільки hello / ans / work / submit / react — і не бачать правильних відповідей,

const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();

const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','⚡'];
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');

  async init(){

    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson20-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);

      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },

const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';

const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l20sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l20sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');

      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson20-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }

      this.bc=new BroadcastChannel('lesson20-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);

      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
/* teacher → phones: signed envelope {t:'sig', body, sig, pk} */
async function sendSigned(p){

else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnArc').onclick=openArchive; $('#btnRoute').onclick=toggleRoute; $('#btnLive').onclick=openLive; $('#btnPres').onclick=presentMode; $('#btnReset').onclick=askReset;
  $('#esc').onclick=showMap; $('#esc').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); showMap(); } };
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button,a,[role=button],tr'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='v'||k==='V') openArchive();
    else if(k==='p'||k==='P') presentMode();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A'||k==='r'||k==='R') doReveal();
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  Object.values(CHARS).forEach(c=>{ if(c.photo){ const im=new Image(); im.src=c.photo; } });
  ['feed-1.webp','feed-2.webp','feed-3.webp','skate.webp'].forEach(f=>{ const im=new Image(); im.src=feedImg(f); });
  draw(true);
  if(S.live) startLive(true);
}

</script>
</body>
</html>
