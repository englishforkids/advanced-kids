.qwrap.side{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:stretch;align-content:stretch;gap:1.6rem}
.qwrap.side{justify-items:stretch}
.qwrap.side>.scene{min-height:16rem}
.qwrap.side>.qcard{align-self:center}
.qcard{width:min(60rem,100%);display:flex;flex-direction:column;gap:1rem}
.qtop{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.qtext{font-family:var(--fd);font-size:clamp(1.6rem,2.8vw,2.5rem);line-height:1.15;font-weight:600}
.qtext .gap{display:inline-block;min-width:3.2rem;border-bottom:3px solid var(--cy);color:var(--cy);text-align:center}
.qtext .gap.fill{border-color:var(--ok);color:var(--ok)}
.opts{display:grid;gap:.7rem}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:.9rem;text-align:left;border:2px solid var(--line);background:rgba(21,29,50,.9);border-radius:18px;padding:.85rem 1.1rem;font-size:1.25rem;font-weight:600;min-height:3.8rem;transition:border-color .15s,background .15s,transform .1s,opacity .2s}
.opt:hover:not([disabled]){border-color:rgba(139,92,246,.7);background:rgba(29,41,65,.95)}
.opt .L{flex:none;width:2.3rem;height:2.3rem;border-radius:12px;display:grid;place-items:center;background:var(--s3);font-family:var(--fd);font-weight:700}
.opts.three .opt .st{font-size:1.1rem}
.opt .st{margin-left:auto;font-size:.78rem;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.opt.pick{border-color:var(--pur);background:rgba(139,92,246,.18)}
.opt.pick .L{background:var(--pur);color:#fff}
.opt.right{border-color:var(--ok);background:rgba(52,211,153,.16)}
.opt.right .L{background:var(--ok);color:#052e1f}
.opt.miss{border-color:rgba(251,191,36,.7);background:rgba(251,191,36,.08)}
.opt.fade{opacity:.5}
.opt[disabled]{cursor:default}
.expl{display:flex;gap:.8rem;align-items:flex-start;border-left:4px solid var(--ok);background:rgba(52,211,153,.1);border-radius:0 14px 14px 0;padding:.7rem 1rem;font-size:1.1rem;animation:pop .3s both}
.expl b{color:#A7F3D0}
.hintbox{border-left:4px solid var(--amb);background:rgba(251,191,36,.08);border-radius:0 14px 14px 0;padding:.55rem .9rem;font-size:1rem;animation:pop .3s both}
.tally{font-size:.72rem;font-weight:800;color:var(--cy);border:1px solid rgba(34,211,238,.4);border-radius:999px;padding:.05rem .45rem;margin-left:.4rem}

/* ---------- decisions ---------- */
.dec{display:grid;gap:.8rem}
.dec .opt{font-size:1.2rem}
.cq{display:flex;gap:.8rem;align-items:flex-start;border:1px solid rgba(251,191,36,.55);background:rgba(251,191,36,.09);border-radius:16px;padding:.8rem 1rem;font-size:1.12rem;animation:pop .3s both}
.cq .ic{font-size:1.5rem}
.cq .t{font-weight:800;font-size:.72rem;letter-spacing:.18em;color:var(--amb);margin-bottom:.2rem}
.clue{display:flex;align-items:center;gap:1rem;border:1px solid rgba(34,211,238,.7);border-radius:18px;padding:.8rem 1.1rem;background:linear-gradient(110deg,rgba(34,211,238,.18),rgba(139,92,246,.2));box-shadow:0 0 0 0 rgba(34,211,238,.6);animation:cluein .7s ease both}
@keyframes cluein{0%{opacity:0;transform:scale(.92);box-shadow:0 0 0 0 rgba(34,211,238,.7)}60%{opacity:1;transform:scale(1.02);box-shadow:0 0 0 18px rgba(34,211,238,0)}100%{transform:none}}
.clue .k{font-family:var(--fd);font-size:.72rem;letter-spacing:.24em;color:var(--cy);font-weight:700}
.clue .v{font-family:var(--fd);font-size:1.5rem;font-weight:700}
.clue .ic{font-size:2rem}
.cluelist{display:flex;gap:.6rem;flex-wrap:wrap}
.cl{display:inline-flex;align-items:center;gap:.4rem;border:1px dashed rgba(168,181,204,.35);border-radius:12px;padding:.3rem .7rem;font-size:.85rem;color:var(--tx2)}
.cl.on{border-style:solid;border-color:rgba(34,211,238,.6);color:#E0FBFF;background:rgba(34,211,238,.08)}

/* ---------- grammar portals ---------- */
.ptitle{display:flex;align-items:center;gap:1rem}
.pno{font-family:var(--fd);font-size:2.6rem;font-weight:700;width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--cy);color:var(--cy);box-shadow:0 0 24px rgba(34,211,238,.35),inset 0 0 18px rgba(34,211,238,.25);flex:none}
.pno.done{border-color:var(--ok);color:var(--ok);box-shadow:0 0 24px rgba(52,211,153,.35)}
.origmsg{display:flex;align-items:center;gap:.8rem;font-size:1.35rem}
.origmsg .bub{background:var(--s2);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:.55rem .9rem}
.rule{border:1px solid rgba(139,92,246,.5);background:rgba(139,92,246,.1);border-radius:16px;padding:.8rem 1rem;font-size:1.12rem}
.forms{display:grid;gap:.5rem}
.form{display:flex;gap:.8rem;align-items:baseline;background:rgba(21,29,50,.9);border:1px solid var(--line);border-radius:14px;padding:.55rem .9rem;font-size:1.12rem}
.form .l{font-family:var(--fd);font-size:.74rem;letter-spacing:.16em;color:var(--cy);font-weight:700;min-width:7.5rem}
.form b,.exs b{color:#FDE68A}
.exs{display:grid;gap:.35rem;font-size:1.15rem}
.exs div::before{content:'→ ';color:var(--pur2)}
.note{font-size:.95rem;color:#C7D2FE}
.mini-rule{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.86rem;color:var(--tx2)}
.mini-rule b{color:var(--tx)}
.restored{display:flex;align-items:center;gap:.6rem;font-family:var(--fd);font-weight:700;letter-spacing:.2em;color:var(--ok);font-size:.95rem;animation:pop .4s both}
.plist{display:grid;gap:.8rem;width:min(40rem,100%)}
.plist .it{display:flex;align-items:center;gap:1rem;padding:.8rem 1.1rem;border-radius:16px;border:1px solid rgba(52,211,153,.45);background:rgba(52,211,153,.08);font-family:var(--fd);font-size:1.3rem;font-weight:700;letter-spacing:.06em;animation:pop .4s both}
.plist .it.no{border-color:var(--line);background:transparent;color:var(--tx2)}

/* ---------- future / speaking ---------- */
.futures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.fut{position:relative;display:flex;flex-direction:column;gap:.6rem;text-align:left;border:2px solid var(--line);border-radius:22px;padding:1rem 1.1rem;background:rgba(11,16,32,.65);backdrop-filter:blur(8px);min-height:9rem;transition:border-color .2s,transform .2s,background .2s}
.fut:hover{border-color:rgba(139,92,246,.6)}
.fut .L{font-family:var(--fd);font-weight:700;font-size:.8rem;letter-spacing:.2em;color:var(--tx2)}
.fut .t{font-family:var(--fd);font-size:1.3rem;font-weight:700;line-height:1.2}
.fut .pv{font-size:1rem;color:#DCE4F2;border-top:1px solid var(--line);padding-top:.55rem;animation:pop .3s both}
.fut.pick{border-color:var(--cy);background:rgba(34,211,238,.1);transform:translateY(-4px)}
.fut.class{box-shadow:0 0 0 3px rgba(251,191,36,.6)}
.fut .ic{font-size:2rem}
.speakq{font-family:var(--fd);font-size:clamp(1.8rem,3.4vw,3rem);font-weight:600;line-height:1.12;max-width:52rem}
.starter{display:inline-flex;align-items:center;gap:.5rem;border:1px dashed rgba(34,211,238,.6);border-radius:14px;padding:.45rem .9rem;font-size:1.15rem;color:#CFFAFE}
.follows{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.exans{font-size:1.2rem;color:#E9D5FF;border:1px solid rgba(139,92,246,.5);background:rgba(139,92,246,.12);border-radius:16px;padding:.7rem 1rem;animation:pop .3s both;max-width:52rem}

/* ---------- breakout ---------- */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
.mstep{border:1px solid var(--line);border-radius:18px;padding:.8rem 1rem;background:rgba(21,29,50,.85);display:flex;flex-direction:column;gap:.35rem}
.mstep .n{font-family:var(--fd);font-weight:700;letter-spacing:.2em;font-size:.72rem;color:var(--cy)}
.mstep .t{font-family:var(--fd);font-weight:700;font-size:1.15rem}
.mstep .q{font-size:1.05rem}
.mstep .eg{font-size:.92rem;color:#C4B5FD;font-style:italic}
.vchips{display:flex;gap:.4rem;flex-wrap:wrap}
.teams{display:grid;gap:.8rem;flex:1;min-height:0;overflow:auto}
.team{border:1px solid var(--line);border-radius:18px;padding:.7rem .9rem;background:rgba(21,29,50,.9);display:flex;flex-direction:column;gap:.4rem;min-height:0}
.team h3{font-size:1.1rem;display:flex;align-items:center;gap:.5rem}
.team label{font-size:.66rem;font-weight:800;letter-spacing:.14em;color:var(--tx2)}
.field{width:100%;background:#0E1526;border:1px solid var(--line);border-radius:10px;padding:.42rem .6rem;font-size:.95rem;resize:none}
textarea.field{min-height:2.4rem;line-height:1.3}
.field:focus{outline:2px solid var(--cy);outline-offset:0}
.mem{display:flex;gap:.3rem;flex-wrap:wrap}
.tmr{font-family:var(--fd);font-variant-numeric:tabular-nums;font-weight:700;font-size:2.4rem;letter-spacing:.02em}
.tmr.run{color:var(--ok)}.tmr.low{color:var(--amb)}.tmr.out{color:var(--warn)}
.presgrid{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.pcard{width:min(64rem,100%);border-radius:26px;padding:1.4rem 1.8rem;background:linear-gradient(160deg,rgba(29,41,65,.95),rgba(15,21,40,.95));border:1px solid rgba(139,92,246,.45);box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:.8rem;animation:pop .35s both}
.pcard .tn{font-family:var(--fd);font-size:2.2rem;font-weight:700}
.pstep{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;border-top:1px solid var(--line);padding-top:.7rem}
.pstep .n{font-family:var(--fd);font-weight:700;color:var(--cy);font-size:.8rem;letter-spacing:.18em}
.pstep .v{font-size:1.35rem}
.pstep .v.empty{color:var(--tx2);font-style:italic;font-size:1rem}
.star{border:1px solid var(--line);background:transparent;border-radius:12px;padding:.25rem .55rem;font-size:1.1rem;color:var(--tx2)}
.star.on{border-color:var(--amb);color:var(--amb);background:rgba(251,191,36,.12)}
.gramhl{border:1px dashed rgba(251,191,36,.55);border-radius:14px;padding:.5rem .8rem;font-size:1.1rem}
.model{border:1px solid rgba(52,211,153,.45);background:rgba(52,211,153,.08);border-radius:18px;padding:.9rem 1.1rem}
.model p{margin:.25rem 0;font-size:1.05rem}

/* ---------- final ---------- */
.ending-pick{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.ending-pick button{border-radius:14px}
.fin-title{font-family:var(--fd);font-size:clamp(2.4rem,6vw,5rem);font-weight:700;line-height:1;letter-spacing:.02em;background:linear-gradient(100deg,#FFF7E0,#FDE68A 40%,#C4B5FD 80%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:finin 1.4s ease both}
@keyframes finin{0%{opacity:0;letter-spacing:.4em;filter:blur(8px)}100%{opacity:1;letter-spacing:.02em;filter:none}}
.fin-sub{font-family:var(--fd);font-size:1.45rem;font-weight:600;animation:pop .6s .7s both}
.fin-quote{font-size:1.15rem;color:#E2E8F0;max-width:46rem;font-style:italic;animation:pop .6s 1.1s both}
.ach{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;animation:pop .6s 1.4s both}
.ach .a{display:flex;align-items:center;gap:.5rem;border:1px solid rgba(52,211,153,.5);background:rgba(52,211,153,.1);border-radius:14px;padding:.45rem .9rem;font-weight:800}
.ach .a.no{opacity:.4;border-color:var(--line);background:transparent}
.sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,247,224,.22) 50%,transparent 70%);background-size:300% 100%;animation:sweep 2.6s .3s ease-out both;z-index:0}
@keyframes sweep{from{background-position:120% 0}to{background-position:-60% 0}}
.converge{position:absolute;left:0;right:0;top:50%;height:2px;z-index:0;pointer-events:none}
.converge i{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:conv 1.6s ease-out both}
@keyframes conv{from{transform:translateY(var(--y)) scaleX(.2);opacity:0}60%{opacity:1}to{transform:translateY(0) scaleX(1);opacity:0}}
.classplan{display:grid;gap:.35rem;text-align:left;font-size:1rem;max-width:46rem;animation:pop .6s 1.2s both}
.classplan div::before{content:'★ ';color:var(--amb)}

/* ---------- overlays ---------- */
.ovl{position:fixed;inset:0;z-index:40;background:rgba(6,9,20,.82);backdrop-filter:blur(6px);display:flex;flex-direction:column;padding:1.2rem 1.6rem;gap:.8rem;animation:vin .2s both}
.ovl-h{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.ovl-h h2{font-size:1.6rem}
.ovl-b{flex:1;min-height:0;overflow:auto}
#modal{position:fixed;inset:0;z-index:60;background:rgba(6,9,20,.75);display:grid;place-items:center;padding:1rem}
#modalBox{width:min(46rem,96vw);max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:1.3rem 1.5rem;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:calc(var(--fh) + 1rem);transform:translate(-50%,20px);background:#0E1526;border:1px solid rgba(34,211,238,.5);color:var(--tx);padding:.6rem 1.1rem;border-radius:14px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* map */
.tmap{display:flex;flex-direction:column;align-items:center;gap:0;padding:.5rem 0 1rem}
.node{display:flex;align-items:center;gap:.8rem;border:2px solid var(--line);background:var(--s1);border-radius:16px;padding:.6rem 1rem;min-width:min(26rem,90vw);text-align:left;transition:border-color .15s}
.node .ic{font-size:1.4rem;width:2rem;text-align:center}
.node .t{font-family:var(--fd);font-weight:700;letter-spacing:.08em;font-size:1rem}
.node .s{font-size:.75rem;color:var(--tx2)}
.node.visited{border-color:rgba(139,92,246,.6)}
.node.cur{border-color:var(--cy);box-shadow:0 0 18px rgba(34,211,238,.35)}
.node.locked{opacity:.5;border-style:dashed}
.node:not([disabled]):hover{border-color:var(--cy)}
.vline{width:2px;height:1.3rem;background:linear-gradient(var(--pur),var(--cy))}
.branches{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.branches .node{min-width:12rem}
.node.ending{border-color:rgba(251,191,36,.6)}
.node.ending.sel{background:rgba(251,191,36,.12)}

/* word bank */
.wb-tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.wb-tools input[type=search]{background:#0E1526;border:1px solid var(--line);border-radius:12px;padding:.5rem .8rem;min-width:16rem}
.tgl{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:999px;padding:.3rem .75rem;font-size:.8rem;font-weight:800;background:transparent;color:var(--tx2)}
.tgl.on{color:var(--tx);border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1)}
.wbt{width:100%;border-collapse:separate;border-spacing:0 .35rem;font-size:1rem}
.wbt th{text-align:left;font-size:.7rem;letter-spacing:.14em;color:var(--tx2);padding:.2rem .7rem;position:sticky;top:0;background:rgba(6,9,20,.95);z-index:1}
.wbt td{background:var(--s1);padding:.55rem .8rem;vertical-align:top;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wbt td:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px;width:2.4rem;color:var(--tx2);font-weight:800;text-align:right}
.wbt td:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.wbt .w{font-family:var(--fd);font-weight:700;font-size:1.12rem;white-space:nowrap}
.wbt .ua{color:#FDE68A}
.wbt .ex{color:#C7D2FE;font-style:italic}
.wcat{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.1em;border-radius:6px;padding:.05rem .35rem;margin-left:.4rem;vertical-align:middle}
.wcat.A{background:rgba(139,92,246,.25);color:#DDD6FE}.wcat.B{background:rgba(34,211,238,.18);color:#A5F3FC}.wcat.C{background:rgba(52,211,153,.18);color:#A7F3D0}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.7rem}
.wcard{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.3rem}
.wcard .w{font-family:var(--fd);font-weight:700;font-size:1.25rem}
.wcard .d{font-size:.98rem}.wcard .ua{color:#FDE68A;font-size:.95rem}.wcard .ex{color:#C7D2FE;font-style:italic;font-size:.95rem}
.wbfs .wcards{grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.5rem}
.wbfs .wcard{padding:.5rem .7rem;gap:.15rem}
.wbfs .wcard .w{font-size:1.15rem}
.wbfs .wcard .d,.wbfs .wcard .ua,.wbfs .wcard .ex{font-size:.88rem}
.wsec{font-family:var(--fd);font-weight:700;letter-spacing:.14em;font-size:.85rem;color:var(--tx2);margin:.8rem 0 .4rem}

/* game zone */
.gz{flex:1;display:flex;flex-direction:column;gap:1rem;min-height:0}
.gzcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.gzc{border:1px solid var(--line);border-radius:22px;padding:1.2rem;background:rgba(21,29,50,.9);display:flex;flex-direction:column;gap:.6rem;text-align:left}
.gzc .ic{font-size:2.4rem}
.gzc h3{font-size:1.35rem}
.lr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.lr .def{font-family:var(--fd);font-size:clamp(1.6rem,3vw,2.6rem);font-weight:600;max-width:52rem;line-height:1.2}
.lr .ans{font-family:var(--fd);font-size:2.4rem;font-weight:700;color:var(--ok);animation:pop .3s both}
iframe.alias{flex:1;width:100%;border:1px solid var(--line);border-radius:18px;background:#fff;min-height:0}

/* dashboard drawer */
#ws{position:fixed;top:0;right:0;bottom:0;width:var(--ws);background:#0E1526;border-left:1px solid var(--line);z-index:20;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.ws #ws{transform:none}
#ws header{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.wtabs{display:flex;gap:.2rem;padding:.4rem .5rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wtabs button{border:0;background:transparent;color:var(--tx2);font-weight:800;font-size:.78rem;padding:.4rem .6rem;border-radius:10px}
.wtabs button.on{background:var(--s2);color:var(--tx)}
#wsBody{flex:1;overflow:auto;padding:.8rem .9rem 2rem;font-size:.88rem}
.wsec2{border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem;margin-bottom:.7rem;background:rgba(21,29,50,.6)}
.wsec2 h4{margin:0 0 .45rem;font-family:var(--fd);font-size:.78rem;letter-spacing:.14em;color:var(--cy)}
.wsec2 .row{gap:.35rem}
.nt p{margin:.25rem 0}
.nt .ua{color:#FDE68A;font-size:.84rem}
.key{border-left:3px solid var(--ok);padding-left:.6rem;margin:.35rem 0}
.srow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:.3rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--line)}
.srow input{background:transparent;border:1px solid transparent;border-radius:8px;padding:.2rem .35rem;width:100%;min-width:0}
.srow input:focus{border-color:var(--line)}
.srow .cnt{font-weight:800;color:var(--cy);min-width:1.6rem;text-align:center}
.srow.away{opacity:.5}
.srow.skip input{text-decoration:line-through}
.nextup{font-weight:800;color:var(--ok)}
textarea.notes{width:100%;min-height:9rem;background:#0B1122;border:1px solid var(--line);border-radius:12px;padding:.6rem;font-size:.9rem;resize:vertical}
.jump{width:100%;background:#0B1122;border:1px solid var(--line);border-radius:10px;padding:.45rem}
.tline{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.3rem 0}
.tline b{font-variant-numeric:tabular-nums;font-size:1.05rem}

/* live dock */
#dock{position:fixed;left:1rem;bottom:calc(var(--fh) + .8rem);width:19rem;z-index:15;background:#0E1526;border:1px solid rgba(34,211,238,.45);border-radius:16px;padding:.6rem .8rem;font-size:.8rem;display:none;max-height:45vh;overflow:auto}
#dock.on{display:block}
#dock.min #dockBody,#dock.min #dockCount{display:none}
.names{display:flex;flex-wrap:wrap;gap:.25rem;margin:.3rem 0}
.names span{border:1px solid var(--line);border-radius:999px;padding:.05rem .45rem}

<script>
/* ============================================================
   Lesson 30 · What If...? The Friendship Multiverse · Unit 3 Revision (Lessons 21–29)
   Vanilla JS, один файл, без збірки.
   1 · helpers   2 · lesson content   3 · art   4 · state & class   5 · smart turns
   6 · timers & sound   7 · ui helpers   8 · steps   9 · engine   10 · teacher tools
   11 · word bank & game zone   12 · audience window   13 · live room   14 · student app
   ============================================================ */
const CFG = window.LESSON_CONFIG || {};
const R0 = r => typeof r==='string' ? (document.querySelector(r)||document) : (r||document);
const $  = (s,r=document)=>R0(r).querySelector(s);
const $$ = (s,r=document)=>[...R0(r).querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LET = ['A','B','C','D'];
const qs = new URLSearchParams(location.search);
const ROLE = (qs.get('role')==='student' || qs.has('join')) ? 'student' : (qs.get('view')==='screen' ? 'screen' : 'teacher');
const uid = ()=> Math.random().toString(36).slice(2,10);
const rand4 = ()=> String(1000+Math.floor(Math.random()*9000));
const mmss = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const nameKey = s => String(s||'').trim().toLowerCase();
const typing = ()=>{ const a=document.activeElement; return !!a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable); };
const REDUCED_OS = matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(m){ const t=$('#toast'); if(!t) return; t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
const gapify = s => esc(s).replace(/___/g,'<span class="gap">___</span>');

/* ---------- 2 · lesson content (edit wording here) ---------- */
const PH = CFG.PHOTOS || {};
const CH = {
  maya:  {name:'Maya',  age:16, role:'The organiser',      c:'#B794F6', bio:'Friendly and social. Sometimes forgets to reply.'},
  ethan: {name:'Ethan', age:15, role:'The newer member',   c:'#34D399', bio:'A bit shy. Wants to fit in.'},
  lily:  {name:'Lily',  age:16, role:'The outgoing friend',c:'#F59E8B', bio:'Confident and expressive. Means well.'},
  noah:  {name:'Noah',  age:16, role:'The quiet friend',   c:'#60A5FA', bio:'Thoughtful. Avoids conflict. Admits mistakes.'},
  sys:   {name:'SYSTEM', c:'#22D3EE'},
  nar:   {name:'Narrator', c:'#A8B5CC'},
  all:   {name:'Everyone', c:'#FBBF24'}
};
const CAST = ['maya','ethan','lily','noah'];

const ACTS = [
  {n:1, r:'I',   t:'The Portal Opens',          f:'Warm-up',      min:2, e:'🌀'},
  {n:2, r:'II',  t:'Friendship Radar',          f:'Vocabulary',   min:3, e:'📡'},
  {n:3, r:'III', t:'The Broken Timeline',       f:'Reading',      min:6, e:'💬'},
  {n:4, r:'IV',  t:'Rewrite Reality',           f:'Grammar',      min:6, e:'🛠'},
  {n:5, r:'V',   t:'Choose the Future',         f:'Speaking',     min:3, e:'🔮'},
  {n:6, r:'VI',  t:'Create the Best Timeline',  f:'Breakout',     min:7, e:'🤝'},
  {n:7, r:'VII', t:'The Final Reveal',          f:'Story ending', min:3, e:'✨'}
];
const CORE_MIN = 30, EXT_MIN = 40;

/* ACT I · THE PORTAL OPENS */
const SYSTEM_LINES = ['Something went wrong.','The Saturday hangout never happened.','Four friends stopped talking.','But what if they had made different choices?'];
const MISSION_TXT = 'Travel through three alternative timelines. Find out what went wrong. Make better choices. Save the friendship.';
const WARMUP = {q:'Can one small choice change a friendship?', follow:'Can you give one example?', opts:[
  'Yes, even a small message can change everything.',
  'No, strong friendships can survive small mistakes.',
  'It depends on the situation.']};
const TO_RADAR = 'The system has found three moments that changed everything. But first, let’s activate your friendship vocabulary.';

/* ACT II · FRIENDSHIP RADAR */
const RADAR = [
  {id:'v1', q:'Your friend supports you when things get difficult.', opts:['have your back','hold a grudge','get ditched'], a:0, ex:'Have someone’s back means to support and help someone.', hint:'Think about a friend who is always on your side.'},
  {id:'v2', q:'A new student feels that nobody wants them in the group.', opts:['click','feel left out','bond over'], a:1, ex:'Feel left out means to feel that you are not included.', hint:'Which phrase means “not included”?'},
  {id:'v3', q:'Two friends stop talking after a serious argument.', opts:['fall out','fit in','tag along'], a:0, ex:'Fall out means to argue and stop being friendly.', hint:'Which phrase is about an argument?'},
  {id:'v4', q:'Two friends discuss a problem calmly and try to fix it.', opts:['spill the tea','drift apart','talk it out'], a:2, ex:'Talk it out means to discuss a problem and try to solve it.', hint:'Which phrase is about talking AND solving?'}
];
/* extended mode only — “what’s the difference?” pairs from the word bank */
const RADAR_PLUS = [
  {a:'fall out', b:'drift apart', d:'Fall out = a fight, quickly. Drift apart = slowly, often without a fight.'},
  {a:'left out', b:'excluded',    d:'Left out = a feeling. Excluded = people really didn’t let you join.'},
  {a:'get ghosted', b:'leave someone on read', d:'Ghosted = someone stops replying completely. On read = they read one message and don’t answer.'},
  {a:'fit in', b:'blend in', d:'Fit in = feel accepted. Blend in = look or act like everyone so nobody notices you.'}
];

/* ACT III · THE BROKEN TIMELINE
   kinds: msg (chat bubble) · think (private thought) · time (time jump) · nar (narration) · shot (screenshot) · found (system reveal) · say (face-to-face) */
const UNIVERSES = [
  {k:'u1', no:'01', t:'The Unanswered Message', art:'evening', when:'MONDAY — 6:30 PM', chat:'Saturday plans 🛹', mode:'chat',
   lines:[
    {k:'msg', who:'ethan', time:'6:30 PM', t:'Hey, are we still hanging out on Saturday? Can I come?'},
    {k:'msg', who:'maya',  time:'6:41 PM', t:'I’m busy right now. I’ll answer later.'},
    {k:'time', t:'SATURDAY — 3:00 PM'},
    {k:'think', who:'ethan', t:'I guess they don’t want me there. Maybe I don’t really fit in.'},
    {k:'msg', who:'maya',  time:'3:02 PM', t:'Ethan? Why didn’t you come? I thought you knew you were invited!'}
   ],
   q:{id:'c1', q:'Why didn’t Ethan go to the hangout?', opts:['He was too busy.','He thought he wasn’t invited.','He didn’t like his friends.'], a:1, ex:'Ethan misunderstood the silence and thought he was not welcome.', hint:'Read Ethan’s thought on Saturday again.'},
   d:{id:'d1', q:'What should Maya have done?', best:0, opts:[
     {t:'Sent a quick reply.', ok:true, res:[{who:'maya', t:'Of course you can come! Sorry, I was busy.'}]},
     {t:'Ignored the message completely.', cq:'Ethan receives no answer and becomes more worried about the hangout.'}
   ]},
   clue:'A quick reply matters.',
   talk:{q:'How do you think Ethan felt on Saturday? What would you do in his place?', st:'I think Ethan felt…'}},
  {k:'u2', no:'02', t:'The Screenshot', art:'screenshot', when:'TUESDAY — 7:15 PM', chat:'Shared screenshot', mode:'chat',
   lines:[
    {k:'shot', who:'lily', by:'noah', t:'Don’t add Ethan to the chat yet.'},
    {k:'nar', t:'Everyone thinks Lily wanted to exclude Ethan.'},
    {k:'found', who:'lily', t:'Don’t add Ethan to the chat yet.', more:'I want to invite him in person tomorrow so he feels welcome.'},
    {k:'msg', who:'ethan', time:'7:32 PM', t:'Wait... so you weren’t trying to leave me out?'},
    {k:'msg', who:'lily',  time:'7:33 PM', t:'Of course not! I wanted you to feel like one of our people.'}
   ],
   q:{id:'c2', q:'What caused the misunderstanding?', opts:['Lily wanted to exclude Ethan.','The screenshot didn’t show the whole message.','Ethan refused to speak to Lily.'], a:1, ex:'The screenshot was missing important context.', hint:'Compare the screenshot with the original message.'},
   d:{id:'d2', q:'What should Noah have done before sharing the screenshot?', best:0, opts:[
     {t:'Asked Lily what she meant.', ok:true, res:[{who:'noah', t:'Lily, can you explain what you meant? I don’t want to start drama.'}]},
     {t:'Shared it immediately.', cq:'More people see the incomplete message. The misunderstanding grows.'}
   ]},
   clue:'Check the full story.',
   talk:{q:'Why can screenshots be dangerous? How else can a message be misunderstood?', st:'Screenshots can be dangerous because…'}},
  {k:'u3', no:'03', t:'The Drama Spiral', art:'argument', when:'WEDNESDAY — 4:45 PM', chat:'After school', mode:'talk',
   lines:[
    {k:'say', who:'maya',  t:'Noah, why did you share Lily’s private message?'},
    {k:'say', who:'noah',  t:'I thought she was trying to exclude Ethan. I didn’t know the full story.'},
    {k:'say', who:'lily',  t:'You crossed the line. You should have talked to me first!'},
    {k:'say', who:'ethan', t:'Can we just hear each other out? I don’t want us to fall out over this.'},
    {k:'say', who:'noah',  t:'You’re right. I shouldn’t have shared it. I’m sorry.'}
   ],
   q:{id:'c3', q:'Who owned up to their mistake?', opts:['Ethan','Lily','Noah'], a:2, ex:'Noah admitted that sharing the message was wrong.', hint:'Who said “I’m sorry”?'},
   d:{id:'d3', q:'What should happen next?', best:1, opts:[
     {t:'Everyone should stop talking forever.', cq:'The friends take different paths. Their conflict stops, but they still don’t understand what happened.'},
     {t:'They should talk it out and set boundaries.', ok:true, res:[{who:'maya', t:'We can fix this. But next time, let’s ask questions before judging people.'}]},
     {t:'They should share more private messages.', cq:'Sharing more private messages makes the situation worse.'}
   ], note:'Talking it out is the best first step here — but nobody has to stay friends in every situation. Respecting boundaries matters too.'},
   clue:'Listen before judging.',
   talk:{q:'Was Lily right to say “You crossed the line”? Why?', st:'I think Lily was right / wrong because…'}}
];
const MISTAKES = ['An unanswered message.','A screenshot without context.','An argument caused by assumptions.'];
const CLUES = UNIVERSES.map(u=>({id:u.k, t:u.clue}));

/* ACT IV · REWRITE REALITY — grammar portals */
const PORTALS = [
  {k:'p1', no:'01', t:'Emphatic Structures', sub:'MAKE YOUR MESSAGE STRONGER.', done:'MESSAGE STRENGTH RESTORED.',
   orig:{who:'maya', t:'I want Ethan to feel welcome. I really mean it!'}, ask:'How can Maya make her message stronger?',
   rule:'We use do, does, and did + base verb to make a positive statement stronger.',
   forms:[{l:'I / you / we / they', f:'do + base verb'},{l:'he / she / it', f:'does + base verb'},{l:'past', f:'did + base verb'}],
   ex:['I <b>do</b> care about my friends.','She <b>does</b> want to help.','Noah <b>did</b> apologise yesterday.'],
   note:'After do, does, or did, use the base form of the verb.',
   qs:[
    {id:'g1', q:'I ___ want Ethan to feel welcome!', opts:['do','does','did'], a:0, ex:'With I in the present, use do.', hint:'Who is speaking? I. Is it now or in the past?'},
    {id:'g2', q:'I ___ try to explain yesterday!', opts:['do','did','does'], a:1, ex:'Yesterday refers to the past. Use did + base verb.', hint:'Look for a time word.'}
   ],
   plus:{id:'g7', q:'Lily ___ want Ethan to feel welcome.', opts:['do','does','did'], a:1, ex:'With he / she / it in the present, use does + base verb.', hint:'Lily = she. Present.'},
   speak:'I do believe that good friends should…'},
  {k:'p2', no:'02', t:'Relative Clauses with Prepositions', sub:'CONNECT THE PEOPLE.', done:'CONNECTIONS RESTORED.',
   orig:{who:'ethan', t:'Lily is the friend. I wanted to talk to Lily.'}, ask:'Can you connect these sentences?',
   rule:'In everyday English, we usually put the preposition at the end. In formal relative clauses, we can put the preposition before whom or which.',
   forms:[{l:'INFORMAL', f:'Lily is the friend I wanted to talk <b>to</b>.'},{l:'FORMAL', f:'Lily is the friend <b>to whom</b> I wanted to talk.'}],
   ex:[],
   note:'Use whom for people and which for things after a preposition.',
   qs:[
    {id:'g3', q:'This is the group…', opts:['I wanted to belong to.','to I wanted to belong.','which I wanted belong.'], a:0, ex:'Belong to is the correct expression. In this informal relative clause, to comes at the end.', hint:'The verb is “belong to”. Where does “to” go in everyday English?'},

  while(S.students.length<n) S.students.push({id:'s'+uid(), name:'Student '+(S.students.length+1), here:true, skip:false});
  if(S.students.length>n) S.students=S.students.slice(0,n);
  afterClass();
}
function afterClass(){ S.teams=[]; S.teamN=null; save(); const c=$('#clsCnt'); if(c) c.textContent=here().length; }

/* ---------- 5 · smart turns ----------
   • Наступний — присутній учень із найменшою кількістю відповідей; нічия → по колу (rot), тож блоки
     починаються з різних учнів.  • Хід зараховується, коли вчитель іде далі (або натискає ✓).
   • ↷ Pass / ask another — хід переходить, не зараховується.  • Відсутній / ⏸ пропуск — не отримує нових ходів.
   • Читання: кожному персонажу сцени — свій учень (якщо учнів менше, хтось читає дві ролі). */
function pickStudent(exclude=[]){
  const A=avail(); let pool=A.filter(s=>!exclude.includes(s.id)); if(!pool.length) pool=A; if(!pool.length) return null;
  const n=S.students.length; let best=null, bv=1e9;
  pool.forEach(s=>{ const idx=S.students.indexOf(s), rot=(idx-(S.rot||0)+n)%n, v=(S.part[s.id]||0)*100+rot; if(v<bv){ bv=v; best=s; } });
  S.rot=(S.students.indexOf(best)+1)%n; return best.id;
}
function ensureTurn(key){
  if(ROLE!=='teacher') return S.turns[key]||null;
  const t=S.turns[key];
  if(!t || (!t.done && !avail().some(s=>s.id===t.sid))){ const sid=pickStudent(t?[t.sid]:[]); if(!sid) return null; S.turns[key]={sid, done:false}; }
  return S.turns[key];
}
function doneTurn(key){ const t=S.turns[key]; if(t && !t.done){ t.done=true; S.part[t.sid]=(S.part[t.sid]||0)+1; } }
function passTurn(key){ const t=S.turns[key]; if(!t) return; if(t.done){ anotherTurn(key); return; } const sid=pickStudent([t.sid]); if(sid && sid!==t.sid){ t.sid=sid; } else toast('Nobody else is available'); }
function anotherTurn(key){ const t=S.turns[key]; doneTurn(key); const sid=pickStudent(t?[t.sid]:[]); if(sid) S.turns[key]={sid, done:false}; }
function cycleTurn(key){ const t=S.turns[key]; const A=avail(); if(!t||!A.length) return; const i=A.findIndex(s=>s.id===t.sid); t.sid=A[(i+1)%A.length].id; }
function ensureReads(id, chars){
  if(ROLE!=='teacher') return S.reads[id]||{};
  const R=S.reads[id]=S.reads[id]||{}; const used=[];
  chars.forEach(c=>{ if(R[c] && avail().some(s=>s.id===R[c])){ used.push(R[c]); return; } if(R[c] && S.counted[id]) return;
    const sid=pickStudent(used.length>=avail().length?[]:used); if(sid){ R[c]=sid; used.push(sid); } });
  return R;
}
function cycleRead(id, c){ const R=S.reads[id]; const A=avail(); if(!R||!A.length) return; const i=A.findIndex(s=>s.id===R[c]); R[c]=A[(i+1)%A.length].id; }
function countReads(id){ if(S.counted[id] || !S.reads[id]) return; [...new Set(Object.values(S.reads[id]))].forEach(sid=>{ S.part[sid]=(S.part[sid]||0)+1; }); S.counted[id]=true; }
function resetTurns(){ S.part={}; S.turns={}; S.reads={}; S.counted={}; S.rot=0; }

/* ---------- 6 · timers & sound ---------- */
const now = ()=>Date.now();
const el = t => t.at ? t.acc + (now()-t.at)/1000 : t.acc;
const TM = {
  lesson(){ return el(S.tm.lesson); }, act(){ return el(S.tm.act); },
  lessonRun(){ return !!S.tm.lesson.at; },
  toggleLesson(){ const L=S.tm.lesson, A=S.tm.act; if(L.at){ L.acc=el(L); L.at=0; A.acc=el(A); A.at=0; } else { L.at=now(); A.at=now(); } save(); paintTimers(); pubState(); },
  resetLesson(){ S.tm.lesson={acc:0,at:0}; S.tm.act={acc:0,at:0,n:cur().act}; save(); paintTimers(); },
  newAct(n){ const A=S.tm.act; if(A.n===n) return; S.tm.act={acc:0, at:S.tm.lesson.at?now():0, n}; },
  resetAct(){ S.tm.act={acc:0, at:S.tm.lesson.at?now():0, n:cur().act}; save(); paintTimers(); },
  bo(){ const b=S.tm.bo; return b.at ? Math.max(0, b.left-(now()-b.at)/1000) : b.left; },
  boRun(){ return !!S.tm.bo.at && TM.bo()>0; },
  boStart(){ const b=S.tm.bo; if(!b.at){ if(b.left<=0) b.left=b.dur; b.at=now(); } save(); paintTimers(); pubState(); },
  boPause(){ const b=S.tm.bo; if(b.at){ b.left=TM.bo(); b.at=0; } save(); paintTimers(); pubState(); },
  boToggle(){ TM.boRun()?TM.boPause():TM.boStart(); },
  boReset(d){ const b=S.tm.bo; if(d) b.dur=d; b.left=b.dur; b.at=0; save(); paintTimers(); pubState(); },
  boAdd(s){ const b=S.tm.bo; const l=TM.bo(); b.left=l+s; if(b.at) b.at=now(); save(); paintTimers(); pubState(); }
};
let boRang=false;
function paintTimers(){
  const c=$('#clock'); if(c){ const t=TM.lesson(), lim=(S.mode==='ext'?EXT_MIN:CORE_MIN)*60; c.textContent=(TM.lessonRun()?'⏱ ':'⏸ ')+mmss(t)+' / '+(lim/60); c.classList.toggle('run',TM.lessonRun()); c.classList.toggle('over',t>lim); }
  const b=TM.bo(), run=TM.boRun();
  $$('[data-tmr="bo"]').forEach(e=>{ e.textContent=mmss(b); e.classList.toggle('run',run); e.classList.toggle('low',b<=60&&b>0); e.classList.toggle('out',b<=0); });
  $$('[data-tmr="boBtn"]').forEach(e=>{ e.textContent=run?'⏸ Pause':'▶ Start'; });
  $$('[data-tmr="lesson"]').forEach(e=>e.textContent=mmss(TM.lesson()));
  $$('[data-tmr="act"]').forEach(e=>e.textContent=mmss(TM.act()));
  if(S.tm.bo.at && b<=0 && !boRang){ boRang=true; SND.play('restore'); toast('⏰ Time is up!'); }
  if(b>0) boRang=false;
}
const SND = { ctx:null,
  play(k){ if(!S.sound || ROLE!=='teacher') return;
    try{ const c=this.ctx||(this.ctx=new (window.AudioContext||window.webkitAudioContext)()); if(c.state==='suspended') c.resume(); const t=c.currentTime;
      const tone=(f,st,d,type='sine',g=.05,f2)=>{ const o=c.createOscillator(), v=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+st); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+st+d); v.gain.setValueAtTime(0,t+st); v.gain.linearRampToValueAtTime(g,t+st+.02); v.gain.exponentialRampToValueAtTime(.0001,t+st+d); o.connect(v).connect(c.destination); o.start(t+st); o.stop(t+st+d+.05); };
      if(k==='msg'){ tone(880,0,.12); tone(1320,.06,.16); }
      else if(k==='clue'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.4,'triangle',.045)); }
      else if(k==='portal'){ tone(110,0,1.2,'sine',.05,440); tone(220,.1,1.1,'triangle',.025,880); }
      else if(k==='restore'){ [392,494,587,784].forEach(f=>tone(f,0,1.3,'sine',.035)); tone(1175,.25,1,'sine',.02); }
      else if(k==='soft'){ tone(330,0,.25,'sine',.04,262); }
    }catch(e){}
  }
};

/* ---------- 8 · steps ----------
   Кожен крок: render() → HTML, after(view) → події, adv()/ret() — «внутрішні» кроки (повідомлення, рядки),
   reveal/hide/hint — кнопки вчителя, nl() — підпис кнопки Next, live() — що бачать телефони, n — нотатки вчителя. */
const ansOf = q => S.ans[q.id]||{};
const pickNotShown = q => { const A=ansOf(q); return A.pick!=null && !A.shown; };
function qStepBase(q, extra={}){
  return Object.assign({ turn:q.id,
    reveal(){ return mcqReveal(q); }, hide(){ const A=S.ans[q.id]; if(A&&A.shown){ A.shown=false; return true; } return false; },
    hint(){ const A=S.ans[q.id]=S.ans[q.id]||{}; A.hint=!A.hint; return true; },
    adv(){ if(pickNotShown(q)){ mcqReveal(q); return true; } return false; },
    nl(){ return pickNotShown(q)?'Check answer ▶':null; },
    key:`${LET[q.a]}. ${q.opts[q.a]} — ${q.ex}`,
    live(){ const A=ansOf(q), t=S.turns[q.id]; return {kind:'mcq', id:q.id, q:q.q, opts:q.opts, who:t?sname(t.sid):'', shown:!!A.shown, a:A.shown?q.a:null, ex:A.shown?q.ex:null}; }
  }, extra);
}
function qtop(s, extra=''){ return `<div class="qtop">${kicker(s)}<span class="grow"></span>${s.turn?turnChip(s.turn):''}${extra}</div>`; }
function qSplitText(t){ const p=t.split(' → '); return p.length>1 ? `<div class="small" style="font-size:1rem;color:#C7D2FE">Original: <b style="color:var(--tx)">${esc(p[0])}</b></div><div class="qtext">${gapify(p[1])}</div>` : `<div class="qtext">${gapify(t)}</div>`; }

function teamSizes(n){ if(n<=3) return [n]; if(n===4) return [2,2]; if(n===5) return [2,3]; if(n===6) return [3,3]; return [3,4]; }
function ensureTeams(){
  if(ROLE!=='teacher') return;
  const P=here().map(s=>s.id); if(!P.length) return;
  const G=S.teams.flatMap(t=>t.m); const k=Math.min(S.teamN||teamSizes(P.length).length, P.length, 3);
  if(S.teams.length===k && P.length===G.length && P.every(id=>G.includes(id))) return;
  const old={}; S.teams.forEach(t=>old[t.id]=t);
  const sizes = S.teamN ? Array.from({length:k},(_,i)=>Math.floor(P.length/k)+(i<P.length%k?1:0)) : teamSizes(P.length);
  let p=0; S.teams=sizes.map((sz,i)=>{ const id=TEAM_IDS[i]; const t=Object.assign({id, name:'', s1:'', s2:'', s3:'', bonus:'', final:''}, old[id]||{}); t.m=P.slice(p,p+sz); p+=sz; return t; });
  if(S.pres>=S.teams.length) S.pres=0;
}
function moveMember(sid){ const i=S.teams.findIndex(t=>t.m.includes(sid)); if(i<0||S.teams.length<2) return; S.teams[i].m=S.teams[i].m.filter(x=>x!==sid); S.teams[(i+1)%S.teams.length].m.push(sid); }

  add({ id:u.k+'d', act:3, k:`Universe ${u.no} · Timeline decision`, title:`Universe ${u.no}: decision`, turn:u.k+'d',

        ${p!=null && !ok?`<div class="cq"><span class="ic">⚠️</span><div><div class="t">WHAT HAPPENS NEXT</div>${esc(d.opts[p].cq)}<div class="mt"><button class="btn sm warn" data-retry ${ROLE!=='teacher'?'disabled':''}>↺ Try another choice</button></div></div></div>`:''}
        ${ok?`${d.opts[p].res.map(r=>lineHTML({k:'msg', who:r.who, t:r.t}, u.k+'d')).join('')}<div class="clue"><span class="ic">🧩</span><div><div class="k">TIMELINE CLUE UNLOCKED</div><div class="v">“${esc(u.clue)}”</div></div></div>${d.note?`<div class="small">${esc(d.note)}</div>`:''}`:''}
      </div></div>`; },
    after(v){ const d=u.d; $$('[data-d]',v).forEach(b=>b.onclick=()=>{ const D=S.dec[d.id]=S.dec[d.id]||{tried:[]}; const i=+b.dataset.d; D.pick=i; if(!D.tried.includes(i)) D.tried.push(i);

      const r=$('[data-retry]',v); if(r) r.onclick=()=>{ S.dec[u.d.id].pick=null; save(); draw(); }; },

/* ---------- 9 · engine ---------- */
const cur = ()=> STEPS[Math.min(S.i, STEPS.length-1)];
const visible = i => !!STEPS[i] && (!STEPS[i].ext || S.mode==='ext');
const idxOf = id => STEPS.findIndex(s=>s.id===id);
function nextIdx(i){ let k=i+1; while(k<STEPS.length && !visible(k)) k++; return k<STEPS.length?k:-1; }
function prevIdx(i){ let k=i-1; while(k>=0 && !visible(k)) k--; return k; }
let ENTERED = null;
function next(){
  if(S.gz){ return; }
  const s=cur();
  if(s.adv && s.adv()){ save(); draw(); return; }
  const k=nextIdx(S.i);
  if(k<0){ openGZ('home'); return; }
  complete(s); go(k);
}
function back(){ if(S.gz){ closeGZ(); return; } const s=cur(); if(s.ret && s.ret()){ save(); draw(); return; } const k=prevIdx(S.i); if(k>=0) go(k); }
function complete(s){ if(ROLE!=='teacher') return; if(s.turn) doneTurn(s.turn); s.leave && s.leave(); }
function go(k, keepPrev){ if(!STEPS[k]) return; if(!keepPrev) S.prevI=null; S.gz=null; S.i=k; S.max=Math.max(S.max,k); TM.newAct(STEPS[k].act); S.ovl=null; save(); draw(); }
function goId(id, jump){ const k=idxOf(id); if(k<0) return; if(jump && S.prevI==null) S.prevI=S.i; if(!visible(k)) S.mode='ext'; go(k, jump); }
function reveal(){ if(S.gz) return; const s=cur(); if(s.reveal && s.reveal()!==false){ s.onReveal&&s.onReveal(); save(); draw(); } }
function hideAns(){ if(S.gz) return; const s=cur(); if(s.hide && s.hide()!==false){ save(); draw(); } }
function hint(){ if(S.gz) return; const s=cur(); if(s.hint && s.hint()!==false){ save(); draw(); } }
function revealAll(){ const s=cur(); if(s.revealAll && s.revealAll()){ save(); draw(); } else toast('Nothing to reveal on this screen'); }
function skipOptional(){ let k=S.i+1; while(k<STEPS.length && (STEPS[k].ext || STEPS[k].act===cur().act && /talk|speak|plus|rplus/.test(STEPS[k].id))) k++; if(k<STEPS.length) go(k); }

function draw(){
  const v=$('#view'); if(!v) return;
  document.body.classList.toggle('noanim', !!S.noanim);
  if(ROLE==='teacher') paintWelcome();
  if(S.gz){ v.innerHTML=gzRender(); v.className=''; gzAfter(v); }
  else {
    const s=cur();
    if(ENTERED!==s.id){ const first=ENTERED!==null; ENTERED=s.id; if(ROLE==='teacher'){ if(s.chat && !S.rev[s.id]) S.rev[s.id]=1; if(first) s.onEnter&&s.onEnter(); } v.className='anim'; void v.offsetWidth; }
    else v.className='';
    v.innerHTML=s.render();
    bindChips(v); s.after && s.after(v);
  }
  paintChrome(); paintOvl(); paintTimers();
  if($('#ws') && document.body.classList.contains('ws')) paintWs();
  pubState();
}
function paintChrome(){
  const s=cur(), a=ACTS[s.act-1], scr=ROLE!=='teacher'||document.body.classList.contains('focus');
  $('#actbar').innerHTML = S.gz ? `<span class="lbl"><b>🎮 GAME ZONE</b></span>` :
    `<span class="lbl">ACT <b>${a.r}</b> / VII · <b>${esc(a.t.toUpperCase())}</b></span><span class="segs" aria-hidden="true">${ACTS.map(x=>`<i class="${x.n<a.n?'d':x.n===a.n?'c':''}"></i>`).join('')}</span>`;
  if(ROLE!=='teacher') return;
  const nb=$('#bNext'); const nl=S.gz?null:(s.nl&&s.nl()); const k=nextIdx(S.i);
  nb.textContent = S.gz ? '◀ Back to lesson' : (nl || (k<0?'🎮 Game Zone ▶':'Next ▶'));
  nb.onclick = S.gz ? closeGZ : next;
  $('#bBack').disabled = !S.gz && prevIdx(S.i)<0 && !((S.rev[s.id]||1)>1);
  $('#bReveal').disabled = S.gz || !s.reveal; $('#bHide').disabled = S.gz || !s.hide; $('#bHint').disabled = S.gz || !s.hint;
  /* turn controls */
  const tk = !S.gz && s.turn; const t = tk && S.turns[tk];
  $('#info').innerHTML = t ? `<span class="small">Turn:</span> ${turnChip(tk)}
      <button class="btn xs ${t.done?'ok':''}" data-ti="done" title="Mark the answer as done (D)">✓ Done</button>
      <button class="btn xs ghost" data-ti="pass" title="Pass — ask another student (the turn is not counted)">↷ Pass</button>
      <button class="btn xs ghost" data-ti="more" title="Another student answers too">＋ Another</button>`
    : (s.chat||s.id==='portal'||s.id==='mission') ? `<span class="small">🎙 Readers are shown next to each line — click a name to change it.</span>` : `<span class="small">${esc(s.title)}</span>`;
  bindChips($('#info'));
  $$('[data-ti]',$('#info')).forEach(b=>b.onclick=()=>{ const k=b.dataset.ti; if(k==='done') doneTurn(tk); if(k==='pass') passTurn(tk); if(k==='more') anotherTurn(tk); save(); draw(); });
  $('#bMode').innerHTML = `⏳ <b>${S.mode==='ext'?'EXTENDED':'CORE'}</b><span class="lbl"> ${S.mode==='ext'?EXT_MIN:CORE_MIN} min</span>`;
  $('#bSnd').textContent = S.sound?'🔊':'🔇';
  $('#clsCnt').textContent = here().length;
  $('#bFocus').classList.toggle('on', document.body.classList.contains('focus'));
  $('#bMap').classList.toggle('on', S.ovl==='map'); $('#bWords').classList.toggle('on', S.ovl==='words'); $('#bGame').classList.toggle('on', !!S.gz);
  $('#bLive').classList.toggle('on', !!LIVE.on);
}

/* ---------- 13 · live room (optional) ----------
   Учитель — єдине джерело стану. Захист (як в уроках 13–29):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом: учень не перемикає сцени, не бачить відповідей до Reveal,
     не обирає фінал, не змінює присутність і не скидає урок;
   • учні надсилають лише hello / ans / card / react; учитель перевіряє кожне (поточне завдання, межі, довжину,
     для картки команди — що учень справді в цій команді);
   • лише ім’я / нік, жодних інших даних. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','📷'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson30-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson30-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l30sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l30sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson30-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson30-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const n=Date.now(); let ch=false; for(const k in this.peers) if(n-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));

  Net.send({t:'raw', body});
}

  const signed=await TKEY.init();
  const kind=await Net.connect({room:S.room, id:S.tid, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save(); pubState(); draw();
  if(!silent) toast(!signed?'Room open — but this page can’t sign messages (needs https)':kind==='supabase'?'Live room open — share the link, QR or code':kind==='local'?'Supabase is not reachable — LOCAL DEMO only (tabs in this browser)':'The live room could not start');
  return kind;
}
function stopLive(){ sendSigned({t:'end'}); setTimeout(()=>Net.stop(),300); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); paintDock(); draw(); }
function liveStatus(){
  if(!LIVE.on) return 'not started — the lesson works fully without phones';
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● live (Supabase Realtime)</span>' : Net.status==='local' ? '<span style="color:var(--amb)">● LOCAL DEMO — NOT real students: only tabs in THIS browser can join</span>' : `<span style="color:var(--amb)">● ${esc(Net.status)}</span>`;
  return `${s} · ${studs().length} joined`;
}
async function openLive(){
  if(!configured()){ openModal(`<div class="row"><h2 class="h-m grow">📡 Live classroom</h2><button class="btn sm ghost" data-c>✕</button></div><p class="mt">Live classroom is <b>not configured</b>: SUPABASE_URL / SUPABASE_KEY at the top of this file are empty. Students cannot join from their devices.</p><p class="small mt">The whole lesson works in teacher-led screen-share mode. To enable phones, paste your Supabase project URL and publishable key (Realtime only, no tables needed).</p>`); $('[data-c]','#modalBox').onclick=closeModal; return; }
  await TKEY.init();
  openModal(`<div class="row"><h2 class="h-m grow">📡 Live classroom</h2><button class="btn sm ghost" data-c aria-label="Close">✕</button></div>
   <p class="small mt">Optional. Students join on their own device with the same first name as in 👥 Class. They see whose turn it is, answer questions and polls (you see the tally), and edit their own team card in the breakout. Only you move the lesson, reveal answers and choose the ending.</p>
   <div class="split mt" style="align-items:center;grid-template-columns:1fr auto"><div><div class="small">Room code</div><div class="dsp" style="font-size:4rem;font-weight:700">${S.room}</div>
     <div class="small">Teacher key <b style="font-size:1.3rem;color:var(--cy);letter-spacing:.12em">${shortKey()||'—'}</b> (only for students who type the code)</div>
     <div class="small mt" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div>
     <p class="small mt" style="color:#A7F3D0">🔐 Your messages are signed with a key that never leaves this browser. Student devices obey only this signature.</p></div>
     <img alt="QR code for the student link" width="200" height="200" style="border-radius:16px;background:#fff" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn primary" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${canSign()?'':'<p class="small mt" style="color:var(--amb)">This page is not on https, so messages can’t be signed. Open it from GitHub Pages for the live room.</p>'}`);
  $('[data-c]','#modalBox').onclick=closeModal;
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); openLive(); };
  $('#lvCopy').onclick=()=>copyText(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 14 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], sent={}, taskKey='', trust=null, lastTs=0, verified=false;
  try{ name=localStorage.getItem('l30name')||''; avatar=localStorage.getItem('l30av')||avatar; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'ok':s==='off'?'off':''); $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  if(!configured()){ B.innerHTML=`<div class="stu-card stu-wait"><div class="bigi">📡</div><p><b>Live classroom is not set up for this lesson.</b></p><p class="small mt">Follow the lesson on your teacher’s shared screen in Zoom.</p></div>`; setConn('off'); return; }
  $('#stuFoot').innerHTML=['👍','😂','😮','👏','✋','💜'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); });
  const me=n=>nameKey(n)===nameKey(name);
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="row" style="gap:.3rem">${CAST.map(k=>av(k,44)).join('')}</div>
      <h2 class="dsp mt" style="font-size:1.6rem">Join “What If...?” 🌀</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Your first name — the same as on the teacher’s list</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Anna" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">First name only — no surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,24), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l30name',name); localStorage.setItem('l30av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const join=async()=>{
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🌀</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ const T=m.task; const k=JSON.stringify([m.act,m.step,T&&T.kind==='team'?T.teams.map(t=>[t.id,t.name,t.m]):T]); st=m; if(k!==taskKey){ taskKey=k; render(); } else { paintT(); paintCard(); } }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for the teacher…<br><span class="small">Room ${esc(room)} — are the code and teacher key right? <a href="?join" style="color:var(--cy)">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">✨</div><h2 class="dsp mt" style="font-size:1.6rem">SEE YOU NEXT TIME!</h2><p class="small">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  const paintCard=()=>{ if(!st||!st.task||st.task.kind!=='team') return; const g=st.task.teams.find(x=>x.m.some(me)); if(!g) return; $$('[data-cf]',B).forEach(i=>{ if(document.activeElement!==i) i.value=(g.card||{})[i.dataset.cf]||''; }); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const head=()=>`<div class="small" style="margin-bottom:.3rem;font-weight:800">ACT ${ACTS[st.act-1].r} · ${esc(st.title||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait">${av('ethan',90)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head();
    if(!T){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Read, listen and be ready to speak!</p></div>`; return; }
    if(T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T.e||'🌀')}</div><p><b>${esc(T.t)}</b></p></div>`; return; }
    if(T.kind==='read'){ const mine=T.roles.filter(r=>me(r.who)); B.innerHTML=hd+`<div class="stu-card ${mine.length?'mine':''}"><p style="font-size:1.3rem;font-weight:800">${mine.length?`🎙 You read: ${mine.map(r=>esc(r.c)).join(' + ')}`:'📖 Follow on the main screen'}</p>${T.roles.map(r=>`<p class="small">${esc(r.c)} — ${esc(r.who)}</p>`).join('')}</div>`; return; }
    if(T.kind==='speak'){ const mine=me(T.who); B.innerHTML=hd+`<div class="stu-card ${mine?'mine':''}"><p style="font-size:1.2rem;font-weight:800">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p><p style="font-size:1.25rem;margin-top:.5rem">${esc(T.q)}</p>${T.st?`<p class="small mt">💬 ${esc(T.st)}</p>`:''}</div>`; return; }
    if(T.kind==='mcq'||T.kind==='poll'){ const my=sent[T.id], mine=T.who&&me(T.who), done=T.kind==='mcq'?T.shown:T.chosen!=null;
      B.innerHTML=hd+`<div class="stu-card ${mine?'mine':''}">${T.who?`<p class="small">${mine?'🎙 Your turn — answer out loud too!':'🎙 '+esc(T.who)+' answers on Zoom'}</p>`:''}<p style="font-size:1.25rem;font-weight:800;margin:.4rem 0">${gapify(T.q)}</p>
        <div class="opts">${T.opts.map((o,i)=>{ const cls=T.kind==='mcq'&&T.shown?(i===T.a?'right':my===i?'miss':'fade'):(T.kind==='poll'&&T.chosen===i?'right':my===i?'pick':''); return `<button class="opt ${cls}" data-i="${i}" ${done?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`; }).join('')}</div>
        <p class="small mt">${T.kind==='mcq'&&T.shown?esc(T.ex||''):done?'Look at the main screen.':my!==undefined?'✓ Sent! You can change it.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); }); return; }
    if(T.kind==='team'){ const g=T.teams.find(x=>x.m.some(me));
      if(g){ const c=g.card||{}; B.innerHTML=hd+`<div class="stu-card mine"><p class="small">Your team <span id="stuT"></span></p><h2 class="dsp" style="font-size:1.6rem">${esc(g.name)}</h2><p class="small mt">With: ${g.m.map(esc).join(', ')}</p></div>
          <div class="stu-card"><b>CREATE THE BEST TIMELINE</b><p class="small">Use two Unit 3 expressions + one grammar structure. Everyone speaks!</p>
          ${TEAM_FIELDS.map(([f,l,mx])=>`<label for="cf${f}">${esc(l)}</label>${f==='name'?`<input id="cf${f}" data-cf="${f}" maxlength="${mx}" value="${esc(c[f]||'')}">`:`<textarea id="cf${f}" data-cf="${f}" rows="2" maxlength="${mx}">${esc(c[f]||'')}</textarea>`}`).join('')}</div>`;
        $$('[data-cf]',B).forEach(i=>{ let t=null; i.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>Net.send({t:'card', g:g.id, f:i.dataset.cf, v:i.value}),400); }; }); }
      else B.innerHTML=hd+`<div class="stu-card"><p><b>Teams</b> <span id="stuT"></span></p>${T.teams.map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(esc).join(', ')}</p>`).join('')}<p class="small">Can’t find your name? Use the same name as on your teacher’s list.</p></div>`;
      paintT(); return; }
    B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p></div>`;
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(closeOvl()) return; if(document.body.classList.contains('focus')) return setFocus(false); if(S.gz) return closeGZ(); if(document.body.classList.contains('ws')) return toggleWs(false); return; }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden') || !S.started) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A' && tag!=='SUMMARY')){ if(S.ovl) return; e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ if(S.ovl) return; e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(s.turn && !S.gz){ doneTurn(s.turn); save(); draw(); } }
  else if(k==='f') setFocus(!document.body.classList.contains('focus'));
  else if(k==='t') toggleWs(); else if(k==='m') openOvl('map'); else if(k==='b') openOvl('words');
  else if(k==='g') S.gz?closeGZ():openGZ('home'); else if(k==='c') { toggleWs(true); S.wt='class'; save(); paintWs(); }
});
function init(){
  if(ROLE==='student'){ studentApp(); return; }
  if(ROLE==='screen'){ screenApp(); return; }
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bHint').onclick=hint;
  $('#bDash').onclick=()=>toggleWs(); $('#wsX').onclick=()=>toggleWs(false);
  $$('#ws [data-wt]').forEach(b=>b.onclick=()=>{ S.wt=b.dataset.wt; save(); paintWs(); });
  $('#bClass').onclick=()=>{ toggleWs(true); S.wt='class'; save(); paintWs(); };
  $('#bMap').onclick=()=>openOvl('map'); $('#bWords').onclick=()=>openOvl('words'); $('#bGame').onclick=()=>S.gz?closeGZ():openGZ('home');
  $('#bMode').onclick=()=>setMode(S.mode==='ext'?'core':'ext'); $('#clock').onclick=()=>TM.toggleLesson();
  $('#bSnd').onclick=()=>{ S.sound=!S.sound; save(); paintChrome(); if(S.sound) SND.play('msg'); toast(S.sound?'🔊 Sound effects on':'🔇 Sound effects off'); };
  $('#bLive').onclick=openLive; $('#bScreen').onclick=openScreen; $('#bFocus').onclick=()=>setFocus(!document.body.classList.contains('focus'));
  $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello') pushScreen(); };
  setInterval(paintTimers,500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('focus')){ document.body.classList.remove('focus'); paintChrome(); draw(); } });
  if(S.ws && innerWidth>=1100){ document.body.classList.add('ws'); $('#ws').setAttribute('aria-hidden','false'); }
  if(S.started) ENTERED=cur().id;
  draw();
  if(S.started && S.max>0) toast('↻ Lesson progress restored');
  if(S.live) startLive(true);
}
init();

</script>
