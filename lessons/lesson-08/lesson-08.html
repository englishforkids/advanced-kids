/* ---------- 9 · live room (Supabase Realtime broadcast + presence; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5, 13–18: таблиці не потрібні, на сервері нічого не зберігається
   (якщо SAVE_ANSWERS = false). Учитель — єдине джерело стану: екран, завдання й таймер надсилає тільки він.
   Учні можуть надіслати лише hello / ans / work / react; правильні відповіді їм не передаються,
   доки вчитель не відкриє їх на головному екрані. Код кімнати — 6 цифр, новий після Restart. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,10);
const LIVE = {on:false, peers:[]};
const WALLQ = [];        // unshown text answers {id, task, sid, text, by, ok}
const NAMES = {};
const WORK_F = ['n1','r1','n2','r2','n3','r3','r4','sub'];

const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l08sid'); }catch(e){}   // per tab, survives a refresh
    this.me={id:sid || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') try{ sessionStorage.setItem('l08sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson08-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson08-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
const Store = {
  async log(kind, task, sid, value){
    if(!(CFG.SAVE_ANSWERS && Net.sb)) return;
    try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson08-message', chapter:cur().id, task, kind, student_id:sid, student_name:NAMES[sid]||null, value:String(value).slice(0,500)}); }
    catch(e){ console.warn('Supabase insert failed:', e.message||e); }
  }
};

let pubT=null;
function curTask(){ const c=cur(); let t=null; try{ t=c.live?c.live():null; }catch(e){ t=null; }
  if(t && S.lock && (t.kind==='choice'||t.kind==='text')) t=Object.assign({},t,{lock:true, locked:true});
  if(t && S.lock && t.kind==='team') t=Object.assign({},t,{locked:true});
  return t; }
function pubState(){
  if(!LIVE.on || ROLE!=='teacher') return;
  clearTimeout(pubT); pubT=setTimeout(()=>{
    const c=cur(), st=STAGES[c.sc-1];
    Net.send({t:'state', sc:st.n, title:st.t, e:st.e, clock:st.clock, task:curTask(), timer:{left:Math.ceil(TIMER.left()), run:TIMER.run()}});
  },120);
}
setInterval(()=>{ if(LIVE.on) pubState(); },6000);
setInterval(()=>{ if(ROLE==='teacher'){ TIMER.tick(); const tc=$('#tClock'); if(tc) tc.textContent=mmss(clockNow()); } },500);

let redrawT=null;
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || !m.from || m.from.role!=='student') return;
  if(m.from.name) NAMES[id]=String(m.from.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='ans' && task && m.task===task.id && !task.locked){
    if(task.kind==='choice'){ const v=+m.v; if(!(v>=0 && v<task.opts.length) || task.lock) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('vote',task.id,id,v); clearTimeout(redrawT); redrawT=setTimeout(()=>draw(false,true),200); return; }
    if(task.kind==='text'){ const text=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,160); if(!text) return;
      const k=WALLQ.findIndex(w=>w.task===task.id && w.sid===id); const item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student', ok:null};
      if(k>=0) WALLQ[k]=item; else WALLQ.unshift(item); SFX.pop(); Store.log('text',task.id,id,text); paintDock(); return; }
  }
  if(m.t==='work' && task && task.kind==='team' && !task.locked){
    const L=String(m.team||''), f=String(m.f||''); if(!TEAMS().some(t=>t.L===L) || !WORK_F.includes(f)) return;
    let v = f==='sub' ? !!m.v : String(m.v||'').slice(0,80);
    if(/^n[123]$/.test(f) && !NAMES4.includes(v)) return;
    S.work[L]=Object.assign({},S.work[L],{[f]:v, by:NAMES[id]||''}); save(); pubState(); Store.log('work','team-'+L+'-'+f,id,v);
    if(f==='sub' && v) toast(`${TEAMS().find(t=>t.L===L).name}: report ready ✅`);
    clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(['build','present'].includes(cur().id) && !document.activeElement.closest('.rline')) draw(false,true); else paintDock(); },400); return;
  }
}
function paintDock(){
  const d=$('#dock'); d.classList.toggle('on',LIVE.on && ROLE==='teacher'); if(!LIVE.on) return;
  const st=Net.status, stTxt={live:'● live', local:'● this browser only', reconnecting:'● reconnecting…', connecting:'● connecting…', off:'● offline'}[st]||st;
  $('#dockTitle').textContent='Room '+S.room;
  $('#dockLed').className='led '+(st==='live'?'on':st==='off'?'bad':'warn');
  const studs=LIVE.peers.filter(p=>p&&p.role==='student');
  $('#dockCount').textContent=`${studs.length} joined · ${stTxt}`;
  const task=curTask(); let h='';
  h+= studs.length?`<div class="names">${studs.slice(0,40).map(p=>`<span>${esc(p.name||'?')}</span>`).join('')}</div>`:`<div class="small">Nobody yet — share the link or code (📡 Live).</div>`;
  h+=`<div class="row" style="gap:8px"><button class="btn sm ${S.lock?'amber':'ghost'}" id="dLock">${S.lock?'🔒 Answers locked — unlock':'🔓 Lock answers'}</button></div>`;
  if(!task) h+=`<div class="small">No phone task on this screen — phones show “Look at the main screen”.</div>`;
  else if(task.kind==='choice'){ const n=counts(task.id,task.opts.length), tot=Object.keys(S.lv[task.id]||{}).length, mx=Math.max(1,...n);
    h+=`<div class="small">${tot} answered · ${esc(task.q.slice(0,80))}</div>`+task.opts.map((o,i)=>`<div class="dbar"><span>${task.correct===i?'✅ ':''}${esc(o)}</span><b class="mono" style="color:var(--cyan);text-align:right">${n[i]}</b><div class="tr"><i class="${task.correct===i?'ok':''}" style="width:${n[i]/mx*100}%"></i></div></div>`).join(''); }
  else if(task.kind==='text'){ const list=WALLQ.filter(w=>w.task===task.id); h+= list.length?`<div class="small">${list.length} answers — Show puts one on the screen</div>`+list.map(w=>`<div class="wallit"><p>${esc(w.text)}<small>${esc(w.by)}</small></p><button class="btn sm" data-w="${w.id}">Show</button><button class="btn sm ghost" data-wx="${w.id}" aria-label="Hide">✕</button></div>`).join(''):`<div class="small">Waiting for answers…</div>`; }
  else if(task.kind==='team'){ h+=TEAMS().map(t=>{ const w=S.work[t.L]||{}; const n=reportLines(w).length; return `<div class="small">${t.e} ${t.name}: ${n?`<b style="color:var(--ok)">${n}/4 sentences</b>`:'…'}${w.sub?' · ✅ ready':''}</div>`; }).join(''); }
  else if(task.kind==='react3') h+=`<div class="small">Phones can send ✅ Clear · 🧠 Great modals · 🕵️ Good evidence.</div>`;
  $('#dockBody').innerHTML=h;
  $('#dLock').onclick=()=>{ S.lock=!S.lock; save(); pubState(); paintDock(); toast(S.lock?'🔒 Phone answers locked':'🔓 Phone answers open'); };
  $$('[data-w]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.w); if(k<0) return; const w=WALLQ.splice(k,1)[0]; (S.wall[w.task]=S.wall[w.task]||[]).push({text:w.text, by:w.by}); save(); draw(false,true); });
  $$('[data-wx]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.wx); if(k>=0) WALLQ.splice(k,1); paintDock(); });
}
$('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
const baseURL = ()=> location.href.split('?')[0].split('#')[0];
const joinURL = ()=> baseURL()+'?room='+S.room+'&role=student';
async function startLive(silent){
  const kind=await Net.connect({room:S.room, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); if(!$('#modal').classList.contains('hidden') && $('#lvStatus')) $('#lvStatus').innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); if($('#lvStatus')) $('#lvStatus').innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save();
  $('#btnLive').classList.toggle('on',LIVE.on);
  pubState(); draw(false,true);
  if(!silent) toast(kind==='supabase'?'Live room open — share the link, QR or code':kind==='local'?'Supabase is not reachable — the room works in THIS browser only':'Live room could not start');
  return kind;
}
function liveStatus(){
  if(!LIVE.on) return 'not started';
  const n=LIVE.peers.filter(p=>p&&p.role==='student').length;
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● live (Supabase)</span>' : Net.status==='local' ? '<span style="color:var(--amber)">● this browser only — Supabase is not configured or not reachable</span>' : `<span style="color:var(--amber)">● ${esc(Net.status)}</span>`;
  return `${s} · ${n} joined`;
}
function openLive(){
  openModal(`<div class="row"><h2 class="dsp grow" style="font-size:36px">📡 Live Student Mode</h2><button class="btn sm ghost" onclick="closeModal()" aria-label="Close">✕</button></div>
   <p class="small">Optional. Students join from a phone with a nickname — no account. They vote, send short answers and write their team report; you see everything here and in the room panel. The lesson works fully without it.</p>
   <div class="two mt" style="align-items:center"><div><div class="small">Room code</div><div class="dsp" style="font-size:72px;letter-spacing:.04em">${S.room}</div>
     <div class="small" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" style="margin-top:8px">Or open <b>${esc(baseURL())}?join</b> and type the code.</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:end" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?`<button class="btn" id="lvStop">⏹ Stop room</button>`:`<button class="btn primary" id="lvStart">▶ Start live room</button>`}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   <p class="small mt">Nothing is stored on a server: answers live only in this browser and disappear with ⟲ Restart lesson.</p>
   ${configured()?'':'<p class="small mt" style="color:var(--amber)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → phones on other devices cannot connect.</p>'}`);
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ Net.send({t:'end'}); Net.stop(); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); $('#btnLive').classList.remove('on'); draw(false,true); openLive(); };
  $('#lvCopy').onclick=()=>copy(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand6(); save(); openLive(); };
}

/* ---------- 10 · student app (?room=123456&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6);
  let st=null, name='', sent={}, myTeam='', taskKey='';
  try{ name=localStorage.getItem('l08name')||''; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':'warn');
    $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','🔥','✋','🕵️'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="card stu-card"><div class="row" style="gap:10px">${av('mia',46)}${av('leo',46)}${av('alex',46)}${av('you',46)}</div>
      <h2 class="dsp mt" style="font-size:32px">Join the investigation 🕵️</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="123456" autocomplete="off">
      <label for="nm">Your nickname</label><input id="nm" maxlength="20" value="${esc(name)}" placeholder="e.g. Detective Fox 🦊" autocomplete="off">
      <p class="small mt" style="margin-top:8px">Use a nickname or first name only. No surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join →</button></div>`;
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,20); if(r.length<4) return $('#rc').focus(); if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l08name',name); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  const join=async()=>{
    $('#stuRoom').textContent='room '+room;
    try{ myTeam=localStorage.getItem('l08team-'+room)||''; }catch(e){}
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🔌</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, onStatus:setConn, onEvent:m=>{
      if(!m.from || m.from.role!=='teacher') return;
      if(m.t==='state'){ const k=JSON.stringify([m.sc, m.task && Object.assign({},m.task,{work:undefined})]); const changed=k!==taskKey; st=m; if(changed){ taskKey=k; render(); } else { paintT(); syncTeam(); } }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for your teacher…<br><span class="small">Room ${esc(room)} — is the code right? <a href="?join" style="color:var(--cyan)">Change</a></span>`; },6000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">🎬✅</div><h2 class="dsp" style="font-size:32px">Mission complete!</h2><p class="small">Thanks, ${esc(name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer){ t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); } };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const syncTeam=()=>{ if(!st||!st.task||st.task.kind!=='team'||!myTeam) return; const w=(st.task.work||{})[myTeam]||{};
    $$('[data-tf]',B).forEach(inp=>{ if(document.activeElement!==inp && typeof w[inp.dataset.tf]==='string' && inp.value!==w[inp.dataset.tf]) inp.value=w[inp.dataset.tf]; });
    $$('[data-tn]',B).forEach(b=>b.classList.toggle('on', w[b.dataset.tn]===b.dataset.v));
    const sb=$('#tsub',B); if(sb){ sb.textContent=w.sub?'✅ Sent to the teacher':'✔ Send report to the teacher'; sb.classList.toggle('green',!!w.sub); }
    const pv=$('#tprev',B); if(pv) pv.innerHTML=prevHTML(w); };
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait"><div class="bigi">👀</div><p>Hi ${esc(name)}! Waiting for your teacher…</p></div>`; return; }
    const T=st.task, head=`<div class="stu-prog">${STAGES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div><div class="small mono" style="letter-spacing:.12em;margin-bottom:10px">${st.e||''} SCENE ${st.sc} OF 7 · ${esc(st.title||'')} · ${esc(st.clock||'')}</div>`;
    if(!T){ B.innerHTML=head+`<div class="stu-wait card stu-card" style="padding-top:26px"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Your teacher will send a task soon. You can tap an emoji below.</p></div>`; return; }
    if(T.kind==='choice'){
      const my=sent[T.id];
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.correct===i?'right':my===i?(T.lock?'wrongpick':'pick'):''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T.locked&&T.correct==null?'🔒 Answers are closed for now.':T.lock?(T.correct===null||T.correct===undefined?'✓ Voting closed.':my===T.correct?'🎉 Nice deduction! The answer is on the main screen.':'✓ The answer is on the main screen.'):my!==undefined?'✓ Sent! You can change it.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T.kind==='text'){
      if(T.locked){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><p class="small">🔒 Answers are closed for now. Answer aloud!</p></div>`; return; }
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><input id="tx" maxlength="160" placeholder="${esc(T.ph||'')}" autocomplete="off"><button class="btn primary mt" id="sd" style="width:100%">Send ➤</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. You can send a new version.':'Your teacher can show your answer on the screen.'}</p></div>`;
      const go=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      $('#sd').onclick=go; $('#tx').onkeydown=e=>{ if(e.key==='Enter') go(); };
      return;
    }
    if(T.kind==='team'){
      const t=(T.teams||[]).find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">📝 Which team are you in?</p><div class="opts">${T.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>${x.name}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l08team-'+room,myTeam); }catch(e){} render(); }); return; }
      const w=(T.work||{})[myTeam]||{};
      B.innerHTML=head+`<div class="card stu-card"><div class="row"><span style="font-size:32px">${t.e}</span><div class="grow"><b style="font-size:19px">${t.name} · Detective report</b><div class="small mono" id="stuT"></div></div><button class="btn sm ghost" id="chg">change</button></div>
        <p class="small mt">Who probably moved the video? Complete the sentences together — your team sees the same text.${T.locked?' <b>🔒 Locked by the teacher.</b>':''}</p>
        <div class="rb mt">${RLINES.map(l=>`<div class="rline"><div class="st" style="font-size:17px"><span class="no">${l.no}</span>${l.pre?`<span>${l.pre}</span>`:''}${l.name?`<span class="seg">${NAMES4.map(n=>`<button class="${w[l.name]===n?'on':''}" data-tn="${l.name}" data-v="${n}">${l.no===1?n:cap(n)}</button>`).join('')}</span>`:''}<span class="fix">${l.mid}</span></div>
          <input data-tf="${l.f}" maxlength="80" value="${esc(w[l.f]||'')}" placeholder="${esc(l.sugg[0])}…" autocomplete="off" ${T.locked?'disabled':''}></div>`).join('')}</div>
        <div class="exrep mt" id="tprev" style="background:rgba(61,169,255,.06);border-color:rgba(61,169,255,.35)">${prevHTML(w)}</div>
        <button class="btn mt ${w.sub?'green':'primary'}" id="tsub" style="width:100%" ${T.locked?'disabled':''}>${w.sub?'✅ Sent to the teacher':'✔ Send report to the teacher'}</button>
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      const W=()=>((st.task.work=st.task.work||{})[myTeam]=st.task.work[myTeam]||{});
      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l08team-'+room); }catch(e){} render(); };
      $$('[data-tn]',B).forEach(b=>b.onclick=()=>{ if(T.locked) return; W()[b.dataset.tn]=b.dataset.v; Net.send({t:'work', team:myTeam, f:b.dataset.tn, v:b.dataset.v}); syncTeam(); });
      $$('[data-tf]',B).forEach(inp=>{ let tm=null; inp.oninput=()=>{ $('#ok').textContent='…'; W()[inp.dataset.tf]=inp.value.slice(0,80); $('#tprev').innerHTML=prevHTML(W()); clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:inp.dataset.tf, v:inp.value.slice(0,80)}); $('#ok').textContent='✓ Saved — your teacher can see it.'; },700); }; });
      $('#tsub').onclick=()=>{ if(T.locked) return; const v=!W().sub; W().sub=v; Net.send({t:'work', team:myTeam, f:'sub', v}); syncTeam(); };
      return;
    }
    if(T.kind==='react3'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:22px;font-weight:800">🎤 ${esc(T.q)}</p><p class="small">How was it? Tap to react.</p>
        <div class="opts">${[['✅','Clear'],['🧠','Great modals'],['🕵️','Good evidence']].map(([e,l])=>`<button class="opt" data-r="${e}"><span class="L">${e}</span><span>${l}</span></button>`).join('')}</div></div>`;
      $$('[data-r]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.r}); b.animate?.([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:250}); });
      return;
    }
  };
  (room && name) ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnLive').onclick=openLive; $('#btnEv').onclick=showEv; $('#btnGram').onclick=showGrammar;
  $('#btnUA').onclick=toggleUA; $('#btnPresent').onclick=togglePresent;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='e'||k==='E') showEv();
    else if(k==='g'||k==='G') showGrammar();
    else if(k==='u'||k==='U') toggleUA();
    else if(k==='p'||k==='P') togglePresent();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A'||k==='r'||k==='R') doReveal();
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  Object.values(CHARS).forEach(c=>{ if(c.photo){ const im=new Image(); im.src=c.photo; } });
  if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }
  VOICE.probe();
  draw(true);
  if(S.live) startLive(true);   // teacher refreshed the page → reopen the same room; phones stay connected
}

</script>
</body>
</html>
