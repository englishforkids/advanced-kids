.opt.right{border-color:var(--green); background:rgba(54,224,155,.14)}
.opt.right .L{background:var(--green); color:#03140C}
.opt.right::after{content:"✓"; position:absolute; right:-10px; top:-10px; width:30px; height:30px; border-radius:50%; background:var(--green); color:#03140C; display:grid; place-items:center; font-weight:900; font-size:16px}
.opt.wrongpick{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.opt.dim{opacity:.42}
.opt.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opts.chips{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.chips .opt{justify-content:center; font-size:20px}

.explain{margin-top:16px; padding:16px 18px; border-radius:16px; background:rgba(54,224,155,.09); border:1px solid rgba(54,224,155,.4)}
.explain .k{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--green)}
.explain .a{font-family:var(--dsp); font-size:28px; margin:2px 0 4px}
.explain p{margin:0; font-size:18px}
.explain .ex{margin-top:8px; font-size:17px; color:#D6DAF0}
.explain .ex b{color:#fff}
.stamp{animation:stampIn .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stampIn{from{opacity:0; transform:scale(1.25) rotate(-2deg)} to{opacity:1; transform:none}}

.cdots{display:flex; gap:6px; flex-wrap:wrap}
.cdots button{min-width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid var(--line); font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted)}
.cdots button.done{background:rgba(54,224,155,.15); border-color:rgba(54,224,155,.5); color:var(--green)}
.cdots button.cur{background:var(--cyan); color:#04111A; border-color:var(--cyan)}
.deckbar{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap}

.sit{border-radius:22px; padding:28px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative; overflow:hidden; min-height:220px; display:flex; flex-direction:column; justify-content:center}
.sit .num{position:absolute; right:18px; top:12px; font-family:var(--dsp); font-size:84px; color:rgba(255,255,255,.05); line-height:1}
.sit .ico{font-size:52px; line-height:1; margin-bottom:12px}
.sit p{font-size:clamp(22px,2.5vw,30px); font-weight:800; line-height:1.3; margin:0}

.hintbox{margin-top:14px; padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.1); border:1px dashed rgba(255,193,77,.55); color:#FFE3A8; font-size:17px}
.hintbox b{color:#fff}

/* flash cards */
.flash{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.fc{perspective:900px; height:150px}
.fc .in{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:16px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; border:1px solid var(--line2)}
.fc .fa{background:linear-gradient(160deg,#1C2340,#121629); font-weight:800; font-size:20px}
.fc .fa small{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--faint); margin-top:8px}
.fc .fb{background:linear-gradient(160deg,rgba(57,216,246,.2),rgba(141,123,255,.18)); transform:rotateY(180deg); font-size:16.5px; font-weight:600}
.fc .fb b{display:block; font-size:15px; color:var(--cyan); margin-bottom:5px}

/* voice message */
.voice{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:20px; background:#1B2138; border:1px solid var(--line2); max-width:460px; flex:1; min-width:220px}
.voice .play{width:52px; height:52px; flex:0 0 52px; border-radius:50%; background:var(--nora); color:#03140C; display:grid; place-items:center; font-size:20px}
.wave{flex:1; display:flex; align-items:center; gap:3px; height:42px}
.wave i{flex:1; border-radius:3px; background:rgba(255,255,255,.3); height:var(--h)}
.voice.playing .wave i{animation:wv .8s ease-in-out infinite; background:var(--nora)}
@keyframes wv{50%{transform:scaleY(.4)}}
.transcript{margin-top:12px; padding:14px 18px; border-radius:16px; background:rgba(67,229,160,.08); border:1px solid rgba(67,229,160,.35); font-size:22px; font-weight:800}
.transcript small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--nora); font-weight:700}

.gapline{font-size:clamp(22px,2.6vw,32px); font-weight:800; line-height:1.9}
.gap{display:inline-flex; min-width:150px; justify-content:center; padding:0 12px; margin:0 4px; border-radius:12px; border:2px dashed var(--line3); color:var(--faint); line-height:1.45; vertical-align:middle; transition:.2s}
.gap.f{border-style:solid; border-color:var(--cyan); color:#fff; background:rgba(57,216,246,.1)}
.gap.ok{border-color:var(--green); background:rgba(54,224,155,.14); color:#fff}
.gap.no{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.chipset{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.chipset .lab{width:100%; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted)}
.chip{padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-weight:800; font-size:18px}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{border-color:var(--cyan); background:rgba(57,216,246,.14)}
.recovered{display:flex; align-items:center; gap:16px; padding:18px 22px; border-radius:20px; background:linear-gradient(135deg,rgba(54,224,155,.18),rgba(57,216,246,.1)); border:1px solid rgba(54,224,155,.55)}
.recovered .t{font-family:var(--dsp); font-size:clamp(24px,3vw,36px)}

/* truth board */
.board{position:relative; border-radius:28px; padding:28px; background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.04),transparent 40%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px), #0E1220; border:1px solid var(--line2); overflow:hidden}
.chain{display:grid; gap:0; justify-items:center}
.node{position:relative; display:flex; gap:14px; align-items:center; width:min(100%,var(--w)); padding:14px 18px; border-radius:18px; border:1px solid var(--line2); background:#161B2E;
  transform:rotate(var(--rot)); box-shadow:0 18px 30px -20px #000}
.node .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.node .tx{font-weight:800; font-size:var(--fs); line-height:1.25}
.node .tx small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); font-weight:700}
.node.fx{animation:nodeIn .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes nodeIn{from{opacity:0; transform:rotate(var(--rot)) translateY(-18px) scale(.9)} to{opacity:1; transform:rotate(var(--rot))}}
.node.rumour{background:linear-gradient(135deg,#3A0E1E,#25091A); border:2px solid var(--red); box-shadow:0 0 40px -6px rgba(255,84,112,.7)}
.node.rumour .tx{color:#FFE1E7; text-transform:uppercase; letter-spacing:.01em; animation:glitch 2.4s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none; transform:none}93%{text-shadow:-3px 0 var(--cyan),3px 0 var(--red); transform:translateX(2px)}96%{text-shadow:3px 0 var(--cyan),-3px 0 var(--red); transform:translateX(-2px)}}
.link{height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; letter-spacing:.14em; font-weight:700}
.link .ln{width:2px; flex:1; background:repeating-linear-gradient(180deg,var(--red) 0 6px,transparent 6px 10px)}
.link span{padding:2px 10px; border-radius:99px; background:#2A1220; border:1px solid rgba(255,84,112,.5); color:#FFB4C2; white-space:nowrap}
.strip{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px}
.strip span{font-family:var(--mono); font-weight:700; letter-spacing:.08em; padding:9px 14px; border-radius:12px; font-size:15px}
.strip i{font-style:normal; color:var(--faint)}
.strip.fx span{animation:popIn .4s both}
.strip.fx span:nth-of-type(2){animation-delay:.15s}.strip.fx span:nth-of-type(3){animation-delay:.3s}.strip.fx span:nth-of-type(4){animation-delay:.45s}

/* speaking */
.spq{border-radius:26px; padding:30px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative}
.spq .q{font-size:clamp(26px,3.1vw,40px); font-weight:800; line-height:1.22}
.fu{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.fu button{padding:9px 14px; border-radius:12px; font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.08em; border:1.5px solid var(--line2); background:rgba(255,255,255,.05)}
.fu button.on{border-color:var(--amber); color:var(--amber); background:rgba(255,193,77,.1)}
.fuq{margin-top:12px; display:grid; gap:8px}
.fuq div{padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.08); border-left:4px solid var(--amber); font-size:20px; font-weight:700}
.sample{margin-top:16px; padding:14px 18px; border-radius:16px; background:rgba(54,224,155,.08); border:1px solid rgba(54,224,155,.4); font-size:20px; font-weight:700}
.sample small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--green)}
.wall{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.wall .w{padding:10px 14px; border-radius:14px; background:rgba(57,216,246,.1); border:1px solid rgba(57,216,246,.4); font-weight:700; font-size:17px; animation:popIn .4s both}
.wall .w small{display:block; font-size:12px; color:var(--muted)}

/* rumour control unit */
.rcu{display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:20px; background:linear-gradient(90deg,rgba(255,84,112,.18),rgba(255,84,112,.04)); border:1px solid rgba(255,84,112,.5); margin-bottom:18px}
.siren{font-size:40px; animation:siren 1s steps(2) infinite}
@keyframes siren{50%{filter:hue-rotate(200deg) brightness(1.3)}}
.steps6{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:10px}
.steps6 li{display:flex; gap:14px; align-items:center; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:19px; font-weight:700}
.steps6 li::before{counter-increment:s; content:counter(s); width:36px; height:36px; flex:0 0 36px; border-radius:50%; display:grid; place-items:center; background:var(--red); color:#fff; font-family:var(--mono); font-weight:700}
.steps6 li b{color:var(--amber)}
.cf{border-radius:22px; padding:18px; background:#0E1222; border:1px solid var(--line2)}
.cf .hd{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; letter-spacing:.14em; color:var(--muted); margin-bottom:10px}
.cf .hd b{color:#fff; letter-spacing:.06em; font-size:15px}
.cf .rum{padding:10px 14px; border-radius:14px; background:rgba(255,84,112,.1); border:1px dashed rgba(255,84,112,.55); font-weight:700; font-size:16.5px; margin-bottom:12px}
.cf .rum small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:#FF9AAE}
.cf .chat{padding:0}
.cf .bub{font-size:17.5px}
.rep{display:grid; gap:8px}
.rep div{padding:10px 14px; border-radius:12px; background:rgba(57,216,246,.08); border-left:4px solid var(--cyan); font-size:18px; font-weight:700}
.rep div b{color:var(--amber)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{padding:10px 16px; border-radius:12px; border:1.5px solid var(--line2); background:rgba(255,255,255,.04); font-weight:800; font-size:16px}
.tabs button.on{border-color:var(--cyan); background:rgba(57,216,246,.14); color:#fff}
.vbank{display:flex; gap:7px; flex-wrap:wrap}
.vbank span{font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(255,193,77,.1); border:1px solid rgba(255,193,77,.4); color:var(--amber)}

/* timer ring */
.ringbox{display:flex; flex-direction:column; align-items:center; gap:10px}
.ring{position:relative; width:150px; height:150px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringG); stroke-linecap:round; transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:34px; font-weight:700}
.ring .t.end{color:var(--red)}
.ring.hurry{animation:hurry 1s ease-in-out infinite}
@keyframes hurry{50%{transform:scale(1.04); filter:drop-shadow(0 0 16px var(--red))}}

/* reports + vote */
.checklist{display:grid; gap:8px}
.checklist div{display:flex; gap:12px; align-items:center; font-size:19px; font-weight:700}
.checklist div::before{content:"✓"; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:rgba(54,224,155,.15); color:var(--green); border:1px solid rgba(54,224,155,.5); font-weight:900}
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px}
.tcard{border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.tcard.done{border-color:rgba(54,224,155,.6); background:rgba(54,224,155,.08)}
.tcard .tn{display:flex; align-items:center; gap:10px}
.tcard .tn b{font-size:19px} .tcard .tn span{font-size:24px}
.tcard .ws{font-size:15.5px; color:#D6DAF0; display:grid; gap:4px}
.tcard .ws div{padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.05)}
.awards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.award{border-radius:22px; padding:18px; background:rgba(255,255,255,.045); border:1.5px solid var(--line); text-align:center; cursor:pointer; transition:.2s}
.award .e{font-size:44px}
.award b{display:block; font-size:19px; margin-top:6px}
.award.on{border-color:var(--amber); background:rgba(255,193,77,.08); box-shadow:0 0 30px -10px var(--amber)}
.vbars{display:grid; gap:10px; margin-top:16px}
.vbar{display:grid; grid-template-columns:150px 1fr 50px; gap:12px; align-items:center}
.vbar button{text-align:left; font-weight:800; font-size:17px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:rgba(255,255,255,.04)}
.vbar .tr{height:30px; border-radius:10px; background:rgba(255,255,255,.06); overflow:hidden}
.vbar .tr i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--amber),var(--red)); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vbar .c{font-family:var(--mono); font-weight:700; font-size:18px}
.vbar.win button{border-color:var(--amber); color:var(--amber)}
.winners{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px}
.winners div{padding:12px; border-radius:16px; border:1px solid rgba(255,193,77,.5); background:rgba(255,193,77,.08); text-align:center; font-weight:800}

/* ending */
.closed{position:relative; text-align:center; padding:30px; border-radius:28px; background:radial-gradient(circle at 50% 0%,rgba(54,224,155,.22),transparent 60%),#0E1322; border:1px solid rgba(54,224,155,.5); overflow:hidden}
.closed .st{display:inline-block; white-space:nowrap; font-family:var(--dsp); font-size:clamp(34px,4.4vw,64px); color:var(--green); border:6px solid var(--green); border-radius:18px; padding:4px 26px; transform:rotate(-5deg); text-shadow:0 0 30px rgba(54,224,155,.5)}
.closed .st.fx{animation:bigStamp .7s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes bigStamp{from{opacity:0; transform:rotate(-5deg) scale(2.2)} to{opacity:1; transform:rotate(-5deg) scale(1)}}
.versions{display:flex; justify-content:center; gap:10px; margin:22px 0 10px; flex-wrap:wrap}
.versions span{font-size:18px; font-weight:800; padding:8px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.moral{font-family:var(--dsp); font-size:clamp(26px,3.2vw,42px); margin-top:12px}
.moral em{font-style:normal; color:var(--cyan)}

/* summary */
.sum{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sumc{border-radius:20px; padding:18px; background:rgba(255,255,255,.045); border:1px solid var(--line)}
.sumc h3{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin-bottom:10px}
.sumc .l{display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:18px; font-weight:700; border-bottom:1px solid var(--line)}
.sumc .l:last-child{border-bottom:0}
.sumc .l span:first-child{color:var(--mia)}
.sumc .l span:last-child{color:var(--cyan); text-align:right}
.sumc.span2{grid-column:span 2}
.vchips{display:flex; gap:8px; flex-wrap:wrap}
.vchips span{font-family:var(--dsp); font-size:22px; padding:6px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.unlock{animation:unlock .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes unlock{from{opacity:0; transform:translateY(16px) scale(.95); filter:blur(4px)} to{opacity:1; transform:none; filter:none}}

/* evidence board (modal) */
.evb{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:8px 4px 4px; position:relative}
.evc{position:relative; border-radius:16px; padding:16px 16px 14px; min-height:150px; background:#F4EEDD; color:#20180A; box-shadow:0 18px 30px -16px #000; transform:rotate(var(--rot))}
.evc .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.evc .k{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em; color:#8A6A2E}
.evc b{display:block; font-size:17px; margin:2px 0 6px}
.evc p{margin:0; font-size:15.5px; font-weight:600; line-height:1.35}
.evc .rp{margin-top:8px; font-size:14.5px; font-weight:700; color:#0E5A7A}
.evc.lock{background:transparent; color:var(--faint); border:2px dashed var(--line2); box-shadow:none; display:grid; place-items:center; text-align:center}
.evc.lock b{font-size:34px}
.evc.new{animation:evNew 1s ease}
@keyframes evNew{30%{transform:rotate(0) scale(1.06); box-shadow:0 0 40px var(--amber)}}
.evhead{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.evbar{flex:1; height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.evbar i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); border-radius:99px; transition:width .6s}

/* clue fly */
#clueFx{position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; opacity:0}
#clueFx.on{animation:clueFade 2.4s ease forwards}
#clueFx .cc{width:min(420px,86vw); border-radius:22px; padding:22px 24px; background:#F4EEDD; color:#20180A; box-shadow:0 40px 80px -20px #000, 0 0 0 4px rgba(255,193,77,.6); text-align:center}
#clueFx .cc .k{font-family:var(--mono); font-weight:700; letter-spacing:.2em; color:#1A7F55; font-size:14px}
#clueFx .cc b{display:block; font-family:var(--dsp); font-size:28px; margin:6px 0}
#clueFx .cc p{margin:0; font-weight:700}
#clueFx.on .cc{animation:clueFly 2.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes clueFade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes clueFly{0%{transform:scale(.6) rotate(-6deg)}14%{transform:scale(1.05) rotate(2deg)}22%{transform:scale(1) rotate(-1deg)}72%{transform:scale(1) rotate(-1deg) translate(0,0)}100%{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(10deg)}}

/* scene card */
#scard{position:fixed; inset:0; z-index:60; pointer-events:none; display:grid; place-items:center; opacity:0}
#scard.on{animation:scard 1.5s ease forwards}
#scard .in{text-align:center; padding:26px 46px; border-radius:26px; background:rgba(8,11,22,.88); border:1px solid var(--line2); backdrop-filter:blur(8px)}
#scard .k{font-family:var(--mono); letter-spacing:.24em; color:var(--cyan); font-size:14px}
#scard h2{font-family:var(--dsp); font-size:clamp(34px,5vw,60px); margin-top:8px}
@keyframes scard{0%{opacity:0; transform:scale(.96)}15%{opacity:1; transform:none}75%{opacity:1}100%{opacity:0}}

/* teacher panel, dock, modal, toast */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(440px,94vw); z-index:50; background:#0B0F1E; border-left:1px solid var(--line2); box-shadow:-30px 0 60px -20px #000;
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column}
#teacher.on{transform:none}
.thd{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); font-family:var(--mono); letter-spacing:.12em}
#tBody{overflow:auto; padding:14px 16px 30px; display:grid; gap:14px}
.tsec{padding:14px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid var(--line); font-size:16px}
.tsec h5{margin:0 0 8px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--cyan); text-transform:uppercase}
.tsec ul{margin:0; padding-left:18px} .tsec li{margin:4px 0}
.say{padding:10px 12px; border-radius:12px; background:rgba(57,216,246,.08); border-left:3px solid var(--cyan); font-weight:700}
.tgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sw{display:flex; align-items:center; gap:10px; justify-content:space-between; padding:6px 0; font-size:15px}
.sw button{width:46px; height:26px; border-radius:99px; background:rgba(255,255,255,.12); position:relative; transition:.2s; flex:0 0 46px}
.sw button::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s}
.sw button.on{background:var(--cyan)} .sw button.on::after{left:23px}
.stg{display:grid; gap:6px}
.stg button{display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:10px; border:1px solid var(--line); text-align:left; font-size:15px; font-weight:700}
.stg button.on{border-color:rgba(54,224,155,.55); background:rgba(54,224,155,.1)}
.tmap{display:grid; gap:4px}
.tmap .sn{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; color:var(--cyan); margin-top:10px}
.tmap button{display:flex; gap:8px; align-items:center; padding:7px 10px; border-radius:10px; text-align:left; font-size:15px; border:1px solid transparent}
.tmap button:hover{background:rgba(255,255,255,.06)}
.tmap button.cur{border-color:var(--cyan); background:rgba(57,216,246,.1)}
.tmap button.skip{opacity:.45}
.tmap button span:first-child{flex:1}
.tmap .m{font-family:var(--mono); font-size:12px; color:var(--faint)}

#dock{position:fixed; left:16px; bottom:84px; z-index:40; width:330px; max-height:52vh; display:none; flex-direction:column; border-radius:18px; background:rgba(11,15,30,.96); border:1px solid var(--line2); box-shadow:var(--shadow); overflow:hidden}
#dock.on{display:flex}
#dock.min .db{display:none}
.dh{display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--line)}
.db{overflow:auto; padding:10px 12px; display:grid; gap:7px}
.led{width:10px; height:10px; border-radius:50%; background:var(--faint); flex:0 0 10px}
.led.on{background:var(--green); box-shadow:0 0 10px var(--green)} .led.warn{background:var(--amber)} .led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:5px}
.names span{font-size:13px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.07)}
.wallit{display:flex; gap:6px; align-items:center}
.wallit p{flex:1; margin:0; font-size:14.5px} .wallit small{display:block; color:var(--muted); font-size:12px}
.okm{color:var(--green); font-weight:900} .nom{color:var(--bad); font-weight:900}
.dbar{display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; font-size:14px}
.dbar .tr{grid-column:1/-1; height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:-4px}
.dbar .tr i{display:block; height:100%; background:var(--cyan)}
.dbar .tr i.ok{background:var(--green)}

#modal{position:fixed; inset:0; z-index:80; background:rgba(3,4,10,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px}
#modal .box{width:min(980px,100%); max-height:90vh; overflow:auto; border-radius:26px; padding:26px; background:#0D1121; border:1px solid var(--line2); box-shadow:var(--shadow)}
#toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); z-index:90; padding:12px 20px; border-radius:14px; background:#1A2038; border:1px solid var(--line2); font-weight:700; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%)}
#reacts{position:fixed; right:30px; bottom:90px; z-index:45; width:100px; height:60vh; pointer-events:none}
#reacts span{position:absolute; bottom:0; font-size:38px; animation:rise 3s ease-out forwards}
@keyframes rise{to{transform:translateY(-55vh) scale(1.3); opacity:0}}
#confetti{position:fixed; inset:0; z-index:95; pointer-events:none}
#wm{position:fixed; right:18px; bottom:76px; z-index:2; opacity:.16; pointer-events:none}
#wm img{width:86px; display:block}

/* student phone app */
#student{display:none}
body.student{overflow:auto}
body.student #app, body.student #wm{display:none}
body.student #student{display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1}
.stu-top{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:12px 16px; background:rgba(6,8,15,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
.stu-top b{font-family:var(--mono); letter-spacing:.14em; font-size:13px; color:var(--cyan)}
.connst{font-size:12px; color:var(--muted)}
.stu-body{flex:1; padding:16px; max-width:560px; width:100%; margin:0 auto}
.stu-card{padding:20px}
.stu-card label{display:block; font-weight:800; font-size:15px; margin:14px 0 6px}
.stu-card input,.stu-card textarea{width:100%; padding:13px 14px; border-radius:13px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-size:17px}
.stu-card textarea{min-height:64px; resize:vertical}
.stu-wait{text-align:center; padding:50px 10px}
.stu-wait .bigi{font-size:60px}
.stu-foot{position:sticky; bottom:0; display:flex; justify-content:center; gap:8px; padding:10px; background:rgba(6,8,15,.94); border-top:1px solid var(--line)}
.stu-foot button{width:48px; height:48px; border-radius:14px; background:rgba(255,255,255,.06); font-size:24px}
.stu-prog{display:flex; gap:4px; margin-bottom:12px}
.stu-prog i{flex:1; height:5px; border-radius:99px; background:rgba(255,255,255,.1)}
.stu-prog i.d{background:var(--green)} .stu-prog i.c{background:var(--cyan)}

/* responsive */
@media (max-width:1100px){ .prog .st:not(.cur) .lb2{display:none} .prog .st{padding:6px 9px} }
@media (max-width:1080px){
  .two,.two.wl,.two.wr,.hero{grid-template-columns:1fr}
  .verbs,.flash{grid-template-columns:repeat(2,1fr)} .tfgrid{grid-template-columns:repeat(2,1fr)}
  .ch3,.sum,.awards,.winners{grid-template-columns:1fr} .sumc.span2{grid-column:auto}
  .evb{grid-template-columns:repeat(2,1fr)} .tm-grid{grid-template-columns:1fr}
  .tools .hm .lb{display:none} .brand span{display:none}
}
@media (max-width:760px){
  body{font-size:17px} .wrap{padding:16px 16px 50px}
  .prog .ar{display:none} .prog{gap:3px} .prog .st{padding:5px 7px} .prog .st .lb2{display:none}
  .tools .lb{display:none} .navr .lb{display:none} .brand{display:none}
  .verbs,.flash,.evb,.tfgrid{grid-template-columns:1fr} .cast{grid-template-columns:1fr}
  #navInfo{font-size:12px} #dock{width:calc(100vw - 32px)} .vbar{grid-template-columns:110px 1fr 40px}
  .tb{height:40px; min-width:40px; padding:0 9px}
  .node{width:100%; transform:none} .node .tx{font-size:min(var(--fs),20px)} .board{padding:18px 12px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }

/* ═══════════ LESSON 8 · palette + scene atmospheres ═══════════ */
:root{
  --bg:#060A1C; --bg2:#0A1030; --panel:#10173A; --panel2:#161F4A;
  --line:rgba(160,170,255,.12); --line2:rgba(160,170,255,.24); --line3:rgba(160,170,255,.38);
  --text:#EDF0FF; --muted:#A3ABD6; --faint:#6A73A3;
  --cyan:#3DA9FF; --cyan2:#1D7FE0; --teal:#2DE0C4; --violet:#8F7BFF; --indigo:#5B5CF0;
  --red:#FF5C7A; --red2:#C93355; --amber:#FFC24D; --green:#3BE39E;
  --mia:#FF8FC7; --leo:#5AB0FF; --alex:#C3A6FF; --unk:#8D95BD;
  --ok:#3BE39E; --bad:#FF5C7A;
  --g1:rgba(61,169,255,.16); --g2:rgba(143,123,255,.16); --g3:rgba(45,224,196,.10);
}
body::before{
  background:
   radial-gradient(820px 560px at 0% -8%, var(--g1), transparent 62%),
   radial-gradient(780px 560px at 102% 104%, var(--g2), transparent 60%),
   radial-gradient(900px 600px at 70% -20%, var(--g3), transparent 60%),
   linear-gradient(180deg,#0A0F2A,#060A1C 70%);
  transition:background 1s}
body[data-sc="1"]{--g1:rgba(255,92,122,.15); --g2:rgba(91,92,240,.2); --g3:rgba(143,123,255,.12)}
body[data-sc="2"]{--g1:rgba(255,143,199,.14); --g2:rgba(143,123,255,.2); --g3:rgba(91,92,240,.12)}
body[data-sc="3"]{--g1:rgba(61,169,255,.18); --g2:rgba(91,92,240,.18); --g3:rgba(45,224,196,.08)}
body[data-sc="4"]{--g1:rgba(45,224,196,.15); --g2:rgba(61,169,255,.16); --g3:rgba(143,123,255,.1)}
body[data-sc="5"]{--g1:rgba(255,194,77,.12); --g2:rgba(143,123,255,.18); --g3:rgba(61,169,255,.1)}
body[data-sc="6"]{--g1:rgba(91,92,240,.2); --g2:rgba(61,169,255,.16); --g3:rgba(45,224,196,.1)}
body[data-sc="7"]{--g1:rgba(59,227,158,.16); --g2:rgba(61,169,255,.14); --g3:rgba(143,123,255,.1)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#050814}
.btn.teal{background:linear-gradient(135deg,var(--teal),var(--cyan)); color:#03141A; border-color:transparent}
#bar i{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--teal))}
.kick.teal{color:var(--teal)} .kick.vi{color:var(--violet)} .kick.am{color:var(--amber)} .kick.rd{color:var(--red)} .kick.gr{color:var(--green)}
.hlv{background:linear-gradient(transparent 55%,rgba(143,123,255,.5) 55%); padding:0 3px; border-radius:3px; font-weight:800}
.hlt{background:linear-gradient(transparent 55%,rgba(45,224,196,.42) 55%); padding:0 3px; border-radius:3px; font-weight:800}

/* deadline chip + points */
.dl{display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 12px; border-radius:12px; border:1px solid rgba(255,92,122,.45); background:rgba(255,92,122,.1); font-family:var(--mono); font-weight:700; font-size:14px; white-space:nowrap}
.dl b{color:#fff; font-size:16px} .dl span{color:#FFB3C1}
.dl.safe{border-color:rgba(59,227,158,.5); background:rgba(59,227,158,.1)} .dl.safe span{color:#BDF8DE}
.dl.tick{animation:tbBump .7s cubic-bezier(.2,.9,.3,1.4)}
#pts .badge{background:rgba(143,123,255,.18); color:#D6CCFF; border-color:rgba(143,123,255,.5)}
.tb.uaon{border-color:var(--amber); color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset}
#plus{position:fixed; z-index:92; pointer-events:none; font-family:var(--dsp); font-weight:800; font-size:26px; color:#D6CCFF; text-shadow:0 0 20px var(--violet); opacity:0}
#plus.on{animation:plusUp 1.4s ease forwards}
@keyframes plusUp{0%{opacity:0; transform:translateY(10px) scale(.8)}20%{opacity:1; transform:none}80%{opacity:1}100%{opacity:0; transform:translateY(-40px)}}

/* Ukrainian translation: hidden by default, teacher reveals with the UA button */
.uat{display:none!important}
body.ua .uat{display:block!important}
body.ua span.uat,body.ua i.uat{display:inline!important}
.ua-box{margin-top:10px; padding:9px 13px; border-radius:12px; background:rgba(255,194,77,.08); border:1px dashed rgba(255,194,77,.45); color:#FFE4AA; font-size:16.5px; font-weight:600; line-height:1.4}
.ua-box::before{content:"UA · "; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--amber); font-weight:700}

/* presentation mode: bigger, calmer */
body.present{font-size:21px}
body.present .wrap{max-width:1320px}
body.present .tools .lb{display:none}
body.present #wm{display:none}
body.present .shead h1{font-size:clamp(36px,4.6vw,62px)}

/* hero */
.hero h1 em{color:var(--cyan); text-shadow:0 0 34px rgba(61,169,255,.55)}
.hero h1 .ns{color:var(--red); text-shadow:0 0 34px rgba(255,92,122,.5); position:relative; white-space:nowrap}
.hero h1 .ns::after{content:""; position:absolute; left:-2%; right:-2%; top:54%; height:6px; border-radius:6px; background:var(--red); transform:scaleX(0); transform-origin:left; animation:strike 1.2s 1.1s cubic-bezier(.7,0,.2,1) forwards; opacity:.85}
@keyframes strike{to{transform:scaleX(1)}}
.casefile::after{content:"CASE #08"; background:var(--indigo)}
.ghostmsg{display:flex; gap:10px; align-items:center; padding:12px 16px; border-radius:18px; background:rgba(255,255,255,.04); border:1px dashed var(--line3); color:var(--muted); font-style:italic; font-weight:600}
.deadline{display:flex; align-items:center; gap:16px; margin-top:16px; padding:14px 18px; border-radius:18px; background:linear-gradient(90deg,rgba(255,92,122,.16),rgba(91,92,240,.1)); border:1px solid rgba(255,92,122,.45)}
.deadline .t{font-family:var(--dsp); font-size:44px; line-height:1}
.deadline small{display:block; font-family:var(--mono); letter-spacing:.14em; color:#FFB3C1; font-size:12px}
.vidcard{display:flex; align-items:center; gap:14px; padding:14px; border-radius:18px; background:linear-gradient(135deg,rgba(91,92,240,.25),rgba(255,143,199,.12)); border:1px solid var(--line2)}
.vidcard .th{width:96px; height:60px; border-radius:12px; background:linear-gradient(135deg,#5B5CF0,#FF8FC7); display:grid; place-items:center; font-size:26px; flex:0 0 96px; box-shadow:0 10px 24px -12px #000}
.vidcard b{display:block; font-size:18px} .vidcard span{font-size:14px; color:var(--muted)}

/* chat bits */
.bub.unk{background:linear-gradient(180deg,#22263C,#191C2E); border-color:rgba(141,149,189,.6)}
.bub.deleted{background:transparent; border-style:dashed; color:var(--muted); font-style:italic; font-weight:600}
.bub.glitch{animation:delGlitch .9s steps(2) both}
@keyframes delGlitch{0%{filter:none}20%{transform:translateX(3px); filter:hue-rotate(90deg) blur(.6px); text-shadow:-3px 0 var(--cyan),3px 0 var(--red)}40%{transform:translateX(-3px); opacity:.5}60%{transform:translateX(2px); opacity:.8; text-shadow:3px 0 var(--cyan),-3px 0 var(--red)}100%{transform:none; opacity:1; text-shadow:none}}
.delbar{display:block; height:3px; border-radius:3px; margin-top:8px; background:rgba(255,92,122,.25); overflow:hidden}
.delbar i{display:block; height:100%; width:100%; background:var(--red); transform-origin:left; animation:delbar 5s linear forwards}
@keyframes delbar{from{transform:scaleX(1)} to{transform:scaleX(0)}}
.mbanner{display:flex; align-items:center; gap:18px; padding:20px 24px; border-radius:22px; background:linear-gradient(120deg,rgba(61,169,255,.2),rgba(143,123,255,.18) 60%,rgba(45,224,196,.12)); border:1px solid rgba(61,169,255,.55); box-shadow:0 0 50px -14px rgba(61,169,255,.6)}
.mbanner .e{font-size:46px}
.mbanner .k{font-family:var(--mono); font-size:13px; letter-spacing:.2em; color:var(--teal)}
.mbanner .t{font-family:var(--dsp); font-size:clamp(28px,3.4vw,46px); line-height:1.02; margin-top:4px}

/* warm-up */
.wq{border-radius:26px; padding:30px; background:linear-gradient(160deg,#18204A,#0E1430); border:1px solid var(--line2); position:relative; overflow:hidden}
.wq .n{position:absolute; right:22px; top:8px; font-family:var(--dsp); font-size:110px; color:rgba(255,255,255,.05); line-height:1}
.wq .q{font-size:clamp(28px,3.4vw,44px); font-weight:800; line-height:1.18; max-width:90%}

/* shared drive window */
.drive{border-radius:22px; overflow:hidden; border:1px solid var(--line2); background:#0B1130; box-shadow:var(--shadow)}
.drive .wb{display:flex; align-items:center; gap:8px; padding:10px 14px; background:rgba(255,255,255,.04); border-bottom:1px solid var(--line); font-family:var(--mono); font-size:13px; color:var(--muted)}
.drive .wb i{width:11px; height:11px; border-radius:50%; background:#FF5F57; display:inline-block} .drive .wb i+i{background:#FEBC2E} .drive .wb i+i+i{background:#28C840}
.drive .wb b{color:var(--text); margin-left:8px}
.drive .db2{display:grid; grid-template-columns:170px 1fr; min-height:230px}
.drive .side{padding:12px 10px; border-right:1px solid var(--line); display:grid; gap:4px; align-content:start; font-size:14.5px; font-weight:700; color:var(--muted)}
.drive .side span{padding:6px 9px; border-radius:9px}
.drive .side span.on{background:rgba(61,169,255,.14); color:#fff}
.drive .files{padding:10px 12px; display:grid; gap:6px; align-content:start}
.frow{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; background:rgba(255,255,255,.035); border:1px solid var(--line); font-weight:700; font-size:16px}
.frow .ic{font-size:20px} .frow small{margin-left:auto; font-family:var(--mono); font-size:12.5px; color:var(--faint); font-weight:700}
.frow.miss{border:1.5px dashed rgba(255,92,122,.6); background:rgba(255,92,122,.08); color:#FFC4CF}
.frow.miss small{color:var(--red)}
.frow.scanning{border-color:rgba(61,169,255,.7); background:rgba(61,169,255,.12); box-shadow:0 0 22px -8px var(--cyan)}
.frow.done{opacity:.55}
.frow.found{border-color:var(--green); background:rgba(59,227,158,.14); color:#fff; box-shadow:0 0 30px -8px var(--green)}
.frow.found small{color:var(--green)}
.frow.hidden-in{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}

/* choose what to check */
.choose{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.chc2{border-radius:22px; padding:20px; text-align:left; background:rgba(255,255,255,.05); border:1.5px solid var(--line2); display:flex; flex-direction:column; gap:8px; transition:.2s; position:relative}
.chc2:hover{background:rgba(255,255,255,.09); transform:translateY(-2px)}
.chc2 .e{font-size:42px; line-height:1}
.chc2 b{font-size:22px}
.chc2 .n{position:absolute; right:14px; top:12px; font-family:var(--mono); color:var(--cyan); font-weight:700}
.chc2.on{border-color:var(--cyan); background:rgba(61,169,255,.12); box-shadow:0 0 30px -10px var(--cyan)}
.reply{margin-top:18px; display:flex; gap:16px; align-items:center; padding:18px 22px; border-radius:20px; background:rgba(45,224,196,.08); border:1px solid rgba(45,224,196,.45)}
.reply .e{font-size:40px}
.reply p{margin:0; font-size:clamp(19px,2vw,24px); font-weight:700; line-height:1.4}

/* vocabulary cards */
.vgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.vgrid.all{grid-template-columns:repeat(4,1fr)}
.vc{perspective:1000px; height:250px; text-align:left}
.vgrid.all .vc{height:220px}
.vc .in{position:relative; width:100%; height:100%; transition:transform .6s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.vc.on .in{transform:rotateY(180deg)}
.vc .fa,.vc .fb{position:absolute; inset:0; backface-visibility:hidden; border-radius:20px; overflow:hidden; border:1px solid var(--line2)}
.vc .fa{background:#0E1430; display:flex; flex-direction:column}
.vc .fa .im{flex:1; background-size:cover; background-position:center; position:relative}
.vc .fa .im::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(6,10,28,.85))}
.vc .fa .w{position:absolute; left:16px; right:16px; bottom:12px; z-index:1; font-family:var(--dsp); font-size:25px; line-height:1.05}
.vc .fa .w small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--teal); margin-bottom:4px}
.vc .fb{transform:rotateY(180deg); background:linear-gradient(160deg,rgba(61,169,255,.2),rgba(143,123,255,.2)); padding:16px 18px; display:flex; flex-direction:column; gap:6px; overflow:auto}
.vc .fb b{font-family:var(--dsp); font-size:22px; color:#fff}
.vc .fb .d{font-size:16.5px; font-weight:700; line-height:1.35}
.vc .fb .x{font-size:15px; font-weight:600; color:#D9DDF7; padding:7px 10px; border-radius:10px; background:rgba(0,0,0,.18); margin-top:auto}
.vc .fb .uat{font-size:14.5px; color:#FFE4AA; font-weight:700}

/* evidence → grammar board */
.cork{position:relative; border-radius:26px; padding:22px; background:radial-gradient(circle at 30% 0%,rgba(61,169,255,.08),transparent 50%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 3px,transparent 3px 9px),#0C1234; border:1px solid var(--line2)}
.logbox{border-radius:16px; padding:12px 14px; background:#070B22; border:1px solid rgba(61,169,255,.4); font-family:var(--mono); font-size:14.5px; box-shadow:0 0 30px -16px var(--cyan)}
.logbox .h{color:var(--cyan); letter-spacing:.18em; font-size:12px; margin-bottom:6px; display:flex; gap:8px; align-items:center}
.logbox .r{display:flex; gap:12px; padding:4px 0; color:#D7DCF5; font-weight:500}
.logbox .r b{color:var(--teal); font-weight:700; min-width:48px}
.logbox .r.hot{color:#fff} .logbox .r.hot b{color:var(--red)}
.notes{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px}
.note{position:relative; border-radius:14px; padding:14px 12px 12px; min-height:116px; text-align:left; background:#F2ECDB; color:#1E180C; box-shadow:0 16px 26px -16px #000; transform:rotate(var(--rot)); transition:transform .25s, box-shadow .25s}
.note:hover{transform:rotate(0) scale(1.03)}
.note .pin{position:absolute; top:-7px; left:50%; width:15px; height:15px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#9FC9FF,#1D5FE0); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.note .k{font-family:var(--mono); font-size:11px; letter-spacing:.14em; font-weight:700; color:#5B4A1E; display:flex; justify-content:space-between}
.note p{margin:4px 0 0; font-size:15px; font-weight:700; line-height:1.3}
.note.cur{box-shadow:0 0 0 4px var(--cyan), 0 18px 40px -10px rgba(61,169,255,.6); transform:rotate(0) scale(1.03)}
.note.seen{background:#DDF7EA}
.note.lock{background:rgba(255,255,255,.04); color:var(--faint); border:2px dashed var(--line2); box-shadow:none; display:grid; place-items:center; text-align:center}
.note.lock .pin{display:none}
.note.lock b{font-size:30px}
.gpanel{border-radius:24px; padding:24px; background:linear-gradient(170deg,#141B44,#0C1130); border:1px solid rgba(61,169,255,.4); box-shadow:0 0 0 1px rgba(61,169,255,.12) inset, var(--shadow)}
.gpanel .gk{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12.5px; letter-spacing:.18em; color:var(--cyan)}
.gpanel .gk .ico{font-size:30px}
.gpanel h2{font-family:var(--dsp); font-size:clamp(28px,3vw,40px); margin-top:6px}
.evq{margin-top:14px; padding:14px 16px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid var(--line2)}
.evq .lab{font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--amber)}
.evq .qq{font-size:clamp(20px,2.1vw,25px); font-weight:800; margin-top:4px}
.evq .aa{margin-top:6px; font-size:19px; font-weight:800; color:var(--green)}
.formula{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.formula span{font-family:var(--mono); font-weight:700; font-size:clamp(16px,1.6vw,19px); padding:8px 13px; border-radius:12px; background:rgba(143,123,255,.14); border:1px solid rgba(143,123,255,.5); color:#E4DDFF}
.gex{margin:12px 0 0; padding:0; list-style:none; display:grid; gap:8px}
.gex li{padding:10px 14px; border-radius:12px; background:rgba(61,169,255,.07); border-left:4px solid var(--cyan); font-size:clamp(17px,1.7vw,20px); font-weight:600}
.gex li b{color:#fff; background:linear-gradient(transparent 58%,rgba(143,123,255,.5) 58%)}
.gmean{margin-top:12px; font-size:clamp(18px,1.8vw,21px); font-weight:700; line-height:1.45}
.negs{display:grid; gap:10px; margin-top:12px}
.negs div{display:grid; grid-template-columns:200px 1fr; gap:12px; align-items:center; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line)}
.negs div>b{font-family:var(--mono); color:#E4DDFF; font-size:15.5px}
.negs div span b{color:#fff}
.negs div span{font-size:17px; font-weight:600} .negs div span i{font-style:normal; color:var(--muted); display:block; font-size:15px}
.cmp{margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cmp div{padding:12px 14px; border-radius:14px; border:1px solid var(--line2); background:rgba(255,255,255,.03); font-size:16px; font-weight:600}
.cmp div b{display:block; font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--amber); margin-bottom:4px}
.gprog{display:flex; gap:6px; align-items:center}
.gprog i{width:26px; height:8px; border-radius:99px; background:rgba(255,255,255,.1)}
.gprog i.d{background:var(--green)} .gprog i.c{background:var(--cyan)}

/* case note (deck left side) */
.cnote{border-radius:22px; padding:24px; background:linear-gradient(160deg,#18204A,#0D1331); border:1px solid var(--line2); min-height:200px; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden}
.cnote .ico{font-size:48px; line-height:1}
.cnote p{font-size:clamp(23px,2.5vw,31px); font-weight:800; line-height:1.3; margin:12px 0 0}
.cnote .num{position:absolute; right:18px; top:8px; font-family:var(--dsp); font-size:84px; color:rgba(255,255,255,.05)}
.cnote .gp{display:inline-block; min-width:120px; border-bottom:3px dashed var(--cyan); margin:0 4px}

/* voice messages */
.voices{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.vm{--c:var(--teal); border-radius:24px; padding:18px; background:linear-gradient(170deg,#121A44,#0B1130); border:1px solid var(--line2); display:flex; flex-direction:column; gap:12px; position:relative}
.vm.playing{border-color:var(--c); box-shadow:0 0 0 1px var(--c) inset, 0 0 40px -14px var(--c)}
.vm .who{display:flex; align-items:center; gap:12px}
.vm .who b{font-size:20px; display:block} .vm .who small{font-family:var(--mono); color:var(--muted); font-size:12.5px}
.vm .ctrl{display:flex; align-items:center; gap:10px}
.vm .play{width:58px; height:58px; flex:0 0 58px; border-radius:50%; background:var(--c); color:#04141A; display:grid; place-items:center; font-size:22px; box-shadow:0 10px 26px -10px var(--c)}
.vm .rep{width:44px; height:44px; flex:0 0 44px; border-radius:50%; border:1.5px solid var(--line2); display:grid; place-items:center; font-size:18px}
.vm .wave{height:46px}
.vm .wave i{background:rgba(255,255,255,.18)}
.vm .wave i.on{background:var(--c)}
.vm.playing .wave i.on{animation:wv .8s ease-in-out infinite}
.vm .pbar{height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.vm .pbar i{display:block; height:100%; width:0; background:var(--c); border-radius:99px}
.vm .tt{display:flex; justify-content:space-between; font-family:var(--mono); font-size:13px; color:var(--muted)}
.vm .src{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--faint)}
.vm .trn{padding:12px 14px; border-radius:14px; background:rgba(45,224,196,.07); border:1px solid rgba(45,224,196,.35); font-size:17.5px; font-weight:700; line-height:1.45}
.vm .trn b{color:#fff; background:linear-gradient(transparent 58%,rgba(143,123,255,.5) 58%)}
.vm .sm2{display:flex; gap:8px; flex-wrap:wrap}
.vm.p-mia{--c:var(--mia)} .vm.p-leo{--c:var(--leo)} .vm.p-alex{--c:var(--alex)}
.newev{display:flex; align-items:center; gap:14px; padding:12px 18px; border-radius:16px; background:rgba(45,224,196,.1); border:1px solid rgba(45,224,196,.5); margin-bottom:18px}
.newev .k{font-family:var(--mono); font-weight:700; letter-spacing:.2em; color:var(--teal)}
.update{position:relative; overflow:hidden; border-radius:28px; padding:34px; background:radial-gradient(circle at 80% 30%,rgba(195,166,255,.25),transparent 55%),#0D1233; border:1px solid rgba(195,166,255,.5); display:grid; grid-template-columns:auto 1fr; gap:30px; align-items:center}
.update .k{font-family:var(--mono); letter-spacing:.22em; color:var(--alex); font-size:14px}
.update .t{font-family:var(--dsp); font-size:clamp(32px,4.4vw,60px); line-height:1; margin-top:8px}
.update .t em{font-style:normal; color:var(--alex)}
.suspect{position:relative}
.suspect .av{box-shadow:0 0 0 3px var(--bg), 0 0 0 6px var(--alex), 0 0 60px -6px var(--alex)}
.suspect .q{position:absolute; right:-10px; top:-6px; width:48px; height:48px; border-radius:50%; background:var(--amber); color:#1A1200; display:grid; place-items:center; font-family:var(--dsp); font-size:30px; animation:qbob 1.6s ease-in-out infinite}
@keyframes qbob{50%{transform:translateY(-6px) rotate(8deg)}}

/* theory board */
.sus3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.susp{border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px}
.susp b{font-size:20px}
.susp .al{font-size:14.5px; color:#D6DAF2; font-weight:600; line-height:1.35}
.susp .al span{display:block; padding:5px 8px; margin-top:4px; border-radius:9px; background:rgba(255,255,255,.05)}
.pins{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.pins span{font-size:14px; font-weight:700; padding:6px 11px; border-radius:10px; background:#F2ECDB; color:#1E180C; transform:rotate(var(--r,0deg))}
.pins span.off{background:rgba(255,255,255,.05); color:var(--faint); border:1px dashed var(--line2)}
.mustuse{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.mustuse span{font-family:var(--mono); font-size:14px; font-weight:700; padding:5px 11px; border-radius:99px; background:rgba(143,123,255,.13); border:1px solid rgba(143,123,255,.5); color:#E4DDFF}
.prompts{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
.prompts button{padding:8px 13px; border-radius:12px; border:1.5px solid var(--line2); background:rgba(255,255,255,.04); font-weight:800; font-size:15px}
.prompts button.on{border-color:var(--amber); color:var(--amber); background:rgba(255,194,77,.1)}
.bigprompt{margin-top:14px; font-family:var(--dsp); font-size:clamp(28px,3.2vw,42px); color:var(--amber)}

/* report builder */
.rb{display:grid; gap:12px}
.rline{border-radius:18px; padding:14px 16px; background:rgba(255,255,255,.045); border:1px solid var(--line2)}
.rline .st{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:clamp(19px,1.9vw,23px); font-weight:800}
.rline .no{width:32px; height:32px; flex:0 0 32px; border-radius:10px; display:grid; place-items:center; background:var(--indigo); color:#fff; font-family:var(--mono); font-size:15px}
.rline .fix{color:var(--cyan)}
.seg{display:inline-flex; border-radius:12px; border:1.5px solid var(--line2); overflow:hidden}
.seg button{padding:7px 12px; font-weight:800; font-size:16px; border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--cyan); color:#04111A}
.rline input{width:100%; margin-top:10px; padding:13px 15px; border-radius:13px; background:rgba(0,0,0,.25); border:1.5px solid var(--line2); font-size:19px; font-weight:700}
.rline input:focus{border-color:var(--cyan); outline:none; box-shadow:0 0 0 3px rgba(61,169,255,.25)}
.sugg{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
.sugg button{padding:5px 11px; border-radius:99px; border:1px solid var(--line2); background:rgba(255,255,255,.04); font-size:14.5px; font-weight:700; color:#D6DAF2}
.sugg button:hover{border-color:var(--teal); color:#fff}
.rline.ok{border-color:rgba(59,227,158,.5)}
.exrep{border-radius:18px; padding:16px 18px; background:rgba(59,227,158,.07); border:1px solid rgba(59,227,158,.4)}
.exrep div{font-size:19px; font-weight:700; padding:3px 0}
.exrep div b{color:var(--green)}
.prom4{display:grid; gap:8px}
.prom4 div{padding:10px 14px; border-radius:12px; background:rgba(61,169,255,.08); border-left:4px solid var(--cyan); font-size:19px; font-weight:700}
.pres{text-align:left}
.pres .tn{font-family:var(--mono); letter-spacing:.2em; color:var(--teal)}
.pres .ln{font-size:clamp(28px,3.6vw,48px); font-weight:800; line-height:1.25; padding:12px 0; border-bottom:1px solid var(--line); animation:popIn .5s both}
.pres .ln:last-child{border-bottom:0}
.pres .ln em{font-style:normal; color:var(--cyan)}

/* the truth */
.found-card{display:flex; align-items:center; gap:18px; padding:22px 26px; border-radius:24px; background:radial-gradient(circle at 10% 50%,rgba(59,227,158,.3),transparent 60%),#0C1A2A; border:2px solid var(--green); box-shadow:0 0 60px -14px var(--green)}
.found-card .e{font-size:54px}
.found-card .t{font-family:var(--dsp); font-size:clamp(36px,5vw,66px); color:var(--green); line-height:1}
.found-card .p{font-family:var(--mono); font-size:15px; color:#CFF9E6; margin-top:6px; letter-spacing:.04em}
.sbar2{height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin:12px 0}
.sbar2 i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--teal),var(--green)); border-radius:99px; transition:width .5s}
.results{display:grid; gap:12px}
.results div{display:flex; align-items:center; gap:14px; padding:14px 20px; border-radius:18px; border:2px solid var(--green); background:rgba(59,227,158,.1); font-family:var(--dsp); font-size:clamp(24px,3vw,38px); color:#E6FFF3; animation:bigStamp2 .6s cubic-bezier(.2,.9,.3,1.4) both}
.results div span{font-size:.9em}
@keyframes bigStamp2{from{opacity:0; transform:scale(1.6) rotate(-3deg)} to{opacity:1; transform:none}}
.gsum{display:grid; gap:8px}
.gsum div{display:grid; grid-template-columns:minmax(200px,.9fr) 1.1fr; gap:14px; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.04); border:1px solid var(--line); align-items:center}
.gsum b{font-family:var(--mono); color:#E4DDFF; font-size:16px}
.gsum span{font-size:17px; font-weight:600}
.final-msg{text-align:center; font-family:var(--dsp); font-size:clamp(26px,3.2vw,42px); line-height:1.15}
.final-msg em{font-style:normal; color:var(--teal)}

/* story map */
.smap{display:flex; align-items:flex-start; justify-content:space-between; gap:0; margin:10px 0 18px; position:relative}
.smap .nd{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; position:relative; min-width:0}
.smap .nd::before{content:""; position:absolute; top:27px; left:-50%; width:100%; height:3px; background:var(--line2); z-index:0}
.smap .nd:first-child::before{display:none}
.smap .nd.done::before,.smap .nd.cur::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.smap .nd button{position:relative; z-index:1; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-size:24px; background:#141A40; border:2px solid var(--line2)}
.smap .nd.done button{border-color:var(--green); background:rgba(59,227,158,.15)}
.smap .nd.cur button{border-color:var(--cyan); background:rgba(61,169,255,.2); box-shadow:0 0 0 6px rgba(61,169,255,.15), 0 0 30px var(--cyan)}
.smap .nd span{font-size:13.5px; font-weight:800; line-height:1.2; padding:0 4px}
.smap .nd small{font-family:var(--mono); font-size:11px; color:var(--faint)}

/* grammar reference modal */
.gref h3{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin:18px 0 8px}

/* responsive (lesson 8 parts) */
@media (max-width:1080px){
  .choose,.voices,.sus3{grid-template-columns:1fr} .vgrid,.vgrid.all{grid-template-columns:repeat(2,1fr)} .notes{grid-template-columns:repeat(2,1fr)}
  .update{grid-template-columns:1fr; text-align:center; justify-items:center} .dl span{display:none}
  .smap{flex-wrap:wrap; gap:12px} .smap .nd{flex:0 0 30%} .smap .nd::before{display:none}
}
@media (max-width:760px){
  .vgrid,.vgrid.all,.notes{grid-template-columns:1fr} .vc,.vgrid.all .vc{height:230px}
  .drive .db2{grid-template-columns:1fr} .drive .side{display:none}
  .negs div,.gsum div,.cmp{grid-template-columns:1fr} .dl{height:40px; padding:0 9px}
}

/* fixes after first visual check */
.brand b,.brand span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hero h1{font-size:clamp(40px,5.2vw,80px)}
.mbanner .t,.deadline .t,.update .t,.found-card .t,.results div,.final-msg,.bigprompt,.vc .fa .w,.gpanel h2,.vc .fb b,.wq .n,.cnote .num{font-weight:800}
.vc{height:clamp(190px,calc((100vh - 420px)/2),250px)}
@media (max-width:1320px){ .tools .lb{display:none} }

.tmap .tag{flex:none; width:auto}
.pres .ln:nth-last-child(2){border-bottom:0}
.hero>*{min-width:0}
@media (max-width:760px){
  #pts,#btnGram,#btnPresent,#btnFull,#btnMap{display:none!important}
  .dl span{display:none} .tools{gap:5px} #top{gap:8px; padding:8px 10px}
  .deadline .t{font-size:32px} .vidcard .th{width:70px; flex-basis:70px}
}
@media (max-width:480px){ #dl{display:none} #navMid{display:none} #nav{justify-content:space-between; gap:6px} #nav .btn.sm{padding:8px 11px} .navr{gap:6px} }
@media (max-width:760px){ .gprog i{width:14px} .gpanel{padding:18px} .cork{padding:14px} .logbox{font-size:13px} }
#stage{overflow-x:hidden}

</style>
</head>

  <div class="db" id="dockBody"></div>
</div>

function burst(el, set=['✨','⭐','💥','✨']){
  if(!el || REDUCED) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.textContent=set[i%set.length];
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;z-index:96;pointer-events:none;font-size:${18+Math.random()*16}px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s`;
    document.body.appendChild(s); const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    requestAnimationFrame(()=>{ s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*180}deg)`; s.style.opacity='0'; });
    setTimeout(()=>s.remove(),950); }
}

function optsHTML(key, opts, d, right, cls=''){
  const shown=(d.shown||{})[key], pick=(d.pick||{})[key], n=counts(key, opts.length);
  return `<div class="opts ${cls}">${opts.map((o,i)=>{
    let c=''; if(shown){ c = i===right ? 'right '+fx('reveal') : (pick===i ? 'wrongpick' : 'dim'); } else if(pick===i) c='pick';
    return `<button class="opt ${c}" data-pick="${key}" data-i="${i}"><span class="L">${LET[i]}</span><span>${o}</span><span class="n">${n[i]||''}</span></button>`; }).join('')}</div>`;
}
function bindPicks(root, d){
  $$('[data-pick]',root).forEach(b=>b.onclick=()=>{ const k=b.dataset.pick; if((d.shown||{})[k]) return; d.pick=d.pick||{}; d.pick[k]= d.pick[k]===+b.dataset.i ? undefined : +b.dataset.i; save(); SFX.pop(); draw(false,true); });
}
function revealBurst(root){ if(FX.has('reveal')){ const r=$('.opt.right',root); if(r) setTimeout(()=>burst(r),60); } }
/* praise or gentle push after Check answer */
function judge(key, pick, right){
  if(pick===undefined) { SFX.ok(); return; }
  if(pick===right){ SFX.ok(); point(key, pickOne(NICE)); }
  else { SFX.no(); toast(pickOne(TRY)); }
}

/* a quick multiple-choice deck: one item per part */
function deckStep(c){
  const items=c.items;
  const P = d => Math.min(d.p||0, items.length-1);
  return Object.assign({
    parts:()=>items.length,
    render(d){
      const p=P(d), it=items[p], key=c.id+'-'+p, shown=(d.shown||{})[key];
      return `<div class="deckbar"><span class="kick">${c.kicker||''}</span><span class="grow"></span>
        <div class="cdots">${items.map((x,i)=>`<button data-card="${i}" class="${i===p?'cur':''} ${(d.shown||{})[c.id+'-'+i]?'done':''}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div></div>
        <div class="two">
          <div class="${fx('part')||fx('enter')?'pop-in':''}">${c.left(it,p,d)}</div>
          <div><div class="mid" style="margin-bottom:12px">${c.q(it,p)}</div>
            ${optsHTML(key, it.opts.map(o=>esc(o)), d, it.a, c.chips?'chips':'')}
            ${hintBox(d, c.hintTxt?c.hintTxt(it):'Look at the evidence again. Which option fits best?')}
            ${shown?`<div class="explain stamp">${c.explain(it)}</div>`:`<div class="row mt"><button class="btn primary caps" data-act="reveal">Check answer</button><span class="small">Say your answer first.</span></div>`}
          </div></div>`;
    },
    bind(root,d){
      bindPicks(root,d); revealBurst(root);
      $$('[data-card]',root).forEach(b=>b.onclick=()=>{ d.p=+b.dataset.card; d.hint=false; FX.add('part'); save(); draw(false,true); });
      c.bindX && c.bindX(root,d);
    },
    hint(d){ d.hint=!d.hint; },
    reveal(d){ const p=P(d), key=c.id+'-'+p; d.shown=d.shown||{}; d.shown[key]=!d.shown[key];
      if(d.shown[key]) judge(key, (d.pick||{})[key], items[p].a); },
    revealLbl:'Check answer',
    onPart(d){ d.hint=false; },
    nextLbl(d){ return P(d)<items.length-1 ? (c.nextWord||'Next question') : null; },
    live(){ const d=sd(c.id), p=P(d), it=items[p], key=c.id+'-'+p, sh=(d.shown||{})[key];
      return {kind:'choice', id:key, q:strip(c.liveQ?c.liveQ(it):c.q(it,p)), opts:it.opts, lock:!!sh, correct:sh?it.a:null}; }
  }, c);
}

/* ---------- voice messages: real audio files if present (audio/mia.mp3 …), otherwise the browser voice ---------- */
const VOICE = {
  real:{}, cur:null, state:'idle', t0:0, pausedAt:0, pausedTotal:0, frac:0, tick:null,
  probe(){ VOICES.forEach(v=>{ try{ const a=new Audio(); a.preload='metadata';
    a.onloadedmetadata=()=>{ if(isFinite(a.duration)&&a.duration>0){ this.real[v.k]=a; S.dur[v.k]=a.duration; if(cur().id==='voices') draw(false,true); } };
    a.onerror=()=>{}; a.src='audio/'+v.k+'.mp3'; }catch(e){} }); },
  voiceFor(v){
    if(!('speechSynthesis' in window)) return null;
    const vs=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang)); if(!vs.length) return null;
    const fem=vs.filter(x=>/female|samantha|zira|karen|serena|victoria|libby|sonia|aria|jenny|hazel|susan|moira|tessa|emma|ava|allison|natasha|clara/i.test(x.name));
    const mal=vs.filter(x=>/male|daniel|david|george|guy|ryan|thomas|arthur|fred|mark|james|oliver|aaron|eric|tom|christopher|andrew|brian|william|liam/i.test(x.name) && !/female/i.test(x.name));
    if(v.g==='female') return fem[0]||vs.find(x=>/en-GB/i.test(x.lang))||vs[0];
    if(v.g==='male') return mal[0]||vs.find(x=>/en-GB/i.test(x.lang))||vs[0];
    return mal[1]||mal[0]||vs.find(x=>/en-US/i.test(x.lang))||vs[0];
  },
  src(k){ return this.real[k] ? 'rec' : ('speechSynthesis' in window ? 'tts' : 'none'); },
  dur(k){ return S.dur[k]||0; },
  elapsed(){ if(!this.cur) return 0; const a=this.real[this.cur]; if(a) return a.currentTime;
    const now=this.state==='paused'?this.pausedAt:Date.now(); return Math.max(0,(now-this.t0-this.pausedTotal)/1000); },
  paint(){
    VOICES.forEach(v=>{ const card=$('#vm-'+v.k); if(!card) return;
      const on=this.cur===v.k, d=this.dur(v.k), el=on?this.elapsed():0;
      let f = on ? (this.real[v.k] ? el/Math.max(.1,d) : (this.frac || (d? el/d : Math.min(.95, el/Math.max(4, v.text.split(' ').length*.42))))) : (sd('voices').played||{})[v.k] ? 1 : 0;
      f=Math.max(0,Math.min(1,f));
      card.classList.toggle('playing', on && this.state==='playing');
      const pb=$('.pbar i',card); if(pb) pb.style.width=(f*100)+'%';
      $$('.wave i',card).forEach((b,i,a)=>b.classList.toggle('on', i/a.length < f));
      const pl=$('.play',card); if(pl){ pl.textContent = on && this.state==='playing' ? '❚❚' : '▶'; pl.setAttribute('aria-label', (on && this.state==='playing'?'Pause ':'Play ')+CHARS[v.k].name+'’s message'); }
      const tt=$('.tt',card); if(tt) tt.innerHTML=`<span>${mmss(on?el:0)}</span><span>${d?mmss(d):'—:—'}</span>`;
    });
  },
  finish(k){
    const v=VOICES.find(x=>x.k===k);
    if(!this.real[k] && this.t0){ const sec=(Date.now()-this.t0-this.pausedTotal)/1000; if(sec>1.5) S.dur[k]=Math.round(sec*10)/10; }
    const d=sd('voices'); d.played=d.played||{}; d.played[k]=true; save();
    this.cur=null; this.state='idle'; this.frac=0; clearInterval(this.tick); this.paint();
    if(VOICES.every(x=>d.played[x.k])) point('listen','Listening completed!');
    void v;
  },
  stop(){ clearInterval(this.tick); if(this.cur && this.real[this.cur]){ try{ this.real[this.cur].pause(); }catch(e){} }
    if('speechSynthesis' in window) try{ speechSynthesis.cancel(); }catch(e){}
    this.cur=null; this.state='idle'; this.frac=0; this.paint(); },
  toggle(k){
    if(this.cur===k && this.state==='playing'){ // pause
      if(this.real[k]) this.real[k].pause(); else { try{ speechSynthesis.pause(); }catch(e){} this.pausedAt=Date.now(); }
      this.state='paused'; this.paint(); return; }
    if(this.cur===k && this.state==='paused'){ // resume
      if(this.real[k]) this.real[k].play(); else { try{ speechSynthesis.resume(); }catch(e){} this.pausedTotal+=Date.now()-this.pausedAt; }
      this.state='playing'; this.paint(); return; }
    this.play(k);
  },
  play(k){
    this.stop(); const v=VOICES.find(x=>x.k===k); if(!v) return;
    this.cur=k; this.state='playing'; this.t0=Date.now(); this.pausedTotal=0; this.frac=0;
    const a=this.real[k];
    if(a){ a.currentTime=0; a.onended=()=>this.finish(k); a.play().catch(()=>{ toast('Audio could not play — read the transcript.'); this.stop(); }); }
    else if('speechSynthesis' in window){
      const u=new SpeechSynthesisUtterance(v.text); u.lang='en-GB'; u.rate=.93; u.pitch=v.pitch; const vo=this.voiceFor(v); if(vo){ u.voice=vo; u.lang=vo.lang; }
      u.onboundary=e=>{ if(typeof e.charIndex==='number') this.frac=Math.min(.99,(e.charIndex+(e.charLength||0))/v.text.length); };
      u.onend=()=>{ if(this.cur===k) this.finish(k); };
      u.onerror=e=>{ if(this.cur===k && e.error!=='interrupted' && e.error!=='canceled'){ toast('The browser voice is not available — read the transcript.'); this.stop(); } };
      speechSynthesis.speak(u);
    } else { toast('This browser cannot play the voice — read the transcript.'); this.cur=null; this.state='idle'; return; }
    this.tick=setInterval(()=>this.paint(),120); this.paint(); SFX.pop();
  }
};

const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt); };
const cur = ()=> STEPS[S.i] || STEPS[0];
const nparts = s => s.parts ? s.parts() : 1;

function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; s.onPart&&s.onPart(d); FX.add('part'); save(); draw(true,true); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length){ s.leave&&s.leave(d); go(k); } else toast('That’s the end of the lesson 🎉');
}
function back(){
  const s=cur(), d=sd(s.id);
  if((d.p||0)>0){ d.p--; s.onPart&&s.onPart(d); save(); draw(true,true); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--;
  if(k>=0) go(k);
}
function go(k){
  const prev=cur().sc; if(cur().id!==STEPS[k].id) VOICE.stop();
  S.i=k; clockStart(); FX.add('enter');
  const ns=STEPS[k].sc;
  if(ns>prev){ for(let n=1;n<ns;n++){ if(!S.st[n]){ S.st[n]=true; FX.add('st-'+n); } } sceneCard(ns); }
  save(); draw(true); $('#stage').scrollTop=0;
}

}

function addClue(id){
  if(ROLE!=='teacher' || S.ev.includes(id)) return;
  const c=CLUES.find(x=>x.id===id); if(!c) return;

/* breakout timer: keeps running across screens and page refreshes */
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  start(){ if(this.left()<=0) S.timer.left=S.timer.total=180; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  reset(){ S.timer.total=180; S.timer.left=180; S.timer.endAt=0; save(); pubState(); },
  add(sec){ const l=this.left(); if(sec<0 && l<=60) { toast('Less than a minute left'); return; }
    if(this.run()) S.timer.endAt+=sec*1000; else S.timer.left=l+sec;
    S.timer.total=Math.max(60, sec>0 ? Math.max(S.timer.total+sec, Math.ceil(this.left())) : S.timer.total+sec); save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');
    const show = this.run() || (S.timer.left<S.timer.total && S.timer.left>0) || cur().id==='build';
    chip.classList.toggle('hidden', !show || ROLE==='student');
    $('#tchipT').textContent=mmss(l); chip.classList.toggle('warn', this.run());
    const bc=$('#bigClock'), rf=$('#ringFg'), rg=$('#ring'); if(bc){ bc.textContent=mmss(l); bc.classList.toggle('end',l<=0); }
    if(rf) rf.style.strokeDashoffset=(326.73*(1-l/Math.max(1,S.timer.total))).toFixed(1); if(rg) rg.classList.toggle('hurry', this.run() && l<=30 && l>0);
    const ts=$('#tStart'); if(ts) ts.textContent=this.run()?'⏸ Pause':'▶ Start '+mmss(l>0?l:180);
    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.bell(); toast('⏰ Time’s up! Close the breakout rooms.'); pubState(); if(cur().id==='build'){ draw(false,true); burst($('#ring'),['⏰','🔔','✨']); } }
  }
};

/* confetti (no library) */
function confetti(){
  if(REDUCED) return; const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#3DA9FF','#8F7BFF','#2DE0C4','#FFC24D','#3BE39E','#FF8FC7'];
  const P=Array.from({length:150},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:4+Math.random()*6, vx:-2+Math.random()*4, vy:2+Math.random()*4, a:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if(++t<220) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
