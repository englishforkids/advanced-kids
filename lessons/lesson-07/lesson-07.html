.note{padding:.55rem .8rem; border-radius:.8rem; background:rgba(45,212,191,.08); border:1px dashed rgba(45,212,191,.5); font-size:.8rem}

/* breakout */
.steps4{display:grid; grid-template-columns:repeat(4,1fr); gap:.7rem}
.st4{padding:.9rem; border-radius:1.1rem; background:var(--glass); border:1px solid var(--edge)}
.st4 .n{width:2rem; height:2rem; border-radius:.6rem; display:grid; place-items:center; font-family:"Anton",sans-serif; font-size:1.1rem; background:var(--violet); margin-bottom:.4rem}
.st4 b{display:block; font-size:.88rem; letter-spacing:.03em}
.st4 p{font-size:.78rem; margin:.25rem 0 0; color:#DCDAF5}
.flow{display:grid; gap:.5rem}
.fl{display:grid; grid-template-columns:9.5rem 1fr; gap:.7rem; align-items:center; padding:.6rem .8rem; border-radius:1rem; border:1.5px solid var(--edge)}
.fl .lab{font-family:var(--mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700}
.fl .tx{font-size:1rem; font-weight:800}
.fl.sit{background:rgba(255,255,255,.04)}
.fl.neg{background:rgba(255,122,144,.1); border-color:rgba(255,122,144,.5)} .fl.neg .lab{color:var(--critic)}
.fl.bet{background:rgba(45,212,191,.1); border-color:rgba(45,212,191,.5)} .fl.bet .lab{color:var(--coach)}
.fl.act{background:rgba(255,200,87,.1); border-color:rgba(255,200,87,.5)} .fl.act .lab{color:var(--sun)}
.fl textarea{width:100%; min-height:3.1rem; resize:vertical; padding:.45rem .6rem; border-radius:.7rem; border:1.5px dashed var(--edge2); background:rgba(8,8,31,.55); font-weight:700; font-size:.95rem; line-height:1.35}
.fl textarea:focus{border-style:solid; border-color:var(--sun); outline:none}
.team{display:flex; flex-direction:column; gap:.55rem}
.team-h{display:flex; align-items:center; gap:.65rem}
.team-h .tn{font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; color:var(--teal)}
.team-h b{font-size:1.1rem}
.neg-b{padding:.55rem .75rem; border-radius:.9rem; background:rgba(255,122,144,.12); border:1px solid rgba(255,122,144,.5); font-weight:800; font-size:.92rem}
.neg-b::before{content:"Negative thought"; display:block; font-family:var(--mono); font-size:.52rem; letter-spacing:.1em; text-transform:uppercase; color:var(--critic); font-weight:700}
.hintbox{display:grid; gap:.6rem}
.hintbox h4{font-family:var(--mono); font-size:.58rem; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); font-weight:700; margin-bottom:.25rem}
.hintbox ul{margin:0; padding-left:1.1rem; font-size:.82rem; font-weight:700}
.wb{display:flex; flex-wrap:wrap; gap:.3rem}
.wb span{padding:.18rem .55rem; border-radius:99px; background:rgba(255,200,87,.12); border:1px solid rgba(255,200,87,.45); font-size:.72rem; font-weight:800}
.check{display:grid; gap:.5rem}
.cq{display:flex; gap:.6rem; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:.6rem .85rem; border-radius:1rem; background:var(--glass); border:1px solid var(--edge)}
.cq b{font-size:1.02rem}
.cq .a{color:var(--ok); font-weight:800}
.stickers{display:flex; flex-wrap:wrap; gap:.45rem}
.stk{padding:.4rem .85rem; border-radius:99px; border:2px solid var(--edge2); font-weight:800; font-size:.82rem; background:var(--glass)}
.stk[aria-pressed="true"]{background:var(--sun); color:#231700; border-color:var(--sun)}
.tabs{display:flex; gap:.4rem; flex-wrap:wrap}
.tabs button{padding:.35rem .9rem; border-radius:99px; border:1.5px solid var(--edge); background:var(--glass); font-weight:800; font-size:.78rem; display:inline-flex; align-items:center; gap:.4rem}
.tabs button[aria-selected="true"]{background:var(--violet); border-color:var(--lilac)}
.path{display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; counter-reset:p}
.path > div{padding:.9rem; border-radius:1.1rem; background:var(--glass); border:1px solid var(--edge); text-align:center; position:relative}
.path .pi{font-size:1.8rem}
.path b{display:block; font-size:.95rem; margin-top:.2rem}
.wall{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.7rem}
.wall .wi{padding:.45rem .75rem; border-radius:.9rem; background:rgba(45,212,191,.12); border:1px solid rgba(45,212,191,.45); font-weight:700; font-size:.85rem}
.wall .wi small{display:block; font-size:.55rem; color:var(--muted); font-family:var(--mono)}

/* presentation overlay */
#present{position:fixed; inset:0; z-index:80; background:radial-gradient(80vw 60vw at 10% 0%,rgba(139,92,246,.35),transparent 60%),#0A0926; display:none; overflow:auto; padding:1.2rem 1.6rem}
#present.on{display:block}
#present .pv{max-width:1500px; margin:0 auto; display:grid; gap:1rem}
#present .fl{grid-template-columns:1fr; gap:.3rem; padding:1rem 1.3rem}
#present .fl .lab{font-size:.75rem}
#present .fl .tx{font-size:clamp(1.4rem,2.6vw,3rem); line-height:1.2}

/* ─── side panels / modal ─── */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(32rem,94vw); z-index:60; background:#0E0C2E; border-left:1px solid var(--edge2);
  transform:translateX(102%); visibility:hidden; transition:transform .25s ease, visibility .25s; display:flex; flex-direction:column; box-shadow:-30px 0 60px -30px #000; font-size:.78rem}
#teacher.on{transform:none; visibility:visible}
.thd{display:flex; align-items:center; gap:.5rem; padding:.6rem .8rem; border-bottom:1px solid var(--edge)}
.thd b{font-family:var(--mono); letter-spacing:.12em; font-size:.66rem}
#tBody{overflow:auto; padding:.8rem; display:grid; gap:.7rem; align-content:start}
.tn-sec{padding:.6rem .75rem; border-radius:.9rem; background:rgba(255,255,255,.04); border:1px solid var(--edge)}
.tn-sec h4{font-family:var(--mono); font-size:.55rem; letter-spacing:.14em; text-transform:uppercase; color:var(--teal); margin-bottom:.3rem}
.tn-sec ul{margin:0; padding-left:1.05rem} .tn-sec li{margin:.15rem 0}
.tn-sec.say{border-color:rgba(255,200,87,.45)}
.tn-sec.say p{font-weight:700}
.tn-sec.uk{border-color:rgba(139,92,246,.5)}
#modal{position:fixed; inset:0; z-index:90; background:rgba(4,4,18,.72); backdrop-filter:blur(6px); display:flex; align-items:flex-start; justify-content:center; padding:5vh 1rem; overflow:auto}
#mbox{width:min(52rem,100%); background:#121039; border:1px solid var(--edge2); border-radius:var(--r-l); padding:1.1rem 1.2rem; box-shadow:var(--shadow); animation:fadeUp .2s ease}
#mbox h2{font-size:1.5rem}
.mlist{display:grid; gap:.4rem; margin-top:.6rem}
.mlist .sc{padding:.55rem .75rem; border-radius:.9rem; background:var(--glass); border:1px solid var(--edge)}
.mlist .sc.cur{border-color:var(--sun)}
.mlist .sc > b{display:flex; gap:.5rem; align-items:center; font-size:.85rem}
.mlist .sts{display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.35rem}
.mlist .sts button{font-size:.62rem; padding:.2rem .55rem; border-radius:.5rem; background:rgba(255,255,255,.06); border:1px solid var(--edge); font-weight:700}
.mlist .sts button.cur{background:var(--violet); border-color:var(--lilac)}
.mlist .sts button.o{color:var(--sun)}
.vgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:.5rem; margin-top:.7rem}
.vg{padding:.55rem .75rem; border-radius:.9rem; background:var(--glass); border:1px solid var(--edge); font-size:.78rem}
.vg b{font-size:.9rem; color:var(--sun)}
.vg i{display:block; font-style:normal; color:#FFF2D2; margin-top:.15rem}
#toast{position:fixed; left:50%; bottom:4.4rem; transform:translateX(-50%); z-index:95; padding:.5rem .9rem; border-radius:.8rem; background:#232060; border:1px solid var(--edge2); font-weight:700; font-size:.75rem; display:none; max-width:92vw; text-align:center}
#toast.on{display:block; animation:fadeUp .2s ease}
.tpop{display:grid; gap:.7rem}
.tbig{font-family:"Anton",sans-serif; font-size:3.6rem; letter-spacing:.03em; text-align:center; line-height:1}
.tbig.end{color:var(--sun)}

/* live dock */
#dock{position:fixed; right:.8rem; bottom:3.8rem; z-index:50; width:min(19rem,92vw); max-height:52vh; display:none; flex-direction:column; border-radius:1rem; overflow:hidden; background:#120F3A; border:1px solid var(--edge2); box-shadow:var(--shadow); font-size:.68rem}
#dock.on{display:flex}
#dock .dh{display:flex; align-items:center; gap:.45rem; padding:.45rem .6rem; border-bottom:1px solid var(--edge)}
#dock .db{overflow:auto; padding:.6rem; display:grid; gap:.4rem}
#dock.min .db{display:none}
.led{width:.55rem; height:.55rem; border-radius:50%; background:var(--faint); flex:0 0 auto}
.led.on{background:var(--ok); box-shadow:0 0 8px var(--ok)} .led.warn{background:var(--sun)} .led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:.25rem}
.names span{padding:.08rem .4rem; border-radius:99px; background:rgba(255,255,255,.08); font-size:.6rem}
.wq{display:flex; gap:.35rem; align-items:center; padding:.35rem .45rem; border-radius:.6rem; background:rgba(255,255,255,.05)}
.wq p{margin:0; flex:1; font-size:.68rem}
.wq small{display:block; color:var(--muted); font-size:.55rem}

/* ─── student phone app & solo team card ─── */
#stu,#solo{display:none; position:relative; z-index:1; height:100%; overflow:auto}
body.student #app, body.solo #app, body.notes #app{display:none}
body.student #wm, body.solo #wm, body.notes #wm{display:none}
body.student #stu, body.solo #solo{display:block}
body.student, body.solo{overflow:auto}
.stu-top{position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:.5rem; padding:.55rem .8rem; background:rgba(8,8,31,.94); border-bottom:1px solid var(--edge); font-size:.75rem}
.stu-body{max-width:34rem; margin:0 auto; padding:1rem}
.stu-wait{text-align:center; padding:2.5rem 1rem}
.stu-wait .bigi{font-size:3rem}
.stu-body label{display:block; font-weight:800; font-size:.8rem; margin:.8rem 0 .3rem}
.stu-body input, .stu-body textarea{width:100%; padding:.6rem .8rem; border-radius:.8rem; border:1.5px solid var(--edge2); background:rgba(8,8,31,.6); font-size:1rem}
.stu-body textarea{min-height:5rem; resize:vertical}
.solo-wrap{max-width:1180px; margin:0 auto; padding:1rem 1.1rem 3rem}

/* motion */
@keyframes fadeUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.scene-in{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
.pop-in{animation:fadeUp .3s ease both}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important; scroll-behavior:auto!important}
}


/* ═════ v2 · illustrations & motion ═════ */
#amb{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#amb span{position:absolute; bottom:-3rem; opacity:0; animation:ambUp var(--t) linear var(--d) infinite; font-size:var(--s); filter:saturate(.9)}
@keyframes ambUp{0%{transform:translateY(0) rotate(0); opacity:0}10%{opacity:var(--o)}88%{opacity:var(--o)}100%{transform:translateY(-112vh) rotate(var(--r)); opacity:0}}

/* who has the mic — story meter */
.micm{flex:1; max-width:21rem; min-width:12rem; margin-left:auto}
.micm-l{display:flex; justify-content:space-between; gap:.4rem; font-family:var(--mono); font-size:.48rem; letter-spacing:.12em; color:var(--muted); margin-bottom:.25rem; white-space:nowrap}
.micm-l b{color:var(--text); font-size:.52rem}
.micbar{position:relative; height:.55rem; border-radius:99px; background:linear-gradient(90deg,rgba(255,122,144,.35),rgba(255,200,87,.3),rgba(45,212,191,.35)); border:1px solid var(--edge)}
.micbar i{position:absolute; inset:0 auto 0 0; border-radius:99px; background:linear-gradient(90deg,var(--critic),var(--sun) 55%,var(--coach)); background-size:21rem 100%; transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.micbar span{position:absolute; top:50%; transform:translate(-50%,-50%); font-size:.95rem; transition:left 1.1s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 2px 6px #000)}
.micm + .tools{margin-left:.6rem}

/* scene intro card */
#scard{position:fixed; inset:0; z-index:58; display:grid; place-items:center; pointer-events:none; opacity:0; visibility:hidden}
#scard::before{content:""; position:absolute; inset:0; background:rgba(5,5,22,.72); backdrop-filter:blur(6px)}
#scard .in{position:relative; text-align:center; padding:0 1rem}
#scard img{width:min(34rem,82vw); border-radius:1.5rem; box-shadow:0 30px 80px -20px #000, 0 0 0 2px rgba(255,255,255,.22); display:block; margin:0 auto}
#scard .k{font-family:var(--mono); letter-spacing:.2em; color:var(--teal); margin-top:.8rem; font-size:.7rem}
#scard h2{font-family:"Anton",Impact,sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(2rem,4.6vw,3.6rem); margin-top:.15rem; text-shadow:0 6px 30px #000}
#scard.on{visibility:visible; animation:scardIn 1.5s cubic-bezier(.2,.8,.2,1) forwards}
#scard.on .in{animation:scardScale 1.5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes scardIn{0%{opacity:0}12%{opacity:1}74%{opacity:1}100%{opacity:0; visibility:hidden}}
@keyframes scardScale{0%{transform:scale(.88) translateY(20px)}24%{transform:none}100%{transform:scale(1.04)}}

/* scene thumbnail in the header */
.sico{position:relative; overflow:hidden}
.sico img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}

/* hero pictures */
.hero{margin:0; border-radius:1.4rem; overflow:hidden; border:1px solid var(--edge2); box-shadow:var(--shadow); position:relative; background:#0B0A28; aspect-ratio:1200/640}
.hero img{display:block; width:100%; height:100%; object-fit:cover}
.hero.strip{aspect-ratio:auto; height:clamp(7rem,19vh,11.5rem)}
.hero figcaption{position:absolute; left:.7rem; bottom:.6rem; padding:.2rem .6rem; border-radius:99px; background:rgba(8,8,31,.78); border:1px solid var(--edge2); font-size:.6rem; font-weight:800}
.kb{animation:kb 16s ease-out both}
@keyframes kb{from{transform:scale(1.12) translate(-1.5%,1%)} to{transform:none}}
.cast{display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; margin-top:.7rem}
.side2{display:grid; grid-template-columns:minmax(0,1fr) minmax(14rem,21rem); gap:1.1rem; align-items:start}
.side2 > aside{position:sticky; top:0; display:grid; gap:.8rem}

/* entrance helpers: .ent0 = only when the screen opens, .ent = also when Continue opens a new card */
.ent0.rise, .ent.rise{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0s)}
.ent.flipin{animation:flipIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes flipIn{from{opacity:0; transform:perspective(900px) rotateY(-14deg) translateX(30px)} to{opacity:1; transform:none}}
.ent.slidein{animation:slideIn .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{opacity:0; transform:translateX(44px)} to{opacity:1; transform:none}}
#scene.calm .ent, #scene:not(.fresh) .ent0{animation:none!important}

/* typing → message */
.tseq{animation:typeLife .8s var(--d) both; overflow:hidden; align-self:flex-start}
@keyframes typeLife{0%{opacity:0; max-height:0}12%{opacity:1; max-height:3rem}82%{opacity:1; max-height:3rem}100%{opacity:0; max-height:0; padding-top:0; padding-bottom:0; margin:0}}
.mseq{animation:msgIn .42s var(--d) cubic-bezier(.2,.9,.3,1.2) both}
@keyframes msgIn{from{opacity:0; transform:translateY(10px) scale(.96)} to{opacity:1; transform:none}}
#scene:not(.fresh) .tseq{display:none}

/* Mia’s comic comes alive */
.bsad{animation:sway 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
.bdance{animation:dance 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
.bpeek{animation:peek 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
.ant{animation:ant 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:0% 100%}
.cnote{animation:noteUp 2.6s ease-in-out infinite; transform-box:fill-box}
.cnote.n2{animation-delay:-1.3s}
@keyframes sway{50%{transform:rotate(-4deg)}}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-6px) rotate(-5deg)}75%{transform:translateY(-6px) rotate(5deg)}}
@keyframes peek{0%,60%,100%{transform:none}75%{transform:translateY(-5px)}}
@keyframes ant{50%{transform:rotate(-9deg)}}
@keyframes noteUp{0%{transform:translateY(4px); opacity:.3}50%{opacity:1}100%{transform:translateY(-12px); opacity:.2}}
.attach{position:relative}
.comicimg{display:block; width:100%; height:auto}
.comicimg.reveal{animation:comicReveal 1.5s var(--cd,0s) cubic-bezier(.3,.7,.2,1) both}
@keyframes comicReveal{0%{clip-path:inset(0 100% 0 0); filter:brightness(1.15)}100%{clip-path:inset(0 0 0 0); filter:none}}
.stamp{position:absolute; right:6%; bottom:10%; padding:.1rem .6rem; border:4px solid var(--ok); border-radius:.6rem; color:var(--ok); background:rgba(255,255,255,.88); font-family:"Anton",sans-serif; font-size:1.3rem; letter-spacing:.04em; transform:rotate(-9deg)}
.stamp.ent0{animation:stampIn .5s 1s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stampIn{0%{opacity:0; transform:scale(1.8) rotate(-14deg)}100%{opacity:1; transform:rotate(-9deg)}}

/* word cards with pictures */
.wcard.pic{grid-template-columns:minmax(12rem,44%) 1fr; gap:1.4rem; align-items:center}
.wart{margin:0; position:relative; border-radius:1.2rem; overflow:hidden; border:1px solid var(--edge2); aspect-ratio:3/2; background:#0B0A28; box-shadow:0 20px 40px -24px #000}
.wart img{width:100%; height:100%; object-fit:cover; display:block}
.wart .wbadge{position:absolute; left:.5rem; top:.5rem; width:2.6rem; height:2.6rem; border-radius:.8rem; display:grid; place-items:center; font-size:1.4rem; background:rgba(8,8,31,.75); border:1px solid var(--edge2)}
.wword.ent{animation:wordIn .6s .15s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes wordIn{from{opacity:0; letter-spacing:.2em; filter:blur(4px)} to{opacity:1; filter:none}}
.wdef.ent, .wex.ent{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
.wdef.ent{animation-delay:.3s} .wex.ent{animation-delay:.45s}
.wart img.ent{animation:kb 9s ease-out both}

/* answer feedback */
.just{animation:pressPop .28s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pressPop{50%{transform:scale(1.07)}}
.item:has(> .res.fx-ok), .card:has(> .res.fx-ok){animation:rightPulse .8s ease-out}
.item:has(> .res.fx-no), .card:has(> .res.fx-no){animation:shake .45s ease-in-out}
.res.fx-ok .ok, .res.fx-no .no{display:inline-block; animation:okPop .45s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes rightPulse{30%{box-shadow:0 0 0 4px rgba(61,220,151,.35), 0 0 30px rgba(61,220,151,.25)}100%{box-shadow:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes okPop{from{transform:scale(.4); opacity:0} to{transform:none; opacity:1}}
.spark{position:fixed; z-index:57; width:.45rem; height:.45rem; border-radius:50%; pointer-events:none; animation:sparkFly .7s ease-out forwards}
@keyframes sparkFly{from{transform:translate(-50%,-50%) scale(1); opacity:1} to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3); opacity:0}}
.confetti{position:fixed; inset:0; z-index:57; pointer-events:none; overflow:hidden}
.confetti i{position:absolute; top:-5vh; width:.5rem; height:.9rem; border-radius:2px; animation:fall var(--t) var(--d) cubic-bezier(.3,.6,.5,1) forwards; opacity:.95}
@keyframes fall{to{transform:translate(var(--x),112vh) rotate(var(--r)); opacity:.8}}

/* reading with pictures */
.rp{display:grid; grid-template-columns:minmax(11rem,36%) 1fr; gap:1.1rem; align-items:start}
.rp .hero{aspect-ratio:1200/640}
.rp.old .hero{opacity:.85}
.newp .gl{animation:glWord 1.4s .7s ease-out both}
@keyframes glWord{0%{background:rgba(255,200,87,0)}40%{background:rgba(255,200,87,.35)}100%{background:rgba(255,200,87,0)}}

/* voices */
.three .voice{animation:floaty 5.5s ease-in-out infinite}
.three .voice:nth-child(2){animation-delay:-1.8s} .three .voice:nth-child(3){animation-delay:-3.6s}
@keyframes floaty{50%{transform:translateY(-6px)}}
.voice[aria-pressed="true"]::after{content:""; position:absolute; inset:-4px; border-radius:1.4rem; border:2px solid var(--sun); animation:ring 2.2s ease-out infinite; pointer-events:none}
@keyframes ring{0%{opacity:.8; transform:scale(1)}100%{opacity:0; transform:scale(1.05)}}
.voice[aria-pressed="true"] .vav{animation:micBob 1s ease-in-out infinite}
@keyframes micBob{50%{transform:scale(1.08)}}

/* teams */
.tsit{margin:-1.1rem -1.2rem .2rem; border-radius:var(--r-l) var(--r-l) 0 0; overflow:hidden; aspect-ratio:720/400; background:#0B0A28}
.tsit img{width:100%; height:100%; object-fit:cover; display:block}
.team .tsit + .team-h{margin-top:-1.9rem; position:relative}
.team .tsit + .team-h .av{border-width:3px; box-shadow:0 8px 20px -6px #000}
.team.ent0{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0s)}
.tring{display:inline-flex; align-items:center; gap:.45rem}
.tring svg{width:2.2rem; height:2.2rem; transform:rotate(-90deg)}
.tring .trbg{fill:none; stroke:rgba(255,255,255,.12); stroke-width:5}

/* quiz helpers: S.sel[qid] = {itemIndex: value}; R.checked / R.shown — тільки на поточну сесію */
const qsel = id=>(S.sel[id] && typeof S.sel[id]==='object') ? S.sel[id] : (S.sel[id]={});
function resLine(id,it,val,keyText){
  const c=R.checked[id], sh=R.shown[id]; let h='';
  const has = val!==undefined && val!==null && val!=='';
  if(c){ if(!has) h+=`<span class="na">• No answer yet.</span>`; else if(val===it.ans) h+=`<span class="ok">✓ Correct.</span><span>${esc(it.why)}</span>`; else h+=`<span class="no">✗ Not quite.</span><span class="muted">Try again.</span>`; }
  if(sh && !(c && val===it.ans)) h+=`<span class="key">🔑 Answer: ${esc(keyText)}.</span><span>${esc(it.why)}</span>`;
  const fx = (R.fxNow===id && c && has) ? (val===it.ans?' fx-ok':' fx-no') : '';
  return h?`<div class="res${fx}">${h}</div>`:'';
}
const qctl = id=>`<div class="ctl"><button class="btn sm teal" data-a="check" data-q="${id}">✓ Check</button><button class="btn sm" data-a="retry" data-q="${id}">↺ Try again</button><button class="btn sm ${R.shown[id]?'on':''}" data-a="showans" data-q="${id}" aria-pressed="${!!R.shown[id]}">🔑 Show answers</button></div>`;

/* choice row for polls (teacher highlights; Live votes behind “Show class results”) */
function pickRow(id,opts,emo){
  return `<div class="three mt">${opts.map((o,i)=>`<button class="opt" data-a="pick" data-q="${id}" data-i="${i}" aria-pressed="${S.sel[id]===i}" style="justify-content:center;font-size:1.05rem;padding:.85rem"><span style="font-size:1.6rem" aria-hidden="true">${emo[i]}</span>${esc(o)}</button>`).join('')}</div>${liveBars(id,opts)}`;
}
function counts(id,n){ const c=Array(n).fill(0); Object.values(S.lv[id]||{}).forEach(v=>{ if(v>=0&&v<n) c[v]++; }); return c; }
function liveBars(id,opts){
  if(!R.live) return '';
  const c=counts(id,opts.length), tot=c.reduce((a,b)=>a+b,0);
  return `<div class="ctl"><button class="btn sm ${R.res[id]?'on':''}" data-a="res" data-q="${id}" aria-pressed="${!!R.res[id]}">📊 ${R.res[id]?'Hide':'Show'} class results</button><span class="small">${tot} vote${tot===1?'':'s'} from phones</span></div>`+
    (R.res[id]?`<div class="bars">${opts.map((o,i)=>`<div class="bar"><span>${esc(o)}</span><i style="width:${tot?Math.round(c[i]/tot*100):0}%"></i><b class="mono">${c[i]}</b></div>`).join('')}</div>`:'');
}
function wallHtml(id){ const w=S.wall[id]||[]; if(!w.length) return '';
  return `<div class="wall" aria-label="Answers from the class">${w.map((x,j)=>`<div class="wi">${esc(x.text)}<small>${esc(x.by)}${MODE==='teacher'?` · <button class="small" data-a="wdel" data-q="${id}" data-i="${j}" aria-label="Remove answer">✕</button>`:''}</small></div>`).join('')}</div>`; }

function speakCard(o){
  return `<div class="card ${o.opt?'sun':''}">
    <div class="row" style="align-items:flex-start;flex-wrap:nowrap">${o.icon?`<span style="font-size:2.4rem;line-height:1" aria-hidden="true">${o.icon}</span>`:''}<div class="grow">
    ${o.opt?optTag:''}<p class="q ${o.small?'':'xl'}" style="margin:.2rem 0 .3rem">${esc(o.q)} ${uaBtn(o.id)}</p>${uaBox(o.id,o.ua)}</div></div>
    ${o.body||''}
    ${(o.hint||o.samples)?`<div class="ctl">${o.hint?revBtn(o.id+'-h','💡 Hint'):''}${o.samples?revBtn(o.id+'-s','💬 Sample answers'):''}</div>`:''}
    ${o.hint?revBox(o.id+'-h',startersHtml(o.hint)):''}${o.samples?revBox(o.id+'-s',samplesHtml(o.samples)):''}
    ${o.note?`<p class="small mt">${o.note}</p>`:''}${wallHtml(o.id)}</div>`;
}
function glossify(t){ let out='', last=0;
  t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,d,k,off)=>{ out+=esc(t.slice(last,off))+`<button class="gl" data-a="gl" data-g="${esc(k||d)}">${esc(d)}</button>`; last=off+m.length; return m; });
  return out+esc(t.slice(last)); }
function deck(list,pre,cls,stepId){
  const i=Math.min(S.sub,list.length-1), w=list[i]; R.seen[stepId]=Math.max(R.seen[stepId]||0,i);
  return `<div class="${cls}"><div class="deckbar" role="group" aria-label="Words">${list.map((x,j)=>`<button data-a="sub" data-i="${j}" class="${j===i?'cur':j<=R.seen[stepId]?'seen':''}" aria-current="${j===i}">${j+1}. ${esc(x.w)}</button>`).join('')}</div>
   <div class="card ${cls==='deck-b'?'teal':'violet'} ent flipin" style="padding:1.3rem 1.4rem"><div class="wcard pic"><figure class="wart"><img class="ent" src="${wordImg(w)}" alt="${esc(w.w)}: picture" onerror="this.remove()"><span class="wbadge" aria-hidden="true">${w.i}</span></figure><div>
     <div class="row"><span class="kick">New phrase ${i+1} / ${list.length}</span>${w.inf?'<span class="infm">· informal</span>':''}<span class="grow"></span>${uaBtn(pre+i)}</div>
     <h2 class="dsp wword ent">${esc(w.w)}</h2><p class="wdef ent">${esc(w.def)}</p>${uaBox(pre+i,w.ua)}
     <div class="wex ent">${bold(w.ex)}${uaBox(pre+i,w.exua)}</div></div></div></div>
   ${i<list.length-1?`<p class="small mt">Continue → opens the next phrase.</p>`:''}</div>`;
}

/* ---------- 7 · navigation & UI ---------- */
const visible = i=>!(STEPS[i].opt && S.route==='quick');
const cur = ()=>STEPS[S.i];
function sceneSteps(n){ return STEPS.map((s,i)=>({s,i})).filter(x=>x.s.sc===n && visible(x.i)); }
function go(i,sub=0){ hidePop(); S.i=i; S.sub=sub; save(); draw(true); $('#stage').focus({preventScroll:true}); }
function next(){ const st=cur(); if(st.subs && S.sub<st.subs-1){ S.sub++; save(); draw(false,false,true); return; }
  for(let j=S.i+1;j<STEPS.length;j++) if(visible(j)) return go(j,0); toast('This is the last screen of the lesson.'); }
function back(){ if(S.sub>0){ S.sub--; save(); draw(false,true); return; }
  for(let j=S.i-1;j>=0;j--) if(visible(j)) return go(j,(STEPS[j].subs||1)-1); }
function skipOpt(){ for(let j=S.i+1;j<STEPS.length;j++) if(!STEPS[j].opt) return go(j,0); }
function shead(st,sc){ return `<div class="shead"><div class="sico" aria-hidden="true">${sc.e}<img src="${SCENE_IMG[sc.n]}" alt="" onerror="this.remove()"></div><div class="grow"><div class="kick">Scene ${sc.n} of 8 · ${esc(sc.t)}</div><h1>${esc(st.t)}</h1>
  <div class="meta"><span class="tag">⏱ ${sc.min} min</span>${st.opt?optTag:''}${st.subs?`<span class="tag vio">${S.sub+1} / ${st.subs}</span>`:''}</div></div></div>`; }
function draw(anim=true,keep=false,subAdv=false){
  if(MODE!=='teacher') return;
  if(!visible(S.i)){ for(let j=S.i;j<STEPS.length;j++) if(visible(j)){ S.i=j; break; } }
  const st=cur(), sc=SCENES[st.sc-1], top=$('#stage').scrollTop;
  if(st.subs) S.sub=Math.min(Math.max(0,S.sub),st.subs-1); else S.sub=0;
  hidePop();
  const adv = subAdv || R.forceAdv; R.forceAdv=false;
  $('#scene').className = 'wrap ' + (anim ? 'fresh' : adv ? 'adv' : 'calm');
  $('#scene').innerHTML = shead(st,sc)+`<div class="${anim?'scene-in':''}">${st.render()}</div>`;
  R.fxNow=null;
  if(R.fxSpark){ const q=R.fxSpark; R.fxSpark=null; $$('.res.fx-ok .ok').forEach(el=>sparks(el)); }
  if(anim){ if(R.lastSc!==undefined && R.lastSc!==sc.n) splash(sc); if(st.id==='final') setTimeout(()=>{ if(cur().id==='final') confetti(); },1900); }
  R.lastSc=sc.n; paintAmb(sc.n); paintMic(sc.n);
  if(keep) $('#stage').scrollTop=top; else if(!subAdv) $('#stage').scrollTop=0;
  if(subAdv){ const el=$('[data-newest]'); if(el) el.scrollIntoView({block:'nearest', behavior:REDUCED?'auto':'smooth'}); }
  st.after && st.after();
  paintNav(); paintTeacher(); paintTimer(); pubState(); paintDock();
}
function paintNav(){
  const st=cur(), sc=SCENES[st.sc-1], list=sceneSteps(sc.n), k=list.findIndex(x=>x.i===S.i)+1;
  $('#navInfo').innerHTML=`Scene ${sc.n} of 8 · <b>${esc(sc.t)}</b>${list.length>1?` · ${k}/${list.length}`:''}${st.opt?' · <span class="o">optional</span>':''}`;
  $('#dots').innerHTML=SCENES.map(s=>`<button data-a="scene" data-n="${s.n}" class="${s.n<sc.n?'done':s.n===sc.n?'cur':''}" title="Scene ${s.n} · ${esc(s.t)}" aria-label="Scene ${s.n}: ${esc(s.t)}" ${s.n===sc.n?'aria-current="step"':''}></button>`).join('');
  let first=0; for(let j=0;j<STEPS.length;j++) if(visible(j)){ first=j; break; }
  $('#btnBack').disabled = S.i===first && S.sub===0;
  $('#btnSkip').classList.toggle('hidden',!st.opt);
  let last=true; for(let j=S.i+1;j<STEPS.length;j++) if(visible(j)){ last=false; break; }
  $('#nextLbl').textContent = (last && !(st.subs && S.sub<st.subs-1)) ? 'The end' : 'Continue';
  $('#routeLbl').textContent = S.route==='quick'?'Quick':'Full';
  $('#btnRoute').classList.toggle('on',S.route==='quick');
}
function setRoute(r){ S.route=r; save(); draw(false,true); toast(r==='quick'?'Quick route: optional tasks are hidden.':'Full route: all tasks are shown.'); }
function setUA(on){ R.uaAll=on; document.body.classList.toggle('uaall',on); const b=$('#btnUA'); if(b){ b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); } }

/* ---------- motion helpers ---------- */
function splash(sc){
  if(REDUCED || MODE!=='teacher') return; const el=$('#scard'); if(!el) return;
  $('#scImg').src=SCENE_IMG[sc.n]; $('#scK').textContent='SCENE '+sc.n+' OF 8'; $('#scT').textContent=sc.e+' '+sc.t;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
}
const AMB = [[1,3,['💭','❓','💬','⚡','…','😬']],[4,5,['🌿','🍃','🖼️','🎵','💬','🧊']],[6,8,['✨','⭐','💜','🎤','🎉','💛']]];
let ambGroup=-1;
function paintAmb(n){
  if(REDUCED) return; const g=AMB.findIndex(a=>n>=a[0]&&n<=a[1]); if(g===ambGroup) return; ambGroup=g;
  const set=AMB[g][2], box=$('#amb'); if(!box) return; let h='';
  for(let k=0;k<14;k++){ const t=22+Math.random()*16; h+=`<span style="left:${(k/14*100+Math.random()*5).toFixed(1)}%;--t:${t.toFixed(1)}s;--d:${(-Math.random()*t).toFixed(1)}s;--s:${(1.1+Math.random()*1.3).toFixed(2)}rem;--o:${(.06+Math.random()*.07).toFixed(2)};--r:${Math.round(Math.random()*80-40)}deg">${set[k%set.length]}</span>`; }

function tStart(sec,label){ S.timer={total:sec, end:Date.now()+sec*1000, left:sec, run:true, label:label||''}; save(); paintTimer(); pubState(); }

/* ---------- 9 · live room (Supabase Realtime broadcast + presence) ----------
   Той самий механізм, що в уроках 5, 13–16: таблиці не потрібні.
   Учитель — єдине джерело стану: сцену, завдання й таймер надсилає тільки він.
   Учні можуть надіслати лише hello / ans / work / react. Якщо Supabase недоступний,
   кімната НЕ відкривається (жодної імітації). */
const configured = ()=>/^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=>Math.random().toString(36).slice(2,10);
const NAMES = {};
const Net = {
  status:'off', ch:null, sb:null, me:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l07sid'); }catch(e){}
    this.me={id:sid||uid(), name:o.name||'', role:o.role};
    if(o.role==='student') try{ sessionStorage.setItem('l07sid',this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    if(!configured()){ this.setStatus('off'); return false; }
    this.setStatus('connecting');
    try{
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      this.sb=createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
      this.ch=this.sb.channel('lesson07-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
      this.ch.on('broadcast',{event:'msg'},({payload})=>{ try{ this.onEvent(payload); }catch(e){ console.warn(e); } });
      this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v&&v[0]&&list.push(v[0])); this.onPeers(list); });
      let first=true;
      await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),10000);
        this.ch.subscribe(async st=>{
          if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
          else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
        }); });
      return true;
    }catch(e){ console.warn('Live room unavailable:', e&&e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; this.setStatus('off'); return false; }
  },
  send(p){ if(!this.ch) return; const msg=Object.assign({},p,{from:this.me}); try{ this.ch.send({type:'broadcast', event:'msg', payload:msg}); }catch(e){} },
  stop(){ if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } this.ch=null; this.sb=null; this.status='off'; }
};
const Store = { async log(kind,task,sid,value){ if(!(CFG.SAVE_ANSWERS && Net.sb)) return;
  try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson07-voices', chapter:cur().id, task, kind, student_id:sid, student_name:NAMES[sid]||null, value:String(value).slice(0,500)}); }
  catch(e){ console.warn('Supabase insert failed:', e.message||e); } } };

const baseURL = ()=>location.href.split('?')[0].split('#')[0];
const joinURL = ()=>baseURL()+'?room='+S.room+'&role=student';
function curTask(){ const c=cur(); try{ return c.live ? c.live() : null; }catch(e){ return null; } }
let pubT=null;
function pubState(){
  if(!R.live || MODE!=='teacher') return;
  clearTimeout(pubT); pubT=setTimeout(()=>{ const c=cur(), sc=SCENES[c.sc-1], task=curTask();
    if(task && task.kind==='choice') task.shown=!!R.res[task.id];
    Net.send({t:'state', sc:sc.n, title:sc.t, e:sc.e, img:SCENE_IMG[sc.n], task, timer:{left:Math.ceil(tLeft()), run:!!(S.timer&&S.timer.run), on:!!S.timer}}); },120);
}

function softRedraw(){ clearTimeout(redrawT); redrawT=setTimeout(()=>{ const a=document.activeElement; if(a && a.closest && a.closest('#scene textarea, #scene select')) { paintDock(); return; } draw(false,true); },300); }
function onTeacherMsg(m){
  const f=m&&m.from; if(!f || f.role!=='student' || !f.id) return;
  const id=f.id; if(f.name) NAMES[id]=String(f.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ if(task && task.kind==='react' && BR.stickers.includes(m.v)) floatReact(m.v, NAMES[id]); return; }
  if(m.t==='ans' && task && m.task===task.id){
    if(task.kind==='choice'){ const v=+m.v; if(!(Number.isInteger(v) && v>=0 && v<task.opts.length)) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('vote',task.id,id,v); if(R.res[task.id]) softRedraw(); else paintDock(); return; }
    if(task.kind==='text'){ const text=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,160); if(!text) return;
      const k=R.wallq.findIndex(w=>w.task===task.id && w.sid===id), item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student'};
      if(k>=0) R.wallq[k]=item; else R.wallq.unshift(item); Store.log('text',task.id,id,text); paintDock(); return; }
  }
  if(m.t==='work' && task && task.kind==='team'){
    const tm=String(m.team||''), fl=String(m.f||''); if(!TEAMS.some(t=>t.id===tm) || !['better','action'].includes(fl)) return;
    setTeam(tm,fl,String(m.v||'').slice(0,240)); Store.log('work','team-'+tm+'-'+fl,id,m.v); pubState(); softRedraw();
    if($('#present').dataset.id===tm) openPresent(tm);
  }
}
function floatReact(label,by){

  d.textContent=(label==='Helpful reframe'?'🖼️ ':label==='Useful action'?'👣 ':'🤝 ')+label+(by?' · '+by:'');

function paintDock(){

  else if(task.kind==='team'){ h+=TEAMS.map(t=>{ const w=getTeam(t.id), n=['better','action'].filter(k=>w[k]).length; return `<div class="small">Team ${esc(t.name)}: ${n?`<b style="color:var(--ok)">${n}/2 written</b>`:'…'}</div>`; }).join(''); }

/* ---------- actions (event delegation) ---------- */
const ACT = {
  ua(b){ const keys=(b.dataset.group||b.dataset.k).split(','), on=!R.ua[keys[0]];
    keys.forEach(k=>{ R.ua[k]=on; $$(`[data-uk="${k}"]`).forEach(e=>e.classList.toggle('open',on)); }); b.setAttribute('aria-pressed',on); },
  rev(b){ const k=b.dataset.k; R.rev[k]=!R.rev[k];
    if(k.startsWith('ck')){ draw(false,true); return; }
    $$(`[data-rk="${k}"]`).forEach(e=>e.classList.toggle('open',R.rev[k])); b.classList.toggle('on',R.rev[k]); b.setAttribute('aria-expanded',R.rev[k]); },
  pick(b){ const q=b.dataset.q, i=+b.dataset.i; S.sel[q] = S.sel[q]===i ? undefined : i; save(); draw(false,true); pressFx(`[data-a="pick"][data-q="${q}"][data-i="${i}"]`); },
  opt(b){ const q=b.dataset.q, i=b.dataset.i, raw=b.dataset.v, v=(q==='move')?+raw:raw, s=qsel(q); s[i] = s[i]===v ? undefined : v; save(); draw(false,true); pressFx(`[data-a="opt"][data-q="${q}"][data-i="${i}"][data-v="${CSS.escape(raw)}"]`); },
  bank(b){ const s=qsel('rev'); let i=R.lastGap; if(i===null || i===undefined) i=REV.items.findIndex((_,j)=>!s[j]);
    if(i<0){ toast('All gaps are filled. Click a gap first, then a word, to change it.'); return; } s[i]=b.dataset.v; R.lastGap=null; save(); draw(false,true); },
  check(b){ R.checked[b.dataset.q]=true; R.fxNow=b.dataset.q; R.fxSpark=true; draw(false,true); },
  retry(b){ const q=b.dataset.q; S.sel[q]={}; R.checked[q]=false; R.shown[q]=false; save(); draw(false,true); },
  showans(b){ const q=b.dataset.q; R.shown[q]=!R.shown[q]; draw(false,true); },
  sub(b){ S.sub=+b.dataset.i; save(); R.forceAdv=true; draw(false,true); },
  gl(b,e){ e.stopPropagation(); const p=$('#pop'); if(p.classList.contains('on') && p.dataset.g===b.dataset.g){ hidePop(); return; } p.dataset.g=b.dataset.g; showPop(b); },
  next(){ next(); }, scene(b){ const l=sceneSteps(+b.dataset.n); if(l.length){ closeModal(); go(l[0].i,0); } },
  goto(b){ closeModal(); go(+b.dataset.i,0); }, close(){ closeModal(); },
  route(){ closeModal(); setRoute(S.route==='quick'?'full':'quick'); }, setroute(b){ setRoute(b.dataset.id); },
  vocab(){ showVocab(); }, reset(){ askReset(); }, doreset(){ doReset(); }, timer(){ showTimer(); },
  tstart(b){ tStart(+b.dataset.s, b.dataset.l); toast('Timer started: '+mmss(+b.dataset.s)); }, tpause(){ tPause(); }, treset(){ tReset(); },
  copy(b){ const t=TEAMS.find(x=>x.id===b.dataset.id); if(!t) return;
    if(b.dataset.t==='link') copy(teamURL(t.id),'Link copied — paste it into the breakout room chat');
    else copy(teamText(t, S.timer&&S.timer.total===240?4:6),'Team task copied — paste it into the breakout room chat'); },
  present(b){ openPresent(b.dataset.id); }, pclose(){ closePresent(); },
  ptab(b){ S.pteam=b.dataset.id; save(); draw(false,true); },
  stk(b){ const id=b.dataset.id, k=b.dataset.v; S.stick[id]=S.stick[id]||{}; S.stick[id][k]=!S.stick[id][k]; save(); b.setAttribute('aria-pressed',!!S.stick[id][k]); if(S.stick[id][k]){ pressFx(`[data-a="stk"][data-v="${CSS.escape(k)}"]`); sparks(b); } },
  res(b){ const q=b.dataset.q; R.res[q]=!R.res[q]; draw(false,true); },
  ttab(b){ R.tTab=b.dataset.id; paintTeacher(); },
  noteswin(){ window.open(baseURL()+'?notes','l07notes','width=560,height=820'); },
  wdel(b){ const a=S.wall[b.dataset.q]||[]; a.splice(+b.dataset.i,1); save(); draw(false,true); },
  wshow(b){ const k=R.wallq.findIndex(w=>w.id===b.dataset.id); if(k<0) return; const w=R.wallq.splice(k,1)[0]; (S.wall[w.task]=S.wall[w.task]||[]).push({text:w.text, by:w.by}); save(); draw(false,true); },
  whide(b){ const k=R.wallq.findIndex(w=>w.id===b.dataset.id); if(k>=0) R.wallq.splice(k,1); paintDock(); },
  livestart(b){ b.disabled=true; b.textContent='Connecting…'; startLive().then(()=>openLive()); },
  livestop(){ stopLive(); openLive(); }, livecopy(){ copy(joinURL(),'Link copied — paste it into the Zoom chat'); },
  soloclear(b){ if(!confirm('Clear both sentences on this device?')) return; try{ localStorage.removeItem(TKEY(b.dataset.id)); }catch(e){} soloApp(); }

  $('#btnUA').onclick=()=>setUA(!R.uaAll); $('#btnLive').onclick=openLive; $('#tchip').onclick=showTimer;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  $('#dockMin').onclick=()=>{ const d=$('#dock'), open=d.classList.toggle('min')===false; $('#dockMin').textContent=open?'▾ hide':'▸ answers'; $('#dockMin').setAttribute('aria-expanded',open); };
  document.addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='Escape'){ if($('#present').classList.contains('on')) return closePresent(); if(!$('#modal').classList.contains('hidden')) return closeModal(); if($('#pop').classList.contains('on')) return hidePop(); return toggleTeacher(false); }
    if(e.target.closest('input,textarea,select') || !$('#modal').classList.contains('hidden') || $('#present').classList.contains('on')) return;
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button,a'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='u'||k==='U') setUA(!R.uaAll);
    else if(k==='f'||k==='F') $('#btnFull').click();
  });
  if(!(S.i>=0 && S.i<STEPS.length)) { S.i=0; S.sub=0; }
  [...Object.values(SCENE_IMG),'img/scene-2.webp','img/story-2.webp','img/story-3.webp','img/story-4.webp',...ALLW.map(wordImg),...TEAMS.map(t=>'img/team-'+t.id+'.webp')].forEach(src=>{ const im=new Image(); im.src=src; });
  draw(true);
  if(S.live) startLive(true);
}
</script>
</body>
</html>
