const sname = id => { const s=stu(id); if(!s) return '—'; return CAST.some(k=>nameKey(CH[k].name)===nameKey(s.name)) ? s.name+' (student)' : s.name; };
const initial = n => (String(n||'?').trim()[0]||'?').toUpperCase();
function addStudent(name){ const s={id:'p'+uid(), name:String(name||('Student '+(S.students.length+1))).slice(0,24), here:true, gone:false}; S.students.push(s); afterCrewChange(); return s; }
function setHere(id,v){ const s=stu(id); if(!s) return; s.here=v; afterCrewChange(); }
function removeStudent(id){ const s=stu(id); if(!s) return;
  const used = Object.values(S.tb).some(b=>b.log.some(x=>x.sid===id)) || Object.values(S.reads).includes(id) || !!((S.ag&&S.ag.turns)||{})[id];
  if(used){ s.gone=true; s.here=false; toast(s.name+' removed — their completed turns are kept in the record'); }
  else S.students=S.students.filter(x=>x.id!==id);
  afterCrewChange(); }
function rejoin(id){ const s=stu(id); if(!s) return; s.gone=false; s.here=true; afterCrewChange(); toast(s.name+' is back — previous turns kept'); }
function renameStudent(id,name){ const s=stu(id); if(!s) return; s.name=String(name||'').slice(0,24)||s.name; save(); }
function afterCrewChange(){ Object.keys(BLOCKS).forEach(b=>{ if(S.tb[b]) ensureCur(b); }); if(!S.gz && typeof cur==='function' && cur().id==='rooms') ensureGroups(); if(S.ag && !S.ag.inTurn) agEnsure(); save(); const c=$('#crewCnt'); if(c) c.textContent=here().length; }


/* ---------- 5 · smart turns ----------
   Mandatory individual tasks = N × R  (N = present students, R = rounds; R = 1 by default in this lesson).
   In a block that has started, the target becomes: completed mandatory turns (never erased)
   + the turns each PRESENT student still needs to reach R. The teacher sees every adjustment.
   A block that has FINISHED is closed: later attendance changes don’t reopen it
   (the teacher can reopen it on purpose, or give an optional extra turn).
   Tasks are taken from the bank in lesson order (the brief’s order), extra students get the extra bank items. */
const BLOCKS = {
  recall:{R:()=>S.R.recall, bank:RECALL, kind:'Vocabulary', title:'📱 SOCIAL MEDIA CHECK!',   instr:'Look at the situations. Say the correct word.', sec:20},
  read:  {R:()=>S.R.read,   bank:COMP,   kind:'Reading',    title:'READ → THINK → ANSWER',     instr:'One question each. Answer from the story.', sec:30,
          pool:()=>COMP.filter(t=>t.part===(S.rscope||1)), cap:()=>readCap(S.rscope||1)},
  gram:  {R:()=>S.R.gram,   bank:GRAM,   kind:'Grammar',    title:'🎯 RECONSTRUCT THE VIDEO!', instr:'Complete the sentences to explain what really happened.', sec:45},
  speak: {R:()=>S.R.speak,  bank:SPEAK,  kind:'Speaking',   title:'💬 WHAT WOULD YOU DO?',     instr:'Answer the question. Give a reason. Ask one follow-up question.', sec:35}
};
const BORDER = Object.keys(BLOCKS);
const Rof = b => BLOCKS[b].R();
const tbs = b => (S.tb[b] = S.tb[b] || {log:[], cur:null, rv:{}, closed:false});
const taskOf = (b,tid)=> BLOCKS[b].bank.find(t=>t.id===tid) || BLOCKS[b].bank[0];
const mand = b => tbs(b).log.filter(x=>!x.opt && x.res!=='skip');
const turnsIn = (b,sid)=> mand(b).filter(x=>x.sid===sid).length;
const lessonTurns = sid => BORDER.reduce((n,b)=>n+(S.tb[b]?mand(b).filter(x=>x.sid===sid).length:0),0);
function target(b){
  const R=Rof(b), P=here(), done=mand(b).length, T=tbs(b);
  const remaining=T.closed?0:P.reduce((n,s)=>n+Math.max(0,R-turnsIn(b,s.id)),0);
  const total=done+remaining, base=P.length*R;
  const away=mand(b).filter(x=>!P.some(s=>s.id===x.sid)).length;
  const over=P.reduce((n,s)=>n+Math.max(0,turnsIn(b,s.id)-R),0);
  const waiting=T.closed?P.filter(s=>turnsIn(b,s.id)<R).length:0;
  return {R, N:P.length, done, remaining, total, base, away, over, waiting, complete:remaining===0};
}
function pickStudent(b, exclude=[]){
  const R=Rof(b), P=here(), off=BORDER.indexOf(b);
  /* avoid giving two turns in a row to the same student (also across blocks) */
  const all=BORDER.flatMap(x=>S.tb[x]?S.tb[x].log:[]).sort((a,c)=>a.at-c.at), lastSid=all.length?all[all.length-1].sid:null;
  const c=P.map((s,i)=>({s, i:(i-off+P.length*4)%Math.max(1,P.length)})).filter(o=>turnsIn(b,o.s.id)<R && !exclude.includes(o.s.id));
  if(!c.length) return null;
  c.sort((x,y)=> turnsIn(b,x.s.id)-turnsIn(b,y.s.id) || (x.s.id===lastSid)-(y.s.id===lastSid) || lessonTurns(x.s.id)-lessonTurns(y.s.id) || x.i-y.i);
  return c[0].s.id;
}
function pickTask(b, sid, avoid){
  const B=BLOCKS[b], T=tbs(b), used=new Set(T.log.filter(x=>x.res!=='skip').map(x=>x.tid)); if(T.cur) used.add(T.cur.tid); if(avoid) used.add(avoid);
  const bank=(B.pool&&B.pool().length)?B.pool():B.bank; const pend=bank.filter(t=>!used.has(t.id));
  if(pend.length) return pend[0].id;
  const mine=new Set(T.log.filter(x=>x.sid===sid).map(x=>x.tid)), cnt=t=>T.log.filter(x=>x.tid===t.id).length;
  const pool=bank.filter(t=>t.id!==avoid && !mine.has(t.id)); return (pool.length?pool:bank).slice().sort((a,c)=>cnt(a)-cnt(c))[0].id;
}
function assign(b){
  const T=tbs(b), tg=target(b); T.rv={};
  if(tg.complete){ T.cur=null; return; }
  if(BLOCKS[b].cap && mand(b).length>=BLOCKS[b].cap()){ T.cur=null; return; }
  const sid=pickStudent(b); if(!sid){ T.cur=null; return; }
  T.cur={sid, tid:pickTask(b,sid), opt:false, at:Date.now()};
  if(BLOCKS[b].sec && ROLE==='teacher') TMR.set(BLOCKS[b].sec, true);
}
function ensureCur(b){
  const T=tbs(b), tg=target(b);
  if(T.cur && BLOCKS[b].pool && !BLOCKS[b].pool().some(t=>t.id===T.cur.tid)){ T.cur=null; T.rv={}; }
  if(T.cur && T.cur.opt) return;
  if(T.cur){
    if(tg.complete){ T.cur=null; return; }
    const s=stu(T.cur.sid);
    if(!s || !s.here || s.gone || turnsIn(b,T.cur.sid)>=Rof(b)){ const n=pickStudent(b); if(n) T.cur.sid=n; else T.cur=null; }
    return;
  }
  if(!tg.complete) assign(b);
}
function markDone(b, res){
  const T=tbs(b); if(!T.cur) return;
  T.log.push({tid:T.cur.tid, sid:T.cur.sid, res, opt:!!T.cur.opt, at:Date.now(), pick:T.rv.pick??null});
  const wasOpt=T.cur.opt; T.cur=null; T.rv={};
  if(target(b).complete){ if(!wasOpt){ T.closed=true; toast('✅ All turns done — '+target(b).total+' / '+target(b).total); SND.play('done'); } }
  else assign(b);
  save(); draw();
}
function reopen(b){ const T=tbs(b); T.closed=false; ensureCur(b); save(); draw(); toast('Block reopened for the students who haven’t had a turn'); }
function swapTask(b){ const T=tbs(b); if(!T.cur) return; T.cur.tid=pickTask(b,T.cur.sid,T.cur.tid); T.rv={}; save(); draw(); }
function setTurnStudent(b,sid){ const T=tbs(b); if(!T.cur) return; T.cur.sid=sid; save(); draw(); }
function nextStudentAuto(b){ const T=tbs(b); if(!T.cur) return; const n=pickStudent(b,[T.cur.sid]); if(n){ T.cur.sid=n; save(); draw(); } else toast('Everyone else has finished their turns in this block'); }
/* Skip = the student isn’t ready: they keep their turn for later, the next student answers now (same task) */
function skipTurn(b){ const T=tbs(b); if(!T.cur) return; const was=T.cur.sid; const n=pickStudent(b,[was]);
  if(!n) return toast('Nobody else is waiting — give a hint or use “With help”');
  T.cur.sid=n; T.rv={}; save(); draw(); toast(sname(was)+' skipped for now — they keep their turn'); }
function extraTurn(b){
  const T=tbs(b), P=here(); if(!P.length) return toast('Add students in 👥 Class first');
  const sid=P.slice().sort((x,y)=>lessonTurns(x.id)-lessonTurns(y.id))[0].id;
  T.cur={sid, tid:pickTask(b,sid), opt:true, at:Date.now()}; T.rv={}; save(); draw(); }
function cancelExtra(b){ const T=tbs(b); if(T.cur&&T.cur.opt){ T.cur=null; T.rv={}; ensureCur(b); save(); draw(); } }
function undoTurn(b){ const T=tbs(b); const last=T.log.pop(); if(!last) return; T.closed=false; T.cur={sid:last.sid, tid:last.tid, opt:last.opt, at:Date.now()}; T.rv={}; if(last.pick!=null) T.rv.pick=last.pick; save(); draw(); toast('Last action undone — it is the current turn again'); }
function nextUp(b){ const T=tbs(b); return pickStudent(b, T.cur?[T.cur.sid]:[]); }

/* story reading turns (dialogue lines — shared, separate from the task quota) */
const readsOf = sid => Object.values(S.reads).filter(v=>v===sid).length;
function readerFor(key){
  if(ROLE!=='teacher') return S.reads[key] || null;
  const cur=S.reads[key], P=here(); if(!P.length) return null;
  if(cur && P.some(s=>s.id===cur)) return cur;
  const keys=Object.keys(S.reads), prev=keys.length?S.reads[keys[keys.length-1]]:null;
  const n=keys.length, c=P.map((s,i)=>({s, i:(i-n%P.length+P.length)%P.length}));
  c.sort((x,y)=>readsOf(x.s.id)-readsOf(y.s.id) || (x.s.id===prev)-(y.s.id===prev) || x.i-y.i);
  S.reads[key]=c[0].s.id; return c[0].s.id;
}
function cycleReader(key){ const P=here(); if(!P.length) return; const i=P.findIndex(s=>s.id===S.reads[key]); S.reads[key]=P[(i+1)%P.length].id; save(); draw(); }

/* ---------- timers ---------- */
const TMR = {
  left(){ const t=S.tmr; return t.run ? Math.max(0,(t.end-Date.now())/1000) : t.left; },
  run(){ return !!S.tmr.run; },
  set(sec, quiet){ S.tmr={dur:sec, left:sec, run:false, end:0}; if(!quiet){ save(); this.paint(); pubState(); } },
  start(){ const t=S.tmr; if(t.left<=0) t.left=t.dur; t.end=Date.now()+t.left*1000; t.run=true; save(); this.paint(); pubState(); },
  pause(){ const t=S.tmr; t.left=this.left(); t.run=false; save(); this.paint(); pubState(); },
  toggle(){ this.run()?this.pause():this.start(); },
  reset(){ this.set(S.tmr.dur||60); },
  add(sec){ const t=S.tmr; if(t.run) t.end+=sec*1000; else t.left+=sec; t.dur=Math.max(t.dur,t.left); save(); this.paint(); pubState(); },
  tick(){ const t=S.tmr; if(ROLE==='teacher' && t.run && Date.now()>=t.end){ t.run=false; t.left=0; save(); SND.play('buzz'); toast('⏰ Time is up — move on when you’re ready.'); pubState(); }
    this.paint(); CLOCK.paint(); },
  paint(){ const l=this.left(); $$('[data-clock]').forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=10&&l>0&&S.tmr.dur<=60 || l<=30&&l>0&&S.tmr.dur>60); e.classList.toggle('out',l<=0); });
    $$('[data-tplay]').forEach(b=>b.textContent=this.run()?'❚❚ Pause':(this.left()<S.tmr.dur&&this.left()>0?'▶ Resume':'▶ Start')); }
};
const CLOCK = {
  el(){ const c=S.clock; return c.acc + (c.run ? (Date.now()-c.start)/1000 : 0); },
  toggle(){ const c=S.clock; if(c.run){ c.acc=this.el(); c.run=false; } else { c.start=Date.now(); c.run=true; } save(); this.paint(); },
  begin(){ if(!S.clock.run && S.clock.acc===0){ S.clock.start=Date.now(); S.clock.run=true; } },
  reset(){ S.clock={run:false, acc:0, start:0}; save(); this.paint(); },
  paint(){ const b=$('#clock'); if(!b) return; const e=this.el(), left=CORE_MIN*60-e;
    b.innerHTML=`<span>${S.clock.run?'⏱':'⏸'}</span><span class="v">${left>=0?mmss(left):'+'+mmss(-left)}</span><span class="of">left of ${CORE_MIN}:00</span>`;
    b.classList.toggle('over',left<0); $$('[data-lclock]').forEach(x=>x.textContent=mmss(e)); }
};

/* ---------- sound (Web Audio, quiet; off by default) ---------- */
const SND = {
  ctx:null,
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur=.15, type='sine', vol=.1, delay=0, f2){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); },
  play(k){ if(!S.sound || ROLE!=='teacher') return; try{
    if(k==='msg'){ this.tone(880,.08,'sine',.08); this.tone(1320,.12,'sine',.07,.07); }
    else if(k==='reveal'){ [523,659,784].forEach((f,i)=>this.tone(f,.3,'triangle',.06,i*.04)); }
    else if(k==='done'){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.3,'triangle',.07,i*.08)); }
    else if(k==='buzz'){ this.tone(330,.4,'sawtooth',.05,0,220); }
  }catch(e){} }
};


/* ---------- 6 · ui helpers ---------- */
const SIL = c => `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#1A2550"/><circle cx="50" cy="40" r="19" fill="${c}" opacity=".85"/><path d="M14 104 Q16 66 50 64 Q84 66 86 104Z" fill="${c}" opacity=".85"/><text x="50" y="47" font-family="Bricolage Grotesque,sans-serif" font-size="22" font-weight="800" fill="#1A2550" text-anchor="middle">?</text></svg>`;

/* ---------- 7 · steps ---------- */
/* WHO'S NEXT — compact teacher panel under every turn card */
function whoNext(b){
  const T=tbs(b), tg=target(b), nx=nextUp(b);
  let h=`<div class="wn tonly"><h5>WHO’S NEXT? · ${tg.done}/${tg.total} required turns${BLOCKS[b].scoped?'':` · N×R = ${tg.N}×${tg.R}`}</h5><div class="tally">${roster().filter(s=>s.here||turnsIn(b,s.id)).map(s=>{ const n=turnsIn(b,s.id), full=n>=tg.R;
    return `<span class="${T.cur&&T.cur.sid===s.id?'cur':full?'full':nx===s.id?'nx':''}" ${s.here?'':'style="opacity:.5"'}>${esc(sname(s.id))} <b>${n}/${tg.R}</b>${full?' ✓':''}${s.here?'':' · absent'}</span>`; }).join('')}</div>
    ${nx&&T.cur?`<div class="small" style="margin-top:6px">Next up: <b style="color:var(--teal2)">${esc(sname(nx))}</b></div>`:''}</div>`;

  return h;
}
function turnControls(b, o={}){
  const T=tbs(b), cur=T.cur, tg=target(b), others=here().filter(s=>cur&&s.id!==cur.sid);
  if(o.compact) return `<div class="acts compact tonly">
      ${o.noHint?'':`<button class="btn xs ghost" data-a="hint" ${o.hasHint===false?'disabled':''} title="Hint (I)">💡</button>`}
      <button class="btn xs ghost" data-a="rev" title="Reveal (R)">${T.rv.a?'🙈 Hide':'👁 '+(o.revLabel||'Answer')}</button>${o.extraBtns||''}
      <select class="field" data-a="who" aria-label="Reassign this turn to">${here().map(s=>`<option value="${s.id}" ${s.id===cur.sid?'selected':''}>${esc(sname(s.id))} · ${turnsIn(b,s.id)}/${tg.R}</option>`).join('')}</select>

      <span class="sp"></span><button class="btn sm ok" data-a="ok" title="Mark completed (D)">✓ Mark completed</button><button class="btn sm" data-a="help" title="Completed with help">🤝</button></div>`;
  return `<div class="acts tonly">
      ${o.noHint?'':`<button class="btn sm ghost" data-a="hint" ${o.hasHint===false?'disabled':''}>💡 Hint</button>`}
      ${o.noRev?'':`<button class="btn sm ghost" data-a="rev">${T.rv.a?'🙈 Hide answer':'👁 '+(o.revLabel||'Reveal answer')}</button>`}
      ${o.extraBtns||''}
      <span class="sp"></span>
      <button class="btn sm ok" data-a="ok" title="Mark completed (D)">✓ Mark completed</button>

      ${others.length?`<button class="btn xs ghost" data-a="auto">↷ Next student</button><button class="btn xs ghost" data-a="skip" title="Not ready — keeps the turn for later">⤼ Skip</button>`:''}
      ${BLOCKS[b].scoped?'':`<button class="btn xs ghost" data-a="swap">🔀 Other task</button>`}
      ${T.log.length?`<button class="btn xs ghost" data-a="undo">↶ Undo last</button>`:''}
      ${cur.opt?`<button class="btn xs ghost" data-a="cancel">✕ Cancel extra</button>`:''}
    </div>`;
}
function bindTurn(v,b,o={}){
  const T=tbs(b);
  $$('[data-a]',v).forEach(el=>{ const a=el.dataset.a;
    if(a==='who'){ el.onchange=()=>setTurnStudent(b,el.value); return; }
    el.onclick=()=>{
      if(a==='hint'){ T.rv.h=!T.rv.h; save(); draw(); }
      else if(a==='rev'){ T.rv.a=!T.rv.a; if(T.rv.a) SND.play('reveal'); save(); draw(); }
      else if(a==='peer'){ const P=here().filter(s=>T.cur&&s.id!==T.cur.sid); if(!P.length) return; T.rv.pi=(T.rv.pi||0)+1; const sid=P[(T.log.length+T.rv.pi)%P.length].id; const PL=PEERS[b]||PEERQ; T.rv.peer={sid, q:PL[(T.log.length+T.rv.pi)%PL.length]}; save(); draw(); }
      else if(a==='ok') markDone(b,'ok');
      else if(a==='help') markDone(b,'help');
      else if(a==='auto') nextStudentAuto(b);
      else if(a==='skip') skipTurn(b);
      else if(a==='swap') swapTask(b);
      else if(a==='undo') undoTurn(b);
      else if(a==='extra') extraTurn(b);
      else if(a==='cancel') cancelExtra(b);
      else if(o.on && o.on[a]) o.on[a](el);
    }; });
  $$('[data-tplay]',v).forEach(x=>x.onclick=()=>TMR.toggle());
}

/* reading turns are spread over the three clues: round-robin 1-2-3-1-2-3… (5 → 2 + 2 + 1, 4 → 2 + 1 + 1, 6 → 2 + 2 + 2) */
function readQuota(T){ return [1,2,3].map(k=>Math.floor(T/3)+(k<=T%3?1:0)); }
function readCap(k){ const q=readQuota(target('read').total); return q.slice(0,k).reduce((a,b)=>a+b,0); }
function readPart(k){ const ml=mand('read'), before=ml.filter(x=>taskOf('read',x.tid).part<k).length, done=ml.filter(x=>taskOf('read',x.tid).part===k).length;
  return {done, total:Math.max(done, readCap(k)-before)}; }

function taskBody(b, t, T, who){
  if(b==='recall'){ const row=AW(t.a);
    return { body:`<p class="small" style="margin:4px 0 6px">Which word or expression?</p><div class="sit">${esc(t.q)}</div>`,
      hint:`<div class="hintbox">💡 Starts with: <b style="letter-spacing:.06em">${esc(t.hint)}</b></div>`,
      ans:`<div class="ans"><div class="a">${esc(t.a)}</div>${row?`<div class="ex">“${esc(row[2])}”</div>`:''}</div>` }; }
  if(b==='read'){ const sq=!!T.rv.q;
    const rta=`<div class="rta"><span class="d">📖 Read</span><i>→</i><span class="${sq?'d':'c'}">🤔 Think</span><i>→</i><span class="${T.rv.a?'d':sq?'c':''}">💬 Answer</span></div>`;
    return { body:rta+(sq?`<div class="q qin">${esc(t.q)}</div>`:`<div class="qwait"><button class="btn big gold" data-a="showq">❓ Show question</button><p class="small">🎙 ${esc(who)}, get ready…</p></div>`),
      hint:sq?`<div class="hintbox">💡 ${esc(t.hint)}</div>`:'', ans:`<div class="ans"><div class="a">${esc(t.a)}</div></div>` }; }
  if(b==='speak') return { body:`<div class="q">${esc(t.q)}</div>${T.rv.f?`<div class="peer">💬 Follow-up: <b>${esc(t.follow)}</b></div>`:''}`,
    hint:`<div class="hintbox">🗣 ${esc(t.hint)}</div>`, ans:`<div class="sample"><small>EXAMPLE ANSWER</small>${esc(t.a)}</div>` };
  /* gram — complete the sentence / find the mistake */
  const pk=T.rv.pick, rv=!!T.rv.a, ci=t.mist?t.c:t.o.indexOf(t.a);
  const cnt = LIVE.on ? vcounts('g:'+t.id+':'+(T.cur?T.cur.sid:''), t.o.length) : null;
  const opts=t.o.map((o,i)=>{ let st=''; if(pk===i) st=i===ci?'right':'wrong'; else if(rv&&i===ci) st='right';
    return `<button class="${st}" data-a="pk${i}" aria-pressed="${pk===i}"><span class="L">${LET[i]}</span><span class="grow">${esc(o)}</span>${cnt&&cnt[i]?`<b class="tonly pc">${cnt[i]}📱</b>`:''}</button>`; }).join('');
  const sent = t.mist ? (rv ? esc(t.s).replace(esc(t.del),`<del>${esc(t.del)}</del>`) : esc(t.s)) : (rv||pk===ci ? esc(t.s).replace('___',`<span class="fill">${esc(t.a)}</span>`) : emph(t.s));
  const wrongHint = pk!=null && pk!==ci && !rv ? `<div class="hintbox soft">🙂 Not quite — try again! 💡 ${esc(t.hint)}</div>` : '';
  return { pre:`<span class="ttype">${t.mist?'FIND THE MISTAKE':'COMPLETE'}</span> <span class="sub" style="margin-left:6px">${t.mist?'One word is wrong. Fix the sentence.':'Say the right form of the verb.'}</span>`,
    body:`<div class="gs ${rv||pk===ci?'okn':''}">${sent}</div><div class="gopts">${opts}</div>${wrongHint}`,
    hint:`<div class="hintbox">💡 ${esc(t.hint)}</div>`,
    ans:`<div class="ans"><div class="a">✓ ${esc(t.full)}</div><div class="ex">${esc(t.why)}</div></div>` };
}

function blockStep(b, o={}){
  const B=BLOCKS[b];
  return Object.assign({
    block:b, title:B.title.replace(/^[^A-Z]+/,'').charAt(0)+B.title.replace(/^[^A-Z]+/,'').slice(1).toLowerCase(),
    enter(){ if(o.scope) S.rscope=o.scope; ensureCur(b); },

      let h=scn(this)+(o.pre?o.pre(d):'')+`<div class="tk-head"><div class="grow"><h2 class="h-l">${esc(o.head||B.title)}</h2><p class="instr" style="margin:6px 0 0">${esc(B.instr)}</p></div>${meter}</div>`;
      if(cur){

        h+=`<div class="turn${cur.opt?' opt':''}">
          <div class="who"><span class="mic"><span class="ini">${esc(initial(who))}</span>${esc(who)}</span>
            <span class="ty">${esc(B.kind)}</span>
            <span class="rnd">${cur.opt?'Optional extra · does not count':`Student ${Math.min(tg.done+1,tg.total)} / ${tg.total} — Your Turn!`}</span>
            <span class="grow"></span><span class="tmr" data-clock>${mmss(TMR.left())}</span><button class="btn xs ghost tonly" data-tplay>${TMR.run()?'❚❚ Pause':'▶ Start'}</button></div>
          ${tb.pre?`<div style="margin-bottom:4px">${tb.pre}</div>`:''}

        </div>`;
      } else if(o.scope && !tg.complete){
        const nx=READ[o.scope];
        h+=`<div class="done-card sm"><div class="big">✅</div><h3 class="h-m">${pi.total?`${esc(READ[o.scope-1].tag)} questions done — ${pi.done} / ${pi.total}`:`No questions for ${esc(READ[o.scope-1].tag)} with ${tg.N} student${tg.N>1?'s':''} — keep reading`}</h3>
          <div class="row mt" style="justify-content:center"><button class="btn primary" data-next>${nx?`📖 Continue reading · ${esc(nx.tag)} ▶`:'Continue ▶'}</button><button class="btn ghost tonly" data-a="extra">+ Optional extra question</button>${T.log.length?`<button class="btn ghost tonly" data-a="undo">↶ Undo last</button>`:''}</div></div>`;
      } else {
        h+=`<div class="done-card${o.post?' sm':''}"><div class="big">✅</div><h3 class="h-m">All turns done — ${tg.done} / ${tg.total}</h3><p class="muted">Everyone present had ${tg.R>1?tg.R+' turns':'a turn'}.</p>
          ${tg.waiting?`<p class="small tonly" style="color:var(--gold2)">${tg.waiting} student${tg.waiting>1?'s':''} joined after this block finished — the block stays closed. <button class="btn xs ghost" data-a="reopen">↺ Reopen for them</button></p>`:''}

        h+=`<div class="row mt"><div class="dots" aria-label="${tg.done} of ${tg.total} turns done">${slots.map(c=>`<i class="${c}"></i>`).join('')}</div></div>`; }

    },
    after(v,d){ const T=tbs(b);
      const pk=i=>()=>{ T.rv.pick=T.rv.pick===i?null:i; if(b==='gram'){ const t=taskOf(b,T.cur.tid), ci=t.mist?t.c:t.o.indexOf(t.a); if(T.rv.pick===ci){ SND.play('done'); } } save(); draw(); };
      bindTurn(v,b,{on:{ fol:()=>{ T.rv.f=!T.rv.f; save(); draw(); }, reopen:()=>reopen(b), showq:()=>{ T.rv.q=1; save(); draw(); }, pk0:pk(0), pk1:pk(1), pk2:pk(2) }});

    hint(){ const T=tbs(b); if(!T.cur || (b==='read'&&!T.rv.q)) return false; T.rv.h=1; },
    hide(){ const T=tbs(b); T.rv.a=0; T.rv.h=0; },

      if(b==='read' && !T.rv.q) return {kind:'turn', id:b+':'+T.cur.tid+':'+T.cur.sid, who, block:B.kind, prompt:'Get ready — the question is coming…', hint:null, ans:null, done:tg.done, total:tg.total};
      const prompt = b==='recall' ? 'Which word? “'+t.q+'”' : t.q;
      const ans = T.rv.a ? t.a : null;
      const hn = !T.rv.h ? null : b==='recall' ? 'Starts with: '+t.hint : (t.hint||null);
      return {kind:'turn', id:b+':'+T.cur.tid+':'+T.cur.sid, who, block:B.kind, prompt, hint:hn, ans, done:tg.done, total:tg.total}; }
  }, o.step||{});
}

/* ── breakout helpers ── */
function teamSizes(n){ if(n<=3) return [n]; if(n===4) return [2,2]; if(n===5) return [3,2]; if(n===6) return [3,3]; if(n===7) return [4,3]; if(n===8) return [4,4]; const k=Math.ceil(n/4); const base=Math.floor(n/k), extra=n%k; return Array.from({length:k},(_,i)=>base+(i<extra?1:0)); }
function rolesFor(m){ const r={};
  if(m.length===1) r[m[0]]='solo';
  else if(m.length===2){ r[m[0]]='pairA'; r[m[1]]='pairB'; }
  else { const order=['edit','team','rules','extra','why']; m.forEach((sid,j)=>r[sid]=order[j]||'extra'); }
  return r; }
function buildGroups(mode){
  const P=here(), g=[];
  if(mode==='solo') P.forEach(s=>g.push({members:[s.id]}));
  else if(mode==='pairs'){ for(let i=0;i<P.length;i+=2) g.push({members:P.slice(i,i+2).map(s=>s.id)}); if(g.length>1 && g[g.length-1].members.length===1){ const last=g.pop(); g[g.length-1].members.push(last.members[0]); } }
  else { let i=0; teamSizes(P.length).forEach(n=>{ g.push({members:P.slice(i,i+n).map(s=>s.id)}); i+=n; }); }
  g.forEach((x,i)=>{ x.id='g'+(i+1); x.name=GROUP_NAMES[i%GROUP_NAMES.length]; x.roles=rolesFor(x.members); });
  S.bo.mode=mode; S.bo.groups=g; S.bo.cur=0; save();
}
function ensureGroups(){ const P=here().map(s=>s.id).sort().join(), G=S.bo.groups.flatMap(g=>g.members).sort().join();
  if(S.bo.groups.length && P===G) return;
  const mode = here().length===1 ? 'solo' : (S.bo.modeSet ? S.bo.mode : 'teams'); buildGroups(mode); }
function moveMember(sid){ const G=S.bo.groups; if(G.length<2) return; const i=G.findIndex(g=>g.members.includes(sid)); if(i<0) return;
  G[i].members=G[i].members.filter(x=>x!==sid); const j=(i+1)%G.length; G[j].members.push(sid);
  S.bo.groups=G.filter(g=>g.members.length); S.bo.groups.forEach(g=>g.roles=rolesFor(g.members)); save(); }
function groupsHTML(editable){ if(!S.bo.groups.length) return '';
  return `<div class="groups">${S.bo.groups.map(g=>`<div class="grp"><h4>${esc(g.name)}</h4>${g.members.map(sid=>{ const r=ROLES[g.roles[sid]]||ROLES.extra;
    return `<div class="m">${iniBubble(sname(sid))}<span>${esc(sname(sid))}</span><span class="rl">${r.e} ${esc(r.t)}</span>${editable&&S.bo.groups.length>1?`<button class="btn xs ghost tonly" data-mv="${sid}" title="Move to the next team">⇄</button>`:''}</div>`; }).join('')}</div>`).join('')}</div>`; }
function missionText(){ return `${MISSION.title} ${MISSION.e}
${MISSION.intro}
${MISSION.instr}
${MISSION.steps.map(q=>q.n+' — '+q.t+': '+q.q+'  ('+q.starters.join(' / ')+')').join('\n')}
${MISSION.creative}
${MISSION.everyone} ${MISSION.nowrite}
${S.bo.groups.map(g=>g.name+': '+g.members.map(sid=>sname(sid)+' ('+(ROLES[g.roles[sid]]||ROLES.extra).t+')').join(', ')).join('\n')}`; }
function planCard(g){ const c=S.bo.cards[g.id]||{};
  return `<div class="plan"><h4>${esc(g.name)} · plan card <span class="small" style="font-family:var(--body)">(optional — talking is enough)</span></h4>${CARD_F.map(([k,e,l])=>`<label>${e} ${l}<input data-card="${g.id}" data-f="${k}" value="${esc(c[k]||'')}" maxlength="60" placeholder="______" aria-label="${esc(g.name)} — ${l}"></label>`).join('')}</div>`; }
function bindCards(v){ $$('[data-card]',v).forEach(i=>{ i.oninput=()=>{ const c=S.bo.cards[i.dataset.card]=S.bo.cards[i.dataset.card]||{}; c[i.dataset.f]=i.value.slice(0,60); save(); pubState(); }; i.onkeydown=e=>{ if(e.key==='Enter') i.blur(); }; }); }
function sparkle(){ if(S.noanim||REDUCED_OS) return; const em=['✨','📸','🎬','💜','⭐','🎥'];
  for(let i=0;i<16;i++){ const s=document.createElement('span'); s.className='spark'; s.textContent=em[i%em.length]; s.style.left=(6+Math.random()*88)+'vw'; s.style.bottom=(4+Math.random()*16)+'vh'; s.style.animationDelay=(Math.random()*1.4)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),4400); } }

const AT = ()=> Math.max(1, +CFG.ALIAS_TURNS||2);
function agS(){ const a=S.ag; a.turns=a.turns||{}; a.pts=a.pts||{}; a.deck=a.deck||[]; a.round=a.round||{got:0,words:[]}; a.log=a.log||[]; return a; }
function agTarget(){ const a=agS(), P=here(), done=Object.values(a.turns).reduce((n,v)=>n+v,0), rem=P.reduce((n,s)=>n+Math.max(0,AT()-(a.turns[s.id]||0)),0); return {done, total:done+rem, rem, complete:rem===0, N:P.length}; }
function agPick(ex){ const a=agS(), P=here().filter(s=>(a.turns[s.id]||0)<AT()); if(!P.length) return null; const c=P.filter(s=>s.id!==ex), L=(c.length?c:P).slice(), all=here();
  L.sort((x,y)=>((a.turns[x.id]||0)-(a.turns[y.id]||0)) || ((x.id===a.last)-(y.id===a.last)) || (all.indexOf(x)-all.indexOf(y))); return L[0].id; }
function agEnsure(){ const a=agS(); if(a.inTurn && a.cur && here().some(s=>s.id===a.cur)) return; if(!a.cur || !here().some(s=>s.id===a.cur) || (a.turns[a.cur]||0)>=AT()) a.cur=agPick(null); }
function agDraw(){ const a=agS(); if(!a.deck.length){ a.deck=ALIAS_ROWS.map((_,i)=>i).sort(()=>Math.random()-.5); if(a.deck[0]===a.word && a.deck.length>1) a.deck.push(a.deck.shift()); }
  a.word=a.deck.shift(); a.def=false; a.ex=false; a.bonus = a.useBonus && Math.random()<.35 ? Math.floor(Math.random()*BONUS.length) : null; }
function agStart(){ const a=agS(); agEnsure(); if(!a.cur) return toast(here().length?'Everyone has finished their Alias turns':'Add students in 👥 Class first');
  a.inTurn=true; a.round={got:0,words:[]}; agDraw(); TMR.set(a.dur||45,true); TMR.start(); save(); draw(); }
function agCorrect(){ const a=agS(); if(!a.inTurn||a.word==null) return; const p=a.bonus!=null?2:1; a.pts[a.cur]=(a.pts[a.cur]||0)+p; a.round.got+=p; a.round.words.push([a.word,'ok']); SND.play('reveal'); agDraw(); save(); draw(); }
function agSkip(){ const a=agS(); if(!a.inTurn||a.word==null) return; a.round.words.push([a.word,'skip']); agDraw(); save(); draw(); }
function agEnd(){ const a=agS(); if(!a.cur) return;
  if(a.inTurn){ a.turns[a.cur]=(a.turns[a.cur]||0)+1; a.log.push({sid:a.cur, got:a.round.got, at:Date.now()}); a.last=a.cur; a.inTurn=false; a.word=null; a.bonus=null; if(TMR.run()) TMR.pause(); TMR.set(a.dur||45,true);
    const nx=agPick(a.last); a.cur=nx; if(!nx){ toast('✅ All Alias turns done — '+agTarget().total+' / '+agTarget().total); SND.play('done'); setTimeout(confetti,150); } }
  else { const nx=agPick(a.cur); if(nx && nx!==a.cur){ toast(sname(a.cur)+' keeps the turn for later'); a.cur=nx; } else return toast('Nobody else is waiting'); }
  save(); draw(); }
function agUndo(){ const a=agS(); const L=a.log.pop(); if(!L) return; a.turns[L.sid]=Math.max(0,(a.turns[L.sid]||0)-1); a.pts[L.sid]=Math.max(0,(a.pts[L.sid]||0)-L.got); a.cur=L.sid; a.inTurn=false; a.word=null; save(); draw(); toast('Last Alias turn undone'); }
function agReset(){ if(!confirm('Reset the Alias game? Scores and turns will be cleared.')) return; const a=agS(); S.ag={mode:a.mode, dur:a.dur, useBonus:a.useBonus, show:false}; if(TMR.run()) TMR.pause(); save(); draw(); toast('Alias reset'); }
function aliasRef(){ const a=agS(), c=(i,k,t)=> (k==='d'?a.rd!==false:k==='e'?a.re!==false:a.ru!==false) ? esc(t) : `<span class="cov">• • •</span>`;

      <div class="mt"><button class="btn primary" data-next>🎤 Team presentations ▶</button></div></div></div>`; },

    const cp=$('#bCopy2',v); if(cp) cp.onclick=()=>copyText(missionText(),'Copied — paste it into the Zoom chat');

    const ex=$('#bEx',v); if(ex) ex.onclick=()=>{ d.ex=1; save(); draw(); };
    bindCards(v); },
  reveal(d){ d.ex=1; }, hide(d){ d.ex=0; },
  live(){ return {kind:'group', groups:S.bo.groups.map(g=>({id:g.id, name:g.name, card:S.bo.cards[g.id]||{}, m:g.members.map(sid=>({n:stu(sid)?stu(sid).name:'', r:(ROLES[g.roles[sid]]||ROLES.extra).t, d:(ROLES[g.roles[sid]]||ROLES.extra).does}))})), steps:MISSION.steps.map(q=>q.t+' — '+q.q)}; },
  n:{t:'3 хв обговорення (+ вхід/вихід з кімнат)', obj:'Breakout: усний план із 3 кроків. Командна робота — індивідуальні ходи тут не рахуються, але кожен учень говорить.',

    const by=k=>{ const sid=g.members.find(m=>{ const r=g.roles[m]; return r===k||r==='solo'||(r==='pairA'&&k!=='rules')||(r==='pairB'&&k==='rules'); }); return sid?'🎙 '+esc(sname(sid)):''; };

  after(v,d){ const G=S.bo.groups, i=Math.min(S.bo.cur||0,G.length-1), g=G[i]; if(!g) return; const P=S.bo.pres[g.id]=S.bo.pres[g.id]||{};

/* ═════════ SCENE 7 · CHOOSE THE ENDING ═════════ */
{ id:'final', sc:9, title:'Maya’s final choice', sky:'golden',

    return scn(this)+`<div class="pollbox fc"><div class="row" style="gap:16px;align-items:center;justify-content:center"><h1 class="h-l">📱 MAYA’S <span class="grad">FINAL CHOICE</span></h1></div>

      <p class="center small mt">${cl?'':`Discuss for a moment — then vote with your hand${LIVE.on?' or on your phone':''}. ${tot?`<b style="color:#fff">${tot} vote${tot>1?'s':''} so far</b> — results appear when voting closes.`:'Results appear when voting closes.'}`}</p>
      <div class="vote mt">${POLL.opts.map(opt).join('')}</div>

  n:{t:'40 с', obj:'Голосування за фінал. Жоден фінал не «правильніший» — усі три нейтральні.', do:['Без телефонів: рахуйте руки + / −. З телефонами — один голос на учня (можна змінити, доки голосування відкрите).','Результати приховані до 🔒 Close voting. Нічия → Choose біля варіанта.'],

{ id:'ending', sc:9, title:'The ending', sky:'golden', parts:()=>S.choice.ending?3:1,
  render(d){ const E=S.choice.ending;

/* ---------- 9 · engine ---------- */
let CTX = {entering:true};
let LAST = {id:null, p:-1, gz:null}, GATE = null;
const cur = ()=> STEPS[S.i] || STEPS[0];
const parts = s => typeof s.parts==='function' ? s.parts() : (s.parts||1);
const visible = k => !!STEPS[k] && !(S.core && STEPS[k].opt);
const typing = ()=> !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('input,textarea,select'));
if(S.i>=STEPS.length) S.i=0;

function draw(){
  if(ROLE==='student') return;
  const v=$('#view');
  if(S.gz){ const entering=LAST.gz!==S.gz||LAST.id!=='__gz'; document.body.dataset.sky='studio'; v.innerHTML=gzRender(); if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
    gzAfter(v); LAST={id:'__gz', p:0, gz:S.gz}; paintChrome(); paintSheet(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); save(); return; }
  const s=cur(), d=sd(s.id);
  if((d.p||0)>parts(s)-1) d.p=parts(s)-1;
  const entering = LAST.id!==s.id;
  CTX={entering, partChanged: entering || LAST.p!==(d.p||0)};
  if(entering) stopConfetti();
  if(entering && ROLE==='teacher' && s.enter) s.enter(d);
  document.body.dataset.sc=s.sc; document.body.dataset.sky=s.sky||SCENES[s.sc-1].sky;
  const fid=document.activeElement && document.activeElement.id;
  v.innerHTML=s.render(d);
  if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  bindReaders(v);
  s.after && s.after(v,d);
  if(fid && !entering){ const f=document.getElementById(fid); if(f && v.contains(f)) f.focus({preventScroll:true}); }
  LAST={id:s.id, p:d.p||0, gz:null};
  paintChrome(); paintSheet(); pubState(); if(ROLE==='teacher' && $('#notes').classList.contains('on')) paintNotes(); TMR.paint(); save();
}
function next(){
  if(S.gz){ closeGZ(); return; }
  const s=cur(), d=sd(s.id), P=parts(s), p=d.p||0;
  if(p<P-1){ d.p=p+1; s.onPart&&s.onPart(d); GATE=null; save(); draw(); return; }
  if(s.ready && !s.ready(d)){ const g=s.id+':'+p; if(GATE!==g){ GATE=g; toast(s.gateMsg||'Not finished yet — press Next again to continue'); return; } }
  GATE=null;
  s.leave && s.leave(d);
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else openGZ('home');
}
function back(){
  if(S.gz){ closeGZ(); return; }
  const d=sd(cur().id); GATE=null;
  if((d.p||0)>0){ d.p--; save(); draw(); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--; if(k>=0) go(k);
}
function go(k){ if(!STEPS[k]) return; S.gz=null; S.i=k; GATE=null; save(); draw(); }
function goScene(n){ const k=STEPS.findIndex((x,i)=>x.sc===n && visible(i) && x.id!=='setup' && x.id!=='title'); if(k>=0) go(k); }
function reveal(){ if(S.gz) return; const s=cur(), d=sd(s.id);
  if(s.reveal){ if(s.reveal(d)===false) return; } else if(parts(s)>1){ d.p=parts(s)-1; s.onPart&&s.onPart(d); } else return;
  SND.play('reveal'); save(); draw(); }
function hint(){ const s=cur(); if(S.gz||!s.hint) return; if(s.hint(sd(s.id))===false) return; save(); draw(); }
function hideAns(){ if(S.gz) return; const s=cur(), d=sd(s.id); if(s.hide) s.hide(d); else return; save(); draw(); toast('Answer hidden'); }

function buildRail(){
  $('#rail').innerHTML=SCENES.map(sc=>`<button data-sc="${sc.n}" aria-label="Scene ${sc.n}: ${esc(sc.t)} — ${esc(sc.f)}"><span class="k">${sc.n}</span><span class="t">${esc(sc.k)}</span></button>`).join('')+`<button class="gz" data-gz aria-label="Game Zone">🎮 <span class="t">Games</span></button>`;
  $$('#rail [data-sc]').forEach(b=>b.onclick=()=>goScene(+b.dataset.sc)); $('#rail [data-gz]').onclick=()=>S.gz?closeGZ():openGZ('home');
}
function allTurns(){ let done=0,total=0; BORDER.forEach(b=>{ if(!S.tb[b]) { total+=here().length*Rof(b); return; } const t=target(b); done+=t.done; total+=t.total; }); return {done,total}; }
function paintChrome(){
  const s=cur(), d=sd(s.id), P=parts(s);
  $$('#rail [data-sc]').forEach(b=>{ const n=+b.dataset.sc, on=!S.gz&&n===s.sc; b.classList.toggle('cur',on); b.classList.toggle('done',n<s.sc); if(on) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  const gzb=$('#rail [data-gz]'); if(gzb) gzb.classList.toggle('cur',!!S.gz);
  paintShow(s);
  if(ROLE!=='teacher') return;
  const sc=SCENES[s.sc-1], at=allTurns(), T=s.block?tbs(s.block):null;
  $('#info').innerHTML = S.gz ? '<b>Game Zone</b> · the lesson stays where you left it' :
    `<b>Scene ${sc.n}/${SCENES.length}</b> · ${esc(s.title)}${P>1?` (${(d.p||0)+1}/${P})`:''}${s.opt?' · optional':''} · turns ${at.done}/${at.total}${T&&T.cur?` · 🎙 ${esc(sname(T.cur.sid))}`:''} · 👥 ${here().length}`;
  $('#bBack').disabled = !S.gz && S.i===0 && !(d.p>0);
  $('#bBack').innerHTML = S.gz ? '◀ <span class="lbl2">Back to lesson</span>' : '◀ <span class="lbl2">Back</span>';
  $('#bReveal').disabled = S.gz || !(s.reveal || P>1);
  $('#bHide').disabled = S.gz || !s.hide;
  $('#bHint').disabled = S.gz || !s.hint;
  $('#bNext').innerHTML = S.gz ? 'Back to lesson ▶' : S.i===STEPS.length-1 ? 'Finish ✓' : 'Next ▶';
  $('#bLive').classList.toggle('on', LIVE.on);
  $('#bQuick').classList.toggle('on', S.core); $('#bQuick').setAttribute('aria-pressed',String(S.core));
  $('#bWs').classList.toggle('on', $('#notes').classList.contains('on')); $('#bNotes2').classList.toggle('on', $('#notes').classList.contains('on'));
  const c=$('#crewCnt'); if(c) c.textContent=here().length;
  const tp=$('#top'); if(tp) document.documentElement.style.setProperty('--toph',tp.offsetHeight+'px');
  CLOCK.paint();
}

/* ---------- 12 · live room ----------
   Учитель — єдине джерело стану. Захист (як в уроках 13–23):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»: не перемикає сцени,
     не бачить відповідей до Reveal, не змінює присутність інших, не скидає урок;
   • учні надсилають тільки hello / ans / card / react; учитель перевіряє кожне (поточне завдання, межі, довжину,
     для картки команди — що учень справді в цій команді);
   • лише ім’я / нік, жодних інших даних. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const WALLQ = [], NAMES = {};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','📷'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson12-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson12-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l26sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l26sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson12-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson12-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));
  if(TKEY.ok){ try{ const sig=await TKEY.sign(body); Net.send({t:'sig', body, sig, pk:TKEY.pub}); return; }catch(e){ console.warn(e); } }
  Net.send({t:'raw', body});
}

function onTeacherMsg(m){

  else if(task.kind==='choice'){ const n=vcounts(task.id,task.opts.length), mx=Math.max(1,...n); h+=`<div class="small">${Object.keys(S.lv[task.id]||{}).length} phone votes (+ hands you counted)</div>`+task.opts.map((o,i)=>`<div class="dbar"><span>${esc(o)}</span> <b>${n[i]}</b><div class="tr"><i style="width:${n[i]/mx*100}%"></i></div></div>`).join(''); }
  else if(task.kind==='awards'){ h+=task.cats.map(c=>`<div class="small" style="margin-top:6px"><b>${esc(c.q)}</b> · ${Object.keys(S.lv[c.id]||{}).length} phone votes</div>`).join(''); }

  else if(task.kind==='group'){ h+=`<div class="small">Phones show each student’s team and role; team members can fill in their planning card.</div>`; }

  $$('[data-addc]',d).forEach(b=>b.onclick=()=>{ addStudent(b.dataset.addc); toast(b.dataset.addc+' added to the class'); draw(); });
  $$('[data-back]',d).forEach(b=>b.onclick=()=>{ setHere(b.dataset.back,true); draw(); });
}

async function startLive(silent){
  const signed=await TKEY.init();
  const kind=await Net.connect({room:S.room, id:S.tid, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); }});

function stopLive(){ sendSigned({t:'end'}); setTimeout(()=>Net.stop(),300); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); paintDock(); draw(); }
function liveStatus(){

  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const keyOf=m=>{ const T=m.task; if(T&&T.kind==='group') return JSON.stringify([m.sc,m.step,T.groups.map(g=>[g.id,g.name,g.m.map(x=>x.n+x.r)])]); return JSON.stringify([m.sc,m.step,T]); };

  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  const paintCard=()=>{ if(!st||!st.task||st.task.kind!=='group') return; const g=(st.task.groups||[]).find(x=>x.m.some(p=>me(p.n))); if(!g) return;
    $$('[data-cf]',B).forEach(i=>{ if(document.activeElement!==i) i.value=(g.card||{})[i.dataset.cf]||''; }); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>nameKey(n)===nameKey(name);
  const head2=()=>`<div class="stu-prog">${SCENES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div>

  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait">${av('maya',90)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head2();

    if(T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T.e||'🎟️')}</div><p><b>${esc(T.t)}</b></p></div>`; return; }
    if(T.kind==='turn'){
      const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block)} · turn ${Math.min(T.done+1,T.total)} of ${T.total} <span id="stuT"></span></p>
        <p style="font-size:22px;font-weight:800;margin:6px 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p>

    const choiceCard=(id,q,opts,chosen,T0)=>{ const my=sent[id], dec=chosen!=null || !!(T0&&T0.closed);
      return `<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt ${dec&&chosen===i?'right':my===i?'pick':''}" data-q="${esc(id)}" data-i="${i}" ${dec?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(!$('#embed').classList.contains('hidden')) return closeEmbed(); if(S.sheet.open && !$('#sheet').classList.contains('hidden')){ if(S.sheet.pres){ S.sheet.pres=false; } else S.sheet.open=false; save(); paintSheet(); pubState(); return; } if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  if(S.sheet.open && !$('#sheet').classList.contains('hidden')) return;
  if(!$('#embed').classList.contains('hidden')) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A' && tag!=='SUMMARY')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(!S.gz && s.block && tbs(s.block).cur && (!BLOCKS[s.block].scoped || taskOf(s.block,tbs(s.block).cur.tid).part===s.scope)) markDone(s.block,'ok'); }
  else if(k==='n') openNav(); else if(k==='c') openCrew(); else if(k==='w') toggleNotes(); else if(k==='f') present();
  else if(k==='g') S.gz?closeGZ():openGZ('home');
});

  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  if(S.ws && innerWidth>=1280){ $('#notes').classList.add('on'); document.body.classList.add('ws'); $('#notes').setAttribute('aria-hidden','false'); }
  draw();
  if(S.live) startLive(true);
}


</script>
</body>
