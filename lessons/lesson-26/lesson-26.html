{ id:'poll', sc:5, title:'Crew vote', sky:'warm',
  render(){ const c=pollCounts(), tot=c.reduce((a,b)=>a+b,0), cl=S.poll.closed, E=S.choice.ending, mx=Math.max(1,...c), ph=Object.keys(S.lv.poll||{}).length;
    const opt=(o,i)=>`<div class="vopt ${cl&&E===o.L?'win':''}">${cl?`<span class="bar" style="width:${tot?c[i]/mx*100:0}%"></span>`:''}<span class="L">${o.L}</span><span class="t">${esc(o.t)}</span>
      <span class="row" style="gap:8px;position:relative;z-index:1">${cl?'':`<span class="pm tonly"><button class="btn xs ghost" data-vm="${i}" aria-label="Minus one vote">−</button><button class="btn xs" data-vpl="${i}" aria-label="Plus one vote">+</button><span class="n">${c[i]}</span></span>`}
      ${cl?`<span class="n">${c[i]}</span>${tot?`<span class="pct">${Math.round(c[i]/tot*100)}%</span>`:''}<button class="btn xs tonly ${E===o.L?'gold':''}" data-pick="${o.L}">${E===o.L?'✓ Decision':'Choose'}</button>`:''}</span></div>`;
    return scn(this)+`<div class="pollbox"><p class="kicker center">🗳 CREW VOTE</p><h1 class="h-l center" style="margin-top:4px">${esc(POLL.q)}</h1>
      <p class="center small mt">${cl?'Poll closed.':`Vote with your hand${LIVE.on?' or on your phone':''}. ${tot?`<b style="color:#fff">${tot} vote${tot>1?'s':''} so far</b> — results appear when the poll closes.`:'Results appear when the poll closes.'}`}</p>
      <div class="vote mt">${POLL.opts.map(opt).join('')}</div>
      ${cl?(E?`<div class="verdict">The crew has decided: <b>${E}</b> — ${esc(POLL.opts[LET.indexOf(E)].t)}<br><span class="small">🔒 The ending stays secret until the show…</span></div>`:`<div class="verdict warnv">${tot?'It’s a tie!':'No votes yet.'} <span class="small">Teacher: choose the decision (Choose) or reopen the poll.</span></div>`):''}
      <div class="row mt2 tonly" style="justify-content:center">${cl?`<button class="btn sm ghost" id="pReopen">↺ Reopen poll</button>`:`<button class="btn gold" id="pClose">🔒 Close poll & show results</button>`}<button class="btn sm ghost" id="pReset">⟲ Reset poll</button>${LIVE.on?`<span class="small">${ph} phone vote${ph===1?'':'s'}</span>`:''}</div>
      ${cl&&E?`<div class="center mt2"><button class="btn big primary" data-next>🎯 Save the Show — mission ▶</button></div>`:''}</div>`; },
  after(v){ bindVote(v,'poll',L=>{ S.choice.ending=L; save(); draw(); });
    const c=$('#pClose',v); if(c) c.onclick=closePoll; const o=$('#pReopen',v); if(o) o.onclick=reopenPoll; const r=$('#pReset',v); if(r) r.onclick=()=>{ if(confirm('Reset the poll? All votes will be cleared.')) resetPoll(); }; },
  ready(){ return !!S.choice.ending; }, gateMsg:'No decision yet — close the poll (or choose) first. Press Next again to continue anyway',
  live(){ const cl=S.poll.closed, E=S.choice.ending; return {kind:'choice', id:'poll', poll:true, closed:cl, q:'What should happen next?', opts:POLL.opts.map(o=>o.t), chosen:cl&&E?LET.indexOf(E):null}; },
  n:{t:'40 с', obj:'Голосування класу. Результат визначає фінал (A — дует, B — Лео сам, C — одна пісня разом). Фінал НЕ показуємо до кінця місії.',
    do:['Без телефонів: рахуйте руки кнопками + / −. З телефонами: кожен учень голосує один раз (повторний голос лише змінює вибір).','Результати приховані, доки ви не натиснете 🔒 Close poll & show results.','Нічия → Choose біля варіанта або ↺ Reopen poll. ⟲ Reset poll — усе з нуля.'],
    ua:'Що має статися далі? A — Сем виступає разом з Лео. B — Лео виступає сам. C — Сем приєднується лише на одну пісню.'} },

{ id:'rooms', sc:6, title:'Breakout rooms', sky:'crew',
  enter(){ ensureGroups(); if(!S.tmr.run) TMR.set(240,true); },
  render(d){ const N=here().length;
    return scn(this)+`<div class="split wl" style="align-items:start"><div>
      <div class="row tonly"><div class="modes" role="group" aria-label="Breakout mode">${[['solo','Solo'],['pairs','Pairs'],['teams','Teams']].map(([k,t])=>`<button data-mode="${k}" class="${S.bo.mode===k?'on':''}">${t}</button>`).join('')}</div><button class="btn xs ghost" id="bShuffle">🔀 Shuffle</button><button class="btn xs ghost" id="bCopy2">📋 Copy for Zoom</button></div>
      <h2 class="h-m mt">${S.bo.mode==='solo'?'Solo mode · everyone makes a plan':S.bo.mode==='pairs'?'Pairs · one plan each':N<=3?'One team · one plan together':'Teams · every member speaks'}</h2>
      <p class="small tonly">Default: Teams (1 → Solo · 2–3 → one team · 4 → 2 + 2 · 5 → 3 + 2 · 6 → 3 + 3). ⇄ moves a student to the next team.</p>
      ${groupsHTML(true)}
      <div class="glass pad mt"><p class="kicker">Breakout instructions</p><ol class="howl">${MISSION.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="small">${esc(MISSION.nowrite)}</p></div>
      <details class="mt" ${Object.keys(S.bo.cards).length?'open':''}><summary class="small" style="cursor:pointer;font-weight:800">📝 Optional plan cards (no typing needed — you can fill them in while they present)</summary><div class="groups">${S.bo.groups.map(planCard).join('')}</div></details></div>
    <div class="glass pad center"><p class="small">Preparation time</p><div class="timerbig" data-clock>${mmss(TMR.left())}</div>
      <div class="row mt tonly" style="justify-content:center"><button class="btn primary" data-tplay>${TMR.run()?'❚❚ Pause':'▶ Start'}</button><button class="btn sm ghost" id="tReset">⟲ Reset</button><button class="btn sm ghost" id="t30">+30 s</button><button class="btn sm ghost" id="t4">4:00</button></div>
      <div class="st3 mt" style="text-align:left"><b style="font-size:20px">SAVE THE SHOW · 3 STEPS</b>${MISSION.steps.map(q=>`<p>${q.e} ${esc(q.q)}</p>`).join('')}<p class="small" style="margin-top:6px">2 expressions + 1 relative clause with a preposition · no writing</p></div>
      ${d.ex?`<div class="example" style="text-align:left"><small class="kicker">EXAMPLE ANSWER</small><p>${hlp(MISSION.sample)}</p></div>`:`<button class="btn sm ghost tonly mt" id="bEx">💡 Example answer</button>`}</div></div>`; },
  after(v,d){ $$('[data-mode]',v).forEach(b=>b.onclick=()=>{ S.bo.modeSet=true; buildGroups(b.dataset.mode); draw(); });
    $$('[data-mv]',v).forEach(b=>b.onclick=()=>{ moveMember(b.dataset.mv); draw(); });
    const sh=$('#bShuffle',v); if(sh) sh.onclick=()=>{ const P=S.students; const ids=here().map(s=>s.id).sort(()=>Math.random()-.5); const order=ids.map(id=>P.find(s=>s.id===id)); S.students=[...order,...P.filter(s=>!ids.includes(s.id))]; buildGroups(S.bo.mode); draw(); };
    const cp=$('#bCopy2',v); if(cp) cp.onclick=()=>copyText(missionText(),'Copied — paste it into the Zoom chat');
    $$('[data-tplay]',v).forEach(b=>b.onclick=()=>TMR.toggle()); $('#tReset',v).onclick=()=>TMR.reset(); $('#t30',v).onclick=()=>TMR.add(30); $('#t4',v).onclick=()=>TMR.set(240);
    const ex=$('#bEx',v); if(ex) ex.onclick=()=>{ d.ex=1; save(); draw(); };
    bindCards(v); },
  reveal(d){ d.ex=1; }, hide(d){ d.ex=0; },
  live(){ return {kind:'group', groups:S.bo.groups.map(g=>({id:g.id, name:g.name, card:S.bo.cards[g.id]||{}, m:g.members.map(sid=>({n:stu(sid)?stu(sid).name:'', r:(ROLES[g.roles[sid]]||ROLES.extra).t, d:(ROLES[g.roles[sid]]||ROLES.extra).does}))})), steps:MISSION.steps.map(q=>q.t+' — '+q.q)}; },
  n:{t:'4 хв підготовки (+ вхід/вихід з кімнат)', obj:'Breakout: план із 3 кроків, щоб допомогти Сему. Командна робота — тут не рахуємо індивідуальні ходи.',
    do:['Solo / Pairs / Teams (за замовчуванням Teams). Ролі: Step 1 · Encourage, Step 2 · Include, Step 3 · Perform, Speaker.','📋 Copy — текст із командами й ролями для чату Zoom. Кімнати в Zoom відкриваєте ви.','Таймер 4:00: Start / Pause / Reset / +30 s. Урок сам не перемикається.','💡 Example answer (або R) — приклад відповіді, схований за замовчуванням.'],
    sample:[MISSION.sample], ua:'1) Обговоріть три питання. 2) Погодьте один план. 3) Оберіть спікера або поділіть презентацію. 4) Поверніться й представте план. Писати не треба.'} },

{ id:'present', sc:6, title:'Team presentations', sky:'crew',
  enter(){ ensureGroups(); TMR.set(45,true); },
  render(){ const G=S.bo.groups, i=Math.min(S.bo.cur||0,G.length-1), g=G[i]||{id:'-',name:'—',members:[],roles:{}}, c=S.bo.cards[g.id]||{}, pr=S.bo.pres[g.id]||{};
    const by=k=>{ const sid=g.members.find(m=>{ const r=g.roles[m]; return r===k||r==='solo'||(r==='pairA'&&k!=='perf')||(r==='pairB'&&k==='perf'); }); return sid?'🎙 '+esc(sname(sid)):''; };
    return scn(this)+`<div class="row" style="justify-content:space-between"><h2 class="h-l">OUR PLAN TO <span class="grad">SAVE THE SHOW</span></h2><div class="row"><span class="tmr" data-clock>${mmss(TMR.left())}</span><button class="btn xs ghost tonly" data-tplay>${TMR.run()?'❚❚ Pause':'▶ Start'}</button><button class="btn xs ghost tonly" id="pReset">⟲ 0:45</button></div></div>
    <div class="row mt" style="gap:6px">${G.map((x,j)=>`<button class="chip ${j===i?'on':''}" data-g="${j}">${(S.bo.pres[x.id]||{}).done?'✓ ':''}${esc(x.name)}</button>`).join('')}</div>
    <div class="split wl mt" style="align-items:start"><div><div class="pres">
      <p class="kicker">${esc(g.name)} · ${g.members.map(sid=>esc(sname(sid))).join(' · ')}</p>
      <div class="mt">${CARD_F.map(([k,e,l],j)=>`<div class="pline"><span class="ic">${e}</span><span><small class="stepn">STEP ${j+1} · ${esc(MISSION.steps[j].t)}</small><br>${c[k]?esc(c[k]):`<span class="empty">${esc(MISSION.steps[j].q)}</span>`}</span><span class="by">${by(k)}</span></div>`).join('')}</div>
      <div class="row mt tonly"><button class="btn xs ghost" id="pEdit">${pr.edit?'✓ Done editing':'✏️ Type what they say'}</button><button class="btn sm ${pr.done?'ok':''}" id="pDone">${pr.done?'✓ Presented':'Mark as presented'}</button>${G.length>1?`<button class="btn sm" data-gn="${i+1}" ${i>=G.length-1?'disabled':''}>Next team ▶</button>`:''}</div>
      ${pr.edit?`<div class="mt">${planCard(g)}</div>`:''}</div></div>
    <div><p class="small" style="margin:0 0 6px">🎤 Presentation guide (30–45 s)</p><div class="guide">${PRES_GUIDE.map(s=>`<div>${esc(s)}</div>`).join('')}</div>
      <p class="small" style="margin:14px 0 6px">🙋 Optional peer questions</p>${PRES_Q.map(q=>`<div class="qrow" style="padding:8px 14px;margin-top:6px"><div class="qq" style="font-size:clamp(16px,1.3vw,21px)">${esc(q)}</div></div>`).join('')}
    </div></div>`; },
  after(v){ const G=S.bo.groups, i=Math.min(S.bo.cur||0,G.length-1), g=G[i]; if(!g) return; const P=S.bo.pres[g.id]=S.bo.pres[g.id]||{};
    $$('[data-g]',v).forEach(b=>b.onclick=()=>{ S.bo.cur=+b.dataset.g; save(); draw(); });
    $$('[data-gn]',v).forEach(b=>b.onclick=()=>{ P.done=true; S.bo.cur=+b.dataset.gn; TMR.set(45,true); save(); draw(); });
    const dn=$('#pDone',v); if(dn) dn.onclick=()=>{ P.done=!P.done; save(); draw(); };
    const e=$('#pEdit',v); if(e) e.onclick=()=>{ P.edit=!P.edit; save(); draw(); };
    $$('[data-tplay]',v).forEach(b=>b.onclick=()=>TMR.toggle()); const r=$('#pReset',v); if(r) r.onclick=()=>TMR.set(45);
    bindCards(v); },
  ready(){ return S.bo.groups.every(g=>(S.bo.pres[g.id]||{}).done); }, gateMsg:'Not every team is marked as presented — press Next again to continue anyway',
  live(){ const G=S.bo.groups, g=G[Math.min(S.bo.cur||0,G.length-1)]; return g?{kind:'msg', e:'🎤', t:g.name+' is presenting. Listen — you can ask one question!'}:null; },
  n:{t:'2 хв (30–45 с на команду)', obj:'Кожна команда презентує план. Кожен учень говорить свою частину (🎙).', do:['✏️ — за бажанням впишіть, що кажуть учні (з’явиться на екрані). Mark as presented / Next team.','Рахуйте: 2 вирази + 1 relative clause з прийменником.','Peer questions — необов’язково.'], follow:PRES_Q, ua:'Наш план врятувати шоу… Спершу ми скажемо Сему… Потім Лео й музиканти мають… Нарешті, під час першої пісні…'} },

{ id:'approved', sc:6, title:'Plan approved', sky:'crew',

function confetti(){

/* ---------- 12 · live room ----------
   Учитель — єдине джерело стану. Захист (як в уроках 13–23):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»: не перемикає сцени,
     не бачить відповідей до Reveal, не змінює присутність інших, не скидає урок;
   • учні надсилають тільки hello / ans / card / react; учитель перевіряє кожне (поточне завдання, межі, довжину,
     для картки команди — що учень справді в цій команді);
   • лише ім’я / нік, жодних інших даних. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const WALLQ = [], NAMES = {};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','📷'];
const studs = ()=> (LIVE.peers||[]).filter(p=>p&&p.role==='student');
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson26-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson26-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l26sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l26sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson26-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson26-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
async function sendSigned(p){
  const body=JSON.stringify(Object.assign({ts:Date.now()},p));
  if(TKEY.ok){ try{ const sig=await TKEY.sign(body); Net.send({t:'sig', body, sig, pk:TKEY.pub}); return; }catch(e){ console.warn(e); } }
  Net.send({t:'raw', body});
}

  else if(task.kind==='msg'){ h+=`<div class="small">Phones show: “${esc(task.t)}”</div>`; }
  $('#dockBody').innerHTML=h;
  $$('[data-addc]',d).forEach(b=>b.onclick=()=>{ addStudent(b.dataset.addc); toast(b.dataset.addc+' added to the class'); draw(); });
  $$('[data-back]',d).forEach(b=>b.onclick=()=>{ setHere(b.dataset.back,true); draw(); });
}
const baseURL = ()=> location.href.split('?')[0].split('#')[0];
const joinURL = ()=> baseURL()+'?room='+S.room+(TKEY.fp?'&k='+TKEY.fp:'')+'&role=student';
async function startLive(silent){
  const signed=await TKEY.init();
  const kind=await Net.connect({room:S.room, id:S.tid, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); },
    onStatus:()=>{ paintDock(); const ls=$('#lvStatus'); if(ls) ls.innerHTML='Status: '+liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save(); pubState(); draw();
  if(!silent) toast(!signed?'Live room open — but this page can’t sign messages (needs https)':kind==='supabase'?'Live room open — share the link, QR or code':kind==='local'?'Supabase is not reachable — LOCAL DEMO: only tabs in THIS browser can join':'The live room could not start');
  return kind;
}
function stopLive(){ sendSigned({t:'end'}); setTimeout(()=>Net.stop(),300); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); paintDock(); draw(); }
function liveStatus(){
  if(!LIVE.on) return 'not started — the lesson works without phones';
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● live (Supabase Realtime)</span>' : Net.status==='local' ? '<span style="color:var(--gold)">● LOCAL DEMO — not real students: only tabs in THIS browser can join (Supabase not configured or not reachable)</span>' : `<span style="color:var(--gold)">● ${esc(Net.status)}</span>`;
  return `${s} · ${studs().length} joined`;
}
async function openLive(){
  await TKEY.init();
  openModal(`<div class="row"><h2 class="h-m grow">📡 Live classroom</h2><button class="btn sm ghost" data-close aria-label="Close">✕</button></div>
   <p class="small mt">Optional. Students join on their own device with the same first name as in 👥 Class. Their screen shows whose turn it is, lets them vote, see their team and fill in the team card. Answers reach phones only after you reveal them. Without a live room the whole lesson runs on your shared screen.</p>
   <div class="split mt" style="align-items:center"><div><div class="small">Room code</div><div class="dsp" style="font-size:72px">${S.room}</div>
     <div class="small">Teacher key <b style="font-size:22px;color:var(--teal2);letter-spacing:.12em">${shortKey()||'—'}</b> (only for students who type the code)</div>
     <div class="small mt" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div>
     <p class="small mt" style="color:#BFF7DE">🔐 Your messages are signed with a key that never leaves this browser. Student devices obey only this signature — they can’t change scenes, reveal answers or edit attendance.</p></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:center" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?'<button class="btn" id="lvStop">⏹ Stop room</button>':'<button class="btn primary" id="lvStart">▶ Start live room</button>'}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--gold)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → only a local demo is possible.</p>'}
   ${canSign()?'':'<p class="small mt" style="color:var(--gold)">This page is not on https, so messages can’t be signed. Open it from GitHub Pages for the live room.</p>'}`);
  $('[data-close]','#modalBox').onclick=closeModal;
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ stopLive(); openLive(); };
  $('#lvCopy').onclick=()=>copyText(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 13 · student app (?room=1234&k=…&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student'); document.body.dataset.sky='day';
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6), key=(qs.get('k')||'').replace(/[^0-9a-f]/gi,'').slice(0,20).toLowerCase();
  let st=null, name='', avatar=AVATARS[0], sent={}, taskKey='', trust=null, lastTs=0, verified=false;
  try{ name=localStorage.getItem('l26name')||''; avatar=localStorage.getItem('l26av')||avatar; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':''); $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','👏','✋','💙'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="stu-card"><div class="row" style="gap:6px">${CAST.map(k=>av(k,46)).join('')}</div>
      <h2 class="dsp mt" style="font-size:28px">Join “Backstage Pass” 🎤</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      ${key.length>=6?'':`<label for="tk">Teacher key (6 characters on the screen)</label><input id="tk" maxlength="6" placeholder="e.g. 7F3A9C" autocomplete="off" style="text-transform:uppercase">`}
      <label for="nm">Your first name — the same as on the teacher’s list</label><input id="nm" maxlength="24" value="${esc(name)}" placeholder="e.g. Anna" autocomplete="off">
      <label>Choose an avatar</label><div class="avpick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===avatar?'on':''}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div>
      <p class="small mt">First name only — no surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join</button></div>`;
    $$('[data-av]',B).forEach(b=>b.onclick=()=>{ avatar=b.dataset.av; $$('[data-av]',B).forEach(x=>x.classList.toggle('on',x===b)); });
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,24), tk=$('#tk');
      if(r.length<4) return $('#rc').focus(); if(tk){ const kv=tk.value.replace(/[^0-9a-f]/gi,'').toLowerCase(); if(kv.length<6) return tk.focus(); key=kv; } if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l26name',name); localStorage.setItem('l26av',avatar); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  async function open(m){
    if(!m || !m.body) return null;
    if(m.t==='sig' && canSign() && m.pk && m.sig){
      try{ const pkStr=m.pk.x+'.'+m.pk.y;
        if(!trust || trust.pkStr!==pkStr){ const fp=await fpOf(m.pk); if(!key || !fp.startsWith(key)) return null;
          trust={pkStr, k:await crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x:m.pk.x,y:m.pk.y,ext:true},{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}; }
        const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'}, trust.k, unb64(m.sig), new TextEncoder().encode(m.body));
        if(!ok) return null; verified=true; return JSON.parse(m.body); }catch(e){ return null; }
    }
    if(!canSign() && (m.t==='raw'||m.t==='sig')){ try{ return JSON.parse(m.body); }catch(e){ return null; } }
    return null;
  }
  const keyOf=m=>{ const T=m.task; if(T&&T.kind==='group') return JSON.stringify([m.sc,m.step,T.groups.map(g=>[g.id,g.name,g.m.map(x=>x.n+x.r)])]); return JSON.stringify([m.sc,m.step,T]); };
  const join=async()=>{
    $('#stuRoom').textContent='Room '+room+' · '+avatar+' '+name;
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🎟️</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, av:avatar, onStatus:setConn, onEvent:async raw=>{
      if(!raw.from || raw.from.role!=='teacher') return;
      const m=await open(raw); if(!m || (m.ts||0)<lastTs) return; lastTs=m.ts||lastTs;
      if(m.t==='state'){ document.body.dataset.sky=m.sky||'day'; const k=keyOf(m); st=m; if(k!==taskKey){ taskKey=k; render(); } else { paintT(); paintCard(); } }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet connection and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for the teacher…<br><span class="small">Room ${esc(room)} — are the code and teacher key right? <a href="?join" style="color:var(--teal2)">Change</a></span>`; },7000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">🎟️</div><h2 class="dsp mt" style="font-size:28px">SEE YOU NEXT TIME!</h2><p class="small">Thanks, ${esc(avatar+' '+name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer) t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); };
  const paintCard=()=>{ if(!st||!st.task||st.task.kind!=='group') return; const g=(st.task.groups||[]).find(x=>x.m.some(p=>me(p.n))); if(!g) return;
    $$('[data-cf]',B).forEach(i=>{ if(document.activeElement!==i) i.value=(g.card||{})[i.dataset.cf]||''; }); };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const me=n=>nameKey(n)===nameKey(name);
  const head2=()=>`<div class="stu-prog">${SCENES.map(x=>`<i class="${x.n<st.sc?'d':x.n===st.sc?'c':''}"></i>`).join('')}</div>
      <div class="small" style="margin-bottom:6px;font-weight:800">Scene ${st.sc} · ${esc(st.title||'')} · ${esc(st.step||'')}</div>${verified?'<div class="verif">✓ verified teacher</div>':''}`;
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait">${av('maya',90)}<p class="mt">Hi ${esc(avatar+' '+name)}! Waiting for the teacher…</p></div>`; return; }
    const T=st.task, hd=head2();
    if(!T){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Read, listen and be ready to speak!</p></div>`; return; }
    if(T.kind==='msg'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T.e||'🎟️')}</div><p><b>${esc(T.t)}</b></p></div>`; return; }
    if(T.kind==='turn'){
      const mine=me(T.who);
      B.innerHTML=hd+`<div class="stu-card ${mine?'myturn':''}"><p class="small">${esc(T.block)} · turn ${Math.min(T.done+1,T.total)} of ${T.total} <span id="stuT"></span></p>
        <p style="font-size:22px;font-weight:800;margin:6px 0">${mine?'🎙 It’s YOUR turn, '+esc(name)+'!':'🎙 '+esc(T.who)+' is answering'}</p>
        <p style="font-size:20px;font-weight:700">${emph(T.prompt)}</p>
        ${T.hint?`<p class="small">💡 ${esc(T.hint)}</p>`:''}
        ${T.ans?`<div class="stu-card" style="background:rgba(91,227,168,.12);border-color:rgba(91,227,168,.5)"><b>${esc(T.ans)}</b></div>`:`<p class="small">${mine?'Say your answer out loud in Zoom.':'Listen — could you help if they get stuck?'}</p>`}</div>`; paintT(); return; }
    const choiceCard=(id,q,opts,chosen,T0)=>{ const my=sent[id], dec=chosen!=null || !!(T0&&T0.closed);
      return `<div class="stu-card"><p style="font-size:20px;font-weight:800">${esc(q)}</p><div class="opts">${opts.map((o,i)=>`<button class="opt ${dec&&chosen===i?'right':my===i?'pick':''}" data-q="${esc(id)}" data-i="${i}" ${dec?'disabled':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T0&&T0.poll ? (dec ? (chosen!=null?`🔒 Poll closed. The crew decided: ${LET[chosen]}. The ending is a secret — watch the main screen!`:'🔒 Poll closed — look at the main screen.') : my!==undefined ? '✓ Vote sent! You can change it until the poll closes.' : 'Tap your choice — one vote per person.') : dec?`Answer: ${LET[chosen]}. Look at the main screen.`:my!==undefined?'✓ Vote sent! You can change it.':'Tap your choice.'}</p></div>`; };
    const bindChoice=()=>$$('[data-q]',B).forEach(b=>b.onclick=()=>{ sent[b.dataset.q]=+b.dataset.i; Net.send({t:'ans', task:b.dataset.q, v:+b.dataset.i}); render(); });
    if(T.kind==='choice'){ B.innerHTML=hd+choiceCard(T.id,T.q,T.opts,T.chosen,T)+(T.quiz&&st.my&&st.my[nameKey(name)]!=null?`<p class="small center">⭐ Your points: <b>${st.my[nameKey(name)]}</b></p>`:''); bindChoice(); return; }
    if(T.kind==='awards'){ B.innerHTML=hd+`<p class="small">Vote for IDEAS — one vote in each category.</p>`+T.cats.map(c=>choiceCard(c.id,c.q,c.opts,null)).join(''); bindChoice(); return; }
    if(T.kind==='group'){
      const g=(T.groups||[]).find(x=>x.m.some(p=>me(p.n)));
      if(g){ const r=g.m.find(p=>me(p.n)), c=g.card||{}; B.innerHTML=hd+`<div class="stu-card myturn"><p class="small">Your team <span id="stuT"></span></p><h2 class="dsp" style="font-size:28px">${esc(g.name)}</h2>
          <p style="font-size:20px;font-weight:800;margin-top:10px">You say: ${esc(r.r)}</p><p>${esc(r.d)}</p>
          <p class="small mt">Team: ${g.m.map(p=>esc(p.n)+' ('+esc(p.r)+')').join(', ')}</p></div>
          <div class="stu-card"><b>SAVE THE SHOW 🎸 · 3-step plan</b>${T.steps.map((s,i)=>`<p>${i+1}. ${esc(s)}</p>`).join('')}
          <p class="small">Try to use 2 expressions + 1 relative clause with a preposition. Optional team card — your team sees it:</p>${CARD_F.map(([k,e,l])=>`<label for="cf${k}">${e} ${l}</label><input id="cf${k}" data-cf="${k}" maxlength="60" value="${esc(c[k]||'')}" placeholder="optional">`).join('')}</div>`;
        $$('[data-cf]',B).forEach(i=>{ let t=null; i.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>Net.send({t:'card', g:g.id, f:i.dataset.cf, v:i.value.slice(0,60)}),400); }; }); }
      else B.innerHTML=hd+`<div class="stu-card"><p><b>Teams</b> <span id="stuT"></span></p>${(T.groups||[]).map(x=>`<p><b>${esc(x.name)}</b>: ${x.m.map(p=>esc(p.n)).join(', ')}</p>`).join('')}<p class="small">Can’t find your name? Ask your teacher — use the same name as on their list.</p></div>`;
      paintT(); return; }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) return closeModal(); if(!$('#embed').classList.contains('hidden')) return closeEmbed(); if(S.sheet.open && !$('#sheet').classList.contains('hidden')){ if(S.sheet.pres){ S.sheet.pres=false; } else S.sheet.open=false; save(); paintSheet(); pubState(); return; } if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  if(S.sheet.open && !$('#sheet').classList.contains('hidden')) return;
  if(!$('#embed').classList.contains('hidden')) return;
  const tag=document.activeElement && document.activeElement.tagName, k=e.key.toLowerCase();
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A' && tag!=='SUMMARY')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='r') reveal(); else if(k==='h') hideAns(); else if(k==='i') hint();
  else if(k==='d'){ const s=cur(); if(!S.gz && s.block && tbs(s.block).cur && (!BLOCKS[s.block].scoped || taskOf(s.block,tbs(s.block).cur.tid).part===s.scope)) markDone(s.block,'ok'); }
  else if(k==='n') openNav(); else if(k==='c') openCrew(); else if(k==='w') toggleNotes(); else if(k==='f') present();
  else if(k==='g') S.gz?closeGZ():openGZ('home');
});
if(ROLE==='student'){ buildBackdrop(); studentApp(); }
else if(ROLE==='screen'){ buildBackdrop(); buildRail(); screenApp(); }
else {
  buildBackdrop(); applyAnim(); buildRail();
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bHint').onclick=hint;
  $('#bWs').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false); $('#bNav').onclick=openNav; $('#bCrew').onclick=openCrew;
  $$('#notes [data-nt]').forEach(b=>b.onclick=()=>{ S.nt=b.dataset.nt; save(); paintNotes(); });
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#bScreen').onclick=openScreen; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#bQuick').onclick=()=>setQuick(!S.core); $('#clock').onclick=()=>CLOCK.toggle();
  $('#bNotes2').onclick=()=>toggleNotes(); $('#embedX').onclick=closeEmbed; $('#embedNew').href=CFG.ALIAS_URL;
  const c=scrChan(); if(c) c.onmessage=e=>{ if(e.data&&e.data.t==='hello') pushScreen(); };
  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  if(S.ws && innerWidth>=1280){ $('#notes').classList.add('on'); document.body.classList.add('ws'); $('#notes').setAttribute('aria-hidden','false'); }
  draw();
  if(S.live) startLive(true);
}
