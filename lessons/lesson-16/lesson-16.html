.arrow svg{width:100%; height:60px}
.wif{font-size:clamp(23px,2.6vw,32px); font-weight:800; line-height:1.35; padding:20px 24px; border-radius:22px; background:rgba(124,77,255,.14); border:1px solid rgba(124,77,255,.5)}
.wif .p{color:var(--yellow)} .wif .n{color:var(--teal)}
.form{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; font-family:var(--mono); font-weight:700; font-size:clamp(16px,1.7vw,20px)}
.form span{padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.07); border:1px solid var(--edge2)}
.form .p{border-color:var(--yellow); color:var(--yellow)} .form .n{border-color:var(--teal); color:var(--teal)}
.dq{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.dq .qi .q{font-size:20px}

/* gap sentences */
.gap-s{font-size:clamp(24px,2.8vw,34px); font-weight:800; line-height:1.45}
.clause{display:inline; padding:2px 4px; border-radius:8px; transition:.3s}
.clause.p{background:rgba(255,212,71,.14); box-shadow:inset 0 -3px 0 var(--yellow)}
.clause.n{background:rgba(34,240,213,.12); box-shadow:inset 0 -3px 0 var(--teal)}
.clause sup{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; margin-left:4px; vertical-align:super; padding:1px 6px; border-radius:6px}
.clause.p sup{background:var(--yellow); color:#1A1400} .clause.n sup{background:var(--teal); color:#04121A}
.blank{display:inline-block; min-width:5.5em; border-bottom:4px solid var(--pink); text-align:center; color:var(--pink)}
.blank.ok{border-color:var(--ok); color:var(--ok)}
.cue{font-family:var(--mono); font-size:.6em; color:var(--muted); font-weight:700}
.try{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap}
.try input{flex:1; min-width:220px; padding:14px 18px; font-size:21px; font-weight:700; border-radius:14px; background:rgba(0,0,0,.25); border:1.5px solid var(--edge2)}
.verdict{margin-top:10px; font-weight:800; font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}

/* class wall */
.wall{margin-top:20px}
.wall h4{font-family:var(--mono); font-size:12.5px; letter-spacing:.16em; color:var(--muted); font-weight:700; margin-bottom:10px}
.wall .list{display:flex; flex-wrap:wrap; gap:10px}
.wall .it{padding:10px 14px; border-radius:16px 16px 16px 6px; background:#1E2566; border:1px solid var(--edge); font-size:18px; font-weight:600; animation:popIn .35s both}
.wall .it small{display:block; font-size:12.5px; color:var(--muted); font-weight:800}

/* mission */
.mission{padding:34px 36px; border-radius:32px; background:linear-gradient(145deg,rgba(255,79,163,.16),rgba(124,77,255,.18) 50%,rgba(34,240,213,.12)); border:1.5px solid rgba(255,255,255,.28); box-shadow:var(--shadow)}
.mission h2{font-size:clamp(30px,3.4vw,46px)}
.mission ol{margin:18px 0; padding-left:0; list-style:none; display:grid; gap:12px; counter-reset:m}
.mission li{counter-increment:m; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start; font-size:clamp(20px,2.1vw,25px); font-weight:700; line-height:1.35}
.mission li::before{content:counter(m); width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--yellow); color:#1A1400; font-family:"Anton",Impact,sans-serif; font-size:24px}
.mission li b{color:var(--yellow)}
.mission .foot{font-size:20px; font-weight:700; color:#E6E0FF}
.timer{display:flex; flex-direction:column; align-items:center; gap:12px; padding:22px; border-radius:28px; background:rgba(0,0,0,.28); border:1px solid var(--edge2)}
.timer .clock{font-family:"Anton",Impact,sans-serif; font-size:clamp(70px,9vw,120px); line-height:1; letter-spacing:.02em}
.timer .clock.end{color:var(--pink); animation:flick .6s infinite}
.timer .tbar{width:100%; height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.timer .tbar i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--yellow),var(--pink)); width:100%; transition:width 1s linear}
.teams{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.team{border-radius:22px; padding:18px; background:var(--glass); border:1px solid var(--edge)}
.team .h{display:flex; gap:10px; align-items:center; font-weight:800; font-size:19px; margin-bottom:10px}
.team label{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); margin-top:8px}
.team textarea{width:100%; resize:vertical; min-height:52px; padding:10px 12px; border-radius:12px; background:rgba(0,0,0,.25); border:1px solid var(--edge2); font-size:16px}
.spot{padding:30px; border-radius:30px; background:linear-gradient(160deg,rgba(124,77,255,.2),rgba(34,240,213,.08)); border:1.5px solid rgba(255,255,255,.25)}
.spot .line{display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:start; padding:14px 0; border-bottom:1px dashed var(--edge2)}
.spot .line:last-child{border-bottom:0}
.spot .line b{font-family:var(--mono); font-size:13px; letter-spacing:.14em; padding-top:8px}
.spot .line div{font-size:clamp(21px,2.3vw,28px); font-weight:700; line-height:1.35}
.spot .line textarea{width:100%; background:transparent; border:1px dashed transparent; border-radius:12px; font-size:clamp(21px,2.3vw,28px); font-weight:700; line-height:1.35; resize:none; padding:4px 8px}
.spot .line textarea:hover,.spot .line textarea:focus{border-color:var(--edge2); background:rgba(0,0,0,.2)}
.reacts3{display:flex; gap:12px; flex-wrap:wrap}
.reacts3 .btn{font-size:20px}

/* ending */
.story-end .msg{animation:none}
.final{text-align:center; padding:40px 30px; border-radius:34px; background:linear-gradient(145deg,rgba(34,240,213,.16),rgba(124,77,255,.2),rgba(255,79,163,.16)); border:1.5px solid rgba(255,255,255,.3)}
.final .big{max-width:900px; margin:10px auto}
.badge{display:inline-flex; gap:10px; align-items:center; font-family:"Anton",Impact,sans-serif; font-size:clamp(34px,4vw,54px); letter-spacing:.03em; background:linear-gradient(90deg,var(--teal),var(--yellow),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent}

/* teacher panel */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(440px,94vw); z-index:40; background:#0B0F2E; border-left:1px solid var(--edge2);
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; box-shadow:-30px 0 60px -20px #000}
#teacher.on{transform:none}
#teacher .thd{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--edge)}
#teacher .thd b{font-family:"Anton",Impact,sans-serif; font-weight:400; letter-spacing:.08em; font-size:20px}
#tBody{overflow:auto; padding:16px; display:grid; gap:14px; align-content:start; font-size:16px}
.tsec{padding:14px; border-radius:16px; background:var(--glass); border:1px solid var(--edge)}
.tsec h5{margin:0 0 8px; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--teal); font-weight:700; text-transform:uppercase}
.tsec .say{font-size:17px; font-weight:700; color:#fff; border-left:3px solid var(--pink); padding-left:10px}
.tsec ul{margin:0; padding-left:18px} .tsec li{margin:3px 0}
.tmap{display:grid; gap:4px}
.tmap button{display:flex; gap:8px; align-items:center; text-align:left; padding:7px 10px; border-radius:10px; font-size:14.5px; border:1px solid transparent}
.tmap button:hover{background:var(--glass2)}
.tmap button.cur{border-color:var(--pink); background:rgba(255,79,163,.12)}
.tmap button.skip{opacity:.4; text-decoration:line-through}
.tmap .sn{font-family:var(--mono); color:var(--teal); font-size:12px; font-weight:700; margin-top:6px; letter-spacing:.1em}
.tmap .m{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted)}
.tgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tgrid .btn{width:100%}
.sw{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0}
.sw button{width:54px; height:30px; border-radius:99px; background:rgba(255,255,255,.14); position:relative; transition:.2s; flex:0 0 54px}
.sw button::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s}
.sw button.on{background:var(--teal)} .sw button.on::after{left:27px}

/* live dock */
#dock{position:fixed; right:18px; bottom:84px; z-index:30; width:360px; max-height:56vh; display:none; flex-direction:column; border-radius:20px; overflow:hidden;
  background:rgba(11,15,46,.97); border:1px solid var(--edge2); box-shadow:var(--shadow)}
#dock.on{display:flex}
#dock .dh{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--edge); font-size:15px}
#dock .db{overflow:auto; padding:12px; display:grid; gap:8px; font-size:15px}
#dock.min .db{display:none}
.led{width:11px; height:11px; border-radius:50%; background:var(--faint); flex:0 0 11px}
.led.on{background:var(--ok); box-shadow:0 0 10px var(--ok)}
.led.warn{background:var(--yellow); box-shadow:0 0 10px var(--yellow)}
.led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:5px}
.names span{padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.08); font-size:13px}
.wallit{display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:center; padding:8px; border-radius:12px; background:rgba(255,255,255,.05)}
.wallit p{margin:0; font-size:15px} .wallit small{display:block; color:var(--muted); font-size:12px}
.wallit .okm{color:var(--ok); font-weight:800} .wallit .nom{color:var(--bad); font-weight:800}

/* modal, toast, floats */
#modal{position:fixed; inset:0; z-index:60; background:rgba(3,4,18,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:18px}
#modal .box{width:min(760px,100%); max-height:88vh; overflow:auto; background:#0E1238; border:1px solid var(--edge2); border-radius:26px; padding:26px; box-shadow:var(--shadow); animation:popIn .3s both}
#toast{position:fixed; left:50%; top:76px; transform:translate(-50%,-20px); z-index:70; padding:12px 18px; border-radius:14px; background:#1B2166; border:1px solid var(--edge2); font-weight:700; opacity:0; pointer-events:none; transition:.25s}
#toast.on{opacity:1; transform:translate(-50%,0)}
#reacts{position:fixed; right:30px; bottom:90px; z-index:35; width:120px; height:60vh; pointer-events:none}
#reacts span{position:absolute; bottom:0; font-size:44px; animation:floatUp 3s ease-out forwards}
@keyframes floatUp{0%{opacity:0; transform:translateY(0) scale(.6)}15%{opacity:1; transform:translateY(-40px) scale(1.1)}100%{opacity:0; transform:translateY(-55vh) scale(1)}}
#confetti{position:fixed; inset:0; z-index:50; pointer-events:none}
#wm{position:fixed; left:18px; bottom:78px; z-index:2; pointer-events:none; opacity:.4}
#wm img{height:28px; display:block}

/* student app */
#student{display:none; position:fixed; inset:0; z-index:80; background:var(--ink); flex-direction:column}
body.student #student{display:flex}
body.student #app, body.student #wm{display:none}
.stu-top{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--edge); background:rgba(255,255,255,.03)}
.stu-top b{font-family:"Anton",Impact,sans-serif; font-weight:400; letter-spacing:.06em; font-size:18px}
.stu-body{flex:1; overflow:auto; padding:18px 16px 30px; max-width:560px; width:100%; margin:0 auto; position:relative; z-index:1}
.stu-foot{display:flex; justify-content:space-around; padding:10px; border-top:1px solid var(--edge); background:rgba(255,255,255,.03)}
.stu-foot button{font-size:28px; padding:6px 10px; border-radius:12px}
.stu-card{padding:22px}
.stu-card input,.stu-card textarea{width:100%; margin-top:8px; padding:14px 16px; font-size:19px; border-radius:14px; background:rgba(0,0,0,.3); border:1.5px solid var(--edge2)}
.stu-card textarea{min-height:76px; resize:vertical}
.stu-card label{display:block; margin-top:14px; font-weight:800; font-size:15px; color:var(--lilac)}
.stu-wait{text-align:center; padding:50px 10px}
.stu-wait .bigi{font-size:64px}
.opts{display:grid; gap:10px; margin-top:12px}
.opt{display:flex; gap:12px; align-items:center; padding:14px 16px; border-radius:16px; background:var(--glass); border:1.5px solid var(--edge2); text-align:left; font-size:18px; font-weight:700}
.opt .L{flex:0 0 34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.1); font-family:var(--mono)}
.opt.sel{border-color:var(--teal); background:rgba(34,240,213,.12)}
.opt.right{border-color:var(--ok); background:rgba(67,229,160,.14)}
.connst{font-size:13px; font-weight:700}

/* ─── illustrations ─── */
.shead .thumb{position:relative; width:96px; height:96px; flex:0 0 96px; border-radius:24px; overflow:hidden; box-shadow:0 0 0 2px rgba(255,255,255,.2), 0 14px 30px -12px #000}
.shead .thumb img{width:100%; height:100%; object-fit:cover}
.shead .thumb span{position:absolute; right:3px; bottom:0; font-size:30px; filter:drop-shadow(0 2px 4px #000)}
.illo{display:block; width:100%; height:auto; border-radius:24px; border:1px solid var(--edge2); box-shadow:var(--shadow); background:#0A0D28}
.illo.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px) rotate(-.4deg)}}
.banwrap{overflow:hidden; border-radius:24px; border:1px solid var(--edge2); box-shadow:var(--shadow); margin-bottom:18px}
.banwrap img{display:block; width:100%; max-height:300px; object-fit:cover}
.banwrap.kb img{animation:kenburns 7s ease-out both}
@keyframes kenburns{from{transform:scale(1.12) translateX(-2%)} to{transform:none}}
.qsplit{display:grid; grid-template-columns:1.2fr .8fr; gap:24px; align-items:center}
.qsplit>*{min-width:0}
.cap{font-size:14.5px; color:var(--muted); margin-top:8px; text-align:center}
.evc.withimg{grid-template-columns:auto 1fr 180px}
.evc .eimg{width:180px; border-radius:18px; border:1px solid var(--edge2); align-self:center}
.ending-img{filter:grayscale(1) brightness(.7)}
.ending-img.color{filter:none}
.ending-img.color.fx{animation:colorIn 1.4s ease both}
@keyframes colorIn{from{filter:grayscale(1) brightness(.7)} to{filter:none}}

/* ─── motion ─── */
#amb{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#amb span{position:absolute; bottom:-70px; opacity:0; animation:ambUp linear infinite}
#amb.down span{bottom:auto; top:-70px; animation-name:ambDown}
@keyframes ambUp{0%{transform:translateY(0) rotate(0); opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-118vh) rotate(var(--r)); opacity:0}}
@keyframes ambDown{0%{transform:translateY(0) rotate(0); opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(118vh) rotate(var(--r)); opacity:0}}
#scard{position:fixed; inset:0; z-index:45; display:grid; place-items:center; pointer-events:none; opacity:0; visibility:hidden}
#scard::before{content:""; position:absolute; inset:0; background:rgba(5,7,24,.74); backdrop-filter:blur(6px)}
#scard .in{position:relative; text-align:center; padding:0 20px}
#scard img{width:min(560px,82vw); border-radius:28px; box-shadow:0 30px 80px -20px #000, 0 0 0 2px rgba(255,255,255,.22)}
#scard .k{font-family:var(--mono); letter-spacing:.2em; color:var(--teal); margin-top:18px; font-size:15px}
#scard h2{font-family:"Anton",Impact,sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(34px,5vw,64px); margin-top:4px; text-shadow:0 6px 30px #000}
#scard.on{visibility:visible; animation:scardIn 1.3s cubic-bezier(.2,.8,.2,1) forwards}
#scard.on .in{animation:scardScale 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes scardIn{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0; visibility:hidden}}
@keyframes scardScale{0%{transform:scale(.86) translateY(24px)}22%{transform:none}100%{transform:scale(1.05)}}
.phone.buzz{animation:buzz 2.6s ease-in-out infinite}
@keyframes buzz{0%,84%,100%{transform:none}86%{transform:rotate(-1.6deg)}88%{transform:rotate(1.6deg)}90%{transform:rotate(-1.4deg)}92%{transform:rotate(1deg)}94%{transform:none}}
.notif b.tick{display:inline-block; animation:tick .35s}
@keyframes tick{50%{transform:scale(1.25); color:#fff}}
.tgone{animation:tgone .5s ease forwards; overflow:hidden}
@keyframes tgone{0%,80%{opacity:1; max-height:90px}100%{opacity:0; max-height:0; margin:0}}
.late{animation:popIn .4s .5s cubic-bezier(.2,.9,.3,1.3) both}
.popt.right.fx{animation:rightPulse .9s ease}
@keyframes rightPulse{30%{transform:scale(1.04); box-shadow:0 0 0 7px rgba(67,229,160,.3), 0 0 40px rgba(67,229,160,.4)}100%{transform:none}}
.popt.wrongpick.fx,.verdict.no.fx{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.stamp.fx{animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stampIn{0%{opacity:0; transform:scale(1.5) rotate(-5deg)}100%{opacity:1; transform:none}}
.verdict.ok.fx{animation:bounce .5s}
@keyframes bounce{40%{transform:translateY(-8px) scale(1.06)}70%{transform:translateY(2px)}}
.spark{position:fixed; z-index:55; pointer-events:none; font-size:28px; animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(.4); opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r)); opacity:0}}
.evc.new{animation:paperIn .6s cubic-bezier(.2,.8,.2,1) both; position:relative; overflow:hidden}
.evc.new::after{content:""; position:absolute; top:0; bottom:0; width:28%; left:-30%; pointer-events:none; background:linear-gradient(90deg,transparent,rgba(34,240,213,.28),transparent); animation:scan 1.2s .4s ease-in-out both}
@keyframes paperIn{from{opacity:0; transform:translateX(70px) rotate(2deg)} to{opacity:1; transform:none}}
@keyframes scan{from{left:-30%} to{left:110%}}
.vid{position:relative}
.vid.unlock{animation:unlock 1.1s ease both}
.vid .ub{position:absolute; top:8px; right:10px; font-family:var(--mono); font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:var(--teal); color:#04121A; animation:popIn .4s .3s both}
@keyframes unlock{0%{transform:scale(.96); filter:grayscale(.8)}45%{transform:scale(1.04); box-shadow:0 0 50px rgba(34,240,213,.6)}100%{transform:none}}
.arrow path{animation:dashflow 1.1s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-26}}
.node.on.fx{animation:nodePop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes nodePop{40%{transform:scale(1.05)}}
.wif{background-size:200% 100%}
.wif.fx{animation:popIn .4s both, shimmer 1.6s .3s ease}
@keyframes shimmer{0%{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%); background-position:120% 0}100%{background-image:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.14) 50%,transparent 70%); background-position:-120% 0}}
.blank.ok.fx{animation:flip .6s both}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.stagger>*{animation:popIn .45s both}
.stagger>*:nth-child(2){animation-delay:.12s}.stagger>*:nth-child(3){animation-delay:.24s}.stagger>*:nth-child(4){animation-delay:.36s}
.ring{position:relative; width:min(250px,64vw); aspect-ratio:1}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:10}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringG); stroke-linecap:round; transition:stroke-dashoffset 1s linear}
.ring .clock{position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(54px,6vw,72px)}
.ring.hurry{animation:hurry 1s ease-in-out infinite}
.ring.hurry .fg{stroke:var(--pink)}
@keyframes hurry{50%{transform:scale(1.035); filter:drop-shadow(0 0 18px rgba(255,79,163,.6))}}
.spot{overflow:hidden}
.spot.fx::before{content:""; position:absolute; top:-20%; bottom:-20%; width:35%; left:-40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent); animation:scan 1s ease both; pointer-events:none}
.badge.fx{animation:slam .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{opacity:0; transform:scale(2.4) rotate(-8deg)}60%{opacity:1; transform:scale(.94)}100%{transform:none}}
#tempTxt{display:inline-block}
#tempTxt.bump{animation:tick .5s}
.stu-img{width:100%; border-radius:18px; border:1px solid var(--edge2); margin-bottom:12px; animation:floaty 6s ease-in-out infinite}

/* responsive */
@media (max-width:980px){
  .two,.two.wide-l{grid-template-columns:1fr}
  .cast{grid-template-columns:1fr 1fr}
  .meter{max-width:none}
  .tools .lb{display:none}
  .navr .lb{display:none}
  .dq{grid-template-columns:1fr}
  .qsplit{grid-template-columns:1fr}
  .qsplit .illo{max-width:520px; margin:0 auto}

/* ---------- 5 · components ---------- */
function evText(s, withGloss){
  return esc(s)
    .replace(/\{v\|([^}]*)\}/g,'<mark class="v">$1</mark>')
    .replace(/\{g\|([^|}]*)\|([^}]*)\}/g,'<span class="gl" title="$2">$1</span>');
}
const evPlain = s => s.replace(/\{v\|([^}]*)\}/g,'$1').replace(/\{g\|([^|}]*)\|[^}]*\}/g,'$1');
function wif(s){ return esc(s).replace(/\{(p|n)\|([^}]*)\}/g,'<span class="$1">$2</span>'); }

function sceneHead(st){
  const sc=SCENES[st.sc-1];
  return `<div class="shead"><div class="thumb" aria-hidden="true"><img src="${sc.img}" alt="" onerror="this.remove()"><span>${sc.e}</span></div><div class="grow">
    <div class="kick">Scene ${sc.n} of ${SCENES.length} · ≈ ${sc.min} min</div>
    <h1 class="dsp ${sc.t.length>22?'long':''}">${esc(sc.t)}</h1>
    ${(st.opt||st.chip)?`<div class="meta">${st.opt?'<span class="tag opt">Optional · Skip if short on time</span>':''}${st.chip?`<span class="tag">${esc(st.chip)}</span>`:''}</div>`:''}
  </div></div>`;
}
/* poll with live counts + hands the teacher taps */
function counts(id,n){ const out=Array(n).fill(0); Object.values(S.lv[id]||{}).forEach(v=>{ if(Number.isInteger(v)&&v>=0&&v<n) out[v]++; }); const t=S.taps[id]||[]; return out.map((c,i)=>c+(t[i]||0)); }
function poll(id, q, opts, o={}){
  const n=counts(id,opts.length), tot=n.reduce((a,b)=>a+b,0);
  return `<div class="card ${o.cls||''}"><div class="mid">${esc(q)}</div>
    <div class="poll">${opts.map((op,i)=>{
      const pct=tot?Math.round(n[i]/tot*100):0, right=o.correct===i&&o.shown, dim=o.shown&&o.correct!=null&&o.correct!==i;
      return `<button class="popt ${right?'right':''} ${dim?'dim':''}" data-tap="${id}" data-i="${i}" title="Tap to count a hand">
        <span class="fill" style="width:${pct}%"></span><span class="L">${LET[i]}</span><span>${esc(op)}</span><span class="n">${n[i]?n[i]:''}</span></button>`; }).join('')}</div>
    <div class="row mt" style="margin-top:12px"><span class="small grow">${o.note||'Tap an option to count hands · phones in Live mode add their votes.'}</span>
      ${tot?`<button class="btn sm ghost" data-clr="${id}">Clear votes</button>`:''}</div></div>`;
}
function bindPoll(root){
  $$('[data-tap]',root).forEach(b=>b.onclick=()=>{ const id=b.dataset.tap, i=+b.dataset.i; const t=S.taps[id]=S.taps[id]||[]; t[i]=(t[i]||0)+1; SFX.pop(); save(); draw(); });
  $$('[data-clr]',root).forEach(b=>b.onclick=()=>{ const id=b.dataset.clr; delete S.taps[id]; delete S.lv[id]; save(); draw(); });
}
function wallHTML(task){
  const all=(S.wall[task]||[]).filter(w=>w.shown);
  if(!all.length) return LIVE.on?`<div class="wall"><h4>CLASS ANSWERS</h4><div class="small">Answers from phones appear in the 📡 Live panel — press <b>Show</b> to put one here.</div></div>`:'';
  return `<div class="wall"><h4>CLASS ANSWERS</h4><div class="list">${all.map(w=>`<div class="it"><small>${esc(w.by)}</small>${esc(w.text)}</div>`).join('')}</div></div>`;
}
const startsWith = ph => ph.split(' ').map(w=>w[0]+'_'.repeat(Math.max(1,w.length-1))).join(' ');
/* one-shot animation flags: set by an action, read by render, cleared after draw */
const FX = new Set();
const fx = k => FX.has(k) ? 'fx' : '';
let LOOPS = [];
function loop(fn, ms){ LOOPS.push(setInterval(fn, ms)); }
function burst(el, set=['✨','⭐','💥','✨']){
  if(!el || REDUCED) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.className='spark'; s.textContent=set[i%set.length];
    const a=Math.random()*Math.PI*2, d=60+Math.random()*90;
    s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+r.height/2)+'px';
    s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',Math.sin(a)*d+'px'); s.style.setProperty('--r',(Math.random()*120-60)+'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(),950); }
}
const illo = (src, cls='', alt='') => `<img class="illo ${cls}" src="${src}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">`;
function hintBox(d, html){ return d.hint?`<div class="hintbox pop-in">${html}</div>`:''; }
function starters(list){ return `<div class="starters">${list.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`; }

/* answer checking for typed gaps: case, apostrophes, spaces and full sentences are fine */
const norm = s => String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();
function checkGap(g, val){ const n=' '+norm(val)+' '; if(n.trim()==='') return null; return g.accept.some(a=>n.includes(' '+norm(a)+' ')); }

/* ---------- 7 · navigation, timer, clock ---------- */
const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt); };
const cur = ()=> STEPS[S.i] || STEPS[0];
const nparts = s => s.parts ? s.parts() : 1;
let CUR = null;

function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; s.onPart&&s.onPart(d); FX.add('part'); save(); draw(true,true); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else toast('That’s the end of the lesson 🎉');
}
function back(){
  const s=cur(), d=sd(s.id);
  if((d.p||0)>0){ d.p--; s.onPart&&s.onPart(d); save(); draw(true,true); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--;
  if(k>=0) go(k);
}
function go(k){ const prev=cur().sc; S.i=k; clockStart(); FX.add('enter'); save(); if(STEPS[k].sc>prev) sceneCard(STEPS[k].sc); draw(true); $('#stage').scrollTop=0; }
/* short, non-blocking title card when a new scene starts (clicks go straight through) */
function sceneCard(n){
  if(REDUCED || ROLE!=='teacher') return; const sc=SCENES[n-1], el=$('#scard');
  el.innerHTML=`<div class="in"><img src="${sc.img}" alt="" onerror="this.remove()"><div class="k">SCENE ${sc.n} OF ${SCENES.length}</div><h2>${sc.e} ${esc(sc.t)}</h2></div>`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  SFX.tone(420,.18,'sine',.05); SFX.tone(840,.22,'sine',.04,.12);
}
/* ambient particles follow the chat temperature */
let AMB='';
function paintAmb(t){
  const band = t>=70?'hot':t>=35?'warm':t>0?'cool':'calm'; if(band===AMB) return; AMB=band;
  const box=$('#amb'); if(REDUCED){ box.innerHTML=''; return; }
  const set={hot:['🔥','😡','💬','⚡','🔥','😤'], warm:['💬','🔍','🤔','📄','💬'], cool:['💛','💬','✨','🔍'], calm:['❄️','💛','❄️','✨']}[band];
  box.classList.toggle('down', band==='calm');
  box.innerHTML=Array.from({length:16},(_,i)=>`<span style="left:${Math.round(Math.random()*96)}%;font-size:${20+Math.round(Math.random()*26)}px;--o:${(.05+Math.random()*.07).toFixed(2)};--r:${Math.round(Math.random()*120-60)}deg;animation-duration:${14+Math.round(Math.random()*14)}s;animation-delay:-${Math.round(Math.random()*20)}s">${set[i%set.length]}</span>`).join('');
}
let METER=null;
function paintMeter(t){
  const el=$('#tempTxt'); const ic = v => (v>=70?'🔥 ':v>=35?'🌡️ ':v>0?'🌤️ ':'❄️ ')+(v>0?v+'°':'calm');
  if(METER===null || REDUCED){ METER=t; el.textContent=ic(t); return; }
  if(METER===t) return; const from=METER, t0=performance.now(); METER=t;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  (function f(now){ const k=Math.min(1,(now-t0)/800), v=Math.round(from+(t-from)*(1-Math.pow(1-k,3))); el.textContent=ic(v); if(k<1 && METER===t) requestAnimationFrame(f); })(t0);
}
function nextNonOpt(from){ let k=from; while(k<STEPS.length && (STEPS[k].opt || !visible(k))) k++; return k; }
function canSkip(){ const s=cur(); if(s.opt) return true; let k=S.i+1; while(k<STEPS.length && !visible(k)) k++; return !!(STEPS[k] && STEPS[k].opt && STEPS[k].sc===s.sc); }
function skipOpt(){ const s=cur(); const k=nextNonOpt(s.opt?S.i:S.i+1); if(k<STEPS.length){ go(k); toast('Optional task skipped'); } }
function stepTemp(){ const s=cur(); if(s.id==='final') return 0; if(s.id==='ending'){ const p=sd('ending').p||0; return Math.round(14*(1-p/(ENDING.length-1))); } return SCENES[s.sc-1].temp; }

/* breakout timer: keeps running across screens and page refreshes */
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  start(){ if(this.left()<=0) S.timer.left=S.timer.total; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  reset(){ S.timer.left=S.timer.total; S.timer.endAt=0; save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');
    const show = this.run() || (S.timer.left<S.timer.total && S.timer.left>0) || cur().sc===6;
    chip.classList.toggle('hidden', !show || ROLE==='student');
    $('#tchipT').textContent=mmss(l); chip.classList.toggle('warn', this.run());
    const bc=$('#bigClock'), rf=$('#ringFg'), rg=$('#ring'); if(bc){ bc.textContent=mmss(l); bc.classList.toggle('end',l<=0); }
    if(rf) rf.style.strokeDashoffset=(326.73*(1-l/S.timer.total)).toFixed(1); if(rg) rg.classList.toggle('hurry', this.run() && l<=30 && l>0);
    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.bell(); toast('⏰ Time’s up! Close the breakout rooms.'); pubState(); if(cur().id==='mission'){ draw(false,true); burst($('#ring'),['⏰','🔔','✨']); } }
  }
};
$('#tchip').onclick=()=>{ const k=STEPS.findIndex(s=>s.id==='mission'); if(S.i!==k) go(k); else { TIMER.run()?TIMER.pause():TIMER.start(); draw(); } };

/* lesson clock for the teacher (starts on the first Continue) */
function clockStart(){ if(!S.clock.start && !S.clock.paused){ S.clock.start=Date.now(); } }
const clockNow = ()=> (S.clock.acc||0) + (S.clock.start? (Date.now()-S.clock.start)/1000 : 0);
function routeMin(core){ let m=0; STEPS.forEach(s=>{ if(core&&s.opt) return; m+= (s.id==='vocab' && (core||S.vquick))?3:s.min; }); return Math.round(m); }

function draw(anim, keepScroll){

  $('#navInfo').innerHTML=`<b>Scene ${sc.n} of ${SCENES.length}</b> · ${esc(sc.t)}${n>1?` · ${p+1}/${n}`:''}${s.opt?' · <span class="opt">optional</span>':''}`;
  $('#dots').innerHTML=SCENES.map(x=>`<button class="${x.n<sc.n?'done':''} ${x.n===sc.n?'cur':''}" data-sc="${x.n}" aria-label="Scene ${x.n}: ${esc(x.t)}" title="Scene ${x.n}: ${esc(x.t)}"></button>`).join('');
  $$('#dots [data-sc]').forEach(b=>b.onclick=()=>{ const k=STEPS.findIndex((x,i)=>x.sc===+b.dataset.sc && visible(i)); if(k>=0) go(k); });

  paintMeter(t); paintAmb(t);

}

/* confetti (no library) */
function confetti(){
  if(REDUCED) return; const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#22F0D5','#FF4FA3','#FFD447','#7C4DFF','#43E5A0'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:4+Math.random()*6, vx:-2+Math.random()*4, vy:2+Math.random()*4, a:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if(++t<220) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
function floatEmoji(e){ if(!/^[\p{Extended_Pictographic}‍️✅]{1,8}$/u.test(e||'')) return; const s=document.createElement('span'); s.textContent=e; s.style.left=Math.random()*70+'px'; $('#reacts').appendChild(s); setTimeout(()=>s.remove(),3100); }

/* ---------- 9 · live room (Supabase Realtime broadcast + presence; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5, 13–15: таблиці не потрібні.
   Учитель — єдине джерело стану: сцену, завдання й таймер надсилає тільки він.
   Учні можуть надіслати лише hello / ans / work / react; правильні відповіді їм не передаються,
   доки вчитель не відкриє їх на головному екрані. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,10);
const LIVE = {on:false, peers:[]};
const WALLQ = [];        // unshown text answers {id, task, sid, text, by, ok}
const NAMES = {};

const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l16sid'); }catch(e){}   // per tab, survives a refresh
    this.me={id:sid || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') try{ sessionStorage.setItem('l16sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson16-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson16-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
const Store = {
  async log(kind, task, sid, value){
    if(!(CFG.SAVE_ANSWERS && Net.sb)) return;
    try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson16-hype', chapter:cur().id, task, kind, student_id:sid, student_name:NAMES[sid]||null, value:String(value).slice(0,500)}); }
    catch(e){ console.warn('Supabase insert failed:', e.message||e); }
  }
};

let pubT=null;
function curTask(){ const c=cur(); try{ return c.live?c.live():null; }catch(e){ return null; } }
function pubState(){
  if(!LIVE.on || ROLE!=='teacher') return;
  clearTimeout(pubT); pubT=setTimeout(()=>{
    const c=cur(), sc=SCENES[c.sc-1];
    Net.send({t:'state', sc:sc.n, title:sc.t, e:sc.e, img:sc.img, task:curTask(), timer:{left:Math.ceil(TIMER.left()), run:TIMER.run()}});
  },120);
}
setInterval(()=>{ if(LIVE.on) pubState(); },6000);
setInterval(()=>{ if(ROLE==='teacher'){ TIMER.tick(); const tc=$('#tClock'); if(tc) tc.textContent=mmss(clockNow()); } },500);

let redrawT=null;
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || !m.from || m.from.role!=='student') return;
  if(m.from.name) NAMES[id]=String(m.from.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='ans' && task && m.task===task.id){
    if(task.kind==='choice'){ const v=+m.v; if(!(v>=0 && v<task.opts.length) || task.lock) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('vote',task.id,id,v); clearTimeout(redrawT); redrawT=setTimeout(()=>draw(false,true),200); return; }
    if(task.kind==='text'){ const text=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,140); if(!text) return;
      const gap=GAPS.find(g=>g.id===task.id);
      const k=WALLQ.findIndex(w=>w.task===task.id && w.sid===id); const item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student', ok:gap?checkGap(gap,text):null};
      if(k>=0) WALLQ[k]=item; else WALLQ.unshift(item); SFX.pop(); Store.log('text',task.id,id,text); paintDock(); return; }
  }
  if(m.t==='work' && task && task.kind==='team'){
    const L=String(m.team||''), f=String(m.f||''); if(!TEAMS().some(t=>t.L===L) || !['fact','calm','whatif'].includes(f)) return;
    S.work[L]=Object.assign({},S.work[L],{[f]:String(m.v||'').slice(0,220), by:NAMES[id]||''}); save(); pubState(); Store.log('work','team-'+L+'-'+f,id,m.v);
    clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(['mission','present'].includes(cur().id) && !document.activeElement.closest?.('#scene textarea')) draw(false,true); },400); return;
  }
}
function paintDock(){
  const d=$('#dock'); d.classList.toggle('on',LIVE.on && ROLE==='teacher'); if(!LIVE.on) return;
  const st=Net.status, stTxt={live:'● live', local:'● this browser only', reconnecting:'● reconnecting…', connecting:'● connecting…', off:'● offline'}[st]||st;
  $('#dockTitle').textContent='Room '+S.room;
  $('#dockLed').className='led '+(st==='live'?'on':st==='off'?'bad':'warn');
  const studs=LIVE.peers.filter(p=>p&&p.role==='student');
  $('#dockCount').textContent=`${studs.length} joined · ${stTxt}`;
  const task=curTask(); let h='';
  h+= studs.length?`<div class="names">${studs.slice(0,40).map(p=>`<span>${esc(p.name||'?')}</span>`).join('')}</div>`:`<div class="small">Nobody yet — share the link or code (📡 Live).</div>`;
  if(!task) h+=`<div class="small">No phone task on this screen — phones show “Look at the main screen”.</div>`;
  else if(task.kind==='choice'){ const n=counts(task.id,task.opts.length); h+=`<div class="small">Votes · ${esc(task.q.slice(0,70))}</div>`+task.opts.map((o,i)=>`<div class="row" style="gap:8px"><b class="mono" style="color:var(--teal);min-width:22px">${n[i]}</b><span class="small">${esc(o)}</span></div>`).join(''); }
  else if(task.kind==='text'){ const list=WALLQ.filter(w=>w.task===task.id); h+= list.length?list.map(w=>`<div class="wallit"><p>${w.ok===true?'<span class="okm">✓</span> ':w.ok===false?'<span class="nom">✗</span> ':''}${esc(w.text)}<small>${esc(w.by)}</small></p><button class="btn sm" data-w="${w.id}">Show</button><button class="btn sm ghost" data-wx="${w.id}" aria-label="Hide">✕</button></div>`).join(''):`<div class="small">Waiting for answers…</div>`; }
  else if(task.kind==='team'){ h+=TEAMS().map(t=>{ const w=S.work[t.L]||{}; const n=['fact','calm','whatif'].filter(f=>w[f]).length; return `<div class="small">${t.e} Team ${t.L}: ${n?`<b style="color:var(--ok)">${n}/3 written</b>`:'…'}</div>`; }).join(''); }
  else if(task.kind==='react3') h+=`<div class="small">Phones can send ✅ Clear · 💛 Kind · 🧠 Clever.</div>`;
  $('#dockBody').innerHTML=h;
  $$('[data-w]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.w); if(k<0) return; const w=WALLQ.splice(k,1)[0]; (S.wall[w.task]=S.wall[w.task]||[]).push({text:w.text, by:w.by, shown:true}); save(); draw(false,true); });
  $$('[data-wx]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.wx); if(k>=0) WALLQ.splice(k,1); paintDock(); });
}
$('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
const baseURL = ()=> location.href.split('?')[0].split('#')[0];
const joinURL = ()=> baseURL()+'?room='+S.room+'&role=student';
async function startLive(silent){
  const kind=await Net.connect({room:S.room, role:'teacher', name:'teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ LIVE.peers=list; paintDock(); if(!$('#modal').classList.contains('hidden') && $('#lvStatus')) $('#lvStatus').innerHTML=liveStatus(); },
    onStatus:()=>{ paintDock(); if($('#lvStatus')) $('#lvStatus').innerHTML=liveStatus(); }});
  LIVE.on = kind!=='none'; S.live=LIVE.on; save();
  $('#btnLive').classList.toggle('on',LIVE.on);
  pubState(); draw(false,true);
  if(!silent) toast(kind==='supabase'?'Live room open — share the link, QR or code':kind==='local'?'Supabase is not reachable — room works in THIS browser only':'Live room could not start');
  return kind;
}
function liveStatus(){
  if(!LIVE.on) return 'not started';
  const n=LIVE.peers.filter(p=>p&&p.role==='student').length;
  const s = Net.status==='live' ? '<span style="color:var(--ok)">● live (Supabase)</span>' : Net.status==='local' ? '<span style="color:var(--yellow)">● this browser only — Supabase is not configured or not reachable</span>' : `<span style="color:var(--yellow)">● ${esc(Net.status)}</span>`;
  return `${s} · ${n} joined`;
}
function openLive(){
  openModal(`<div class="row"><h2 class="dsp grow" style="font-size:38px">📡 Live Student Mode</h2><button class="btn sm ghost" onclick="closeModal()" aria-label="Close">✕</button></div>
   <p class="small">Optional. Students join from a phone with a nickname, vote, send short answers and write team work. The lesson works fully without it.</p>
   <div class="two mt" style="align-items:center"><div><div class="small">Room code</div><div class="dsp" style="font-size:78px">${S.room}</div>
     <div class="small" style="word-break:break-all">${esc(joinURL())}</div>
     <div class="small mt" style="margin-top:8px">Or open <b>${esc(baseURL())}?join</b> and type the code.</div>
     <div class="small mt" id="lvStatus">Status: ${liveStatus()}</div></div>
     <img alt="QR code for the student link" width="210" height="210" style="border-radius:18px;background:#fff;justify-self:end" src="https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?`<button class="btn" id="lvStop">⏹ Stop room</button>`:`<button class="btn primary" id="lvStart">▶ Start live room</button>`}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>
   ${configured()?'':'<p class="small mt" style="color:var(--yellow)">SUPABASE_URL / SUPABASE_KEY are empty at the top of this file → phones on other devices cannot connect.</p>'}`);
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…'; await startLive(); openLive(); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ Net.send({t:'end'}); Net.stop(); LIVE.on=false; S.live=false; LIVE.peers=[]; save(); $('#btnLive').classList.remove('on'); draw(false,true); openLive(); };
  $('#lvCopy').onclick=()=>copy(joinURL(),'Link copied — paste it into the Zoom chat');
  $('#lvNew').onclick=()=>{ S.room=rand4(); save(); openLive(); };
}

/* ---------- 10 · student app (?room=1234&role=student  or  ?join) ---------- */
function studentApp(){
  document.body.classList.add('student');
  const B=$('#stuBody');
  let room=(qs.get('room')||'').replace(/\D/g,'').slice(0,6);
  let st=null, name='', sent={}, myTeam='', taskKey='';
  try{ name=localStorage.getItem('l16name')||''; }catch(e){}
  const setConn=s=>{ $('#stuLed').className='led '+(s==='live'?'on':s==='off'?'bad':'warn');
    $('#stuConn').textContent={live:'connected', local:'this browser only', reconnecting:'reconnecting…', connecting:'connecting…', off:'offline'}[s]||''; };
  $('#stuFoot').innerHTML=['👍','😂','😮','🔥','✋','💛'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ if(!Net.kind) return; Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="card stu-card"><div class="row" style="gap:10px">${av('mia',46)}${av('leo',46)}${av('nora',46)}</div>
      <h2 class="dsp mt" style="font-size:38px">Join the Hype Detector team</h2>
      <label for="rc">Room code</label><input id="rc" inputmode="numeric" maxlength="6" value="${esc(room)}" placeholder="1234" autocomplete="off">
      <label for="nm">Your nickname</label><input id="nm" maxlength="20" value="${esc(name)}" placeholder="e.g. Fox 🦊" autocomplete="off">
      <p class="small mt" style="margin-top:8px">Use a nickname or first name only. No surname, no personal data.</p>
      <button class="btn primary mt" id="jn" style="width:100%">Join →</button></div>`;
    $('#jn').onclick=()=>{ const r=$('#rc').value.replace(/\D/g,''), v=$('#nm').value.trim().slice(0,20); if(r.length<4) return $('#rc').focus(); if(!v) return $('#nm').focus();
      room=r; name=v; try{ localStorage.setItem('l16name',name); }catch(e){} join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  const join=async()=>{
    $('#stuRoom').textContent='room '+room;
    try{ myTeam=localStorage.getItem('l16team-'+room)||''; }catch(e){}
    B.innerHTML=`<div class="stu-wait"><div class="bigi">🔌</div><p>Connecting to room ${esc(room)}…</p></div>`;
    const kind=await Net.connect({room, role:'student', name, onStatus:setConn, onEvent:m=>{
      if(!m.from || m.from.role!=='teacher') return;
      if(m.t==='state'){ const k=JSON.stringify([m.sc, m.task && Object.assign({},m.task,{work:undefined})]); const changed=k!==taskKey; st=m; if(changed){ taskKey=k; render(); } else { paintT(); syncTeam(); } }
      if(m.t==='end') ended();
    }});
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="bigi">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet and try again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
    setTimeout(()=>{ if(!st && B.querySelector('.stu-wait')) B.querySelector('.stu-wait p').innerHTML=`Hi ${esc(name)}! Waiting for your teacher…<br><span class="small">Room ${esc(room)} — is the code right? <a href="?join" style="color:var(--teal)">Change</a></span>`; },6000);
  };
  const ended=()=>{ Net.stop(); setConn('off'); B.innerHTML=`<div class="stu-wait"><div class="bigi">🔍✨</div><h2 class="dsp" style="font-size:36px">Case closed!</h2><p class="small">Thanks, ${esc(name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer){ t.textContent=(st.timer.run?'⏱ ':'⏸ ')+mmss(st.timer.left); } };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const syncTeam=()=>{ if(!st||!st.task||st.task.kind!=='team'||!myTeam) return; const w=(st.task.work||{})[myTeam]||{};
    $$('[data-tf]',B).forEach(ta=>{ if(document.activeElement!==ta && typeof w[ta.dataset.tf]==='string' && ta.value!==w[ta.dataset.tf]) ta.value=w[ta.dataset.tf]; }); };
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait"><div class="bigi">👀</div><p>Hi ${esc(name)}! Waiting for your teacher…</p></div>`; return; }
    const T=st.task, head=`<div class="small mono" style="letter-spacing:.12em;margin-bottom:10px">${st.e||''} SCENE ${st.sc} OF 7 · ${esc(st.title||'')}</div>`;
    const pic = /^img\/[a-z-]+\.webp$/.test(st.img||'') ? `<img class="stu-img" src="${st.img}" alt="" onerror="this.remove()">` : '';
    if(!T){ B.innerHTML=head+pic+`<div class="stu-wait card stu-card" style="padding-top:26px"><div class="bigi">👀</div><p><b>Look at the main screen.</b></p><p class="small">Your teacher will send a task soon. You can tap an emoji below.</p></div>`; return; }
    if(T.kind==='choice'){
      const my=sent[T.id];
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${T.lock&&T.correct===i?'right':my===i?'sel':''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T.lock?'✓ The answer is on the main screen.':my!==undefined?'✓ Sent! You can change it.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T.kind==='text'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><input id="tx" maxlength="140" placeholder="${esc(T.ph||'')}" autocomplete="off"><button class="btn primary mt" id="sd" style="width:100%">Send ➤</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. You can send a new version.':T.gap?'Your teacher checks the answers.':'Your teacher can show your answer on the screen.'}</p></div>`;
      const go=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      $('#sd').onclick=go; $('#tx').onkeydown=e=>{ if(e.key==='Enter') go(); };
      return;
    }
    if(T.kind==='team'){
      const t=T.teams.find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">Which team are you in?</p><div class="opts">${T.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>Team ${x.L}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l16team-'+room,myTeam); }catch(e){} render(); }); return; }
      const w=(T.work||{})[myTeam]||{};
      B.innerHTML=head+`<div class="card stu-card"><div class="row"><span style="font-size:34px">${t.e}</span><div class="grow"><b style="font-size:20px">Team ${t.L}</b><div class="small mono" id="stuT"></div></div><button class="btn sm ghost" id="chg">change</button></div>
        <p class="small" style="margin:10px 0 0">Shared fields — your team sees the same text. Choose one speaker.</p>
        <label>📌 1 · One fact — what did you learn from the full video?</label><textarea data-tf="fact" maxlength="220" placeholder="We found out that…">${esc(w.fact||'')}</textarea>
        <label>💛 2 · One calm message — use one vocabulary phrase</label><textarea data-tf="calm" maxlength="220" placeholder="We think people should…">${esc(w.calm||'')}</textarea>
        <label>💭 3 · One ‘What if?’ sentence — mixed conditional</label><textarea data-tf="whatif" maxlength="220" placeholder="If … had …, … would … now.">${esc(w.whatif||'')}</textarea>
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l16team-'+room); }catch(e){} render(); };
      $$('[data-tf]',B).forEach(ta=>{ let tm=null; ta.oninput=()=>{ $('#ok').textContent='…'; clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,220)}); $('#ok').textContent='✓ Saved — your teacher can see it.'; },700); }; });
      return;
    }
    if(T.kind==='react3'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:22px;font-weight:800">🎤 ${esc(T.q)}</p><p class="small">How was it? Tap to react.</p>
        <div class="opts">${[['✅','Clear'],['💛','Kind'],['🧠','Clever']].map(([e,l])=>`<button class="opt" data-r="${e}"><span class="L">${e}</span><span>${l}</span></button>`).join('')}</div></div>`;
      $$('[data-r]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.r}); b.animate?.([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:250}); });
      return;
    }
  };
  (room && name) ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnRoute').onclick=toggleRoute; $('#btnLive').onclick=openLive;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A'||k==='r'||k==='R') doReveal();
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  SCENES.forEach(sc=>{ const im=new Image(); im.src=sc.img; }); VOCAB.forEach(v=>{ const im=new Image(); im.src='img/chat/'+v.who[0]+'.webp'; });
  ['img/hype-real.webp','img/glowup.webp'].forEach(src=>{ const im=new Image(); im.src=src; });
  draw(true);
  if(S.live) startLive(true);   // teacher refreshed the page → reopen the same room; phones stay connected
}
