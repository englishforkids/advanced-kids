      const my=draft[T.id]=draft[T.id]||{};
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:19px;font-weight:800">Match each phrase with a meaning.</p>
        <div class="smeans">${T.means.map(x=>`<div><b>${x.L}</b>${esc(x.t)}</div>`).join('')}</div>
        ${T.items.map((ph,i)=>`<div class="smrow"><b>${esc(ph)}</b><div class="lets">${T.means.map(x=>`<button class="${T.lock&&T.key[i]===x.L?'right':my[i]===x.L?'sel':''}" data-it="${i}" data-let="${x.L}">${x.L}</button>`).join('')}</div></div>`).join('')}
        ${T.lock?'<p class="small mt">✓ The answers are on the main screen. Green = correct.</p>':`<button class="btn primary mt" id="sd" style="width:100%" ${Object.keys(my).length<T.items.length?'disabled':''}>Send ➤</button><p class="small mt">${sent[T.id]?'✓ Sent! You can change and send again.':'Choose a letter for every phrase.'}</p>`}</div>`;
      $$('[data-it]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; my[+b.dataset.it]=b.dataset.let; render(); });
      const s=$('#sd'); if(s) s.onclick=()=>{ sent[T.id]=true; Net.send({t:'ans', task:T.id, v:my}); render(); };
      return;
    }
    if(T.kind==='text'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><input id="tx" maxlength="140" placeholder="${esc(T.ph||'')}" autocomplete="off"><button class="btn primary mt" id="sd" style="width:100%">Send ➤</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. You can send a new version.':'Your teacher can show your answer on the screen.'}</p></div>`;
      const go=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      $('#sd').onclick=go; $('#tx').onkeydown=e=>{ if(e.key==='Enter') go(); };
      return;
    }
    if(T.kind==='kit'){
      const t=T.teams.find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">Which team are you in?</p><div class="opts">${T.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>Team ${x.L}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l17team-'+room,myTeam); }catch(e){} render(); }); return; }
      const w=(T.work||{})[myTeam]||{};
      B.innerHTML=head+`<div class="card stu-card"><div class="row"><span style="font-size:34px">${t.e}</span><div class="grow"><b style="font-size:20px">Team ${t.L}</b><div class="small mono" id="stuT"></div></div><button class="btn sm ghost" id="chg">change</button></div>
        <p class="small" style="margin:10px 0 0">Scroll Survival Kit for Mia · shared fields — your team sees the same text. Use 3+ lesson words!</p>
        <label>🧰 Our kit is called…</label><input data-tf="name" maxlength="40" placeholder="e.g. The Scroll Shield" value="${esc(w.name||'')}">
        <label>Rule 1</label><textarea data-tf="r1" maxlength="200" placeholder="Mute notifications when…">${esc(w.r1||'')}</textarea>
        <label>Rule 2</label><textarea data-tf="r2" maxlength="200" placeholder="If you get sucked in…">${esc(w.r2||'')}</textarea>
        <label>Rule 3</label><textarea data-tf="r3" maxlength="200" placeholder="Don’t let likes…">${esc(w.r3||'')}</textarea>
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l17team-'+room); }catch(e){} render(); };
      $$('[data-tf]',B).forEach(ta=>{ let tm=null; ta.oninput=()=>{ $('#ok').textContent='…'; clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,200)}); $('#ok').textContent='✓ Saved — your teacher can see it.'; },700); }; });
      return;
    }
    if(T.kind==='react3'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:21px;font-weight:800">🎤 ${esc(T.q)}</p><p class="small">How was it? Tap to react.</p>
        <div class="opts">${[['🛡️','Would work'],['💡','Clever'],['😂','Funny']].map(([e,l])=>`<button class="opt" data-r="${e}"><span class="L">${e}</span><span>${l}</span></button>`).join('')}</div></div>`;
      $$('[data-r]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.r}); b.animate?.([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:250}); });
      return;
    }
  };
  (room && name) ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnRoute').onclick=toggleRoute; $('#btnLive').onclick=openLive;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A') doReveal();
    else if(k==='Escape') toggleTeacher(false);
  });
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  draw(true);
  if(S.live) startLive(true);
}
</script>
</body>
</html>
