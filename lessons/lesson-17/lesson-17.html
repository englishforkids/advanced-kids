.reel .tab{position:absolute; top:6px; left:0; right:0; text-align:center; font-weight:800; font-size:15px; z-index:2; text-shadow:0 1px 6px #000}
.reel .tab span{opacity:.6; margin:0 8px} .reel .tab b{border-bottom:2px solid #fff; padding-bottom:3px}
.g1{background:linear-gradient(160deg,#FF6B9A,#7B3FE4 60%,#1A1050)}
.g2{background:linear-gradient(160deg,#2BD9C5,#2A64E0 55%,#0E1340)}
.g3{background:linear-gradient(160deg,#FFC24B,#FF5E62 55%,#3A0F3F)}
.g4{background:linear-gradient(160deg,#9BFF6A,#18A57A 55%,#062A2A)}
.g5{background:linear-gradient(160deg,#C38BFF,#5B2BC9 50%,#140A3A)}
.g6{background:linear-gradient(160deg,#5BD8FF,#3D4BFF 50%,#0B0F3D)}
.flick .bg{animation:flick .35s steps(1) infinite}
.vcount{position:absolute; top:52px; left:14px; z-index:5; font-family:var(--mono); font-weight:700; font-size:14px; padding:6px 10px; border-radius:12px; background:rgba(0,0,0,.55); border:1px solid var(--edge2)}
.vcount b{font-size:22px; color:var(--yellow)}
.autoplay{position:absolute; inset:auto 14px 90px 14px; z-index:5; display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; background:rgba(8,9,30,.85); border:1px solid var(--edge2); backdrop-filter:blur(8px)}
.autoplay .cd{position:relative; width:46px; height:46px; flex:0 0 46px}
.autoplay .cd svg{width:100%; height:100%; transform:rotate(-90deg)}
.autoplay .cd circle{fill:none; stroke-width:4}
.autoplay .cd .bg{stroke:rgba(255,255,255,.2)} .autoplay .cd .fg{stroke:var(--pink); stroke-dasharray:126; animation:cdr 1.6s linear infinite}
@keyframes cdr{from{stroke-dashoffset:126} to{stroke-dashoffset:0}}
.autoplay .cd b{position:absolute; inset:0; display:grid; place-items:center; font-size:15px}
.still{position:absolute; inset:0; z-index:6; display:grid; place-items:center; background:rgba(3,4,16,.72); backdrop-filter:blur(5px)}
.still .box{width:84%; padding:22px 18px; border-radius:22px; background:#15183A; border:1px solid var(--edge2); text-align:center; animation:popIn .4s both}
.still .box b{font-size:22px; display:block; margin-bottom:6px}
.still .box .bt{display:grid; gap:8px; margin-top:14px}
.still .box .bt span{padding:10px; border-radius:12px; background:var(--glass2); font-weight:800}
.still .box .bt span:first-child{background:#fff; color:#111}

/* social post */
.post{background:#0B0D24; border-bottom:1px solid var(--edge)}
.post .ph{display:flex; gap:10px; align-items:center; padding:10px 14px; font-weight:800; font-size:15px}
.post .ph small{display:block; font-weight:500; color:var(--muted); font-size:12px}
.post .img{position:relative; aspect-ratio:1/1; overflow:hidden; display:grid; place-items:center; font-size:84px}
.post .img.sunset{background:linear-gradient(180deg,#FF8A5B 0%,#FF4E8A 38%,#6B2E9E 62%,#1B1446 100%)}
.post .img.sunset::before{content:""; position:absolute; width:46%; aspect-ratio:1; border-radius:50%; left:27%; top:30%; background:radial-gradient(circle,#FFE38A,#FF9E5E 60%,transparent 62%)}
.post .img.sunset::after{content:""; position:absolute; left:0; right:0; bottom:0; height:34%; background:
  linear-gradient(90deg,#120B30 0 8%,transparent 8% 11%,#120B30 11% 22%,transparent 22% 24%,#120B30 24% 40%,transparent 40% 43%,#120B30 43% 58%,transparent 58% 60%,#120B30 60% 79%,transparent 79% 82%,#120B30 82%);
  clip-path:polygon(0 40%,8% 40%,8% 10%,11% 10%,11% 50%,22% 50%,22% 0,24% 0,24% 30%,40% 30%,40% 55%,43% 55%,43% 20%,58% 20%,58% 45%,60% 45%,60% 5%,79% 5%,79% 35%,82% 35%,82% 60%,100% 60%,100% 100%,0 100%)}
.post .img.photo img{position:absolute; inset:0; z-index:1; width:100%; height:100%; object-fit:cover}
.post .img span{position:relative; z-index:2; filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.post .img.room{background:linear-gradient(160deg,#F4EDE4,#E2D6C8 55%,#C9B8A6)}
.post .img.sunrise{background:linear-gradient(180deg,#FFD38A,#FF9A6B 45%,#7C5CFF)}
.post .img.badge{background:radial-gradient(circle at 50% 40%,#2A2F66,#0B0D24)}
.post .img.lunch{background:linear-gradient(160deg,#FFE7A8,#FFB86B 60%,#E07A3F)}
.post .acts{display:flex; gap:16px; padding:10px 14px 4px; font-size:24px}
.post .likes{padding:0 14px 6px; font-weight:800; font-size:16px; display:flex; align-items:center; gap:8px}
.post .likes .n{font-family:var(--mono); font-size:20px; display:inline-block}
.post .likes .n.bump{animation:tick .5s}
@keyframes tick{50%{transform:scale(1.35); color:var(--pink)}}
.post .cap2{padding:0 14px 12px; font-size:15px}
.post .cap2 b{margin-right:6px}
.refresh{display:flex; align-items:center; justify-content:center; gap:8px; padding:8px; font-size:13px; color:var(--muted); font-weight:700}
.refresh .sp{display:inline-block; width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(255,255,255,.2); border-top-color:#fff}
.refresh.go .sp{animation:spin .6s linear infinite}
.timechip{display:inline-flex; gap:8px; align-items:center; font-family:var(--mono); font-weight:700; font-size:14px; padding:6px 12px; border-radius:99px; background:rgba(255,216,77,.14); border:1px solid rgba(255,216,77,.5); color:var(--yellow)}
.sponsor{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.06em}
.fpost{border-radius:20px; overflow:hidden; border:1px solid var(--edge2); background:#0B0D24; box-shadow:var(--shadow)}
.fpost .txt{padding:12px 14px 14px; font-size:clamp(18px,1.9vw,22px); font-weight:800; line-height:1.3}
.fpost .img{aspect-ratio:16/9; display:grid; place-items:center; font-size:64px; position:relative}
.fpost .warnline{padding:0 14px 12px; font-size:13px; color:#FF9DBD; font-weight:700}

/* settings screen */
.setlist{display:grid; gap:2px; padding:10px 12px; margin-top:6px}
.setrow{display:flex; align-items:center; gap:12px; padding:14px 12px; border-radius:14px; background:rgba(255,255,255,.045); font-weight:700; font-size:17px}
.setrow .ic{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-size:18px; background:#2A2F66}
.setrow .val{margin-left:auto; font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(255,255,255,.08); color:var(--muted); transition:.4s}
.setrow.on .val{background:var(--lime); color:#101A00; animation:popIn .45s both}
.setrow.on{background:rgba(184,255,61,.08)}

/* cast / characters */
.cast{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.castc{display:flex; gap:14px; align-items:center; border-radius:20px; padding:12px 14px; background:var(--glass); border:1px solid var(--edge)}
.castc b{display:block; font-size:19px}
.castc span{display:block; font-size:14px; color:var(--muted); line-height:1.3}
.castc.villain{border-color:rgba(255,61,127,.5); background:rgba(255,61,127,.07)}
.say-row{display:flex; gap:14px; align-items:flex-start}
.say-b{position:relative; padding:14px 18px; border-radius:22px 22px 22px 6px; background:#1C2150; border:1px solid var(--edge2); font-size:clamp(20px,2.2vw,26px); font-weight:700; line-height:1.35}
.say-b .who{display:block; font-family:var(--mono); font-size:12px; letter-spacing:.12em; margin-bottom:2px}
.say-b.feedb{background:linear-gradient(135deg,rgba(255,61,127,.22),rgba(139,92,255,.2)); border-color:rgba(255,61,127,.6)}

/* suspects board */
.board{display:grid; grid-template-columns:repeat(5,1fr); gap:12px}
.susc{position:relative; border-radius:20px; padding:18px 10px 14px; text-align:center; background:var(--glass); border:1.5px dashed var(--edge2); min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px}
.susc .q{font-family:var(--dsp); font-size:46px; font-weight:900; color:var(--faint)}
.susc .e{font-size:44px}
.susc b{font-size:15px}
.susc small{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--muted)}
.susc.f{border:1.5px solid rgba(255,61,127,.65); background:linear-gradient(180deg,rgba(255,61,127,.14),rgba(255,61,127,.03))}
.susc.f::after{content:"FOUND"; position:absolute; top:8px; right:-6px; transform:rotate(12deg); font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.12em; padding:2px 7px; border-radius:6px; background:var(--pink); color:#fff}
.susc.you{border:1.5px solid rgba(184,255,61,.7); background:linear-gradient(180deg,rgba(184,255,61,.16),rgba(184,255,61,.03))}
.susc.you::after{content:"DECIDES"; background:var(--lime); color:#101A00; position:absolute; top:8px; right:-6px; transform:rotate(12deg); font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.12em; padding:2px 7px; border-radius:6px}
.found{display:flex; gap:16px; align-items:center; padding:16px 20px; border-radius:22px; background:linear-gradient(90deg,rgba(255,61,127,.2),rgba(139,92,255,.12)); border:1.5px solid rgba(255,61,127,.6)}
.found .e{font-size:46px; line-height:1}
.found .k{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:#FF9DBD; font-weight:700}
.found b{font-family:var(--dsp); font-size:clamp(20px,2.4vw,28px); font-weight:900; display:block}
.found.fx{animation:slam .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes slam{0%{opacity:0; transform:scale(1.8) rotate(-6deg)}60%{opacity:1; transform:scale(.96)}100%{transform:none}}

/* mission banner */
.missionb{padding:30px 34px; border-radius:32px; background:linear-gradient(135deg,rgba(255,61,127,.2),rgba(139,92,255,.2) 55%,rgba(61,232,255,.12)); border:1.5px solid rgba(255,255,255,.26); box-shadow:var(--shadow); position:relative; overflow:hidden}
.missionb .k{font-family:var(--mono); letter-spacing:.24em; font-size:14px; color:var(--yellow); font-weight:700}
.missionb h2{font-family:var(--dsp); font-weight:900; font-size:clamp(28px,3.6vw,50px); margin-top:8px; letter-spacing:-.02em}
.missionb.fx{animation:slam .8s cubic-bezier(.2,1.4,.4,1) both}

/* story text card */
.story{padding:26px 28px; border-radius:26px; background:linear-gradient(180deg,#121636,#0C0F28); border:1px solid var(--edge2); box-shadow:var(--shadow)}
.story .kick{margin-bottom:10px}
.story p{font-size:clamp(20px,2.15vw,25px); line-height:1.5; font-weight:600; margin:0 0 12px}
.story p.q{padding-left:14px; border-left:3px solid var(--mia)}
.story .seg{display:flex; gap:4px; margin-bottom:16px}
.story .seg i{flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.2)}
.story .seg i.on{background:#fff}

/* matching */
.match{padding:22px; border-radius:26px; background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025)); border:1px solid var(--edge); box-shadow:var(--shadow)}
.match h3{font-size:19px; margin-bottom:4px}
.mgrid{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:12px; margin-top:12px; align-items:start}
.mrows{display:grid; gap:8px}
.mrow{display:grid; grid-template-columns:minmax(0,1fr) 50px; gap:8px; align-items:center; padding:7px 8px 7px 12px; border-radius:16px; background:rgba(255,255,255,.04); border:1.5px solid var(--edge); cursor:pointer; transition:.15s; text-align:left}
.mrow .ph{font-weight:800; font-size:clamp(18px,1.9vw,22px)}
.mrow .ph small{display:block; font-weight:600; font-size:14px; color:var(--muted); margin-top:2px}
.mrow .ua{display:block; font-size:14.5px; color:#FFE9A8; font-weight:700; margin-top:3px}
.mrow .slot{height:42px; border-radius:12px; display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:20px; border:2px dashed var(--edge2); color:var(--faint)}
.mrow.act{border-color:var(--cyan); background:rgba(61,232,255,.08); box-shadow:0 0 0 1px rgba(61,232,255,.4) inset}
.mrow.act .slot{border-color:var(--cyan); color:var(--cyan); animation:blinkS 1.1s infinite}
@keyframes blinkS{50%{border-color:transparent}}
.mrow.has .slot{border-style:solid; border-color:var(--violet); background:rgba(139,92,255,.25); color:#fff}
.mrow.ok{border-color:var(--ok); background:rgba(75,227,160,.09)}
.mrow.ok .slot{border-color:var(--ok); background:var(--ok); color:#04201A}
.mrow.no{border-color:var(--bad); background:rgba(255,92,122,.09)}
.mrow.no .slot{border-color:var(--bad); background:rgba(255,92,122,.3)}
.mrow.no.fx{animation:shake .45s}
.mrow.ok.fx{animation:rightPulse .8s ease}
.mopts{display:grid; gap:8px}
.mopt{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; padding:8px 12px; border-radius:15px; background:rgba(255,255,255,.035); border:1.5px solid var(--edge2); text-align:left; font-size:clamp(16.5px,1.7vw,19px); font-weight:700; line-height:1.3; transition:.15s}
.mopt:hover{border-color:var(--cyan)}
.mopt .L{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:rgba(255,255,255,.1); font-family:var(--mono); font-size:16px}
.mopt.used{opacity:.42}
.mopt.used .L{background:var(--violet)}
.mfoot{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:14px}
.mverdict{font-weight:800; font-size:17px}
.mverdict.ok{color:var(--ok)} .mverdict.no{color:var(--bad)}
.phones{font-family:var(--mono); font-size:13px; color:var(--cyan); font-weight:700}
.extra-note{margin-top:14px; padding:14px 16px; border-radius:16px; background:rgba(61,232,255,.08); border:1px dashed rgba(61,232,255,.5); font-size:17px}
.extra-note b{color:var(--cyan)}
.tip{margin-top:12px; font-size:15px; color:var(--muted)}
.howto{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted)}
.howto span{padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.05); border:1px solid var(--edge2); color:var(--text)}
.chat.compact{gap:8px; padding:12px}
.chat.compact .bub{font-size:15.5px; padding:8px 12px}
.chat.compact .bub .who{font-size:11.5px}

/* quiz / poll */
.poll{display:grid; gap:11px; margin-top:16px}
.popt{position:relative; display:flex; align-items:center; gap:14px; padding:15px 18px; border-radius:18px; background:var(--glass); border:1.5px solid var(--edge2); text-align:left; font-size:clamp(18px,1.9vw,21px); font-weight:700; overflow:hidden; transition:border-color .2s, transform .1s}
.popt:active{transform:scale(.99)}
.popt .L{flex:0 0 40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.1); font-family:var(--mono); font-size:17px}
.popt .fill{position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,rgba(61,232,255,.22),rgba(139,92,255,.2)); transition:width .6s; z-index:0}
.popt > *:not(.fill){position:relative; z-index:1}
.popt .n{margin-left:auto; font-family:var(--mono); font-size:18px; color:var(--cyan)}
.popt .pc{font-family:var(--mono); font-size:13px; color:var(--muted); margin-left:8px}
.popt.right{border-color:var(--ok); background:rgba(75,227,160,.12)}
.popt.right .L{background:var(--ok); color:#04201A}
.popt.wrongpick{border-color:var(--bad); background:rgba(255,92,122,.1)}
.popt.dim{opacity:.45}
.popt.win{border-color:var(--yellow); box-shadow:0 0 0 1px var(--yellow) inset}
.popt.right.fx{animation:rightPulse .9s ease}
@keyframes rightPulse{30%{transform:scale(1.03); box-shadow:0 0 0 7px rgba(75,227,160,.3), 0 0 40px rgba(75,227,160,.4)}100%{transform:none}}
.popt.wrongpick.fx{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.popt.chk .L{background:transparent; border:2px solid var(--edge2)}
.popt.chk.sel .L{background:var(--cyan); color:#03141C; border-color:var(--cyan)}
.popt.chk.sel{border-color:var(--cyan)}
.qcard{padding:30px 32px 26px}
.qcard .big{margin:10px 0 8px}
.sample{margin-top:16px; padding:15px 19px; border-radius:18px; background:rgba(184,255,61,.08); border:1px dashed rgba(184,255,61,.55); font-size:20px; font-weight:700}
.sample::before{content:"EXAMPLE"; display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--lime); margin-bottom:4px}
.hintbox{margin-top:14px; padding:14px 18px; border-radius:16px; background:rgba(255,216,77,.09); border:1px dashed rgba(255,216,77,.55); font-size:18px}
.hintbox::before{content:"💡 HELP"; display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--yellow); margin-bottom:4px}
.starters{display:flex; gap:9px; flex-wrap:wrap; margin-top:10px}
.starters span{font-weight:700; font-size:16px; padding:7px 12px; border-radius:12px; background:rgba(139,92,255,.18); border:1px solid rgba(139,92,255,.5); color:#E6DCFF}
.ualine{margin-top:10px; font-size:17px; color:#FFE9A8; font-weight:600}
.ualine::before{content:"🇺🇦 "}
.reveal-line{margin-top:16px; padding:16px 20px; border-radius:18px; background:rgba(75,227,160,.1); border:1px solid rgba(75,227,160,.5); font-size:clamp(19px,2vw,23px); font-weight:700}

/* listening */
.vm{padding:22px; border-radius:28px; background:linear-gradient(160deg,#16204A,#0C1030); border:1px solid rgba(90,169,255,.45); box-shadow:var(--shadow)}
.vm .top{display:flex; align-items:center; gap:14px}
.vm .top b{font-size:20px} .vm .top small{display:block; color:var(--muted); font-size:14px}
.vmrow{display:flex; align-items:center; gap:14px; margin-top:16px}
.vplay{width:66px; height:66px; flex:0 0 66px; border-radius:50%; background:var(--leo); color:#03122A; font-size:26px; display:grid; place-items:center; box-shadow:0 10px 30px -8px var(--leo)}
.vplay.on{animation:pulseP 1.2s infinite}
@keyframes pulseP{50%{box-shadow:0 0 0 12px rgba(90,169,255,.18), 0 10px 30px -8px var(--leo)}}
.wave{flex:1; height:58px; display:flex; align-items:center; gap:3px; overflow:hidden}
.wave i{flex:1; min-width:2px; border-radius:3px; background:rgba(255,255,255,.22); transition:background .2s}
.wave i.p{background:var(--leo)}
.vm.on .wave i.p:last-of-type{}
.vm .tm{font-family:var(--mono); font-size:14px; color:var(--muted); min-width:84px; text-align:right}
.vctl{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.script{margin-top:16px; display:grid; gap:10px}
.script p{margin:0; padding:12px 16px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid var(--edge); font-size:clamp(17px,1.8vw,20px); line-height:1.5; transition:.3s}
.script p.cur{border-color:var(--leo); background:rgba(90,169,255,.12)}
.pre{display:grid; gap:12px}
.pre .qi{padding:16px 20px; border-radius:18px; background:var(--glass); border:1px solid var(--edge); font-size:clamp(20px,2.1vw,25px); font-weight:800}

/* class wall */
.wall{margin-top:18px}
.wall h4{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--muted); font-weight:700; margin-bottom:10px}
.wall .list{display:flex; flex-wrap:wrap; gap:10px}
.wall .it{padding:10px 14px; border-radius:16px 16px 16px 6px; background:#1C2150; border:1px solid var(--edge); font-size:18px; font-weight:600; animation:popIn .35s both}
.wall .it small{display:block; font-size:12.5px; color:var(--muted); font-weight:800}

/* speaking */
.qnav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.qnav button{width:44px; height:44px; border-radius:13px; background:var(--glass); border:1px solid var(--edge2); font-family:var(--mono); font-weight:700}
.qnav button.cur{background:var(--pink); border-color:var(--pink)}
.qnav button.x{border-style:dashed; color:var(--yellow)}
.fup{margin-top:12px; font-size:18px; color:#C9D2FF; font-weight:700}
.fup::before{content:"➜ Follow-up: "; color:var(--cyan); font-family:var(--mono); font-size:12px; letter-spacing:.1em}

/* breakout kit */
.kitm{padding:28px 30px; border-radius:30px; background:linear-gradient(145deg,rgba(184,255,61,.12),rgba(61,232,255,.1) 50%,rgba(139,92,255,.16)); border:1.5px solid rgba(255,255,255,.25); box-shadow:var(--shadow)}
.kitm h2{font-family:var(--dsp); font-weight:900; font-size:clamp(26px,3vw,40px)}
.rules{list-style:none; padding:0; margin:16px 0 0; display:grid; gap:9px; counter-reset:r}
.rules li{counter-increment:r; display:grid; grid-template-columns:38px 1fr; gap:12px; align-items:center; font-size:clamp(18px,1.9vw,22px); font-weight:700}
.rules li::before{content:counter(r); width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--lime); color:#101A00; font-family:var(--dsp); font-weight:900; font-size:17px}
.prob{padding:18px 20px; border-radius:22px; background:#1C2150; border:1px solid var(--edge2)}
.prob p{margin:4px 0; font-size:clamp(18px,1.9vw,21px); font-weight:700}
.prob p::before{content:"⚠️ "}
.kit{border-radius:24px; overflow:hidden; border:1.5px solid rgba(184,255,61,.55); background:#0D1129}
.kit .kh{display:flex; align-items:center; gap:10px; padding:14px 18px; background:linear-gradient(90deg,rgba(184,255,61,.22),rgba(61,232,255,.12)); font-family:var(--dsp); font-weight:900; font-size:20px}
.kit .kr{padding:10px 18px; border-top:1px dashed var(--edge2); font-size:18px; font-weight:700}
.kit .kr small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--lime)}
.ul{padding:16px 18px; border-radius:20px; background:rgba(139,92,255,.12); border:1px solid rgba(139,92,255,.5)}
.ul h4{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:#CDB8FF; margin-bottom:8px}
.ul .starters{margin-top:0}
.timer{display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px; border-radius:28px; background:rgba(0,0,0,.3); border:1px solid var(--edge2)}
.ring{position:relative; width:min(220px,60vw); aspect-ratio:1}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:10}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringG); stroke-linecap:round; transition:stroke-dashoffset 1s linear}
.ring .clock{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--dsp); font-weight:800; font-size:clamp(44px,5vw,60px); font-variant-numeric:tabular-nums}
.ring .clock.end{color:var(--pink); animation:flick .6s infinite}
@keyframes flick{50%{filter:brightness(1.5)}}
.ring.hurry{animation:hurry 1s ease-in-out infinite}
.ring.hurry .fg{stroke:var(--pink)}
@keyframes hurry{50%{transform:scale(1.035); filter:drop-shadow(0 0 18px rgba(255,61,127,.6))}}
.durs{display:flex; gap:6px}
.durs button{padding:6px 10px; border-radius:10px; border:1px solid var(--edge2); font-family:var(--mono); font-size:13px; font-weight:700}
.durs button.on{background:var(--lime); color:#101A00; border-color:var(--lime)}
.spot{position:relative; overflow:hidden; padding:26px; border-radius:30px; background:linear-gradient(160deg,rgba(184,255,61,.12),rgba(139,92,255,.14)); border:1.5px solid rgba(255,255,255,.25)}
.spot .line{display:grid; grid-template-columns:110px 1fr; gap:14px; align-items:start; padding:10px 0; border-bottom:1px dashed var(--edge2)}
.spot .line:last-child{border-bottom:0}
.spot .line b{font-family:var(--mono); font-size:12.5px; letter-spacing:.14em; padding-top:10px; color:var(--lime)}
.spot textarea,.spot input{width:100%; background:transparent; border:1px dashed transparent; border-radius:12px; font-size:clamp(19px,2.1vw,25px); font-weight:700; line-height:1.35; resize:none; padding:4px 8px}
.spot input.kn{font-family:var(--dsp); font-weight:900; font-size:clamp(24px,3vw,38px)}
.spot textarea:hover,.spot textarea:focus,.spot input:hover,.spot input:focus{border-color:var(--edge2); background:rgba(0,0,0,.2)}
.spot.fx::before{content:""; position:absolute; top:-20%; bottom:-20%; width:35%; left:-40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.12),transparent); animation:scan 1s ease both; pointer-events:none}
@keyframes scan{from{left:-40%} to{left:110%}}
.reacts3{display:flex; gap:12px; flex-wrap:wrap}

/* ping decision */
.ping{display:grid; gap:20px; justify-items:center; text-align:center}
.pingn{font-family:var(--dsp); font-weight:900; font-size:clamp(46px,7vw,92px); letter-spacing:-.03em; background:linear-gradient(90deg,var(--yellow),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:pingShake 1.6s ease-in-out infinite}
@keyframes pingShake{0%,70%,100%{transform:none}74%{transform:rotate(-6deg) scale(1.05)}78%{transform:rotate(6deg) scale(1.05)}82%{transform:rotate(-4deg)}86%{transform:none}}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:18px; width:100%; max-width:900px}
.bigc{position:relative; padding:30px 20px; border-radius:28px; font-family:var(--dsp); font-weight:900; font-size:clamp(22px,2.8vw,34px); letter-spacing:-.01em; border:2px solid; transition:transform .15s; overflow:hidden}
.bigc:hover{transform:translateY(-3px)}
.bigc small{display:block; font-family:var(--mono); font-size:13px; font-weight:700; margin-top:10px; letter-spacing:.08em; opacity:.85}
.bigc.chk{background:linear-gradient(135deg,rgba(255,61,127,.3),rgba(255,122,69,.2)); border-color:var(--pink)}
.bigc.lv{background:linear-gradient(135deg,rgba(184,255,61,.26),rgba(61,232,255,.16)); border-color:var(--lime); color:#F4FFE0}
.bigc .vote{position:absolute; top:10px; right:14px; font-family:var(--mono); font-size:16px; padding:2px 10px; border-radius:99px; background:rgba(0,0,0,.4)}
.outcome{width:100%; max-width:900px; padding:30px; border-radius:30px; text-align:center}
.outcome.bad{background:rgba(255,61,127,.12); border:1.5px solid var(--pink)}
.outcome.good{background:linear-gradient(135deg,rgba(184,255,61,.18),rgba(61,232,255,.12)); border:1.5px solid var(--lime)}
.stampx{display:inline-block; font-family:var(--dsp); font-weight:900; font-size:clamp(32px,5vw,62px); letter-spacing:-.02em; padding:8px 20px; border:4px solid var(--lime); border-radius:18px; color:var(--lime); transform:rotate(-3deg)}
.stampx.fx{animation:slam .8s cubic-bezier(.2,1.5,.4,1) both}
.moral{margin-top:22px; font-family:var(--dsp); font-weight:800; font-size:clamp(22px,3vw,38px); line-height:1.25; letter-spacing:-.02em}
.moral em{font-style:normal; background:linear-gradient(90deg,var(--lime),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent}

/* summary */
.topics{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px}
.topics div{padding:14px 16px; border-radius:18px; background:var(--glass); border:1px solid var(--edge); font-weight:800; font-size:18px; display:flex; gap:10px; align-items:center}
.topics div span{font-size:26px}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{padding:10px 16px; border-radius:99px; font-weight:800; font-size:clamp(16px,1.7vw,19px); background:rgba(255,61,127,.12); border:1.5px solid rgba(255,61,127,.5); transition:.15s}
.chip:hover{background:rgba(255,61,127,.25); transform:translateY(-2px)}
.chip.c2{background:rgba(61,232,255,.1); border-color:rgba(61,232,255,.5)}
.chip.c3{background:rgba(184,255,61,.1); border-color:rgba(184,255,61,.5)}
.chip.x{border-style:dashed; background:transparent; color:var(--yellow); border-color:rgba(255,216,77,.6)}
.final{text-align:center; padding:34px 26px; border-radius:34px; background:linear-gradient(145deg,rgba(184,255,61,.14),rgba(139,92,255,.18),rgba(255,61,127,.14)); border:1.5px solid rgba(255,255,255,.28)}

/* word popup */
.wpop .ph{font-family:var(--dsp); font-weight:900; font-size:clamp(28px,4vw,42px); letter-spacing:-.02em; color:var(--lime)}
.wpop .en{font-size:22px; font-weight:700; margin-top:10px}
.wpop .ua{font-size:20px; color:#FFE9A8; font-weight:700; margin-top:8px}
.wpop .ua::before{content:"🇺🇦 "}
.wpop .ex{margin-top:12px; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.05); border-left:3px solid var(--pink); font-size:19px; font-style:italic}

/* teacher panel */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(440px,94vw); z-index:40; background:#0A0D24; border-left:1px solid var(--edge2);
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; box-shadow:-30px 0 60px -20px #000}
#teacher.on{transform:none}
#teacher .thd{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--edge)}
#teacher .thd b{font-family:var(--dsp); font-weight:900; letter-spacing:.02em; font-size:17px}
#tBody{overflow:auto; padding:16px; display:grid; gap:14px; align-content:start; font-size:16px}
.tsec{padding:14px; border-radius:16px; background:var(--glass); border:1px solid var(--edge)}
.tsec h5{margin:0 0 8px; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--cyan); font-weight:700; text-transform:uppercase}
.tsec .say{font-size:17px; font-weight:700; color:#fff; border-left:3px solid var(--pink); padding-left:10px}
.tsec ul{margin:0; padding-left:18px} .tsec li{margin:3px 0}
.tmap{display:grid; gap:3px}
.tmap button{display:flex; gap:8px; align-items:center; text-align:left; padding:7px 10px; border-radius:10px; font-size:14.5px; border:1px solid transparent}
.tmap button:hover{background:var(--glass2)}
.tmap button.cur{border-color:var(--pink); background:rgba(255,61,127,.12)}
.tmap button.skip{opacity:.4; text-decoration:line-through}
.tmap .sn{font-family:var(--mono); color:var(--cyan); font-size:11.5px; font-weight:700; margin-top:6px; letter-spacing:.08em}
.tmap .sn .ck{color:var(--lime)}
.tmap .m{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted)}
.tgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tgrid .btn{width:100%}
.sw{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0}
.sw button{width:54px; height:30px; border-radius:99px; background:rgba(255,255,255,.14); position:relative; transition:.2s; flex:0 0 54px}
.sw button::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.2s}
.sw button.on{background:var(--lime)} .sw button.on::after{left:27px}

/* live dock */
#dock{position:fixed; right:18px; bottom:84px; z-index:30; width:360px; max-height:56vh; display:none; flex-direction:column; border-radius:20px; overflow:hidden;
  background:rgba(10,13,36,.97); border:1px solid var(--edge2); box-shadow:var(--shadow)}
#dock.on{display:flex}
#dock .dh{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--edge); font-size:15px}
#dock .db{overflow:auto; padding:12px; display:grid; gap:8px; font-size:15px}
#dock.min .db{display:none}
.led{width:11px; height:11px; border-radius:50%; background:var(--faint); flex:0 0 11px}
.led.on{background:var(--ok); box-shadow:0 0 10px var(--ok)}
.led.warn{background:var(--yellow); box-shadow:0 0 10px var(--yellow)}
.led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:5px}
.names span{padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.08); font-size:13px}
.wallit{display:grid; grid-template-columns:1fr auto auto; gap:6px; align-items:center; padding:8px; border-radius:12px; background:rgba(255,255,255,.05)}
.wallit p{margin:0; font-size:15px} .wallit small{display:block; color:var(--muted); font-size:12px}
.dbar{display:grid; grid-template-columns:1fr 60px; gap:8px; align-items:center; font-size:14px}
.dbar i{display:block; height:8px; border-radius:99px; background:linear-gradient(90deg,var(--ok),var(--cyan))}

/* modal, toast, floats */
#modal{position:fixed; inset:0; z-index:60; background:rgba(2,3,12,.74); backdrop-filter:blur(6px); display:grid; place-items:center; padding:18px}
#modal .box{width:min(760px,100%); max-height:88vh; overflow:auto; background:#0D1030; border:1px solid var(--edge2); border-radius:26px; padding:26px; box-shadow:var(--shadow); animation:popIn .3s both}
#modal .box.narrow{width:min(520px,100%)}
#toast{position:fixed; left:50%; top:78px; transform:translate(-50%,-20px); z-index:70; padding:12px 18px; border-radius:14px; background:#1A1F55; border:1px solid var(--edge2); font-weight:700; opacity:0; pointer-events:none; transition:.25s; max-width:90vw; text-align:center}
#toast.on{opacity:1; transform:translate(-50%,0)}
#reacts{position:fixed; right:30px; bottom:90px; z-index:35; width:120px; height:60vh; pointer-events:none}
#reacts span{position:absolute; bottom:0; font-size:44px; animation:floatUp 3s ease-out forwards}
@keyframes floatUp{0%{opacity:0; transform:translateY(0) scale(.6)}15%{opacity:1; transform:translateY(-40px) scale(1.1)}100%{opacity:0; transform:translateY(-55vh) scale(1)}}
#confetti{position:fixed; inset:0; z-index:50; pointer-events:none}
#wm{position:fixed; left:18px; bottom:78px; z-index:2; pointer-events:none; opacity:.4}
#wm img{height:28px; display:block}
.spark{position:fixed; z-index:55; pointer-events:none; font-size:28px; animation:sparkFly .9s ease-out forwards}
@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(.4); opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r)); opacity:0}}
.stagger>*{animation:popIn .45s both}
.stagger>*:nth-child(2){animation-delay:.1s}.stagger>*:nth-child(3){animation-delay:.2s}.stagger>*:nth-child(4){animation-delay:.3s}.stagger>*:nth-child(5){animation-delay:.4s}.stagger>*:nth-child(6){animation-delay:.5s}
.seq>*{animation:nIn .55s cubic-bezier(.2,1.2,.4,1) both}
.seq>*:nth-child(2){animation-delay:.55s}.seq>*:nth-child(3){animation-delay:1.1s}.seq>*:nth-child(4){animation-delay:1.65s}.seq>*:nth-child(5){animation-delay:2.2s}.seq>*:nth-child(6){animation-delay:2.75s}
.noanim .seq>*,.noanim .late,.noanim .later{animation:none}

/* ambient */
#amb{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#amb span{position:absolute; bottom:-70px; opacity:0; animation:ambUp linear infinite}
@keyframes ambUp{0%{transform:translateY(0) rotate(0); opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-118vh) rotate(var(--r)); opacity:0}}
#scard{position:fixed; inset:0; z-index:45; display:grid; place-items:center; pointer-events:none; opacity:0; visibility:hidden}
#scard::before{content:""; position:absolute; inset:0; background:rgba(3,4,14,.76); backdrop-filter:blur(6px)}
#scard .in{position:relative; text-align:center; padding:0 20px}
#scard .e{font-size:clamp(70px,10vw,120px); line-height:1; filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
#scard .k{font-family:var(--mono); letter-spacing:.22em; color:var(--cyan); margin-top:18px; font-size:15px; font-weight:700}
#scard h2{font-family:var(--dsp); font-weight:900; font-size:clamp(30px,5vw,62px); margin-top:6px; text-shadow:0 6px 30px #000; letter-spacing:-.02em}
#scard.on{visibility:visible; animation:scardIn 1.25s cubic-bezier(.2,.8,.2,1) forwards}
#scard.on .in{animation:scardScale 1.25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes scardIn{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0; visibility:hidden}}
@keyframes scardScale{0%{transform:scale(.86) translateY(24px)}22%{transform:none}100%{transform:scale(1.05)}}

/* student app */
#student{display:none; position:fixed; inset:0; z-index:80; background:var(--ink); flex-direction:column}
body.student #student{display:flex}
body.student #app, body.student #wm{display:none}
.stu-top{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--edge); background:rgba(255,255,255,.03)}
.stu-top b{font-family:var(--dsp); font-weight:900; font-size:14px; letter-spacing:.02em}
.stu-body{flex:1; overflow:auto; padding:18px 16px 30px; max-width:560px; width:100%; margin:0 auto; position:relative; z-index:1}
.stu-foot{display:flex; justify-content:space-around; padding:10px; border-top:1px solid var(--edge); background:rgba(255,255,255,.03)}
.stu-foot button{font-size:28px; padding:6px 10px; border-radius:12px}
.stu-card{padding:22px}
.stu-card input,.stu-card textarea{width:100%; margin-top:8px; padding:14px 16px; font-size:19px; border-radius:14px; background:rgba(0,0,0,.3); border:1.5px solid var(--edge2)}
.stu-card textarea{min-height:70px; resize:vertical}
.stu-card label{display:block; margin-top:14px; font-weight:800; font-size:15px; color:#CDB8FF}
.stu-wait{text-align:center; padding:46px 10px}
.stu-wait .bigi{font-size:64px}
.opts{display:grid; gap:10px; margin-top:12px}
.opt{display:flex; gap:12px; align-items:center; padding:14px 16px; border-radius:16px; background:var(--glass); border:1.5px solid var(--edge2); text-align:left; font-size:18px; font-weight:700}
.opt .L{flex:0 0 34px; height:34px; border-radius:10px; display:grid; place-items:center; background:rgba(255,255,255,.1); font-family:var(--mono)}
.opt.sel{border-color:var(--cyan); background:rgba(61,232,255,.12)}
.opt.sel .L{background:var(--cyan); color:#03141C}
.opt.right{border-color:var(--ok); background:rgba(75,227,160,.14)}
.smrow{padding:12px 0; border-bottom:1px dashed var(--edge2)}
.smrow b{display:block; font-size:18px; margin-bottom:8px}
.smrow .lets{display:flex; gap:8px}
.smrow .lets button{flex:1; height:46px; border-radius:12px; border:1.5px solid var(--edge2); font-family:var(--mono); font-weight:700; font-size:18px}
.smrow .lets button.sel{background:var(--violet); border-color:var(--violet)}
.smrow .lets button.right{background:var(--ok); border-color:var(--ok); color:#04201A}
.smeans{display:grid; gap:6px; margin-top:10px; font-size:15px}
.smeans div{padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.05)}
.smeans b{font-family:var(--mono); color:var(--cyan); margin-right:6px}
.connst{font-size:13px; font-weight:700}
.stu-story{padding:20px; border-radius:22px; background:linear-gradient(160deg,#16204A,#0C1030); border:1px solid var(--edge2); text-align:center}
.stu-story .e{font-size:60px}

/* responsive */
@media (max-width:1100px){ .board{grid-template-columns:repeat(3,1fr)} }
@media (max-width:980px){
  .two,.two.wide-l,.two.wide-r{grid-template-columns:1fr}
  .tools .lb{display:none}
  .navr .lb{display:none}
  .track{max-width:none}
  .choices{grid-template-columns:1fr}
}
@media (max-width:640px){ .mgrid{grid-template-columns:1fr} }
@media (max-width:720px){
  body{font-size:17px}
  .shead .thumb{width:60px; height:60px; flex-basis:60px; border-radius:18px; font-size:30px}
  .shead .thumb::before{border-radius:15px}
  .cast{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  #top{flex-wrap:wrap; padding:8px 10px; gap:8px}
  .brand span{display:none}
  .track{order:5; flex-basis:100%; min-width:0; grid-template-columns:auto 1fr}
  .sus i{width:26px; height:26px; font-size:13px; border-radius:8px}
  .tools{gap:5px; margin-left:auto} .tools .hm{display:none}
  .tb{height:40px; min-width:40px; padding:0 9px}
  .wrap{padding:18px 12px 40px}
  #nav{flex-wrap:wrap; padding:8px 10px; gap:8px}
  #navMid{order:-1; flex-basis:100%}
  #dots{display:none}
  .navr{flex:1; justify-content:flex-end; gap:6px}
  .navr .btn,#btnBack{padding:8px 12px; min-height:44px; font-size:15px}
  .phone{max-width:340px; border-radius:40px}
  .phone .scr{min-height:520px; border-radius:30px}
  .lock .clk{font-size:68px}
  .story,.match,.qcard,.card,.kitm,.missionb{padding:18px}
  .spot{padding:18px} .spot .line{grid-template-columns:1fr; gap:4px}
  #dock{left:10px; right:10px; width:auto; bottom:120px}
  #wm{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) 48px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0s!important; transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="amb" aria-hidden="true"></div>
<div id="app">
  <header id="top">
    <a class="tb" id="backHub" href="../../" title="Back to the course" aria-label="Back to the course">←</a>
    <div class="brand"><b>LESSON 17</b><span>Who’s Controlling the Scroll?</span></div>
    <div class="track" aria-label="Mission tracker">
      <div class="sus" id="sus" title="Suspects found"></div>
      <div>
        <div class="ctl-l"><span class="fd">📱 FEED <b id="ctlFeed">90%</b></span><span>WHO’S IN CONTROL?</span><span class="mi">MIA <b id="ctlMia">10%</b></span></div>
        <div class="mbar" id="ctlBar" role="progressbar" aria-label="Mia’s control" aria-valuemin="0" aria-valuemax="100"><i id="ctlFill"></i></div>
      </div>

<script>
/* ---------- 5 · components ---------- */
/* {v|shown|key} → pink new phrase · {r|shown|key} → blue review phrase */
function hl(s){
  return String(s).replace(/\{(v|r)\|([^|}]*)\|([^}]*)\}/g,(m,t,shown,key)=>`<mark class="${t} ${S.unl[key]?'open':''}" data-w="${esc(key)}">${shown}</mark>`);
}
const plain = s => String(s).replace(/\{(v|r)\|([^|}]*)\|[^}]*\}/g,'$2').replace(/<[^>]+>/g,'');
function sbar(time,o={}){
  return `<div class="sbar"><span>${time}</span><span class="ic"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span><span class="bat ${o.bat<20?'low':''}"><i style="width:${o.bat||72}%"></i></span></span></div>`;
}
const phone = (time, inner, o={}) => `<div class="phone ${o.cls||''}" ${o.id?`id="${o.id}"`:''}><div class="scr">${sbar(time,o)}${inner}</div></div>`;
const ncard = (ic, app, txt, o={}) => `<div class="ncard ${o.cls||''}" ${o.style?`style="${o.style}"`:''}><span class="ai" ${o.bg?`style="background:${o.bg}"`:''}>${ic}</span><div><b>${esc(app)}</b><div class="t">${txt}</div></div><small>${o.t||'now'}</small></div>`;
const storyCard = (lines, o={}) => `<div class="story ${o.cls||''}"><div class="kick">${o.kick||'📖 Story'}</div>${lines.map(l=>`<p>${hl(l)}</p>`).join('')}${o.after||''}</div>`;
function foundCard(k, anim){
  const i=SUSPECTS.findIndex(s=>s.k===k), s=SUSPECTS[i];
  return `<div class="found ${anim?'fx':''}"><span class="e">${s.e}</span><div><div class="k">SUSPECT #${i+1} FOUND</div><b>${esc(s.n)}</b><span class="small">${esc(s.line)}</span></div></div>`;
}
function sceneMin(n){ return Math.round(STEPS.filter(s=>s.sc===n).reduce((a,s)=>a+s.min,0)*2)/2; }
function sceneHead(st){
  const sc=SCENES[st.sc-1];
  return `<div class="shead"><div class="thumb" aria-hidden="true"><span>${sc.e}</span></div><div class="grow">
    <div class="kick">Scene ${sc.n} of ${SCENES.length} · ≈ ${sceneMin(sc.n)} min</div>
    <h1 class="${sc.t.length>24?'long':''}">${esc(sc.t)}</h1>
    ${(st.opt||st.chip)?`<div class="meta">${st.opt?'<span class="tag opt">⏭ EXTRA — SKIP IF NEEDED</span>':''}${st.chip?`<span class="tag">${esc(st.chip)}</span>`:''}</div>`:''}
  </div></div>`;
}
/* polls: live phone votes + hands the teacher taps */
function counts(id,n){ const out=Array(n).fill(0); Object.values(S.lv[id]||{}).forEach(v=>{ if(Number.isInteger(v)&&v>=0&&v<n) out[v]++; }); const t=S.taps[id]||[]; return out.map((c,i)=>c+(t[i]||0)); }
function winner(id,n,def){ const c=counts(id,n), m=Math.max(...c); return m>0 ? c.lastIndexOf(m) : def; }
function poll(id, q, opts, o={}){
  const n=counts(id,opts.length), tot=n.reduce((a,b)=>a+b,0), w=o.win?winner(id,opts.length,-1):-1;
  return `<div class="card ${o.cls||''}">${q?`<div class="mid">${esc(q)}</div>`:''}
    <div class="poll">${opts.map((op,i)=>{
      const pct=tot?Math.round(n[i]/tot*100):0;
      return `<button class="popt ${i===w&&tot?'win':''}" data-tap="${id}" data-i="${i}" title="Tap to count a hand">
        <span class="fill" style="width:${pct}%"></span><span class="L">${LET[i]}</span><span>${esc(op)}</span><span class="n">${n[i]?n[i]:''}${n[i]?`<span class="pc">${pct}%</span>`:''}</span></button>`; }).join('')}</div>
    <div class="row" style="margin-top:12px"><span class="small grow">${o.note||'Tap an option to count hands · phones in 📡 Live mode add their votes.'}</span>
      ${tot?`<button class="btn sm ghost" data-clr="${id}">Clear votes</button>`:''}</div></div>`;
}
function bindPoll(root){
  $$('[data-tap]',root).forEach(b=>b.onclick=()=>{ const id=b.dataset.tap, i=+b.dataset.i; const t=S.taps[id]=S.taps[id]||[]; t[i]=(t[i]||0)+1; SFX.pop(); save(); draw(false,true); });
  $$('[data-clr]',root).forEach(b=>b.onclick=()=>{ const id=b.dataset.clr; delete S.taps[id]; delete S.lv[id]; save(); draw(false,true); });
}
/* quiz: one right answer; clicking shows right / wrong */
function quizHTML(id, Q, d, o={}){
  const n=counts(id,Q.opts.length), pk=d.pick||[];
  return `<div class="card qcard ${o.cls||''}">${o.top||''}<p class="big" style="font-size:clamp(22px,2.5vw,31px)">${esc(Q.q)}</p>
    <div class="poll">${Q.opts.map((op,i)=>{ const right=(d.shown||pk.includes(i))&&i===Q.a, wrong=pk.includes(i)&&i!==Q.a&&!d.shown;
      return `<button class="popt ${right?'right':''} ${wrong?'wrongpick':''} ${d.shown&&i!==Q.a?'dim':''} ${FX.has('pick'+i)?'fx':''}" data-q="${i}"><span class="L">${LET[i]}</span><span>${esc(op)}</span><span class="n">${n[i]||''}</span></button>`; }).join('')}</div>
    <div class="small" style="margin-top:10px">${d.shown?'✅ Correct!':'Click the answer the class chooses · 📱 numbers = phone votes'}</div>${d.shown&&o.after?o.after:''}</div>`;
}
function bindQuiz(root, Q, d, onRight){
  $$('[data-q]',root).forEach(b=>b.onclick=()=>{ const i=+b.dataset.q; d.pick=d.pick||[]; if(!d.pick.includes(i)) d.pick.push(i); FX.add('pick'+i);
    if(i===Q.a){ d.shown=true; SFX.ok(); onRight&&onRight(); } else SFX.no(); save(); draw(false,true); });
  if(FX.has('pick'+Q.a) || (FX.has('reveal') && d.shown)) burst($(`[data-q="${Q.a}"]`,root));
}
const quizLive = (id,Q,d) => ({kind:'choice', id, q:Q.q, opts:Q.opts, lock:!!d.shown, correct:d.shown?Q.a:undefined});

/* matching: click a phrase, then a meaning (the next phrase becomes active automatically) */
function matchHTML(id, set, d){
  const m=d.m||{}, res=d.res||[], act=d.act||0, used=Object.values(m);
  const phones=Object.values(S.lv[id]||{}), np=phones.length;
  let pc=''; if(np){ const ok=phones.reduce((a,v)=>a+set.items.filter((it,i)=>v&&v[i]===it.k).length,0); pc = d.done ? ` · ${Math.round(ok/(np*set.items.length)*100)}% correct` : ''; }
  return `<div class="match"><h3>🧩 ${esc(set.title)}</h3>
    <div class="small">${d.done?'Tap a phrase to open its card 👆':'1 · Click a phrase &nbsp; 2 · Click its meaning'}</div>
    <div class="mgrid"><div class="mrows">${set.items.map((it,i)=>{
      const has=!!m[i], st=res[i]===true?'ok':res[i]===false?'no':'';
      const g=GLOSS[it.ph]||{};
      return `<button class="mrow ${!d.done&&i===act?'act':''} ${has?'has':''} ${st} ${FX.has('chk')?'fx':''}" data-mi="${i}" ${d.done?`data-w="${esc(it.ph)}"`:''}>
        <span class="ph">${esc(it.sub||it.ph)}${d.done&&S.uaOn&&g.ua?`<span class="ua">🇺🇦 ${esc(g.ua)}</span>`:''}</span><span class="slot">${m[i]||'?'}</span></button>`; }).join('')}</div>
    <div class="mopts">${set.means.map(x=>`<button class="mopt ${used.includes(x.L)?'used':''}" data-ml="${x.L}" ${d.done?'disabled':''}><span class="L">${x.L}</span><span>${esc(x.t)}</span></button>`).join('')}</div></div>
    <div class="mfoot">${d.done?`<span class="mverdict ok">✅ All matched!</span>`
      :`<button class="btn sm cyan" id="mChk" ${used.length<set.items.length?'disabled':''}>✓ Check</button><button class="btn sm ghost" id="mClr" ${used.length?'':'disabled'}>Clear</button>
        ${d.chk?`<span class="mverdict no">${res.filter(x=>x===false).length} not right yet — try again</span>`:''}`}
      <span class="grow"></span>${np?`<span class="phones">📱 ${np} answered${pc}</span>`:''}</div></div>`;
}
function bindMatch(root, id, set, d){
  d.m=d.m||{};
  $$('[data-mi]',root).forEach(b=>b.onclick=e=>{ if(d.done) return; d.act=+b.dataset.mi; if(d.m[d.act]){ delete d.m[d.act]; if(d.res) d.res[d.act]=null; } SFX.pop(); save(); draw(false,true); });
  $$('[data-ml]',root).forEach(b=>b.onclick=()=>{
    if(d.done) return; const L=b.dataset.ml, a=d.act||0;
    for(const k in d.m) if(d.m[k]===L) { delete d.m[k]; if(d.res) d.res[k]=null; }
    d.m[a]=L; if(d.res) d.res[a]=null;
    let nx=-1; for(let j=1;j<=set.items.length;j++){ const k=(a+j)%set.items.length; if(!d.m[k]){ nx=k; break; } }
    d.act = nx>=0?nx:a; SFX.pop(); save(); draw(false,true);
  });
  const c=$('#mChk',root); if(c) c.onclick=()=>checkMatch(set,d);
  const x=$('#mClr',root); if(x) x.onclick=()=>{ d.m={}; d.res=[]; d.chk=false; d.act=0; save(); draw(false,true); };
  if(FX.has('alldone')) setTimeout(()=>burst($('.match',root),['✨','💚','⭐']),60);
}
function checkMatch(set,d){
  d.res=set.items.map((it,i)=>d.m[i]===it.k); d.chk=true; FX.add('chk');
  if(d.res.every(Boolean)){ finishMatch(set,d); SFX.ok(); }
  else { SFX.no(); const k=d.res.findIndex(x=>!x); d.act=k; }
  save(); draw(false,true);
}
function finishMatch(set,d){ d.done=true; set.items.forEach((it,i)=>{ d.m[i]=it.k; S.unl[it.ph]=true; }); d.res=set.items.map(()=>true); FX.add('alldone'); }
function matchHint(set,d){ d.m=d.m||{}; const k=set.items.findIndex((it,i)=>d.m[i]!==it.k); if(k<0) return;
  const it=set.items[k]; for(const j in d.m) if(d.m[j]===it.k) delete d.m[j]; d.m[k]=it.k; if(d.res) d.res[k]=null; d.act=k; toast('💡 One pair filled in: '+(it.sub||it.ph)+' → '+it.k); }
const matchLive = (id,set,d) => ({kind:'match', id, items:set.items.map(it=>it.sub||it.ph), means:set.means, lock:!!d.done, key:d.done?set.items.map(it=>it.k):undefined});

function hintBox(d, html){ return d.hint?`<div class="hintbox pop-in">${html}</div>`:''; }
function starters(list){ return `<div class="starters">${list.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`; }
const FX = new Set();
const fx = k => FX.has(k) ? 'fx' : '';
let LOOPS = [], TOUTS = [];
function loop(fn, ms){ LOOPS.push(setInterval(fn, ms)); }
function later(fn, ms){ TOUTS.push(setTimeout(fn, ms)); }
function burst(el, set=['✨','⭐','💥','✨']){
  if(!el || REDUCED) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.className='spark'; s.textContent=set[i%set.length];
    const a=Math.random()*Math.PI*2, dd=60+Math.random()*90;
    s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+r.height/2)+'px';
    s.style.setProperty('--dx',Math.cos(a)*dd+'px'); s.style.setProperty('--dy',Math.sin(a)*dd+'px'); s.style.setProperty('--r',(Math.random()*120-60)+'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(),950); }
}
/* the word card (opens only after the phrase has been matched) */
function wordCard(key){

const WAVE = Array.from({length:60},(_,i)=>Math.round(18+42*Math.abs(Math.sin(i*1.7)*Math.cos(i*.37))+ (i%7===0?14:0)));
const Player = {
  playing:false, idx:0, prog:0, tok:0, audio:null, rate:1, t0:0, raf:0,
  w: LISTEN.map(p=>p.split(/\s+/).length),
  est(i){ return this.w[i]/(2.55*this.rate); },
  total(){ return this.w.reduce((a,_,i)=>a+this.est(i),0); },
  play(){
    if(this.playing) return this.pause();
    if(this.idx>=LISTEN.length){ this.idx=0; this.prog=0; }
    if(CFG.AUDIO_FILE){
      if(!this.audio){ this.audio=new Audio(CFG.AUDIO_FILE); this.audio.onended=()=>{ this.playing=false; this.idx=LISTEN.length; this.prog=1; this.paint(); };
        this.audio.onerror=()=>{ toast('Audio file not found — using the browser voice'); CFG.AUDIO_FILE=''; this.audio=null; this.playing=false; this.play(); }; }
      this.audio.playbackRate=this.rate; this.audio.play().catch(()=>{}); this.playing=true; this.loop(); this.paint(); return;
    }
    if(!('speechSynthesis' in window)){ toast('No speech voice in this browser — read the transcript aloud'); sd('listen').script=true; save(); draw(false,true); return; }
    speechSynthesis.cancel(); this.playing=true; const tk=++this.tok; this.paint(); this.loop();
    const speakOne=()=>{
      if(tk!==this.tok) return;
      if(this.idx>=LISTEN.length){ this.playing=false; this.prog=1; this.paint(); return; }
      const u=new SpeechSynthesisUtterance(LISTEN[this.idx]); const v=Voice.m; if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
      u.rate=.94*this.rate; u.pitch=Voice.m?1:.85;
      u.onstart=()=>{ this.t0=performance.now(); };
      u.onend=()=>{ if(tk!==this.tok) return; this.idx++; this.t0=performance.now(); setTimeout(speakOne,350); };
      u.onerror=()=>{ if(tk!==this.tok) return; this.idx++; speakOne(); };
      this.t0=performance.now(); speechSynthesis.speak(u);
    };
    speakOne();
  },
  pause(){ this.playing=false; this.tok++; if(this.audio) this.audio.pause(); else if('speechSynthesis' in window) speechSynthesis.cancel(); this.paint(); },
  stop(){ if(this.playing) this.pause(); },
  restart(){ this.pause(); this.idx=0; this.prog=0; if(this.audio) this.audio.currentTime=0; this.paint(); this.play(); },
  loop(){ cancelAnimationFrame(this.raf); const f=()=>{ if(!this.playing) return; this.calc(); this.paint(); this.raf=requestAnimationFrame(f); }; this.raf=requestAnimationFrame(f); },
  calc(){
    if(this.audio && CFG.AUDIO_FILE){ const du=this.audio.duration||1; this.prog=Math.min(1,this.audio.currentTime/du); this.idx=Math.min(LISTEN.length-1,Math.floor(this.prog*LISTEN.length)); return; }
    const T=this.total(); let before=0; for(let i=0;i<Math.min(this.idx,LISTEN.length);i++) before+=this.est(i);
    const cur = this.idx<LISTEN.length ? Math.min(this.est(this.idx),(performance.now()-this.t0)/1000) : 0;
    this.prog=Math.min(1,(before+cur)/T);
  },
  paint(){
    const b=$('#vplay'); if(!b) return;
    b.textContent=this.playing?'❚❚':'▶'; b.classList.toggle('on',this.playing); $('#vm')?.classList.toggle('on',this.playing);
    const n=Math.round(this.prog*WAVE.length); $$('#wave i').forEach((el,i)=>el.classList.toggle('p',i<n));
    const T=this.audio&&CFG.AUDIO_FILE&&this.audio.duration?this.audio.duration:this.total();
    $('#vtm').textContent=`${mmss(this.prog*T)} / ${mmss(T)}`;
    $$('.script p').forEach((p,k)=>p.classList.toggle('cur', this.playing && k===this.idx));
    const st=$('#vst'); if(st) st.textContent=this.playing?'Playing…':this.prog>=1?'Finished ✓':this.prog>0?'Paused':'Tap ▶ to listen';
  }
};

  reveal(d){ if(d.out) return; const r=d.round||0, c=counts('ping-'+r,2); if(!c[0]&&!c[1]){ toast('No votes yet — click the button the class chooses'); return; } setOut(d, c[1]>=c[0]?'leave':'check', true); }, revealLbl:'Use class vote',
  live(){ const d=sd('ping'); return d.out==='leave'?null:{kind:'choice', id:'ping-'+(d.round||0), q:'🔔 PING! What should Mia do?', opts:['CHECK IT NOW','LEAVE IT FOR LATER'], lock:!!d.out}; }
});
function setOut(d,o,noDraw){ d.out=o; FX.add('out'); if(o==='check') SFX.no(); save(); if(!noDraw) draw(false,true); }

/* Scene 16 · Final poll ─────────────────────────────── */
STEPS.push({
  id:'fpoll', sc:16, name:'Final class poll', min:0.5, chip:'Final poll',
  say:'Be honest: who controls your scroll?',
  note:'Чесне голосування — без правильної відповіді й без оцінок. Можна коментувати з гумором.',
  ans:['Правильної відповіді немає.'], uaT:['То хто керує твоїм гортанням? — Я / Здебільшого я / Чесно… мабуть, телефон / Залежить'],
  render(){ return `<div class="two wide-l"><div>${poll('fpoll','So… who controls your scroll?',FINAL_POLL,{win:true})}</div>
    <div style="display:grid;gap:16px;align-content:start">${say('mia','Me? Mostly me… now. 😅',{size:64})}${say('leo','Honest answers only! 😄',{size:64})}</div></div>`; },
  bind:bindPoll,
  live:()=>({kind:'choice', id:'fpoll', q:'So… who controls your scroll?', opts:FINAL_POLL})
});

/* Scene 17 · Mission Complete ─────────────────────────────── */
STEPS.push({
  id:'summary', sc:17, name:'Mission complete + word cards', min:0.5,
  say:'Mission complete! Tap a phrase to check its meaning.',
  note:'Коротке завершення. Клацайте фрази-чіпи: значення англійською, переклад і приклад. Можна попросити учнів назвати 3 фрази, які вони використали сьогодні.',
  ans:['—'], uaT:['Сьогодні ви навчилися говорити про сповіщення, звички гортання, увагу, лайки, перегляд серіалів підряд, відволікання та повернення контролю.'],
  render(){
    RECAP.forEach(w=>S.unl[w]=true);
    return `<div class="final ${FX.has('enter')?'pop-in':''}"><div class="stampx ${FX.has('enter')?'fx':''}" style="border-color:var(--cyan);color:var(--cyan)">MISSION COMPLETE 🏁</div>
        <div class="board mt" style="grid-template-columns:repeat(6,1fr)">${SUSPECTS.map(s=>`<div class="susc f"><span class="e">${s.e}</span><b>${esc(s.n)}</b></div>`).join('')}<div class="susc you">${av('you',54)}<b>YOU</b><small>decide</small></div></div>
        <div class="moral" style="font-size:clamp(20px,2.4vw,30px)">${MORAL}</div></div>
      <div class="two mt"><div class="card"><div class="kick">Today you learned how to talk about</div><div class="topics mt" style="margin-top:12px">${TOPICS.map(t=>`<div><span>${t[0]}</span>${esc(t[1])}</div>`).join('')}</div></div>
        <div class="card"><div class="kick">🗂️ Tap a phrase</div><div class="chips" style="margin-top:12px">${RECAP.map((w,i)=>`<button class="chip ${['','c2','c3'][i%3]}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}${S.unl.plug?'<button class="chip x" data-w="plug">plug something · bonus</button>':''}</div></div></div>`;
  },
  bind(){ if(!sd('summary').conf){ sd('summary').conf=1; save(); confetti(); } }
});
</script>
<script>
/* ---------- 7 · navigation, chrome, timer, clock ---------- */
const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt); };
const cur = ()=> STEPS[S.i] || STEPS[0];
const nparts = s => s.parts ? s.parts() : 1;

function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; FX.add('part'); save(); draw(true,true); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else toast('That’s the end of the lesson 🎉');
}
function back(){
  const s=cur(), d=sd(s.id);
  if((d.p||0)>0){ d.p--; save(); draw(true,true); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--;
  if(k>=0) go(k);
}
function go(k){
  const prev=cur().sc; S.i=k; clockStart(); FX.add('enter');
  if(STEPS[k].sc>prev) for(let n=prev;n<STEPS[k].sc;n++) S.done[n]=true;
  if(STEPS[k].sc!==12) Player.stop();
  save(); if(STEPS[k].sc!==prev) sceneCard(STEPS[k].sc); draw(true); $('#stage').scrollTop=0;
}
/* short, non-blocking title card when a new scene starts */
function sceneCard(n){
  if(REDUCED || ROLE!=='teacher') return; const sc=SCENES[n-1], el=$('#scard');
  el.innerHTML=`<div class="in"><div class="e">${sc.e}</div><div class="k">SCENE ${sc.n} OF ${SCENES.length}</div><h2>${esc(sc.t)}</h2></div>`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  SFX.tone(420,.18,'sine',.05); SFX.tone(840,.22,'sine',.04,.12);
}
/* who controls the scroll: 0 = the feed, 100 = Mia */
function stepCtl(){
  const s=cur();
  if(s.id==='ping'){ const o=sd('ping').out; return o==='leave'?100:o==='check'?72:88; }
  if(s.id==='settings') return (sd('settings').p||0)>=1?92:86;
  return SCENES[s.sc-1].ctl;
}
function foundSet(){
  const f={}; SUSPECTS.forEach(s=>{ const k=STEPS.findIndex(x=>x.id===s.step); if(S.i>k || (S.i===k && (sd(s.step).p||0)>=s.p)) f[s.k]=true; }); return f;
}
let SUS='', CTL=null, AMB='';
function paintTrack(){
  const f=foundSet(), key=Object.keys(f).join(',');
  const old=SUS.split(',');
  $('#sus').innerHTML=SUSPECTS.map((s,i)=>`<i class="${f[s.k]?'f':''} ${f[s.k]&&SUS!==''&&!old.includes(s.k)?'new':''}" title="${f[s.k]?esc(s.n):'Suspect #'+(i+1)+' — not found yet'}">${f[s.k]?s.e:'?'}</i>`).join('');
  SUS=key;
  const c=stepCtl(); $('#ctlFill').style.width=c+'%'; $('#ctlMia').textContent=c+'%'; $('#ctlFeed').textContent=(100-c)+'%';
  $('#ctlBar').setAttribute('aria-valuenow',c);
  if(CTL!==null && c<CTL){ const b=$('#ctlBar'); b.classList.remove('drop'); void b.offsetWidth; b.classList.add('drop'); }
  CTL=c; document.body.classList.toggle('calm', c>=70);
  const band = c<30?'chaos':c<70?'mid':'calm'; if(band===AMB) return; AMB=band;
  const box=$('#amb'); if(REDUCED){ box.innerHTML=''; return; }
  const set={chaos:['🔔','❤️','▶️','💬','🔴','📳','👀'], mid:['🔔','❤️','💬','✨','🔕'], calm:['✨','🌙','💚','🛡️','📚']}[band];
  const num={chaos:20, mid:13, calm:9}[band], sp={chaos:[9,10], mid:[13,12], calm:[18,14]}[band];
  box.innerHTML=Array.from({length:num},(_,i)=>`<span style="left:${Math.round(Math.random()*96)}%;font-size:${18+Math.round(Math.random()*24)}px;--o:${(.05+Math.random()*.07).toFixed(2)};--r:${Math.round(Math.random()*120-60)}deg;animation-duration:${sp[0]+Math.round(Math.random()*sp[1])}s;animation-delay:-${Math.round(Math.random()*20)}s">${set[i%set.length]}</span>`).join('');
}
function nextNonOpt(from){ let k=from; while(k<STEPS.length && (STEPS[k].opt || !visible(k))) k++; return k; }
function canSkip(){ const s=cur(); if(s.opt) return true; let k=S.i+1; while(k<STEPS.length && !visible(k)) k++; return !!(STEPS[k] && STEPS[k].opt); }
function skipOpt(){ const s=cur(); const k=nextNonOpt(s.opt?S.i:S.i+1); if(k<STEPS.length){ go(k); toast('Extra task skipped'); } }

/* breakout timer: keeps running across screens and page refreshes */
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  start(){ if(this.left()<=0) S.timer.left=S.timer.total; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  reset(){ S.timer.left=S.timer.total; S.timer.endAt=0; save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');
    const show = this.run() || (S.timer.left<S.timer.total && S.timer.left>0) || cur().sc===14;
    chip.classList.toggle('hidden', !show || ROLE==='student');
    $('#tchipT').textContent=mmss(l); chip.classList.toggle('warn', this.run());
    const bc=$('#bigClock'), rf=$('#ringFg'), rg=$('#ring'); if(bc){ bc.textContent=mmss(l); bc.classList.toggle('end',l<=0); }
    if(rf) rf.style.strokeDashoffset=(326.73*(1-l/S.timer.total)).toFixed(1); if(rg) rg.classList.toggle('hurry', this.run() && l<=30 && l>0);
    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.bell(); toast('⏰ Time’s up! Close the breakout rooms.'); pubState(); if(cur().id==='kit'){ draw(false,true); burst($('#ring'),['⏰','🔔','✨']); } }
  }
};
$('#tchip').onclick=()=>{ const k=STEPS.findIndex(s=>s.id==='kit'); if(S.i!==k) go(k); else { TIMER.run()?TIMER.pause():TIMER.start(); draw(false,true); } };

/* lesson clock for the teacher (starts on the first Continue) */
function clockStart(){ if(!S.clock.start && !S.clock.paused){ S.clock.start=Date.now(); } }
const clockNow = ()=> (S.clock.acc||0) + (S.clock.start? (Date.now()-S.clock.start)/1000 : 0);
function routeMin(core){ return Math.round(STEPS.reduce((m,s)=> m + (core&&s.opt?0:s.min), 0)); }

function draw(anim, keepScroll){
  const s=cur(), d=sd(s.id);
  const st=$('#stage'), top=st.scrollTop;
  LOOPS.forEach(clearInterval); LOOPS=[]; TOUTS.forEach(clearTimeout); TOUTS=[];
  $('#scene').innerHTML=`<div class="${anim&&!keepScroll?'scene-in':''}">${sceneHead(s)}${s.render(d)}</div>`;
  s.bind && s.bind($('#scene'), d);
  if(!anim || keepScroll) st.scrollTop=top;
  paintChrome(); pubState(); if($('#teacher').classList.contains('on')) paintTeacher(); paintDock();
  FX.clear();
}
function paintChrome(){
  const s=cur(), d=sd(s.id), sc=SCENES[s.sc-1], n=nparts(s), p=(d.p||0);
  $('#navInfo').innerHTML=`<b>Scene ${sc.n}/${SCENES.length}</b> · ${esc(sc.t)}${n>1?` · ${p+1}/${n}`:''}${s.opt?' · <span class="opt">extra</span>':''}`;
  $('#dots').innerHTML=SCENES.map(x=>{ const allOpt=STEPS.filter(t=>t.sc===x.n).every(t=>t.opt);
    return `<button class="${x.n<sc.n||S.done[x.n]?'done':''} ${x.n===sc.n?'cur':''} ${allOpt?'x':''}" data-sc="${x.n}" aria-label="Scene ${x.n}: ${esc(x.t)}" title="Scene ${x.n}: ${esc(x.t)}${allOpt?' (extra)':''}"></button>`; }).join('');
  $$('#dots [data-sc]').forEach(b=>b.onclick=()=>{ const k=STEPS.findIndex((x,i)=>x.sc===+b.dataset.sc && visible(i)); if(k>=0) go(k); else toast('That scene is extra — switch to the Full route'); });
  $('#btnHint').disabled=!s.hint; $('#btnHint').querySelector('.lb').textContent=s.hintLbl||'Help';
  $('#btnShow').disabled=!s.reveal; $('#btnShow').querySelector('.lb').textContent=s.revealLbl||'Show answer';
  $('#btnSkip').classList.toggle('hidden', !canSkip());
  const atEnd = p>=n-1; let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  const custom = s.nextLbl && s.nextLbl(d);
  $('#nextLbl').textContent = custom || (!atEnd ? 'Continue' : (k>=STEPS.length?'Finish':'Continue'));
  $('#btnBack').disabled = S.i===0 && p===0;
  $('#routeLbl').textContent=S.core?'Core':'Full'; $('#btnRoute').classList.toggle('on',S.core);
  paintTrack(); TIMER.tick();
}

/* ---------- 8 · teacher mode, scene menu, reset ---------- */
function openModal(html, cls=''){ $('#modalBox').className='box '+cls; $('#modalBox').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function copy(text,msg){ (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(msg)).catch(()=>{ openModal(`<h2 class="mid">Copy this text</h2><textarea style="width:100%;height:280px;margin-top:12px;background:#000;border-radius:12px;padding:12px">${esc(text)}</textarea><div class="row mt"><button class="btn" onclick="closeModal()">Close</button></div>`); }); }

function mapHTML(){
  let h='', last=0;
  STEPS.forEach((s,i)=>{
    if(s.sc!==last){ last=s.sc; const sc=SCENES[s.sc-1]; h+=`<div class="sn">${sc.e} ${sc.n} · ${esc(sc.t.toUpperCase())} · ≈${sceneMin(sc.n)} min ${S.done[sc.n]?'<span class="ck">✓</span>':''}</div>`; }
    h+=`<button class="${i===S.i?'cur':''} ${visible(i)?'':'skip'}" data-go="${i}"><span>${esc(s.name)}</span>${s.opt?'<span class="tag opt" style="font-size:10px;padding:1px 6px">extra</span>':''}<span class="m">${s.min} min</span></button>`;
  });
  return `<div class="tmap">${h}</div>`;
}
function bindMap(root){ $$('[data-go]',root).forEach(b=>b.onclick=()=>{ const k=+b.dataset.go; if(!visible(k)){ S.core=false; toast('Full route on — extra task shown'); } closeModal(); go(k); }); }
function showMap(){
  openModal(`<div class="row"><h2 class="dsp grow" style="font-size:32px">Scenes</h2><button class="btn sm ghost" onclick="closeModal()" aria-label="Close">✕</button></div>
    <p class="small">Jump to any screen. Core ≈ ${routeMin(true)} min · Full ≈ ${routeMin(false)} min.</p>${mapHTML()}
    <div class="row mt"><button class="btn sm danger" id="mReset">⟲ Reset lesson</button></div>`);
  bindMap($('#modalBox')); $('#mReset').onclick=askReset;
}
function askReset(){
  openModal(`<h2 class="dsp" style="font-size:32px">Reset lesson?</h2>
    <p class="mid mt">Everything goes back to Scene 1: answers, votes, team kits, timer and the route. A new room code is created for phones.</p>
    <p class="small">Use this before a new group. It can’t be undone.</p>
    <div class="row mt2"><button class="btn danger solid" id="rsYes">⟲ Yes, reset the lesson</button><button class="btn ghost" id="rsNo">Cancel</button></div>`);
  $('#rsNo').onclick=closeModal;
  $('#rsYes').onclick=()=>{ if(LIVE.on){ Net.send({t:'end'}); Net.stop(); } try{ localStorage.removeItem(KEY); }catch(e){} const snd=S.sound; S=FRESH(); S.sound=snd; save(); LIVE.on=false; WALLQ.length=0; Player.stop(); Player.idx=0; Player.prog=0;
    closeModal(); toggleTeacher(false); $('#btnLive').classList.remove('on'); SUS=''; go(0); toast('Lesson reset — ready for a new group'); };
}
function resetTask(){
  const s=cur(); delete S.sd[s.id];
  const hit = k => k===s.id || k.startsWith(s.id+'-');
  [S.lv,S.taps,S.wall].forEach(o=>Object.keys(o).forEach(k=>{ if(hit(k)) delete o[k]; }));
  for(let i=WALLQ.length-1;i>=0;i--) if(hit(WALLQ[i].task)) WALLQ.splice(i,1);
  if(s.id==='listen'){ Player.stop(); Player.idx=0; Player.prog=0; }
  save(); FX.add('enter'); draw(true); toast('This task is reset');
}
function toggleRoute(){ S.core=!S.core; save(); toast(S.core?`Core route ≈ ${routeMin(true)} min · extra tasks hidden`:`Full route ≈ ${routeMin(false)} min`); if(!visible(S.i)) { const k=nextNonOpt(S.i); go(k<STEPS.length?k:0); } else draw(false,true); }
function toggleTeacher(force){ const on = force ?? !$('#teacher').classList.contains('on'); $('#teacher').classList.toggle('on',on); $('#teacher').setAttribute('aria-hidden',String(!on)); $('#btnTeacher').classList.toggle('on',on); if(on) paintTeacher(); }
function paintTeacher(){
  const s=cur(), sc=SCENES[s.sc-1], el=clockNow(), running=!!S.clock.start;
  let planned=0; for(let i=0;i<S.i;i++){ if(visible(i)) planned+=STEPS[i].min; }
  const ans = s.ans || [], uaT = s.uaT || [];
  $('#tBody').innerHTML=`
    <div class="tsec"><div class="row"><div class="grow"><h5>Lesson clock</h5><b class="mono" style="font-size:24px" id="tClock">${mmss(el)}</b>
      <div class="small">Planned by now ≈ ${Math.round(planned)} min · route ≈ ${routeMin(S.core)} min</div></div>
      <button class="btn sm ghost" id="tClk">${running?'⏸':'▶'}</button></div></div>
    <div class="tsec"><h5>Now · Scene ${sc.n} of ${SCENES.length} · ≈${sceneMin(sc.n)} min</h5><b>${esc(s.name)}</b>${s.opt?' <span class="tag opt">extra</span>':''}
      <div class="say mt" style="margin-top:10px">🗣️ ${esc(s.say||'')}</div>
      <p class="mt" style="margin-top:10px;color:#D8DCFF">${esc(s.note||'')}</p></div>
    <div class="tsec"><h5>Answers</h5><ul>${ans.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
    ${uaT.length?`<div class="tsec"><h5>🇺🇦 Українською · тільки для вчителя</h5><ul>${uaT.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
    <div class="tsec"><h5>Controls</h5><div class="tgrid">
      <button class="btn sm" id="tBack">← Back</button><button class="btn sm primary" id="tNext">Continue →</button>
      <button class="btn sm" id="tHint" ${s.hint?'':'disabled'}>💡 ${esc(s.hintLbl||'Help')}</button><button class="btn sm" id="tShow" ${s.reveal?'':'disabled'}>👁 ${esc(s.revealLbl||'Show answer')}</button>
      <button class="btn sm yellow" id="tSkip" ${canSkip()?'':'disabled'}>⏭ Skip extra</button><button class="btn sm" id="tMap">🗺️ Scenes</button>
      <button class="btn sm" id="tRst">↺ Reset this task</button><button class="btn sm" id="tDone">${S.done[sc.n]?'✓ Scene done':'✓ Mark scene done'}</button>
      <button class="btn sm" id="tListen">🎧 ${Player.playing?'Pause listening':'Play listening'}</button><button class="btn sm" id="tKit">🧰 Breakout task</button>
      <button class="btn sm" id="tTimer">⏱ ${TIMER.run()?'Pause timer':'Start timer'} · ${mmss(TIMER.left())}</button><button class="btn sm" id="tLive">📡 Live room</button></div>
      <div class="sw mt"><span>Core route (hide EXTRA tasks)</span><button id="swCore" class="${S.core?'on':''}" aria-label="Core route"></button></div>
      <div class="sw"><span>🇺🇦 Translations on screen (after matching)</span><button id="swUa" class="${S.uaOn?'on':''}" aria-label="Ukrainian translations"></button></div>
      <div class="sw"><span>Sounds</span><button id="swSnd" class="${S.sound?'on':''}" aria-label="Sounds"></button></div></div>
    <div class="tsec"><h5>Jump to a scene</h5>${mapHTML()}</div>
    <div class="tsec"><h5>Keys</h5><div class="small">→ / Space continue · ← back · H help · A show answer · T teacher · M scenes · F full screen</div></div>
    <button class="btn danger" id="tReset" style="width:100%">⟲ Reset lesson</button>`;
  const B=$('#tBody');
  $('#tBack').onclick=back; $('#tNext').onclick=next; $('#tSkip').onclick=skipOpt; $('#tMap').onclick=showMap;
  $('#tHint').onclick=doHint; $('#tShow').onclick=doReveal; $('#tReset').onclick=askReset; $('#tRst').onclick=resetTask;
  $('#tDone').onclick=()=>{ S.done[sc.n]=!S.done[sc.n]; save(); paintChrome(); paintTeacher(); };
  $('#tListen').onclick=()=>{ const k=STEPS.findIndex(x=>x.id==='listen'); if(S.i!==k) go(k); Player.play(); paintTeacher(); };
  $('#tKit').onclick=()=>{ const k=STEPS.findIndex(x=>x.id==='kit'); go(k); };
  $('#tTimer').onclick=()=>{ TIMER.run()?TIMER.pause():TIMER.start(); draw(false,true); };
  $('#tLive').onclick=openLive;
  $('#swCore').onclick=toggleRoute;
  $('#swUa').onclick=()=>{ S.uaOn=!S.uaOn; save(); draw(false,true); };
  $('#swSnd').onclick=()=>{ S.sound=!S.sound; save(); paintTeacher(); };
  $('#tClk').onclick=()=>{ if(S.clock.start){ S.clock.acc=clockNow(); S.clock.start=0; S.clock.paused=true; } else { S.clock.start=Date.now(); S.clock.paused=false; } save(); paintTeacher(); };
  bindMap(B);
}
function doHint(){ const s=cur(); if(!s.hint) return; s.hint(sd(s.id)); FX.add('hint'); save(); draw(false,true); }
function doReveal(){ const s=cur(); if(!s.reveal) return; const d=sd(s.id); s.reveal(d); FX.add('reveal'); save(); draw(false,true); }

/* confetti (no library) */
function confetti(){
  if(REDUCED) return; const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#3DE8FF','#FF3D7F','#B8FF3D','#8B5CFF','#FFD84D'];
  const P=Array.from({length:170},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:4+Math.random()*6, vx:-2+Math.random()*4, vy:2+Math.random()*4, a:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if(++t<230) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
function floatEmoji(e){ if(!/^[\p{Extended_Pictographic}‍️✅]{1,8}$/u.test(e||'')) return; const s=document.createElement('span'); s.textContent=e; s.style.left=Math.random()*70+'px'; $('#reacts').appendChild(s); setTimeout(()=>s.remove(),3100); }

/* ---------- 9 · live room (Supabase Realtime broadcast + presence; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5, 13–16: таблиці не потрібні.
   Учитель — єдине джерело стану: сцену, завдання й таймер надсилає тільки він.
   Учні надсилають лише hello / ans / work / react; правильні відповіді приходять на телефон
   тільки після того, як учитель відкрив їх на головному екрані. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,10);
const LIVE = {on:false, peers:[]};
const WALLQ = [];
const NAMES = {};
const KIT_F = ['name','r1','r2','r3'];

const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l17sid'); }catch(e){}
    this.me={id:sid || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') try{ sessionStorage.setItem('l17sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson17-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson17-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }
};
const Store = {
  async log(kind, task, sid, value){

    try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson17-scroll', chapter:cur().id, task, kind, student_id:sid, student_name:NAMES[sid]||null, value:String(value).slice(0,500)}); }
    catch(e){ console.warn('Supabase insert failed:', e.message||e); }

let pubT=null;

const soonDraw = (ms=200) => { clearTimeout(redrawT); redrawT=setTimeout(()=>{ if(!document.activeElement?.closest?.('#scene textarea, #scene input')) draw(false,true); },ms); };
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id || !m.from || m.from.role!=='student') return;
  if(m.from.name) NAMES[id]=String(m.from.name).slice(0,20);
  const task=curTask();
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='ans' && task && m.task===task.id && !task.lock){
    if(task.kind==='choice'){ const v=+m.v; if(!(Number.isInteger(v) && v>=0 && v<task.opts.length)) return; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('vote',task.id,id,v); soonDraw(); return; }
    if(task.kind==='multi'){ if(!Array.isArray(m.v)) return; const v=[...new Set(m.v.map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<task.opts.length))]; (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('multi',task.id,id,v.join(',')); paintDock(); soonDraw(); return; }
    if(task.kind==='match'){ if(!m.v || typeof m.v!=='object') return; const ok=task.means.map(x=>x.L), v={}; task.items.forEach((_,i)=>{ const L=String(m.v[i]||''); if(ok.includes(L)) v[i]=L; });
      (S.lv[task.id]=S.lv[task.id]||{})[id]=v; save(); Store.log('match',task.id,id,JSON.stringify(v)); paintDock(); soonDraw(); return; }
    if(task.kind==='text'){ const text=String(m.v||'').replace(/\s+/g,' ').trim().slice(0,140); if(!text) return;
      const k=WALLQ.findIndex(w=>w.task===task.id && w.sid===id); const item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student'};
      if(k>=0) WALLQ[k]=item; else WALLQ.unshift(item); SFX.pop(); Store.log('text',task.id,id,text); paintDock(); return; }
  }
  if(m.t==='work' && task && task.kind==='kit'){
    const L=String(m.team||''), f=String(m.f||''); if(!TEAMS().some(t=>t.L===L) || !KIT_F.includes(f)) return;
    S.work[L]=Object.assign({},S.work[L],{[f]:String(m.v||'').slice(0,f==='name'?40:200), by:NAMES[id]||''}); save(); pubState(); Store.log('work','kit-'+L+'-'+f,id,m.v);
    if(['kit','present'].includes(cur().id)) soonDraw(400); return;
  }
}
function paintDock(){

  else if(task.kind==='react3') h+=`<div class="small">Phones can send 🛡️ Would work · 💡 Clever · 😂 Funny.</div>`;

  $$('[data-wx]',d).forEach(b=>b.onclick=()=>{ const k=WALLQ.findIndex(w=>w.id===b.dataset.wx); if(k>=0) WALLQ.splice(k,1); paintDock(); });
