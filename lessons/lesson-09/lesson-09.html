.opt.right{border-color:var(--green); background:rgba(54,224,155,.14)}
.opt.right .L{background:var(--green); color:#03140C}
.opt.right::after{content:"✓"; position:absolute; right:-10px; top:-10px; width:30px; height:30px; border-radius:50%; background:var(--green); color:#03140C; display:grid; place-items:center; font-weight:900; font-size:16px}
.opt.wrongpick{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.opt.dim{opacity:.42}
.opt.fx{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opts.chips{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.chips .opt{justify-content:center; font-size:20px}

.explain{margin-top:16px; padding:16px 18px; border-radius:16px; background:rgba(54,224,155,.09); border:1px solid rgba(54,224,155,.4)}
.explain .k{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--green)}
.explain .a{font-family:var(--dsp); font-size:28px; margin:2px 0 4px}
.explain p{margin:0; font-size:18px}
.explain .ex{margin-top:8px; font-size:17px; color:#D6DAF0}
.explain .ex b{color:#fff}
.stamp{animation:stampIn .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stampIn{from{opacity:0; transform:scale(1.25) rotate(-2deg)} to{opacity:1; transform:none}}

.cdots{display:flex; gap:6px; flex-wrap:wrap}
.cdots button{min-width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid var(--line); font-family:var(--mono); font-size:13px; font-weight:700; color:var(--muted)}
.cdots button.done{background:rgba(54,224,155,.15); border-color:rgba(54,224,155,.5); color:var(--green)}
.cdots button.cur{background:var(--cyan); color:#04111A; border-color:var(--cyan)}
.deckbar{display:flex; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap}

.sit{border-radius:22px; padding:28px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative; overflow:hidden; min-height:220px; display:flex; flex-direction:column; justify-content:center}
.sit .num{position:absolute; right:18px; top:12px; font-family:var(--dsp); font-size:84px; color:rgba(255,255,255,.05); line-height:1}
.sit .ico{font-size:52px; line-height:1; margin-bottom:12px}
.sit p{font-size:clamp(22px,2.5vw,30px); font-weight:800; line-height:1.3; margin:0}

.hintbox{margin-top:14px; padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.1); border:1px dashed rgba(255,193,77,.55); color:#FFE3A8; font-size:17px}
.hintbox b{color:#fff}

/* flash cards */
.flash{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.fc{perspective:900px; height:150px}
.fc .in{position:relative; width:100%; height:100%; transition:transform .55s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d}
.fc.on .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:16px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; border:1px solid var(--line2)}
.fc .fa{background:linear-gradient(160deg,#1C2340,#121629); font-weight:800; font-size:20px}
.fc .fa small{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--faint); margin-top:8px}
.fc .fb{background:linear-gradient(160deg,rgba(57,216,246,.2),rgba(141,123,255,.18)); transform:rotateY(180deg); font-size:16.5px; font-weight:600}
.fc .fb b{display:block; font-size:15px; color:var(--cyan); margin-bottom:5px}

/* voice message */
.voice{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:20px; background:#1B2138; border:1px solid var(--line2); max-width:460px; flex:1; min-width:220px}
.voice .play{width:52px; height:52px; flex:0 0 52px; border-radius:50%; background:var(--nora); color:#03140C; display:grid; place-items:center; font-size:20px}
.wave{flex:1; display:flex; align-items:center; gap:3px; height:42px}
.wave i{flex:1; border-radius:3px; background:rgba(255,255,255,.3); height:var(--h)}
.voice.playing .wave i{animation:wv .8s ease-in-out infinite; background:var(--nora)}
@keyframes wv{50%{transform:scaleY(.4)}}
.transcript{margin-top:12px; padding:14px 18px; border-radius:16px; background:rgba(67,229,160,.08); border:1px solid rgba(67,229,160,.35); font-size:22px; font-weight:800}
.transcript small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--nora); font-weight:700}

.gapline{font-size:clamp(22px,2.6vw,32px); font-weight:800; line-height:1.9}
.gap{display:inline-flex; min-width:150px; justify-content:center; padding:0 12px; margin:0 4px; border-radius:12px; border:2px dashed var(--line3); color:var(--faint); line-height:1.45; vertical-align:middle; transition:.2s}
.gap.f{border-style:solid; border-color:var(--cyan); color:#fff; background:rgba(57,216,246,.1)}
.gap.ok{border-color:var(--green); background:rgba(54,224,155,.14); color:#fff}
.gap.no{border-color:var(--bad); background:rgba(255,84,112,.12); animation:shake .45s}
.chipset{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.chipset .lab{width:100%; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted)}
.chip{padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-weight:800; font-size:18px}
.chip:hover{background:rgba(255,255,255,.12)}
.chip.on{border-color:var(--cyan); background:rgba(57,216,246,.14)}
.recovered{display:flex; align-items:center; gap:16px; padding:18px 22px; border-radius:20px; background:linear-gradient(135deg,rgba(54,224,155,.18),rgba(57,216,246,.1)); border:1px solid rgba(54,224,155,.55)}
.recovered .t{font-family:var(--dsp); font-size:clamp(24px,3vw,36px)}

/* truth board */
.board{position:relative; border-radius:28px; padding:28px; background:
   radial-gradient(circle at 20% 10%,rgba(255,255,255,.04),transparent 40%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px), #0E1220; border:1px solid var(--line2); overflow:hidden}
.chain{display:grid; gap:0; justify-items:center}
.node{position:relative; display:flex; gap:14px; align-items:center; width:min(100%,var(--w)); padding:14px 18px; border-radius:18px; border:1px solid var(--line2); background:#161B2E;
  transform:rotate(var(--rot)); box-shadow:0 18px 30px -20px #000}
.node .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.node .tx{font-weight:800; font-size:var(--fs); line-height:1.25}
.node .tx small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--muted); font-weight:700}
.node.fx{animation:nodeIn .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes nodeIn{from{opacity:0; transform:rotate(var(--rot)) translateY(-18px) scale(.9)} to{opacity:1; transform:rotate(var(--rot))}}
.node.rumour{background:linear-gradient(135deg,#3A0E1E,#25091A); border:2px solid var(--red); box-shadow:0 0 40px -6px rgba(255,84,112,.7)}
.node.rumour .tx{color:#FFE1E7; text-transform:uppercase; letter-spacing:.01em; animation:glitch 2.4s infinite}
@keyframes glitch{0%,92%,100%{text-shadow:none; transform:none}93%{text-shadow:-3px 0 var(--cyan),3px 0 var(--red); transform:translateX(2px)}96%{text-shadow:3px 0 var(--cyan),-3px 0 var(--red); transform:translateX(-2px)}}
.link{height:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; letter-spacing:.14em; font-weight:700}
.link .ln{width:2px; flex:1; background:repeating-linear-gradient(180deg,var(--red) 0 6px,transparent 6px 10px)}
.link span{padding:2px 10px; border-radius:99px; background:#2A1220; border:1px solid rgba(255,84,112,.5); color:#FFB4C2; white-space:nowrap}
.strip{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:22px}
.strip span{font-family:var(--mono); font-weight:700; letter-spacing:.08em; padding:9px 14px; border-radius:12px; font-size:15px}
.strip i{font-style:normal; color:var(--faint)}
.strip.fx span{animation:popIn .4s both}
.strip.fx span:nth-of-type(2){animation-delay:.15s}.strip.fx span:nth-of-type(3){animation-delay:.3s}.strip.fx span:nth-of-type(4){animation-delay:.45s}

/* speaking */
.spq{border-radius:26px; padding:30px; background:linear-gradient(160deg,#1A2038,#0F1325); border:1px solid var(--line2); position:relative}
.spq .q{font-size:clamp(26px,3.1vw,40px); font-weight:800; line-height:1.22}
.fu{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px}
.fu button{padding:9px 14px; border-radius:12px; font-family:var(--mono); font-weight:700; font-size:14px; letter-spacing:.08em; border:1.5px solid var(--line2); background:rgba(255,255,255,.05)}
.fu button.on{border-color:var(--amber); color:var(--amber); background:rgba(255,193,77,.1)}
.fuq{margin-top:12px; display:grid; gap:8px}
.fuq div{padding:12px 16px; border-radius:14px; background:rgba(255,193,77,.08); border-left:4px solid var(--amber); font-size:20px; font-weight:700}
.sample{margin-top:16px; padding:14px 18px; border-radius:16px; background:rgba(54,224,155,.08); border:1px solid rgba(54,224,155,.4); font-size:20px; font-weight:700}
.sample small{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; color:var(--green)}
.wall{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px}
.wall .w{padding:10px 14px; border-radius:14px; background:rgba(57,216,246,.1); border:1px solid rgba(57,216,246,.4); font-weight:700; font-size:17px; animation:popIn .4s both}
.wall .w small{display:block; font-size:12px; color:var(--muted)}

/* rumour control unit */
.rcu{display:flex; align-items:center; gap:16px; padding:16px 20px; border-radius:20px; background:linear-gradient(90deg,rgba(255,84,112,.18),rgba(255,84,112,.04)); border:1px solid rgba(255,84,112,.5); margin-bottom:18px}
.siren{font-size:40px; animation:siren 1s steps(2) infinite}
@keyframes siren{50%{filter:hue-rotate(200deg) brightness(1.3)}}
.steps6{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:10px}
.steps6 li{display:flex; gap:14px; align-items:center; padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:19px; font-weight:700}
.steps6 li::before{counter-increment:s; content:counter(s); width:36px; height:36px; flex:0 0 36px; border-radius:50%; display:grid; place-items:center; background:var(--red); color:#fff; font-family:var(--mono); font-weight:700}
.steps6 li b{color:var(--amber)}
.cf{border-radius:22px; padding:18px; background:#0E1222; border:1px solid var(--line2)}
.cf .hd{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; letter-spacing:.14em; color:var(--muted); margin-bottom:10px}
.cf .hd b{color:#fff; letter-spacing:.06em; font-size:15px}
.cf .rum{padding:10px 14px; border-radius:14px; background:rgba(255,84,112,.1); border:1px dashed rgba(255,84,112,.55); font-weight:700; font-size:16.5px; margin-bottom:12px}
.cf .rum small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:#FF9AAE}
.cf .chat{padding:0}
.cf .bub{font-size:17.5px}
.rep{display:grid; gap:8px}
.rep div{padding:10px 14px; border-radius:12px; background:rgba(57,216,246,.08); border-left:4px solid var(--cyan); font-size:18px; font-weight:700}
.rep div b{color:var(--amber)}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{padding:10px 16px; border-radius:12px; border:1.5px solid var(--line2); background:rgba(255,255,255,.04); font-weight:800; font-size:16px}
.tabs button.on{border-color:var(--cyan); background:rgba(57,216,246,.14); color:#fff}
.vbank{display:flex; gap:7px; flex-wrap:wrap}
.vbank span{font-family:var(--mono); font-size:13px; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(255,193,77,.1); border:1px solid rgba(255,193,77,.4); color:var(--amber)}

/* timer ring */
.ringbox{display:flex; flex-direction:column; align-items:center; gap:10px}
.ring{position:relative; width:150px; height:150px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringG); stroke-linecap:round; transition:stroke-dashoffset .5s linear}
.ring .t{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:34px; font-weight:700}
.ring .t.end{color:var(--red)}
.ring.hurry{animation:hurry 1s ease-in-out infinite}
@keyframes hurry{50%{transform:scale(1.04); filter:drop-shadow(0 0 16px var(--red))}}

/* reports + vote */
.checklist{display:grid; gap:8px}
.checklist div{display:flex; gap:12px; align-items:center; font-size:19px; font-weight:700}
.checklist div::before{content:"✓"; width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:rgba(54,224,155,.15); color:var(--green); border:1px solid rgba(54,224,155,.5); font-weight:900}
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px}
.tcard{border-radius:20px; padding:16px; background:rgba(255,255,255,.045); border:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.tcard.done{border-color:rgba(54,224,155,.6); background:rgba(54,224,155,.08)}
.tcard .tn{display:flex; align-items:center; gap:10px}
.tcard .tn b{font-size:19px} .tcard .tn span{font-size:24px}
.tcard .ws{font-size:15.5px; color:#D6DAF0; display:grid; gap:4px}
.tcard .ws div{padding:6px 10px; border-radius:10px; background:rgba(255,255,255,.05)}
.awards{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.award{border-radius:22px; padding:18px; background:rgba(255,255,255,.045); border:1.5px solid var(--line); text-align:center; cursor:pointer; transition:.2s}
.award .e{font-size:44px}
.award b{display:block; font-size:19px; margin-top:6px}
.award.on{border-color:var(--amber); background:rgba(255,193,77,.08); box-shadow:0 0 30px -10px var(--amber)}
.vbars{display:grid; gap:10px; margin-top:16px}
.vbar{display:grid; grid-template-columns:150px 1fr 50px; gap:12px; align-items:center}
.vbar button{text-align:left; font-weight:800; font-size:17px; padding:8px 12px; border-radius:12px; border:1px solid var(--line2); background:rgba(255,255,255,.04)}
.vbar .tr{height:30px; border-radius:10px; background:rgba(255,255,255,.06); overflow:hidden}
.vbar .tr i{display:block; height:100%; border-radius:10px; background:linear-gradient(90deg,var(--amber),var(--red)); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.vbar .c{font-family:var(--mono); font-weight:700; font-size:18px}
.vbar.win button{border-color:var(--amber); color:var(--amber)}
.winners{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px}
.winners div{padding:12px; border-radius:16px; border:1px solid rgba(255,193,77,.5); background:rgba(255,193,77,.08); text-align:center; font-weight:800}

/* ending */
.closed{position:relative; text-align:center; padding:30px; border-radius:28px; background:radial-gradient(circle at 50% 0%,rgba(54,224,155,.22),transparent 60%),#0E1322; border:1px solid rgba(54,224,155,.5); overflow:hidden}
.closed .st{display:inline-block; white-space:nowrap; font-family:var(--dsp); font-size:clamp(34px,4.4vw,64px); color:var(--green); border:6px solid var(--green); border-radius:18px; padding:4px 26px; transform:rotate(-5deg); text-shadow:0 0 30px rgba(54,224,155,.5)}
.closed .st.fx{animation:bigStamp .7s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes bigStamp{from{opacity:0; transform:rotate(-5deg) scale(2.2)} to{opacity:1; transform:rotate(-5deg) scale(1)}}
.versions{display:flex; justify-content:center; gap:10px; margin:22px 0 10px; flex-wrap:wrap}
.versions span{font-size:18px; font-weight:800; padding:8px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.moral{font-family:var(--dsp); font-size:clamp(26px,3.2vw,42px); margin-top:12px}
.moral em{font-style:normal; color:var(--cyan)}

/* summary */
.sum{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.sumc{border-radius:20px; padding:18px; background:rgba(255,255,255,.045); border:1px solid var(--line)}
.sumc h3{font-family:var(--mono); font-size:13px; letter-spacing:.16em; color:var(--cyan); margin-bottom:10px}
.sumc .l{display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:18px; font-weight:700; border-bottom:1px solid var(--line)}
.sumc .l:last-child{border-bottom:0}
.sumc .l span:first-child{color:var(--mia)}
.sumc .l span:last-child{color:var(--cyan); text-align:right}
.sumc.span2{grid-column:span 2}
.vchips{display:flex; gap:8px; flex-wrap:wrap}
.vchips span{font-family:var(--dsp); font-size:22px; padding:6px 14px; border-radius:12px; background:rgba(255,255,255,.06); border:1px solid var(--line2)}
.unlock{animation:unlock .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes unlock{from{opacity:0; transform:translateY(16px) scale(.95); filter:blur(4px)} to{opacity:1; transform:none; filter:none}}

/* evidence board (modal) */
.evb{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; padding:8px 4px 4px; position:relative}
.evc{position:relative; border-radius:16px; padding:16px 16px 14px; min-height:150px; background:#F4EEDD; color:#20180A; box-shadow:0 18px 30px -16px #000; transform:rotate(var(--rot))}
.evc .pin{position:absolute; top:-8px; left:50%; width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF9AAA,var(--red2)); box-shadow:0 3px 6px rgba(0,0,0,.5)}
.evc .k{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.14em; color:#8A6A2E}
.evc b{display:block; font-size:17px; margin:2px 0 6px}
.evc p{margin:0; font-size:15.5px; font-weight:600; line-height:1.35}
.evc .rp{margin-top:8px; font-size:14.5px; font-weight:700; color:#0E5A7A}
.evc.lock{background:transparent; color:var(--faint); border:2px dashed var(--line2); box-shadow:none; display:grid; place-items:center; text-align:center}
.evc.lock b{font-size:34px}
.evc.new{animation:evNew 1s ease}
@keyframes evNew{30%{transform:rotate(0) scale(1.06); box-shadow:0 0 40px var(--amber)}}
.evhead{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.evbar{flex:1; height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.evbar i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--green)); border-radius:99px; transition:width .6s}

/* clue fly */
#clueFx{position:fixed; inset:0; z-index:70; display:grid; place-items:center; pointer-events:none; opacity:0}
#clueFx.on{animation:clueFade 2.4s ease forwards}
#clueFx .cc{width:min(420px,86vw); border-radius:22px; padding:22px 24px; background:#F4EEDD; color:#20180A; box-shadow:0 40px 80px -20px #000, 0 0 0 4px rgba(255,193,77,.6); text-align:center}
#clueFx .cc .k{font-family:var(--mono); font-weight:700; letter-spacing:.2em; color:#1A7F55; font-size:14px}
#clueFx .cc b{display:block; font-family:var(--dsp); font-size:28px; margin:6px 0}
#clueFx .cc p{margin:0; font-weight:700}
#clueFx.on .cc{animation:clueFly 2.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes clueFade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes clueFly{0%{transform:scale(.6) rotate(-6deg)}14%{transform:scale(1.05) rotate(2deg)}22%{transform:scale(1) rotate(-1deg)}72%{transform:scale(1) rotate(-1deg) translate(0,0)}100%{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(10deg)}}

/* scene card */
#scard{position:fixed; inset:0; z-index:60; pointer-events:none; display:grid; place-items:center; opacity:0}
#scard.on{animation:scard 1.5s ease forwards}
#scard .in{text-align:center; padding:26px 46px; border-radius:26px; background:rgba(8,11,22,.88); border:1px solid var(--line2); backdrop-filter:blur(8px)}
#scard .k{font-family:var(--mono); letter-spacing:.24em; color:var(--cyan); font-size:14px}
#scard h2{font-family:var(--dsp); font-size:clamp(34px,5vw,60px); margin-top:8px}
@keyframes scard{0%{opacity:0; transform:scale(.96)}15%{opacity:1; transform:none}75%{opacity:1}100%{opacity:0}}

/* teacher panel, dock, modal, toast */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(440px,94vw); z-index:50; background:#0B0F1E; border-left:1px solid var(--line2); box-shadow:-30px 0 60px -20px #000;
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column}
#teacher.on{transform:none}
.thd{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); font-family:var(--mono); letter-spacing:.12em}

.sw button.on{background:var(--cyan)} .sw button.on::after{left:23px}

.stg button{display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:10px; border:1px solid var(--line); text-align:left; font-size:15px; font-weight:700}

.tmap{display:grid; gap:4px}
.tmap .sn{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; color:var(--cyan); margin-top:10px}

.tmap button span:first-child{flex:1}
.tmap .m{font-family:var(--mono); font-size:12px; color:var(--faint)}

#dock{position:fixed; left:16px; bottom:84px; z-index:40; width:330px; max-height:52vh; display:none; flex-direction:column; border-radius:18px; background:rgba(11,15,30,.96); border:1px solid var(--line2); box-shadow:var(--shadow); overflow:hidden}
#dock.on{display:flex}
#dock.min .db{display:none}
.dh{display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--line)}
.db{overflow:auto; padding:10px 12px; display:grid; gap:7px}
.led{width:10px; height:10px; border-radius:50%; background:var(--faint); flex:0 0 10px}
.led.on{background:var(--green); box-shadow:0 0 10px var(--green)} .led.warn{background:var(--amber)} .led.bad{background:var(--bad)}
.names{display:flex; flex-wrap:wrap; gap:5px}
.names span{font-size:13px; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.07)}
.wallit{display:flex; gap:6px; align-items:center}
.wallit p{flex:1; margin:0; font-size:14.5px} .wallit small{display:block; color:var(--muted); font-size:12px}
.okm{color:var(--green); font-weight:900} .nom{color:var(--bad); font-weight:900}
.dbar{display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; font-size:14px}
.dbar .tr{grid-column:1/-1; height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:-4px}
.dbar .tr i{display:block; height:100%; background:var(--cyan)}
.dbar .tr i.ok{background:var(--green)}

#modal{position:fixed; inset:0; z-index:80; background:rgba(3,4,10,.72); backdrop-filter:blur(6px); display:grid; place-items:center; padding:20px}
#modal .box{width:min(980px,100%); max-height:90vh; overflow:auto; border-radius:26px; padding:26px; background:#0D1121; border:1px solid var(--line2); box-shadow:var(--shadow)}
#toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); z-index:90; padding:12px 20px; border-radius:14px; background:#1A2038; border:1px solid var(--line2); font-weight:700; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%)}
#reacts{position:fixed; right:30px; bottom:90px; z-index:45; width:100px; height:60vh; pointer-events:none}
#reacts span{position:absolute; bottom:0; font-size:38px; animation:rise 3s ease-out forwards}
@keyframes rise{to{transform:translateY(-55vh) scale(1.3); opacity:0}}
#confetti{position:fixed; inset:0; z-index:95; pointer-events:none}
#wm{position:fixed; right:18px; bottom:76px; z-index:2; opacity:.16; pointer-events:none}
#wm img{width:86px; display:block}

/* student phone app */
#student{display:none}
body.student{overflow:auto}
body.student #app, body.student #wm{display:none}
body.student #student{display:flex; flex-direction:column; min-height:100vh; position:relative; z-index:1}

/* responsive */
@media (max-width:1100px){ .prog .st:not(.cur) .lb2{display:none} .prog .st{padding:6px 9px} }
@media (max-width:1080px){
  .two,.two.wl,.two.wr,.hero{grid-template-columns:1fr}
  .verbs,.flash{grid-template-columns:repeat(2,1fr)} .tfgrid{grid-template-columns:repeat(2,1fr)}

}

  .tools .lb{display:none} .navr .lb{display:none} .brand{display:none}

  #navInfo{font-size:12px} #dock{width:calc(100vw - 32px)} .vbar{grid-template-columns:110px 1fr 40px}
  .tb{height:40px; min-width:40px; padding:0 9px}
  .node{width:100%; transform:none} .node .tx{font-size:min(var(--fs),20px)} .board{padding:18px 12px}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }

/* ═══════════ LESSON 9 · THE UNSENT MESSAGE · palette + components ═══════════ */
:root{
  --bg:#070B24; --bg2:#0B1134; --panel:#111840; --panel2:#18204E;
  --line:rgba(170,175,255,.13); --line2:rgba(170,175,255,.25); --line3:rgba(170,175,255,.4);
  --text:#EEF0FF; --muted:#AAB1DC; --faint:#717AAE;
  --cyan:#5B8CFF; --cyan2:#3D6BEB; --violet:#9D7BFF; --soft:#C9B8FF; --indigo:#5B5CF0;
  --coral:#FF7A66; --red:#FF5C7A; --red2:#C93355; --amber:#FFC24D; --green:#3BE39E; --teal:#2DE0C4;
  --mia:#FF8FC7; --leo:#5AB0FF; --zoe:#FFB36B;
  --ok:#3BE39E; --bad:#FF5C7A;
  --g1:rgba(91,140,255,.17); --g2:rgba(157,123,255,.17); --g3:rgba(255,122,102,.08);
}
body::before{
  background:
   radial-gradient(820px 560px at 0% -8%, var(--g1), transparent 62%),
   radial-gradient(780px 560px at 102% 104%, var(--g2), transparent 60%),
   radial-gradient(900px 600px at 72% -20%, var(--g3), transparent 60%),
   linear-gradient(180deg,#0A1031,#070B24 70%);
  transition:background 1s}
body[data-sc="1"]{--g1:rgba(255,122,102,.15); --g2:rgba(91,92,240,.22); --g3:rgba(157,123,255,.12)}
body[data-sc="2"]{--g1:rgba(255,143,199,.15); --g2:rgba(157,123,255,.22); --g3:rgba(91,140,255,.1)}
body[data-sc="3"]{--g1:rgba(157,123,255,.18); --g2:rgba(255,143,199,.12); --g3:rgba(91,140,255,.1)}
body[data-sc="4"]{--g1:rgba(255,92,122,.14); --g2:rgba(91,140,255,.2); --g3:rgba(157,123,255,.1)}
body[data-sc="5"]{--g1:rgba(91,140,255,.2); --g2:rgba(157,123,255,.2); --g3:rgba(45,224,196,.07)}
body[data-sc="6"]{--g1:rgba(255,143,199,.14); --g2:rgba(91,140,255,.18); --g3:rgba(255,179,107,.1)}
body[data-sc="7"]{--g1:rgba(255,179,107,.13); --g2:rgba(91,140,255,.2); --g3:rgba(157,123,255,.12)}
body[data-sc="8"]{--g1:rgba(59,227,158,.14); --g2:rgba(157,123,255,.2); --g3:rgba(255,122,102,.1)}
:focus-visible{outline-color:var(--soft)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#fff; box-shadow:0 10px 30px -12px rgba(91,140,255,.85)}
.btn.coral{background:linear-gradient(135deg,var(--coral),#FF9F7A); color:#230803; border-color:transparent; box-shadow:0 10px 30px -12px rgba(255,122,102,.8)}
.btn.xl{font-size:clamp(19px,1.9vw,24px); padding:18px 34px; min-height:64px; border-radius:18px}
@keyframes btnPulse{50%{box-shadow:0 0 0 8px rgba(91,140,255,.14), 0 10px 30px -12px rgba(91,140,255,.8)}}
#bar i{background:linear-gradient(90deg,var(--cyan),var(--violet),var(--coral))}
.kick{color:var(--soft)}
.kick.co{color:var(--coral)} .kick.vi{color:var(--violet)} .kick.am{color:var(--amber)} .kick.rd{color:var(--red)} .kick.gr{color:var(--green)} .kick.bl{color:var(--cyan)}
.hl{background:linear-gradient(transparent 55%,rgba(91,140,255,.45) 55%)}
.hlv{background:linear-gradient(transparent 55%,rgba(157,123,255,.55) 55%); padding:0 3px; border-radius:3px; font-weight:800}
.hlc{background:linear-gradient(transparent 55%,rgba(255,122,102,.5) 55%); padding:0 3px; border-radius:3px; font-weight:800}
.card.vi{border-color:rgba(157,123,255,.45); box-shadow:0 0 0 1px rgba(157,123,255,.15) inset, var(--shadow)}

/* story clock chip */
.dl{display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 12px; border-radius:12px; border:1px solid rgba(255,122,102,.45); background:rgba(255,122,102,.1); font-family:var(--mono); font-weight:700; font-size:14px; white-space:nowrap}

body.calm *,body.calm *::before,body.calm *::after{animation:none!important; transition:none!important}

/* ─── title ─── */
.hero9{display:grid; grid-template-columns:1.12fr .88fr; gap:40px; align-items:center; min-height:calc(100vh - 250px)}

.stagger>*{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}

/* phone mock (bigger, cinematic) */
.phone9{max-width:430px; width:100%; margin:0 auto; border-radius:46px; padding:12px; background:linear-gradient(160deg,#252C58,#0B1033 45%,#1B2150); border:1px solid var(--line2);
  box-shadow:0 50px 90px -40px #000, 0 0 80px -30px rgba(157,123,255,.5), inset 0 0 0 2px rgba(255,255,255,.05); position:relative}

.accepted .rk{font-size:90px; animation:rocket 1.3s cubic-bezier(.5,0,.3,1) forwards}
.accepted .t{font-family:var(--dsp); font-weight:800; font-size:clamp(46px,7vw,100px); letter-spacing:-.02em; background:linear-gradient(90deg,#fff,var(--soft),var(--coral)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:bigStamp .6s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes rocket{0%{transform:translateY(40px) scale(.7); opacity:0}30%{transform:none; opacity:1}100%{transform:translateY(-120px) scale(1.15); opacity:0}}
@keyframes bigStamp{from{opacity:0; transform:scale(1.8)} to{opacity:1; transform:none}}

/* ─── scene 2 · Mia's head ─── */
.mind{display:grid; grid-template-columns:250px 1fr; gap:22px; align-items:start}
.mind>*{min-width:0}
.headspace{position:relative; border-radius:28px; padding:16px 12px 18px; background:radial-gradient(circle at 50% 38%,rgba(157,123,255,.32),transparent 62%),linear-gradient(170deg,#1B2160,#0C1136); border:1px solid var(--line2); overflow:hidden; text-align:center}
.headspace .mia{position:relative; display:inline-block; margin:10px 0 8px}
.headspace .mia .av{box-shadow:0 0 0 4px var(--bg), 0 0 0 7px var(--mia), 0 0 70px -6px var(--mia)}
.headspace .ph{position:absolute; right:-6px; bottom:4px; font-size:40px; transform:rotate(12deg); filter:drop-shadow(0 6px 10px #000)}
.tbs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:6px 0}
.tb9{position:relative; display:inline-block; padding:6px 11px; border-radius:14px; font-size:13.5px; font-weight:800; background:rgba(255,255,255,.08); border:1px solid var(--line2); white-space:nowrap; animation:floaty 4s ease-in-out infinite}
.tb9::after{content:""; position:absolute; bottom:-7px; left:22px; width:10px; height:10px; border-radius:50%; background:inherit; border:inherit}
.tb9.neg{background:rgba(255,92,122,.16); border-color:rgba(255,92,122,.5); color:#FFD3DB}
.tb9.pos{background:rgba(59,227,158,.14); border-color:rgba(59,227,158,.5); color:#C7F7E2}
@keyframes floaty{50%{transform:translateY(-7px)}}
.headspace .cap{margin-top:16px; font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--soft)}
.sit4{display:grid; grid-template-columns:1fr; gap:12px}
.st4{border-radius:22px; padding:14px 16px; background:linear-gradient(170deg,#161D52,#0E1338); border:1.5px solid var(--line2); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px 16px; align-items:center; transition:.25s}
.st4>.ua-box,.st4>.why{grid-column:1/-1; margin-top:0}
.st4.done{border-color:rgba(59,227,158,.6); background:linear-gradient(170deg,rgba(59,227,158,.1),#0E1338)}
.st4.act{border-color:var(--soft); box-shadow:0 0 0 1px var(--soft) inset}
.st4 .th{display:flex; gap:12px; align-items:flex-start}
.st4 .th .qb{flex:1; padding:10px 14px; border-radius:18px 18px 18px 6px; background:rgba(255,143,199,.1); border:1px solid rgba(255,143,199,.4); font-size:clamp(19px,1.75vw,22px); font-weight:800; line-height:1.3; position:relative}
.st4 .th .qb small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--mia); margin-bottom:3px}
.chips3{display:flex; gap:8px; flex-wrap:nowrap}
.ch3b{flex:0 0 auto; white-space:nowrap; padding:11px 14px; border-radius:14px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-weight:800; font-size:clamp(17px,1.5vw,19px); transition:.15s; display:flex; align-items:center; gap:8px; justify-content:center; position:relative}
.ch3b:hover{background:rgba(255,255,255,.11)}
.ch3b .L{font-family:var(--mono); font-size:13px; color:var(--muted)}
.ch3b .n{font-family:var(--mono); font-size:13px; color:var(--cyan)}
.ch3b.ok{border-color:var(--green); background:rgba(59,227,158,.18); color:#fff}
.ch3b.ok .L{color:var(--green)}
.ch3b.no{border-color:var(--bad); background:rgba(255,92,122,.12); opacity:.7}
.ch3b.no.shake{opacity:1; animation:shake .45s}
.opt.wrongold{border-color:rgba(255,92,122,.6); background:rgba(255,84,112,.08); opacity:.7}
.ch3b.off{opacity:.38}
.why{padding:10px 14px; border-radius:14px; background:rgba(59,227,158,.09); border:1px solid rgba(59,227,158,.4); font-size:17px; font-weight:700; line-height:1.4}
.why b{color:var(--green)}
.why.try{background:rgba(255,194,77,.08); border-color:rgba(255,194,77,.45); color:#FFE4AA}
.done-banner{display:flex; align-items:center; gap:16px; padding:16px 22px; border-radius:20px; background:linear-gradient(90deg,rgba(59,227,158,.2),rgba(91,140,255,.1)); border:1px solid rgba(59,227,158,.55); font-family:var(--dsp); font-weight:800; font-size:clamp(24px,2.8vw,36px); color:#E6FFF3}
.done-banner.fx{animation:bigStamp .6s cubic-bezier(.2,.9,.3,1.4) both}

/* vocabulary modal */
.vsearch{display:flex; gap:10px; align-items:center; margin:14px 0 16px}
.vsearch input{flex:1; padding:13px 16px; border-radius:14px; background:rgba(255,255,255,.06); border:1.5px solid var(--line2); font-size:18px}
.vsearch input:focus{outline:none; border-color:var(--soft); box-shadow:0 0 0 3px rgba(157,123,255,.25)}
.vtab{display:grid; gap:10px}
.vrow{display:grid; grid-template-columns:150px 1fr; gap:16px; padding:10px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid var(--line); align-items:center}
.vrow .im{width:150px; height:100px; border-radius:12px; background-size:cover; background-position:center; background-color:#141A44}
.vrow .w{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.vrow .w b{font-family:var(--dsp); font-size:24px; font-weight:800}
.vrow .w .n{font-family:var(--mono); font-size:12px; color:var(--faint)}
.vrow .w .u{color:#FFE4AA; font-weight:700; font-size:16.5px}
.vrow .m{font-size:17px; font-weight:600; margin-top:3px}
.vrow .x{font-size:16px; color:#D2D7F6; margin-top:5px; padding:6px 10px; border-radius:10px; background:rgba(0,0,0,.2); display:inline-block}
.vrow mark{background:rgba(255,194,77,.35); color:#fff; border-radius:3px; padding:0 2px}

/* ─── scene 3 · diary ─── */
.diary{position:relative; border-radius:30px; padding:30px 34px 26px; background:
   linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)),
   repeating-linear-gradient(180deg,transparent 0 47px,rgba(170,175,255,.07) 47px 48px),
   linear-gradient(165deg,#1A1F55,#10143C 60%,#141846); border:1px solid var(--line2); box-shadow:var(--shadow); overflow:hidden}
.diary::before{content:""; position:absolute; left:84px; top:0; bottom:0; width:2px; background:rgba(255,122,102,.25)}
.diary .dh{display:flex; align-items:center; gap:14px; margin-bottom:12px; position:relative}
.diary .dh .k{font-family:var(--mono); font-size:13px; letter-spacing:.2em; color:var(--coral)}
.diary .dh .lk{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center}
.para{position:relative; padding:12px 14px 12px 64px; border-radius:16px; font-size:clamp(22px,2.05vw,27px); font-weight:600; line-height:1.55; transition:background .3s, opacity .3s; cursor:pointer; border:1.5px solid transparent}
.para .pn{position:absolute; left:12px; top:16px; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-family:var(--mono); font-size:14px; font-weight:700; background:rgba(255,255,255,.06); color:var(--muted)}
.para.cur{background:rgba(157,123,255,.12); border-color:rgba(157,123,255,.45)}
.para.cur .pn{background:var(--violet); color:#fff}
.para.rest{opacity:.62}
.para .uabtn{margin-left:8px; vertical-align:middle; font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; padding:3px 8px; border-radius:8px; border:1px solid rgba(255,194,77,.5); color:var(--amber); background:rgba(255,194,77,.08); font-weight:700}
.para .pua{display:block; margin-top:8px; padding:9px 13px; border-radius:12px; background:rgba(255,194,77,.08); border:1px dashed rgba(255,194,77,.45); color:#FFE4AA; font-size:17.5px; font-weight:600; line-height:1.45}
.para .big3{font-family:var(--dsp); font-weight:800; font-size:1.25em; color:#fff; letter-spacing:-.01em}
.gl{background:linear-gradient(transparent 58%,rgba(255,143,199,.45) 58%); padding:0 3px; border-radius:3px; font-weight:800; cursor:help; border-bottom:2px dotted rgba(255,143,199,.8)}
.gl.vo{background:linear-gradient(transparent 58%,rgba(255,122,102,.5) 58%); border-bottom-color:var(--coral)}
.glpop{position:fixed; z-index:75; width:min(360px,90vw); padding:14px 16px; border-radius:16px; background:#1B2160; border:1px solid var(--soft); box-shadow:0 24px 50px -16px #000; animation:popIn .25s both}
.glpop b{font-family:var(--dsp); font-size:22px; display:block}
.glpop p{margin:4px 0 0; font-size:16.5px; font-weight:600}
.glpop .u{color:#FFE4AA; font-weight:700}
.rq2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.rqc{border-radius:24px; padding:22px; background:linear-gradient(170deg,#161D52,#0E1338); border:1.5px solid var(--line2); display:flex; flex-direction:column; gap:12px}
.rqc.done{border-color:rgba(59,227,158,.6)}
.rqc .q{font-size:clamp(23px,2.3vw,30px); font-weight:800; line-height:1.25}
.rqc .opts .opt{font-size:clamp(18px,1.6vw,21px)}
.zping{display:flex; gap:16px; align-items:center; padding:18px 22px; border-radius:22px; background:linear-gradient(90deg,rgba(255,179,107,.18),rgba(157,123,255,.12)); border:1px solid rgba(255,179,107,.55); box-shadow:0 0 50px -16px rgba(255,179,107,.6)}
.zping .bub{flex:1; font-size:clamp(20px,2vw,25px); font-weight:700}
.zping.fx{animation:drop .7s cubic-bezier(.2,.9,.3,1.25) both}

/* ─── scene 4 · evidence ─── */
.evtag{display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border-radius:14px; font-family:var(--mono); font-weight:700; letter-spacing:.18em; font-size:14px; color:#fff; background:var(--red); box-shadow:0 0 30px -4px var(--red)}
.evtag.fx{animation:bigStamp .6s cubic-bezier(.2,.9,.3,1.4) both}
.scanbox{position:relative; overflow:hidden}
.scanbox.fx::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,transparent,rgba(255,92,122,.35),transparent); background-size:100% 40%; background-repeat:no-repeat; animation:scan 1.1s linear 2}
.concl{margin-top:16px; padding:18px 22px; border-radius:20px; background:rgba(91,140,255,.1); border:1px solid rgba(91,140,255,.5); font-size:clamp(22px,2.3vw,30px); font-weight:800; line-height:1.35}
.concl .k{display:block; font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--cyan); margin-bottom:4px; font-weight:700}
.concl em{font-style:normal; color:#fff; background:linear-gradient(transparent 55%,rgba(157,123,255,.65) 55%); padding:0 4px; border-radius:3px}
.clues2{display:grid; gap:14px}
.clue{display:flex; gap:16px; align-items:center; padding:18px 22px; border-radius:20px; background:#F3EEDF; color:#1E180C; box-shadow:0 18px 36px -18px #000; transform:rotate(var(--rot,0deg))}
.clue .no{width:44px; height:44px; flex:0 0 44px; border-radius:12px; display:grid; place-items:center; background:#1E180C; color:#F3EEDF; font-family:var(--mono); font-weight:700; font-size:18px}
.clue p{margin:0; font-size:clamp(21px,2.2vw,28px); font-weight:800; line-height:1.3}
.clue p em{font-style:normal; background:linear-gradient(transparent 55%,rgba(157,123,255,.55) 55%); padding:0 3px}
.clue.fx{animation:popIn .5s cubic-bezier(.2,.9,.3,1.3) both}
.clue.fx:nth-child(2){animation-delay:.25s}
.bigq{font-size:clamp(26px,2.8vw,38px); font-weight:800; line-height:1.2}

/* ─── scene 5 · grammar ─── */
.gtop{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.gtop .cnt{font-family:var(--mono); font-weight:700; font-size:15px; padding:8px 14px; border-radius:12px; background:rgba(59,227,158,.1); border:1px solid rgba(59,227,158,.45); color:#C7F7E2}
.qdots{display:flex; gap:6px}
.qdots button{width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid var(--line); font-family:var(--mono); font-weight:700; color:var(--muted)}
.qdots button.ok{background:rgba(59,227,158,.16); border-color:rgba(59,227,158,.55); color:var(--green)}
.qdots button.rev{background:rgba(255,194,77,.12); border-color:rgba(255,194,77,.5); color:var(--amber)}
.qdots button.skip{background:rgba(255,255,255,.03); border-style:dashed}
.qdots button.cur{background:var(--cyan); border-color:var(--cyan); color:#fff}
.gcase{border-radius:26px; padding:26px; background:linear-gradient(165deg,#1A2158,#0E1338); border:1px solid var(--line2); position:relative; overflow:hidden; min-height:260px; display:flex; flex-direction:column; gap:14px}
.gcase .num{position:absolute; right:18px; top:6px; font-family:var(--dsp); font-weight:800; font-size:96px; color:rgba(255,255,255,.05); line-height:1}
.gcase .ctx{display:flex; gap:10px; align-items:center; font-family:var(--mono); font-size:12.5px; letter-spacing:.14em; color:var(--muted)}
.gcase .sent{font-size:clamp(26px,2.9vw,40px); font-weight:800; line-height:1.3}
.gcase .gp{display:inline-block; min-width:150px; border-bottom:4px dashed var(--soft); margin:0 6px; text-align:center}
.gcase .gp.f{border-bottom-style:solid; border-color:var(--green); color:#fff; background:rgba(59,227,158,.12); border-radius:8px 8px 0 0; padding:0 6px}
.gcase .ev{padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.05); border-left:4px solid var(--coral); font-size:17px; font-weight:700; color:#E3E6FF}
.gfeed{margin-top:14px; padding:16px 18px; border-radius:18px; background:rgba(59,227,158,.1); border:1px solid rgba(59,227,158,.45)}
.gfeed .k{font-family:var(--mono); font-size:12px; letter-spacing:.16em; color:var(--green); font-weight:700}
.gfeed .s{font-size:clamp(20px,2vw,25px); font-weight:800; margin:4px 0}
.gfeed .s b{background:linear-gradient(transparent 55%,rgba(157,123,255,.6) 55%); padding:0 3px}
.gfeed p{margin:0; font-size:18px; font-weight:600}
.gfeed.try{background:rgba(255,194,77,.08); border-color:rgba(255,194,77,.45)} .gfeed.try .k{color:var(--amber)}
.gfeed.rev{background:rgba(91,140,255,.1); border-color:rgba(91,140,255,.45)} .gfeed.rev .k{color:var(--cyan)}
.tctl{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line2)}
.tctl .lab{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--faint); width:100%}
.gtable{display:grid; gap:8px}
.gtable .r{display:grid; grid-template-columns:minmax(150px,.8fr) minmax(170px,1fr) 1.3fr; gap:14px; padding:11px 14px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid var(--line); align-items:center}
.gtable .r.h{background:transparent; border:0; font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--soft); padding:4px 14px}
.gtable .m b{display:block; font-size:16.5px} .gtable .m small{color:#FFE4AA; font-weight:700; font-size:14px}
.gtable .s{font-family:var(--mono); font-weight:700; color:#E2D9FF; font-size:15px}
.gtable .e{font-size:16.5px; font-weight:600}
.gtable .e b{color:#fff; background:linear-gradient(transparent 58%,rgba(157,123,255,.5) 58%)}
.rule{display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 16px}
.rule div{flex:1 1 260px; padding:14px 18px; border-radius:16px; background:rgba(157,123,255,.12); border:1px solid rgba(157,123,255,.5); font-family:var(--mono); font-size:clamp(17px,1.7vw,21px); font-weight:700; color:#fff; text-align:center}
.rule div small{display:block; font-family:Manrope,sans-serif; font-size:13.5px; color:var(--muted); font-weight:700; margin-bottom:4px}
.note2{margin-top:14px; display:grid; gap:8px}
.note2 div{padding:10px 14px; border-radius:12px; background:rgba(255,194,77,.07); border-left:4px solid var(--amber); font-size:16px; font-weight:600}
.note2 b{color:var(--amber)}

/* extra + speaking */
.spq{border-radius:26px; padding:30px; background:linear-gradient(160deg,#1A2156,#0F1438); border:1px solid var(--line2); position:relative}
.spq .q{font-size:clamp(27px,3.1vw,42px); font-weight:800; line-height:1.2}
.spq .n{position:absolute; right:22px; top:6px; font-family:var(--dsp); font-weight:800; font-size:100px; color:rgba(255,255,255,.05); line-height:1}
.sample{font-size:clamp(19px,1.9vw,23px)}

/* ─── scene 6 · advice ─── */
.thinker{display:flex; align-items:center; gap:22px; padding:20px 24px; border-radius:26px; background:linear-gradient(120deg,rgba(255,143,199,.14),rgba(91,140,255,.1)); border:1px solid rgba(255,143,199,.4); position:relative}
.thinker .who{position:relative}
.thinker .who .av{box-shadow:0 0 0 4px var(--bg), 0 0 0 7px var(--mia), 0 0 60px -10px var(--mia)}
.thinker .ph2{position:absolute; right:-14px; bottom:-6px; width:46px; height:76px; border-radius:11px; background:linear-gradient(170deg,#2A3170,#121640); border:2px solid #5560A8; display:grid; place-items:center; font-size:18px; transform:rotate(10deg); box-shadow:0 10px 18px -6px #000}
.thinker .dr{flex:1; min-width:0}
.thinker .draft{display:inline-flex; align-items:center; gap:10px; padding:10px 14px; border-radius:16px; background:rgba(7,11,36,.5); border:1px dashed var(--line3); font-size:17px; color:var(--muted); font-weight:700}
.thinker .draft .cur{width:2px; height:20px; background:var(--soft); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.adv{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px}
.advc{border-radius:24px; padding:22px; text-align:left; background:rgba(255,255,255,.05); border:2px solid var(--line2); display:flex; flex-direction:column; gap:10px; transition:.2s; position:relative; min-height:200px}
.advc:hover{background:rgba(255,255,255,.09); transform:translateY(-2px)}
.advc .L{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:rgba(255,255,255,.08); font-family:var(--dsp); font-weight:800; font-size:24px}
.advc .e{position:absolute; right:18px; top:14px; font-size:38px}
.advc b{font-size:clamp(21px,2.1vw,27px); line-height:1.25}
.advc .fb{font-size:16.5px; font-weight:700; line-height:1.4; padding:10px 12px; border-radius:12px; margin-top:auto}
.advc.best{border-color:var(--green); background:rgba(59,227,158,.12); box-shadow:0 0 40px -14px var(--green)}
.advc.best .L{background:var(--green); color:#03140C}
.advc.best .fb{background:rgba(59,227,158,.14); color:#D7FBEA}
.advc.meh{border-color:rgba(255,92,122,.6); background:rgba(255,92,122,.08)}
.advc.meh .fb{background:rgba(255,92,122,.12); color:#FFD3DB}
.advc.dim{opacity:.55}
.advc .vb{height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.advc .vb i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--violet)); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.advc .vn{font-family:var(--mono); font-size:13px; color:var(--muted); display:flex; justify-content:space-between}

/* ─── scene 7 · team mission ─── */
.tchat{border-radius:28px; overflow:hidden; border:1px solid var(--line2); background:linear-gradient(180deg,#121848,#0B1033); box-shadow:var(--shadow)}
.tchat .cbar{padding:12px 18px}
.tchat .body{padding:18px; display:grid; gap:12px}
.slot{display:flex; gap:12px; align-items:flex-start}
.slot .bx{flex:1; min-width:0; border-radius:18px 18px 18px 6px; padding:12px 16px; border:2px dashed var(--line3); background:rgba(255,255,255,.03)}
.slot .bx .who{font-size:13px; font-weight:800; letter-spacing:.02em}
.slot .bx .task{font-size:clamp(18px,1.7vw,21px); font-weight:700; color:#D9DDFB; margin-top:2px}
.slot .bx .no{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.14em; float:right}
.slot .bx.filled{border-style:solid; border-color:transparent; background:#1D2457}
.slot .bx.filled .task{color:#fff; font-size:clamp(19px,1.8vw,22px)}
.slot .two-av{display:flex; flex-direction:column; gap:4px}

<script>
/* ============================================================
   LESSON 9 · REVISION 7–8 · "The Unsent Message"
   Один файл, vanilla JS, без збірки. Архітектура як в уроках 7–20:
   STEPS (екрани) → draw() → Teacher Mode → Live room (Supabase Realtime).
   ============================================================ */
const CFG = window.LESSON_CONFIG || {};
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => String(s??'').replace(/<[^>]*>/g,'');
const LET = ['A','B','C','D','E','F'];
const SYS_CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
const mmss = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const rand6 = ()=> String(100000+Math.floor(Math.random()*900000));
const qs = new URLSearchParams(location.search);
const ROLE = (qs.get('role')==='student' || qs.has('join')) ? 'student' : qs.has('notes') ? 'notes' : 'teacher';

/* ---------- 1 · state (autosaved to localStorage) ---------- */
const KEY = 'lesson09-unsent-v1';
const FRESH = ()=>({
  i:0, sd:{}, core:false, sound:false, calm:false,
  ev:[],                       // clues found (Scene 4)
  st:{},                       // story scenes marked complete: n -> true
  teams:3, work:{}, oral:false,// team chats: letter -> {m1,m2,m3,m4,w4,sub}
  tdone:{},                    // team presentations: letter -> true
  lv:{},                       // live answers: taskId -> {studentId: value}
  taps:{},                     // (reserved) votes tapped by hand
  wall:{},                     // phone text answers shown on screen: taskId -> [{text, by}]
  timer:{total:300, left:300, endAt:0},
  clock:{start:0, acc:0},
  ua:false, present:false, lock:false, done:false,
  live:false, room:rand6()
});
let S = FRESH();
if(ROLE!=='student') try{ const raw=localStorage.getItem(KEY); if(raw) S = Object.assign(FRESH(), JSON.parse(raw)); }catch(e){}
let saveT=null;
function save(){ if(ROLE!=='teacher') return; clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} },100); }
const sd = id => (S.sd[id] = S.sd[id] || {});
const CALM = ()=> SYS_CALM || !!S.calm;

/* ---------- 2 · sound (WebAudio, no files · OFF by default, Teacher Mode → Sounds) ---------- */
const SFX = {
  ctx:null,
  tone(f,t=.12,type='sine',vol=.06,delay=0){
    if(!S.sound) return;
    try{ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; this.ctx=new C(); }
      const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+delay;
      o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+t);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+t+.02); }catch(e){}
  },
  pop(){ this.tone(660,.08,'triangle',.05); },
  ping(){ this.tone(1320,.11,'sine',.05); this.tone(1760,.14,'sine',.035,.08); },
  ok(){ this.tone(740,.1,'sine',.06); this.tone(990,.14,'sine',.06,.09); },
  no(){ this.tone(240,.16,'triangle',.05); },
  fail(){ this.tone(330,.14,'square',.03); this.tone(220,.26,'square',.03,.12); },
  clue(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.15,'triangle',.05,i*.08)); },
  bell(){ [0,.35,.7].forEach(d=>{ this.tone(880,.3,'sine',.07,d); this.tone(1320,.25,'sine',.04,d); }); }
};

/* ---------- 3 · characters (Mia & Leo — the same photos as Lessons 7–8) ---------- */
const CHARS = {

  if(C.emo) return `<i class="av emo" style="--s:${size}px;--c:${C.c}" role="img" aria-label="${C.name}">${C.emo}</i>`;

}

function sceneHead(s){
  const st=STAGES[s.sc-1];
  return `<div class="shead"><div class="grow"><div class="file">SCENE ${st.n} · ${st.e} ${esc(st.t.toUpperCase())} · ${st.clock} AM</div>
    <h1 class="${s.long?'long':''}">${s.title}</h1>
    ${s.opt||s.chip?`<div class="meta">${s.opt?'<span class="tag opt">⏭ Optional — skip if short on time</span>':''}${s.chip?`<span class="tag vi">${s.chip}</span>`:''}</div>`:''}</div></div>`;
}
function counts(id,n){ const out=Array(n).fill(0); Object.values(S.lv[id]||{}).forEach(v=>{ if(Number.isInteger(v)&&v>=0&&v<n) out[v]++; }); const t=S.taps[id]||[]; return out.map((c,i)=>c+(t[i]||0)); }
function wallHTML(id){ const w=S.wall[id]||[]; return w.length?`<div class="wall">${w.map(x=>`<div class="w">${esc(x.text)}<small>${esc(x.by)}</small></div>`).join('')}</div>`:''; }
const FX = new Set();
const fx = k => FX.has(k) ? 'fx' : '';
let LOOPS = [];
function loop(fn, ms){ LOOPS.push(setInterval(fn, ms)); }
function later(fn, ms){ LOOPS.push(setTimeout(fn, ms)); }
function burst(el, set=['✨','⭐','💬','✨']){
  if(!el || CALM()) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('span'); s.textContent=set[i%set.length];
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;z-index:96;pointer-events:none;font-size:${16+Math.random()*14}px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s`;
    document.body.appendChild(s); const a=Math.random()*Math.PI*2, d=50+Math.random()*80;
    requestAnimationFrame(()=>{ s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*160}deg)`; s.style.opacity='0'; });
    setTimeout(()=>s.remove(),950); }
}
function hintBox(d, html){ return d.hint?`<div class="hintbox pop-in">💡 ${html}</div>`:''; }
const pickOne = a => a[Math.floor(Math.random()*a.length)];
function sampleBox(on, text, label='EXAMPLE ANSWER'){ return on?`<div class="sample stamp"><small>${label}</small>${esc(text)}</div>`:''; }

/* instant-feedback questions: click → green (right) or red (try again). State: d.ic[key] = {w:[wrong], ok, rev} */
const ANS = {};
const icS = (d,key)=> ((d.ic=d.ic||{})[key] = d.ic[key] || {w:[]});
const solved = (d,key)=>{ const s=(d.ic||{})[key]; return !!(s&&(s.ok||s.rev)); };
function icHTML(key, opts, a, d, style){
  ANS[key]=a; const s=(d.ic||{})[key]||{w:[]}, done=s.ok||s.rev, n=counts(key, opts.length), last=s.w[s.w.length-1];
  if(style==='chips') return `<div class="chips3">${opts.map((o,i)=>{ let c='';
      if(done) c = i===a ? 'ok' : (s.w.includes(i)?'no':'off'); else if(s.w.includes(i)) c = (i===last && FX.has('no-'+key)) ? 'no shake' : 'no';
      return `<button class="ch3b ${c}" data-ic="${key}" data-i="${i}" ${done?'aria-disabled="true"':''}><span class="L">${LET[i]}</span>${esc(o)}${n[i]?`<span class="n">${n[i]}</span>`:''}</button>`; }).join('')}</div>`;
  return `<div class="opts">${opts.map((o,i)=>{ let c='';
      if(done) c = i===a ? 'right '+(FX.has('ok-'+key)?'fx':'') : (s.w.includes(i)?'wrongold':'dim');
      else if(s.w.includes(i)) c = (i===last && FX.has('no-'+key)) ? 'wrongpick' : 'wrongold';
      return `<button class="opt ${c}" data-ic="${key}" data-i="${i}" ${done?'aria-disabled="true"':''}><span class="L">${LET[i]}</span><span>${esc(o)}</span><span class="n">${n[i]||''}</span></button>`; }).join('')}</div>`;
}
function bindIC(root, d, after){
  $$('[data-ic]',root).forEach(b=>b.onclick=()=>{
    const key=b.dataset.ic, i=+b.dataset.i, a=ANS[key], s=icS(d,key);
    if(s.ok||s.rev) return;
    if(i===a){ s.ok=true; FX.add('ok-'+key); SFX.ok(); }
    else { if(!s.w.includes(i)) s.w.push(i); FX.add('no-'+key); SFX.no(); toast(pickOne(TRY)); }
    save(); after&&after(key, i===a); draw(false,true);
    if(i===a) setTimeout(()=>burst($(`[data-ic="${key}"].right, [data-ic="${key}"].ok`)),60);
  });
}
function icReveal(d,key){ const s=icS(d,key); if(s.ok) return; s.rev=!s.rev; if(s.rev){ FX.add('ok-'+key); SFX.ok(); } }
function icLive(key, q, opts, d){ const sv=solved(d,key); return {kind:'choice', id:key, q:strip(q), opts:opts.map(strip), lock:sv, correct:sv?ANS[key]:null}; }
const gapS = s => esc(s).replace('___','<span class="gp">&nbsp;</span>');

/* glossary (Scene 3) */
function glossify(t){ return esc(t).replace(/\[\[([^\]]+)\]\]/g,(m,w)=>{ const k=w.toLowerCase(); return `<button type="button" class="gl ${k==='my voice'?'vo':''}" data-gl="${esc(k)}">${esc(w)}</button>`; }); }
function showGloss(btn){
  closeGloss(); const g=GLOSS[btn.dataset.gl]; if(!g) return;
  const p=document.createElement('div'); p.className='glpop'; p.id='glpop'; p.setAttribute('role','tooltip');
  p.innerHTML=`<b>${esc(btn.textContent)}</b><p>${esc(g.d)}</p><p class="u">🇺🇦 ${esc(g.ua)}</p>`;
  document.body.appendChild(p); const r=btn.getBoundingClientRect(), pr=p.getBoundingClientRect();
  let x=Math.min(innerWidth-pr.width-10, Math.max(10, r.left+r.width/2-pr.width/2)), y=r.bottom+10; if(y+pr.height>innerHeight-10) y=r.top-pr.height-10;
  p.style.left=x+'px'; p.style.top=y+'px'; SFX.pop();
}
function closeGloss(){ const p=$('#glpop'); if(p) p.remove(); }
document.addEventListener('click',e=>{ if(!e.target.closest('.gl') && !e.target.closest('#glpop')) closeGloss(); });

const visible = k => { const s=STEPS[k]; return !!s && !(S.core && s.opt); };
const cur = ()=> STEPS[S.i] || STEPS[0];
const nparts = s => s.parts ? s.parts() : 1;

function next(){
  const s=cur(), d=sd(s.id), n=nparts(s);
  if(s.next && s.next(d)) return;
  if((d.p||0) < n-1){ d.p=(d.p||0)+1; s.onPart&&s.onPart(d); FX.add('part'); save(); draw(true,true); return; }
  goNextStep();
}
function goNextStep(){
  const s=cur(), d=sd(s.id);
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length){ s.leave&&s.leave(d); go(k); } else toast('That’s the end of the lesson 🌟');
}
function back(){
  const s=cur(), d=sd(s.id);
  if((d.p||0)>0){ d.p--; s.onPart&&s.onPart(d); save(); draw(true,true); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--;
  if(k>=0) go(k);
}
function go(k){
  const prev=cur().sc;
  S.i=k; clockStart(); FX.add('enter'); closeGloss();
  const ns=STEPS[k].sc;
  if(ns>prev){ for(let n=1;n<ns;n++){ if(!S.st[n]){ S.st[n]=true; FX.add('st-'+n); } } sceneCard(ns); }
  save(); draw(true); $('#stage').scrollTop=0;
}

/* breakout timer: keeps running across screens and page refreshes; never moves the lesson on by itself */
const TDEF=300;
const TIMER = {
  run: ()=> S.timer.endAt>0,
  left: ()=> S.timer.endAt>0 ? Math.max(0,(S.timer.endAt-Date.now())/1000) : S.timer.left,
  start(){ if(this.left()<=0) S.timer.left=S.timer.total=TDEF; S.timer.endAt=Date.now()+S.timer.left*1000; save(); pubState(); SFX.pop(); },
  pause(){ S.timer.left=this.left(); S.timer.endAt=0; save(); pubState(); },
  reset(){ S.timer.total=TDEF; S.timer.left=TDEF; S.timer.endAt=0; save(); pubState(); },
  add(sec){ const l=this.left(); if(this.run()) S.timer.endAt+=sec*1000; else S.timer.left=l+sec; S.timer.total=Math.max(S.timer.total, Math.ceil(this.left())); save(); pubState(); },
  tick(){
    const l=this.left(), chip=$('#tchip');
    const show = this.run() || (S.timer.left<S.timer.total && S.timer.left>0);
    chip.classList.toggle('hidden', !show || ROLE!=='teacher');
    $('#tchipT').textContent=mmss(l); chip.classList.toggle('warn', this.run());
    const bc=$('#bigClock'), rf=$('#ringFg'), rg=$('#ring'); if(bc){ bc.textContent=mmss(l); bc.classList.toggle('end',l<=0); }
    if(rf) rf.style.strokeDashoffset=(326.73*(1-l/Math.max(1,S.timer.total))).toFixed(1); if(rg) rg.classList.toggle('hurry', this.run() && l<=30 && l>0);
    const ts=$('#tStart'); if(ts) ts.textContent=this.run()?'⏸ Pause':'▶ Start '+mmss(l>0?l:TDEF);
    if(this.run() && l<=0){ S.timer.endAt=0; S.timer.left=0; save(); SFX.bell(); toast('⏰ Time’s up! You can close the breakout rooms.'); pubState(); if(cur().id==='build'){ draw(false,true); burst($('#ring'),['⏰','🔔','✨']); } }
  }
};

function confetti(){

  const cols=['#5B8CFF','#9D7BFF','#FF7A66','#FFB36B','#3BE39E','#FF8FC7'];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:4+Math.random()*6, vx:-1.5+Math.random()*3, vy:1.6+Math.random()*3, a:Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.08; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); x.restore(); });
    if(++t<240) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
let SOFT=null;

function softParticles(c){
  if(!c || CALM()) return; const r=c.getBoundingClientRect(), dpr=Math.min(2,devicePixelRatio||1); c.width=r.width*dpr; c.height=r.height*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr);
  const cols=['255,179,107','157,123,255','91,140,255','255,143,199','59,227,158'];
  const P=Array.from({length:46},()=>({x:Math.random()*r.width, y:r.height+Math.random()*r.height, s:2+Math.random()*4, v:.25+Math.random()*.6, w:Math.random()*Math.PI*2, c:cols[Math.floor(Math.random()*cols.length)]}));
  (function f(){ x.clearRect(0,0,r.width,r.height); P.forEach(p=>{ p.y-=p.v; p.w+=.02; p.x+=Math.sin(p.w)*.3; if(p.y<-10){ p.y=r.height+10; p.x=Math.random()*r.width; }
      const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*4); g.addColorStop(0,`rgba(${p.c},.8)`); g.addColorStop(1,`rgba(${p.c},0)`); x.fillStyle=g; x.beginPath(); x.arc(p.x,p.y,p.s*4,0,Math.PI*2); x.fill(); });
    SOFT=requestAnimationFrame(f); })();
}

/* ---------- 9 · live room (Supabase Realtime broadcast + presence; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5–20: таблиці не потрібні, на сервері нічого не зберігається
   (якщо SAVE_ANSWERS = false). Учитель — єдине джерело стану: сцену, завдання й таймер надсилає тільки він,
   а його екран приймає від телефонів лише hello / ans / work / react (з перевіркою). Правильні відповіді
   на телефони не передаються, доки вчитель не відкриє їх на головному екрані. Код кімнати — 6 цифр, новий після Restart. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,10);
const LIVE = {on:false, peers:[]};
const WALLQ = [];        // phone text answers not yet shown {id, task, sid, text, by}
const NAMES = {};
const WORK_F = ['m1','m2','m3','m4','w4','sub'];

const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l09sid'); }catch(e){}   // per tab, survives a refresh
    this.me={id:sid || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') try{ sessionStorage.setItem('l09sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson09-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v[0]&&list.push(v[0])); this.onPeers(list); });
        let first=true;
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ try{ await this.ch.track(this.me); }catch(e){} this.setStatus('live'); if(first){ first=false; clearTimeout(to); res(); } }
            else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ if(first){ first=false; clearTimeout(to); rej(new Error(st)); } else if(this.ch) this.setStatus('reconnecting'); }
          }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); try{ this.sb&&this.ch&&this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson09-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; this.setStatus('local'); return this.kind;
    }catch(e){ this.kind='none'; this.setStatus('off'); return 'none'; }
  },

  send(p){ const msg=Object.assign({},p,{from:this.me}); try{ if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); }catch(e){} },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; this.status='off'; }

      const k=WALLQ.findIndex(w=>w.task===task.id && w.sid===id); const item={id:uid(), task:task.id, sid:id, text, by:NAMES[id]||'student'};

      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l09team-'+room); }catch(e){} render(); };
      $$('[data-w4]',B).forEach(b=>b.onclick=()=>{ if(T.locked) return; W().w4=b.dataset.w4; Net.send({t:'work', team:myTeam, f:'w4', v:b.dataset.w4}); render(); });
      $$('[data-tf]',B).forEach(inp=>{ let tm=null; inp.oninput=()=>{ $('#ok').textContent='…'; W()[inp.dataset.tf]=inp.value.slice(0,140); $('#tchk').innerHTML=checksHTML(W()); clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:inp.dataset.tf, v:inp.value.slice(0,140)}); $('#ok').textContent='✓ Saved — your teacher can see it.'; },700); }; });
      $('#tsub').onclick=()=>{ if(T.locked) return; const v=!W().sub; W().sub=v; Net.send({t:'work', team:myTeam, f:'sub', v}); syncTeam(); };
      return;
    }
    if(T.kind==='react3'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:22px;font-weight:800">🎤 ${esc(T.q)}</p><p class="small">How was it? Tap to react.</p>
        <div class="opts">${[['💬','Clear'],['🧩','Great modals'],['🌟','Kind words']].map(([e,l])=>`<button class="opt" data-r="${e}"><span class="L">${e}</span><span>${l}</span></button>`).join('')}</div></div>`;
      $$('[data-r]',B).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.r}); b.animate?.([{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:250}); });
      return;
    }
  };
  (room && name) ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else if(ROLE==='notes'){ notesApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back; $('#btnSkip').onclick=skipOpt;
  $('#btnHint').onclick=doHint; $('#btnShow').onclick=doReveal;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnLive').onclick=openLive; $('#btnClues').onclick=showClues; $('#btnGram').onclick=showGrammar; $('#btnWords').onclick=showWords;
  $('#btnUA').onclick=toggleUA; $('#btnPresent').onclick=togglePresent;
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  document.addEventListener('keydown',e=>{
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape'){ e.preventDefault(); closeModal(); } return; }
    if(e.target.closest('input,textarea,select,[contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k=e.key;
    if(k==='Escape'){ if($('#glpop')) closeGloss(); else toggleTeacher(false); return; }
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='w'||k==='W') showWords();
    else if(k==='c'||k==='C') showClues();
    else if(k==='g'||k==='G') showGrammar();
    else if(k==='u'||k==='U') toggleUA();
    else if(k==='f'||k==='F'||k==='p'||k==='P') togglePresent();
    else if(k==='h'||k==='H') doHint();
    else if(k==='a'||k==='A') doReveal();
  });
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && S.present){ S.present=false; save(); document.body.classList.remove('present'); paintChrome(); } });
  if(NOTES_BC) NOTES_BC.onmessage=e=>{ const m=e.data||{}; if(m.t!=='cmd') return; if(m.c==='hello') notesPost(); else if(m.c==='next') next(); else if(m.c==='back') back(); else if(m.c==='reveal') doReveal(); else if(m.c==='hint') doHint(); };
  if(S.i>=STEPS.length || !visible(S.i)) S.i=0;
  Object.values(CHARS).forEach(c=>{ if(c.photo){ const im=new Image(); im.src=c.photo; } });
  draw(true);
  if(S.live) startLive(true);   // teacher refreshed the page → reopen the same room; phones stay connected
}
</script>
