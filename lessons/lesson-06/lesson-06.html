/* ═══════════════ 11 · AVA'S MESSAGE (real audio file or browser voice) ═══════════════ */
const Voice = {
  list:[], pick:null, rate:+(localStorage.getItem('ak-l6-rate')||.92), avail:null, playing:false, i:0, n:0, prog:0, audio:null, guard:null, failed:false,
  sents(){ return AVA_TEXT.map(p=>p.split(/(?<=[.!?])\s+/)); },
  init(){
    if(CFG.AUDIO_FILE){
      const a=new Audio(); a.preload='metadata';
      a.onended=()=>this.done();
      a.ontimeupdate=()=>{ if(a.duration){ this.prog=a.currentTime/a.duration; this.paint(); } };
      a.onerror=()=>{ if(this.audio){ console.warn('AUDIO_FILE could not load — using the browser voice'); this.audio=null; this.avail=this.list.length?true:null; this.playing=false; this.paint(true); } };
      a.src=CFG.AUDIO_FILE; this.audio=a; this.avail=true;
    }
    if('speechSynthesis' in window){
      const load=()=>{ this.list=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));
        const saved=localStorage.getItem('ak-l6-voice'); this.pick=this.list.find(v=>v.name===saved)||this.best();
        if(!this.audio && this.list.length) this.avail=true; this.paint(true); };
      load();
      if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load); else speechSynthesis.onvoiceschanged=load;
      setTimeout(()=>{ load(); if(this.avail===null) this.avail=false; this.paint(true); }, 2500);
    } else if(!this.audio) this.avail=false;
  },
  best(){
    const pref=[/Sonia/i,/Libby/i,/Maisie/i,/Aria/i,/Jenny/i,/Google UK English Female/i,/Samantha/i,/Serena/i,/Karen/i,/Moira/i,/Google US English/i];
    for(const r of pref){ const v=this.list.find(v=>r.test(v.name)); if(v) return v; }
    return this.list.find(v=>/en[-_]GB/i.test(v.lang))||this.list.find(v=>/en[-_]US/i.test(v.lang))||this.list[0]||null;
  },
  status(){
    if(this.playing) return this.audio ? 'Playing…' : `Playing… ${Math.min(this.i+1,this.n)} / ${this.n}`;
    if(this.failed) return 'The voice didn’t start. Press ▶ to try again — or read the message aloud.';
    if(this.avail===null) return 'Getting the voice ready…';
    if(this.avail===false) return 'No English voice in this browser. Read the message aloud (Teacher notes → script).';
    return S.heard ? `Played ✓ ${S.heard>1?'('+S.heard+' times) ':''}· press ▶ to listen again` : 'Press ▶ to play Ava’s message';
  },
  toggle(){ this.playing ? this.stop() : this.play(); },
  play(){
    if(this.avail===false) return;
    this.failed=false; this.playing=true; this.prog=0; this.paint(true);
    if(this.audio){ this.audio.currentTime=0; this.audio.play().catch(()=>{ this.playing=false; this.failed=true; this.paint(true); }); return; }
    const paras=this.sents(), list=paras.flat(), paraEnd=paras[0].length; this.n=list.length; this.i=0;
    speechSynthesis.cancel(); let started=false;
    const one=()=>{
      if(!this.playing) return;
      if(this.i>=this.n) return this.done();
      const u=new SpeechSynthesisUtterance(list[this.i]);
      if(this.pick){ u.voice=this.pick; u.lang=this.pick.lang; } else u.lang='en-GB';
      u.rate=this.rate; u.pitch=1.03;
      u.onstart=()=>{ started=true; };
      u.onend=()=>{ if(!this.playing) return; started=true; this.i++; this.prog=this.i/this.n; this.paint(); setTimeout(one, this.i===paraEnd?650:140); };
      u.onerror=e=>{ if(!this.playing || e.error==='interrupted' || e.error==='canceled') return; this.fail(e.error); };
      speechSynthesis.speak(u);
    };
    setTimeout(one, 60);
    clearTimeout(this.guard);
    this.guard=setTimeout(()=>{ if(this.playing && !started && !speechSynthesis.speaking) this.fail('did not start'); }, 4000);
  },
  fail(why){ console.warn('Voice failed:', why); this.playing=false; this.failed=true; try{ speechSynthesis.cancel(); }catch(e){} this.paint(true);
    toast('The browser voice didn’t start. Read the message aloud (Teacher notes → script).'); },
  stop(){ if(!this.playing) return; this.playing=false; clearTimeout(this.guard); if(this.audio) this.audio.pause(); else try{ speechSynthesis.cancel(); }catch(e){} this.paint(true); },
  done(){ clearTimeout(this.guard); this.playing=false; this.prog=1; S.heard=(S.heard||0)+1; save(); if(cur().listen) render(); else this.paint(true); },
  paint(full){
    const vm=$('#vm'); if(!vm) return;
    if(full){ vm.outerHTML=player(vm.dataset.c==='1'); return; }
    const bars=$$('#wave i'); bars.forEach((b,j)=>b.classList.toggle('on', j/bars.length<this.prog));
    const s=$('#vstat'); if(s) s.textContent=this.status();
  }
};

/* ═══════════════ 12 · LIVE CLASS (Supabase Realtime broadcast + presence) ═══════════════
   Той самий механізм, що в уроках 5, 13 і 14: таблиці не потрібні — повідомлення летять
   через канал кімнати lesson6-<CODE>. Кожна кімната має свій канал → сесії не змішуються. */
const configured = ()=>/^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=>Math.random().toString(36).slice(2,10);
const baseURL = ()=>location.href.split('#')[0].split('?')[0];
const joinURL = ()=>baseURL()+'?join='+S.room;
const qrURL = (size=360)=>`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=8&data=${encodeURIComponent(joinURL())}`;
const Live = {on:false, count:0, peers:[], panel:false};
const Net = {
  kind:null, ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  async connect(o){
    this.me={id:o.id||uid(), name:o.name||'', role:o.role};
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{});
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb=createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch=this.sb.channel('lesson6-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>v&&v[0]&&list.push(v[0])); this.onPeers(list); });
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),9000);
          this.ch.subscribe(async st=>{
            if(st==='SUBSCRIBED'){ clearTimeout(to); try{ await this.ch.track(this.me); }catch(e){} res(); }
            if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ clearTimeout(to); rej(new Error(st)); } }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e&&e.message||e); try{ if(this.sb&&this.ch) this.sb.removeChannel(this.ch); }catch(_){} this.sb=null; this.ch=null; }
    }
    try{   /* запасний варіант: лише вкладки цього ж браузера (у доку буде попередження) */
      this.bc=new BroadcastChannel('lesson6-'+o.room);
      this.bc.onmessage=ev=>{ const m=ev.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; return this.kind;
    }catch(e){ this.kind='none'; return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me});
    if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast', event:'msg', payload:msg});
    else if(this.bc) this.bc.postMessage(msg); },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.sb.removeChannel(this.ch); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} }
    this.kind=null; this.ch=null; this.sb=null; this.bc=null; this.peers={}; }
};
function newCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
async function startLive(silent){
  if(!configured()){
    openModal(`<h2>Live class needs Supabase</h2><p>Add your Supabase <b>Project URL</b> and <b>publishable key</b> to <code>window.LESSON_CONFIG</code> at the top of this file — the same values as in Lessons 5, 13 and 14.</p>
      <p class="muted">Teacher-led mode works without it — you can keep teaching.</p><div class="row" style="margin-top:16px"><button class="btn go sm" data-act="closeModal">OK</button></div>`);
    return;
  }
  if(!S.room) S.room=newCode();
  S.live=true; save();
  if(!silent) toast('Connecting the live class…');
  $('#liveLed').className='led warn';
  await Net.connect({role:'teacher', room:S.room, name:'Teacher', onEvent:onTeacherMsg,
    onPeers:list=>{ const seen={}; Live.peers=list.filter(x=>x&&x.role==='student'&&!S.kicked[x.id]&&!seen[x.id]&&(seen[x.id]=1));
      Live.peers.forEach(x=>{ if(x.name) S.names[x.id]=String(x.name).slice(0,24); });
      Live.count=Live.peers.length; paintDock(); paintPanel(); paintJoin(); }});
  Live.on=true; render();
  clearInterval(startLive.hb); startLive.hb=setInterval(pubState, 4000);
  if(!silent) classPanel();
}
function stopLive(){
  if(S.sel.exit==null){ const t=tallyOf('exit'); if(t.tot) S.sel.exit=t.n.indexOf(Math.max(...t.n)); }
  Net.send({t:'end'}); clearInterval(startLive.hb);
  setTimeout(()=>Net.stop(), 300);
  Live.on=false; Live.count=0; Live.peers=[]; S.live=false; S.room=null; S.votes={}; S.subs=[]; S.open={}; S.turn=null; S.hands={}; S.kicked={};
  const j=$('#joinScreen'); if(j) j.remove(); save(); closeModal(); render(); toast('Live class ended');
}
function rosterRow(x){
  const st=cur(), qs=stepQs(st), ans=qs.filter(q=>S.votes[q] && S.votes[q][x.id]!=null).length, turn=S.turn===x.id, hand=!!S.hands[x.id];
  return `<div class="rrow ${turn?'turn':''}"><span class="initial">${esc((x.name||'?')[0].toUpperCase())}</span><span class="nm">${esc(x.name||'Student')}${hand?' ✋':''}</span>
    ${qs.length?`<span class="small muted">${ans}/${qs.length}</span>`:''}
    <button class="btn xs ${turn?'light':''}" data-act="turn" data-id="${esc(x.id)}">${turn?'Take back':'🎯 Give turn'}</button>
    <button class="btn xs ghost" data-act="kick" data-id="${esc(x.id)}" title="Remove from the class" aria-label="Remove ${esc(x.name||'student')}">✕</button></div>`;
}
function classHTML(){
  const url=joinURL(), ok=Net.kind==='supabase';
  return `<h2>Class · room <span style="color:var(--glow)">${esc(S.room)}</span></h2>
    <div class="row" style="gap:22px; margin-top:14px; align-items:center">
      <img src="${qrURL(300)}" width="150" height="150" alt="QR code for the student link" style="border-radius:14px;background:#fff" onerror="this.remove()">
      <div style="flex:1; min-width:220px"><div class="small muted">Student link — share it in the Zoom chat</div>
        <input class="inp" readonly value="${esc(url)}" style="margin-top:6px" onclick="this.select()">
        <div class="row" style="margin-top:10px"><button class="btn go sm" data-act="copyLink">Copy link</button><button class="btn sm" data-act="joinScreen">📺 Show join screen</button></div>
        <p class="small" style="margin-top:10px">${ok?'<span class="led on"></span> Connected via Supabase Realtime':'<span class="led warn"></span> <b style="color:var(--tape)">Not connected to Supabase — only other tabs in this browser can join.</b>'}</p></div></div>
    <div style="font-weight:800; margin-top:18px">Students (${Live.peers.length})</div>
    <p class="small muted">Students can only tap when you press <b>🔓 Open for students</b>. 🎯 gives one student control of the main screen for this step.</p>
    <div class="roster">${Live.peers.length?Live.peers.map(rosterRow).join(''):'<div class="small muted">No one yet. Share the link or show the join screen.</div>'}</div>
    <div class="row" style="margin-top:16px"><button class="btn sm ghost" data-act="hideRes">${S.hideRes?'Show results on screen':'Hide results on screen'}</button><button class="btn sm ghost" data-act="stopLive">End live class</button><button class="btn sm" data-act="closeModal" style="margin-left:auto">Done</button></div>`;
}
function classPanel(){ openModal(classHTML()); Live.panel=true; }
function paintPanel(){ if(Live.panel && !$('#modal').classList.contains('hide')){ const sc=$('.roster'); const top=sc?sc.scrollTop:0; $('#modalBox').innerHTML=classHTML(); const n=$('.roster'); if(n) n.scrollTop=top; } }
function showJoin(){
  closeModal(); const old=$('#joinScreen'); if(old) old.remove();
  const d=document.createElement('div'); d.id='joinScreen'; d.setAttribute('role','dialog');
  d.innerHTML=`<div class="js"><div class="qr"><img src="${qrURL(600)}" alt="QR code for the student link" onerror="this.parentNode.remove()"></div>
    <div><div style="font-weight:800; color:var(--glow)">Join the lesson on your phone or computer</div>
      <div class="codebig" style="font-size:clamp(72px,11vw,150px); margin-top:6px">${esc(S.room)}</div>
      <p class="lead" style="max-width:none">Scan the QR code — or click the link in the Zoom chat — and type your first name. No account needed.</p>
      <div class="names" id="jsNames"></div>
      <div class="row" style="margin-top:24px"><button class="btn go" data-act="closeJoin">Start</button><span class="muted" id="jsCount"></span></div></div></div>`;
  document.body.appendChild(d); paintJoin();
}
function paintJoin(){
  const box=$('#jsNames'); if(!box) return;
  const have=new Set($$('span',box).map(s=>s.dataset.id));
  Live.peers.forEach(x=>{ if(!have.has(x.id)){ const s=document.createElement('span'); s.dataset.id=x.id; s.textContent=x.name||'Student'; box.appendChild(s); } });
  $$('span',box).forEach(s=>{ if(!Live.peers.some(x=>x.id===s.dataset.id)) s.remove(); });
  $('#jsCount').textContent=`${Live.peers.length} joined`;
}
function pubState(){
  if(!Live.on) return; const st=cur();
  Net.send({t:'state', i:S.i, rev:(st.rev||[]).filter(isRev), heard:S.heard, bt:{run:S.bt.run, left:btLeft()},
    open:!!S.open[st.id], turn:S.turn||null, turnName:S.turn?(S.names[S.turn]||''):'', hands:Object.keys(S.hands)});
}
function paintDock(){
  if(MODE!=='teacher') return;
  const lbl=$('#btnLive .lbl'), ok=Net.kind==='supabase';
  if(!Live.on){ $('#liveLed').className='led'; if(lbl) lbl.textContent='Live'; return; }
  $('#liveLed').className='led '+(ok?'on':'warn');
  const qids=stepQs(cur()), got=qids.length?Object.keys(S.votes[qids[0]]||{}).length:null;
  if(lbl) lbl.textContent=`Live · ${Live.count}`+(got!=null?` · ${got} answered`:'');
  const d=$('#dock'); if(!d) return;
  const st=cur(), inter=stepInteractive(st), on=!!S.open[st.id], hands=Object.keys(S.hands).filter(id=>Live.peers.some(x=>x.id===id));
  d.innerHTML=`<div class="dh"><span class="led ${ok?'on':'warn'}"></span>Room <span class="code">${esc(S.room)}</span><span style="margin-left:auto" class="muted">${Live.count} joined</span>
      <button class="btn xs ghost" data-act="dockMin" aria-label="Minimise">${S.dockMin?'▴':'▾'}</button></div>
    ${S.dockMin?'':`<div class="db">${ok?'':'<div class="small" style="color:var(--tape)">⚠ Not connected to Supabase — only tabs in this browser can join.</div>'}
      ${inter?`<div class="small" style="font-weight:800; color:${on?'var(--ok)':'var(--muted)'}">${on?'🔓 Open for students':'🔒 Closed — students just look'}</div>`:''}
      ${qids.length?`<div class="small muted">${qids.map((id,j)=>`${qids.length>1?'Q'+(j+1)+': ':''}<b style="color:var(--text)">${Object.keys(S.votes[id]||{}).length}</b>/${Live.count}`).join(' · ')} answered${S.hideRes?' · results hidden':''}</div>`:''}
      ${S.turn?`<div class="rrow turn" style="font-size:13px"><span class="nm">🎯 ${esc(S.names[S.turn]||'Student')}</span><button class="btn xs" data-act="turn" data-id="${esc(S.turn)}">Take back</button></div>`:''}
      ${hands.length?`<div class="small muted">Raised hands — click to give the turn:</div><div class="hands">${hands.map(id=>`<button class="hand" data-act="turn" data-id="${esc(id)}">✋ ${esc(S.names[id]||'Student')}</button>`).join('')}</div>`:''}
      <div class="row"><button class="btn xs" data-act="classPanel">👥 Class &amp; link</button><button class="btn xs ghost" data-act="joinScreen">📺 Join screen</button></div></div>`}`;
}
function paintTallies(){
  if(S.hideRes) return;
  const groups=$$('.opts[data-qs]'); let missing=false;
  groups.forEach(g=>{ const q=g.dataset.qs, t=tallyOf(q);
    $$('.opt',g).forEach((b,k)=>{ const c=$('.cnt',b), bar=$('.bar',b); if(!c||!bar){ missing=true; return; }
      c.textContent=t.n[k]; bar.style.width=(t.tot?Math.round(t.n[k]/t.tot*100):0)+'%'; }); });
  if(missing) renderSoft();
}
function onTeacherMsg(m){
  if(!m || !m.from || m.from.role==='teacher') return;
  const id=String(m.from.id||'').slice(0,20); if(!id || S.kicked[id]) return;
  if(m.from.name) S.names[id]=String(m.from.name).slice(0,24);
  const st=cur(), turn=S.turn===id, may=!!S.open[st.id] || turn, who=S.names[id]||'A student';
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='hand'){ if(m.up) S.hands[id]=Date.now(); else delete S.hands[id]; save(); paintDock(); paintPanel(); pubState(); if(m.up) toast('✋ '+who+' raised a hand'); return; }
  if(m.t==='vote'){
    const q=m.q; if(!QS[q] || !stepQs(st).includes(q) || isRev(q) || !may) return;
    if(!(Number.isInteger(m.o) && m.o>=0 && m.o<QS[q].o.length)) return;
    (S.votes[q]=S.votes[q]||{})[id]=m.o; if(turn) S.sel[q]=m.o; save();
    if(turn){ toast(`🎯 ${who} chose ${'ABCD'[m.o]}`); renderSoft(); } else { paintTallies(); paintDock(); if(q==='exit') renderSoft(); }
    paintPanel(); return;
  }
  if(m.t==='act' && turn){
    const j=+m.j;
    if(m.a==='flip' && st.kind==='cards' && WORDS[j]){ S.flip[j]=!S.flip[j]; save(); const c=$(`.wcard[data-j="${j}"]`); if(c) c.classList.toggle('flip',S.flip[j]); toast(`🎯 ${who} flipped “${WORDS[j].w}”`); }
    if(m.a==='focus' && st.kind==='speak' && SPEAK[j]){ S.focus=j; save(); renderSoft(); toast(`🎯 ${who} chose question ${j+1}`); }
    return;
  }
  if(m.t==='poster' && m.d && may){
    const d=cleanPoster(m.d), ex=S.subs.find(s=>s.sid===id);
    if(ex){ ex.d=d; ex.added=false; ex.name=who; } else S.subs.push({sid:id, name:who, d, added:false});
    save(); toast('📮 Poster card from '+who);
    if(cur().kind==='present') renderSoft();
  }
}

/* ═══════════════ 13 · STUDENT DEVICE ═══════════════ */
function stuPick(q,o){ if(isRev(q) || STU.i==null || !canAct()) return; STU.ans[q]=o; saveStu(); Net.send({t:'vote', q, o}); if(navigator.vibrate) navigator.vibrate(15); renderStudent(); }
function onStudentMsg(m){
  if(!m || !m.from || m.from.role!=='teacher') return;
  if(m.t==='kick' && m.id===STU.id){ STU.kicked=true; renderStudent(); setTimeout(()=>Net.stop(),300); return; }
  if(m.t==='state'){
    STU.last=Date.now(); STU.ended=false;
    const i=+m.i, rev=Array.isArray(m.rev)?m.rev.map(String):[], open=!!m.open, turn=m.turn?String(m.turn):null;
    const stepChanged = STU.i!==i;
    const permBefore = canAct();
    rev.forEach(r=>{ if(!STU.rev.includes(r)) FRESH.add(r); });
    const changed = stepChanged || rev.join()!==STU.rev.join() || !!m.heard!==!!STU.heard || open!==STU.open || turn!==STU.turn;
    STU.i = STEPS[i]?i:0; STU.rev=rev; STU.heard=m.heard; STU.open=open; STU.turn=turn; STU.turnName=m.turnName||'';
    STU.hand = Array.isArray(m.hands) && m.hands.includes(STU.id);
    STU.bt = m.bt ? {run:!!m.bt.run, left:+m.bt.left||0, end:Date.now()+(+m.bt.left||0)*1000} : null;
    if(stepChanged) FRESH.add('enter');
    if(!permBefore && canAct()){ FRESH.add('perm'); if(navigator.vibrate) navigator.vibrate([40,40,40]); }
    if(changed && !(typing() && !stepChanged)) renderStudent(); else FRESH.clear();
  }
  if(m.t==='end'){ STU.ended=true; renderStudent(); }
}
function renderStudent(){
  const tag=$('#stuTag'); tag.className='tb';
  tag.innerHTML=`<span class="led ${Net.kind==='supabase'?'on':Net.kind?'warn':''}"></span>${esc(STU.name||'Student')} · ${esc(STU.room||'')}`;
  let h, showHand=false;
  if(STU.kicked){
    h = `<div class="stu stack"><h2 class="h1">You left this class.</h2><p class="lead">Your teacher removed you from this live class. Ask your teacher if this was a mistake.</p></div>`;
  } else if(!STU.room || !STU.name || !Net.kind){
    h = !STU.room || !STU.name || !STU.connecting ? `<div class="stu stack">${gallery({mode:'blank', lit:.4})}<h2 class="h1">Join the lesson</h2><p class="lead">Type the room code from your teacher and your first name.</p>
      <input class="inp" id="sCode" placeholder="Room code" maxlength="6" value="${esc(STU.room)}" style="text-transform:uppercase">
      <input class="inp" id="sName" placeholder="Your first name" maxlength="20" value="${esc(STU.name)}">
      <div class="row"><button class="btn go" data-act="stuJoin">Join</button><span id="sErr" class="small" style="color:var(--bad)"></span></div></div>`
      : `<div class="stu"><p class="lead"><span class="waitdot"></span>Connecting…</p></div>`;
  } else if(STU.ended){
    h = `<div class="stu stack"><h2 class="h1">The live class has ended.</h2><p class="lead">Thanks for joining! You can close this page.</p></div>`;
  } else {
    const st = STU.i==null ? null : STEPS[STU.i];
    const warn = Net.kind!=='supabase' ? '<p class="small" style="color:var(--tape)">⚠ Not connected to the online class. Check your internet and open the link again.</p>' : '';
    if(!st || st.kind==='cover') h = `<div class="stu stack">${gallery({mode:'blank', lit:.4})}<h2 class="h1">You’re in, ${esc(STU.name)}!</h2><p class="lead"><span class="waitdot"></span>Wait for your teacher to start. Watch the main screen.</p>${warn}</div>`;
    else { showHand = st.kind!=='end';
      h = `<div class="stu">${warn}<div class="scn"><span class="n">Scene ${st.sc+1}</span><span>${esc(SCENES[st.sc].t)}</span></div>${lockbar(st)}<div class="${canAct()?'':'locked'}">${SR[st.kind]?SR[st.kind](st):''}</div></div>`; }
  }
  const stage=$('#stage'); stage.classList.toggle('enter', FRESH.has('enter') && motionOK());
  stage.innerHTML=`<div class="inner">${h}</div>${showHand?`<button class="handbtn ${STU.hand?'up':''}" data-act="hand" aria-pressed="${STU.hand}">✋ ${STU.hand?'Hand is up':'Raise hand'}</button>`:''}`;
  if(FRESH.has('enter') && STU.i!=null && STEPS[STU.i] && (STEPS[STU.i].kind==='end')) setTimeout(()=>confetti(70),400);
  postRender();
}
async function stuConnect(){
  STU.connecting=true; renderStudent();
  if(!configured()){ STU.connecting=false; $('#stage').innerHTML='<div class="inner"><div class="stu"><h2 class="h2">The live class is not set up on this page.</h2><p class="lead">Ask your teacher — the lesson works on the main screen.</p></div></div>'; return; }
  if(!STU.id) STU.id=uid();
  await Net.connect({role:'student', room:STU.room, name:STU.name, id:STU.id, onEvent:onStudentMsg});
  STU.connecting=false; saveStu(); Net.send({t:'hello'}); renderStudent();
  setInterval(()=>{ if(Date.now()-STU.last>7000) Net.send({t:'hello'}); }, 3500);
}

/* ═══════════════ 14 · BOOT ═══════════════ */
function measure(){
  document.documentElement.style.setProperty('--topH', $('#top').offsetHeight+'px');
  document.documentElement.style.setProperty('--ctlH', $('#ctl').offsetHeight+'px');
}
if(MODE==='notes'){
  document.body.classList.add('notesview'); $('#app').remove(); $('#nPop').remove(); $('#nClose').remove();
  $('#notes').classList.add('open'); document.title='Notes · Lesson 6';
  renderNotes();
  window.addEventListener('storage', e=>{ if(e.key===KEY){ S=loadS(); renderNotes(); } });
} else if(MODE==='student'){
  document.body.classList.add('student');
  const room=(QSP.get('room')||QSP.get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(room && room!==STU.room){ STU.room=room; STU.ans={}; STU.poster=null; saveStu(); }
  if(STU.room && STU.name) stuConnect(); else renderStudent();
} else {
  $('#bBack').onclick=back; $('#bNext').onclick=next; $('#bSkip').onclick=skip;
  $('#bHint').onclick=toggleHint; $('#bOpen').onclick=()=>ACT.openToggle(); $('#bRev').onclick=()=>reveal(cur().rev);
  $('#btnNotes').onclick=toggleNotes; $('#nClose').onclick=toggleNotes;
  $('#nPop').onclick=()=>ACT.popNotes();
  $('#btnMenu').onclick=e=>{ e.stopPropagation(); $('#menu').classList.contains('hide')?openMenu():closeMenu(); };
  $('#btnLive').onclick=()=>ACT.live();
  $('#clock').onclick=()=>{ S.paused=!S.paused; save(); paintClock(); };
  Voice.init(); render(); measure();
  window.addEventListener('resize', measure);
  if(S.live && S.room) startLive(true);
}
</script>
</body>
</html>
