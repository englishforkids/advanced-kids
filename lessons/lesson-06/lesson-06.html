/* avatar & bubbles */
.av{flex:none; border-radius:50%; overflow:hidden; background:var(--c,#333); display:block}

.scrawl.inl.off{transform:translateY(80px) rotate(-34deg)}

.bigdoor{
  position:relative; width:100%; max-width:330px; aspect-ratio:4/5.4; margin:0 auto; border-radius:14px 14px 0 0;
  background:linear-gradient(90deg,#2A3372,#34408C); border:5px solid #414EA6; border-bottom:0; box-shadow:var(--shadow);
}
.bigdoor::after{content:""; position:absolute; right:10%; top:55%; width:18px; height:18px; border-radius:50%; background:var(--glow); box-shadow:0 0 16px rgba(255,227,163,.7)}
.bigdoor .note{
  position:absolute; left:9%; right:9%; top:12%; background:#FFF6D6; color:var(--pi); padding:22px 20px; transform:rotate(-2.5deg);
  box-shadow:0 18px 30px -14px #000; font-family:"Permanent Marker",cursive; font-size:clamp(20px,1.7vw,30px); line-height:1.3;
}
.bigdoor .note.new{animation:noteIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.bigdoor .note::before{content:""; position:absolute; top:-12px; left:50%; width:70px; height:22px; background:rgba(255,212,92,.9); transform:translateX(-50%) rotate(3deg)}
@keyframes noteIn{from{opacity:0; transform:translateY(-30px) rotate(-8deg)}to{opacity:1; transform:rotate(-2.5deg)}}
.inv{background:rgba(167,139,250,.28); border-radius:6px; padding:0 4px; box-shadow:inset 0 -3px 0 var(--lilac)}
.formula{display:flex; flex-wrap:wrap; gap:8px; align-items:stretch; margin-top:14px}
.formula span{display:flex; flex-direction:column; justify-content:center; padding:10px 14px; border-radius:14px; font-weight:800; font-size:.92em; line-height:1.15}
.formula span small{font-weight:700; font-size:.68em; opacity:.8}
.f-tr{background:rgba(255,212,92,.16); border:2px solid var(--tape); color:var(--glow)}
.f-hv{background:rgba(167,139,250,.18); border:2px solid var(--lilac); color:#E1D6FF}
.f-pr{background:rgba(77,139,255,.16); border:2px solid var(--leo); color:#CFE0FF}
.f-mv{background:rgba(79,224,165,.14); border:2px solid var(--ok); color:#C9F7E4}
.plus{align-self:center; color:var(--muted); font-weight:800; padding:0 2px}
.ex-line{font-size:1.12em; font-weight:700; margin-top:8px}
.ex-line .t{color:var(--glow)} .ex-line .h{color:#CDB9FF} .ex-line .p{color:#9FC0FF} .ex-line .m{color:var(--ok)}
.cmp{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-top:10px; font-size:.95em}
.cmp .a{color:var(--muted)} .cmp .arr{color:var(--glow); font-weight:800}

/* sticky notes quiz */
.notes3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:20px}
.sticky{background:#FFF3C4; color:var(--pi); border-radius:4px; padding:20px 18px 18px; box-shadow:0 16px 28px -16px #000; transform:rotate(var(--rot,0deg)); position:relative}
.sticky::before{content:""; position:absolute; top:-10px; left:50%; width:60px; height:20px; background:rgba(255,255,255,.55); transform:translateX(-50%) rotate(-3deg)}
.sticky .sent{font-weight:800; font-size:clamp(17px,1.35vw,25px); line-height:1.3}
.sticky .sent .fill{display:inline-block; min-width:4em; border-bottom:3px solid var(--pi); text-align:center}
.sticky .sent .fill.ok{border-bottom-color:#1F9E6C; color:#137A51; background:rgba(79,224,165,.25); border-radius:4px 4px 0 0; padding:0 4px}
.sticky .opts{gap:8px; margin-top:12px}
.sticky .opt{background:rgba(255,255,255,.6); border-color:rgba(27,30,51,.18); color:var(--pi); min-height:52px; font-size:clamp(15px,1.1vw,20px)}
.sticky .opt .k{background:rgba(27,30,51,.08)}
.sticky .opt.sel{border-color:#6D4BD8; background:rgba(167,139,250,.28)}
.sticky .opt.right{border-color:#1F9E6C; background:rgba(79,224,165,.35)}
.sticky .opt.wrong{border-color:#D63E4E; background:rgba(255,123,123,.3)}
.sticky .ex{color:var(--pi); background:rgba(255,255,255,.55); border-left-color:#1F9E6C}
.sticky .ex b{color:#137A51}
.sticky .btn{color:var(--pi); border-color:rgba(27,30,51,.25)}
.sticky .qmeta{color:#6B6680}

/* memory cards */
.mem{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px}
.memc{border-radius:20px; padding:20px; background:var(--glass); border:1px solid var(--edge2)}
.memc .top{font-family:"Anton",sans-serif; font-size:clamp(24px,1.9vw,36px); line-height:1.05; color:var(--glow)}
.memc .eq{margin-top:10px; font-weight:700}
.memc .eg{margin-top:12px; padding-top:12px; border-top:1px solid var(--edge); color:var(--muted); font-size:.95em}
.memc .eg i{font-style:normal; color:var(--text)}
.key{color:var(--tape); font-weight:800; text-decoration:underline; text-underline-offset:4px}

/* voice message */
.vm{display:flex; gap:18px; align-items:center; padding:18px 20px; border-radius:24px; background:linear-gradient(135deg,rgba(196,161,255,.18),rgba(77,139,255,.1)); border:1px solid rgba(196,161,255,.45)}
.vm .meta{flex:1; min-width:0}
.vm .meta b{font-size:1.08em}
.wave{display:flex; align-items:center; gap:4px; height:40px; margin-top:8px}
.wave i{display:block; width:5px; border-radius:3px; background:rgba(196,161,255,.45); height:var(--h,30%); transition:background .2s}
.wave i.on{background:var(--ava)}
.playing .wave i{animation:wv 1s ease-in-out infinite alternate; animation-delay:var(--d,0s)}
@keyframes wv{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.pbtn{flex:none; width:74px; height:74px; border-radius:50%; background:var(--ava); color:var(--pi); display:grid; place-items:center; font-size:28px; box-shadow:0 12px 30px -10px rgba(196,161,255,.9)}
.pbtn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none}
.vstatus{font-size:.78em; color:var(--muted); font-weight:700; margin-top:6px}
.transcript{margin-top:16px; padding:20px 22px; border-radius:20px; background:var(--paper); color:var(--pi); font-size:clamp(16px,1.15vw,21px); line-height:1.55; animation:pop .25s both}
.transcript p+p{margin-top:.7em}
.transcript .inv{background:rgba(167,139,250,.3); box-shadow:inset 0 -3px 0 #7B5CE0}
.transcript b{color:#7B3FD0}
.tfgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px}
.tf{padding:16px 18px; border-radius:18px; background:var(--glass); border:1px solid var(--edge)}
.tf .st{font-weight:800; font-size:clamp(17px,1.25vw,23px); line-height:1.3}
.tf .opts{grid-template-columns:1fr 1fr; margin-top:10px; gap:8px}
.tf .opt{min-height:50px; justify-content:center; font-size:clamp(16px,1.1vw,20px)}
.tf .opt .k{display:none}
.tf .opts.c3{grid-template-columns:repeat(3,1fr)}
.tf .opts.c1{grid-template-columns:1fr}
.tf .opts.c1 .opt{justify-content:flex-start}
.tf .opts.c1 .opt .k{display:grid}

/* speaking */
.spk{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:18px}
.spq{position:relative; text-align:left; border-radius:22px; padding:20px; background:var(--glass); border:2px solid var(--edge); transition:opacity .25s, border-color .2s, transform .25s; display:flex; flex-direction:column}
.spq .n{font-family:"Anton",sans-serif; font-size:30px; color:var(--glow); line-height:1}
.spq .qq{font-weight:800; font-size:clamp(18px,1.35vw,25px); line-height:1.25; margin-top:8px}
.spq .st{margin-top:auto; padding-top:14px; font-size:.9em; color:var(--muted)}
.spq .st b{color:var(--text); font-weight:700}
.spq.focus{border-color:var(--glow); background:rgba(255,227,163,.08)}
.spk.hasfocus .spq:not(.focus){opacity:.4}
.spq .used{position:absolute; right:14px; top:14px; font-size:13px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--ok); color:var(--pi)}

/* breakout */
.mission{font-family:"Anton",sans-serif; font-size:clamp(26px,2.4vw,44px); line-height:1.08}
.fields{display:grid; gap:10px; margin-top:16px}
.field{display:grid; grid-template-columns:minmax(150px,34%) 1fr; gap:12px; align-items:center; padding:12px 16px; border-radius:14px; background:var(--glass); border:1px solid var(--edge)}
.field span{font-weight:800; color:var(--muted); font-size:.9em}
.field i{font-style:normal; font-weight:700}
.roles{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px}
.role{padding:18px; border-radius:20px; background:var(--glass); border:1px solid var(--edge2); font-weight:800; font-size:clamp(18px,1.4vw,26px); line-height:1.2}
.role .ic{font-size:1.6em; display:block; margin-bottom:6px}
.timer{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:20px; padding:16px 20px; border-radius:22px; border:1px solid var(--edge2); background:rgba(255,212,92,.06)}
.timer .tv{font-family:"Anton",sans-serif; font-size:clamp(44px,4.4vw,80px); line-height:1; font-variant-numeric:tabular-nums; min-width:3.2ch}
.timer.up .tv{color:var(--tape)}
.pform{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.pform label{display:flex; flex-direction:column; gap:4px; font-size:.72em; font-weight:800; color:var(--muted)}
.pform input,.pform select,.pform textarea{
  width:100%; padding:10px 12px; border-radius:11px; border:1px solid var(--edge2); background:rgba(0,0,0,.25); color:var(--text); font-size:16px; font-weight:600;
}
.pform textarea{min-height:64px; resize:vertical}
.pform .full{grid-column:1/-1}
.pwall{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:22px; margin-top:22px; padding-top:8px}
.subs{margin-top:12px; display:grid; gap:8px}
.sub{display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--glass); border:1px solid var(--edge); font-size:.8em}
.sub .t{flex:1; min-width:0}

/* ending */
.stamp{
  position:absolute; right:6%; top:10%; z-index:5; font-family:"Anton",sans-serif; font-size:clamp(28px,3vw,54px); color:var(--ok);
  border:5px solid var(--ok); border-radius:10px; padding:2px 18px; transform:rotate(9deg); background:rgba(10,14,37,.55);
  animation:stampIn .45s cubic-bezier(.2,.9,.3,1.3) .3s both;
}
@keyframes stampIn{from{opacity:0; transform:rotate(9deg) scale(1.8)}to{opacity:1; transform:rotate(9deg) scale(1)}}
.tagcloud{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.tagcloud span{padding:6px 12px; border-radius:999px; background:var(--glass2); border:1px solid var(--edge); font-weight:700; font-size:.82em}

/* cover */
.cover{display:grid; grid-template-columns:1.05fr 1fr; gap:clamp(24px,4vw,64px); align-items:center; min-height:100%}
.cover .kick{font-weight:800; color:var(--glow); font-size:.9em}
.cover .title{font-family:"Anton",sans-serif; font-size:clamp(52px,6.4vw,118px); line-height:.94; margin-top:10px}
.cover .title .lb{position:relative; display:inline-block}
.cover .title .lb::after{
  content:"labelled"; position:absolute; left:4%; top:-.18em; transform:rotate(-8deg); font-family:"Permanent Marker",cursive; font-size:.36em;
  color:#fff; background:var(--marker); padding:0 .3em; border-radius:4px; line-height:1.3; opacity:.9;
}
.cover .lede{margin-top:18px; max-width:44ch; color:var(--muted); font-size:1.02em}
.cover .acts{display:flex; gap:12px; flex-wrap:wrap; margin-top:26px}
.cover .meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px}
.cover .meta span{font-size:.72em; font-weight:800; padding:6px 12px; border-radius:999px; border:1px solid var(--edge2); color:var(--muted)}

/* teacher notes drawer */
#notes{
  position:fixed; right:0; top:var(--topH,64px); bottom:var(--ctlH,78px); width:min(460px,94vw); z-index:40;
  background:#FFF8E7; color:#1E1B2E; border-left:4px solid var(--tape); box-shadow:-30px 0 60px -30px rgba(0,0,0,.9);
  display:flex; flex-direction:column; transform:translateX(105%); transition:transform .25s ease; font-size:16px; line-height:1.5;
}
#notes.open{transform:none}
#notes .nh{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid rgba(0,0,0,.1); font-weight:800}
#notes .nh .btn{color:#1E1B2E; border-color:rgba(0,0,0,.2); background:rgba(0,0,0,.04)}
#notes .nb{overflow:auto; padding:14px 18px 24px}
#notes h4{margin:14px 0 6px; font-size:13px; font-weight:800; color:#8A6A00}
#notes p{margin:0 0 8px}
#notes ul{margin:0 0 8px; padding-left:20px}
#notes li{margin-bottom:4px}
#notes .ans{background:#E6F8EF; border:1px solid #9FDDBF; border-radius:10px; padding:8px 12px}
#notes .ans b{color:#127548}
#notes .tm{display:inline-block; font-weight:800; background:var(--tape); border-radius:999px; padding:2px 10px; font-size:13px}
#notes .script{background:#fff; border:1px solid #E7DDBF; border-radius:10px; padding:10px 12px; font-size:15.5px}
#notes .warn{background:#FFE9EA; border:1px solid #F4B4BA; border-radius:10px; padding:8px 12px; font-size:14.5px}
#notes select{padding:6px 8px; border-radius:8px; border:1px solid rgba(0,0,0,.2); background:#fff; color:#1E1B2E; max-width:100%}
body.notesview{overflow:auto; background:#FFF8E7}
body.notesview #notes{position:static; transform:none; width:auto; height:auto; border:0; box-shadow:none; font-size:18px}

/* live dock + modal + toast + menu */
#dock{
  position:relative; margin-top:auto; width:100%; z-index:2;
  background:rgba(15,21,55,.97); border:1px solid var(--edge2); border-radius:18px; box-shadow:var(--shadow); font-size:14.5px;
}
#dock .dh{display:flex; align-items:center; gap:8px; padding:10px 12px; font-weight:800}
#dock .dh .code{font-family:"Anton",sans-serif; font-size:20px; letter-spacing:.06em; color:var(--glow); font-weight:400}
#dock .db{padding:0 12px 12px; display:grid; gap:8px}
#dock .dh{flex-wrap:wrap}
@media (max-width:900px){ #dock{display:none} }
#dock .db .row{gap:6px}
#modal{position:fixed; inset:0; z-index:60; background:rgba(4,6,20,.72); display:grid; place-items:center; padding:18px}
#modal .box{width:min(640px,100%); max-height:92vh; overflow:auto; background:var(--ink2); border:1px solid var(--edge2); border-radius:24px; padding:26px; box-shadow:var(--shadow)}
#modal .box h2{font-family:"Anton",sans-serif; font-weight:400; font-size:34px; line-height:1.05}
#modal .box p{margin-top:10px}
.codebig{font-family:"Anton",sans-serif; font-size:clamp(56px,9vw,96px); letter-spacing:.08em; color:var(--glow); line-height:1}
.inp{width:100%; padding:14px 16px; border-radius:14px; border:1px solid var(--edge2); background:rgba(0,0,0,.3); color:var(--text); font-size:18px; font-weight:700}
#toast{position:fixed; left:50%; bottom:calc(var(--ctlH,78px) + 18px); transform:translateX(-50%); z-index:70; background:var(--paper); color:var(--pi); font-weight:800; font-size:15px; padding:10px 18px; border-radius:12px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s}
#toast.on{opacity:1}
#menu{position:absolute; right:18px; top:58px; z-index:50; width:300px; background:var(--ink2); border:1px solid var(--edge2); border-radius:16px; padding:8px; box-shadow:var(--shadow)}
#menu button, #menu a{display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; border-radius:10px; font-weight:700; font-size:15px; text-align:left; color:var(--text); text-decoration:none}
#menu button:hover, #menu a:hover{background:var(--glass2)}
#menu hr{border:0; border-top:1px solid var(--edge); margin:6px 4px}
#menu .sw{margin-left:auto; font-size:12.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--glass2); color:var(--muted)}
#menu .sw.on{background:var(--ok); color:var(--pi)}
.wm{position:fixed; left:14px; bottom:calc(var(--ctlH,78px) + 10px); height:20px; width:auto; opacity:.28; z-index:5; pointer-events:none}

/* student device */
body.student #top .tch, body.student #ctl, body.student #room, body.student #chips, body.student .clock{display:none!important}
body.student #main{grid-template-columns:1fr}
body.student #app{grid-template-rows:auto 1fr}
.stu{max-width:640px; margin:0 auto}
.stu .opt{min-height:60px}
.stu .card{margin-top:14px}
.stu .pform{grid-template-columns:1fr}
.stu .waitdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--ok); margin-right:8px; animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}


/* ═════ images ═════ */
.gallery{background:url(img/hall.svg) center bottom/cover no-repeat, linear-gradient(180deg,var(--wall2),var(--wall) 60%,#0D1236)}
.bigdoor{background:url(img/door.svg) center/100% 100% no-repeat, linear-gradient(90deg,#2A3372,#34408C); border:0}
.door{background:url(img/door.svg) center/100% 100% no-repeat, linear-gradient(90deg,#2A3372,#323D86); border:0; border-radius:10px 10px 0 0}
.bigdoor::after,.door::after{display:none}
.bigdoor .note{top:19%}
.door .dn{top:21%}
.pic{display:block; max-width:100%; height:auto}
.roomspic{display:block; max-height:clamp(100px,15vh,170px); width:auto; max-width:100%; margin:16px auto 0}
.thingpic{display:block; width:100%; max-width:230px; height:auto; filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.poster .thing{position:absolute; right:-16px; bottom:-14px; width:84px; height:auto; transform:rotate(8deg); filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)); z-index:3}
.gallery .poster .thing{width:clamp(56px,5vw,84px)}
.wcard .ic{width:clamp(44px,3.6vw,58px); height:auto; display:block; margin-bottom:8px}
.vm{clear:both}
.deco{float:right; width:clamp(110px,11vw,170px); height:auto; margin:0 0 10px 18px}
.turnbar{display:flex; align-items:center; gap:12px; margin:0 0 14px; padding:10px 16px; border-radius:14px; background:rgba(255,212,92,.12); border:1px solid rgba(255,212,92,.55); font-weight:800}
.initial{flex:none; display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--tape); color:var(--pi); font-weight:800; font-size:14px}

/* ═════ animation layer ═════ */
@keyframes rise{from{opacity:0; transform:translateY(16px) rotate(var(--rot,0deg))}to{opacity:1; transform:translateY(0) rotate(var(--rot,0deg))}}
.enter > .inner > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.enter [data-st] > *{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards; animation-delay:calc(var(--i,0) * 70ms + 140ms)}
#sceneCard{position:fixed; inset:0; z-index:45; display:grid; place-items:center; pointer-events:none}
#sceneCard .sc{background:rgba(10,14,37,.9); border:1px solid var(--edge2); border-radius:26px; padding:22px 44px; text-align:center; box-shadow:var(--shadow); animation:scIn 1.3s ease both}
#sceneCard small{display:block; font-weight:800; color:var(--glow); font-size:16px}
#sceneCard b{display:block; font-family:"Anton",sans-serif; font-weight:400; font-size:clamp(34px,4vw,64px); line-height:1.05; margin-top:4px}
@keyframes scIn{0%{opacity:0; transform:scale(.9)}18%{opacity:1; transform:none}70%{opacity:1; transform:none}100%{opacity:0; transform:translateY(-12px)}}
.eyes{transform-box:fill-box; transform-origin:center; animation:blink 5.5s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.who .av,.stu .who .av{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.ant{animation:antb 1.4s steps(2) infinite}
@keyframes antb{50%{opacity:.2}}
.vm.playing .av{animation:ring 1.2s infinite}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(196,161,255,.75)}to{box-shadow:0 0 0 18px rgba(196,161,255,0)}}
.spark{position:fixed; width:10px; height:10px; border-radius:2px; pointer-events:none; z-index:80; animation:spark .85s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.confetti{position:fixed; top:-24px; width:9px; height:15px; border-radius:2px; z-index:80; pointer-events:none; animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
.gallery.lit .beam{animation:beamOn 1s ease both}
.gallery.lit .beam:nth-child(2){animation-delay:.25s} .gallery.lit .beam:nth-child(3){animation-delay:.5s}
@keyframes beamOn{0%{opacity:0}35%{opacity:.9}50%{opacity:.25}100%{opacity:1}}
.gallery.lit .poster{transform-origin:50% 0; animation:swing 4s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(calc(var(--rot,0deg) - .8deg))}to{transform:rotate(calc(var(--rot,0deg) + .8deg))}}
.gallery .crumple{animation:drop .9s .35s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes drop{from{opacity:0; transform:translateY(-240px) rotate(0deg)}}
.gallery .banner{animation:bannerIn .6s .1s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes bannerIn{from{opacity:0; transform:translateY(-30px) rotate(-6deg)}}
#room.sweep::after{content:""; position:absolute; left:0; right:0; top:0; height:60%; pointer-events:none; background:linear-gradient(180deg,transparent,rgba(255,227,163,.28),transparent); animation:sweep 1s ease-out both}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(190%)}}
.mini.bump{animation:bump .7s}
@keyframes bump{30%{transform:rotate(calc(var(--rot,0deg) + 5deg)) scale(1.06)}}
.chip.cur{animation:chipGlow 2.6s ease-in-out infinite}
@keyframes chipGlow{50%{box-shadow:0 0 0 5px rgba(255,227,163,.2)}}
.thingpic{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.opt:active:not(:disabled){transform:scale(.985)}
.ring{--p:1; flex:none; width:clamp(96px,8.4vw,128px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--tape) calc(var(--p) * 360deg), rgba(255,255,255,.1) 0); transition:background .5s}
.ring .tv{width:84%; aspect-ratio:1; border-radius:50%; background:var(--ink2); display:grid; place-items:center; font-size:clamp(26px,2.4vw,40px)!important; min-width:0!important}
.timer.up .ring{background:var(--bad)}

/* ═════ student permissions ═════ */
.lockbar{display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:16px; font-weight:800; margin:4px 0 14px; line-height:1.3}
.lockbar .ico{font-size:1.5em; display:inline-block}
.lockbar.lock{background:rgba(255,255,255,.06); border:1px dashed var(--edge2); color:var(--muted)}
.lockbar.open{background:rgba(79,224,165,.14); border:1px solid rgba(79,224,165,.6); color:#C9F7E4}
.lockbar.turn{background:rgba(255,212,92,.16); border:1px solid var(--tape); color:var(--glow)}
.lockbar.new .ico{animation:wiggle .7s}
@keyframes wiggle{25%{transform:rotate(-16deg) scale(1.25)}60%{transform:rotate(12deg)}}
.locked .opt{opacity:.5}
.handbtn{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:30; border-radius:999px; padding:0 22px; min-height:56px; background:var(--ink2); border:1px solid var(--edge2); font-weight:800; font-size:17px; box-shadow:var(--shadow)}
.handbtn.up{background:var(--tape); color:var(--pi); border-color:var(--tape); animation:wiggle .6s}
.stu{padding-bottom:90px}
.stu .strip{display:flex; justify-content:center; gap:10px; margin-bottom:14px}
.stu .thingpic{max-width:180px; margin:10px auto 0}
.stu .wlist{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stu .wlist .panel{display:flex; flex-direction:column; gap:6px; padding:14px}
.stu .wlist img{width:42px; height:auto}
.btn.openbtn{border-color:rgba(79,224,165,.7); color:#C9F7E4}
.btn.openbtn.on{background:var(--ok); color:var(--pi); border-color:var(--ok)}
.roster{display:grid; gap:6px; max-height:300px; overflow:auto; margin-top:10px}
.rrow{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--glass); border:1px solid var(--edge); font-size:15px; font-weight:700}
.rrow .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rrow.turn{border-color:var(--tape); background:rgba(255,212,92,.1)}
.hands{display:flex; flex-wrap:wrap; gap:6px}
.hand{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:rgba(255,212,92,.16); border:1px solid rgba(255,212,92,.55); color:var(--glow); font-weight:800; font-size:13px; animation:pop .3s both}
#joinScreen{position:fixed; inset:0; z-index:55; background:radial-gradient(90% 70% at 50% 0%, #27318A, var(--ink)); display:grid; place-items:center; padding:24px; overflow:auto; animation:pop .3s both}
#joinScreen .js{display:grid; grid-template-columns:auto 1fr; gap:clamp(24px,4vw,56px); align-items:center; max-width:1150px; width:100%}
#joinScreen .qr{width:clamp(220px,27vw,380px); aspect-ratio:1; background:#fff; border-radius:26px; padding:14px; box-shadow:0 30px 60px -20px #000}
#joinScreen .qr img{width:100%; height:100%; display:block}
#joinScreen .names{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
#joinScreen .names span{padding:8px 14px; border-radius:999px; background:var(--glass2); border:1px solid var(--edge2); font-weight:800; animation:pop .35s both}
@media (max-width:900px){ #joinScreen .js{grid-template-columns:1fr} .deco{display:none} }


/* photo of the exhibition wall (img/arrival.webp) */
.gwrap{position:relative}
.gwrap .gallery{display:none}
.gwrap.fail .gallery{display:flex}
.gwrap.fail .gphoto{display:none}
.gphoto{display:block; width:100%; height:auto; aspect-ratio:1605/980; object-fit:cover; border-radius:28px; border:1px solid var(--edge); box-shadow:var(--shadow); background:var(--wall)}
.enter .gphoto{animation:lightsOn 1.1s ease-out backwards}
@keyframes lightsOn{0%{filter:brightness(.25) saturate(.6)}35%{filter:brightness(.9)}45%{filter:brightness(.55)}100%{filter:none}}

/* photo portraits in the room column (img/photo-*.webp); drawn avatar is the fallback */
.mph{display:block; position:relative; aspect-ratio:1; overflow:hidden; border-radius:2px}
.mph img{display:block; width:100%; height:100%; object-fit:cover}
.mph svg{display:none}
.mph.fail img{display:none}
.mph.fail svg{display:block}
.mini{padding:8px 7px 9px}

/* photo door (img/door.webp); the drawn door.svg underneath is the fallback */
.bigdoor{background:url(img/door.webp) center/100% 100% no-repeat, url(img/door.svg) center/100% 100% no-repeat, #2A3372;
  aspect-ratio:776/1384; width:min(100%, 300px, calc((100dvh - 330px) * .56)); max-width:none!important; border-radius:4px; box-shadow:0 26px 50px -24px rgba(0,0,0,.95)}
.bigdoor .note{top:21%; left:12%; right:12%; padding:16px 14px; font-size:clamp(15px,1.35vw,25px)}
.door{background:url(img/door.webp) center/100% 100% no-repeat, url(img/door.svg) center/100% 100% no-repeat, #2A3372;
  aspect-ratio:776/1384; width:56%; border-radius:3px}
.door .dn{top:20%; left:13%; right:13%}

/* photo items + living highlights */
.thingwrap{position:relative; display:block}
.thingwrap img{display:block; width:100%; height:auto}
.thingpic.thingwrap{max-width:250px}
.thingpic.thingwrap img{-webkit-mask-image:radial-gradient(ellipse 74% 72% at 50% 50%, #000 58%, transparent 100%); mask-image:radial-gradient(ellipse 74% 72% at 50% 50%, #000 58%, transparent 100%)}
.thingpic.thingwrap{filter:drop-shadow(0 16px 22px rgba(0,0,0,.5)); animation:floatz 6s ease-in-out infinite}
@keyframes floatz{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.025) rotate(-.6deg)}}
.poster .thing.thingwrap{width:clamp(96px,8vw,122px); right:-22px; bottom:-18px}
.poster .thing.thingwrap img{border:3px solid #fff; border-radius:6px; box-shadow:0 6px 12px -4px rgba(0,0,0,.4)}
.stu .thingpic.thingwrap{max-width:220px}
.gl{position:absolute; width:10%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; mix-blend-mode:screen}
.gl.red{width:12%; background:radial-gradient(circle, rgba(255,150,120,1) 0, rgba(255,50,35,.6) 28%, rgba(255,50,35,0) 70%); opacity:.6; animation:glowP 1.5s ease-in-out infinite alternate}
.gl.teal{width:10%; background:radial-gradient(circle, rgba(170,255,235,1) 0, rgba(40,230,200,.55) 28%, rgba(40,230,200,0) 70%); opacity:.6; animation:glowP 1s ease-in-out -.4s infinite alternate}
.gl.pink{width:9%; background:radial-gradient(circle, rgba(255,160,200,.95) 0, rgba(235,30,110,.45) 32%, rgba(235,30,110,0) 70%); opacity:.5; animation:glowP 2.3s ease-in-out infinite alternate}
@keyframes glowP{from{opacity:.12}to{opacity:1}}
.gl.star{width:13%; background:radial-gradient(circle, #fff 0, rgba(190,255,200,.75) 18%, rgba(190,255,200,0) 60%); opacity:0; animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,68%,100%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(0)}80%{opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(45deg)}}
.gl.flash{width:32%; background:radial-gradient(circle, rgba(255,255,255,.95) 0, rgba(170,200,255,.45) 25%, rgba(170,200,255,0) 65%); opacity:0; animation:flash 4.2s ease-out infinite}
@keyframes flash{0%,86%,100%{opacity:0}89%{opacity:1}}
.gl.sheen{border-radius:12px; aspect-ratio:auto; overflow:hidden; opacity:0; background:linear-gradient(110deg, transparent 38%, rgba(255,255,255,.4) 50%, transparent 62%) no-repeat; background-size:250% 100%; mix-blend-mode:soft-light; animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%{opacity:1; background-position:130% 0}45%{opacity:1; background-position:-30% 0}46%,100%{opacity:0; background-position:-30% 0}}
.thingwrap.svg .gl{display:none}
.roomsimg{border-radius:18px; animation:neon 4.5s ease-in-out infinite}
@keyframes neon{50%{filter:brightness(1.12) saturate(1.15) drop-shadow(0 0 14px rgba(120,170,255,.25))}}
.roomspic{max-height:clamp(96px,14vh,190px); margin-top:10px!important}
#btBox{margin-top:12px}

/* final exhibition photos (img/exhibit.webp, img/exhibit-open.webp) + living light */
.gwrap.fin{width:fit-content; max-width:100%; margin:0 auto}
.gwrap.fin.fail{width:auto}
.gwrap.fin .gphoto{width:auto; max-width:100%; height:auto; margin:0 auto}
.gwrap .fx{position:absolute; pointer-events:none; mix-blend-mode:screen}
.gwrap.fail .fx{display:none}
.fx.lamp{top:0; width:24%; height:62%; transform:translateX(-50%); border-radius:0 0 50% 50%;
  background:radial-gradient(50% 75% at 50% 0%, rgba(255,226,160,.38), rgba(255,226,160,0) 75%); opacity:.35; animation:lampBreath 5.5s ease-in-out infinite alternate}
@keyframes lampBreath{to{opacity:.9}}
.fx.neon{width:26%; aspect-ratio:2/1; transform:translate(-50%,-50%); border-radius:30%;
  background:radial-gradient(ellipse at center, rgba(110,255,170,.55), rgba(110,255,170,0) 70%); opacity:.7; animation:neonFlicker 4s linear infinite}
@keyframes neonFlicker{0%,100%{opacity:.75}7%{opacity:.2}8%{opacity:.85}10%{opacity:.25}12%{opacity:.8}55%{opacity:.65}57%{opacity:.15}59%{opacity:.8}}
.enter .gwrap.fin .fx{animation-delay:1.1s}

/* Ava photo avatar */
.avph img{display:block; width:100%; height:100%; object-fit:cover}
.avph svg{display:none!important}
.avph.fail img{display:none}
.avph.fail svg{display:block!important}

/* cast on the start screen */
.cast{margin-top:12px}
.castlbl{font-weight:800; font-size:.78em; color:var(--glow); margin-bottom:10px}
.castrow{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.castc{display:flex; flex-direction:column; align-items:center; text-align:center; gap:0; padding:9px 6px 8px; border-radius:18px;
  background:var(--glass); border:1px solid var(--edge); transition:transform .2s, border-color .2s, background .2s}
.castc:hover{transform:translateY(-4px); border-color:var(--c); background:var(--glass2)}
.castc b{font-size:1em; margin-top:5px}
.castc small{font-size:.7em; color:var(--muted); font-weight:700; line-height:1.25}
.pav2{position:relative; display:block; width:clamp(48px,4.4vw,78px); aspect-ratio:1; border-radius:50%; overflow:hidden;
  background:var(--c); box-shadow:0 0 0 3px var(--c), 0 10px 22px -10px rgba(0,0,0,.8); animation:bob 4.5s ease-in-out infinite; animation-delay:var(--bd,0s)}
.pav2 img{display:block; width:100%; height:100%; object-fit:cover}
.pav2 svg{display:none; width:100%; height:100%}
.pav2.fail img{display:none}
.pav2.fail svg{display:block}
@media (max-width:640px){ .castrow{gap:8px} .castc{padding:10px 4px 8px} .castc small{font-size:.62em} }
/* reduced motion */
body.calm *, body.calm *::before, body.calm *::after{animation:none!important; transition:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}

/* responsive */
@media (max-width:1100px){
  .cards,.mem,.notes3,.spk,.roles{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto; min-height:100%}
  #main{grid-template-columns:1fr}
  #room{flex-direction:row; align-items:center; border-right:0; border-bottom:1px solid var(--edge); padding:12px 14px; overflow-x:auto}
  #room .rt,.door,.msgpin{display:none}
  .minis{grid-template-columns:repeat(3,92px)}
  #stage{overflow:visible}
  .split,.split.eq,.split.pres,.split.door2,.cover{grid-template-columns:1fr}
  .brand span{display:none}
  #top{flex-wrap:wrap}
  #chips{order:9; flex:1 1 100%; margin:0}
  .brand{margin-right:auto}
  #ctl{position:sticky; bottom:0}
  #ctl .mid{order:3; width:100%; margin:0; justify-content:center}
  #ctl .stepno{display:none}
  .cover .art{order:-1}
}
@media (max-width:640px){
  .cards,.mem,.notes3,.spk,.roles,.tfgrid,.opts.two,.pform{grid-template-columns:1fr}
  .gallery .wallrow{gap:8px; padding-left:0; padding-right:0}
  .gallery .scrawl{font-size:15px; padding:1px 7px}
  .poster{padding:16px 8px 12px}
  .field{grid-template-columns:1fr}
  #top{gap:8px; padding:8px 10px}
  .brand b{font-size:17px}
  .tb .lbl{display:none}
  .clock{display:none}
  .btn{padding:0 14px}
  .btn.go{padding:0 18px}
  #ctl{gap:8px; padding:10px}
  #ctl .mid .btn{flex:1}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="tb tch" id="backHub" href="../../" title="Назад на платформу курсу" aria-label="Back to the course">←</a>
    <div class="brand"><b>The Unlabelled Room</b><span>Lesson 6 · Revision 4–5</span></div>
    <nav id="chips" aria-label="Scenes"></nav>
    <span id="stuTag" class="hide"></span>
    <button class="clock tch" id="clock" title="Time in this scene. Click to pause or resume."></button>
    <button class="tb tch" id="btnLive" title="Student participation mode"><span class="led" id="liveLed"></span><span class="lbl">Live</span></button>
    <button class="tb tch" id="btnNotes" aria-pressed="false" title="Teacher notes (N)">📝 <span class="lbl">Teacher notes</span></button>
    <button class="tb tch" id="btnMenu" aria-label="Menu" aria-expanded="false">⋯</button>
  </header>
  <main id="main">
    <aside id="room" aria-label="The exhibition room"></aside>
    <section id="stage" tabindex="-1"></section>
  </main>
  <footer id="ctl">
    <button class="btn" id="bBack" title="Back (←)">Back</button>
    <div class="mid">
      <button class="btn openbtn hide" id="bOpen" title="Let students answer on their devices (O)">🔓 Open for students</button>
      <button class="btn" id="bHint" title="Show hint (H)">💡 Show hint</button>
      <button class="btn rev" id="bRev" title="Reveal answer (R)">👁 Reveal answer</button>
      <button class="btn skip hide" id="bSkip" title="Skip optional step (S)">Skip optional step</button>
    </div>
    <span class="stepno" id="stepNo"></span>
    <button class="btn go" id="bNext" title="Continue (→)">Continue</button>
  </footer>
</div>

<aside id="notes" lang="uk" aria-label="Teacher notes">
  <div class="nh">📝 Нотатки вчителя
    <span style="margin-left:auto"></span>
    <button class="btn xs" id="nPop" title="Відкрити нотатки в окремому вікні, щоб учні їх не бачили">Окреме вікно</button>
    <button class="btn xs" id="nClose" aria-label="Закрити нотатки">✕</button>
  </div>
  <div class="nb" id="notesBody"></div>
</aside>
<div id="menu" class="hide" role="menu"></div>
<div id="modal" class="hide" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div id="toast" role="status"></div>

<script>
/* ═══════════════ 1 · CHARACTERS (inline SVG, no image files needed) ═══════════════ */
const PEOPLE = {
  mia:{name:'Mia', c:'#FF9F43', label:'too quirky', role:'makes little robots', thing:'her little robots'},
  leo:{name:'Leo', c:'#4D8BFF', label:'rebel',      role:'has his own style',  thing:'the jacket he designed'},
  sam:{name:'Sam', c:'#35D39A', label:'copycat',    role:'wants to fit in',    thing:'his photos'},
  ava:{name:'Ava', c:'#C4A1FF', label:'',           role:'exhibition team',    thing:'her drawings'}
};
const EYES = (y=47)=>`<circle cx="43" cy="${y}" r="2.3" fill="#1B1E33"/><circle cx="57" cy="${y}" r="2.3" fill="#1B1E33"/>`;
const SMILE = `<path d="M44.5 55.5q5.5 4.2 11 0" stroke="#1B1E33" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
function face(k){
  const bg = `<rect width="100" height="100" fill="${PEOPLE[k].c}"/><circle cx="50" cy="44" r="36" fill="#fff" opacity=".16"/>`;
  if(k==='mia') return `<svg viewBox="0 0 100 100" aria-hidden="true">${bg}
    <circle cx="31" cy="25" r="9" fill="#3B2418"/><circle cx="69" cy="25" r="9" fill="#3B2418"/>
    <path d="M12 100C15 80 32 72 50 72s35 8 38 28Z" fill="#2E3A66"/><rect x="37" y="82" width="26" height="18" rx="4" fill="#FFB870"/>
    <path d="M38 76l3 8M62 76l-3 8" stroke="#FFB870" stroke-width="5" stroke-linecap="round"/>
    <rect x="44" y="58" width="12" height="16" rx="5" fill="#E4B08C"/>
    <ellipse cx="50" cy="45" rx="18" ry="20" fill="#F2C7A5"/>
    <path d="M31 46C29 27 42 22 50 22s21 5 19 24c-3-9-9-14-19-14s-16 5-19 14Z" fill="#3B2418"/>
    <g class="eyes" style="animation-delay:-${(k.charCodeAt(0)%5)*1.1}s">${EYES()}</g><g fill="none" stroke="#1B1E33" stroke-width="1.8"><circle cx="43" cy="47" r="5.8"/><circle cx="57" cy="47" r="5.8"/><path d="M48.8 47h2.4"/></g>
    <circle cx="37.5" cy="55" r="3" fill="#F29C8C" opacity=".55"/><circle cx="62.5" cy="55" r="3" fill="#F29C8C" opacity=".55"/>${SMILE}</svg>`;
  if(k==='leo') return `<svg viewBox="0 0 100 100" aria-hidden="true">${bg}
    <path d="M12 100C15 80 32 72 50 72s35 8 38 28Z" fill="#2F4FA8"/><path d="M43 73l7 12 7-12Z" fill="#EEF0FB"/>
    <path d="M39 73l11 15 11-15" fill="none" stroke="#9DB5FF" stroke-width="3" stroke-linejoin="round"/>
    <rect x="44" y="58" width="12" height="16" rx="5" fill="#B87A52"/>
    <path d="M33 67Q50 81 67 67" stroke="#1B1E33" stroke-width="5" fill="none"/><circle cx="33" cy="66" r="5.5" fill="#FF4D5E"/><circle cx="67" cy="66" r="5.5" fill="#FF4D5E"/>
    <ellipse cx="50" cy="45" rx="18" ry="20" fill="#C98B62"/>
    <path d="M31 44L30 29l7 4 2-11 7 7 5-10 5 9 7-6 1 10 6-2-1 14c-3-10-11-13-19-13s-16 3-19 13Z" fill="#15131F"/>
    <path d="M38.5 41.5h8M53.5 41.5h8" stroke="#15131F" stroke-width="2.2" stroke-linecap="round"/>
    <g class="eyes" style="animation-delay:-${(k.charCodeAt(0)%5)*1.1}s">${EYES()}</g><path d="M45 55.5q6 3 10.5-1" stroke="#1B1E33" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>`;
  if(k==='sam') return `<svg viewBox="0 0 100 100" aria-hidden="true">${bg}
    <path d="M12 100C15 80 32 72 50 72s35 8 38 28Z" fill="#23A877"/>
    <path d="M30 78Q50 62 70 78" stroke="#1C8C62" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M45 80v12M55 80v12" stroke="#EEF0FB" stroke-width="2" stroke-linecap="round"/>
    <rect x="44" y="58" width="12" height="16" rx="5" fill="#6A3F25"/>
    <ellipse cx="50" cy="45" rx="18" ry="20" fill="#7A4B2E"/>
    <g fill="#16100C"><circle cx="34" cy="36" r="6.5"/><circle cx="39" cy="29" r="7"/><circle cx="47" cy="26" r="7"/><circle cx="55" cy="26" r="7"/><circle cx="62" cy="29" r="7"/><circle cx="66" cy="36" r="6.5"/><circle cx="50" cy="31" r="7"/></g>
    <g fill="#fff"><circle cx="43" cy="47" r="3.6"/><circle cx="57" cy="47" r="3.6"/></g><g class="eyes" style="animation-delay:-${(k.charCodeAt(0)%5)*1.1}s">${EYES()}</g>${SMILE}</svg>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${bg}
    <path d="M27 62C23 32 39 22 50 22s27 10 23 40Z" fill="#C8472E"/>
    <path d="M12 100C15 80 32 72 50 72s35 8 38 28Z" fill="#8E6FE0"/><path d="M42 73l8 10 8-10" fill="#FFF3C4"/>
    <rect x="44" y="58" width="12" height="16" rx="5" fill="#E9BBA3"/>
    <ellipse cx="50" cy="45" rx="18" ry="20" fill="#F6D3BF"/>
    <path d="M31 46C31 30 43 25 52 26c9 1 17 7 17 20-6-7-15-9-22-13-4 6-10 10-16 13Z" fill="#C8472E"/>
    <path d="M67 37l12-10" stroke="#FFD45C" stroke-width="3.2" stroke-linecap="round"/>

   <div class="warn"><b>Важливо:</b> у кімнатах учні <b>не бачать</b> вашого екрана. Тому ДО відкриття кімнат: або (1) <b>Copy the card</b> на наступному кроці → вставте в чат і попросіть «writer» скопіювати текст собі або записати на папері; або (2) Share Screen → <i>Share to breakout rooms</i> (є в нових версіях Zoom); або (3) у Live-режимі картка з’явиться на телефонах.</div>`},
  {id:'rooms', sc:5, kind:'rooms', rev:[], hint:'Start your sentence with Never, Rarely or Only then.',
   notes:`<span class="tm">5 хв у кімнатах</span><ul><li>Таймер <b>не</b> перемикає сторінку — ви вирішуєте, коли закрити кімнати.</li><li>Заходьте в кімнати, нагадуйте про речення з інверсією.</li><li>За хвилину до кінця: Zoom → Broadcast: <i>1 minute left!</i></li></ul>`},
  {id:'present', sc:5, kind:'present', rev:[], hint:'Use the frame on the screen. 45 seconds per room.',
   notes:`<span class="tm">3 хв</span><ul><li>Кожна кімната — до 45 с за рамкою на екрані. Бракує часу — <b>Short version</b>: лише назва постера + одне речення з інверсією.</li><li>Поки група говорить, впишіть її постер у форму <b>Add a room’s poster</b> — він з’явиться на фінальній виставці. Якщо не впишете — там будуть приклади.</li><li>Помилка в інверсії → перепитайте: <i>Never … should you…?</i></li></ul>`},

  {id:'exhibit', sc:6, kind:'exhibit', wide:1, rev:[], hint:'',
   notes:`<span class="tm">1 хв</span><p>Урочисте відкриття: замість ярликів — постери груп. Питання: <i>Which poster would you stop at? Why?</i></p>`},
  {id:'exit', sc:6, kind:'exit', rev:[], hint:'There is no wrong answer here.',
   notes:`<span class="tm">1 хв</span><p>Кожен обирає одне речення: пальці 1 / 2 / 3, чат або Live. Клікніть вибір класу — у фіналі це речення з’явиться на дверях кімнати (у Live без кліку береться найпопулярніше).</p>`},
  {id:'end', sc:6, kind:'end', wide:1, rev:[], hint:'',
   notes:`<p>Похваліть групу: зокрема за речення з інверсією. <b>Start a new lesson</b> (тут або в меню ⋯) очищає прогрес і відповіді для наступної групи.</p>`}
];
</script>
<script>
/* ═══════════════ 4 · STATE & HELPERS ═══════════════ */
const CFG = Object.assign({SUPABASE_URL:'', SUPABASE_KEY:'', AUDIO_FILE:''}, window.LESSON_CONFIG||{});
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const KEY='ak-l6-v1', SKEY='ak-l6-student';
const QSP = new URLSearchParams(location.search);
const MODE = QSP.get('notes')==='1' ? 'notes' : (QSP.get('role')==='student' || QSP.has('join')) ? 'student' : 'teacher';
const IDX = Object.fromEntries(STEPS.map((s,i)=>[s.id,i]));
const LABELS = {cover:'Start screen', arrive:'The exhibition opens', voices:'Whose posters are these?', adv1:'Advice for Mia', adv2:'Advice for Leo', adv3:'Advice for Sam',
  cards:'Six more words', wcheck:'Word check', note:'A note on the door', repair:'Repair the notes', memory:'Three more dramatic starters', spot:'Spot the inversion',
  listen1:'First listening: main idea', listen2:'Second listening: True or False', listen3:'What changed Ava’s mind?', speak:'Your turn to talk',
  mission:'The mission', rooms:'In your breakout room', present:'Show us your poster', exhibit:'The exhibition opens', exit:'Exit question', end:'The end'};

function fresh(){ return {i:0, maxI:0, sel:{}, rev:{}, hint:{}, flip:{}, heard:0, tx:false, used:{}, focus:null, ex:false, posters:[], subs:[],
  short:false, calm:false, notes:false, st:{}, paused:false, shortPres:false, bt:{dur:300,left:300,run:false,end:0},
  room:null, live:false, votes:{}, names:{}, hideRes:false, dockMin:false, open:{}, turn:null, hands:{}, kicked:{}}; }
function loadS(){ try{ const o=JSON.parse(localStorage.getItem(KEY)); if(o && typeof o==='object') return Object.assign(fresh(),o); }catch(e){} return fresh(); }
let S = loadS();
if(!STEPS[S.i]) S.i=0;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const cur = ()=>STEPS[S.i]||STEPS[0];
const FRESH = new Set();   // things that changed this moment → animate once

let STU = {room:'', id:'', name:'', ans:{}, poster:null, i:null, rev:[], heard:0, bt:null, ended:false, last:0, kind:null, open:false, turn:null, turnName:'', hands:[], hand:false, kicked:false};
try{ Object.assign(STU, JSON.parse(localStorage.getItem(SKEY))||{}); }catch(e){}
STU.i=null; STU.rev=[]; STU.ended=false; STU.open=false; STU.turn=null; STU.hand=false; STU.kicked=false;
function saveStu(){ try{ localStorage.setItem(SKEY, JSON.stringify({room:STU.room,id:STU.id,name:STU.name,ans:STU.ans,poster:STU.poster})); }catch(e){} }

function isRev(id){ return MODE==='student' ? STU.rev.includes(id) : !!S.rev[id]; }
const canAct = ()=>MODE==='student' ? (STU.open || (STU.turn && STU.turn===STU.id)) : true;
const myTurn = ()=>MODE==='student' && STU.turn && STU.turn===STU.id;
function stepInteractive(st){ return stepQs(st).length>0 || ['mission','rooms','present'].includes(st.kind); }
function stepQs(st){ return st.kind==='arrival' ? ['warm'] : st.kind==='exit' ? ['exit'] : (st.rev||[]).filter(id=>QS[id]); }
function labelOff(k){ return !!S.rev[{mia:'adv1',leo:'adv2',sam:'adv3'}[k]]; }
function posterFor(k){ return [...S.posters].reverse().find(p=>p.ch===k) || DEFAULT_POSTERS[k]; }
function tallyOf(q){ const n=QS[q].o.map(()=>0); Object.values(S.votes[q]||{}).forEach(o=>{ if(n[o]!=null) n[o]++; }); return {n, tot:n.reduce((a,b)=>a+b,0)}; }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),2800); }
function typing(){ const a=document.activeElement; return a && a.matches && a.matches('input,textarea,select'); }

/* ═══════════════ 5 · BUILDING BLOCKS ═══════════════ */
function head(st, title, lead=''){
  const s=SCENES[st.sc];
  return `<div class="scn"><span class="n">Scene ${st.sc+1}</span><span>${esc(s.t)}</span>${st.opt?'<span class="opttag">Optional · skip if short on time</span>':''}</div>
    <h2 class="h1">${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}`;
}
function hintBox(st){ return (MODE==='teacher' && S.hint[st.id] && st.hint) ? `<div class="hintbox ${FRESH.has('hint')?'new':''}">${esc(st.hint)}</div>` : ''; }
function revBtn(id){ return MODE==='teacher' && !isRev(id) ? `<button class="btn xs rev" data-act="rev1" data-q="${id}">Reveal</button>` : ''; }

function qOpts(qid, {cls=''}={}){
  const q=QS[qid], rv=isRev(qid)&&q.c!=null, stu=MODE==='student';
  const sel = stu ? STU.ans[qid] : S.sel[qid];
  const t = (!stu && Live.on && !S.hideRes) ? tallyOf(qid) : null;
  return `<div class="opts ${cls}" data-qs="${qid}">${q.o.map((o,k)=>{
    let c = sel===k ? ' sel' : '';
    if(rv){ c = k===q.c ? ' right' : (sel===k ? ' wrong' : ' dim'); }
    const mark = rv ? (k===q.c ? '✓' : (sel===k ? '✗' : '')) : '';
    const cnt = t ? `<span class="cnt">${t.n[k]}</span><span class="bar" style="width:${t.tot?Math.round(t.n[k]/t.tot*100):0}%"></span>` : '';
    return `<button class="opt${c}" data-act="pick" data-q="${qid}" data-o="${k}" aria-pressed="${sel===k}" ${stu&&(rv||!canAct())?'disabled':''}>
      <span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span>${mark?`<span class="mark">${mark}</span>`:''}${cnt}</button>`;
  }).join('')}</div>`;
}
function qEx(qid){ const q=QS[qid]; if(!isRev(qid) || !q.ex) return ''; return `<div class="ex ${FRESH.has(qid)?'new':''}">${q.ex}</div>`; }
function qCard(id, n, cls=''){ return `<div class="tf"><div class="qhead"><div class="st">${n?n+'. ':''}${esc(QS[id].p)}</div>${revBtn(id)}</div>${qOpts(id,{cls})}${qEx(id)}</div>`; }

function posterHTML(k, {mode='people', rot=0, data=null}={}){
  const p=PEOPLE[k];
  if(mode==='blank') return `<div class="poster" style="--rot:${rot}deg"><div class="blank">?</div><div class="pn">&nbsp;</div><span class="scrawl">${p.label}</span></div>`;
  if(mode==='people') return `<div class="poster" style="--rot:${rot}deg"><div class="pav avph" style="--c:${p.c}">${avImg(k)}</div><div class="pn">${p.name}</div><span class="scrawl ${labelOff(k)?'off':''}">${p.label}</span></div>`;
  const d=data||posterFor(k), kk=PEOPLE[d.ch]?d.ch:'mia';
  return `<div class="poster" style="--rot:${rot}deg"><div class="pav avph" style="--c:${PEOPLE[kk].c}">${avImg(kk)}</div>
    <div class="pn">${PEOPLE[kk].name}${d.old?` · <s class="hand" style="color:#C23A48">${esc(d.old.replace(/[“”"]/g,''))}</s>`:''}</div>
    <div class="ptitle">${esc(d.title||'Untitled')}</div>
    ${d.show?`<div class="pline">Wants to show: <b>${esc(d.show)}</b></div>`:''}
    ${d.adv?`<div class="pline">${esc(d.adv)}</div>`:''}
    ${d.inv?`<div class="pline"><b>${esc(d.inv)}</b></div>`:''}${thingPic(kk,'thing')}</div>`;
}
const FINAL_PHOTOS = {
  open:{src:'img/exhibit-open.webp', w:1200, h:922, lamps:[21,50,82], neon:[83.9,15.2],
        alt:'The exhibition is open: posters of Mia, Leo and Sam with new titles; the old labels lie on the floor.'},
  wall:{src:'img/exhibit.webp', w:1600, h:649, lamps:[12.7,50,88.4],
        alt:'The finished exhibition wall: Inventor Mia, Leo’s Own Style and The Real Sam; the old labels lie on the floor.'}
};
function gallery({mode='blank', lit=.35, stamp=false, photo=true, maxh=''}={}){
  if(mode==='final' && photo){   /* фото фінальної виставки; якщо не завантажиться — намальована виставка */
    const P=FINAL_PHOTOS[stamp?'open':'wall'];
    return `<div class="gwrap fin"><img class="gphoto" src="${P.src}" alt="${esc(P.alt)}" style="aspect-ratio:${P.w}/${P.h};${maxh?`max-height:${maxh};`:''}" onerror="this.parentNode.classList.add('fail')">
      ${P.lamps.map((x,i)=>`<i class="fx lamp" style="left:${x}%; animation-delay:${-i*1.3}s"></i>`).join('')}${P.neon?`<i class="fx neon" style="left:${P.neon[0]}%; top:${P.neon[1]}%"></i>`:''}
      ${gallery({mode, lit, stamp, photo:false})}</div>`;
  }
  if(mode==='blank' && photo)   /* фото-версія зали; якщо файл не завантажиться — показується намальована */
    return `<div class="gwrap"><img class="gphoto" src="img/arrival.webp" alt="An exhibition wall called How Others See Me with three blank posters. Red labels on them say: too quirky, rebel, copycat." onerror="this.parentNode.classList.add('fail')">${gallery({mode, lit, stamp, photo:false})}</div>`;
  const ks=['mia','leo','sam'];
  return `<div class="gallery ${lit>=1?'lit':''}" style="--lit:${lit}">
    <div class="beam" style="left:2%"></div><div class="beam" style="left:35%"></div><div class="beam" style="left:68%"></div>
    <div class="banner">How Others See Me${mode==='final'?'<small>…and how we see ourselves</small>':''}</div>
    <div class="wallrow">${ks.map((k,j)=>posterHTML(k,{mode, rot:[-2.2,1.4,-1.2][j]})).join('')}</div>
    ${mode==='final'?'<span class="crumple" style="left:7%;transform:rotate(-14deg)">too quirky</span><span class="crumple" style="left:45%;transform:rotate(9deg)">rebel</span><span class="crumple" style="left:77%;transform:rotate(-5deg)">copycat</span>':''}
    ${stamp?'<div class="stamp">Open</div>':''}<div class="floorline"></div></div>`;
}
const QUOTES = {
  mia:'“They called me <b>quirky</b> because I like making strange little robots.” '+ROBOT,
  leo:'“Everyone expects me to <b>conform</b>. They want me to dress like the <b>mainstream</b> group.”',
  sam:'“I tried to <b>fake it</b> so I could <b>fit in</b>, but it felt wrong.”'
};
const quote = (k, bold)=> bold ? QUOTES[k] : QUOTES[k].replace(/<\/?b>/g,'');

const roomsPic = cls=>`<img class="${cls} roomsimg" src="img/rooms.webp" alt="Three breakout rooms with students talking, writing and presenting" onerror="this.onerror=null;this.src='img/rooms.svg'">`;
/* ═══════════════ 6 · SCENES (teacher screen) ═══════════════ */
const R = {};
const CAST = [['mia','builds robots'],['leo','has his own style'],['sam','tries to fit in'],['ava','exhibition team']];
/* фото-аватар героя: img/photo-*.webp, якщо немає — намальований */
const photoAv = k=>`<span class="pav2"><img src="img/${AVATAR[k]}" alt="${PEOPLE[k].name}" onerror="this.parentNode.classList.add('fail')">${face(k)}</span>`;
R.cover = ()=>`<div class="cover"><div>
    <div class="kick">Advanced Kids · Lesson 6 · Revision of Lessons 4–5</div>
    <h1 class="title">The <span class="lb">Unlabelled</span> Room</h1>
    <p class="lede">Three posters. Three labels that someone else wrote. Today you help Mia, Leo and Sam tell their own stories.</p>
    <div class="acts">
      <button class="btn go" data-act="next">${S.maxI>1?'Continue the lesson':'Start the lesson'}</button>
      <button class="btn" data-act="live">📡 ${Live.on?'Live class is on':'Start live class'}</button>
      <button class="btn ghost" data-act="joinForm">I’m a student</button>
      ${S.maxI>1?'<button class="btn ghost" data-act="reset">Start a new lesson</button>':''}
    </div>
    <div class="meta"><span>7 scenes</span><span>60 minutes</span><span>breakout rooms</span></div>
    <img src="../../assets/watermark.png" alt="" onerror="this.remove()" style="height:22px;width:auto;opacity:.35;margin-top:26px">
  </div><div class="art">${gallery({mode:'blank', lit:.3})}
    <div class="cast"><div class="castlbl">Meet the characters</div>
      <div class="castrow">${CAST.map(([k,role],i)=>`<div class="castc" style="--c:${PEOPLE[k].c}; --bd:${-i*1.1}s">
        <span class="cph">${photoAv(k)}</span><b>${PEOPLE[k].name}</b><small>${role}</small></div>`).join('')}</div></div>
  </div></div>`;

R.arrival = st=>`<div class="split top"><div>
    <div class="scn"><span class="n">Scene 1</span><span>Arrival</span></div>${gallery({mode:'blank', lit:.35})}
    <p class="lead" style="max-width:none; margin-top:16px">The school exhibition opens today. Every student needs a poster about themselves. But someone has already written labels on them…</p></div>
  <div><h2 class="h1" style="font-size:clamp(30px,2.9vw,50px)">${esc(QS.warm.p)}</h2>${qOpts('warm')}
    <div class="row" style="margin-top:6px"><div class="frame">I’d choose <span class="gap"></span> because <span class="gap"></span>.</div>
    <button class="btn sm" data-act="think" id="thinkBtn" style="margin-top:14px">${thinkLabel()}</button></div>
    ${hintBox(st)}</div></div>`;

R.voices = st=>`${head(st,'Whose posters are these?','Three students found labels on their posters. Read what they say.')}
  <div class="spk" style="margin-top:24px">${['mia','leo','sam'].map(k=>`<div>
    <div class="who">${av(k,84)}<div><div class="nm">${PEOPLE[k].name}</div><div class="rl">Label: <span class="hand" style="color:#FF8F99">${PEOPLE[k].label}</span></div></div></div>
    <div class="bubble" style="margin-top:14px">${quote(k, !!S.hint.voices)}</div>${thingPic(k)}</div>`).join('')}</div>${hintBox(st)}`;

R.advice = st=>{
  const q=QS[st.q], k=q.who, rv=isRev(st.q), n=+st.q.slice(3), drop=rv&&FRESH.has(st.q);
  return `${head(st,`Advice for ${PEOPLE[k].name}`)}
  <div class="split top" style="margin-top:18px"><div>
    <div class="who">${av(k,110)}<div><div class="nm" style="font-size:1.3em">${PEOPLE[k].name}</div><div class="rl">${n} of 3</div></div>
      <span class="scrawl inl ${rv&&!drop?'off':''}" ${drop?'data-drop':''}>${PEOPLE[k].label}</span></div>
    <div class="bubble" style="margin-top:18px">${QUOTES[k]}</div>
    ${rv?`<div class="bubble reply ${FRESH.has(st.q)?'new':''}" style="margin-top:14px">“${esc(q.reply)}”</div>`:`<div style="margin-top:14px">${thingPic(k)}</div>`}</div>
    <div class="panel"><div class="q">${esc(q.p)}</div><div class="qmeta">Choose the best advice.</div>${qOpts(st.q)}${qEx(st.q)}</div>
  </div>${hintBox(st)}`;
};

R.cards = st=>{
  const all=isRev('cards'), anim=all&&FRESH.has('cards');
  return `${head(st,'Six more words','Explain the word in your own words. Then flip the card.')}
  <div class="cards">${WORDS.map((w,j)=>{ const on=all||S.flip[j];
    return `<button class="wcard ${on&&(!anim||S.flip[j])?'flip':''} ${w.hurt?'hurt':''}" ${on&&anim&&!S.flip[j]?'data-flipnow':''} data-act="flip" data-j="${j}" aria-label="${esc(w.w)}">
      <span class="in"><span class="f">${pic(w.ic+'.svg','ic')}<span class="wd">${esc(w.w)}</span><span class="ps">${esc(w.ps)}</span></span>
      <span class="b"><small>${esc(w.w)}</small>${esc(w.d)}</span></span></button>`; }).join('')}</div>
  <div class="care" style="margin-top:16px"><b>Careful:</b> <i>misfit</i> and <i>outcast</i> can hurt. We can use them to talk about our feelings — “I felt like a misfit” — but never as labels for other people.</div>${hintBox(st)}`;
};

R.wcheck = st=>`${head(st,'Word check','Choose the word that fits.')}<div class="tfgrid">${st.rev.map((id,j)=>qCard(id,j+1,'c3')).join('')}</div>${hintBox(st)}`;

R.noteIntro = st=>`${head(st,'A note on the door')}
  <div class="split door2" style="margin-top:14px"><div class="bigdoor"><div class="note ${FRESH.has('enter')?'new':''}">Only when you see the whole person <span class="${S.hint.note?'inv':''}">will you understand</span> their story.</div></div>
  <div class="stack">
    <p style="font-size:1.08em">After some words and phrases at the beginning of a sentence, the <b>helping verb</b> goes <b>before the person</b>. This makes the sentence sound more dramatic or emphatic.</p>
    <div class="formula"><span class="f-tr">Never / Rarely / Only then / Not until…</span><span class="plus">+</span><span class="f-hv">helping verb</span><span class="plus">+</span><span class="f-pr">person</span><span class="plus">+</span><span class="f-mv">main verb</span></div>
    <div class="panel">
      <div class="ex-line"><span class="t">Never</span> <span class="h">have</span> <span class="p">I</span> <span class="m">felt</span> so nervous.</div>
      <div class="ex-line"><span class="t">Only then</span> <span class="h">did</span> <span class="p">I</span> <span class="m">understand</span> her.</div>
      <div class="cmp"><span class="a">I have never felt so nervous.</span><span class="arr">→</span><span>Never have I felt so nervous.</span></div>
    </div></div></div>${hintBox(st)}`;

R.repair = st=>`${head(st,'Repair the notes','Someone wrote these notes in a hurry. Choose the words that fix them.')}
  <div class="notes3">${st.rev.map((id,j)=>{ const q=QS[id], rv=isRev(id), pr=q.p.split('___');
    return `<div class="sticky" style="--rot:${[-1.5,1,-.8][j]}deg">
      <div class="sent">${j+1}. ${esc(pr[0])}<span class="fill ${rv?'ok':''}">${rv?esc(q.o[q.c]):'&nbsp;'}</span>${esc(pr[1])}</div>
      ${qOpts(id)}${rv?`<div class="ex ${FRESH.has(id)?'new':''}">${q.ex}<br><b>${esc(q.full)}</b></div>`:''}
      <div class="row" style="margin-top:10px">${revBtn(id)}</div></div>`; }).join('')}</div>${hintBox(st)}`;

R.memory = st=>`${head(st,'Three more dramatic starters','You know these from Lesson 5. Just remember them.')}
  <div class="mem">
    <div class="memc"><div class="top">Little did I know…</div><div class="eq">= I didn’t know at that time…</div><div class="eg"><i>Little did I know</i> that the posters had labels on them.</div></div>
    <div class="memc"><div class="top">Hardly had we arrived <span class="key">when</span>…</div><div class="eq">= one thing happened immediately after another.</div><div class="eg"><i>Hardly had we arrived when</i> the lights went out.</div></div>
    <div class="memc"><div class="top">No sooner had we arrived <span class="key">than</span>…</div><div class="eq">= similar meaning; use <span class="key">than</span>.</div><div class="eg"><i>No sooner had we arrived than</i> Ava sent a message.</div></div>
  </div>${hintBox(st)}`;

R.spot = st=>`${head(st,'Spot the inversion','Which sentence uses inversion correctly?')}
  <div class="spk">${st.rev.map((id,j)=>`<div class="tf"><div class="qhead"><div class="st">${j+1}.</div>${revBtn(id)}</div>${qOpts(id,{cls:'c1'})}${qEx(id)}</div>`).join('')}</div>${hintBox(st)}`;

function player(compact){
  const pl=Voice.playing;
  const bars=Array.from({length:34},(_,j)=>`<i style="--h:${22+Math.round(Math.abs(Math.sin(j*1.7))*70)}%;--d:${(j%7)*.09}s" class="${(pl||S.heard)&&j/34<Voice.prog?'on':''}"></i>`).join('');
  return `<div class="vm ${pl?'playing':''}" id="vm" data-c="${compact?1:0}">${av('ava',compact?56:72)}
    <div class="meta"><b>Ava · exhibition team</b><div class="wave" id="wave">${bars}</div><div class="vstatus" id="vstat">${Voice.status()}</div></div>
    <button class="pbtn" id="pbtn" data-act="play" ${Voice.avail===false&&!pl?'disabled':''} aria-label="${pl?'Stop the message':'Play message'}">${pl?'■':'▶'}</button></div>`;
}
function txRow(){
  return `<div class="row" style="margin-top:12px">
    <button class="btn sm" data-act="tx" ${S.heard?'':'disabled'}>${S.tx?'Hide transcript':'📄 Show transcript'}</button>
    ${S.heard?'':'<span class="small muted">The transcript opens after the first listening.</span><button class="btn xs ghost" data-act="readAloud">Teacher read it aloud — unlock</button>'}</div>
    ${S.tx&&S.heard?`<div class="transcript">${avaMarked()}</div>`:''}`;
}

    <div class="panel"><div class="q">${esc(QS.li1.p)}</div>${qOpts('li1',{cls:''})}${qEx('li1')}</div></div>${hintBox(st)}`;

function exitSentence(){
  let k = MODE==='student' ? null : S.sel.exit;
  if(k==null && MODE!=='student'){ const t=tallyOf('exit'); if(t.tot) k=t.n.indexOf(Math.max(...t.n)); }
  return k==null ? '' : QS.exit.o[k].replace(/[“”]/g,'');
}

/* ═══════════════ 7 · STUDENT DEVICE SCREENS ═══════════════ */
function lockbar(st){
  if(!stepInteractive(st) && !myTurn()) return '';
  const nw = FRESH.has('perm') ? ' new' : '';
  if(myTurn()) return `<div class="lockbar turn${nw}"><span class="ico">🎯</span><span>It’s your turn! Your choice appears on the main screen.</span></div>`;
  if(STU.open) return `<div class="lockbar open${nw}"><span class="ico">🔓</span><span>Your turn to answer — tap your choice.</span></div>`;
  return `<div class="lockbar lock${nw}"><span class="ico">🔒</span><span>Look and think. Your teacher will open this task soon.</span></div>`;
}
function stuPosterForm(){
  const p=STU.poster||{}, ok=canAct();

      ${[['old','Old label'],['title','New poster title'],['show','One thing this person wants to show'],['adv','Our advice'],['inv','Our dramatic sentence (Never / Rarely / Only then…)']].map(([k,l])=>
        `<label>${l}<input id="sf-${k}" maxlength="${k==='inv'?140:80}" value="${esc(p[k]||'')}"></label>`).join('')}

}

const listenHead = t=>`<div class="vm ${STU.heard?'':'playing'}">${av('ava',52)}<div class="meta"><b>🎧 ${t}</b><div class="small muted">It plays on your teacher’s screen.</div></div></div>`;
SR.listen1 = ()=>`${pic('voice.svg','thingpic')}${listenHead('Listen to Ava’s message')}<div class="q card">${esc(QS.li1.p)}</div>${qOpts('li1')}${qEx('li1')}`;

SR.listen3 = ()=>`${av('ava',64)}<div class="q card">What changed Ava’s mind?</div><p class="muted card">Get ready to answer out loud in one sentence.</p>${isRev('li6')?'<div class="ex">Her friend encouraged her to share a drawing.</div>':''}`;
SR.speak = ()=>`${pic('speak.svg','thingpic')}<h2 class="h2">Your turn to talk</h2><p class="muted">You can talk about a made-up character if you prefer.</p>`+SPEAK.map((s,j)=>`<div class="panel card"><b>${j+1}. ${esc(s.q)}</b><div class="small muted" style="margin-top:6px">Start with: ${esc(s.st)}</div>${myTurn()?`<button class="btn xs" data-act="stuAct" data-a="focus" data-j="${j}" style="margin-top:10px">Spotlight on screen</button>`:''}</div>`).join('');

<script>
/* ═══════════════ 8 · RENDER ═══════════════ */
function renderChips(){
  const st=cur();
  $('#chips').innerHTML = SCENES.map((s,j)=>`<button class="chip ${j===st.sc?'cur':''} ${j<st.sc?'done':''}" data-act="scene" data-s="${j}" title="Scene ${j+1}: ${esc(s.t)}" ${j===st.sc?'aria-current="step"':''}>
    <i>${j<st.sc?'✓':j+1}</i><span class="nm">${esc(s.t)}</span></button>`).join('');
}
function renderRoom(){
  const st=cur(), sc=Math.max(0,st.sc), known=S.i>=IDX.voices;
  document.documentElement.style.setProperty('--lit', (0.25 + sc*0.11).toFixed(2));
  const minis=['mia','leo','sam'].map((k,j)=>{
    const off=labelOff(k), drop=off&&FRESH.has({mia:'adv1',leo:'adv2',sam:'adv3'}[k]);
    const hasNew=S.i>=IDX.present && S.posters.some(p=>p.ch===k);
    return `<div class="mini" style="--rot:${[-2,1.5,-1][j]}deg">
      ${known?`<span class="mph"><img src="img/photo-${k}.webp" alt="${PEOPLE[k].name}" onerror="this.parentNode.classList.add('fail')">${face(k)}</span>`:'<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="#E9E2D2"/><text x="50" y="64" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="42" fill="#B6AC95">?</text></svg>'}
      <div class="nm">${known?PEOPLE[k].name:'&nbsp;'}</div>${hasNew?`<div class="tt">${esc(posterFor(k).title)}</div>`:''}
      <span class="lb ${off&&!drop?'off':''}" ${drop?'data-drop':''}>${PEOPLE[k].label}</span></div>`;
  }).join('');
  $('#room').innerHTML = `<div class="rt"><span>Exhibition room</span><span>Scene ${sc+1} of 7</span></div>

function burst(el, n=20){

  for(let i=0;i<n;i++){ const s=document.createElement('i'); s.className='spark'; const a=Math.random()*Math.PI*2, d=60+Math.random()*100;
    s.style.cssText=`left:${r.left+r.width*(.15+Math.random()*.7)}px;top:${r.top+r.height/2}px;background:${COLS[i%6]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--r:${Math.random()*540}deg`;

    c.style.cssText=`left:${Math.random()*100}vw;background:${COLS[i%6]};animation-duration:${dur}s;animation-delay:${Math.random()*.6}s;--dx:${(Math.random()-.5)*160}px;--r:${Math.random()*900}deg`;

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]');
  if(!e.target.closest('#menu,#btnMenu')) closeMenu();
  if(e.target.id==='modal') return closeModal();
  if(!b || b.disabled) return;

});
document.addEventListener('keydown', e=>{
  if(MODE!=='teacher') return;
  const t=e.target;
  if((e.key==='Enter'||e.key===' ') && t.getAttribute && t.getAttribute('role')==='button'){ e.preventDefault(); t.click(); return; }
  if(t.matches && t.matches('input,textarea,select')) return;
  if($('#joinScreen')){ if(e.key==='Escape'||e.key==='Enter') $('#joinScreen').remove(); return; }
  if(!$('#modal').classList.contains('hide')){ if(e.key==='Escape') closeModal(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){ e.preventDefault(); if(!$('#bNext').disabled) next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
  else if(k==='h'||k==='H') toggleHint();
  else if(k==='r'||k==='R'){ if(!$('#bRev').disabled) reveal(cur().rev); }
  else if(k==='n'||k==='N') toggleNotes();
  else if(k==='s'||k==='S'){ if(cur().opt) skip(); }
  else if(k==='o'||k==='O') ACT.openToggle();
  else if(k==='Escape'){ closeMenu(); if(S.notes) toggleNotes(); }
});
