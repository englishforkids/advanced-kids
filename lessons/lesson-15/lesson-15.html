.dots i.ok{background:var(--ok)}
.qhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.qtext{font-size:clamp(24px,2.6vw,34px); font-weight:800; margin-bottom:22px}

/* ─── warm-up ─── */
.two{display:grid; grid-template-columns:1fr 1fr; gap:24px}
.qcard .num{font-family:var(--mono); color:var(--past); font-size:15px; letter-spacing:.14em}
.qcard .q{font-size:clamp(24px,2.4vw,32px); font-weight:800; margin:10px 0 10px}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{padding:10px 16px; border-radius:99px; background:var(--glass2); border:1.5px solid var(--edge2); font-weight:700; font-size:18px; transition:.15s}
.poll{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:8px}
.pollb{position:relative; overflow:hidden; padding:18px 10px; border-radius:18px; background:var(--glass); border:2px solid var(--edge); text-align:center; font-weight:800; font-size:20px}
.pollb .e{display:block; font-size:34px; margin-bottom:4px}
.pollb .n{display:block; font-family:var(--mono); font-size:26px; color:var(--now); margin-top:4px}
.pollb .fill{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg,rgba(62,232,255,.25),rgba(62,232,255,.05)); transition:height .5s; z-index:-1}
.pollb{z-index:0}
.pollb:hover{border-color:var(--edge2)}
.bridge{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:20px; padding:20px 24px; border-radius:20px; border:1px dashed rgba(255,181,71,.5); background:rgba(255,181,71,.06)}
.bridge .flow{display:flex; align-items:center; gap:12px; font-weight:800; font-size:22px}
.bridge .flow span{padding:8px 14px; border-radius:12px}
.bridge .flow .a{background:rgba(255,181,71,.16); color:var(--past)}
.bridge .flow .b{background:rgba(62,232,255,.14); color:var(--now)}

/* ─── feed (vocab A) ─── */
.feed{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:26px; align-items:start}
.post{border-radius:24px; background:#0E1338; border:1px solid var(--edge2); overflow:hidden; box-shadow:var(--shadow)}
.post .pt{display:flex; align-items:center; gap:12px; padding:16px 18px}
.post .pt b{font-size:17px} .post .pt span{display:block; font-size:13px; color:var(--muted)}
.post .body{padding:6px 22px 20px; font-size:clamp(23px,2.3vw,30px); font-weight:700; line-height:1.35}
.postimg img{display:block; width:100%; height:auto; border-radius:26px}
.postimg .ans{margin-top:14px; padding:14px 18px; border-radius:16px; background:rgba(67,229,160,.1); border:1px solid rgba(67,229,160,.4); font-size:22px; font-weight:700}
.postimg .ans b{color:var(--ok)}
.post .ans{margin:0 18px 18px; padding:14px 16px; border-radius:14px; background:rgba(67,229,160,.1); border:1px solid rgba(67,229,160,.4); font-size:20px; font-weight:700}
.post .ans b{color:var(--ok)}
.post .pf{display:flex; gap:18px; padding:12px 18px; border-top:1px solid var(--edge); color:var(--muted); font-size:15px}
.bank{display:flex; flex-wrap:wrap; gap:10px}
.xp{padding:12px 16px; border-radius:14px; background:var(--glass2); border:1.5px solid var(--edge2); font-weight:800; font-size:19px; transition:.15s}
.xp:hover{border-color:var(--now); background:rgba(62,232,255,.08)}
.xp.used{opacity:.3; text-decoration:line-through; pointer-events:none}
.xp.bad{border-color:var(--bad)}
.xp .vc{font-family:var(--mono); font-size:13px; color:var(--now); margin-left:6px}

/* ─── notes (vocab B) ─── */
.notes{border-radius:24px; background:linear-gradient(180deg,#FFF6E4,#FBEBC9); color:#2A2140; padding:26px 30px; box-shadow:var(--shadow); position:relative}
.notes::before{content:"Mia’s notes · 🔒 private"; display:block; font-family:var(--mono); font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#9A7B44; margin-bottom:10px}
.nl{display:flex; gap:14px; align-items:baseline; padding:12px 0; border-bottom:1px dashed rgba(42,33,64,.18); font-size:clamp(20px,2vw,26px); font-weight:700}
.nl:last-child{border-bottom:0}
.nl .n{font-family:var(--mono); font-size:14px; color:#9A7B44}
.gap{display:inline-block; min-width:170px; padding:0 10px; border-bottom:3px solid #B9A57F; text-align:center; color:#6D5AAE; cursor:pointer; border-radius:6px 6px 0 0}
.gap.cur{background:rgba(139,92,246,.12); border-bottom-color:var(--violet)}
.gap.done{color:#0E7A50; border-bottom-color:#2FB57E; background:rgba(47,181,126,.1)}

/* ─── listening ─── */
.listen{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:26px; align-items:start}
.player{text-align:center}
.pbtn{width:96px; height:96px; border-radius:50%; font-size:40px; display:grid; place-items:center; margin:8px auto 10px; color:#07102A;
  background:radial-gradient(circle at 35% 30%,#fff,var(--now) 55%,#2A7BFF); box-shadow:0 0 0 10px rgba(62,232,255,.12),0 0 60px rgba(62,232,255,.55); transition:transform .15s}
.pbtn:active{transform:scale(.95)}
.pbtn.on{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,232,255,.5),0 0 60px rgba(62,232,255,.55)}100%{box-shadow:0 0 0 26px rgba(62,232,255,0),0 0 60px rgba(62,232,255,.55)}}
.wave{display:flex; gap:5px; justify-content:center; align-items:center; height:40px}
.wave i{width:6px; border-radius:6px; background:linear-gradient(var(--now),var(--violet)); height:10px; transition:height .2s}
.wave.on i{animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:44px}}
.script{max-height:58vh; overflow:auto; padding-right:6px}
.line{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border-radius:14px; transition:.25s; opacity:.55}
.line.cur{opacity:1; background:rgba(62,232,255,.08); box-shadow:inset 3px 0 0 var(--now)}
.line.past{opacity:.9}
.line p{margin:0; font-size:19px}
.line .who{font-weight:800; font-size:13px; letter-spacing:.1em; text-transform:uppercase}
.blurred{filter:blur(7px); user-select:none; pointer-events:none}

/* ─── clue ─── */
.clue{max-width:980px; margin:0 auto; text-align:center}
.clue .found{font-family:var(--mono); letter-spacing:.2em; color:var(--ok); font-size:16px}
.evidence{display:grid; gap:18px; margin-top:26px; text-align:left}
.ev{display:flex; gap:16px; align-items:center; padding:22px 26px; border-radius:22px; background:var(--glass); border:1px solid var(--edge2)}
.ev .av{--s:62px}
.wait{margin-top:30px}
.wait .glitch{font-size:clamp(44px,6vw,80px)}

/* ─── timeline graphic ─── */
.tl{display:grid; grid-template-columns:1fr minmax(120px,1.1fr) 1fr; align-items:center; gap:10px; margin-top:22px}
.node{text-align:center; padding:14px 14px; border-radius:22px; background:var(--glass); border:2px solid var(--edge); opacity:.25; transform:scale(.96); transition:.5s}
.node.on{opacity:1; transform:none}
.node .ic{font-size:34px}
.phw{position:relative; display:inline-block}
.phw em{position:absolute; right:-10px; bottom:-6px; font-style:normal; font-size:26px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.node .t{font-family:var(--mono); font-weight:700; letter-spacing:.16em; font-size:16px; margin:4px 0 2px}
.node .d{font-size:20px; font-weight:700}
.node .role{display:inline-block; margin-bottom:6px; font-size:12px; letter-spacing:.12em; font-weight:800; text-transform:uppercase; padding:3px 9px; border-radius:99px; background:rgba(255,255,255,.08)}
.node.past{border-color:rgba(255,181,71,.55)} .node.past .t{color:var(--past)}
.node.now{border-color:rgba(62,232,255,.55)} .node.now .t{color:var(--now)}
.node.past.on{box-shadow:0 0 30px -6px rgba(255,181,71,.55)}
.node.now.on{box-shadow:0 0 30px -6px rgba(62,232,255,.55)}
.arr svg{width:100%; height:70px; overflow:visible}
.arr path{fill:none; stroke-width:5; stroke-linecap:round; stroke-dasharray:400; stroke-dashoffset:400; transition:stroke-dashoffset 1s ease .2s}
.arr.on path{stroke-dashoffset:0}
.arr .lbl{font-family:var(--mono); font-size:13px; fill:var(--muted); letter-spacing:.12em}

/* ─── discovery ─── */
.disc{display:grid; grid-template-columns:minmax(0,1fr); gap:20px}
.steps{display:grid; gap:9px}
.step{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:9px 16px; border-radius:18px; background:var(--glass); border:1px solid var(--edge); animation:bubIn .35s}
.step .q{font-size:clamp(19px,1.8vw,24px); font-weight:800; flex:1; min-width:220px}
.step .as{display:flex; gap:10px}
.step .a{font-size:22px; font-weight:800; color:var(--ok)}
.tabs{display:inline-flex; gap:6px; padding:6px; border-radius:16px; background:var(--glass); border:1px solid var(--edge); flex-wrap:wrap}
.tab{padding:10px 18px; border-radius:11px; font-weight:800; font-size:17px; color:var(--muted)}
.tab.on{background:rgba(255,255,255,.12); color:var(--text)}

/* ─── grammar explanation ─── */
.gx{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:24px; align-items:start}
.formula{display:flex; flex-wrap:wrap; align-items:center; gap:10px; font-family:var(--mono); font-weight:700; font-size:clamp(18px,1.8vw,23px)}
.formula span{padding:10px 14px; border-radius:12px}
.formula .p{background:rgba(255,181,71,.15); color:var(--past); border:1px solid rgba(255,181,71,.45)}
.formula .n{background:rgba(62,232,255,.12); color:var(--now); border:1px solid rgba(62,232,255,.45)}
.formula .plus{padding:0; color:var(--muted)}
.real{display:grid; gap:8px; margin-top:16px; padding:16px 18px; border-radius:16px; background:rgba(255,255,255,.04); border-left:4px solid var(--violet); font-size:20px}
.exl{display:grid; gap:10px}
.exi{padding:14px 18px; border-radius:16px; background:var(--glass); border:1px solid var(--edge); font-size:clamp(19px,1.8vw,23px); font-weight:700}
.big-idea{display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:center; margin-top:26px}
.pill2{padding:22px; border-radius:22px; text-align:center; font-weight:800; font-size:clamp(20px,2vw,27px)}
.pill2 small{display:block; font-family:var(--mono); font-size:13px; letter-spacing:.14em; margin-bottom:6px; color:var(--muted)}
.pill2.a{background:linear-gradient(135deg,rgba(255,181,71,.18),rgba(62,232,255,.14)); border:1px solid var(--edge2)}
.pill2.b{background:linear-gradient(135deg,rgba(62,232,255,.14),rgba(255,181,71,.18)); border:1px solid var(--edge2)}

/* ─── super simple rule ─── */
.rule{max-width:1060px; margin:0 auto; border-radius:34px; padding:30px 40px; position:relative; overflow:hidden;
  background:linear-gradient(145deg,#141A4E,#0A0E2E); border:1px solid var(--edge2); box-shadow:0 40px 100px -40px rgba(62,232,255,.45)}
.rule::before{content:""; position:absolute; inset:-2px; border-radius:36px; padding:2px; pointer-events:none;
  background:linear-gradient(120deg,var(--past),transparent 40%,transparent 60%,var(--now)); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude}
.rule h2{font-size:clamp(42px,5vw,76px); text-align:center}
.rule .help{text-align:center; font-size:22px; margin-top:6px}
.rrow{display:grid; grid-template-columns:260px 1fr; gap:26px; align-items:center; margin-top:20px; padding:18px 26px; border-radius:24px; background:rgba(255,255,255,.04); border:1px solid var(--edge)}
.dir{display:flex; align-items:center; gap:10px; font-family:"Anton",Impact,sans-serif; font-size:40px; text-transform:uppercase; letter-spacing:.02em}
.dir .p{color:var(--past)} .dir .n{color:var(--now)} .dir i{font-style:normal; color:var(--muted); font-size:34px}
.dir small{display:block; font-family:var(--mono); font-size:12.5px; color:var(--muted); letter-spacing:.12em}
.rrow .sent{font-size:clamp(24px,2.6vw,38px)}
.rrow .formula{margin-top:10px; font-size:17px}

/* ─── speaking ─── */
.sgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.scard{position:relative; text-align:left; padding:22px 24px; border-radius:22px; background:var(--glass); border:2px solid var(--edge); transition:.2s; display:flex; flex-direction:column; gap:8px}
.scard:hover{border-color:var(--edge2)}
.scard.pick{border-color:var(--now); box-shadow:0 0 0 4px rgba(62,232,255,.15),0 0 40px -10px rgba(62,232,255,.6)}
.scard.used::after{content:"✓ answered"; position:absolute; top:16px; right:18px; font-size:13px; font-weight:800; color:var(--ok)}
.scard .n{font-family:var(--mono); font-size:15px; color:var(--muted)}
.scard .q{font-size:clamp(20px,1.9vw,25px); font-weight:800; line-height:1.3}
.focus{max-width:1000px; margin:0 auto}
.focus .q{font-size:clamp(30px,3.6vw,50px); font-weight:800; line-height:1.2}
.focus .help{font-size:clamp(18px,1.7vw,23px); margin-top:14px}
.sample{margin-top:22px; padding:18px 22px; border-radius:18px; background:rgba(139,92,246,.12); border:1px solid rgba(139,92,246,.45); font-size:clamp(20px,2vw,27px); font-weight:700}
.sample small{display:block; font-family:var(--mono); color:var(--lilac); font-size:13px; letter-spacing:.14em; margin-bottom:4px}

/* ─── breakout ─── */
.msteps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
.ms{padding:22px 20px; border-radius:22px; background:var(--glass); border:1px solid var(--edge); display:flex; flex-direction:column; gap:10px}
.ms .no{width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:20px; background:rgba(255,255,255,.08)}
.ms.p .no{background:rgba(255,181,71,.2); color:var(--past)}
.ms.n .no{background:rgba(62,232,255,.18); color:var(--now)}
.ms b{font-size:21px; line-height:1.25}
.ms .help{font-size:15.5px}
.ms .formula{font-size:14px} .ms .formula span{padding:5px 8px}
.teams{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px}
.team{text-align:left; padding:20px; border-radius:24px; background:var(--glass); border:2px solid var(--edge); display:flex; flex-direction:column; gap:12px; transition:.2s}
.team .th{display:flex; align-items:center; gap:12px}
.team .th .av{--s:58px}
.team .th b{display:block; font-family:"Anton",Impact,sans-serif; font-weight:400; font-size:26px; letter-spacing:.03em; text-transform:uppercase}
.team .th span{font-family:var(--mono); font-size:13px; color:var(--muted); letter-spacing:.12em}
.team .fact{display:flex; gap:10px; font-size:17.5px; line-height:1.35}
.team .fact i{flex:none; font-style:normal; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.1em; padding:3px 8px; border-radius:8px; height:fit-content; margin-top:2px}
.team .fact i.p{background:rgba(255,181,71,.18); color:var(--past)}
.team .fact i.n{background:rgba(62,232,255,.15); color:var(--now)}
.team .hint{font-size:16px; color:var(--lilac); padding:10px 12px; border-radius:12px; background:rgba(139,92,246,.1)}
.team.extra{border-style:dashed}
.team.shown{border-color:var(--now)}
.team.presented{border-color:var(--ok)}
.team .work{display:grid; gap:6px; font-size:15.5px; padding:10px 12px; border-radius:12px; background:rgba(62,232,255,.06); border:1px solid rgba(62,232,255,.25)}
.timer{display:flex; align-items:center; gap:18px}
.ring{position:relative; width:128px; height:128px; flex:none}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring circle{fill:none; stroke-width:10}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#tgrad); stroke-linecap:round; transition:stroke-dashoffset .9s linear}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:30px}
.ring.end b{color:var(--bad)}
#tchip{display:none; font-family:var(--mono)}
#tchip.on{display:inline-flex}

/* spotlight */
.spot{display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:24px; align-items:start}
.qs5{display:flex; flex-wrap:wrap; gap:10px}
.qs5 span{padding:9px 14px; border-radius:12px; background:var(--glass); border:1px solid var(--edge); font-weight:700; font-size:17px}
.bar60{height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:12px}
.bar60 i{display:block; height:100%; background:linear-gradient(90deg,var(--ok),var(--now)); width:0; transition:width 1s linear}

/* ─── final ─── */
.finale{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:30px; align-items:center}
.princ{display:grid; gap:14px}
.pr{padding:22px 24px; border-radius:22px; font-size:clamp(22px,2.3vw,30px); font-weight:800; display:flex; align-items:center; gap:16px; animation:bubIn .5s both}
.pr.a{background:linear-gradient(90deg,rgba(255,181,71,.16),rgba(62,232,255,.08)); border:1px solid rgba(255,181,71,.4)}
.pr.b{background:linear-gradient(90deg,rgba(62,232,255,.14),rgba(255,181,71,.08)); border:1px solid rgba(62,232,255,.4); animation-delay:.25s}
.pr .ic{font-size:34px}
.bigpct{font-family:var(--mono); font-weight:700; font-size:clamp(20px,2vw,26px); letter-spacing:.14em; color:var(--now)}
.compose{display:flex; align-items:center; flex-wrap:wrap; gap:10px; font-size:clamp(22px,2.4vw,32px); font-weight:800; line-height:1.5}
.compose input{flex:1; min-width:240px; padding:10px 16px; border-radius:14px; background:rgba(255,255,255,.08); border:2px solid var(--edge2); font-weight:700; color:var(--now)}
.compose input:focus{outline:none; border-color:var(--now)}
.sent-list{display:grid; gap:10px; margin-top:18px}
.okline{display:flex; gap:12px; align-items:center; padding:14px 18px; border-radius:16px; background:rgba(67,229,160,.07); border:1px solid rgba(67,229,160,.3); font-size:clamp(19px,1.9vw,24px); font-weight:700; animation:bubIn .35s}
.okline .from{font-size:13px; color:var(--muted); font-weight:700; margin-left:auto; white-space:nowrap}
.okline button{color:var(--muted); font-size:18px}

/* summary */
.done-hero{text-align:center}
.skills{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; margin-top:28px}
.sk{padding:22px 10px; border-radius:22px; background:var(--glass); border:1px solid var(--edge); text-align:center; animation:pop .5s both}
.sk .e{font-size:44px; display:block}
.sk b{display:block; margin-top:8px; font-size:18px}
.today{max-width:760px; margin:28px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:10px 26px; text-align:left}
.today div{display:flex; gap:10px; font-size:19px; font-weight:600}
.today div::before{content:"✓"; color:var(--ok); font-weight:800}

/* milestone banner */
#banner{position:fixed; inset:0; z-index:60; display:grid; place-items:center; background:rgba(4,6,20,.72); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .35s}
#banner.on{opacity:1; pointer-events:auto}
#banner .bx{text-align:center; transform:scale(.9); transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
#banner.on .bx{transform:none}
#banner .t{font-family:var(--mono); letter-spacing:.24em; color:var(--muted); font-size:18px}
#banner .v{font-family:"Anton",Impact,sans-serif; font-size:clamp(90px,15vw,200px); line-height:1; background:linear-gradient(90deg,var(--past),var(--now)); -webkit-background-clip:text; background-clip:text; color:transparent}
#banner .s{font-size:20px; color:var(--text); margin-top:8px}
#banner .mbar{width:min(560px,80vw); margin:22px auto 0; height:16px}

/* ─── teacher panel ─── */
#teacher{position:fixed; top:0; right:0; bottom:0; width:min(430px,94vw); z-index:40; background:#0B0F2E; border-left:1px solid var(--edge2);
  transform:translateX(105%); transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; box-shadow:-30px 0 80px -30px #000}
#teacher.on{transform:none}
#teacher .thd{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--edge)}
#teacher .thd b{font-family:var(--mono); letter-spacing:.16em; font-size:14px}
#tBody{overflow:auto; padding:18px; display:grid; gap:14px; font-size:16px}
.tsec{padding:14px 16px; border-radius:16px; background:var(--glass); border:1px solid var(--edge)}
.tsec h4{font-family:var(--mono); font-size:12.5px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; font-weight:700}
.tsec ul{margin:0; padding-left:18px} .tsec li{margin:4px 0}
.tsec .say{color:var(--now); font-weight:700}
.tacts{display:grid; grid-template-columns:1fr 1fr; gap:8px}

.route{display:grid; gap:6px; font-size:15px}

.route div.cur{color:var(--now); font-weight:800}
.route div.op{color:var(--amber)}
.route div.rsk{opacity:.4; text-decoration:line-through}

/* modal */
#modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(3,5,18,.72); backdrop-filter:blur(8px); padding:20px}
#modal .box{width:min(860px,100%); max-height:88vh; overflow:auto; background:linear-gradient(160deg,#151B4D,#0B0F2E); border:1px solid var(--edge2); border-radius:28px; padding:28px; box-shadow:var(--shadow)}
.map{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-top:16px}
.mapi{text-align:left; padding:13px 15px; border-radius:15px; background:var(--glass); border:1.5px solid var(--edge); display:flex; flex-direction:column; gap:3px}
.mapi:hover{border-color:var(--edge2)}
.mapi .k{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.08em}
.mapi b{font-size:17px}
.mapi.cur{border-color:var(--now)}
.mapi.op .k{color:var(--amber)}
.mapi.seen b::after{content:" ✓"; color:var(--ok)}

/* live dock */
#dock{position:fixed; right:18px; bottom:84px; z-index:30; width:350px; max-height:50vh; display:none; flex-direction:column; border-radius:20px; overflow:hidden;
  background:rgba(11,15,46,.95); border:1px solid var(--edge2); box-shadow:var(--shadow)}
#dock.on{display:flex}
#dock .dh{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--edge); font-size:15px}
#dock .db{overflow:auto; padding:10px 12px; display:grid; gap:8px; font-size:15px}
#dock.min .db{display:none}
.led{width:10px; height:10px; border-radius:50%; background:var(--faint)}
.led.on{background:var(--ok); box-shadow:0 0 10px var(--ok)}
.led.warn{background:var(--amber)}
.wallit{display:flex; gap:8px; align-items:flex-start; padding:9px 10px; border-radius:12px; background:var(--glass)}
.wallit p{margin:0; flex:1} .wallit small{display:block; color:var(--muted)}
#reacts{position:fixed; right:30px; bottom:120px; z-index:29; pointer-events:none; width:120px; height:60vh}
#reacts span{position:absolute; bottom:0; font-size:40px; animation:rise 3s ease-out forwards}
@keyframes rise{from{transform:translateY(0) scale(.6); opacity:0}15%{opacity:1; transform:translateY(-40px) scale(1.1)}to{transform:translateY(-55vh) scale(1); opacity:0}}

#toast{position:fixed; left:50%; top:84px; transform:translate(-50%,-20px); z-index:70; padding:12px 20px; border-radius:14px; background:#1C2360; border:1px solid var(--edge2); font-weight:700;
  opacity:0; pointer-events:none; transition:.3s; box-shadow:var(--shadow)}
#toast.on{opacity:1; transform:translate(-50%,0)}
#confetti{position:fixed; inset:0; z-index:55; pointer-events:none}

/* ─── student phone app ─── */
#student{display:none; position:fixed; inset:0; z-index:80; background:var(--ink); flex-direction:column}

body.student #app{display:none}

<script>
/* ============================================================
   LESSON 15 · MIXED CONDITIONALS · "If Only I Had Known…"
   Vanilla JS, one file, no build. Sections:
   1 utils & state · 2 sound & voices · 3 characters
   4 lesson content (edit texts here) · 5 components
   6 scenes · 7 navigation · 8 teacher mode · 9 live room
   10 student app · 11 boot
   ============================================================ */
const CFG = window.LESSON_CONFIG || {};
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r=>setTimeout(r,ms));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
/* {p|past part} {n|now part} **bold** → coloured spans */
function fmt(s){ return esc(s).replace(/\{(p|n)\|([^}]*)\}/g,'<span class="$1">$2</span>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
const plain = s => String(s).replace(/\{(?:p|n)\|([^}]*)\}/g,'$1').replace(/\*\*/g,'');

/* ---------- 1 · state (autosaved to localStorage) ---------- */
const KEY = 'lesson15-mixed-v1';
const FRESH = ()=>({
  i:0, seen:{}, short:false, sound:true, pct:0, shownPct:0,
  sd:{},                        // per-scene sub-state
  teams:3,                      // 3 by default, up to 5
  work:{},                      // team letter -> {s1,s2,advice,title,by}
  finals:[],                    // accepted final-challenge answers {id,text,by}
  room:String(1000+Math.floor(Math.random()*9000))
});
let S = FRESH();
try{ const raw=localStorage.getItem(KEY); if(raw) S = Object.assign(FRESH(), JSON.parse(raw)); }catch(e){}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} },120); }
const sd = id => (S.sd[id] = S.sd[id] || {});

/* ---------- 2 · sound effects (WebAudio, no files) ---------- */
const SFX = {
  ctx:null,
  c(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C(); } return this.ctx; },
  tone(f,t=.12,type='sine',vol=.08,delay=0){
    if(!S.sound) return; const c=this.c(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.01); g.gain.exponentialRampToValueAtTime(.0001,t0+t);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+t+.02);
  },
  pop(){ this.tone(880,.09,'sine',.06); this.tone(1320,.08,'sine',.04,.05); },
  msg(){ this.tone(1175,.1,'sine',.07); this.tone(1568,.14,'sine',.06,.08); },
  ok(){ this.tone(660,.12,'triangle',.08); this.tone(990,.18,'triangle',.07,.09); },
  bad(){ this.tone(220,.16,'sawtooth',.035); this.tone(180,.2,'sawtooth',.03,.08); },
  glitch(){ [320,90,460,70,380].forEach((f,i)=>this.tone(f,.07,'square',.035,i*.06)); },
  rise(){ [392,523,659,784].forEach((f,i)=>this.tone(f,.25,'triangle',.07,i*.11)); },
  chime(){ [880,660,880,660,1047].forEach((f,i)=>this.tone(f,.35,'sine',.12,i*.28)); },
  win(){ [523,659,784,1047,1319,1568].forEach((f,i)=>this.tone(f,.3,'triangle',.08,i*.1)); }
};

/* ---------- 2b · browser voices (TTS): Mia = female voice, Leo = male voice ---------- */
const Voice = {
  list:[], f:null, m:null,
  load(){
    if(!('speechSynthesis' in window)) return;
    this.list = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    const find = rx => rx.map(r=>this.list.find(v=>r.test(v.name))).find(Boolean);
    this.f = find([/Ava.*(Natural|Online)/i,/Jenny/i,/Aria/i,/Emma.*(Natural|Online)/i,/Michelle/i,/Google US English/i,/Samantha/i,/Karen/i,/Moira/i,/Tessa/i,/Zira/i,/Female/i]) || this.list[0] || null;
    this.m = find([/Andrew.*(Natural|Online)/i,/Brian.*(Natural|Online)/i,/Guy/i,/Christopher/i,/Eric/i,/Ryan/i,/Google UK English Male/i,/Daniel/i,/Alex\b/i,/Aaron/i,/David/i,/Male/i])
           || this.list.find(v=>v!==this.f) || this.f;
  },
  say(text, who, o={}){
    if(!('speechSynthesis' in window)) return null;
    const u = new SpeechSynthesisUtterance(text);
    const v = who==='leo' ? this.m : this.f;
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-US';
    const same = this.f===this.m;
    u.rate = o.rate||.95;
    u.pitch = who==='leo' ? (same?.8:1) : (same?1.25:1.08);
    if(o.onend) u.onend=o.onend; if(o.onerror) u.onerror=o.onerror;
    speechSynthesis.speak(u); return u;
  }
};
if('speechSynthesis' in window){ Voice.load(); speechSynthesis.onvoiceschanged=()=>Voice.load(); }

/* ---------- 3 · characters (фото — у папці img/, без фото показується літера) ---------- */
const CHARS = {
  mia:{name:'Mia', photo:'img/mia.webp', c:'var(--mia)', tag:'The girl with the old post', role:'She wishes she had never posted one video.'},
  leo:{name:'Leo', photo:'img/leo.webp', c:'var(--leo)', tag:'Her best friend', role:'He helps Mia understand her past.'}
};
function av(k, size=56, cls=''){
  const C=CHARS[k];
  if(C) return `<i class="av ${k} ${cls}" style="--s:${size}px" role="img" aria-label="${C.name}">${C.name[0]}<img src="${C.photo}" alt="" onerror="this.remove()"></i>`;
  return `<i class="av e ${cls}" style="--s:${size}px;background:${k.bg}" aria-hidden="true">${k.e}</i>`;
}

/* photo of Mia / Leo when a sentence is about them */
function whoIn(s){ const t=plain(s); return /\bMia\b/.test(t)?'mia':/\bLeo\b/.test(t)?'leo':null; }
function withFace(html, s, size=46){ const w=whoIn(s); return w?`<div class="face">${av(w,size,'round')}<div>${html}</div></div>`:html; }

/* ---------- 4 · lesson content ---------- */
const LESSON = {
  hook:[
    {w:'mia', t:'Leo… I found one of my old posts today.'},
    {w:'post'},
    {w:'mia', t:'I really wish I had never posted it.'},
    {w:'leo', t:'What happened?'},
    {w:'mia', t:'It’s a long story…'},
    {w:'mia', t:'But if I hadn’t posted it, my life would be a little different now.'}
  ],
  warm:{
    q1:{en:'If you could change ONE small thing about yesterday, what would you change?',
        help:'Think small: sleep, food, your phone, homework… Start with “I’d…”',
        ex:['I’d go to bed earlier.','I’d study more.','I’d spend less time on my phone.','I’d eat something different.']},
    q2:{en:'Can one small decision change your future?', help:'Vote YES, MAYBE or NO — then tell us why.',
        opts:[['👍','YES'],['🤔','MAYBE'],['👎','NO']]}
  },
  feed:[
    {img:'img/feed/post-1.webp', u:'gamer.nick', e:'🎮', bg:'linear-gradient(135deg,#3A3FB8,#1A1F55)', t:'Everyone says this new game is incredible. I want to see it myself.', a:'check out', model:'I want to **check it out**.'},
    {img:'img/feed/post-2.webp', u:'film.fan.ola', e:'🍿', bg:'linear-gradient(135deg,#B8563A,#4A1F1A)', t:'This movie was supposed to be amazing, but it was just OK.', a:'live up to the hype', model:'It didn’t **live up to the hype**.'},
    {img:'img/feed/post-3.webp', u:'leo.makes.videos', e:'leo', t:'Stop telling me what to do. Give me some space!', a:'back off', model:'**Back off!**'},
    {img:'img/feed/post-4.webp', u:'noah.k', e:'🧢', bg:'linear-gradient(135deg,#1F9CB8,#12324F)', t:'Don’t worry so much. It’s really not that serious.', a:'blow it out of proportion', model:'Don’t **blow it out of proportion**.'},
    {img:'img/feed/post-5.webp', u:'art.by.sam', e:'🎨', bg:'linear-gradient(135deg,#8E3CC8,#2A1455)', t:'She really admires her older sister.', a:'look up to', model:'She **looks up to** her older sister.'}
  ],
  words:['take it down','blow it out of proportion','be into','check out','live up to the hype','get over it','go for it','be all about','look up to','back off'],
  notes:[
    {pre:'I used to', a:'be into', post:'photography.'},
    {pre:'My friend told me to', a:'go for it', post:'and post the video.'},
    {pre:'Later I wanted to', a:'take it down', post:'.'},
    {pre:'It took me weeks to', a:'get over it', post:'.'},
    {pre:'Back then, my whole account seemed to', a:'be all about', post:'likes and followers.'}
  ],
  audio:[
    ['leo','So, what was the post about?'],
    ['mia','It was a video of me trying a new dance challenge. Everyone was into it at the time.'],
    ['leo','I think I remember that trend.'],
    ['mia','Yeah. My friends told me to go for it, so I posted my video. At first, people seemed to love it.'],
    ['leo','But something happened later?'],
    ['mia','Someone shared it on another account and made fun of me. I completely blew it out of proportion. I thought everyone at school was laughing at me.'],
    ['leo','Did you take it down?'],
    ['mia','Eventually, yes. But I spent weeks worrying about it.'],
    ['leo','You know, if you hadn’t posted that video, you probably wouldn’t be so careful online now.'],
    ['mia','True. And if I were more confident, I wouldn’t have worried about those comments so much.'],
    ['leo','Maybe something good came from it after all.']
  ],
  listenQ:[
    {q:'Why did Mia post the video?', o:['Leo asked her.','Her friends encouraged her.','She wanted to become famous.'], a:1, ex:'“My friends told me to go for it.”'},
    {q:'What happened to her video?', o:['Someone shared it and laughed at it.','Nobody watched it.','It became extremely popular.'], a:0, ex:'“Someone shared it on another account and made fun of me.”'},
    {q:'How did the experience change Mia?', o:['She’s more careful online now.','She doesn’t use social media anymore.','She makes more videos now.'], a:0, ex:'“…you wouldn’t be so careful online now.”'}
  ],
  clue:[
    {w:'leo', s:'If you {p|hadn’t posted that video}, you {n|wouldn’t be so careful online now}.'},
    {w:'mia', s:'If I {n|were more confident}, I {p|wouldn’t have worried about the comments}.'}
  ],
  discA:{ s:'If Mia {p|hadn’t posted the video}, she {n|wouldn’t be so careful now}.',
    steps:[ {q:'Did Mia post the video?', o:['Yes','No'], a:0, say:'Yes. She did.'},
            {q:'Is she careful now?', o:['Yes','No'], a:0, say:'Yes. She is.'},
            {q:'Where is the cause?', o:['Past','Now'], a:0, say:'In the past.', lit:'p'},
            {q:'Where is the result?', o:['Past','Now'], a:1, say:'Now — in the present.', lit:'n'} ],
    tl:{who:'mia', dir:'pn', past:['📹','posted the video'], now:['🛡️','careful online now']} },
  discB:{ s:'If Mia {n|were more confident}, she {p|wouldn’t have worried about the comments}.',
    steps:[ {q:'Is Mia very confident?', o:['Yes','Not really'], a:1, say:'Not really.', lit:'n'},
            {q:'When did she worry?', o:['In the past','Now'], a:0, say:'In the past.', lit:'p'} ],
    tl:{who:'mia', dir:'np', now:['🙈','not very confident'], past:['😟','worried about the comments']} },
  types:[
    { key:'pn', title:'Past → Now', tag:'PAST CAUSE → PRESENT RESULT',
      meaning:'Something happened differently in the past, so the situation is different now.',
      formula:[['p','If + had + V3'],['n','would + verb']],
      ex:'If Mia {p|hadn’t posted the video}, she {n|wouldn’t be so careful now}.',
      real:['She posted the video in the past.','Because of that experience, she is careful now.'],
      more:['If I {p|had gone to bed earlier}, I {n|wouldn’t be tired now}.',
            'If we {p|hadn’t moved house}, I {n|would still live near my old friends}.',
            'If Leo {p|had studied coding earlier}, he {n|would know more about it now}.'] },
    { key:'np', title:'Now → Past', tag:'PRESENT SITUATION → PAST RESULT',
      meaning:'Something about you or your life now (or in general) explains what happened in the past.',
      formula:[['n','If + Past Simple'],['p','would have + V3']],

<script>
/* ---------- 5 · components ---------- */
let CUR = {};               // current scene's teacher hooks: reveal(), example()
let FLASH = null;           // one-shot effect for the next render {k, v}
const flash = (k,v)=>{ FLASH={k,v}; };
const isFlash = (k,v)=> FLASH && FLASH.k===k && (v===undefined || FLASH.v===v);
const LV = {};              // live answers: taskId -> {studentId: value}
const NAMES = {};
function counts(task, n){ const a=Array(n).fill(0); Object.values(LV[task]||{}).forEach(v=>{ if(a[v]!==undefined) a[v]++; }); return a; }
const LET = 'ABCDEFGHIJ';

function formula(f){ return `<div class="formula">${f.map((x,i)=>(i?'<span class="plus">,</span>':'')+`<span class="${x[0]}">${esc(x[1])}</span>`).join('')}</div>`; }
function dirBadge(d){ return d==='pn' ? `<span class="badge p">⏪ Past → <span style="color:var(--now)">Now</span></span>` : `<span class="badge n">Now → <span style="color:var(--past)">Past</span> ⏪</span>`; }

function tlHTML(tl, on={past:1,now:1,arrow:1}, anim=false){

  const path = pn ? 'M14 42 C 70 4, 130 4, 184 42' : 'M186 42 C 130 4, 70 4, 16 42';
  return `<div class="tl${anim?' pop':''}">
    <div class="node past ${on.past?'on':''}"><span class="role">${pn?'cause':'result'}</span><div class="ic">${ic(tl.past[0])}</div><div class="t">PAST</div><div class="d">${esc(tl.past[1])}</div></div>
    <div class="arr ${on.arrow?'on':''}"><svg viewBox="0 0 200 70" aria-hidden="true"><path d="${path}" stroke="url(#tgrad)" marker-end="url(#${pn?'ahN':'ahP'})" ${on.arrow&&!anim?'style="stroke-dashoffset:0;transition:none"':''}/><text class="lbl" x="100" y="66" text-anchor="middle">${pn?'PAST → NOW':'NOW → PAST'}</text></svg></div>
    <div class="node now ${on.now?'on':''}"><span class="role">${pn?'result':'cause'}</span><div class="ic">${ic(tl.now[0])}</div><div class="t">${pn?'NOW':'NOW / GENERAL'}</div><div class="d">${esc(tl.now[1])}</div></div>
  </div>`;
}
/* arrows drawn with a transition need one frame in the "off" state first */
function kickArrows(root){ $$('.arr.on path',root).forEach(p=>{ if(p.getAttribute('style')) return; p.style.transition='none'; p.style.strokeDashoffset=400; requestAnimationFrame(()=>requestAnimationFrame(()=>{ p.style.transition=''; p.style.strokeDashoffset=0; })); }); }

function bubbles(list, n, me='leo'){
  return list.slice(0,n).map(m=>{
    if(m.w==='post') return `<div class="oldpost"><img src="img/old-post.webp" alt="Mia’s old post: #DanceChallenge — my first try lol" width="686" height="784"></div>`;

}
function phone(inner, foot='', who='mia'){

/* reusable multiple-choice quiz: one question at a time */
function quiz(key, qs, o={}){
  const st=sd(key); st.qi=st.qi||0; st.ok=st.ok||{}; st.wrong=st.wrong||{};
  const qi=Math.min(st.qi, qs.length-1), Q=qs[qi], solved=!!st.ok[qi], wrong=st.wrong[qi]||[];
  const task=key+'-'+qi, live=LIVE.on, c=counts(task,Q.o.length), tot=c.reduce((a,b)=>a+b,0);
  const all = qs.every((_,i)=>st.ok[i]);
  return `<div class="card" data-quiz="${key}">
    <div class="qhead"><span class="kick ${o.kc||''}">Question ${qi+1} / ${qs.length}</span>
      <div class="dots">${qs.map((_,i)=>`<i class="${st.ok[i]?'ok':''} ${i===qi?'cur':''}"></i>`).join('')}</div></div>
    <div class="qtext">${withFace(fmt(Q.q),Q.q,52)}</div>
    <div class="opts">${Q.o.map((t,i)=>{
      const cls = solved ? (i===Q.a?'right':'locked') : wrong.includes(i)?'wrong locked':'';
      const sh = isFlash(key,i)?' shake':'';
      return `<button class="opt ${cls}${sh}${solved&&i===Q.a&&isFlash(key+'ok')?' pop':''}" data-qo="${i}"><span class="L">${LET[i]}</span><span>${fmt(t)}</span>${live&&tot?`<span class="vc">${c[i]} 👤</span><span class="vbar" style="width:${Math.round(c[i]/tot*100)}%"></span>`:''}</button>`;}).join('')}</div>
    ${solved&&Q.ex?`<div class="expl">✓ ${fmt(Q.ex)}</div>`:''}
    <div class="row mt">
      ${!solved?`<button class="btn sm ghost" data-qrev>👁 Reveal answer</button>`:''}
      ${wrong.length&&!solved?`<button class="btn sm ghost" data-qtry>↺ Try again</button>`:''}
      <span class="grow"></span>
      ${qi>0?`<button class="btn sm ghost" data-qprev>←</button>`:''}
      ${solved&&qi<qs.length-1?`<button class="btn sm primary" data-qnext>Next question →</button>`:''}
      ${all&&o.doneBtn?o.doneBtn:''}
    </div></div>`;
}
function bindQuiz(el, key, qs, onAll){
  const box=$(`[data-quiz="${key}"]`,el); if(!box) return;
  const st=sd(key), qi=st.qi||0, Q=qs[qi];
  const solve=()=>{ st.ok[qi]=true; SFX.ok(); flash(key+'ok'); save(); if(qs.every((_,i)=>st.ok[i]) && onAll) onAll(); draw(); };
  $$('[data-qo]',box).forEach(b=>b.onclick=()=>{ const i=+b.dataset.qo; if(st.ok[qi]) return;
    if(i===Q.a) solve(); else { (st.wrong[qi]=st.wrong[qi]||[]).push(i); SFX.bad(); flash(key,i); save(); draw(); } });
  const rv=$('[data-qrev]',box); if(rv) rv.onclick=solve;
  const tr=$('[data-qtry]',box); if(tr) tr.onclick=()=>{ st.wrong[qi]=[]; save(); draw(); };
  const nx=$('[data-qnext]',box); if(nx) nx.onclick=()=>{ st.qi=qi+1; save(); draw(); };
  const pv=$('[data-qprev]',box); if(pv) pv.onclick=()=>{ st.qi=qi-1; save(); draw(); };
  return solve;
}
const quizTask = (key, qs)=>{ const st=sd(key), qi=st.qi||0, Q=qs[qi]; return {id:key+'-'+qi, kind:'choice', q:plain(Q.q), opts:Q.o.map(plain), lock:!!(st.ok||{})[qi]}; };

/* ---------- audio player: recorded file or two browser voices ---------- */
const PLAYER = {
  playing:false, idx:0, token:0, audio:null, rate:.95,
  toggle(){ this.playing ? this.pause() : this.play(); },
  play(){
    SFX.c();
    if(CFG.AUDIO_FILE){
      if(!this.audio){ this.audio=new Audio(CFG.AUDIO_FILE); this.audio.onended=()=>{ this.playing=false; this.idx=LESSON.audio.length; this.paint(); }; this.audio.onerror=()=>{ toast('Audio file not found — using browser voices'); CFG.AUDIO_FILE=''; this.audio=null; this.play(); }; }
      this.audio.playbackRate=this.rate/.95; this.audio.play(); this.playing=true; this.paint(); return;
    }
    if(!('speechSynthesis' in window)){ toast('No speech voice in this browser — read the script aloud'); sd('listen').script=true; draw(); return; }
    if(this.idx>=LESSON.audio.length) this.idx=0;
    speechSynthesis.cancel(); this.playing=true; const tk=++this.token; this.paint();
    const step=()=>{
      if(tk!==this.token) return;
      if(this.idx>=LESSON.audio.length){ this.playing=false; this.paint(); return; }
      const [w,t]=LESSON.audio[this.idx]; this.paint();
      const next=()=>{ if(tk!==this.token) return; this.idx++; setTimeout(step,380); };
      Voice.say(t,w,{rate:this.rate, onend:next, onerror:next});
    };
    step();
  },
  pause(){ this.playing=false; this.token++; if(this.audio) this.audio.pause(); else if('speechSynthesis' in window) speechSynthesis.cancel(); this.paint(); },
  restart(){ this.pause(); this.idx=0; if(this.audio) this.audio.currentTime=0; this.play(); },
  paint(){
    const b=$('#pbtn'); if(!b) return;
    b.classList.toggle('on',this.playing); b.innerHTML=this.playing?'❚❚':'▶'; b.setAttribute('aria-label',this.playing?'Pause':'Play audio');
    $('#wave')?.classList.toggle('on',this.playing);
    const n=LESSON.audio.length, i=Math.min(this.idx,n);
    const stt=$('#pstat'); if(stt) stt.textContent = CFG.AUDIO_FILE ? (this.playing?'Playing…':'Ready') : (i>=n?'Finished ✓':`Line ${i+1} / ${n}`);
    const sp = this.playing && !CFG.AUDIO_FILE && LESSON.audio[this.idx] ? LESSON.audio[this.idx][0] : null;
    ['mia','leo'].forEach(w=>$('#dz-'+w)?.classList.toggle('talk', sp===w));
    $$('.line').forEach((l,k)=>{ l.classList.toggle('cur', this.playing && k===this.idx && !CFG.AUDIO_FILE); l.classList.toggle('past', k<this.idx); });
    const cl=$('.line.cur'); if(cl) cl.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
};

/* ---------- breakout timer (keeps running between scenes) ---------- */
const TIMER = {
  total:300, left:300, run:false, end:0, fired:false,
  start(){ if(this.left<=0) this.left=this.total; this.end=Date.now()+this.left*1000; this.run=true; this.fired=false; SFX.pop(); this.paint(); pubState(); },
  pause(){ this.tick(); this.run=false; this.paint(); pubState(); },
  add(s){ this.left=Math.max(0,this.left+s); this.total=Math.max(this.total,this.left); if(this.run) this.end=Date.now()+this.left*1000; this.fired=false; this.paint(); pubState(); },
  reset(){ this.run=false; this.total=300; this.left=300; this.fired=false; this.paint(); pubState(); },
  tick(){ if(!this.run) return; this.left=Math.max(0,(this.end-Date.now())/1000);
    if(this.left<=0 && !this.fired){ this.fired=true; this.run=false; SFX.chime(); toast('⏰ Time’s up — bring the teams back!'); pubState(); } },
  txt(){ const s=Math.ceil(this.left); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },
  paint(){
    const chip=$('#tchip'); chip.classList.toggle('on', this.run || (this.left<this.total && this.left>0)); $('#tchipT').textContent=this.txt();
    const r=$('#ring'); if(!r) return;
    const C=2*Math.PI*54; $('.fg',r).style.strokeDashoffset = C*(1-this.left/this.total);
    $('b',r).textContent=this.txt(); r.classList.toggle('end', this.left<=0);
    const b=$('#tStart'); if(b) b.innerHTML=this.run?'❚❚ Pause':(this.left<this.total&&this.left>0?'▶ Resume':'▶ Start 5:00');
  }
};

/* ── 3a · MIA'S FEED (match) ── */
{ id:'feedA', m:3, name:'Mia’s Feed · match', time:2, pct:25,
  live:()=>{ const st=sd('feedA'), P=LESSON.feed[st.pi||0]; return {id:'feedA-'+(st.pi||0), kind:'choice', q:P.t, opts:LESSON.words, lock:!!(st.ok||{})[st.pi||0]}; },
  render(el){
    const st=sd('feedA'); st.pi=st.pi||0; st.ok=st.ok||{}; st.bad=st.bad||{};
    const F=LESSON.feed, P=F[st.pi], ok=!!st.ok[st.pi], bad=st.bad[st.pi]||[];
    const usedW=F.filter((p,i)=>st.ok[i]&&i!==st.pi).map(p=>p.a), all=F.every((_,i)=>st.ok[i]);
    const task='feedA-'+st.pi, c=counts(task,LESSON.words.length);
    el.innerHTML=`<div class="sh"><div><span class="kick p">Mission 3 · Vocabulary review</span><h2 class="dsp h2">Mia’s Feed</h2><p class="lead">Mia scrolls her feed. Which expression fits each post?</p></div>
      <div class="dots">${F.map((_,i)=>`<i class="${st.ok[i]?'ok':''} ${i===st.pi?'cur':''}"></i>`).join('')}</div></div>
    <div class="feed">
      <div class="postimg ${isFlash('feedAok')?'pop':''}"><img src="${P.img}" alt="${esc(P.u)}: ${esc(P.t)}" width="1200" height="675">
        ${ok?`<div class="ans">✓ ${fmt(P.model)}</div>`:''}</div>
      <div><div class="small" style="margin-bottom:10px">Tap the expression the class says:</div>
        <div class="bank">${LESSON.words.map((w,i)=>`<button class="xp ${usedW.includes(w)||(ok&&w!==P.a)?'used':''} ${bad.includes(w)?'bad':''} ${isFlash('feedA',w)?'shake':''}" data-w="${esc(w)}">${esc(w)}${LIVE.on&&c[i]?`<span class="vc">${c[i]}</span>`:''}</button>`).join('')}</div>
        <div class="row mt">${!ok?`<button class="btn sm ghost" id="rv">👁 Reveal answer</button>`:''}<span class="grow"></span>
          ${st.pi>0?`<button class="btn sm ghost" id="pv">←</button>`:''}
          ${ok&&st.pi<F.length-1?`<button class="btn sm primary" id="nx">Next post →</button>`:''}
          ${all?`<span class="badge" style="color:var(--ok)">✓ Feed fixed</span>`:''}</div></div>
    </div>`;
    const solve=()=>{ st.ok[st.pi]=true; SFX.ok(); flash('feedAok'); save(); draw(); };
    $$('.xp',el).forEach(b=>b.onclick=()=>{ if(ok) return; const w=b.dataset.w; if(w===P.a) solve(); else { (st.bad[st.pi]=st.bad[st.pi]||[]).push(w); SFX.bad(); flash('feedA',w); save(); draw(); } });
    const rv=$('#rv',el); if(rv) rv.onclick=solve;
    const nx=$('#nx',el); if(nx) nx.onclick=()=>{ st.pi++; save(); draw(); };
    const pv=$('#pv',el); if(pv) pv.onclick=()=>{ st.pi--; save(); draw(); };
    CUR.reveal=()=>{ if(!ok) solve(); else if(st.pi<F.length-1){ st.pi++; save(); draw(); } };
  },
  teach:{ goal:'Повторення лексики уроку 14 — швидко, без пояснень.',
    notes:['Учні називають вираз — ви клацаєте. Неправильний трясеться і стає червоним.','Після правильної відповіді прочитайте модельне речення в пості.','На екрані всі 10 виразів — 5 інших знадобляться в частині B.'],
    answers:()=>LESSON.feed.map((p,i)=>`${i+1}. ${p.a} — ${plain(p.model)}`) } },

/* ── 3b · MIA'S NOTES (gap fill, optional) ── */

/* ── 5 · DISCOVERY ── */
{ id:'disc', m:5, name:'Grammar discovery', time:3, pct:55,
  live:()=>{ const st=sd('disc'), part=st.part||'A', D=part==='A'?LESSON.discA:LESSON.discB, k=st[part]||0; if(k>=D.steps.length) return null; const s=D.steps[k]; return {id:'disc-'+part+k, kind:'choice', q:s.q, opts:s.o}; },
  render(el){
    const st=sd('disc'); st.part=st.part||'A'; st.A=st.A||0; st.B=st.B||0;
    const part=st.part, D=part==='A'?LESSON.discA:LESSON.discB, k=st[part], done=k>=D.steps.length;
    const lit={}; D.steps.slice(0,k).forEach(s=>{ if(s.lit) lit[s.lit]=1; });
    const on = part==='A' ? {past:k>=3, now:k>=4, arrow:k>=4} : {now:k>=1, past:k>=2, arrow:k>=2};
    const sent = fmt(D.s).replace('class="p"',`class="p ${lit.p?'on':''}"`).replace('class="n"',`class="n ${lit.n?'on':''}"`);
    const c = done?[]:counts('disc-'+part+k, D.steps[k].o.length);
    el.innerHTML=`<div class="sh"><div><span class="kick p">Mission 5 · Detective work</span><h2 class="dsp h2">Discover the pattern</h2></div>
      <div class="tabs"><button class="tab ${part==='A'?'on':''}" data-p="A">Sentence A ${st.A>=4?'✓':''}</button><button class="tab ${part==='B'?'on':''}" data-p="B">Sentence B ${st.B>=2?'✓':''}</button></div></div>
    <div class="card face">${av('mia',72,'round')}<div class="sent">${sent}</div></div>
    <div class="steps mt">${D.steps.slice(0,Math.min(k+1,D.steps.length)).map((s,i)=> i<k
      ? `<div class="step"><div class="q">${esc(s.q)}</div><div class="a">✓ ${esc(s.say)}</div></div>`
      : `<div class="step ${isFlash('disc')?'shake':''}"><div class="q">${esc(s.q)}</div><div class="as">${s.o.map((o,j)=>`<button class="btn" data-a="${j}">${esc(o)}${LIVE.on&&c[j]?` <span class="mono" style="color:var(--now)">${c[j]}</span>`:''}</button>`).join('')}</div></div>`).join('')}</div>
    ${tlHTML(D.tl,on,isFlash('discTL'))}
    ${done?`<div class="row mt center">${part==='A'?`<span class="badge p" style="font-size:16px">Past cause → present result</span><button class="btn primary" id="toB">Sentence B →</button>`
      :`<span class="badge n" style="font-size:16px">Now / general situation → past result</span><button class="btn primary glow" id="toRule">So what’s the rule? →</button>`}</div>`:''}`;
    kickArrows(el);
    const answer=()=>{ st[part]++; SFX.ok(); flash('discTL'); save(); draw(); };
    $$('[data-a]',el).forEach(b=>b.onclick=()=>{ if(+b.dataset.a===D.steps[k].a) answer(); else { SFX.bad(); flash('disc'); draw(); } });
    $$('[data-p]',el).forEach(b=>b.onclick=()=>{ st.part=b.dataset.p; save(); draw(); });
    const tb=$('#toB',el); if(tb) tb.onclick=()=>{ st.part='B'; save(); draw(); };
    const tr=$('#toRule',el); if(tr) tr.onclick=next;
    CUR.reveal=()=>{ if(!done) answer(); else if(part==='A'){ st.part='B'; save(); draw(); } };
  },
  teach:{ goal:'Учні самі знаходять: причина і результат — у різних часах.',
    notes:['Одне питання за раз. Учні відповідають — ви клацаєте (або Reveal).','Колір: помаранчевий = минуле, бірюзовий = зараз. Таймлайн з’являється сам.','Головне в A: hadn’t posted → вона ВСЕ Ж опублікувала. Речення уявляє протилежне.','Після A натисніть Sentence B.'],
    say:['Did she post it? Yes! So “hadn’t posted” is imaginary.','Is she confident? Not really. So “were more confident” is imaginary too.'] } },

/* ── 6a · EXPLANATION ── */
{ id:'explain', m:6, name:'Mixed Conditionals', time:3, pct:60,
  render(el){
    const st=sd('explain'); st.tab=st.tab||0; st.more=st.more||{};
    const tabs=`<div class="tabs"><button class="tab ${st.tab===0?'on':''}" data-t="0">💡 The idea</button><button class="tab ${st.tab===1?'on':''}" data-t="1">Past → Now</button><button class="tab ${st.tab===2?'on':''}" data-t="2">Now → Past</button></div>`;
    let body='';
    if(st.tab===0){
      body=`<div class="card"><h2 class="dsp" style="font-size:clamp(40px,5vw,72px)">Two times.<br><span style="color:var(--now)">One sentence.</span></h2>
        <p class="lead mt" style="color:var(--text)">We use <b>Mixed Conditionals</b> when <b>TWO DIFFERENT TIMES</b> are connected.</p>
        <div class="big-idea"><div class="pill2 a"><small>USUALLY</small><span style="color:var(--past)">PAST</span> + <span style="color:var(--now)">PRESENT</span></div><div class="or dsp" style="font-size:30px;color:var(--muted)">or</div><div class="pill2 b"><small>OR</small><span style="color:var(--now)">PRESENT / GENERAL</span> + <span style="color:var(--past)">PAST</span></div></div>
        <div class="real"><div>🪞 The sentence imagines the <b>opposite</b> of real life:</div>
          <div>“If Mia <b>hadn’t posted</b>…” → in real life she <b>did</b> post.</div>
          <div>“If Mia <b>were</b> more confident…” → in real life she <b>isn’t</b> very confident.</div>
          <div class="help">So: the if-part is NOT true in real life.</div></div></div>`;
    } else {
      const T=LESSON.types[st.tab-1], n=st.more[st.tab]||0;
      const tl = T.key==='pn' ? LESSON.discA.tl : LESSON.discB.tl;
      body=`<div class="gx"><div class="card lit">${dirBadge(T.key)}
          <h2 class="dsp h2 mt">${T.key==='pn'?'<span style="color:var(--past)">Past</span> → <span style="color:var(--now)">Now</span>':'<span style="color:var(--now)">Now</span> → <span style="color:var(--past)">Past</span>'}</h2>
          <p class="lead mt" style="color:var(--text)">${esc(T.meaning)}</p>
          ${formula(T.formula)}
          <div class="mt">${withFace(`<div class="sent" style="font-size:clamp(22px,2.3vw,30px)">${fmt(T.ex)}</div>`,T.ex,56)}</div>
          <div class="real"><div class="small mono" style="letter-spacing:.14em">IN REAL LIFE</div>${T.real.map(r=>`<div>${esc(r)}</div>`).join('')}</div></div>
        <div><div class="card tight">${tlHTML(tl)}</div>
          <div class="exl mt lit">${T.more.slice(0,n).map(x=>`<div class="exi pop">${withFace(fmt(x),x,40)}</div>`).join('')}</div>
          ${n<T.more.length?`<div class="row mt"><button class="btn sm" id="more">＋ Show example ${n+1}/${T.more.length}</button></div>`:''}</div></div>`;
    }
    el.innerHTML=`<div class="sh"><div><span class="kick">Mission 6 · Grammar</span><h2 class="dsp h2">Mixed Conditionals</h2></div>${tabs}</div>${body}`;
    $$('[data-t]',el).forEach(b=>b.onclick=()=>{ st.tab=+b.dataset.t; save(); draw(); });
    const mo=$('#more',el); if(mo) mo.onclick=()=>{ st.more[st.tab]=(st.more[st.tab]||0)+1; SFX.pop(); save(); draw(); };
    CUR.example=()=>{ if(st.tab===0){ st.tab=1; } else if((st.more[st.tab]||0)<3) st.more[st.tab]=(st.more[st.tab]||0)+1; else if(st.tab===1) st.tab=2; save(); draw(); };
