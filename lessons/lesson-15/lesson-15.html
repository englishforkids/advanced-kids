      <h1 class="dsp mt" style="font-size:clamp(60px,9vw,130px)">Mission <span style="background:linear-gradient(90deg,var(--past),var(--now));-webkit-background-clip:text;background-clip:text;color:transparent">complete</span></h1>
      <div class="bigpct mt">TIMELINE RESTORED: 100%</div>
      <div class="mbar whole" style="max-width:560px;margin:14px auto 0;height:14px"><i style="width:100%"></i></div>
      <div class="skills">${LESSON.skills.map((s,i)=>`<div class="sk" style="animation-delay:${i*.08}s"><span class="e">${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>
      <div class="today"><div style="grid-column:1/-1;font-family:var(--mono);color:var(--muted);letter-spacing:.14em;font-size:14px">TODAY YOU:</div>${LESSON.today.map(t=>`<div>${esc(t)}</div>`).join('')}</div>
      <div class="row center mt2"><a class="btn primary" href="../../">← Back to the course</a><button class="btn ghost" id="again">↺ Replay</button></div></div>`;
    $('#again',el).onclick=askReset;
    if(!sd('done').boom){ sd('done').boom=1; save(); setTimeout(()=>{ confetti(); SFX.win(); },300); }
  },
  teach:{ goal:'Підсумок і похвала.',
    notes:['Пройдіться списком «Today you» — учні кажуть, що було найцікавішим.','Ідея домашнього: 3 речення про себе — 2 Past → Now і 1 Now → Past.'] } }
];
const BANKB = ['take it down','get over it','go for it','be into','be all about'];
let PRES_T=null;
function revealHints(st){ TEAMS().forEach(t=>st.hint[t.L]=1); save(); draw(); }
function cleanEnding(v){ return String(v||'').trim().replace(/^if i hadn['’]t made mistakes in the past,?\s*/i,'').replace(/^i\s+/i,'').replace(/\s*now\.?$/i,'').replace(/[.!]+$/,'').trim().slice(0,90); }
const MISSIONS = ['The message','Warm-up','Mia’s Feed','What happened?','Discovery','The rule','What if…?','Breakout','Timeline restored'];

function copyTasks(){
  const lines=['BREAKOUT MISSION — FIX A BROKEN TIMELINE (5 min)','',
    'Create:', ...LESSON.mission.map((m,i)=>`${i+1}) ${m.en}${m.f?' — '+m.f.map(x=>x[1]).join(', '):''}`),'',
    LESSON.missionHelp,'',
    ...TEAMS().map(t=>`TEAM ${t.L} — ${t.name.toUpperCase()}: ${t.facts.map(f=>f[1]).join(' ')}`)];
  const txt=lines.join('\n');
  const ok=()=>toast('📋 Copied — paste it into the Zoom chat');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(ok,()=>fallback()); else fallback();
  function fallback(){ openModal(`<h3>Copy this into the Zoom chat</h3><textarea style="width:100%;min-height:300px;margin-top:12px;padding:12px;border-radius:12px;background:#0B0F2E;border:1px solid var(--edge2);color:var(--text)">${esc(txt)}</textarea><div class="row mt"><button class="btn" onclick="closeModal()">Close</button></div>`); }
}
</script>
<script>
/* ---------- 7 · navigation ---------- */
const cur = ()=>SCENES[S.i];
const visible = i => !(S.short && SCENES[i].opt);
const MILESTONES = {15:'Warm-up complete', 35:'Words recovered', 65:'Grammar unlocked', 100:'Mia’s timeline is fixed'};

function award(p, quiet){
  if(p<=S.pct) return;
  const old=S.pct; S.pct=p; save(); paintMeter();
  const m=Object.keys(MILESTONES).map(Number).filter(x=>x>old && x<=p && x>S.shownPct).pop();
  if(m){ S.shownPct=m; save(); if(!quiet) banner(m); }
}
function banner(p){
  const b=$('#banner'); $('#bnV').textContent=p+'%'; $('#bnS').textContent=MILESTONES[p]||''; $('#bnF').style.width='0';
  b.classList.add('on'); SFX.rise(); setTimeout(()=>$('#bnF').style.width=p+'%',80);
  clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove('on'),2600);
}
$('#banner').onclick=()=>$('#banner').classList.remove('on');
function paintMeter(){
  $('#mfill').style.width=S.pct+'%'; $('#pctTxt').textContent=S.pct+'%';
  $('#mbar').classList.toggle('whole',S.pct>=100); $('#mbar').setAttribute('aria-valuenow',S.pct);
}

function go(j){
  if(j<0||j>=SCENES.length) return;
  if(PLAYER.playing) PLAYER.pause();
  if(j>S.i){ let p=S.pct; for(let k=0;k<j;k++) p=Math.max(p, SCENES[k].pct); award(p); }
  S.i=j; S.seen[cur().id]=1; save(); draw(true);
  $('#stage').scrollTop=0;
}
function next(){ for(let j=S.i+1;j<SCENES.length;j++) if(visible(j)) return go(j); }
function back(){ for(let j=S.i-1;j>=0;j--) if(visible(j)) return go(j); }
function skipOpt(){ const c=cur(); if(c.opt) return next(); for(let j=S.i+1;j<SCENES.length;j++){ if(!SCENES[j].opt){ return go(j); } } }

let lastDraw=0;
function draw(anim){
  const el=$('#scene'), c=cur(); CUR={};
  const y=$('#stage').scrollTop;
  el.className='wrap'+(anim?' scene-in':''); if(anim){ void el.offsetWidth; }
  try{ c.render(el); }catch(e){ console.error(e); el.innerHTML=`<div class="card">Something went wrong in this scene. <button class="btn sm" onclick="resetScene()">Reset scene</button></div>`; }
  FLASH=null;
  $$('.msgs',el).forEach(m=>m.scrollTop=m.scrollHeight);
  if(!anim){ $('#stage').scrollTop=y; const pops=$$('.pop',el); if(pops.length) pops[pops.length-1].scrollIntoView({block:'nearest',behavior:REDUCED?'auto':'smooth'}); }
  // nav
  const vis=SCENES.map((_,i)=>i).filter(visible), pos=vis.indexOf(S.i);
  const inM=SCENES.filter((s,i)=>s.m===c.m && visible(i)), k=inM.indexOf(c)+1;
  $('#navInfo').innerHTML=`MISSION <b>${c.m}/9</b> · ${esc(c.name)}${inM.length>1?` · ${k}/${inM.length}`:''}${c.opt?' · <span class="optn">OPTIONAL</span>':''}`;
  $('#btnBack').disabled = pos<=0;
  const last = pos===vis.length-1;
  $('#btnNext').disabled = last;
  $('#btnNext').innerHTML = c.id==='hook' && (sd('hook').ph||0)<2 ? 'Skip intro →' : 'Continue →';
  paintMeter(); paintTeacher(); pubState(); paintDock();
}
function resetScene(){ const c=cur(); delete S.sd[c.id];
  ({listen:['lq'], fix:['fq'], teams:[], present:[]}[c.id]||[]).forEach(k=>delete S.sd[k]);
  if(c.id==='listen'){ delete S.sd.lq; PLAYER.pause(); PLAYER.idx=0; }
  if(c.id==='last') S.finals=[];
  save(); draw(true); toast('Scene reset'); }

/* ---------- modal, confetti ---------- */
function openModal(html){ $('#modalBox').innerHTML=html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
function confetti(){
  if(REDUCED) return; const cv=$('#confetti'), x=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#FFB547','#3EE8FF','#C4B5FD','#FF8FC7','#43E5A0','#fff'];
  const P=Array.from({length:160},()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:4+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6}));
  let t=0; const f=()=>{ x.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); }); if(++t<200) requestAnimationFrame(f); else x.clearRect(0,0,cv.width,cv.height); }; f();
}
function showMap(){
  openModal(`<div class="row"><h2 class="dsp h2 grow">Mission map</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
   <p class="small">Route: <b>${S.short?'Core ≈ 35 min':'Full ≈ 40 min'}</b> · optional scenes are marked.</p>
   <div class="map">${SCENES.map((s,i)=>`<button class="mapi ${i===S.i?'cur':''} ${s.opt?'op':''} ${S.seen[s.id]?'seen':''}" data-go="${i}"><span class="k">MISSION ${s.m} · ${s.time} MIN${s.opt?' · OPTIONAL':''}</span><b>${esc(s.name)}</b></button>`).join('')}</div>`);
  $$('[data-go]',$('#modalBox')).forEach(b=>b.onclick=()=>{ closeModal(); go(+b.dataset.go); });
}
function askReset(){
  openModal(`<h2 class="dsp h2">Reset the whole lesson?</h2><p class="lead mt">All answers, votes and the timeline go back to 0%. The room code stays the same.</p>
   <div class="row mt2"><button class="btn primary" id="rsY">↺ Reset lesson</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
  $('#rsY').onclick=()=>{ const room=S.room, snd=S.sound, sh=S.short; S=FRESH(); S.room=room; S.sound=snd; S.short=sh; for(const k in LV) delete LV[k]; TIMER.reset(); PLAYER.pause(); PLAYER.idx=0; save(); closeModal(); go(0); toast('Lesson reset'); };
}

/* ---------- 8 · teacher mode ---------- */
function totalTime(short){ return SCENES.filter(s=>!(short&&s.opt)).reduce((a,s)=>a+s.time,0); }
function paintTeacher(){
  if(!$('#teacher').classList.contains('on')) return;
  const c=cur(), T=c.teach||{}, ans=T.answers?T.answers():null;
  const nextOpt = SCENES.slice(S.i+1).find((s,i)=>visible(S.i+1+i));
  $('#tBody').innerHTML=`
   <div class="tsec"><h4>Now · Mission ${c.m} · ${c.time} min</h4><b style="font-size:19px">${esc(c.name)}</b> ${c.opt?'<span class="badge skip">optional</span>':''}<p class="small" style="margin:6px 0 0">${esc(T.goal||'')}</p></div>
   <div class="tacts">
     <button class="btn sm" id="tRev">👁 Reveal answer</button><button class="btn sm" id="tEx">💡 Show example</button>
     <button class="btn sm ghost" id="tRst">↺ Reset scene</button><button class="btn sm ghost" id="tSkip" ${(c.opt||(nextOpt&&nextOpt.opt))?'':'disabled'}>⏭ Skip optional</button>
     <button class="btn sm primary" id="tNext" style="grid-column:1/-1">Next scene →</button></div>
   ${T.notes?`<div class="tsec"><h4>Steps</h4><ul>${T.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`:''}
   ${T.say?`<div class="tsec"><h4>Say / ask</h4>${T.say.map(s=>`<div class="say">“${esc(s)}”</div>`).join('')}</div>`:''}
   ${T.tip?`<div class="tsec"><h4>Tip</h4>${esc(T.tip)}</div>`:''}
   ${ans?`<div class="tsec"><h4>Answers</h4>${ans.map(a=>`<div style="white-space:pre-wrap">${esc(a)}</div>`).join('')}</div>`:''}
   <div class="tsec"><h4>Route · ${S.short?'CORE':'FULL'} ≈ ${totalTime(S.short)} min</h4>
     <div class="route">${SCENES.map((s,i)=>`<div class="${i===S.i?'cur':''} ${s.opt?'op':''} ${!visible(i)?'rsk':''}"><span>${s.m}. ${esc(s.name)}${s.opt?' ◦':''}</span><span>${s.time}′</span></div>`).join('')}</div>
     <div class="row mt"><button class="btn sm ghost" id="tLen">Switch to ${S.short?'FULL ≈ '+totalTime(false):'CORE ≈ '+totalTime(true)} min</button></div></div>
   <div class="tsec small"><h4>Keys</h4>→ / Space next · ← back · T teacher · M map · F full screen · R reveal · E example</div>
   <div class="row"><button class="btn sm ghost" id="tAll">↺ Reset whole lesson</button></div>`;
  $('#tRev').onclick=()=>CUR.reveal?CUR.reveal():toast('Nothing to reveal on this scene');
  $('#tEx').onclick=()=>CUR.example?CUR.example():toast('No example on this scene');
  $('#tRst').onclick=resetScene; $('#tSkip').onclick=skipOpt; $('#tNext').onclick=next;
  $('#tLen').onclick=toggleLen; $('#tAll').onclick=askReset;
}
function toggleTeacher(force){ const on = force ?? !$('#teacher').classList.contains('on'); $('#teacher').classList.toggle('on',on); $('#teacher').setAttribute('aria-hidden',!on); $('#btnTeacher').classList.toggle('on',on); paintTeacher(); }
function toggleLen(){ S.short=!S.short; save(); $('#lenLbl').textContent=S.short?'Core':'Full'; toast(S.short?`Core route ≈ ${totalTime(true)} min · optional scenes skipped`:`Full route ≈ ${totalTime(false)} min`); if(!visible(S.i)) next(); else draw(); }

/* ---------- 9 · live room (Supabase Realtime broadcast; BroadcastChannel fallback) ----------
   Той самий механізм, що в уроках 5, 13, 14: таблиці не потрібні, повідомлення летять
   через канал кімнати. SAVE_ANSWERS:true додатково пише відповіді в lesson_answers. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const uid = ()=> Math.random().toString(36).slice(2,9);
const qs = new URLSearchParams(location.search);
const ROLE = qs.get('role')==='student' ? 'student' : 'teacher';
if(qs.get('room')) S.room = qs.get('room').replace(/\D/g,'').slice(0,6) || S.room;
const LIVE = {on:false, count:0};
const WALL = [];   // text answers waiting for the teacher

const Net = {
  kind:null, ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  async connect(o){
    this.me={id:(o.role==='student' && localStorage.getItem('l15sid')) || uid(), name:o.name||'', role:o.role};
    if(o.role==='student') localStorage.setItem('l15sid', this.me.id);
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{});
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
        this.sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
        this.ch = this.sb.channel('lesson15-'+o.room, {config:{presence:{key:this.me.id}, broadcast:{self:false}}});
        this.ch.on('broadcast',{event:'msg'},({payload})=>this.onEvent(payload));
        this.ch.on('presence',{event:'sync'},()=>{ const st=this.ch.presenceState(), list=[]; Object.values(st).forEach(v=>list.push(v[0])); this.onPeers(list); });
        await new Promise((res,rej)=>{ const to=setTimeout(()=>rej(new Error('timeout')),8000);
          this.ch.subscribe(async st=>{ if(st==='SUBSCRIBED'){ clearTimeout(to); await this.ch.track(this.me); res(); }
            if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ clearTimeout(to); rej(new Error(st)); } }); });
        this.kind='supabase'; return this.kind;
      }catch(e){ console.warn('Supabase realtime unavailable:', e.message||e); this.sb=null; this.ch=null; }
    }
    try{
      this.bc=new BroadcastChannel('lesson15-'+o.room);
      this.bc.onmessage=e=>{ const m=e.data; if(!m||!m.from) return; this.peers[m.from.id]=Object.assign({},m.from,{ts:Date.now()}); this.flush(); if(m.t!=='__hb') this.onEvent(m); };
      this.hb=setInterval(()=>this.send({t:'__hb'}),2500);
      this.prune=setInterval(()=>{ const now=Date.now(); let ch=false; for(const k in this.peers) if(now-this.peers[k].ts>9000){ delete this.peers[k]; ch=true; } if(ch) this.flush(); },3000);
      this.send({t:'__hb'}); this.kind='local'; return this.kind;
    }catch(e){ this.kind='none'; return 'none'; }
  },
  flush(){ this.onPeers(Object.values(this.peers)); },
  send(p){ const msg=Object.assign({},p,{from:this.me}); if(this.kind==='supabase'&&this.ch) this.ch.send({type:'broadcast',event:'msg',payload:msg}); else if(this.bc) this.bc.postMessage(msg); },
  stop(){ clearInterval(this.hb); clearInterval(this.prune); if(this.ch){ try{ this.ch.unsubscribe(); }catch(e){} } if(this.bc){ try{ this.bc.close(); }catch(e){} } this.kind=null; this.ch=null; this.bc=null; this.peers={}; }
};
const Store = {
  async log(kind, task, id, value){
    if(!(CFG.SAVE_ANSWERS && Net.sb)) return;
    try{ await Net.sb.from('lesson_answers').insert({room:String(S.room), lesson:'lesson15-mixed', chapter:cur().id, task, kind, student_id:id, student_name:NAMES[id]||null, value:String(value)}); }
    catch(e){ console.warn('Supabase insert failed:', e.message||e); }
  }
};

let pubT=null;
function pubState(){
  if(!LIVE.on || ROLE!=='teacher') return;
  clearTimeout(pubT); pubT=setTimeout(()=>{
    const c=cur(); let task=null; try{ task=c.live?c.live():null; }catch(e){}
    Net.send({t:'state', sc:c.name, m:c.m, task, pct:S.pct, timer:{left:Math.ceil(TIMER.left), run:TIMER.run, total:TIMER.total}});
  },120);
}
setInterval(()=>{ if(LIVE.on) pubState(); },6000);
let redrawT=null;
function onTeacherMsg(m){
  const id=m.from&&m.from.id; if(!id) return; if(m.from.name) NAMES[id]=m.from.name;
  if(m.t==='hello'){ pubState(); return; }
  if(m.t==='react'){ floatEmoji(m.e); return; }
  if(m.t==='ans'){
    const c=cur(); let task=null; try{ task=c.live?c.live():null; }catch(e){}
    (LV[m.task]=LV[m.task]||{})[id]=m.v; Store.log('ans',m.task,id,m.v);
    if(task && task.kind==='text' && m.task===task.id){ const txt=cleanEnding(m.v); if(txt){ WALL.unshift({id:uid(), text:txt, by:m.from.name||'student'}); SFX.pop(); } paintDock(); return; }
    clearTimeout(redrawT); redrawT=setTimeout(()=>{ draw(); },250); return;
  }
  if(m.t==='work'){ S.work[m.team]=Object.assign({},m.data,{by:m.from.name||''}); save(); SFX.ok(); toast(`📨 Team ${m.team} sent their timeline`); Store.log('work','team-'+m.team,id,JSON.stringify(m.data));
    if(['teams','present'].includes(cur().id)) draw(); return; }
}
function floatEmoji(e){ if(!/^[\p{Extended_Pictographic}‍️]{1,8}$/u.test(e||'')) return; const s=document.createElement('span'); s.textContent=e; s.style.left=Math.random()*70+'px'; $('#reacts').appendChild(s); setTimeout(()=>s.remove(),3100); }
function paintDock(){
  const d=$('#dock'); d.classList.toggle('on',LIVE.on); if(!LIVE.on) return;
  $('#dockTitle').textContent='Room '+S.room+(Net.kind==='local'?' · this browser only':'');
  $('#dockCount').textContent=LIVE.count+' joined'; $('#dockLed').className='led '+(Net.kind==='supabase'?'on':'warn');
  const c=cur(); let task=null; try{ task=c.live?c.live():null; }catch(e){}
  let h='';
  if(!task) h=`<div class="small">No phone task on this screen — students see “look at the main screen”.</div>`;
  else if(task.kind==='choice'){ const n=counts(task.id,task.opts.length), t=n.reduce((a,b)=>a+b,0); h=`<div class="small">${t} answer${t===1?'':'s'} · ${esc(task.q.slice(0,60))}</div>`+task.opts.map((o,i)=>n[i]?`<div class="row" style="gap:8px"><b class="mono" style="color:var(--now)">${n[i]}</b><span class="small">${esc(o)}</span></div>`:'').join(''); }
  else if(task.kind==='text'){ h = WALL.length ? WALL.map(w=>`<div class="wallit"><p>${esc(w.text)}<small>${esc(w.by)}</small></p><button class="btn sm" data-w="${w.id}">Show</button><button class="btn sm ghost" data-wx="${w.id}">✕</button></div>`).join('') : `<div class="small">Waiting for answers…</div>`; }
  else if(task.kind==='team'){ h=TEAMS().map(t=>`<div class="small">Team ${t.L} · ${esc(t.name)}: ${S.work[t.L]?'<b style="color:var(--ok)">✓ sent</b>':'…'}</div>`).join(''); }
  else h=`<div class="small">Students can send emoji reactions.</div>`;
  $('#dockBody').innerHTML=h;
  $$('[data-w]',d).forEach(b=>b.onclick=()=>{ const k=WALL.findIndex(w=>w.id===b.dataset.w); if(k<0) return; const w=WALL.splice(k,1)[0]; S.finals.push({text:w.text, by:w.by}); save(); if(cur().id==='last') draw(); else paintDock(); });
  $$('[data-wx]',d).forEach(b=>b.onclick=()=>{ const k=WALL.findIndex(w=>w.id===b.dataset.wx); if(k>=0) WALL.splice(k,1); paintDock(); });
}
$('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
function joinURL(){ return location.href.split('?')[0].split('#')[0]+'?room='+S.room+'&role=student'; }
function onPeers(list){ LIVE.count=list.filter(p=>p&&p.role==='student').length; paintDock(); }
function openLive(){
  const status = LIVE.on ? (Net.kind==='supabase'?'<span style="color:var(--ok)">● live</span>':'<span style="color:var(--amber)">● this browser only (check Supabase key)</span>') : 'not started';
  openModal(`<div class="row"><h2 class="dsp h2 grow">Live Student Mode</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></div>
   <p class="small">Optional. Students join from a phone and vote, answer and send team work. Everything also works without phones.</p>
   <div class="two mt" style="align-items:center"><div><div class="small">Room code</div><div class="dsp" style="font-size:72px">${S.room}</div>
     <div class="small" style="word-break:break-all">${esc(joinURL())}</div><div class="small mt">Status: ${status} · ${LIVE.count} joined</div></div>
     <img alt="QR code for the student link" width="200" height="200" style="border-radius:18px;background:#fff;justify-self:end" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=8&data=${encodeURIComponent(joinURL())}" onerror="this.remove()"></div>
   <div class="row mt2">${LIVE.on?`<button class="btn" id="lvStop">⏹ Stop room</button>`:`<button class="btn primary" id="lvStart">▶ Start live room</button>`}
     <button class="btn sm ghost" id="lvCopy">📋 Copy link</button><button class="btn sm ghost" id="lvNew" ${LIVE.on?'disabled':''}>New code</button></div>`);
  const st=$('#lvStart'); if(st) st.onclick=async()=>{ st.disabled=true; st.textContent='Connecting…';
    const kind=await Net.connect({room:S.room, role:'teacher', name:'teacher', onEvent:onTeacherMsg, onPeers});
    LIVE.on=kind!=='none'; $('#btnLive').classList.toggle('on',LIVE.on); pubState(); draw(); openLive();
    toast(kind==='supabase'?'Live room open — share the link or QR':'Local room only — check the Supabase key'); };
  const sp=$('#lvStop'); if(sp) sp.onclick=()=>{ Net.send({t:'end'}); Net.stop(); LIVE.on=false; LIVE.count=0; $('#btnLive').classList.remove('on'); draw(); openLive(); };
  $('#lvCopy').onclick=()=>{ navigator.clipboard?.writeText(joinURL()).then(()=>toast('Link copied')); };
  $('#lvNew').onclick=()=>{ S.room=String(1000+Math.floor(Math.random()*9000)); save(); openLive(); };
}

/* ---------- 10 · student app (lesson-15.html?room=1234&role=student) ---------- */
function studentApp(){
  document.body.classList.add('student');
  let st=null, name=localStorage.getItem('l15name')||'', sent={}, myTeam=localStorage.getItem('l15team-'+S.room)||'';
  const B=$('#stuBody'); $('#stuRoom').textContent='room '+S.room;
  $('#stuFoot').innerHTML=['👍','😂','😮','🔥','✋','❤️'].map(e=>`<button data-e="${e}" aria-label="React ${e}">${e}</button>`).join('');
  $$('[data-e]',$('#stuFoot')).forEach(b=>b.onclick=()=>{ Net.send({t:'react', e:b.dataset.e}); b.animate?.([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); });
  const ask=()=>{
    B.innerHTML=`<div class="card stu-card"><h2 class="dsp" style="font-size:36px">Join Mission 15</h2><p class="small">Room ${esc(S.room)}. Type your name or a nickname.</p>
      <input id="nm" maxlength="20" value="${esc(name)}" placeholder="Your name" autocomplete="off"><button class="btn primary mt" id="jn" style="width:100%">Join →</button></div>`;
    $('#jn').onclick=()=>{ const v=$('#nm').value.trim(); if(!v) return $('#nm').focus(); name=v; localStorage.setItem('l15name',name); join(); };
    $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#jn').click(); };
  };
  const join=async()=>{
    B.innerHTML=`<div class="stu-wait"><div class="big">🔌</div><p>Connecting to room ${esc(S.room)}…</p></div>`;
    const kind=await Net.connect({room:S.room, role:'student', name, onEvent:m=>{ if(m.t==='state'){ if(!st||JSON.stringify(st.task)!==JSON.stringify(m.task)||st.sc!==m.sc) { st=m; render(); } else { st=m; paintT(); } } if(m.t==='end') ended(); }});
    $('#stuLed').className='led '+(kind==='supabase'?'on':kind==='local'?'warn':'');
    if(kind==='none'){ B.innerHTML=`<div class="stu-wait"><div class="big">📶</div><p><b>Could not join.</b></p><p class="small">Check your internet and open the link again.</p><button class="btn primary mt" id="rt">Try again</button></div>`; $('#rt').onclick=join; return; }
    Net.send({t:'hello'}); render();
    setTimeout(()=>{ if(!st) Net.send({t:'hello'}); },2500);
  };
  const ended=()=>{ Net.stop(); B.innerHTML=`<div class="stu-wait"><div class="big">✅</div><h2 class="dsp" style="font-size:34px">Mission complete</h2><p class="small">Thanks, ${esc(name)}! You can close this page.</p></div>`; };
  const paintT=()=>{ const t=$('#stuT'); if(t&&st&&st.timer){ const s=Math.max(0,st.timer.left); t.textContent=(st.timer.run?'⏱ ':'⏸ ')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); } };
  setInterval(()=>{ if(st&&st.timer&&st.timer.run&&st.timer.left>0){ st.timer.left--; paintT(); } },1000);
  const render=()=>{
    if(!st){ B.innerHTML=`<div class="stu-wait"><div class="big">👀</div><p>Hi ${esc(name)}! Waiting for your teacher…</p></div>`; return; }
    const T=st.task, head=`<div class="small mono" style="letter-spacing:.12em;margin-bottom:10px">MISSION ${st.m}/9 · ${esc(st.sc)}</div>`;
    if(!T||T.kind==='react'){ B.innerHTML=head+`<div class="stu-wait card stu-card"><div class="big">${T?'🗣️':'👀'}</div><p><b>${T?esc(T.q):'Look at the main screen.'}</b></p><p class="small">${T?'Tap an emoji below.':'Your teacher will send a task soon.'}</p></div>`; return; }
    if(T.kind==='choice'){
      const my=sent[T.id];
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><div class="opts">${T.opts.map((o,i)=>`<button class="opt ${my===i?'right':''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <p class="small mt">${T.lock?'✓ Answer revealed on the main screen.':my!==undefined?'✓ Sent! You can change it.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T.lock) return; sent[T.id]=+b.dataset.i; Net.send({t:'ans', task:T.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T.kind==='text'){
      B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">${esc(T.q)}</p><input id="tx" maxlength="90" placeholder="${esc(T.ph||'')}" autocomplete="off"><button class="btn primary mt" id="sd" style="width:100%">Send ➤</button>
        <p class="small mt">${sent[T.id]?'✓ Sent: “'+esc(sent[T.id])+'”. Send another?':'Your teacher will show the best answers.'}</p></div>`;
      $('#sd').onclick=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T.id]=v; Net.send({t:'ans', task:T.id, v}); render(); };
      return;
    }
    if(T.kind==='team'){
      const t=T.teams.find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=head+`<div class="card stu-card"><p style="font-size:20px;font-weight:800">Which team are you in?</p><div class="opts">${T.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>Team ${x.L} · ${esc(x.name)}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; localStorage.setItem('l15team-'+S.room,myTeam); render(); }); return; }
      const w=JSON.parse(localStorage.getItem('l15work-'+S.room+myTeam)||'{}');
      B.innerHTML=head+`<div class="card stu-card"><div class="row"><span style="font-size:34px">${t.e}</span><div class="grow"><b style="font-size:20px">Team ${t.L} · ${esc(t.name)}</b><div class="small mono" id="stuT"></div></div><button class="btn sm ghost" id="chg">change</button></div>
        ${t.facts.map(f=>`<p class="mt" style="margin-bottom:0"><b style="color:${f[0]==='p'?'var(--past)':'var(--now)'}">${f[0]==='p'?'PAST':'NOW'}:</b> ${esc(f[1])}</p>`).join('')}
        <label>1 · Past → Now (If + had + V3, would + verb)</label><textarea id="w1">${esc(w.s1||'')}</textarea>
        <label>2 · Now → Past (If + Past Simple, would have + V3)</label><textarea id="w2">${esc(w.s2||'')}</textarea>
        <label>3 · Advice</label><input id="w3" value="${esc(w.advice||'')}">
        <label>4 · Title</label><input id="w4" value="${esc(w.title||'')}">
        <button class="btn primary mt" id="snd" style="width:100%">📨 Send to teacher</button><p class="small mt" id="ok">${w.sent?'✓ Sent. You can edit and send again.':'One person per team sends.'}</p></div>`;
      paintT();
      $('#chg').onclick=()=>{ myTeam=''; localStorage.removeItem('l15team-'+S.room); render(); };
      $('#snd').onclick=()=>{ const data={s1:$('#w1').value.trim().slice(0,160), s2:$('#w2').value.trim().slice(0,160), advice:$('#w3').value.trim().slice(0,100), title:$('#w4').value.trim().slice(0,80)};
        if(!data.s1&&!data.s2) return toast('Write at least one sentence');
        Net.send({t:'work', team:myTeam, data}); localStorage.setItem('l15work-'+S.room+myTeam, JSON.stringify(Object.assign({sent:1},data))); $('#ok').textContent='✓ Sent! Your teacher can see it.'; };
      return;
    }
  };
  name ? join() : ask();
}

/* ---------- 11 · boot ---------- */
if(ROLE==='student'){ studentApp(); }
else {
  $('#btnNext').onclick=next; $('#btnBack').onclick=back;
  $('#btnTeacher').onclick=()=>toggleTeacher(); $('#tClose').onclick=()=>toggleTeacher(false);
  $('#btnMap').onclick=showMap; $('#btnLen').onclick=toggleLen; $('#btnLive').onclick=openLive;
  $('#btnSound').onclick=()=>{ S.sound=!S.sound; save(); $('#btnSound').textContent=S.sound?'🔊':'🔇'; };
  $('#btnFull').onclick=()=>{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
  $('#btnSound').textContent=S.sound?'🔊':'🔇'; $('#lenLbl').textContent=S.short?'Core':'Full';
  document.addEventListener('keydown',e=>{
    if(e.target.closest('input,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    if(!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
    const k=e.key;
    if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); next(); }
    else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); back(); }
    else if(k==='t'||k==='T') toggleTeacher();
    else if(k==='m'||k==='M') showMap();
    else if(k==='f'||k==='F') $('#btnFull').click();
    else if(k==='r'||k==='R') CUR.reveal&&CUR.reveal();
    else if(k==='e'||k==='E') CUR.example&&CUR.example();
    else if(k==='Escape'){ toggleTeacher(false); $('#banner').classList.remove('on'); }
  });
  if(S.i>=SCENES.length) S.i=0;
  S.seen[cur().id]=1; TIMER.paint(); draw(true);
}
</script>
