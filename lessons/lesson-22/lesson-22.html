<style>

/* ════════ STUDIO BACKDROP ════════ */

  transition:filter .8s}
#studio .beam{position:absolute; top:-12%; width:34vw; height:120vh; transform-origin:50% 0; opacity:.22; mix-blend-mode:screen;
  background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(140,110,255,0) 78%); clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);
  animation:sweep 9s ease-in-out infinite alternate}

@keyframes sweep{from{transform:rotate(calc(var(--a) - 9deg))} to{transform:rotate(calc(var(--a) + 9deg))}}

#top{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:10px clamp(10px,2vw,24px); background:rgba(7,7,28,.74); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}

#stage{min-height:calc(100vh - 65px); padding:clamp(18px,2.6vw,40px) clamp(14px,3vw,48px) 130px; display:flex; justify-content:center}

.av{--c:var(--c-max); position:relative; flex:none; width:var(--s,56px); height:var(--s,56px); border-radius:50%; overflow:hidden; background:radial-gradient(circle at 50% 35%,#3A2A8A,#120C34); box-shadow:0 0 0 3px var(--c), 0 0 24px color-mix(in srgb, var(--c) 45%, transparent); display:grid; place-items:center}

.av.k-beep{animation:beepGlow 1.8s ease-in-out infinite}
.av.k-beep img{animation:beepFloat 3s ease-in-out infinite}
@keyframes beepFloat{0%,100%{transform:scale(1.1) translateY(2.5%)}50%{transform:scale(1.1) translateY(-2.5%)}}
@keyframes beepGlow{0%,100%{box-shadow:0 0 0 3px var(--c), 0 0 18px rgba(61,245,160,.35)}50%{box-shadow:0 0 0 3px var(--c), 0 0 34px rgba(61,245,160,.8), 0 0 60px rgba(255,63,208,.35)}}
.av .fb{font-family:var(--disp);font-size:calc(var(--s,56px)*.36);color:#fff}
.k-max{--c:var(--c-max)} .k-nova{--c:var(--c-nova)} .k-beep{--c:var(--c-beep)} .k-you{--c:var(--c-you)} .k-emma{--c:var(--c-emma)}
.nm{font-family:var(--disp);font-size:13px;letter-spacing:.12em;font-weight:900;text-transform:uppercase}
.nm.k-max{color:var(--c-max)} .nm.k-nova{color:var(--c-nova)} .nm.k-beep{color:var(--c-beep)} .nm.k-you{color:var(--c-you)} .nm.k-emma{color:var(--c-emma)}
.caps{display:flex;flex-direction:column;gap:14px}

.cap .bub{position:relative;background:linear-gradient(135deg,rgba(40,34,110,.92),rgba(22,18,66,.92));border:1px solid var(--line2);border-left:5px solid var(--c);border-radius:6px 22px 22px 22px;padding:14px 20px;font-size:clamp(19px,1.6vw,27px);font-weight:700;line-height:1.35;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.cap .bub .nm{display:block;margin-bottom:4px}
.cap.right{grid-template-columns:1fr auto}
.cap.right .av{order:2}
.cap.right .bub{border-left:1px solid var(--line2);border-right:5px solid var(--c);border-radius:22px 6px 22px 22px;text-align:right}
.cap.beepcap .bub{font-family:var(--disp);font-weight:900;letter-spacing:.04em;color:var(--c-beep);background:linear-gradient(135deg,rgba(10,40,40,.9),rgba(8,20,30,.9));border-color:rgba(61,245,160,.4)}
@keyframes capin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.pw{font-family:var(--disp);font-weight:900;letter-spacing:.03em;color:var(--gold);text-shadow:0 0 18px rgba(255,201,77,.55)}
.hostcard{position:relative;display:grid;place-items:center}

.hostcard .tag{margin-top:-18px;z-index:2;background:#0B0A26;border:2px solid var(--c);border-radius:999px;padding:4px 16px}
.spot{position:relative}
.spot::before{content:"";position:absolute;left:50%;top:-40%;width:100%;height:150%;transform:translateX(-50%);background:radial-gradient(50% 60% at 50% 30%,rgba(255,240,200,.28),transparent 70%);pointer-events:none;z-index:-1}

<script>

function save(){ if(ROLE!=='teacher') return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const sd = id => (S.d[id] = S.d[id] || {});

/* ---------- 3 · ui helpers ---------- */
function av(k, s=56, mood){
  const c=CH[k]||{name:'?'};
  const src = k==='max' ? (PH[MOODS[mood||'max']] || PH.max) : (c.img ? c.img() : '');
  const fbTxt = k==='you' ? '🎤' : (c.name||'?')[0];
  const inner = src ? `<img src="${esc(src)}" alt="" onerror="this.outerHTML='<span class=&quot;fb&quot;>${fbTxt}</span>'">` : `<span class="fb">${fbTxt}</span>`;
  return `<span class="av k-${k}" style="--s:${s}px" role="img" aria-label="${esc(c.name)}">${inner}</span>`;
}
function cap(line, o={}){
  const [k,t,mood]=line, c=CH[k];
  const cls=(k==='you'?' right':'')+(k==='beep'?' beepcap':'');
  return `<div class="cap${cls} k-${k}"${o.delay?` style="animation-delay:${o.delay}s"`:''}>${av(k,o.s||64,mood)}<div class="bub"><span class="nm k-${k}">${c.name}</span>${o.html?t:emph(t)}</div></div>`;
}
function head(s){ const sc=SCENES[s.sc-1]; return `<div class="eyebrow"><span class="rd">${sc.k}</span><b>${sc.t}</b>${s.opt?'<span class="opttag">optional</span>':''}</div>`; }
function hostcard(mood, label){ return `<div class="hostcard spot">${av('max',220,mood)}<div class="tag nm k-max">${label||'MAX · The Doubt Master'}</div></div>`; }
function pcardsHTML(onN, o={}){

    return `<div class="pc ${on&&!nw?'on':''} ${o.glow===i?'glow':''}" ${nw?'data-unlock':''} aria-label="${on?p[0]+' unlocked':'locked card'}"><div class="in"><div class="f">${ico('lock','#B9A8FF')}</div><div class="b"><span class="goldtxt">${p[0]}</span><small>${p[1]}</small></div></div></div>`; }).join('')}</div>`;
}
/* quiz state for one question */
const QMAP = {}; [...VOCQ, ...RQ, ...BEAT, FINALQ].forEach(q=>QMAP[q.k]=q);
function qState(d,k){ const q=QMAP[k], a=(d.a||{})[k], rv=!!((d.rv||{})[k]), done=(a===q.a)||rv; return {a, done, show:done && !d.hid}; }
function counts(tid,n){ const v=S.votes[tid]||{}, c=Array(n).fill(0); Object.values(v).forEach(i=>{ if(i>=0&&i<n) c[i]++; }); return c; }
function optsHTML(stepId, k, o={}){
  const q=QMAP[k], d=sd(stepId), st=qState(d,k), tid=stepId+':'+k, n=counts(tid,q.opts.length), tot=n.reduce((a,b)=>a+b,0);
  return `<div class="opts ${o.cols?'c3':''}">${q.opts.map((t,i)=>{
    const right=st.show && i===q.a && !o.mute, wrong=!d.hid && st.a===i && i!==q.a;

    ${st.show && !o.mute && !o.nowhy?`<div class="why">✓ ${emph(q.why)}</div>`:''}`;
}
function bindQ(v){ $$('[data-q]',v).forEach(b=>b.onclick=()=>choose(b.dataset.step, b.dataset.q, +b.dataset.i)); }
const NERVOUS = ['CONFIDENCE LEVEL INCREASING!','MAX IS GETTING NERVOUS!','GRAMMAR POWER: RISING!','CONFIDENCE LEVEL INCREASING!'];
function choose(stepId, k, i){
  const q=QMAP[k], d=sd(stepId); d.a=d.a||{}; d.aw=d.aw||{}; d.hid=false;
  if(d.a[k]===q.a || (d.rv||{})[k]) { d.a[k]=i; save(); draw(); return; }

  else SND.play('no');
  const s=STEPS.find(x=>x.id===stepId); s && s.onAnswer && s.onAnswer(d,k,i);
  save(); draw();
}
function revealQ(stepId,k){ const d=sd(stepId); (d.rv=d.rv||{})[k]=1; d.hid=false; SND.play('reveal'); save(); draw(); }
function liveQ(stepId, k){ const q=QMAP[k], st=qState(sd(stepId),k); return {id:stepId+':'+k, kind:'choice', q:q.q, opts:q.opts, lock:st.done, correct:st.done?q.a:undefined}; }

}
function showGloss(k, el){
  const g=GLOSS[k]; if(!g) return; closePop();
  const p=document.createElement('div'); p.id='pop'; p.setAttribute('role','dialog'); p.setAttribute('aria-label',g.w);
  p.innerHTML=`<button class="btn xs ghost x" aria-label="Close">✕</button><div class="w">${esc(g.w)}</div><p style="margin:6px 0 4px">${esc(g.en)}</p>${ROLE==='teacher'?`<div class="ua tonly">🇺🇦 ${esc(g.ua)}</div>`:''}<div class="row mt" style="gap:8px"><button class="btn xs" data-say>🔊 Listen</button></div>`;
  document.body.appendChild(p);
  const r=el.getBoundingClientRect(), pw=p.offsetWidth, ph=p.offsetHeight;
  let left=Math.min(Math.max(12, r.left+r.width/2-pw/2), innerWidth-pw-12), top=r.bottom+10; if(top+ph>innerHeight-12) top=Math.max(12, r.top-ph-10);
  p.style.left=left+'px'; p.style.top=top+'px';
  $('.x',p).onclick=closePop; $('[data-say]',p).onclick=()=>speak(g.w.replace(/\(.*?\)/,'')+'. '+g.en);
  POPFROM=el; $('.x',p).focus({preventScroll:true});
}
let POPFROM=null;
function closePop(){ const p=$('#pop'); if(p){ p.remove(); if(POPFROM&&document.body.contains(POPFROM)) POPFROM.focus({preventScroll:true}); POPFROM=null; } }
document.addEventListener('click',e=>{ const t=e.target.closest('.tw[data-g]'); if(t){ e.preventDefault(); e.stopPropagation(); showGloss(t.dataset.g,t); return; } if($('#pop') && !e.target.closest('#pop')) closePop(); }, true);
function speak(text){ if(!('speechSynthesis' in window)) return toast('No speech voice in this browser'); speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=.9; speechSynthesis.speak(u); }

/* speaking card (optional discussions) */
function speakHTML(T, d){
  const wall=S.wall[T.id]||[];
  return `<div class="glass pad"><div class="qnum">SPEAKING · DISCUSS IN PAIRS OR AS A CLASS</div><div class="qtext">${emph(T.q)}</div>
    <div class="row">${T.starters.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
    ${d.rv&&!d.hid?`<div class="why mt">💬 <b>Sample:</b> ${emph(T.sample)}</div>`:`<button class="btn sm mt" data-rv>👁 Show sample answer</button>`}
    ${wall.length?`<div class="wall mt">${wall.map(w=>`<div class="it">${esc(w.text)}<small>${esc(w.by||'')}</small></div>`).join('')}</div>`:''}
    <div class="row mt tonly"><input class="field grow" data-wallin="${T.id}" placeholder="Type a student’s answer to show it on the screen…" maxlength="160" style="flex:1;min-width:200px"><button class="btn sm" data-walladd="${T.id}">＋ Show</button></div></div>`;
}

  bindWallAdd(v);
}
function bindWallAdd(v){
  $$('[data-walladd]',v).forEach(b=>{ const id=b.dataset.walladd, inp=$(`[data-wallin="${id}"]`,v);
    const add=()=>{ const t=inp.value.trim(); if(!t) return; (S.wall[id]=S.wall[id]||[]).push({text:t.slice(0,160), by:'from the class'}); save(); draw(); };
    b.onclick=add; inp.onkeydown=e=>{ if(e.key==='Enter') add(); }; });
}

/* team helpers */
const team = id => S.teams.find(t=>t.id===id);
const actTeam = ()=> team(S.at) || S.teams[0];
function award(n, tid){
  if(!S.scoring) return;
  const t=team(tid||S.at)||S.teams[0]; t.score+=n; S.log.push({t:t.id, n}); if(S.log.length>60) S.log.shift();
  SND.play('point'); paintScore(true); pubState(); save();
}
function addTeam(){
  if(S.teams.length>=8) return toast('Up to 8 teams');
  const used=new Set(S.teams.map(t=>t.id)); let n=1; while(used.has('t'+n)) n++;
  const k=S.teams.length; S.teams.push({id:'t'+n, name:TEAM_NAMES[k%8], e:TEAM_EMOJI[k%8], score:0}); save();
}
function wget(tid){ const w=S.work[tid]=S.work[tid]||{people:''}; AUX.forEach(a=>{ w[a]=w[a]||{h:'',c:''}; }); return w; }
const auxRx = a => new RegExp('\\b'+a+'\\b','i');
const PAST_IRR = 'went won saw made took got came ate wrote had was were knew bought ran swam slept woke gave left felt found told said thought brought caught taught drank drove flew forgot sang sat stood spoke wore understood became began broke chose did'.split(' ');
function auxCheck(text, a){
  const t=String(text||'').replace(/’/g,"'");
  if(!t.trim()) return {cls:'', txt:'empty'};
  if(!auxRx(a).test(t)) return {cls:'', txt:'needs '+a.toUpperCase()};
  const m=t.match(new RegExp('\\b'+a+'\\s+([a-z]+)','i')), v=m?m[1].toLowerCase():'';
  if(a==='did' && ((/[a-z]{2,}ed$/.test(v) && !['need','feed','bleed','speed','breed','seed','weed'].includes(v)) || PAST_IRR.includes(v))) return {cls:'', txt:'check: did + base verb'};
  if(a==='does' && /[a-z]{2,}s$/.test(v) && !/(ss|us|is)$/.test(v)) return {cls:'', txt:'check: does + base verb'};
  return {cls:'y', txt:'✓ uses '+a.toUpperCase()};
}

  n:{t:'30 сек', obj:'Celebrate success.', do:['Конфеті, трофей, підсумкові бали. Не затягуйте — далі exit ticket.'], ua:'Ви ЗМОГЛИ! Ви СПРАВДІ знаєте правила! І ваша англійська ТАКИ звучить сильніше!'}
},
{ id:'ticket', sc:7, title:'Exit ticket',
  render:()=>{ const wall=S.wall.ticket||[];
    return head(STEPS[21])+`<div class="split wl"><div class="glass pad"><div class="qnum">EXIT TICKET · COMPLETE THE SENTENCE</div><div class="qtext" style="font-size:clamp(26px,3vw,46px)">${emph('One thing I DO know about myself is…')}</div>
      <div class="col">${TICKET.ex.map(x=>`<div class="chip" style="font-size:clamp(15px,1.2vw,19px);border-radius:14px;padding:8px 14px">“${emph(x)}”</div>`).join('')}</div>
      <div class="row mt tonly"><input class="field grow" data-wallin="ticket" placeholder="Type a student’s sentence to show it…" maxlength="160" style="flex:1;min-width:200px"><button class="btn sm" data-walladd="ticket">＋ Show</button></div></div>
      <div class="col">${cap(['nova',"You DO know more than you think!"])}${wall.length?`<div class="wall">${wall.map(w=>`<div class="it">${emph(w.text.replace(/\b(do|does|did)\b/gi,m=>m.toUpperCase()))}<small>${esc(w.by||'')}</small></div>`).join('')}</div>`:`<p class="muted">Students answer aloud${LIVE.on?' or send from their phones — you choose which to show':''}.</p>`}</div></div>`; },
  after:v=>bindWallAdd(v),
  live:()=>({id:'ticket', kind:'text', q:'Complete: “One thing I DO know about myself is…”', ph:'One thing I DO know about myself is…'}),
  n:{t:'1 хв', obj:'Personal emphatic sentence; check of learning.', do:['Кожен учень каже одне речення (або надсилає з телефона).','У Live: відповіді приходять у панель ліворуч → Show показує на екрані.','Додаткові відповіді — optional.'], ua:'Одне, що я ТОЧНО знаю про себе, — це…'}
},
{ id:'bye', sc:7, title:'See you next episode',
  render:()=>`<div class="title-scr"><div><div class="cast">${['max','nova','beep'].map((k,i)=>`<div class="one">${av(k,130,k==='max'?'defeated':undefined)}<b class="nm k-${k}">${CH[k].name}</b></div>`).join('')}</div>
    <h2 class="h-l goldtxt">${esc(BYE[0])}</h2>
    <p class="lead mt" style="margin:14px auto 0">${emph(BYE[1].replace(/\b(do|does|did)\b/gi,m=>m.toUpperCase()))}</p>
    <p class="lead" style="margin:10px auto 0">${esc(BYE[2])}</p>
    <p class="h-m mt2 grad">${esc(BYE[3])}</p>
    <div class="row mt2" style="justify-content:center"><a class="btn tonly" href="../../">← Back to the course</a><a class="btn" href="${esc(CFG.GRAMMAR_LINK||'../../#grammar?topic=emphatic-do')}" target="_blank" rel="noopener">📘 Practise: emphatic do</a></div></div></div>`,
  n:{t:'20 сек', obj:'Close the lesson.', do:['Підсумок одним реченням: “Today we used DO, DOES and DID to make our sentences stronger.”','У Live: 📡 → Stop room, щоб телефони побачили фінальний екран.']}
}
];
</script>

<script>
/* ---------- 5 · engine ---------- */
let CTX = {entering:true, prevP:-1};
let LAST = {id:null, p:-1}, GATE = null;
const cur = ()=> STEPS[S.i] || STEPS[0];
const parts = s => typeof s.parts==='function' ? s.parts() : (s.parts||1);
const visible = k => !!STEPS[k] && !(S.core && STEPS[k].opt);
const typing = ()=> !!(document.activeElement && document.activeElement.closest && document.activeElement.closest('input,textarea,select'));
if(S.i>=STEPS.length) S.i=0;

function draw(){
  if(ROLE!=='teacher') return;
  const s=cur(), d=sd(s.id);
  if((d.p||0)>parts(s)-1) d.p=parts(s)-1;
  const entering = LAST.id!==s.id;
  CTX = {entering, prevP: entering?-1:LAST.p};
  document.body.dataset.sc = s.sc;
  document.body.classList.toggle('champ', s.atm==='champ');
  closePop();
  const v=$('#view'), fid=document.activeElement && document.activeElement.id;
  v.innerHTML = s.render(d);
  if(entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0,0); }
  $$('[data-next]',v).forEach(b=>b.onclick=next);
  s.after && s.after(v,d);
  if(fid && !entering){ const f=document.getElementById(fid); if(f && v.contains(f)) f.focus({preventScroll:true}); }
  LAST={id:s.id, p:d.p||0};
  paintChrome(); pubState(); if($('#notes').classList.contains('on')) paintNotes(); TMR.paint(); save();
}
function next(){
  const s=cur(), d=sd(s.id), P=parts(s), p=d.p||0;
  if(s.ready && !s.ready(d)){ const g=s.id+':'+p; if(GATE!==g){ GATE=g; toast(s.gateMsg||'Not answered yet — press Next again to continue'); return; } }
  GATE=null;
  if(p<P-1){ d.p=p+1; s.onPart&&s.onPart(d); save(); draw(); return; }
  let k=S.i+1; while(k<STEPS.length && !visible(k)) k++;
  if(k<STEPS.length) go(k); else toast('That’s the end of the episode! 🎤');
}
function back(){
  const d=sd(cur().id); GATE=null;
  if((d.p||0)>0){ d.p--; save(); draw(); return; }
  let k=S.i-1; while(k>=0 && !visible(k)) k--; if(k>=0) go(k);
}
function go(k){ if(!STEPS[k]) return; if(WSPIN && STEPS[k].id!=='wheel') finishSpin(true); S.i=k; GATE=null; save(); draw(); }
function goScene(n){ const k=STEPS.findIndex((x,i)=>x.sc===n && visible(i)); if(k>=0) go(k); }
function reveal(){ const s=cur(), d=sd(s.id); if(s.reveal){ s.reveal(d); d.hid=false; } else if(parts(s)>1){ d.p=parts(s)-1; s.onPart&&s.onPart(d); } else return; SND.play('reveal'); save(); draw(); }
function hideAns(){ const s=cur(), d=sd(s.id); if(s.hide) s.hide(d); else d.hid=true; save(); draw(); toast('Answers hidden on this screen'); }
function restartAct(){ const s=cur(); if(s.restartAct) s.restartAct(sd(s.id)); else { S.d[s.id]={}; Object.keys(S.votes).forEach(k=>{ if(k===s.id||k.startsWith(s.id+':')) delete S.votes[k]; }); }
  save(); draw(); toast('Activity restarted — scores are kept'); }
function skipAct(){ let k=S.i+1; while(k<STEPS.length && !visible(k)) k++; if(k<STEPS.length){ go(k); toast('Activity skipped'); } }

function buildRail(){ $('#rail').innerHTML=SCENES.map(sc=>`<button data-sc="${sc.n}" aria-label="${sc.k}: ${sc.t}"><span class="k">${sc.k}</span><span class="t">${sc.t}</span></button>`).join(''); $$('#rail button').forEach(b=>b.onclick=()=>goScene(+b.dataset.sc)); }
function paintChrome(){
  const s=cur(), d=sd(s.id), P=parts(s);
  $$('#rail button').forEach(b=>{ const n=+b.dataset.sc; b.classList.toggle('cur',n===s.sc); b.classList.toggle('done',n<s.sc); if(n===s.sc) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  const sc=SCENES[s.sc-1];
  $('#info').innerHTML=`<b>${sc.k}</b> · ${esc(s.title)}${P>1?` (${(d.p||0)+1}/${P})`:''}${s.opt?' · optional':''}`;
  $('#bBack').disabled = S.i===0 && !(d.p>0);
  $('#bReveal').disabled = !(s.reveal || P>1);
  $('#bHide').disabled = !(s.reveal || s.hide);
  $('#bNext').innerHTML = S.i===STEPS.length-1 ? 'Finish 🎤' : 'Next ▶';
  $('#bLive').classList.toggle('on', LIVE.on);
  $('#bQuick').classList.toggle('on', S.core); $('#bQuick').setAttribute('aria-pressed',String(S.core));
  $('#bSound').textContent = S.sound?'🔊':'🔇'; $('#bSound').setAttribute('aria-pressed',String(S.sound));
  paintScore();
}
function paintScore(bump){
  const t=actTeam(), b=$('#score'); if(!b) return;
  b.classList.toggle('off', !S.scoring);
  b.innerHTML=`<img src="${esc(PH.beep||'')}" alt="" onerror="this.remove()"><span class="tn">${t.e} ${esc(t.name)}</span><span class="pts ${bump?'bump':''}">${S.scoring?t.score:'—'}</span>${S.teams.length>1?`<span class="small">+${S.teams.length-1}</span>`:''}`;
  b.setAttribute('aria-label',`Scoreboard: ${t.name} ${t.score} points. Click to manage teams.`);
}

/* ---------- timer (advisory only — never changes the screen by itself) ---------- */
const TMR = {
  left(){ const t=S.tmr; return t.run ? Math.max(0,(t.end-Date.now())/1000) : t.left; },
  run(){ return !!S.tmr.run; },
  set(sec){ S.tmr={dur:sec, left:sec, run:false, end:0}; save(); this.paint(); pubState(); },
  start(){ const t=S.tmr; if(t.left<=0) t.left=t.dur; t.end=Date.now()+t.left*1000; t.run=true; save(); this.paint(); pubState(); },
  pause(){ const t=S.tmr; t.left=this.left(); t.run=false; save(); this.paint(); pubState(); },
  toggle(){ this.run()?this.pause():this.start(); },
  add(sec){ const t=S.tmr; if(t.run) t.end+=sec*1000; else t.left+=sec; t.dur=Math.max(t.dur,t.left); save(); this.paint(); pubState(); },
  tick(){ const t=S.tmr; if(t.run && Date.now()>=t.end){ t.run=false; t.left=0; save(); SND.play('buzz'); toast('⏰ Time is up — continue when you’re ready.'); pubState(); if(!typing()) draw(); } this.paint(); },
  paint(){ const l=this.left(); $$('[data-clock]').forEach(e=>{ e.textContent=mmss(l); e.classList.toggle('low',l<=60&&l>0); e.classList.toggle('out',l<=0); }); }
};

/* ---------- sound (Web Audio, muted by default) ---------- */
const SND = {
  ctx:null,
  ac(){ if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f, dur=.15, type='sine', vol=.12, delay=0, f2){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); },
  noise(dur=.3, vol=.08, delay=0, hp=800){ const a=this.ac(); if(!a) return; const t=a.currentTime+delay, n=a.sampleRate*dur, b=a.createBuffer(1,n,a.sampleRate), ch=b.getChannelData(0);
    for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=b; f.type='highpass'; f.frequency.value=hp; g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(t); },
  play(k){ if(!S.sound || ROLE!=='teacher') return; try{
    if(k==='ok'){ this.tone(660,.12,'triangle',.14); this.tone(990,.2,'triangle',.14,.1); }
    else if(k==='no'){ this.tone(220,.22,'sawtooth',.06,0,160); }
    else if(k==='tick'){ this.tone(1800,.03,'square',.04); }
    else if(k==='reveal'){ [523,659,784].forEach((f,i)=>this.tone(f,.35,'triangle',.08,i*.04)); }
    else if(k==='point'){ this.tone(1320,.08,'square',.05); this.tone(1760,.16,'square',.05,.07); }
    else if(k==='unlock'){ this.tone(400,.25,'sine',.1,0,1200); this.tone(1200,.2,'triangle',.08,.2); }
    else if(k==='whoosh'){ this.noise(.6,.09,0,500); }
    else if(k==='buzz'){ this.tone(150,.5,'square',.05); }
    else if(k==='drum'){ for(let i=0;i<12;i++) this.noise(.06,.06+i*.004,i*.1,200); }
    else if(k==='win'){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.4,'triangle',.1,i*.11)); this.noise(1.2,.05,.4,2000); }
  }catch(e){} }
};

/* ---------- show effects ---------- */
function lights(){ document.body.classList.remove('lit'); void document.body.offsetWidth; document.body.classList.add('lit'); setTimeout(()=>document.body.classList.remove('lit'),1300); }
let BEEPT=null;
function beep(msg){ const b=$('#beep'); if(!b) return; $('img',b).src=PH.beep||''; $('span',b).textContent=msg; b.classList.add('on'); clearTimeout(BEEPT); BEEPT=setTimeout(()=>b.classList.remove('on'),2800); }
function confetti(){
  if(S.noanim || REDUCED_OS) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#FFC94D','#3FE6FF','#FF3FD0','#8B5CFF','#35F0A1','#fff'];
  const P=Array.from({length:180},()=>({x:innerWidth/2+(Math.random()-.5)*200, y:innerHeight*.35, vx:(Math.random()-.5)*18, vy:-Math.random()*16-4, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function fr(t){ const el=t-t0; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.vy+=.45; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.globalAlpha=Math.max(0,1-el/2600); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(el<2600) requestAnimationFrame(fr); else x.clearRect(0,0,c.width,c.height); })(t0);
}
function startDrum(d){
  d.drum=1; SND.play('drum'); save(); draw();
  setTimeout(()=>{ d.drum=0; d.done=1; SND.play('win'); save(); if(cur().id==='final') draw(); else pubState(); confettiSmall(); }, (S.noanim||REDUCED_OS)?200:1500);
}
function confettiSmall(){ if(cur().id==='final') confetti(); }
function copyText(t,msg){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>{ openModal(`<h2 class="h-m">Copy this text</h2><textarea class="field mt" style="min-height:240px" readonly>${esc(t)}</textarea><div class="row mt"><button class="btn" data-close>Close</button></div>`); $('[data-close]','#modalBox').onclick=closeModal; }); }

/* ---------- wheel ---------- */
let WSPIN=null;
function wheelSVG(rot){
  const R=200, W=S.wheel; let g='';
  SECTORS.forEach((s,i)=>{ const a0=(i*45-90)*Math.PI/180, a1=((i+1)*45-90)*Math.PI/180, mid=i*45+22.5;
    const x0=(R*Math.cos(a0)).toFixed(2), y0=(R*Math.sin(a0)).toFixed(2), x1=(R*Math.cos(a1)).toFixed(2), y1=(R*Math.sin(a1)).toFixed(2);
    const words=s.t.split(' ');
    g+=`<g class="sec ${W.used.includes(i)&&W.sel!==i&&!(WSPIN&&WSPIN.sel===i)?'used':''} ${W.sel===i&&!WSPIN?'win':''}">
      <path class="sl" d="M0 0L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" fill="${s.col}" stroke="#0B0A26" stroke-width="3"/>
      <g transform="rotate(${mid})">
        <svg class="ico" x="-13" y="${-R+12}" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${s.ink}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${ICON[s.i]}</svg>
        <text transform="translate(0 ${-R*0.56}) rotate(${mid>180?90:-90})" text-anchor="middle" fill="${s.ink}" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="${words.length>1?13:15}" letter-spacing=".6">${words.length>1?`<tspan x="0" dy="-3">${words[0]}</tspan><tspan x="0" dy="15">${words[1]}</tspan>`:`<tspan x="0" dy="5">${s.t}</tspan>`}</text>
      </g></g>`; });
  let bulbs=''; for(let i=0;i<24;i++){ const a=(i*15)*Math.PI/180; bulbs+=`<circle class="bulb" cx="${(208*Math.cos(a)).toFixed(1)}" cy="${(208*Math.sin(a)).toFixed(1)}" r="3.6" fill="#FFE7A3"/>`; }
  return `<svg class="wheel" viewBox="-216 -216 432 432" role="img" aria-label="The Confidence Wheel with 8 challenges">
    <circle r="214" fill="#120A30"/><circle r="208" fill="none" stroke="#FFC94D" stroke-width="5"/>
    <g id="wrot" transform="rotate(${rot})">${g}</g><g>${bulbs}</g></svg>`;
}
const POINTER = `<svg class="pointer" viewBox="0 0 60 70" aria-hidden="true"><path d="M30 68 L4 12 A28 28 0 0 1 56 12 Z" fill="#FFC94D" stroke="#7A4A05" stroke-width="3"/><circle cx="30" cy="20" r="8" fill="#FFF3C4"/></svg>`;
function wheelZone(){
  const W=S.wheel, left=8-W.used.length, sug=S.core?'3':'4–5';
  return `<div class="wheel-zone"><div>
    <div class="wheel-box"><div class="rimglow"></div>${wheelSVG(W.rot)}${POINTER}<button class="hub" id="wHub" ${WSPIN||!left?'disabled':''} aria-label="Spin the wheel">${WSPIN?'…':'SPIN'}</button></div>
    <div class="wctl"><button class="btn big gold" id="wSpin" ${WSPIN||!left?'disabled':''}>🎡 SPIN THE WHEEL</button>
      ${WSPIN?'<button class="btn sm" id="wSkipAnim">⏩ Skip animation</button>':''}
      <button class="btn sm ghost tonly" id="wReset">⟲ Reset wheel</button>
      ${LIVE.on?`<button class="btn sm ghost tonly" id="wAllow">${W.allow?'🙅 Cancel student spin':'🎯 Let a student spin'}</button>`:''}</div>
    <div class="wstat">Spins: <b>${W.spins}</b> · Challenges left: <b>${left}/8</b> · Suggested: ${sug} spins${W.allow?` · <span style="color:var(--cyan)">🎯 ${esc(NAMES[W.allow]||'a student')} can spin from their phone</span>`:''}</div></div>
    <div id="chalBox">${chalHTML()}</div></div>`;
}
function chalHTML(){
  const W=S.wheel;
  if(WSPIN) return `<div class="wait-card"><div class="h-m">🎡 Spinning…</div><p class="mt">MAX is choosing his next accusation!</p><button class="btn sm mt" id="wSkipAnim2">⏩ Skip animation</button></div>`;
  if(W.sel==null) return `<div class="wait-card">${av('max',110)}<p class="h-s mt" style="color:var(--text)">${W.used.length>=8?'All 8 challenges are done! 🎉':'Spin the wheel to get MAX’s next accusation!'}</p>
    <p class="mt">${W.used.length>=8?'Reset the wheel to play again.':'Defend yourself with <span class="pw">DO</span>, <span class="pw">DOES</span> or <span class="pw">DID</span> — and add one detail.'}</p></div>`;
  const s=SECTORS[W.sel], hid=sd('wheel').hid;
  return `<div class="chal" style="--sc:${s.col}"><span class="sect">${ico(s.i,s.ink)} ${s.t}</span>
    <div class="acc">${av('max',90)}<div><span class="nm k-max">MAX</span><br><q>${esc(s.acc)}</q></div></div>
    <div class="mis">🎯 ${emph(s.mis)}</div><span class="gram">${esc(s.g)}</span>
    ${s.alt?`<div class="small mt">💡 Not true for you? Don’t say something false — ${emph(s.alt.replace(/^.*?Then: /,'agree, then add something true: '))}</div>`:''}
    ${s.bonus?`<div class="small mt">⭐ ${esc(s.bonus)}</div>`:''}
    ${(S.wall['wheel:'+W.spins]||[]).map(w=>`<div class="why" style="background:rgba(63,230,255,.08);border-color:rgba(63,230,255,.4)">📱 “${emph(w.text)}” <span class="small">— ${esc(w.by||'')}</span></div>`).join('')}
    ${W.sample&&!hid?`<div class="smp"><small>Sample answer</small>${emph(s.sample)}${s.alt?`<span class="alt">${emph(s.alt)}</span>`:''}</div>`:''}
    <div class="who-row"><span class="small">Answering:</span>${S.teams.length>1?S.teams.map(t=>`<button class="chip ${t.id===S.at?'on':''}" data-wt="${t.id}">${t.e} ${esc(t.name)}</button>`).join(''):''}
      <input class="field" id="wWho" style="max-width:220px;padding:6px 10px;font-size:15px" placeholder="Student name (optional)" value="${esc(W.who||'')}" maxlength="24" aria-label="Who is answering"></div>
    <div class="acts">
      <button class="btn sm" id="wSample">${W.sample&&!hid?'🙈 HIDE ANSWER':'👁 SHOW SAMPLE ANSWER'}</button>
      <button class="btn sm ok" id="wAward">✓ AWARD +10</button><button class="btn sm" id="wBonus">⭐ BONUS +5</button>
      <button class="btn sm ghost" id="wTm" title="Response timer (optional)">⏱ <span class="tm" data-clock>${mmss(TMR.left())}</span> ${TMR.run()?'❚❚':'▶'}</button>
      <button class="btn sm gold" id="wAgain" ${W.used.length>=8?'disabled':''}>🎡 SPIN AGAIN</button>
      <button class="btn sm ghost" id="wSkipC">⏭ SKIP CHALLENGE</button></div></div>`;
}
function bindWheel(v){
  const on=(id,f)=>{ const e=$('#'+id,v); if(e) e.onclick=f; };
  on('wSpin',spin); on('wHub',spin); on('wAgain',spin); on('wSkipAnim',()=>finishSpin()); on('wSkipAnim2',()=>finishSpin());
  on('wReset',()=>{ if(S.wheel.used.length && !confirm('Reset the wheel? All 8 challenges become available again. Scores are kept.')) return; resetWheel(); });
  on('wSample',()=>{ const d=sd('wheel'); if(S.wheel.sample&&!d.hid){ S.wheel.sample=false; } else { S.wheel.sample=true; d.hid=false; SND.play('reveal'); } save(); draw(); });
  on('wAward',()=>{ award(10); toast(`+10 → ${actTeam().name}${S.wheel.who?' ('+S.wheel.who+')':''}`); beep(S.wheel.spins===3?'MAX IS GETTING NERVOUS!':'CONFIDENCE LEVEL INCREASING!'); });
  on('wBonus',()=>{ award(5); toast(`⭐ +5 bonus → ${actTeam().name}`); });
  on('wTm',()=>{ if(TMR.left()<=0) TMR.set(45); TMR.toggle(); draw(); });
  on('wSkipC',()=>{ S.wheel.sel=null; S.wheel.sample=false; save(); draw(); toast('Challenge skipped'); });
  on('wAllow',()=>{ if(S.wheel.allow){ S.wheel.allow=''; save(); draw(); return; } pickStudent(id=>{ S.wheel.allow=id; S.wheel.who=NAMES[id]||''; save(); draw(); toast('That student can now spin from their phone'); }); });
  $$('[data-wt]',v).forEach(b=>b.onclick=()=>{ S.at=b.dataset.wt; save(); draw(); });
  const w=$('#wWho',v); if(w) w.oninput=()=>{ S.wheel.who=w.value; save(); };
  if(WSPIN) requestAnimationFrame(animWheel);
}
function pickSector(){ const free=[...Array(8).keys()].filter(i=>!S.wheel.used.includes(i)); return free.length ? free[Math.floor(Math.random()*free.length)] : -1; }
function spin(){
  if(WSPIN) return; const sel=pickSector(); if(sel<0) return toast('All 8 challenges used — reset the wheel');
  const W=S.wheel, from=((W.rot%360)+360)%360, mid=sel*45+22.5, jitter=Math.random()*28-14;
  const target=(((-(mid+jitter))%360)+360)%360;
  let to=from+360*5+((target-from+360)%360);
  const dur=(S.noanim||REDUCED_OS)?500:4300;
  W.rot=from; W.sel=null; W.sample=false; W.used.push(sel); W.spins++; W.allow='';
  W.spinning={id:uid(), from, to, dur};
  sd('wheel').hid=false;
  WSPIN={from, to, start:performance.now(), dur, sel, lastSec:Math.floor(from/45)};
  SND.play('whoosh'); save(); draw(); pubState();
}
function animWheel(){
  if(!WSPIN) return; cancelAnimationFrame(WSPIN.raf);
  const t=Math.min(1,(performance.now()-WSPIN.start)/WSPIN.dur), e=1-Math.pow(1-t,4), rot=WSPIN.from+(WSPIN.to-WSPIN.from)*e;
  const g=$('#wrot'); if(g) g.setAttribute('transform',`rotate(${rot.toFixed(2)})`);
  const sec=Math.floor(rot/45); if(sec!==WSPIN.lastSec){ WSPIN.lastSec=sec; SND.play('tick'); const p=$('.wheel-box .pointer'); if(p){ p.classList.remove('tick'); void p.getBoundingClientRect(); p.classList.add('tick'); } }
  if(t<1) WSPIN.raf=requestAnimationFrame(animWheel); else finishSpin();
}
function finishSpin(silent){
  if(!WSPIN) return; cancelAnimationFrame(WSPIN.raf);
  const W=S.wheel; W.rot=((WSPIN.to%360)+360)%360; W.sel=WSPIN.sel; W.spinning=null; WSPIN=null;
  if(!silent){ SND.play('reveal'); TMR.set(45); if(W.spins===4) beep('MAX IS GETTING NERVOUS!'); }
  save(); if(!silent && cur().id==='wheel') draw(); pubState();
}
function resetWheel(quiet){ if(WSPIN) finishSpin(true); S.wheel=Object.assign(FRESH().wheel,{rot:S.wheel.rot}); sd('wheel').hid=false; save(); draw(); if(!quiet) toast('Wheel reset — all 8 challenges are back'); }
function wheelTask(){
  const W=S.wheel, s=W.sel!=null?SECTORS[W.sel]:null, hid=sd('wheel').hid;
  return {id:'wheel:'+W.spins, kind:'wheel', rot:W.rot, spin:W.spinning, used:W.used.length, allow:W.allow||'',
    card: s && !WSPIN ? {t:s.t, col:s.col, ink:s.ink, acc:s.acc, mis:s.mis, g:s.g, alt:s.alt||'', sample:(W.sample&&!hid)?s.sample:null} : null};
}

<script>
/* ---------- 7 · live room ----------
   Учитель — єдине джерело стану. Захист керування (як в уроках 13–21):
   • кожне повідомлення вчителя ПІДПИСАНЕ (ECDSA P-256, WebCrypto); приватний ключ лишається лише в браузері вчителя;
   • посилання / QR для учнів містить відбиток (fingerprint) публічного ключа; при ручному вході — код кімнати + 6 символів ключа;
     телефон приймає стан і завдання ЛИШЕ з правильним підписом, тож учень не може «стати вчителем»;
   • учні надсилають тільки hello / ans / work / submit / spin / react; учитель перевіряє кожне (поточне завдання, межі, довжину);
     бали, Reveal, сцену й колесо змінює тільки вчитель; spin приймається лише від учня, якому вчитель дозволив;
   • правильні відповіді й sample answers доходять на телефони лише після Reveal; один голос на телефон, лише нік. */
const configured = ()=> /^https:\/\/[a-z0-9-]+\.supabase\.co/i.test((CFG.SUPABASE_URL||'').trim()) && !!(CFG.SUPABASE_KEY||'').trim();
const LIVE = {on:false, peers:[]};
const WALLQ = [], NAMES = {};
const AVATARS = ['🦊','🐼','🐯','🐸','🦉','🐙','🦄','🐺','🐧','🚀','🎧','⚡'];
function studentsN(){ return (LIVE.peers||[]).filter(p=>p&&p.role==='student').length; }
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const hexOf = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const canSign = ()=> !!(window.crypto && crypto.subtle && window.isSecureContext!==false);
async function fpOf(pk){ const h=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('P256.'+pk.x+'.'+pk.y)); return hexOf(h).slice(0,20); }
const TKEY = { ok:false, priv:null, pub:null, fp:'',
  async init(){
    if(this.ok) return true; if(!canSign()) return false;
    try{ let st=null; try{ st=JSON.parse(localStorage.getItem('lesson22-tkey')||'null'); }catch(e){}
      if(st && st.priv && st.pub){ this.priv=await crypto.subtle.importKey('jwk',st.priv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']); this.pub=st.pub; }
      else { const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
        const priv=await crypto.subtle.exportKey('jwk',kp.privateKey), pub=await crypto.subtle.exportKey('jwk',kp.publicKey);
        this.priv=kp.privateKey; this.pub={x:pub.x, y:pub.y}; try{ localStorage.setItem('lesson22-tkey',JSON.stringify({priv, pub:this.pub})); }catch(e){} }
      this.fp=await fpOf(this.pub); this.ok=true; return true; }catch(e){ console.warn('Signing unavailable:', e); return false; }
  },
  async sign(str){ return b64(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'}, this.priv, new TextEncoder().encode(str))); }
};
const shortKey = ()=> TKEY.fp ? TKEY.fp.slice(0,6).toUpperCase() : '';
const Net = {
  kind:null, status:'off', ch:null, sb:null, bc:null, me:null, peers:{}, hb:null, prune:null,
  setStatus(s){ this.status=s; this.onStatus && this.onStatus(s); },
  async connect(o){
    this.stop();
    let sid=null; try{ sid=o.role==='student' && sessionStorage.getItem('l22sid'); }catch(e){}
    this.me={id:o.id || sid || uid(), name:o.name||'', role:o.role, av:o.av||''};
    if(o.role==='student') try{ sessionStorage.setItem('l22sid', this.me.id); }catch(e){}
    this.onEvent=o.onEvent; this.onPeers=o.onPeers||(()=>{}); this.onStatus=o.onStatus||(()=>{});
    this.setStatus('connecting');
    if(configured()){
      try{
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');

    if(T2.kind==='choice'){
      const my=sent[T2.id], dec=T2.chosen!=null;
      B.innerHTML=hd+`<div class="stu-card"><p style="font-size:20px;font-weight:800">${emph(T2.q)}</p><div class="opts">${T2.opts.map((o,i)=>`<button class="opt ${dec&&T2.chosen===i?'right':T2.lock&&T2.correct===i?'right':my===i?(T2.lock&&T2.correct!=null?'wrong':'pick'):''}" data-i="${i}"><span class="L">${LET[i]}</span><span>${emph(o)}</span></button>`).join('')}</div>
        <p class="small mt">${dec?`The class chose ${LET[T2.chosen]}. Look at the main screen.`:T2.lock?(T2.correct==null?'✓ Voting closed.':my===T2.correct?'🎉 Correct!':'✓ The answer is on the main screen.'):my!==undefined?'✓ Sent! You can change your answer.':'Tap your answer.'}</p></div>`;
      $$('[data-i]',B).forEach(b=>b.onclick=()=>{ if(T2.lock) return; sent[T2.id]=+b.dataset.i; Net.send({t:'ans', task:T2.id, v:+b.dataset.i}); render(); });
      return;
    }
    if(T2.kind==='text'){
      B.innerHTML=hd+`<div class="stu-card"><p style="font-size:20px;font-weight:800">${emph(T2.q)}</p><textarea id="tx" maxlength="160" placeholder="${esc(T2.ph||'')}"></textarea><button class="btn primary mt" id="sd" style="width:100%">Send</button>
        <p class="small mt">${sent[T2.id]?'✓ Sent: “'+esc(sent[T2.id])+'”. You can send a new version.':'You can also answer out loud in Zoom. The host may show your answer on the screen.'}</p></div>`;
      $('#sd').onclick=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T2.id]=v; Net.send({t:'ans', task:T2.id, v}); render(); };
      return;
    }
    if(T2.kind==='wheel'){
      const c=T2.card, mine=T2.allow && Net.me && T2.allow===Net.me.id;
      B.innerHTML=hd+`<div class="stu-card"><div class="stu-wheel">${wheelSVG(T2.rot)}${POINTER.replace('class="pointer"','class="pointer" style="position:absolute;left:50%;top:-4%;width:12%;transform:translateX(-50%)"')}</div>
        ${mine&&!T2.spin?`<button class="btn big gold mt" id="sspin" style="width:100%">🎡 SPIN THE WHEEL</button>`:''}
        ${c?`<div class="chal mt" style="--sc:${c.col}"><span class="sect">${esc(c.t)}</span><p style="font-size:19px;font-weight:800;margin-top:10px">MAX: “${esc(c.acc)}”</p><div class="mis">🎯 ${emph(c.mis)}</div>
          ${c.alt?`<p class="small mt">💡 Not true for you? Agree — then say something true with DO / DID.</p>`:''}
          ${c.sample?`<div class="smp"><small>Sample answer</small>${emph(c.sample)}</div>`:''}
          <label for="tx" class="small" style="display:block;margin-top:10px">Your answer (optional)</label><textarea id="tx" maxlength="160" placeholder="I DO… / My friend DOES… / I DID…"></textarea>
          <button class="btn primary mt" id="sd" style="width:100%">Send to the host</button><p class="small mt">${sent[T2.id]?'✓ Sent: “'+esc(sent[T2.id])+'”':'Or answer out loud in Zoom!'}</p></div>`
        :`<p class="small mt center">${T2.spin?'🎡 Spinning…':'Waiting for the next spin…'}</p>`}</div>`;
      const ss=$('#sspin',B); if(ss) ss.onclick=()=>{ Net.send({t:'spin'}); ss.disabled=true; ss.textContent='🎡 …'; };
      const sdb=$('#sd',B); if(sdb) sdb.onclick=()=>{ const v=$('#tx').value.trim(); if(!v) return; sent[T2.id]=v; Net.send({t:'ans', task:T2.id, v}); render(); };
      wheelSync();
      return;
    }
    if(T2.kind==='show'){ B.innerHTML=hd+`<div class="stu-card stu-wait"><div class="bigi">${esc(T2.e||'🎤')}</div><p><b>${esc(T2.team)}</b> is on stage!</p><p class="small">Watch the main screen and listen. 👏</p></div>`; return; }
    if(T2.kind==='team'){
      const t=(T2.teams||[]).find(x=>x.L===myTeam);
      if(!t){ B.innerHTML=hd+`<div class="stu-card"><p style="font-size:20px;font-weight:800">🎬 Which team are you in?</p><p class="small">Your teacher tells you your team.</p><div class="opts">${T2.teams.map(x=>`<button class="opt" data-tm="${x.L}"><span class="L">${x.e}</span><span>${esc(x.name)}</span></button>`).join('')}</div></div>`;
        $$('[data-tm]',B).forEach(b=>b.onclick=()=>{ myTeam=b.dataset.tm; try{ localStorage.setItem('l22team-'+room,myTeam); }catch(e){} render(); }); return; }
      const w=(T2.work||{})[myTeam]||{}, sub=(T2.sub||{})[myTeam];
      B.innerHTML=hd+`<div class="stu-card"><div class="row"><span style="font-size:30px">${t.e}</span><div class="grow"><b style="font-size:19px">${esc(t.name)}</b><div class="small" id="stuT"></div></div><button class="btn xs ghost" id="chg">change team</button></div>
        <p class="small mt"><b>CREATE YOUR OWN MINI GAME SHOW!</b> One challenge with DO, one with DOES, one with DID. Your team sees the same cards.</p>
        <label for="pp">Names (optional)</label><input id="pp" data-tf="people" maxlength="80" value="${esc(w.people||'')}">
        ${AUX.map((a,i)=>`<div class="cc"><div class="lab">CHALLENGE · ${a.toUpperCase()}</div><label for="h-${a}">🎙️ Host’s silly accusation</label><textarea id="h-${a}" data-tf="${a}|h" maxlength="140" placeholder="${esc(EXAMPLE.items[i].h)}">${esc((w[a]||{}).h||'')}</textarea>
          <label for="c-${a}">💪 Confident answer with ${a.toUpperCase()}</label><textarea id="c-${a}" data-tf="${a}|c" maxlength="140" placeholder="${esc(EXAMPLE.items[i].c)}">${esc((w[a]||{}).c||'')}</textarea></div>`).join('')}
        <button class="btn primary mt" id="sbm" style="width:100%">${sub?'✓ Ready — you can still edit':'📤 We’re ready!'}</button>
        <p class="small mt" id="ok">Saves automatically.</p></div>`;
      paintT();
      $('#chg').onclick=()=>{ myTeam=''; try{ localStorage.removeItem('l22team-'+room); }catch(e){} render(); };
      const sendAll=()=>$$('[data-tf]',B).forEach(ta=>Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,140)}));
      $('#sbm').onclick=()=>{ sendAll(); setTimeout(()=>Net.send({t:'submit', team:myTeam}),300); $('#sbm').textContent='✓ Ready — you can still edit'; };
      $$('[data-tf]',B).forEach(ta=>{ let tm=null; ta.oninput=()=>{ $('#ok').textContent='…'; clearTimeout(tm); tm=setTimeout(()=>{ Net.send({t:'work', team:myTeam, f:ta.dataset.tf, v:ta.value.slice(0,140)}); $('#ok').textContent='✓ Saved — your team and the host can see it.'; },600); }; });
      return;
    }
  };
  if(room && name && (key.length>=6 || !canSign())) join(); else ask();
}

/* ---------- init ---------- */
document.addEventListener('keydown',e=>{
  if(ROLE!=='teacher') return;
  if(e.key==='Escape'){ if($('#pop')) return closePop(); if(!$('#modal').classList.contains('hidden')) return closeModal(); if($('#notes').classList.contains('on')) return toggleNotes(false); }
  if(typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if(!$('#modal').classList.contains('hidden')) return;
  const tag=document.activeElement && document.activeElement.tagName;
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && tag!=='BUTTON' && tag!=='A')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); back(); }
  else if(e.key==='r'||e.key==='R') reveal();
  else if(e.key==='h'||e.key==='H') hideAns();
  else if(e.key==='t'||e.key==='T') toggleNotes();
  else if(e.key==='n'||e.key==='N') openNav();
  else if(e.key==='p'||e.key==='P') present();
});
if(ROLE==='student'){ studentApp(); }
else {
  applyAnim(); buildRail();
  $('#bNext').onclick=next; $('#bBack').onclick=back; $('#bReveal').onclick=reveal; $('#bHide').onclick=hideAns; $('#bSkip').onclick=skipAct; $('#bRestartAct').onclick=restartAct;
  $('#bNotes').onclick=()=>toggleNotes(); $('#notesX').onclick=()=>toggleNotes(false); $('#bNav').onclick=openNav;
  $('#bLive').onclick=openLive; $('#bPresent').onclick=present; $('#dockMin').onclick=()=>$('#dock').classList.toggle('min');
  $('#bQuick').onclick=()=>setQuick(!S.core); $('#score').onclick=openTeams;
  $('#bSound').onclick=()=>{ S.sound=!S.sound; save(); paintChrome(); if(S.sound){ SND.play('ok'); toast('🔊 Sound effects ON'); } else toast('🔇 Sound effects OFF'); };
  setInterval(()=>TMR.tick(),500);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('present')){ document.body.classList.remove('present'); $('#bPresent').classList.remove('on'); } });
  draw();
  if(S.live) startLive(true);
}
</script>
